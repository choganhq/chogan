<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>چوگان — گزارش</title>
<!-- One self-contained file (#757): no fonts, scripts or images from anywhere else,
     no cookies, no analytics. The Worker that serves it checks everything again. -->
<style>
:root {
  --bg: #f6f4ef; --card: #ffffff; --ink: #1d1f22; --dim: #5d6168; --line: #d9d5cc;
  --accent: #0f6b5c; --accent-ink: #ffffff; --err: #b3261e; --err-bg: #fdecea; --ok-bg: #e5f4ef;
  --focus: #1a73e8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a; --card: #1f2226; --ink: #eceae6; --dim: #a7abb2; --line: #363a40;
    --accent: #5fc3ad; --accent-ink: #0b1f1b; --err: #ffb4ab; --err-bg: #3b1e1c; --ok-bg: #173229;
    --focus: #8ab4f8;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Vazirmatn", Tahoma, "Noto Sans", sans-serif;
}
main { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 8px 0 16px; }
h1 { font-size: 1.4rem; margin: 0; line-height: 1.3; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.note { color: var(--dim); font-size: .92rem; margin: 0 0 16px; }
.warn { background: var(--ok-bg); border-radius: 10px; padding: 10px 12px; font-size: .92rem; margin: 0 0 16px; }
label, legend { display: block; font-weight: 600; margin: 0 0 6px; }
.field { margin: 0 0 18px; }
.hint { display: block; color: var(--dim); font-size: .85rem; font-weight: 400; margin-top: 4px; }
fieldset { border: 0; padding: 0; margin: 0 0 18px; min-width: 0; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg label { font-weight: 500; margin: 0; display: flex; align-items: center; gap: 6px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; min-height: 44px; }
.seg input { accent-color: var(--accent); margin: 0; }
.seg label:has(input:checked) { border-color: var(--accent); outline: 1px solid var(--accent); }
input[type=text], textarea, select {
  width: 100%; font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px;
}
textarea { min-height: 9em; resize: vertical; }
input[type=file] { font: inherit; color: var(--dim); max-width: 100%; }
input[type=file]::file-selector-button {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 12px; margin-inline-end: 10px; cursor: pointer; min-height: 44px;
}
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
select { width: auto; min-height: 40px; padding: 6px 10px; }
.count { display: block; text-align: end; color: var(--dim); font-size: .8rem; margin-top: 2px; }
.list { margin: 6px 0 0; padding: 0; list-style: none; font-size: .88rem; color: var(--dim); }
.list li { overflow-wrap: anywhere; }
/* Clipped in place, not moved off-screen: left: -10000px made the Persian (RTL) page
   10000px wide and scrollable sideways. */
.trap { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
button {
  font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 12px 22px; min-height: 48px;
  background: var(--accent); color: var(--accent-ink); cursor: pointer; width: 100%;
}
button[disabled] { opacity: .6; cursor: progress; }
.btn-soft { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.err { background: var(--err-bg); color: var(--err); border-radius: 10px; padding: 10px 12px; margin: 0 0 16px; font-weight: 600; }
.err:empty { display: none; }
.field.bad input, .field.bad textarea { border-color: var(--err); }
progress { width: 100%; height: 10px; margin: 12px 0 4px; accent-color: var(--accent); }
.status { color: var(--dim); font-size: .9rem; min-height: 1.4em; margin: 0; }
.done { text-align: center; }
.done h2 { margin: 8px 0; font-size: 1.25rem; }
.foot { color: var(--dim); font-size: .85rem; margin-top: 18px; }
.foot a, .done a { color: var(--accent); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="t-title"></h1>
    <select id="lang" aria-label="Language"></select>
  </header>

  <form id="form" class="card" novalidate>
    <p class="note" id="t-lead"></p>
    <p class="warn" id="t-public"></p>
    <p class="err" id="err" role="alert" aria-live="assertive"></p>

    <fieldset>
      <legend id="t-kind"></legend>
      <div class="seg">
        <label><input type="radio" name="kind" value="bug" checked> <span id="t-bug"></span></label>
        <label><input type="radio" name="kind" value="idea"> <span id="t-idea"></span></label>
      </div>
    </fieldset>

    <div class="field" id="f-text">
      <label for="text" id="t-desc"></label>
      <textarea id="text" name="text" maxlength="4000" required></textarea>
      <span class="hint" id="t-descHint"></span>
      <span class="count" id="count" aria-live="polite"></span>
    </div>

    <div class="field">
      <label for="game" id="t-game"></label>
      <input type="text" id="game" name="game" maxlength="60" autocomplete="off">
    </div>

    <div class="field" id="f-shots">
      <label for="shots" id="t-shots"></label>
      <input type="file" id="shots" accept="image/png,image/jpeg,image/webp" multiple>
      <ul class="list" id="shotList"></ul>
    </div>

    <div class="field" id="f-video">
      <label for="video" id="t-video"></label>
      <input type="file" id="video" accept="video/mp4,video/webm,video/quicktime">
      <ul class="list" id="videoList"></ul>
    </div>

    <div class="field">
      <label for="contact" id="t-contact"></label>
      <input type="text" id="contact" name="contact" maxlength="120" autocomplete="off" dir="auto">
      <span class="hint" id="t-contactNote"></span>
    </div>

    <!-- Bots fill every field; people never see this one. -->
    <div class="trap" aria-hidden="true">
      <label for="website">Website</label>
      <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
    </div>

    <button type="submit" id="send"></button>
    <progress id="bar" max="1" value="0" hidden></progress>
    <p class="status" id="status" aria-live="polite"></p>
  </form>

  <div class="card done" id="done" hidden>
    <h2 id="t-done"></h2>
    <p id="doneIssue"></p>
    <p class="err" id="donePartial"></p>
    <button type="button" class="btn-soft" id="again"></button>
  </div>

  <p class="foot"><span id="t-privacy"></span> <a id="privacyLink" href="https://choganhq.github.io/chogan/privacy.html" rel="noopener noreferrer"></a> · <a id="backLink" href="https://choganhq.github.io/chogan/" rel="noopener noreferrer"></a></p>
</main>

  var sel = $('lang');
  LANGS.forEach(function (l) { var o = document.createElement('option'); o.value = l[0]; o.textContent = l[1]; sel.appendChild(o); });
  sel.addEventListener('change', function () { lang = sel.value; apply(); });

  function count() { $('count').textContent = t('chars', { n: Array.from($('text').value).length }); }
  $('text').addEventListener('input', count);

  var lastErr = null;
  function showErr(key, v, field) {
    lastErr = key ? [key, v] : null;
    $('err').textContent = key ? t(key, v) : '';
    document.querySelectorAll('.field.bad').forEach(function (f) { f.classList.remove('bad'); });
    if (field) $(field).classList.add('bad');
    if (key) $('err').scrollIntoView({ block: 'nearest' });
  }

  var IMG = { 'image/png': 1, 'image/jpeg': 1, 'image/webp': 1 };
  var VID = { 'video/mp4': 1, 'video/webm': 1, 'video/quicktime': 1 };
  function listFiles(input, ul) {
    ul.textContent = '';
    Array.prototype.forEach.call(input.files, function (f) {
      var li = document.createElement('li');
      li.textContent = f.name + ' — ' + digits((f.size / 1048576).toFixed(1)) + ' MB';
      ul.appendChild(li);
    });
  }
  $('shots').addEventListener('change', function () { listFiles(this, $('shotList')); });
  $('video').addEventListener('change', function () { listFiles(this, $('videoList')); });

  // A first check here saves a wasted upload; the Worker checks every rule again.
  function check() {
    var text = $('text').value.trim();
    if (!text) return ['eDesc', null, 'f-text'];
    if (Array.from(text).length > MAX.text) return ['eLong', null, 'f-text'];
    var shots = Array.prototype.slice.call($('shots').files);
    if (shots.length > MAX.shots) return ['eShotsN', null, 'f-shots'];
    for (var i = 0; i < shots.length; i++) {
      if (!IMG[shots[i].type]) return ['eShotType', { name: shots[i].name }, 'f-shots'];
      if (shots[i].size > MAX.shotBytes) return ['eShotSize', { name: shots[i].name }, 'f-shots'];
    }
    var v = $('video').files[0];
    if (v && !VID[v.type]) return ['eVideoType', { name: v.name }, 'f-video'];
    if (v && v.size > MAX.videoBytes) return ['eVideoSize', { name: v.name }, 'f-video'];
    return null;
  }

  var ERR = { rate: 'eRate', cap: 'eCap', type: 'eFileBad', too_big: 'eFileBad', too_many: 'eShotsN', too_long: 'eLong' };
  function post(path, body, headers, onProgress) {
    return new Promise(function (resolve, reject) {
      var x = new XMLHttpRequest();
      x.open('POST', 'api/' + path);
      for (var h in headers) x.setRequestHeader(h, headers[h]);
      if (onProgress && x.upload) x.upload.onprogress = function (e) { if (e.lengthComputable) onProgress(e.loaded / e.total); };
      x.onload = function () {
        var d = null;
        try { d = JSON.parse(x.responseText); } catch (e) {}
        if (x.status >= 200 && x.status < 300 && d && d.ok) resolve(d);
        else reject({ code: d && d.error || 'server' });
      };
      x.onerror = function () { reject({ code: 'net' }); };
      x.send(body);
    });
  }

  var busy = false;
  function setBusy(b) {
    busy = b;
    $('send').disabled = b;
    $('send').textContent = b ? t('sending') : t('send');
    $('bar').hidden = !b;
    if (!b) $('status').textContent = '';
  }

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;
    var bad = check();
    if (bad) { showErr(bad[0], bad[1], bad[2]); return; }
    showErr(null);
    var shots = Array.prototype.slice.call($('shots').files);
    var video = $('video').files[0];
    var files = shots.map(function (f, i) { return { f: f, kind: 'image', slot: 'shot-' + (i + 1) }; });
    if (video) files.push({ f: video, kind: 'video', slot: 'video' });
    var total = files.reduce(function (a, x) { return a + x.f.size; }, 0) || 1;
    var doneBytes = 0;
    var kind = document.querySelector('input[name=kind]:checked').value;
    setBusy(true);
    $('bar').value = 0;
    post('start', JSON.stringify({
      kind: kind, lang: lang, text: $('text').value, game: $('game').value, contact: $('contact').value,
      website: $('website').value,
      files: files.map(function (x) { return { kind: x.kind, size: x.f.size }; })
    }), { 'Content-Type': 'application/json' }).then(function (d) {
      if (d.done) return { issue: null, failed: 0 };
      var failed = 0;
      var chain = Promise.resolve();
      files.forEach(function (x, i) {
        chain = chain.then(function () {
          $('status').textContent = t('uploading', { n: i + 1, m: files.length });
          return post('file?slot=' + x.slot, x.f, { 'X-Report-Ticket': d.ticket, 'Content-Type': 'application/octet-stream' }, function (p) {
            $('bar').value = (doneBytes + p * x.f.size) / total;
          }).then(null, function () { failed++; }).then(function () { doneBytes += x.f.size; $('bar').value = doneBytes / total; });
        });
      });
      return chain.then(function () {
        $('status').textContent = t('finishing');
        return post('finish', JSON.stringify({ ticket: d.ticket }), { 'Content-Type': 'application/json' });
      }).then(function (r) { return { issue: r.issue, failed: failed }; });
    }).then(function (r) {
      setBusy(false);
      $('form').hidden = true;
      $('done').hidden = false;
      $('doneIssue').textContent = r.issue ? t('doneIssue', { n: r.issue }) : '';
      $('donePartial').textContent = r.failed ? t('ePartial', { n: r.failed }) : '';
      $('done').scrollIntoView({ block: 'start' });
    }, function (err) {
      setBusy(false);
      showErr(err.code === 'net' ? 'eNet' : (ERR[err.code] || 'eServer'));
    });
  });

  $('again').addEventListener('click', function () {
    $('form').reset();
    $('shotList').textContent = ''; $('videoList').textContent = '';
    $('done').hidden = true; $('form').hidden = false;
    showErr(null); count();
  });

  lang = pick();
  sel.value = lang;
  apply();
})();
</script>
</body>
</html>
