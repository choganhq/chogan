<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>چوگان — گزارش</title>
<!-- One self-contained file (#757): no fonts, scripts or images from anywhere else,
     no cookies, no analytics. The Worker that serves it checks everything again. -->
<style>
:root {
  --bg: #f6f4ef; --card: #ffffff; --ink: #1d1f22; --dim: #5d6168; --line: #d9d5cc;
  --accent: #0f6b5c; --accent-ink: #ffffff; --err: #b3261e; --err-bg: #fdecea; --ok-bg: #e5f4ef;
  --focus: #1a73e8;
}
/* Dark by the system unless the player picked light; or dark by the player's pick. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: #15171a; --card: #1f2226; --ink: #eceae6; --dim: #a7abb2; --line: #363a40;
    --accent: #5fc3ad; --accent-ink: #0b1f1b; --err: #ffb4ab; --err-bg: #3b1e1c; --ok-bg: #173229;
    --focus: #8ab4f8;
  }
}
:root[data-theme=dark] {
  --bg: #15171a; --card: #1f2226; --ink: #eceae6; --dim: #a7abb2; --line: #363a40;
  --accent: #5fc3ad; --accent-ink: #0b1f1b; --err: #ffb4ab; --err-bg: #3b1e1c; --ok-bg: #173229;
  --focus: #8ab4f8;
}
:root[data-theme=light] { color-scheme: light; }
:root[data-theme=dark] { color-scheme: dark; }
.tools { display: flex; align-items: center; gap: 8px; }
.tbtn { width: 40px; min-height: 40px; padding: 0; font-size: 1.2rem; line-height: 1; border-radius: 10px; background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 400; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Vazirmatn", Tahoma, "Noto Sans", sans-serif;
}
main { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0 8px; }
h1 { font-size: 1.4rem; margin: 0 0 16px; line-height: 1.3; }
/* the way back (#792): the form had only a small link under the long form */
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px 0 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--ink); text-decoration: none; font-weight: 600; font-size: .95rem; min-width: 0; }
.back svg { flex: none; }
[dir=rtl] .back svg { transform: scaleX(-1); }
.back span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.note { color: var(--dim); font-size: .92rem; margin: 0 0 16px; }
/* Red with a sign: it says "do not write personal details" and must not read as a success note. */
.warn { background: var(--err-bg); color: var(--err); border: 1px solid var(--err); border-radius: 10px; padding: 10px 12px; font-size: .92rem; font-weight: 600; margin: 0 0 16px; }
.warn::before { content: "\26A0\FE0E\00a0"; }
.x { width: auto; min-height: 28px; padding: 0 8px; margin-inline-start: 8px; font-size: 1rem; background: transparent; color: var(--err); border: 1px solid var(--line); border-radius: 8px; font-weight: 400; }
label, legend { display: block; font-weight: 600; margin: 0 0 6px; }
.field { margin: 0 0 18px; }
.hint { display: block; color: var(--dim); font-size: .85rem; font-weight: 400; margin-top: 4px; }
fieldset { border: 0; padding: 0; margin: 0 0 18px; min-width: 0; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg label { font-weight: 500; margin: 0; display: flex; align-items: center; gap: 6px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; min-height: 44px; }
.seg input { accent-color: var(--accent); margin: 0; }
.seg label:has(input:checked) { border-color: var(--accent); outline: 1px solid var(--accent); }
input[type=text], textarea, select {
  width: 100%; font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px;
}
textarea { min-height: 9em; resize: vertical; }
input[type=file] { font: inherit; color: var(--dim); max-width: 100%; }
input[type=file]::file-selector-button {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 12px; margin-inline-end: 10px; cursor: pointer; min-height: 44px;
}
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
select { width: auto; min-height: 40px; padding: 6px 10px; }
.count { display: block; text-align: end; color: var(--dim); font-size: .8rem; margin-top: 2px; }
.list { margin: 6px 0 0; padding: 0; list-style: none; font-size: .88rem; color: var(--dim); }
.list li { overflow-wrap: anywhere; }
/* Clipped in place, not moved off-screen: left: -10000px made the Persian (RTL) page
   10000px wide and scrollable sideways. */
.trap { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
button {
  font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 12px 22px; min-height: 48px;
  background: var(--accent); color: var(--accent-ink); cursor: pointer; width: 100%;
}
button[disabled] { opacity: .6; cursor: progress; }
.btn-soft { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.err { background: var(--err-bg); color: var(--err); border-radius: 10px; padding: 10px 12px; margin: 0 0 16px; font-weight: 600; }
.err:empty { display: none; }
.field.bad input, .field.bad textarea { border-color: var(--err); }
progress { width: 100%; height: 10px; margin: 12px 0 4px; accent-color: var(--accent); }
.status { color: var(--dim); font-size: .9rem; min-height: 1.4em; margin: 0; }
.done { text-align: center; }
.done h2 { margin: 8px 0; font-size: 1.25rem; }
.foot { color: var(--dim); font-size: .85rem; margin-top: 18px; }
.foot a, .done a { color: var(--accent); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <a class="back" id="backTop" href="https://choganhq.github.io/chogan/" rel="noopener noreferrer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span id="t-backTop"></span></a>
    <div class="tools">
      <button type="button" class="tbtn" id="theme"></button>
      <select id="lang" aria-label="Language"></select>
    </div>
  </header>
  <h1 id="t-title"></h1>

  <form id="form" class="card" novalidate>
    <p class="note" id="t-lead"></p>
    <p class="warn" id="t-public"></p>
    <p class="err" id="err" role="alert" aria-live="assertive"></p>

    <fieldset>
      <legend id="t-kind"></legend>
      <div class="seg">
        <label><input type="radio" name="kind" value="bug" checked> <span id="t-bug"></span></label>
        <label><input type="radio" name="kind" value="idea"> <span id="t-idea"></span></label>
      </div>
    </fieldset>

    <div class="field" id="f-text">
      <label for="text" id="t-desc"></label>
      <textarea id="text" name="text" maxlength="4000" required></textarea>
      <span class="hint" id="t-descHint"></span>
      <span class="count" id="count" aria-live="polite"></span>
    </div>

    <div class="field">
      <label for="game" id="t-game"></label>
      <input type="text" id="game" name="game" maxlength="60" autocomplete="off">
    </div>

    <div class="field" id="f-shots">
      <label for="shots" id="t-shots"></label>
      <input type="file" id="shots" accept="image/png,image/jpeg,image/webp" multiple>
      <span class="hint" id="t-pasteHint"></span>
      <ul class="list" id="shotList"></ul>
    </div>

    <div class="field" id="f-video">
      <label for="video" id="t-video"></label>
      <input type="file" id="video" accept="video/mp4,video/webm,video/quicktime">
      <ul class="list" id="videoList"></ul>
    </div>

    <div class="field">
      <label for="contact" id="t-contact"></label>
      <input type="text" id="contact" name="contact" maxlength="120" autocomplete="off" dir="auto">
      <span class="hint" id="t-contactNote"></span>
    </div>

    <!-- Bots fill every field; people never see this one. -->
    <div class="trap" aria-hidden="true">
      <label for="website">Website</label>
      <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
    </div>

    <button type="submit" id="send"></button>
    <progress id="bar" max="1" value="0" hidden></progress>
    <p class="status" id="status" aria-live="polite"></p>
  </form>

  <div class="card done" id="done" hidden>
    <h2 id="t-done"></h2>
    <p id="doneIssue"></p>
    <p class="err" id="donePartial"></p>
    <button type="button" class="btn-soft" id="again"></button>
  </div>

  <p class="foot"><span id="t-privacy"></span> <a id="privacyLink" href="https://choganhq.github.io/chogan/privacy.html" rel="noopener noreferrer"></a> · <a id="backLink" href="https://choganhq.github.io/chogan/" rel="noopener noreferrer"></a></p>
</main>

      theme: 'थीम (अपने-आप, हल्की, गहरी)', remove: 'हटाएँ', pasteHint: 'आप कॉपी की हुई तस्वीर यहाँ Ctrl+V से भी चिपका सकते हैं।',
      game: 'खेल (वैकल्पिक): जिस खेल के बारे में है उसका नाम, जैसे शतरंज', shots: 'स्क्रीनशॉट (वैकल्पिक, 5 तक, PNG, JPG या WebP, हर एक 5 MB तक)',

      contact: 'संपर्क (वैकल्पिक): Telegram यूज़रनेम (जैसे @name) या ईमेल', contactNote: 'इसे सिर्फ़ डेवलपर देखता है। यह कभी प्रकाशित नहीं होता।',

      done: 'धन्यवाद! आपकी शिकायत पहुँच गई।', doneIssue: 'GitHub पर यह #{n} है।', another: 'एक और भेजें',
      privacy: 'फ़ाइलें तीन दिन के भीतर मिटा दी जाती हैं। न आँकड़े, न कुकी।', privacyLink: 'निजता', back: 'Chogan पर वापस',
      chars: '{n} / 4000',
      eDesc: 'कृपया विवरण लिखें।', eLong: 'विवरण 4000 अक्षरों से ज़्यादा है।', eShotsN: 'ज़्यादा से ज़्यादा 5 स्क्रीनशॉट।',

      eNet: 'सर्वर तक नहीं पहुँच सके। अपना कनेक्शन जाँचें और फिर कोशिश करें।',
      eServer: 'कुछ गड़बड़ हो गई। बाद में फिर कोशिश करें।',
      eFileBad: 'सर्वर ने एक फ़ाइल नहीं ली।',

    }
  };

  var $ = function (id) { return document.getElementById(id); };
  var lang = 'fa';
  function pick() {
    var q = /[?&]lang=([a-z]{2})/.exec(location.search);
    if (q && S[q[1]]) return q[1];
    var n = (navigator.languages || [navigator.language || '']);
    for (var i = 0; i < n.length; i++) { var c = String(n[i]).slice(0, 2).toLowerCase(); if (S[c]) return c; }
    return 'fa';
  }
  function digits(s) { return lang === 'fa' ? String(s).replace(/\d/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'[d]; }) : String(s); }
  function t(k, v) {
    var s = S[lang][k] || S.en[k] || k;
    if (v) for (var x in v) s = s.split('{' + x + '}').join(x === 'name' ? v[x] : digits(v[x]));
    return s;
  }
  function apply() {
    var L = LANGS.filter(function (l) { return l[0] === lang; })[0];
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
    document.documentElement.dir = L[2];
    document.title = 'Chogan — ' + t('title');
    ['title', 'lead', 'public', 'kind', 'bug', 'idea', 'desc', 'descHint', 'game', 'shots', 'pasteHint', 'video', 'contact', 'contactNote', 'done', 'privacy']
      .forEach(function (k) { $('t-' + k).textContent = t(k); });
    $('send').textContent = busy ? t('sending') : t('send');
    $('again').textContent = t('another');
    $('privacyLink').textContent = t('privacyLink');
    $('backLink').textContent = t('back');
    $('t-backTop').textContent = t('back');
    count();
    if (lastErr) showErr(lastErr[0], lastErr[1]);
  }

  // Back goes where the player came from when that was a Chogan page in this tab, so the
  // app or the issues list keeps its place; a form opened in a new tab (the app links it
  // with target=_blank) has nothing to go back to and opens the web app instead.
  var BACK_FROM = [location.origin, 'https://issues.playchogan.com', 'https://choganhq.github.io', 'https://staging.playchogan.com'];
  function cameFromChogan() {
    try { return history.length > 1 && BACK_FROM.indexOf(new URL(document.referrer).origin) >= 0; } catch (e) { return false; }
  }
  $('backTop').addEventListener('click', function (e) {
    if (!cameFromChogan()) return;
    e.preventDefault();
    history.back();
  });

  var sel = $('lang');
  LANGS.forEach(function (l) { var o = document.createElement('option'); o.value = l[0]; o.textContent = l[1]; sel.appendChild(o); });
  sel.addEventListener('change', function () { lang = sel.value; apply(); });

  function count() { $('count').textContent = t('chars', { n: Array.from($('text').value).length }); }
  $('text').addEventListener('input', count);

  var lastErr = null;
  function showErr(key, v, field) {
    lastErr = key ? [key, v] : null;
    $('err').textContent = key ? t(key, v) : '';
    document.querySelectorAll('.field.bad').forEach(function (f) { f.classList.remove('bad'); });
    if (field) $(field).classList.add('bad');
    if (key) $('err').scrollIntoView({ block: 'nearest' });
  }

  var IMG = { 'image/png': 1, 'image/jpeg': 1, 'image/webp': 1 };
  var VID = { 'video/mp4': 1, 'video/webm': 1, 'video/quicktime': 1 };
  // Screenshots live in an array so a picked file and a pasted image (Ctrl+V) are the same thing.
  var shotFiles = [];
  function listShots() {
    var ul = $('shotList');
    ul.textContent = '';
    shotFiles.forEach(function (f, i) {
      var li = document.createElement('li');
      li.textContent = f.name + ' — ' + digits((f.size / 1048576).toFixed(1)) + ' MB';
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'x'; b.textContent = '×'; b.title = t('remove'); b.setAttribute('aria-label', t('remove') + ' ' + f.name);
      b.addEventListener('click', function () { shotFiles.splice(i, 1); listShots(); });
      li.appendChild(b);
      ul.appendChild(li);
    });
  }
  function listVideo() {
    var ul = $('videoList');
    ul.textContent = '';
    Array.prototype.forEach.call($('video').files, function (f) {
      var li = document.createElement('li');
      li.textContent = f.name + ' — ' + digits((f.size / 1048576).toFixed(1)) + ' MB';
      ul.appendChild(li);
    });
  }
  $('shots').addEventListener('change', function () {
    shotFiles = shotFiles.concat(Array.prototype.slice.call(this.files));
    this.value = '';
    listShots();
  });
  $('video').addEventListener('change', listVideo);
  var pasted = 0;
  document.addEventListener('paste', function (e) {
    var items = (e.clipboardData && e.clipboardData.files) || [];
    var added = false;
    Array.prototype.forEach.call(items, function (f) {
      if (!IMG[f.type]) return;
      pasted++;
      shotFiles.push(new File([f], 'pasted-' + pasted + '.' + f.type.split('/')[1].replace('jpeg', 'jpg'), { type: f.type }));
      added = true;
    });
    if (added) { e.preventDefault(); listShots(); }
  });

  // A first check here saves a wasted upload; the Worker checks every rule again.
  function check() {
    var text = $('text').value.trim();
    if (!text) return ['eDesc', null, 'f-text'];
    if (Array.from(text).length > MAX.text) return ['eLong', null, 'f-text'];
    var shots = shotFiles;
    if (shots.length > MAX.shots) return ['eShotsN', null, 'f-shots'];
    for (var i = 0; i < shots.length; i++) {
      if (!IMG[shots[i].type]) return ['eShotType', { name: shots[i].name }, 'f-shots'];
      if (shots[i].size > MAX.shotBytes) return ['eShotSize', { name: shots[i].name }, 'f-shots'];
    }
    var v = $('video').files[0];
    if (v && !VID[v.type]) return ['eVideoType', { name: v.name }, 'f-video'];
    if (v && v.size > MAX.videoBytes) return ['eVideoSize', { name: v.name }, 'f-video'];
    return null;
  }

  var ERR = { rate: 'eRate', cap: 'eCap', type: 'eFileBad', too_big: 'eFileBad', too_many: 'eShotsN', too_long: 'eLong' };
  function post(path, body, headers, onProgress) {
    return new Promise(function (resolve, reject) {
      var x = new XMLHttpRequest();
      x.open('POST', 'api/' + path);
      for (var h in headers) x.setRequestHeader(h, headers[h]);
      if (onProgress && x.upload) x.upload.onprogress = function (e) { if (e.lengthComputable) onProgress(e.loaded / e.total); };
      x.onload = function () {
        var d = null;
        try { d = JSON.parse(x.responseText); } catch (e) {}
        if (x.status >= 200 && x.status < 300 && d && d.ok) resolve(d);
        else reject({ code: d && d.error || 'server' });
      };
      x.onerror = function () { reject({ code: 'net' }); };
      x.send(body);
    });
  }

  var busy = false;
  function setBusy(b) {
    busy = b;
    $('send').disabled = b;
    $('send').textContent = b ? t('sending') : t('send');
    $('bar').hidden = !b;
    if (!b) $('status').textContent = '';
  }

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;
    var bad = check();
    if (bad) { showErr(bad[0], bad[1], bad[2]); return; }
    showErr(null);
    var shots = shotFiles;
    var video = $('video').files[0];
    var files = shots.map(function (f, i) { return { f: f, kind: 'image', slot: 'shot-' + (i + 1) }; });
    if (video) files.push({ f: video, kind: 'video', slot: 'video' });
    var total = files.reduce(function (a, x) { return a + x.f.size; }, 0) || 1;
    var doneBytes = 0;
    var kind = document.querySelector('input[name=kind]:checked').value;
    setBusy(true);
    $('bar').value = 0;
    post('start', JSON.stringify({
      kind: kind, lang: lang, text: $('text').value, game: $('game').value, contact: $('contact').value,
      website: $('website').value,
      files: files.map(function (x) { return { kind: x.kind, size: x.f.size }; })
    }), { 'Content-Type': 'application/json' }).then(function (d) {
      if (d.done) return { issue: null, failed: 0 };
      var failed = 0;
      var chain = Promise.resolve();
      files.forEach(function (x, i) {
        chain = chain.then(function () {
          $('status').textContent = t('uploading', { n: i + 1, m: files.length });
          return post('file?slot=' + x.slot, x.f, { 'X-Report-Ticket': d.ticket, 'Content-Type': 'application/octet-stream' }, function (p) {
            $('bar').value = (doneBytes + p * x.f.size) / total;
          }).then(null, function () { failed++; }).then(function () { doneBytes += x.f.size; $('bar').value = doneBytes / total; });
        });
      });
      return chain.then(function () {
        $('status').textContent = t('finishing');
        return post('finish', JSON.stringify({ ticket: d.ticket }), { 'Content-Type': 'application/json' });
      }).then(function (r) { return { issue: r.issue, failed: failed }; });
    }).then(function (r) {
      setBusy(false);
      $('form').hidden = true;
      $('done').hidden = false;
      $('doneIssue').textContent = r.issue ? t('doneIssue', { n: r.issue }) : '';
      $('donePartial').textContent = r.failed ? t('ePartial', { n: r.failed }) : '';
      $('done').scrollIntoView({ block: 'start' });
    }, function (err) {
      setBusy(false);
      showErr(err.code === 'net' ? 'eNet' : (ERR[err.code] || 'eServer'));
    });
  });

  $('again').addEventListener('click', function () {
    $('form').reset();
    shotFiles = []; listShots(); $('videoList').textContent = '';
    $('done').hidden = true; $('form').hidden = false;
    showErr(null); count();
  });

  // Theme: auto follows the system; a pick is kept in this browser only (no cookie).
  var THEMES = ['auto', 'light', 'dark'], ICON = { auto: '\u25D0', light: '\u2600', dark: '\u263E' }, theme = 'auto';
  try { theme = localStorage.getItem('chogan.reportTheme') || 'auto'; } catch (e) {}
  if (THEMES.indexOf(theme) < 0) theme = 'auto';
  function applyTheme() {
    var r = document.documentElement;
    if (theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', theme);
    $('theme').textContent = ICON[theme];
    $('theme').title = t('theme');
    $('theme').setAttribute('aria-label', t('theme'));
  }
  $('theme').addEventListener('click', function () {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % 3];
    try { localStorage.setItem('chogan.reportTheme', theme); } catch (e) {}
    applyTheme();
  });

  lang = pick();
  sel.value = lang;
  apply();
  applyTheme();
})();
