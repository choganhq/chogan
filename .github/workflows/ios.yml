name: iOS

# Builds the iOS app on a macOS runner and, in upload mode, sends it to TestFlight (#1110).
# The Xcode project is generated by Capacitor on every run (tools/ios-build.sh); nothing of it
# is committed. The Apple secrets are only read here.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'archive (sign and export an .ipa) or upload (also send it to TestFlight)'
        required: true
        default: archive
        type: choice
        options: [archive, upload]

permissions:
  contents: read

jobs:
  ios:
    name: iOS build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Build
        env:
          MODE: ${{ inputs.mode }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_P8: ${{ secrets.APPLE_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: tools/ios-build.sh
