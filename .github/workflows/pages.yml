name: انتشار وب

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: انتشار پوشه‌ی www روی گیت‌هاب پیجز
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      # روی ریپوی قالب پیجز عمداً فعال نیست. بدون این بررسی، ورک‌فلو
      # با خطای قرمز می‌افتاد. اینجا فقط با پیام رد می‌شود.
      - name: بررسی فعال بودن پیجز
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "گیت‌هاب پیجز روی این ریپو فعال نیست. انتشار وب رد شد."
            echo "برای فعال کردن: Settings ← Pages ← Source: GitHub Actions"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: آماده‌سازی پیجز
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      # نسخه‌ی وب بین دو نسخه‌ی اندروید هم عوض می‌شود، ولی APP_VERSION عمداً
      # ثابت می‌ماند تا ربات اف‌دروید چیزی برندارد. پس شناسه‌ی بیلد را همین‌جا
      # روی نسخه‌ی منتشرشده مهر می‌زنیم، نه در ریپو: سورس دست‌نخورده می‌ماند
      # و بیلد قابل تکرار اف‌دروید عوض نمی‌شود.
      - name: مهر شناسه‌ی بیلد روی نسخه‌ی وب
        if: steps.pages.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          printf '\n// شناسه‌ی بیلد وب. فقط در نسخه‌ی گیت‌هاب پیجز هست.\nself.APP_BUILD = %s;\n' \
            "'${GITHUB_SHA:0:12}'" >> www/version.js
          tail -n 3 www/version.js

      - name: بسته‌بندی www
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: انتشار
        id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
