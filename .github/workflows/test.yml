name: تست

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: موتور بازی‌ها و بار شدن صفحه‌ها
    runs-on: ubuntu-latest

    steps:
      - name: دریافت سورس
        uses: actions/checkout@v7

      - name: نصب نود
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: تست موتور بازی‌ها
        run: node tools/test.js

      - name: باز کردن همه‌ی صفحه‌ها در مرورگر بدون سر
        run: ./tools/browser-check.sh

  android:
    name: بیلد دیباگ اندروید
    runs-on: ubuntu-latest

    steps:
      - name: دریافت سورس
        uses: actions/checkout@v7

      - name: نصب جاوا
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # نسخه‌ی گردل از همان فایلی خوانده می‌شود که اف‌دروید می‌خواند، وگرنه
      # CI با یک نسخه سبز می‌شود و اف‌دروید با نسخه‌ی دیگری می‌سازد.
      - name: خواندن نسخه‌ی گردل از فایل wrapper
        id: gradleversion
        run: |
          set -euo pipefail
          V=$(sed -n 's|.*/gradle-\([0-9][^-]*\)-bin\.zip.*|\1|p' android/gradle/wrapper/gradle-wrapper.properties)
          [ -n "$V" ] || { echo "نسخه‌ی گردل از gradle-wrapper.properties خوانده نشد"; exit 1; }
          echo "نسخه‌ی گردل: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: نصب گریدل
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradleversion.outputs.version }}

      # بیلد دیباگ کلید امضا نمی‌خواهد، پس روی هر PR اجرا می‌شود و ثابت
      # می‌کند پروژه‌ی اندروید واقعاً بیلد می‌شود، نه فقط روی کاغذ درست است.
      - name: بیلد
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: بررسی محتوای APK
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "خروجی: $APK ($(du -h "$APK" | cut -f1))"
          # دارایی‌های وب و فهرست افزونه‌ها باید واقعاً داخل بسته باشند
          unzip -l "$APK" > /tmp/apk.txt
          for f in assets/public/index.html assets/public/games.json \
                   assets/public/lib/chogan.js assets/public/fonts/vazirmatn-variable.woff2 \
                   assets/capacitor.config.json assets/capacitor.plugins.json; do
            grep -q "$f" /tmp/apk.txt || { echo "در APK نیست: $f"; exit 1; }
          done
          for g in tower-defence sudoku minesweeper dots; do
            grep -q "assets/public/games/$g/index.html" /tmp/apk.txt || { echo "بازی در APK نیست: $g"; exit 1; }
          done
          echo "همه‌ی دارایی‌های لازم داخل APK هستند"

      # لیبل لانچر باید با زبان گوشی عوض شود. تست‌های فایلی فقط منابع را
      # می‌بینند؛ اینجا از خود APK بیلدشده می‌پرسیم که واقعاً هر دو تا آمده‌اند.
      - name: بررسی نام برنامه در هر دو زبان
        run: |
          set -euo pipefail
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          BADGE=$("$AAPT" dump badging "$APK")
          echo "$BADGE" | grep -E "^application(-label|-label-fa)" || true
          DEF=$(echo "$BADGE" | sed -n "s/^application-label:'\(.*\)'$/\1/p")
          FA=$(echo "$BADGE" | sed -n "s/^application-label-fa:'\(.*\)'$/\1/p")
          [ "$DEF" = "Chogan" ] || { echo "نام پیش‌فرض «$DEF» است نه Chogan"; exit 1; }
          [ "$FA" = "چوگان" ] || { echo "نام فارسی «$FA» است نه چوگان"; exit 1; }
          echo "پیش‌فرض: $DEF · فارسی: $FA"

      - name: بررسی مجوزهای بسته
        run: |
          set -euo pipefail
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          DUMP=$("$AAPT" dump permissions "$APK")
          echo "$DUMP"
          # فقط مجوزهای سیستمی مهم‌اند. اندروایکس برای اپ‌هایی که هدفشان API 33
          # به بالاست خودش یک مجوز با نام بسته‌ی خودمان تعریف می‌کند
          # (DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION) که مجوز سیستمی نیست.
          SYS=$(echo "$DUMP" | grep -oE "android\.permission\.[A-Z_]+" | sort -u | tr '\n' ' ' | sed 's/ $//')
          echo "مجوزهای سیستمی: ${SYS:-هیچ}"
          if [ "$SYS" != "android.permission.VIBRATE" ]; then
            echo "مجموعه‌ی مجوزهای سیستمی آن چیزی نیست که باید باشد"
            exit 1
          fi
          echo "فقط مجوز لرزش، همان‌طور که باید"

  # انتشار وب فقط بعد از سبز شدن تست و بیلد اندروید روی همین کامیت. قبلاً
  # pages.yml جدا و هم‌زمان با تست‌ها اجرا می‌شد، پس ادغامی که تستش روی main
  # می‌افتاد باز هم به دست کاربرها می‌رسید. بعد از انتشار، فایل منتشرشده را
  # برمی‌گردانیم و با همین کامیت و همین اجرا مقایسه می‌کنیم؛ سبز شدن
  # deploy-pages فقط یعنی آپلود پذیرفته شد، نه اینکه سایت عوض شد.
  pages:
    name: انتشار وب روی گیت‌هاب پیجز
    needs: [test, android]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      # deploy-pages از نسخه‌ی ۴ به بعد این را لازم دارد
      actions: read
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: دریافت سورس
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # هر انتشار اسم کش سرویس‌ورکر را عوض می‌کند و همه‌ی کاربرها پوسته را از نو
      # می‌گیرند، پس ادغامی که فقط مستند یا اندروید را عوض کرده منتشر نمی‌شود.
      # تصمیم در tools/web-changed.sh است تا tools/test.js روی یک مخزن آزمایشی
      # واقعی اجرایش کند؛ درون YAML هیچ تستی به آن نمی‌رسید.
      - name: آیا چیزی از نسخه‌ی وب عوض شده؟
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: bash tools/web-changed.sh >> "$GITHUB_OUTPUT"

      # روی ریپوی قالب پیجز عمداً فعال نیست. بدون این بررسی، کار با خطای
      # قرمز می‌افتاد. اینجا فقط با پیام رد می‌شود.
      - name: بررسی فعال بودن پیجز
        id: pages
        if: steps.changed.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "گیت‌هاب پیجز روی این ریپو فعال نیست. انتشار وب رد شد."
            echo "برای فعال کردن: Settings ← Pages ← Source: GitHub Actions"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: آماده‌سازی پیجز
        if: steps.changed.outputs.deploy == 'true' && steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

      # منطق مهر در tools/stamp-version.sh است تا tools/test.js همان چیزی را تست کند
      # که اینجا اجرا می‌شود. GITHUB_SHA و GITHUB_RUN_ID و GITHUB_RUN_ATTEMPT را
      # خود اکشنز می‌دهد؛ نام محیط را صریح می‌دهیم تا هیچ‌وقت حدس زده نشود.
      - name: مهر هویت استقرار روی نسخه‌ی وب
        if: steps.changed.outputs.deploy == 'true' && steps.pages.outputs.enabled == 'true'
        env:
          APP_ENV: production
        run: bash tools/stamp-version.sh www/version.js

      - name: بسته‌بندی www
        if: steps.changed.outputs.deploy == 'true' && steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: www

      - name: انتشار
        id: deployment
        if: steps.changed.outputs.deploy == 'true' && steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v5

      # مقایسه با مقدارهای مورد انتظار است، نه با چیزی که همین بیلد درباره‌ی خودش
      # گفته. پیجز از چند ثانیه تا چند دقیقه طول می‌کشد تا نسخه‌ی تازه را سرو
      # کند، پس اسکریپت با سقف مشخص دوباره تلاش می‌کند و بعد شکست می‌خورد.
      - name: بررسی اینکه سایت همین کامیت و همین اجرا را سرو می‌کند
        if: steps.changed.outputs.deploy == 'true' && steps.pages.outputs.enabled == 'true'
        run: >-
          bash tools/verify-deploy.sh
          "${{ steps.deployment.outputs.page_url }}version.js"
          "$GITHUB_SHA" production "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
