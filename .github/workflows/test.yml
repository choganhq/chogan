name: تست

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: موتور بازی‌ها و بار شدن صفحه‌ها
    runs-on: ubuntu-latest

    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: نصب نود
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: تست موتور بازی‌ها
        run: node tools/test.js

      - name: باز کردن همه‌ی صفحه‌ها در مرورگر بدون سر
        run: ./tools/browser-check.sh
