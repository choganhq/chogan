name: تست

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: موتور بازی‌ها و بار شدن صفحه‌ها
    runs-on: ubuntu-latest

    steps:
      - name: دریافت سورس
        uses: actions/checkout@v7

      - name: نصب نود
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: تست موتور بازی‌ها
        run: node tools/test.js

      - name: باز کردن همه‌ی صفحه‌ها در مرورگر بدون سر
        run: ./tools/browser-check.sh

  android:
    name: بیلد دیباگ اندروید
    runs-on: ubuntu-latest

    steps:
      - name: دریافت سورس
        uses: actions/checkout@v7

      - name: نصب جاوا
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # نسخه‌ی گردل از همان فایلی خوانده می‌شود که اف‌دروید می‌خواند، وگرنه
      # CI با یک نسخه سبز می‌شود و اف‌دروید با نسخه‌ی دیگری می‌سازد.
      - name: خواندن نسخه‌ی گردل از فایل wrapper
        id: gradleversion
        run: |
          set -euo pipefail
          V=$(sed -n 's|.*/gradle-\([0-9][^-]*\)-bin\.zip.*|\1|p' android/gradle/wrapper/gradle-wrapper.properties)
          [ -n "$V" ] || { echo "نسخه‌ی گردل از gradle-wrapper.properties خوانده نشد"; exit 1; }
          echo "نسخه‌ی گردل: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: نصب گریدل
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradleversion.outputs.version }}

      # بیلد دیباگ کلید امضا نمی‌خواهد، پس روی هر PR اجرا می‌شود و ثابت
      # می‌کند پروژه‌ی اندروید واقعاً بیلد می‌شود، نه فقط روی کاغذ درست است.
      - name: بیلد
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: بررسی محتوای APK
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "خروجی: $APK ($(du -h "$APK" | cut -f1))"
          # دارایی‌های وب و فهرست افزونه‌ها باید واقعاً داخل بسته باشند
          unzip -l "$APK" > /tmp/apk.txt
          for f in assets/public/index.html assets/public/games.json \
                   assets/public/lib/chogan.js assets/public/fonts/vazirmatn-variable.woff2 \
                   assets/capacitor.config.json assets/capacitor.plugins.json; do
            grep -q "$f" /tmp/apk.txt || { echo "در APK نیست: $f"; exit 1; }
          done
          for g in tower-defence sudoku minesweeper dots; do
            grep -q "assets/public/games/$g/index.html" /tmp/apk.txt || { echo "بازی در APK نیست: $g"; exit 1; }
          done
          echo "همه‌ی دارایی‌های لازم داخل APK هستند"

      # لیبل لانچر باید با زبان گوشی عوض شود. تست‌های فایلی فقط منابع را
      # می‌بینند؛ اینجا از خود APK بیلدشده می‌پرسیم که واقعاً هر دو تا آمده‌اند.
      - name: بررسی نام برنامه در هر دو زبان
        run: |
          set -euo pipefail
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          BADGE=$("$AAPT" dump badging "$APK")
          echo "$BADGE" | grep -E "^application(-label|-label-fa)" || true
          DEF=$(echo "$BADGE" | sed -n "s/^application-label:'\(.*\)'$/\1/p")
          FA=$(echo "$BADGE" | sed -n "s/^application-label-fa:'\(.*\)'$/\1/p")
          [ "$DEF" = "Chogan" ] || { echo "نام پیش‌فرض «$DEF» است نه Chogan"; exit 1; }
          [ "$FA" = "چوگان" ] || { echo "نام فارسی «$FA» است نه چوگان"; exit 1; }
          echo "پیش‌فرض: $DEF · فارسی: $FA"

      - name: بررسی مجوزهای بسته
        run: |
          set -euo pipefail
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          DUMP=$("$AAPT" dump permissions "$APK")
          echo "$DUMP"
          # فقط مجوزهای سیستمی مهم‌اند. اندروایکس برای اپ‌هایی که هدفشان API 33
          # به بالاست خودش یک مجوز با نام بسته‌ی خودمان تعریف می‌کند
          # (DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION) که مجوز سیستمی نیست.
          SYS=$(echo "$DUMP" | grep -oE "android\.permission\.[A-Z_]+" | sort -u | tr '\n' ' ' | sed 's/ $//')
          echo "مجوزهای سیستمی: ${SYS:-هیچ}"
          if [ "$SYS" != "android.permission.VIBRATE" ]; then
            echo "مجموعه‌ی مجوزهای سیستمی آن چیزی نیست که باید باشد"
            exit 1
          fi
          echo "فقط مجوز لرزش، همان‌طور که باید"
