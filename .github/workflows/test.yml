name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Game engines and page loads
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test game engines
        run: node tools/test.js

      - name: Load every page in headless Chrome
        run: ./tools/browser-check.sh

  android:
    name: Android debug build
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The Gradle version comes from the same file F-Droid reads; otherwise CI
      # goes green on one version while F-Droid builds with another (#42).
      - name: Read Gradle version from the wrapper
        id: gradleversion
        run: |
          set -euo pipefail
          V=$(sed -n 's|.*/gradle-\([0-9][^-]*\)-bin\.zip.*|\1|p' android/gradle/wrapper/gradle-wrapper.properties)
          [ -n "$V" ] || { echo "Could not read the Gradle version from gradle-wrapper.properties"; exit 1; }
          echo "Gradle version: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradleversion.outputs.version }}

      # A debug build needs no signing key, so it runs on every PR and proves the
      # Android project really builds, not only that it looks right on paper.
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Check APK contents
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "Output: $APK ($(du -h "$APK" | cut -f1))"
          # The web assets and the plugin list must really be inside the package
          unzip -l "$APK" > /tmp/apk.txt
          for f in assets/public/index.html assets/public/games.json \
                   assets/public/lib/chogan.js assets/public/fonts/vazirmatn-variable.woff2 \
                   assets/capacitor.config.json assets/capacitor.plugins.json; do
            grep -q "$f" /tmp/apk.txt || { echo "Missing from the APK: $f"; exit 1; }
          done
          for g in tower-defence sudoku minesweeper dots; do
            grep -q "assets/public/games/$g/index.html" /tmp/apk.txt || { echo "Game missing from the APK: $g"; exit 1; }
          done
          echo "All required assets are inside the APK"

      # The launcher label must follow the phone's language. File tests only see
      # the resources; here the built APK itself is asked whether both arrived.
      - name: Check the app name in both languages
        run: |
          set -euo pipefail
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          BADGE=$("$AAPT" dump badging "$APK")
          echo "$BADGE" | grep -E "^application(-label|-label-fa)" || true
          DEF=$(echo "$BADGE" | sed -n "s/^application-label:'\(.*\)'$/\1/p")
          FA=$(echo "$BADGE" | sed -n "s/^application-label-fa:'\(.*\)'$/\1/p")
          [ "$DEF" = "Chogan" ] || { echo "Default name is \"$DEF\", not Chogan"; exit 1; }
          [ "$FA" = "چوگان" ] || { echo "Persian name is \"$FA\", not the expected one"; exit 1; }
          echo "Default: $DEF · Persian: $FA"

      - name: Check package permissions
        run: |
          set -euo pipefail
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          DUMP=$("$AAPT" dump permissions "$APK")
          echo "$DUMP"
          # Only system permissions matter. For apps targeting API 33+, AndroidX
          # defines its own permission under our package name
          # (DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION), which is not a system one.
          SYS=$(echo "$DUMP" | grep -oE "android\.permission\.[A-Z_]+" | sort -u | tr '\n' ' ' | sed 's/ $//')
          echo "System permissions: ${SYS:-none}"
          if [ "$SYS" != "android.permission.VIBRATE" ]; then
            echo "The set of system permissions is not what it should be"
            exit 1
          fi
          echo "Only the vibrate permission, as it should be"

  # The web deploys only after the tests and the Android build pass on this same
  # commit. pages.yml used to run separately, alongside the tests, so a merge
  # whose tests failed on main still reached users (#52). After the deploy the
  # served file is read back and compared with this commit and this run; a green
  # deploy-pages only means the upload was accepted, not that the site changed.
  pages:
    name: Deploy web to GitHub Pages
    needs: [test, android]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      # deploy-pages needs this from v4 on
      actions: read
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Every deploy renames the service worker cache and makes every user fetch
      # the shell again, so a merge that only touched docs or Android is not
      # deployed. The decision lives in tools/web-changed.sh so tools/test.js can
      # run it against a real scratch repository; no test could reach it in YAML.
      - name: Did anything in the web app change?
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: bash tools/web-changed.sh >> "$GITHUB_OUTPUT"

      # Pages is deliberately off on the template repository. Without this check
      # the job would fail red; here it is skipped with a message.
      - name: Check that Pages is enabled
        id: pages
        if: steps.changed.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "GitHub Pages is not enabled on this repository. Skipping the web deploy."
            echo "To enable it: Settings → Pages → Source: GitHub Actions"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: steps.changed.outputs.deploy == 'true' && steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

      # The stamping logic lives in tools/stamp-version.sh so tools/test.js tests
      # exactly what runs here. Actions provides GITHUB_SHA, GITHUB_RUN_ID and
      # GITHUB_RUN_ATTEMPT; the environment name is explicit so it is never guessed.
      - name: Stamp the deploy identity on the web build
        if: steps.changed.outputs.deploy == 'true' && steps.pages.outputs.enabled == 'true'
        env:
          APP_ENV: production
        run: bash tools/stamp-version.sh www/version.js

      - name: Package www
        if: steps.changed.outputs.deploy == 'true' && steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: www

      - name: Deploy
        id: deployment
        if: steps.changed.outputs.deploy == 'true' && steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v5

      # The comparison is against the expected values, not against what this build
      # says about itself. Pages takes seconds to minutes to serve the new version,
      # so the script retries up to a fixed limit and then fails.
      - name: Check that the site serves this commit and this run
        if: steps.changed.outputs.deploy == 'true' && steps.pages.outputs.enabled == 'true'
        run: >-
          bash tools/verify-deploy.sh
          "${{ steps.deployment.outputs.page_url }}version.js"
          "$GITHUB_SHA" production "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
