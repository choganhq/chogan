name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test game engines
        run: node tools/test.js
      - name: Load every page in headless Chrome
        run: ./tools/browser-check.sh

  apk:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Read version and match it to the tag
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/^self\.APP_VERSION *= *'\([^']*\)'.*/\1/p" www/version.js)
          VERSION_CODE=$(sed -n "s/^self\.APP_VERSION_CODE *= *\([0-9]*\).*/\1/p" www/version.js)
          APP_ID=$(python3 -c "import json;print(json.load(open('capacitor.config.json'))['appId'])")
          if [ -z "$VERSION" ] || [ -z "$VERSION_CODE" ]; then
            echo "Could not read the version from www/version.js"; exit 1
          fi
          # Tags ending in -test are trial builds: they skip the version match and
          # publish as a pre-release so they never mix with a real release.
          case "$GITHUB_REF_NAME" in
            *-test)
              echo "Trial build for tag ${GITHUB_REF_NAME}"
              echo "IS_TEST=1" >> "$GITHUB_ENV"
              ;;
            *)
              if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
                echo "Tag ${GITHUB_REF_NAME} does not match www/version.js (v$VERSION)"
                exit 1
              fi
              echo "IS_TEST=0" >> "$GITHUB_ENV"
              ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The Gradle version comes from the same file F-Droid reads; otherwise CI
      # goes green on one version while F-Droid builds with another (#42).
      - name: Read Gradle version from the wrapper
        id: gradleversion
        run: |
          set -euo pipefail
          V=$(sed -n 's|.*/gradle-\([0-9][^-]*\)-bin\.zip.*|\1|p' android/gradle/wrapper/gradle-wrapper.properties)
          [ -n "$V" ] || { echo "Could not read the Gradle version from gradle-wrapper.properties"; exit 1; }
          echo "Gradle version: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradleversion.outputs.version }}

      - name: Restore the signing key from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 is not set."
            echo "The four signing secrets must be set at the choganhq org level, available to public repositories:"
            echo "  base64 -w0 <keystore> | gh secret set ANDROID_KEYSTORE_BASE64 --org choganhq --visibility all"
            echo "  gh secret set ANDROID_KEYSTORE_PASSWORD --org choganhq --visibility all"
            echo "  gh secret set ANDROID_KEY_ALIAS         --org choganhq --visibility all"
            echo "  gh secret set ANDROID_KEY_PASSWORD      --org choganhq --visibility all"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Check signature and name the file
        run: |
          set -euo pipefail
          SRC=android/app/build/outputs/apk/release/app-release.apk
          if [ "$IS_TEST" = "1" ]; then
            APK="${APP_ID}-${VERSION}-test.apk"
          else
            APK="${APP_ID}-${VERSION}.apk"
          fi
          mv "$SRC" "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$IS_TEST" = "1" ]; then
            gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME}" --prerelease \
              --notes "Trial build for checking the workflow. Delete it when you are done:
            gh release delete ${GITHUB_REF_NAME} --cleanup-tag --yes" || true
          else
            # GitHub release notes are English for a global audience; the Persian
            # changelog stays in place for F-Droid.
            NOTES="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
            if [ -f "$NOTES" ]; then
              gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME}" --notes-file "$NOTES" \
                || gh release edit "$GITHUB_REF_NAME" --notes-file "$NOTES"
            else
              gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME}" --generate-notes || true
            fi
          fi
          gh release upload "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --clobber
