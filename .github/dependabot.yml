# به‌روزرسانی خودکار وابستگی‌ها. فقط PR باز می‌کند؛ هیچ‌چیز خودکار مرج نمی‌شود،
# چون بالا بردن افزونه‌ی گریدل یا خود گریدل می‌تواند بیلد تکرارپذیر اف‌دروید را
# بشکند و باید یکی نگاهش کند. ماهانه، تا صف PR شلوغ نشود.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    labels: [dependencies]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    labels: [dependencies]
