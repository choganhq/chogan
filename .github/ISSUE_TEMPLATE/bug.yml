name: Bug report
description: Something in a game or the app does not work as it should.
body:
  - type: markdown
    attributes:
      value: Any language is fine. A screenshot or a short video helps a lot.
  - type: input
    id: where
    attributes:
      label: Game or screen
      placeholder: e.g. Sudoku, the menu, the profile
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: "1. Open ...\n2. Tap ...\n3. ..."
  - type: input
    id: device
    attributes:
      label: Device and version
      description: The version is on the profile page.
      placeholder: e.g. Android 14, app 0.20.0 / Firefox on Windows, web
