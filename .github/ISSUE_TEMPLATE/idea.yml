name: New game or idea
description: Suggest a game or an improvement.
body:
  - type: markdown
    attributes:
      value: |
        Any language is fine. Chogan stays free, offline, with no ads, no tracking and no new permissions, so ideas that need a server or the internet cannot be taken up.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: For a game, how it is played and what makes it fun. A link to the rules or a similar game helps.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would be good for Chogan
