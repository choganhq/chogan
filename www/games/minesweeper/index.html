<script>
/* ==== ENGINE START ==== */
function MinesEngineFactory() {
  'use strict';

  function makeNeighbors(rows, cols) {
    var nb = new Array(rows * cols);
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var list = [];
        for (var dr = -1; dr <= 1; dr++) {
          for (var dc = -1; dc <= 1; dc++) {
            if (!dr && !dc) continue;
            var rr = r + dr, cc = c + dc;
            if (rr < 0 || cc < 0 || rr >= rows || cc >= cols) continue;
            list.push(rr * cols + cc);
          }
        }
        nb[r * cols + c] = list;
      }
    }
    return nb;
  }

  function layMines(rows, cols, mines, safe, nb, rnd) {
    var n = rows * cols;
    var banned = {};
    banned[safe] = 1;
    nb[safe].forEach(function (i) { banned[i] = 1; });
    var pool = [];
    for (var i = 0; i < n; i++) if (!banned[i]) pool.push(i);
    for (var k = pool.length - 1; k > 0; k--) {
      var j = Math.floor(rnd() * (k + 1));
      var t = pool[k]; pool[k] = pool[j]; pool[j] = t;
    }
    var mine = new Uint8Array(n);
    for (var m = 0; m < mines && m < pool.length; m++) mine[pool[m]] = 1;
    return mine;
  }

  function counts(mine, nb) {
    var num = new Uint8Array(mine.length);
    for (var i = 0; i < mine.length; i++) {
      if (mine[i]) { num[i] = 9; continue; }
      var c = 0;
      var list = nb[i];
      for (var j = 0; j < list.length; j++) if (mine[list[j]]) c++;
      num[i] = c;
    }
    return num;
  }

  function floodOpen(idx, mine, num, nb, revealed) {
    var stack = [idx];
    while (stack.length) {
      var i = stack.pop();
      if (revealed[i] || mine[i]) continue;
      revealed[i] = 1;
      if (num[i] === 0) {
        var list = nb[i];
        for (var j = 0; j < list.length; j++) if (!revealed[list[j]]) stack.push(list[j]);
      }
    }
  }

  /* حل‌کننده‌ی قطعی: فقط استنتاج، بدون حدس.
     قانون‌ها: شمارش ساده، زیرمجموعه‌ی محدودیت‌ها، و شمارش کل مین‌های باقی‌مانده. */
  function solvable(mine, num, nb, rows, cols, first) {
    var n = rows * cols;
    var revealed = new Uint8Array(n);
    var flagged = new Uint8Array(n);
    floodOpen(first, mine, num, nb, revealed);
    var totalMines = 0;
    for (var i = 0; i < n; i++) if (mine[i]) totalMines++;

    for (;;) {
      var progress = false;

      // محدودیت‌های فعال
      var cons = [];
      for (var c = 0; c < n; c++) {
        if (!revealed[c] || num[c] === 0) continue;
        var hidden = [], fl = 0;
        var list = nb[c];
        for (var j = 0; j < list.length; j++) {
          var x = list[j];
          if (flagged[x]) fl++;
          else if (!revealed[x]) hidden.push(x);
        }
        if (!hidden.length) continue;
        cons.push({ cells: hidden, mines: num[c] - fl });
      }

      // قانون یک: همه امن یا همه مین
      for (var k = 0; k < cons.length; k++) {
        var q = cons[k];
        if (q.mines === 0) {
          for (var a = 0; a < q.cells.length; a++) {
            if (!revealed[q.cells[a]]) { floodOpen(q.cells[a], mine, num, nb, revealed); progress = true; }
          }
        } else if (q.mines === q.cells.length) {
          for (var b = 0; b < q.cells.length; b++) {
            if (!flagged[q.cells[b]]) { flagged[q.cells[b]] = 1; progress = true; }
          }
        }
      }
      if (progress) continue;

      // قانون دو: زیرمجموعه
      for (var x1 = 0; x1 < cons.length && !progress; x1++) {
        for (var x2 = 0; x2 < cons.length && !progress; x2++) {
          if (x1 === x2) continue;
          var A = cons[x1], B = cons[x2];
          if (A.cells.length >= B.cells.length) continue;
          var setB = {};
          for (var s = 0; s < B.cells.length; s++) setB[B.cells[s]] = 1;
          var sub = true;
          for (var s2 = 0; s2 < A.cells.length; s2++) if (!setB[A.cells[s2]]) { sub = false; break; }
          if (!sub) continue;
          var diff = B.cells.filter(function (v) { return A.cells.indexOf(v) < 0; });
          var dm = B.mines - A.mines;
          if (dm === 0) {
            for (var d1 = 0; d1 < diff.length; d1++) if (!revealed[diff[d1]]) { floodOpen(diff[d1], mine, num, nb, revealed); progress = true; }
          } else if (dm === diff.length) {
            for (var d2 = 0; d2 < diff.length; d2++) if (!flagged[diff[d2]]) { flagged[diff[d2]] = 1; progress = true; }
          }
        }
      }
      if (progress) continue;

      // قانون سه: شمارش کل
      var hiddenAll = [], flags = 0;
      for (var h = 0; h < n; h++) {
        if (flagged[h]) flags++;
        else if (!revealed[h]) hiddenAll.push(h);
      }
      var left = totalMines - flags;
      if (hiddenAll.length && left === 0) {
        for (var z = 0; z < hiddenAll.length; z++) { floodOpen(hiddenAll[z], mine, num, nb, revealed); }
        progress = true;
      } else if (hiddenAll.length && left === hiddenAll.length) {
        for (var z2 = 0; z2 < hiddenAll.length; z2++) flagged[hiddenAll[z2]] = 1;
        progress = true;
      }
      if (!progress) break;
    }

    for (var f = 0; f < n; f++) if (!mine[f] && !revealed[f]) return false;
    return true;
  }

  // تولید تخته. اگر noGuess باشد تا سقف زمانی و تعداد تلاش می‌کند
  // و اگر نشد تخته‌ی معمولی می‌دهد و در خروجی می‌گوید.
  function generate(opts) {
    var rows = opts.rows, cols = opts.cols, mines = opts.mines;
    var rnd = opts.rnd, safe = opts.safe;
    var nb = opts.nb || makeNeighbors(rows, cols);
    var noGuess = opts.noGuess !== false;
    var budget = opts.budgetMs || 1200;
    var maxTries = opts.maxTries || 400;
    var t0 = Date.now();
    var fallback = null;
    for (var tries = 1; tries <= (noGuess ? maxTries : 1); tries++) {
      var mine = layMines(rows, cols, mines, safe, nb, rnd);
      var num = counts(mine, nb);
      if (!noGuess) return { mine: mine, num: num, nb: nb, noGuess: false, tries: tries };
      if (!fallback) fallback = { mine: mine, num: num };
      if (solvable(mine, num, nb, rows, cols, safe)) {
        return { mine: mine, num: num, nb: nb, noGuess: true, tries: tries, ms: Date.now() - t0 };
      }
      if (Date.now() - t0 > budget) break;
    }
    return { mine: fallback.mine, num: fallback.num, nb: nb, noGuess: false, failed: noGuess, ms: Date.now() - t0 };
  }

  // یک خانه‌ی امن و بسته برای راهنمایی؛ ترجیحاً کنار یک عدد باز
  function safeHint(mine, revealed, flagged, nb, rnd) {
    var edge = [], any = [];
    for (var i = 0; i < mine.length; i++) {
      if (revealed[i] || flagged[i] || mine[i]) continue;
      any.push(i);
      var list = nb[i];
      for (var j = 0; j < list.length; j++) if (revealed[list[j]]) { edge.push(i); break; }
    }
    var pool = edge.length ? edge : any;
    if (!pool.length) return -1;
    return pool[Math.floor((rnd ? rnd() : Math.random()) * pool.length)];
  }

  // کدام لبه‌ی تخته ستون پنهان دارد. گوشی نوار اسکرول نمی‌کشد، پس بی نشانه
  // ستون سیزدهمِ تخته‌ی ۱۶تایی آخرین ستون به نظر می‌آمد و عددهایش غلط (#101).
  // در راست‌چین کروم scrollLeft از صفر به منفی می‌رود.
  function scrollEdges(scrollLeft, scrollWidth, clientWidth, rtl) {
    var max = scrollWidth - clientWidth;
    if (max <= 1) return { left: false, right: false };
    var pos = Math.min(max, Math.abs(scrollLeft));
    var atStart = pos > 1, atEnd = pos < max - 1;
    return rtl ? { left: atEnd, right: atStart } : { left: atStart, right: atEnd };
  }

  // Where an arrow key takes the cursor, or -1 for any other key. Left and right
  // used to add ±1 and ran on into the next row at the board's edge (#328).
  function step(cursor, key, rows, cols, rtl) {
    var r = Math.floor(cursor / cols), c = cursor % cols;
    if (key === 'ArrowUp') r = Math.max(0, r - 1);
    else if (key === 'ArrowDown') r = Math.min(rows - 1, r + 1);
    else if (key === 'ArrowLeft') c = Math.max(0, Math.min(cols - 1, c + (rtl ? 1 : -1)));
    else if (key === 'ArrowRight') c = Math.max(0, Math.min(cols - 1, c + (rtl ? -1 : 1)));
    else return -1;
    return r * cols + c;
  }

  // Cell size for the room there is, width and height. Cells were sized by width alone, so a
  // 16-row board at 38px ran off a 650px-high window, under a page that does not scroll, and
  // its last rows could not be reached at all (#350). Below MIN a cell is too small to tap, so
  // the board keeps MIN and scrolls inside its frame, limited to the height there is.
  // Cells grow to 64px on a big screen; at 42 a laptop showed the board in half its height (#359)
  var CELL_MIN = 26, CELL_MAX = 64, GAP = 2;
  function fit(roomW, roomH, rows, cols) {
    var byW = Math.floor((roomW - cols * GAP) / cols), byH = Math.floor((roomH - rows * GAP) / rows);
    var cs = Math.max(CELL_MIN, Math.min(CELL_MAX, byW, byH > 0 ? byH : CELL_MAX));
    var h = rows * (cs + GAP);
    return { cs: cs, maxH: h > roomH && roomH > 0 ? Math.max(roomH, 4 * (CELL_MIN + GAP)) : 0 };
  }

  var api = {
    makeNeighbors: makeNeighbors, layMines: layMines, counts: counts,
    floodOpen: floodOpen, solvable: solvable, generate: generate, safeHint: safeHint,
    scrollEdges: scrollEdges, step: step, fit: fit
  };
  if (typeof self !== 'undefined') self.MinesEngine = api;
  return api;
}
if (typeof module !== 'undefined' && module.exports) module.exports = MinesEngineFactory;
/* ==== ENGINE END ==== */
</script>

        longPress: 'Mantén pulsado para poner bandera', holdFlag: 'Mantén pulsado para bandera', safeShown: 'Se reveló una casilla segura',
        dailyMines: 'Buscaminas diario',
        tutTitle1: 'El objetivo', tutText1: 'Abre todas las casillas sin mina. Cada número indica cuántas minas tocan esa casilla.',
        tutTitle2: 'Banderas', tutText2: 'Marca una casilla de la que estés seguro: con el modo bandera o manteniendo pulsado.',
        tutTitle3: 'Sin adivinar', tutText3: 'Los tableros se generan para que siempre se puedan resolver solo con lógica.'
      }
    }
  });

  var params = new URLSearchParams(location.search);
  var dailyDate = params.get('daily');
  var prefs = ctx.store.get('prefs', { size: 'small', custom: { rows: 12, cols: 12, mines: 24 } });

  var S = null, cells = [], timerId = null, flagMode = false, cursor = 0, lastAt = -1, pressTimer = null, longFired = false;
  // how long a press must last to flag, on the screen and on Space or Enter alike (#346)
  var LONG_MS = 420, keyHold = null;

  var board = el('div', { class: 'ms-board', role: 'grid' });
  var scroll = el('div', { class: 'ms-scroll' }, [board]);
  var frame = el('div', { class: 'ms-frame' }, [scroll]);
  var top = el('div', { class: 'ms-top' });
  var tools = el('div', { class: 'ms-tools' });
  var wrap = el('div', { class: 'ms-wrap' }, [top, frame, tools]);

  var flagBtn = el('button', { class: 'ch-btn ch-btn--soft ms-flagbtn', type: 'button' },
    [C.icon('flag', 20), el('span', { text: C.t('flagMode') })]);
  flagBtn.setAttribute('aria-pressed', 'false');
  flagBtn.addEventListener('click', function () {
    flagMode = !flagMode;
    flagBtn.setAttribute('aria-pressed', flagMode ? 'true' : 'false');
    flagBtn.className = 'ch-btn ms-flagbtn ' + (flagMode ? 'ch-btn--primary' : 'ch-btn--soft');
    C.feedback('select');
  });
  var hintBtn = el('button', { class: 'ch-btn ch-btn--soft', type: 'button' },
    [C.icon('bulb', 20), el('span', { text: C.t('hint') }), el('span', { class: 'ch-badge ch-badge--gold', text: C.num(HINT_COST) })]);
  hintBtn.addEventListener('click', function () { hint(); });
  tools.appendChild(flagBtn);
  tools.appendChild(hintBtn);

  ctx.stat('mines', C.t('minesLeft'));
  ctx.stat('time', C.t('time'));
  ctx.button({ icon: 'help', label: C.t('help'), onClick: showHelp });
  ctx.button({ icon: 'refresh', label: C.t('newBoard'), onClick: askNew });
  ctx.main.appendChild(wrap);
  ctx.mount();

  /* ------------------------------------------------------------ ساخت */

  function spec() {
    if (S && S.spec) return S.spec;
    if (prefs.size === 'custom') return prefs.custom;
    return SIZES[prefs.size] || SIZES.small;
  }

  function newGame(sizeKey, seedRng, daily) {
    var sp = sizeKey === 'custom' ? prefs.custom : (SIZES[sizeKey] || SIZES.small);
    S = {
      sizeKey: sizeKey, spec: { rows: sp.rows, cols: sp.cols, mines: sp.mines },
      daily: daily || null,
      seed: null,
      started: false, done: false, won: false,
      elapsed: 0, flags: 0, hints: 0, noGuess: null,
      mine: null, num: null,
      revealed: [], flagged: [],
    };
    S.nbRows = sp.rows; S.nbCols = sp.cols;
    cursor = 0; lastAt = -1;
    S.revealed = new Array(sp.rows * sp.cols).fill(0);
    S.flagged = new Array(sp.rows * sp.cols).fill(0);
    S.pendingRng = seedRng || null;
    buildBoard();
    render();
    stopTimer();
    ctx.setStat('time', C.time(0));
    save();
  }

  function firstClick(idx) {
    var sp = S.spec;
    var nb = E.makeNeighbors(sp.rows, sp.cols);
    var rnd = S.pendingRng || function () { return Math.random(); };
    var g = E.generate({
      rows: sp.rows, cols: sp.cols, mines: sp.mines, rnd: rnd, safe: idx, nb: nb,
      noGuess: true, budgetMs: 1500, maxTries: 500
    });
    S.mine = Array.prototype.slice.call(g.mine);
    S.num = Array.prototype.slice.call(g.num);
    S.noGuess = !!g.noGuess;
    S.started = true;
    S.startedAt = Date.now();
    if (!S.noGuess) C.ui.toast({ icon: 'info', title: C.t('guessy'), ms: 2600 });
    startTimer();
    render();   // نشان «بدون حدس» تا حالا فقط بعد از بارگذاری دوباره می‌آمد
  }

  function neighbors(i) {
    var sp = S.spec, r = (i / sp.cols) | 0, c = i % sp.cols, out = [];
    for (var dr = -1; dr <= 1; dr++) {
      for (var dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        var rr = r + dr, cc = c + dc;
        if (rr < 0 || cc < 0 || rr >= sp.rows || cc >= sp.cols) continue;
        out.push(rr * sp.cols + cc);
      }
    }
    return out;
  }

  /* ------------------------------------------------------------ رابط */

  function buildBoard() {
    var sp = S.spec;
    board.innerHTML = '';
    cells = [];
    board.style.setProperty('--cols', sp.cols);
    sizeCells();
    for (var i = 0; i < sp.rows * sp.cols; i++) {
      (function (idx) {
        var b = el('button', { class: 'ms-cell', type: 'button', role: 'gridcell' });
        // Tab and the arrows used to select two different cells, and Enter opened the
        // tabbed one (#331): focus and the cursor are now always the same cell
        b.addEventListener('focus', function () {
          if (cursor !== idx) { cursor = idx; paint(); }
        });
        b.addEventListener('pointerdown', function (e) {
          longFired = false;
          if (e.pointerType !== 'mouse') {
            pressTimer = setTimeout(function () { longFired = true; toggleFlag(idx); }, LONG_MS);
          }
        });
        b.addEventListener('pointerup', function () { clearTimeout(pressTimer); });
        b.addEventListener('pointercancel', function () { clearTimeout(pressTimer); });
        b.addEventListener('pointerleave', function () { clearTimeout(pressTimer); });
        b.addEventListener('contextmenu', function (e) {
          e.preventDefault();
          clearTimeout(pressTimer);
          // روی اندروید لمس طولانی هم تایمر ما را می‌زند هم contextmenu مرورگر را.
          // محافظ را اینجا صفر نمی‌کنیم: click بعدی هم باید مسدود بماند، وگرنه
          // برداشتن پرچم با لمس طولانی همان خانه را هم باز می‌کرد.
          // longFired در هر pointerdown خودش صفر می‌شود.
          if (longFired) return;
          toggleFlag(idx);
        });
        b.addEventListener('click', function () {
          if (longFired) { longFired = false; return; }
          cursor = idx;
          if (flagMode && !S.revealed[idx]) toggleFlag(idx);
          else tap(idx);
        });
        cells.push(b);
        board.appendChild(b);
      })(i);
    }
    roundCorners();    // sizeCells پیش از ساختن خانه‌ها اجرا می‌شود و تخته‌ی خالی را می‌سنجد
    markEdges();
  }

  // شعاع گوشه‌های بیرونی روی چهار خانه‌ی گوشه، هم‌مرکز با قاب.
  // ابعاد تخته متغیر است پس nth-child ثابت جواب نمی‌دهد.
  // خاصیت‌های منطقی تا در راست‌به‌چپ گوشه‌ی درست گرد شود.
  function roundCorners() {
    var sp = S.spec, r = 'var(--ms-inner-r)';
    var map = [
      [0, 'border-start-start-radius'],
      [sp.cols - 1, 'border-start-end-radius'],
      [(sp.rows - 1) * sp.cols, 'border-end-start-radius'],
      [sp.rows * sp.cols - 1, 'border-end-end-radius']
    ];
    for (var k = 0; k < map.length; k++) {
      var c = cells[map[k][0]];
      if (c) c.style.setProperty(map[k][1], r);
    }
  }

  // The height left for the board: the game area less its padding and everything in the
  // column that is not the board (the size picker, the tools, the gaps between them)
  function roomH() {
    var cs = getComputedStyle(ctx.main);
    var inner = ctx.main.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    return Math.floor(inner - (wrap.offsetHeight - scroll.offsetHeight) - 6);
  }
  // and the width: the game area's, less its padding, not a fixed 640px (#359)
  function roomW() {
    var cs = getComputedStyle(ctx.main);
    return Math.floor(ctx.main.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 6);
  }
  function sizeCells() {
    var sp = S.spec;
    var f = E.fit(roomW(), roomH(), sp.rows, sp.cols);
    board.style.setProperty('--cs', f.cs + 'px');
    scroll.style.maxHeight = f.maxH ? f.maxH + 'px' : '';
    markEdges();
  }
  window.addEventListener('resize', function () { if (S) sizeCells(); });

  function markEdges() {
    var rtl = getComputedStyle(scroll).direction === 'rtl';
    var e = E.scrollEdges(scroll.scrollLeft, scroll.scrollWidth, scroll.clientWidth, rtl);
    frame.classList.toggle('ms-more-left', e.left);
    frame.classList.toggle('ms-more-right', e.right);
  }
  scroll.addEventListener('scroll', markEdges, { passive: true });

  function render() {
    top.innerHTML = '';
    if (S.daily) {
      top.appendChild(el('span', { class: 'ch-badge ch-badge--accent' },
        [C.icon('calendar', 14), el('span', { text: C.t('dailyMines') + ' — ' + C.num(S.daily) })]));
    } else {
      top.appendChild(C.ui.segmented(
        ['small', 'medium', 'large', 'custom'].map(function (k) { return { value: k, label: C.t(k) }; }),
        S.sizeKey,
        function (v) {
          if (v === S.sizeKey && v !== 'custom') return;
          var go = function () {
            prefs.size = v; ctx.store.set('prefs', prefs);
            if (v === 'custom') customModal(); else newGame(v);
          };
          // تخته‌ی شروع‌شده نباید بی‌هشدار برود
          if (S.started && !S.done) {
            C.ui.confirm({ title: C.t('newBoard'), body: C.t('resetWarn'), onOk: go, onCancel: function () { render(); } });
            render();
            return;
          }
          go();
        }
      ));
    }
    if (S.noGuess === true) top.appendChild(el('span', { class: 'ch-badge ch-badge--good', text: C.t('noGuess') }));
    paint();
  }

  function paint() {
    var sp = S.spec;
    for (var i = 0; i < sp.rows * sp.cols; i++) {
      var b = cells[i];
      if (!b) continue;
      var cls = 'ms-cell';
      b.innerHTML = '';
      if (S.revealed[i]) {
        cls += ' ms-cell--open';
        var v = S.num ? S.num[i] : 0;
        if (v > 0 && v < 9) { cls += ' ms-n' + v; b.textContent = C.num(v); }
        if (S.mine && S.mine[i]) { cls += ' ms-cell--mine'; b.appendChild(C.icon('mine', 18)); }
      } else if (S.flagged[i]) {
        cls += ' ms-cell--flag';
        b.appendChild(C.icon('flag', 18));
        if (S.done && S.mine && !S.mine[i]) cls += ' ms-cell--wrong';
      }
      if (i === cursor && document.documentElement.dataset.kb === '1') cls += ' ms-cell--cursor';
      b.className = cls;
      b.tabIndex = i === cursor ? 0 : -1;
    }
    ctx.setStat('mines', Math.max(0, sp.mines - S.flags));
  }

  /* ----------------------------------------------------------- حرکت */

  function tap(idx) {
    if (S.done) return;
    // خانه‌ی پرچم‌دار نباید اولین کلیک حساب شود: تخته ساخته و زمان‌سنج
    // روشن می‌شد بدون اینکه چیزی باز شود.
    if (S.flagged[idx]) return;
    if (!S.started) { firstClick(idx); }
    if (S.revealed[idx]) { chord(idx); return; }
    if (S.mine[idx]) { lose(idx); return; }
    lastAt = idx;
    var order = openFrom(idx);
    animate(order);
    C.feedback('tap');
    C.audio.sfx('dig');
    checkWin();
    save();
  }

  function openFrom(idx) {
    var order = [], stack = [idx];
    while (stack.length) {
      var i = stack.shift();
      if (S.revealed[i] || S.flagged[i] || S.mine[i]) continue;
      S.revealed[i] = 1;
      order.push(i);
      if (S.num[i] === 0) neighbors(i).forEach(function (n) { if (!S.revealed[n]) stack.push(n); });
    }
    return order;
  }

  function animate(order) {
    paint();
    if (C.ui.reduceMotion() || order.length < 2) return;
    for (var k = 0; k < order.length; k++) {
      var b = cells[order[k]];
      if (!b) continue;
      b.classList.add('ms-pop');
      b.style.animationDelay = Math.min(k * 9, 420) + 'ms';
      (function (node) {
        setTimeout(function () { node.classList.remove('ms-pop'); node.style.animationDelay = ''; }, 700);
      })(b);
    }
  }

  function chord(idx) {
    if (!S.num || S.num[idx] <= 0 || S.num[idx] > 8) return;
    var nb = neighbors(idx);
    var flags = 0, hidden = [];
    nb.forEach(function (n) { if (S.flagged[n]) flags++; else if (!S.revealed[n]) hidden.push(n); });
    if (flags !== S.num[idx] || !hidden.length) { C.audio.sfx('tap'); return; }
    var hitMine = -1;
    var order = [];
    hidden.forEach(function (n) {
      if (S.mine[n]) { hitMine = n; return; }
      order = order.concat(openFrom(n));
    });
    if (hitMine >= 0) { lose(hitMine); return; }
    lastAt = idx;
    animate(order);
    C.feedback('tap');
    checkWin();
    save();
  }

  function toggleFlag(idx) {
    if (S.done || S.revealed[idx]) return;
    S.flagged[idx] = S.flagged[idx] ? 0 : 1;
    S.flags += S.flagged[idx] ? 1 : -1;
    C.audio.sfx('flag');
    C.haptic('select');
    paint();
    if (S.flagged[idx] && cells[idx]) cells[idx].classList.add('ms-flagin');
    save();
  }

  function hint() {
    if (!S || S.done) return;
    if (!S.started) { C.ui.toast({ icon: 'info', title: C.t('chordHint') }); return; }
    if (!C.coins.can(HINT_COST)) {
      C.feedback('bad');
      C.ui.toast({ icon: 'coin', title: C.t('notEnoughCoins'), sub: C.t('playToEarn') });
      return;
    }
    var i = E.safeHint(S.mine, S.revealed, S.flagged, neighborsArray(), null);
    if (i < 0) return;
    C.coins.spend(HINT_COST);
    S.hints++;
    lastAt = i;
    var order = openFrom(i);
    animate(order);
    if (cells[i]) {
      cells[i].classList.add('ms-cell--hint');
      setTimeout(function () { if (cells[i]) cells[i].classList.remove('ms-cell--hint'); }, 1400);
    }
    C.feedback('coin');
    C.ui.toast({ icon: 'bulb', title: C.t('safeShown') });
    checkWin();
    save();
  }
  function neighborsArray() {
    var sp = S.spec, out = [];
    for (var i = 0; i < sp.rows * sp.cols; i++) out.push(neighbors(i));
    return out;
  }

  function lose(idx) {
    S.done = true; S.won = false;
    stopTimer();
    // عکس وضعیت همین دور، چون پنجره ۶۲۰ میلی‌ثانیه بعد باز می‌شود و تا آن
    // موقع ممکن است تخته‌ی تازه‌ای ساخته شده باشد.
    var snap = { elapsed: S.elapsed, sizeKey: S.sizeKey, daily: S.daily };
    for (var i = 0; i < S.mine.length; i++) if (S.mine[i]) S.revealed[i] = 1;
    paint();
    var spent = blowUp(idx);
    snap.board = boardSnap();
    C.ui.shake(frame);
    C.audio.sfx('boom');
    C.haptic('error');
    ctx.clearSave();
    setTimeout(function () {
      ctx.finish({
        won: false, title: C.t('boom'), timeMs: snap.elapsed,
        coins: 2, points: 4,
        lines: [
          { label: C.t('time'), value: C.time(snap.elapsed) },
          { label: C.t('difficulty'), value: C.t(snap.sizeKey) }
        ],
        paint: cardPaint(snap.board),
        shareText: 'چوگان · مین‌روب ' + C.t(snap.sizeKey) + (snap.daily ? ('\nروزانه ' + snap.daily) : '') +
          '\nروی مین رفتم · زمان ' + C.time(snap.elapsed),
        onAgain: snap.daily ? null : function () { newGame(snap.sizeKey); }
      });
    }, 620 + Math.max(0, spent - 300));
  }

  // The mine that was hit goes off, then the others, nearest first (#398).
  // Returns how long the chain runs, so the result waits for it.
  function blowUp(idx) {
    C.ui.burst(cells[idx], { count: 28, speed: 320, ring: 28, colors: ['#F2B84B', '#E07A5F', '#6B5A4E', '#FFF1C9'] });
    if (C.ui.reduceMotion()) return 0;
    var cols = S.spec.cols, r0 = Math.floor(idx / cols), c0 = idx % cols, list = [];
    for (var i = 0; i < S.mine.length; i++) if (S.mine[i] && i !== idx) list.push(i);
    var dist = function (i) { var dr = Math.floor(i / cols) - r0, dc = i % cols - c0; return dr * dr + dc * dc; };
    list.sort(function (a, b) { return dist(a) - dist(b); });
    var gap = list.length ? Math.min(70, 900 / list.length) : 0;
    list.forEach(function (i, k) {
      var b = cells[i];
      if (!b) return;
      var at = Math.round(160 + k * gap);
      b.classList.add('ms-blow');
      b.style.animationDelay = at + 'ms';
      if (k < 10) setTimeout(function () { if (cells[i] === b && S.done) C.ui.burst(b, { count: 8, speed: 170, size: 2.5 }); }, at);
    });
    return Math.round(160 + list.length * gap);
  }

  // A cleared board answers with a wave from the last cell opened, the mines
  // turning into flags as it passes (#398). Returns how long it runs.
  function sweep() {
    if (C.ui.reduceMotion()) return 0;
    var cols = S.spec.cols, at = lastAt >= 0 ? lastAt : 0, r0 = Math.floor(at / cols), c0 = at % cols, far = 0;
    for (var i = 0; i < cells.length; i++) {
      var b = cells[i];
      if (!b) continue;
      var d = Math.min(16, Math.max(Math.abs(Math.floor(i / cols) - r0), Math.abs(i % cols - c0)));
      far = Math.max(far, d);
      b.classList.add(S.mine[i] ? 'ms-flagin' : 'ms-wave');
      b.style.animationDelay = d * 40 + 'ms';
    }
    return far * 40 + 420;
  }

  function checkWin() {
    var sp = S.spec, total = sp.rows * sp.cols;
    for (var i = 0; i < total; i++) if (!S.mine[i] && !S.revealed[i]) return;
    S.done = true; S.won = true;
    stopTimer();
    for (var j = 0; j < total; j++) if (S.mine[j] && !S.flagged[j]) { S.flagged[j] = 1; S.flags++; }
    paint();
    var wave = sweep();

    var secs = Math.round(S.elapsed / 1000);
    var base = { small: 8, medium: 16, large: 28, custom: 12 }[S.sizeKey] || 10;
    var speed = C.clamp(1.7 - secs / 420, 0.6, 1.7);
    var coins = Math.round(base * speed) + (S.daily ? 8 : 0);
    var points = Math.round(base * 4 * speed) + (S.daily ? 25 : 0);

    var isBest = C.stats.best('minesweeper', 'time-' + S.sizeKey, S.elapsed, true);
    C.achievements.unlock('ms-win');
    if (S.sizeKey === 'large') C.achievements.unlock('ms-large');
    if (S.sizeKey === 'small' && S.elapsed < 30000) C.achievements.unlock('ms-fast');
    if (S.daily) {
      var firstDaily = C.stats.daily('minesweeper', S.daily, { label: C.time(S.elapsed), ms: S.elapsed, size: S.sizeKey });
      if (!firstDaily) { coins = Math.round(coins * 0.2); points = Math.round(points * 0.2); }
    }
    ctx.clearSave();

    var sizeKey = S.sizeKey, daily = S.daily;
    var result = {
      won: true, timeMs: S.elapsed, coins: coins, points: points,
      note: isBest ? C.t('best') + '!' : null,
      lines: [
        { label: C.t('time'), value: C.time(S.elapsed) },
        { label: C.t('difficulty'), value: C.t(S.sizeKey) },
        { label: C.t('hints'), value: C.num(S.hints) }
      ],
      shareText: 'چوگان · مین‌روب ' + C.t(S.sizeKey) + (S.daily ? ('\nروزانه ' + S.daily) : '') +
        '\nزمان ' + C.time(S.elapsed) + ' · راهنمایی ' + C.num(S.hints),
      paint: cardPaint(boardSnap()),
      onAgain: daily ? null : function () { newGame(sizeKey); }
    };
    // the result waits for the wave; everything it shows is fixed already
    if (wave) setTimeout(function () { ctx.finish(result); }, wave); else ctx.finish(result);
  }


  /* ------------------------------------------------- تخته روی کارت نتیجه */
  // مدل را همین‌جا کپی می‌کنیم: پنجره‌ی نتیجه می‌تواند بعد از ساخته شدن
  // تخته‌ی تازه هنوز باز باشد و کارت باید همان دور را نشان بدهد.
  var NUMC = ['', '#4C7DBE', '#4A8A5C', '#C8574B', '#6A4FA3', '#B06B2E', '#2D8C97', '#8A5A44', '#7A6A57'];

  function boardSnap() {
    var sp = S.spec;
    return {
      rows: sp.rows, cols: sp.cols,
      mine: S.mine ? S.mine.slice() : [],
      num: S.num ? S.num.slice() : [],
      revealed: S.revealed.slice(),
      flagged: S.flagged.slice()
    };
  }

  function cardPaint(b) {
    return function (g, W, H, col) {
      var rtl = document.documentElement.dir === 'rtl';
      var cs = Math.min((W - 24) / b.cols, (H - 24) / b.rows);
      var bw = cs * b.cols, bh = cs * b.rows;
      var ox = (W - bw) / 2, oy = (H - bh) / 2;
      var pad = Math.max(0.5, cs * 0.05), rad = Math.max(1.5, cs * 0.16);
      C.rrect(g, ox - 8, oy - 8, bw + 16, bh + 16, rad + 8);
      g.fillStyle = col.line; g.fill();
      g.textAlign = 'center'; g.textBaseline = 'middle';
      for (var i = 0; i < b.rows * b.cols; i++) {
        var r = (i / b.cols) | 0, c = i % b.cols;
        var x = ox + (rtl ? (b.cols - 1 - c) : c) * cs, y = oy + r * cs;
        var open = b.revealed[i], mine = b.mine[i];
        g.fillStyle = open ? (mine ? '#C8574B' : col.surface2) : col.surface3;
        C.rrect(g, x + pad, y + pad, cs - pad * 2, cs - pad * 2, rad);
        g.fill();
        var mx = x + cs / 2, my = y + cs / 2;
        if (open && mine) {
          g.fillStyle = '#fff';
          g.beginPath(); g.arc(mx, my, cs * 0.2, 0, Math.PI * 2); g.fill();
          g.strokeStyle = '#fff'; g.lineWidth = Math.max(1, cs * 0.06);
          for (var k = 0; k < 4; k++) {
            var a = k * Math.PI / 4;
            g.beginPath();
            g.moveTo(mx - Math.cos(a) * cs * 0.33, my - Math.sin(a) * cs * 0.33);
            g.lineTo(mx + Math.cos(a) * cs * 0.33, my + Math.sin(a) * cs * 0.33);
            g.stroke();
          }
        } else if (open && b.num[i] > 0 && b.num[i] < 9) {
          g.fillStyle = NUMC[b.num[i]];
          g.font = '800 ' + Math.round(cs * 0.56) + 'px Vazirmatn, system-ui, sans-serif';
          g.fillText(C.num(b.num[i]), mx, my + cs * 0.03);
        } else if (!open && b.flagged[i]) {
          g.fillStyle = '#C8574B';
          g.fillRect(mx - cs * 0.03, my - cs * 0.26, cs * 0.06, cs * 0.52);
          g.beginPath();
          g.moveTo(mx, my - cs * 0.26);
          g.lineTo(mx + cs * 0.26, my - cs * 0.12);
          g.lineTo(mx, my + 0.02 * cs);
          g.closePath(); g.fill();
        }
      }
    };
  }

  /* --------------------------------------------------------- زمان‌سنج */

  function startTimer() {
    stopTimer();
    var last = Date.now();
    timerId = setInterval(function () {
      var n = Date.now();
      if (S && !S.done && S.started) { S.elapsed += n - last; ctx.setStat('time', C.time(S.elapsed)); }
      last = n;
    }, 250);
  }
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
  C.onPause(function () { stopTimer(); });
  C.onResume(function () { if (S && !S.done && S.started) startTimer(); });

  /* --------------------------------------------------------- ذخیره */

  ctx.autosave(function () {
    if (!S || S.done || !S.started) return { inProgress: false };
    return { s: S, prefs: prefs };
  });
  function save() { ctx.save(); }

  function askNew() {
    if (!S || S.done || !S.started) { newGame(S ? S.sizeKey : prefs.size); return; }
    C.ui.confirm({ title: C.t('newBoard'), body: C.t('resetWarn'), onOk: function () { newGame(S.sizeKey); } });
  }

  function customModal() {
    var r = el('input', { type: 'number', min: '5', max: '24', value: prefs.custom.rows });
    var c = el('input', { type: 'number', min: '5', max: '30', value: prefs.custom.cols });
    var m = el('input', { type: 'number', min: '3', max: '400', value: prefs.custom.mines });
    C.ui.modal({
      title: C.t('custom'),
      body: [
        el('div', { class: 'ms-custom' }, [el('span', { text: C.t('rows') }), r]),
        el('div', { class: 'ms-custom' }, [el('span', { text: C.t('cols') }), c]),
        el('div', { class: 'ms-custom' }, [el('span', { text: C.t('mineCount') }), m])
      ],
      actions: [
        { label: C.t('cancel') },
        { label: C.t('start'), kind: 'primary', onClick: function () {
          var rows = C.clamp(parseInt(r.value, 10) || 12, 5, 24);
          var cols = C.clamp(parseInt(c.value, 10) || 12, 5, 30);
          var maxM = rows * cols - 10;
          var mines = C.clamp(parseInt(m.value, 10) || 20, 3, maxM);
          prefs.custom = { rows: rows, cols: cols, mines: mines };
          prefs.size = 'custom';
          ctx.store.set('prefs', prefs);
          newGame('custom');
        } }
      ]
    });
  }

  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('tutText1') }),
        el('div', { class: 'ch-list' }, [
          row(C.t('longPress'), C.t('flagMode')),
          row(C.t('chordHint'), '')
        ]),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [
          row(C.t('play'), 'Space / Enter'),
          row(C.t('flagCell'), 'F'),
          row(C.t('holdFlag'), 'Space / Enter'),
          row(C.t('hint'), 'H'),
          row(C.t('move'), '← ↑ → ↓')
        ])
      ],
      actions: [
        { label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } },
        { label: C.t('done'), kind: 'primary' }
      ]
    });
  }
  function row(what, key) {
    return el('div', { class: 'ch-item' }, [
      el('div', { class: 'ch-item__label', text: what }),
      key ? el('span', { class: 'ch-badge', text: key }) : null
    ]);
  }

  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'),
      art: '<svg viewBox="0 0 200 110" width="100%"><g>' +
        '<rect x="40" y="20" width="34" height="34" rx="5" fill="var(--c-surface-2)"/>' +
        '<rect x="78" y="20" width="34" height="34" rx="5" fill="var(--c-surface-3)"/>' +
        '<rect x="116" y="20" width="34" height="34" rx="5" fill="var(--c-surface-3)"/>' +
        '<rect x="40" y="58" width="34" height="34" rx="5" fill="var(--c-surface-2)"/>' +
        '<rect x="78" y="58" width="34" height="34" rx="5" fill="var(--c-surface-2)"/>' +
        '<rect x="116" y="58" width="34" height="34" rx="5" fill="var(--c-surface-3)"/>' +
        '<text x="57" y="45" font-size="20" font-weight="800" fill="#4C7DBE" text-anchor="middle" font-family="sans-serif">۱</text>' +
        '<text x="95" y="83" font-size="20" font-weight="800" fill="#4A8A5C" text-anchor="middle" font-family="sans-serif">۲</text>' +
        '</g></svg>' },
    { title: C.t('tutTitle2'), text: C.t('tutText2'),
      art: '<svg viewBox="0 0 200 110" width="100%">' +
        '<rect x="70" y="25" width="60" height="60" rx="8" fill="var(--c-surface-3)"/>' +
        '<path d="M88 72V38M88 40h22l-7 6 7 6H88" fill="none" stroke="var(--c-bad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>' },
    { title: C.t('tutTitle3'), text: C.t('tutText3'),
      art: '<svg viewBox="0 0 200 110" width="100%">' +
        '<circle cx="100" cy="55" r="34" fill="var(--c-good-soft)"/>' +
        '<path d="M84 56l11 11 22-24" fill="none" stroke="var(--c-good)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>' }
  ];

  /* --------------------------------------------------------- کیبورد */

  window.addEventListener('keydown', function (e) {
    if (!S || S.done) return;
    // با دیالوگ باز، کلید مال دیالوگ است نه تخته‌ی پشتش. بدون این، H پشت
    // پنجره‌ی راهنما سکه خرج می‌کرد و Space روی دکمه‌ها دو کار می‌کرد.
    if (document.querySelector('.ch-scrim')) return;
    var tg = e.target, tag = tg && tg.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (tg && tg.isContentEditable)) return;
    // Holding Space or Enter flags, like a long press on the screen (#346). The cell acts
    // when the key is let go, so a short press still opens it and a held one is not opened
    // first; the button's own click is held back, or Enter would open it at once.
    var onCell = !!(tg && tg.classList && tg.classList.contains('ms-cell'));
    if ((e.key === ' ' || e.key === 'Enter') && (onCell || tag !== 'BUTTON')) {
      e.preventDefault();
      if (e.repeat || keyHold) return;
      var at = onCell ? cells.indexOf(tg) : cursor;
      cursor = C.clamp(at < 0 ? cursor : at, 0, S.spec.rows * S.spec.cols - 1);
      var hold = { key: e.key, at: cursor, fired: false };
      hold.timer = setTimeout(function () { hold.fired = true; if (S && !S.done) toggleFlag(hold.at); }, LONG_MS);
      keyHold = hold;
      return;
    }
    // دکمه‌های بیرون تخته باید Enter و Space خودشان را نگه دارند
    if (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
    var sp = S.spec, k = e.key;
    cursor = C.clamp(cursor, 0, sp.rows * sp.cols - 1);
    document.documentElement.dataset.kb = '1';
    var to = E.step(cursor, k, sp.rows, sp.cols, document.documentElement.dir === 'rtl');
    if (to >= 0) { cursor = to; paint(); cells[cursor].focus(); e.preventDefault(); return; }
    if (C.keyIs(e, 'f')) { toggleFlag(cursor); e.preventDefault(); }
    else if (C.keyIs(e, 'h')) { hint(); e.preventDefault(); }
  });
  window.addEventListener('keyup', function (e) {
    if (!keyHold || e.key !== keyHold.key) return;
    var h = keyHold;
    keyHold = null;
    clearTimeout(h.timer);
    e.preventDefault();
    if (h.fired || !S || S.done || document.querySelector('.ch-scrim')) return;
    if (flagMode && !S.revealed[h.at]) toggleFlag(h.at);
    else tap(h.at);
  });
  // a key held while the window loses focus never sends its keyup
  window.addEventListener('blur', function () { if (keyHold) { clearTimeout(keyHold.timer); keyHold = null; } });

  /* ----------------------------------------------------------- شروع */

  var saved = ctx.loadSave();
  // هسته برای هر روز خانه‌ی ذخیره‌ی جدا دارد، ولی این بازی روزانه را همیشه از نو
  // می‌ساخت و پیشرفت نیمه‌کاره‌ی همان روز گم می‌شد (#132). اول ذخیره‌ی همین روز.
  var resume = saved && saved.s && saved.s.started && !saved.s.done &&
    (saved.s.daily || null) === (dailyDate || null);
  if (resume) {
    if (saved.prefs && !dailyDate) prefs = saved.prefs;
    S = saved.s;
    buildBoard();
    render();
    startTimer();
  } else if (dailyDate) {
    var d = C.daily('minesweeper', dailyDate);
    newGame('medium', d.rng, dailyDate);
    // در حالت روزانه خانه‌ی اولین کلیک هم از بذر می‌آید، وگرنه تخته‌ی هر بازیکن
    // با تخته‌ی بقیه فرق می‌کرد و «یک پازل یکسان برای همه» معنا نداشت.
    var startCell = d.rng.int(S.spec.rows * S.spec.cols);
    firstClick(startCell);
    animate(openFrom(startCell));
    save();
    if (C.stats.dailyDone('minesweeper', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).minesweeper;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec.label });
    }
    ctx.tutorialIfNew(TUT);
  } else {
    newGame(prefs.size || 'small');
    ctx.tutorialIfNew(TUT);
  }
})();
</script>
