<style>
  /* the pitch stands upright in a tall game area and lies on its side in a wide one,
     where the side column sits beside it */
  .fb-wrap > .ch-fit { --fit-ar: calc(106 / 199); }
  @container game (min-aspect-ratio: 5 / 4) {
    .fb-wrap > .ch-fit { --fit-ar: calc(199 / 106); }
  }
  .ch-fit > .fb-box { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
  .fb-canvas { display: block; touch-action: none; border-radius: var(--r-lg); direction: ltr; user-select: none; -webkit-user-select: none; }
  .fb-top { display: flex; justify-content: center; align-items: center; gap: var(--s-2); flex-wrap: wrap; }
  .fb-players { display: flex; justify-content: space-between; gap: var(--s-2); width: 100%; max-width: 420px; direction: ltr; }
  .fb-player { flex: 1; display: flex; align-items: center; gap: var(--s-2); padding: 6px 10px; border-radius: var(--r-md); background: var(--c-surface-2); font-weight: 700; min-width: 0; border: 2px solid transparent; }
  .fb-player:last-child { flex-direction: row-reverse; }
  .fb-player.is-on { border-color: var(--game); }
  .fb-player__dot { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 2px rgba(0,0,0,.25); }
  .fb-player__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: start; }
  .fb-player:last-child .fb-player__name { text-align: end; }
  .fb-player__score { font-size: var(--fs-lg); font-weight: 800; font-variant-numeric: tabular-nums; min-width: 2ch; text-align: center; }
  .fb-status { min-height: 2.8em; font-weight: 700; color: var(--c-text-dim); text-align: center; font-size: var(--fs-sm); }
  .fb-gear .ch-icon { pointer-events: none; }
  .fb-formrow { flex-wrap: wrap; row-gap: var(--s-2); }
  .fb-forms button { padding: 4px 8px; }
  .fb-formicon { display: block; line-height: 0; }
  .fb-wrap { user-select: none; -webkit-user-select: none; }

<body>
<script src="../../version.js"></script>
<script src="../../lib/chogan.js"></script>
<script src="../../lib/cue.js"></script>
<script>
/* ==== ENGINE START ==== */
/* Button football on top of the shared table physics in lib/cue.js (#623). Body 0 is
   the ball, 1–5 the bottom team's discs (team 0, attacking the top goal), 6–10 the top
   team's (team 1). The pitch runs from x = 0 to W and y = 0 to L, with a goal box D
   deep behind each end line. A match at rest is plain data, so it saves as is and the
   bot can try flicks on copies of it. */
function FootballEngineFactory(Cue) {
  'use strict';
  Cue = Cue || (typeof self !== 'undefined' && self.ChoganCue) || null;
  if (!Cue) throw new Error('lib/cue.js is not loaded');

  var W = 100, L = 175, D = 9, MOUTH = 32, RD = 5.5, RB = 3, MD = 2, MB = 1;
  var G0 = W / 2 - MOUTH / 2, G1 = W / 2 + MOUTH / 2;
  // the boards: both sides, each end line either side of its mouth, and the goal boxes
  var SEGS = [
    [0, 0, 0, L], [W, 0, W, L],
    [0, 0, G0, 0], [G1, 0, W, 0], [G0, 0, G0, -D], [G0, -D, G1, -D], [G1, -D, G1, 0],
    [0, L, G0, L], [G1, L, W, L], [G0, L, G0, L + D], [G0, L + D, G1, L + D], [G1, L + D, G1, L]
  ];
  var T = Cue.walls({ segs: SEGS, length: L, width: W, radius: RD, ball: 0.88, cushion: 0.7, cushionSlide: 0.95, rollA: 40, rollB: 2.4, minSpeed: 2.5, maxSpeed: 460 });
  var WIN_TO = [3, 5], MAX_TURNS = 40;
  // after a goal the ball runs on into the net this long, then everything stops
  var AFTER_GOAL = Math.round(0.7 / Cue.DT);
  // a pull this long (pitch units) is a full flick; a shorter one is a softer one
  var PULL = 42;

  // The bottom team's places, the goalkeeper first; the top team's are the same turned
  // round. The team that kicks off has its centre forward behind the ball.
  var BASE = [[50, 164], [28, 142], [72, 142], [24, 111], [76, 111]];
  var KICK = [[50, 164], [28, 142], [72, 142], [50, 102], [20, 107]];
  // Formations behind the gear (#713, a friend's request): the bottom team's places for
  // each, and for the kick-off the one disc that steps up behind the ball. '2-2' is the
  // classic line-up above; the daily match and the bot always play it.
  var FORMS = {
    '2-2': { base: BASE, kick: KICK },
    '1-2-1': { base: [[50, 164], [50, 143], [22, 125], [78, 125], [50, 110]], kick: [[50, 164], [50, 143], [22, 125], [78, 125], [50, 102]] },
    '3-1': { base: [[50, 164], [22, 143], [50, 146], [78, 143], [50, 112]], kick: [[50, 164], [22, 143], [50, 146], [78, 143], [50, 102]] },
    '1-3': { base: [[50, 164], [50, 140], [18, 112], [50, 111], [82, 112]], kick: [[50, 164], [50, 140], [18, 112], [50, 102], [82, 112]] }
  };
  var FORM_IDS = ['2-2', '1-2-1', '3-1', '1-3'];
  function formOf(f) { return FORM_IDS.indexOf(f) >= 0 ? f : '2-2'; }

  function teamOf(id) { return id === 0 ? -1 : (id <= 5 ? 0 : 1); }
  function body(id, x, y) { return id === 0 ? { id: 0, x: x, y: y, vx: 0, vy: 0, inPlay: true, r: RB, m: MB } : { id: id, x: x, y: y, vx: 0, vy: 0, inPlay: true, r: RD, m: MD }; }
  function lineupBodies(kicker, form) {
    var b = [body(0, W / 2, L / 2)];
    for (var t = 0; t < 2; t++) {
      var F = FORMS[formOf(form && form[t])], P = t === kicker ? F.kick : F.base;
      for (var i = 0; i < 5; i++) {
        var x = P[i][0], y = P[i][1];
        if (t === 1) { x = W - x; y = L - y; }
        b.push(body(1 + 5 * t + i, x, y));
      }
    }
    return b;
  }
  function match(o) {
    o = o || {};
    var k = o.kicker === 1 ? 1 : 0;
    var form = [formOf(o.form && o.form[0]), formOf(o.form && o.form[1])];
    return { b: lineupBodies(k, form), form: form, score: [0, 0], turn: k, turns: 0, winTo: WIN_TO.indexOf(o.winTo) >= 0 ? o.winTo : 3, maxTurns: MAX_TURNS, golden: false, winner: -1 };
  }
  function discs(M, t) { return M.b.filter(function (b) { return teamOf(b.id) === t; }); }
  function byId(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }

  // A flick: the disc leaves at a speed from the pull's power, the rest is cue.js
  function powerOf(pull) { return Math.max(0, Math.min(1, pull / PULL)); }
  function flick(M, id, angle, power) {
    if (M.winner >= 0 || teamOf(id) !== M.turn) return null;
    var s = Cue.start(T, M.b, { angle: angle, power: power }, id);
    s.by = M.turn; s.goal = -1; s.goalAt = 0;
    return s;
  }
  // One physics step of a flick, and the goal check. Returns true while anything moves.
  function step(s) {
    var more = Cue.tick(s), B = s.balls;
    // a squeeze between two discs and a board could push a body through the board:
    // nothing ever leaves the pitch and its goal boxes
    for (var i = 0; i < B.length; i++) {
      var b = B[i], r = b.r;
      if (b.x < r) { b.x = r; b.vx = Math.abs(b.vx) * 0.5; }
      else if (b.x > W - r) { b.x = W - r; b.vx = -Math.abs(b.vx) * 0.5; }
      var inMouth = b.x > G0 && b.x < G1;
      var lo = inMouth ? -D + r : r, hi = inMouth ? L + D - r : L - r;
      if (b.y < lo) { b.y = lo; b.vy = Math.abs(b.vy) * 0.5; }
      else if (b.y > hi) { b.y = hi; b.vy = -Math.abs(b.vy) * 0.5; }
    }
    // a goal once the ball's centre is over the line between the posts: a ball resting
    // half inside the net read as a goal to players but did not count (owner, 2026-11-08)
    var ball = B[0];
    if (s.goal < 0) {
      if (ball.y < 0 && ball.x > G0 && ball.x < G1) { s.goal = 0; s.goalAt = s.ticks; }
      else if (ball.y > L && ball.x > G0 && ball.x < G1) { s.goal = 1; s.goalAt = s.ticks; }
    }
    if (s.goal >= 0 && (s.quick || s.ticks - s.goalAt >= AFTER_GOAL)) {
      for (i = 0; i < B.length; i++) { B[i].vx = 0; B[i].vy = 0; }
      more = false; s.moving = false;
    }
    return more;
  }
  function run(s) { while (step(s)) { /* the same steps the page animates */ } return s; }

  // The flick is over: count it, score a goal or pass the turn. After a goal both teams
  // line up again and the team that let it in kicks off. When the turns run out, the
  // team ahead wins; level, the next goal wins (golden goal), so a match always ends.
  function resolve(M, s) {
    var ev = { goal: s.goal, own: s.goal >= 0 && s.goal !== s.by, first: s.ev.first, golden: false, win: -1 };
    M.turns++;
    M.b = s.balls.map(function (b) { var c = body(b.id, b.x, b.y); return c; });
    if (s.goal >= 0) {
      M.score[s.goal]++;
      if (M.golden || M.score[s.goal] >= M.winTo) M.winner = s.goal;
      else { M.b = lineupBodies(1 - s.goal, M.form); M.turn = 1 - s.goal; }
    } else M.turn = 1 - M.turn;
    if (M.winner < 0 && !M.golden && M.turns >= M.maxTurns) {
      if (M.score[0] !== M.score[1]) M.winner = M.score[0] > M.score[1] ? 0 : 1;
      else { M.golden = true; ev.golden = true; }
    }
    ev.win = M.winner;
    return ev;
  }

  /* ------------------------------------------------------------------ bot */

  // Distance a disc slides from power p, from the friction law in cue.js, and the power
  // that slides it d units
  function travel(p) {
    var v = Cue.speedOf(T, p), a = T.rollA, b = T.rollB;
    return v / b - a / (b * b) * Math.log(1 + b * v / a);
  }
  function powerFor(d) {
    var lo = 0, hi = 1;
    if (travel(1) <= d) return 1;
    for (var i = 0; i < 30; i++) { var mid = (lo + hi) / 2; if (travel(mid) < d) lo = mid; else hi = mid; }
    return hi;
  }
  function goalY(t) { return t === 0 ? -D / 2 : L + D / 2; }        // the goal team t attacks
  function ownY(t) { return t === 0 ? L + D / 2 : -D / 2; }
  function gain(t, y) { return t === 0 ? L - y : y; }               // how far up the pitch, for t
  function norm(x, y) { var l = Math.sqrt(x * x + y * y) || 1; return { x: x / l, y: y / l, l: l }; }

  var LEVELS = {
    easy: { sim: false, aimSd: 0.1, powSd: 0.22 },
    medium: { sim: true, discs: 3, aims: [0], powers: [0.7, 1], defend: 0, aimSd: 0.04, powSd: 0.1 },
    hard: { sim: true, discs: 5, aims: [-9, 0, 9], powers: [0.5, 0.75, 1], defend: 1, aimSd: 0.012, powSd: 0.05 }
  };

  // How open the shot at t's goal is for the other team, from where the ball lies: a
  // disc of theirs behind the ball, near it, with no disc of t's in the way
  function threat(B, t) {
    var ball = B[0], gx = W / 2, gy = ownY(t), u = norm(gx - ball.x, gy - ball.y), worst = 0;
    var blocked = 0;
    for (var i = 1; i < B.length; i++) {
      var d = B[i];
      if (teamOf(d.id) !== t) continue;
      var ox = d.x - ball.x, oy = d.y - ball.y, along = ox * u.x + oy * u.y;
      if (along <= 0 || along >= u.l) continue;
      if (Math.abs(ox * u.y - oy * u.x) < RD + RB + 1) blocked++;
    }
    for (i = 1; i < B.length; i++) {
      var o = B[i];
      if (teamOf(o.id) !== 1 - t) continue;
      var hx = ball.x - u.x * (RD + RB) - o.x, hy = ball.y - u.y * (RD + RB) - o.y, h = norm(hx, hy);
      if (h.l > 90 || h.x * u.x + h.y * u.y < 0.45) continue;
      worst = Math.max(worst, (90 - h.l) * (1.4 - u.l / 160));
    }
    return blocked ? worst * 0.35 : worst;
  }
  function judge(s, t, lv) {
    if (s.goal === t) return 10000;
    if (s.goal === 1 - t) return -10000;
    var B = s.balls, ball = B[0], g = gain(t, ball.y);
    var v = g - Math.abs(ball.x - W / 2) * 0.12 * g / L;
    if (s.ev.first === null) v -= 12;
    if (lv.defend) v -= threat(B, t) * lv.defend;
    return v;
  }
  function sim(M, c) {
    var s = flick(M, c.id, c.angle, c.power);
    s.quick = true;
    return run(s);
  }
  function noisy(c, lv, rnd) {
    var g = function () { return (rnd() + rnd() + rnd() - 1.5) * 2; };
    return { id: c.id, angle: c.angle + g() * lv.aimSd, power: Math.max(0.15, Math.min(1, c.power * (1 + g() * lv.powSd))) };
  }
  // The bot's flick for the team on turn. Easy flicks its disc nearest the ball at the
  // middle of the goal without looking ahead. Medium tries a few flicks of its three
  // discs nearest the ball and keeps the one that leaves the ball furthest up the pitch.
  // Hard tries all five discs at three spots in the goal mouth, and weighs how open its
  // own goal is left, so it also flicks a disc back into the way when that is safer.
  function choose(M, level, rnd) {
    var lv = LEVELS[level] || LEVELS.medium, t = M.turn, ball = M.b[0], mine = discs(M, t);
    mine.sort(function (a, b) { return Math.hypot(a.x - ball.x, a.y - ball.y) - Math.hypot(b.x - ball.x, b.y - ball.y); });
    function strike(d, ax, p) {
      var u = norm(W / 2 + ax - ball.x, goalY(t) - ball.y);
      var gx = ball.x - u.x * (RD + RB) * 0.97, gy = ball.y - u.y * (RD + RB) * 0.97, w = norm(gx - d.x, gy - d.y);
      if (w.x * u.x + w.y * u.y < 0.2) return null;
      return { id: d.id, angle: Math.atan2(w.y, w.x), power: p, kind: 'shot' };
    }
    if (!lv.sim) {
      var pick = null;
      for (var i = 0; i < mine.length && !pick; i++) pick = strike(mine[i], 0, 0.6 + rnd() * 0.4);
      if (!pick) pick = { id: mine[0].id, angle: Math.atan2(ball.y - mine[0].y, ball.x - mine[0].x), power: 0.8 };
      return noisy(pick, lv, rnd);
    }
    var cands = [];
    mine.slice(0, lv.discs).forEach(function (d) {
      lv.aims.forEach(function (ax) { lv.powers.forEach(function (p) { var c = strike(d, ax, p); if (c) cands.push(c); }); });
      var a = Math.atan2(ball.y - d.y, ball.x - d.x);
      cands.push({ id: d.id, angle: a, power: 0.65, kind: 'hit' }, { id: d.id, angle: a, power: 1, kind: 'hit' });
    });
    if (lv.defend) {
      // a disc back between the ball and its own goal
      var qx = W / 2 + (ball.x - W / 2) * 0.35, qy = ownY(t) + (ball.y - ownY(t)) * 0.3;
      discs(M, t).slice().sort(function (a, b) { return Math.hypot(a.x - qx, a.y - qy) - Math.hypot(b.x - qx, b.y - qy); }).slice(0, 2).forEach(function (d) {
        var dd = Math.hypot(qx - d.x, qy - d.y);
        if (dd > RD) cands.push({ id: d.id, angle: Math.atan2(qy - d.y, qx - d.x), power: powerFor(dd), kind: 'block' });
      });
    }
    var best = null, bv = -Infinity;
    for (var k = 0; k < cands.length; k++) {
      var v = judge(sim(M, cands[k]), t, lv) + rnd() * 0.5;
      if (v > bv) { bv = v; best = cands[k]; }
    }
    return noisy(best, lv, rnd);
  }

  /* ---------------------------------------------------------------- saves */

  // Saved only at rest, between flicks
  function snapshot(M) {
    return { b: M.b.map(function (b) { return [b.x, b.y]; }), score: M.score.slice(), turn: M.turn, turns: M.turns, winTo: M.winTo, golden: M.golden, form: M.form ? M.form.slice() : ['2-2', '2-2'] };
  }
  function restore(o) {
    if (!o || typeof o !== 'object' || WIN_TO.indexOf(o.winTo) < 0 || (o.turn !== 0 && o.turn !== 1) || typeof o.golden !== 'boolean') return null;
    if (!(o.turns === (o.turns | 0) && o.turns >= 0 && o.turns < 10000) || (o.golden && o.turns < MAX_TURNS)) return null;
    if (!Array.isArray(o.score) || o.score.length !== 2 || !o.score.every(function (v) { return v === (v | 0) && v >= 0 && v < o.winTo; })) return null;
    if (!Array.isArray(o.b) || o.b.length !== 11) return null;
    var B = [];
    for (var i = 0; i < 11; i++) {
      var p = o.b[i], r = i === 0 ? RB : RD;
      if (!Array.isArray(p) || p.length !== 2 || !isFinite(p[0]) || !isFinite(p[1]) || typeof p[0] !== 'number' || typeof p[1] !== 'number') return null;
      if (p[0] < r - 1e-6 || p[0] > W - r + 1e-6 || p[1] < -D || p[1] > L + D) return null;
      B.push(body(i, p[0], p[1]));
    }
    // saves from before #713 have no formation: the classic one
    var form = Array.isArray(o.form) ? [formOf(o.form[0]), formOf(o.form[1])] : ['2-2', '2-2'];
    return { b: B, form: form, score: o.score.slice(), turn: o.turn, turns: o.turns, winTo: o.winTo, maxTurns: MAX_TURNS, golden: o.golden, winner: -1 };
  }

  return {
    Cue: Cue, T: T, W: W, L: L, D: D, MOUTH: MOUTH, G0: G0, G1: G1, RD: RD, RB: RB, MD: MD, MB: MB, SEGS: SEGS, PULL: PULL,
    WIN_TO: WIN_TO, MAX_TURNS: MAX_TURNS, AFTER_GOAL: AFTER_GOAL, LEVELS: LEVELS, BASE: BASE, KICK: KICK, FORMS: FORMS, FORM_IDS: FORM_IDS,
    teamOf: teamOf, match: match, lineup: lineupBodies, discs: discs, byId: byId, powerOf: powerOf, flick: flick, step: step, run: run,
    resolve: resolve, travel: travel, powerFor: powerFor, threat: threat, choose: choose, snapshot: snapshot, restore: restore
  };
}
if (typeof module !== 'undefined') module.exports = FootballEngineFactory;
/* ==== ENGINE END ==== */
</script>
<script>
(function () {
  'use strict';
  var C = window.Chogan, el = C.el;
  var E = FootballEngineFactory(window.ChoganCue), Cue = E.Cue;
  var LEVELS = ['easy', 'medium', 'hard'];
  // Team colours stay the same in both themes, like the grass: red at the bottom, blue at the top
  var TEAM = [{ fill: '#E0503A', ring: '#A3301E' }, { fill: '#2E6BD8', ring: '#183F8C' }];
  var BRD = 3; // the boards' width round the pitch, in pitch units

  C.boot({});
  var ctx = C.game({
    id: 'football',
    name: { fa: 'فوتبال دکمه‌ای', en: 'Button Football', zh: '按钮足球', de: 'Knopffußball', es: 'Fútbol de chapas', pl: 'Piłkarzyki guzikowe', fr: 'Foot à boutons' },
    accent: '#0D4F2E',
    mood: 'menu',
    strings: {
      fa: {
        fbPitch: 'زمین فوتبال دکمه‌ای از بالا', fbVsBot: 'مقابل ربات', fbPeople: 'دو نفره', fbBot: 'ربات', fbPlayerN: 'بازیکن {n}', fbNew: 'مسابقه‌ی تازه',
        fbFirstTo: 'تا {n} گل', fbTurnOf: 'نوبت {n} از {m}', fbGolden: 'گل طلایی', fbGoalBanner: 'گل!', fbGoalOf: 'گل برای {n}!', fbOwnGoal: 'گل به خودی! امتیاز برای {n}',
        fbWon: '{n} برد', fbYour: 'نوبت توست: از یکی از مهره‌هایت عقب بکش و رها کن.', fbTurnName: 'نوبت {n}: از یک مهره عقب بکش و رها کن.', fbBotTurn: 'ربات نشانه می‌گیرد…',

  /* --------------------------------------------------------------- draw */

  // The view: the pitch upright in a tall box, on its side in a wide one, with the

  function view() {

  /* ----------------------------------------------------------------- ui */

    if (document.querySelector('.ch-scrim') || !humanTurn() || (e.target && e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter'))) return;
    var mine = E.discs(G.M, G.M.turn).map(function (d) { return d.id; }), i = mine.indexOf(sel), used = true;
    if (e.key === 'Tab') { sel = mine[(i + (e.shiftKey ? mine.length - 1 : 1) + mine.length) % mine.length] || mine[0]; var d = E.byId(G.M.b, sel), b = G.M.b[0]; kbAim = Math.atan2(b.y - d.y, b.x - d.x); }
    else if (e.key === 'ArrowLeft') kbAim -= e.shiftKey ? 0.01 : 0.06;
    else if (e.key === 'ArrowRight') kbAim += e.shiftKey ? 0.01 : 0.06;
    else if (e.key === 'ArrowUp') kbPower = Math.min(1, kbPower + 0.05);
    else if (e.key === 'ArrowDown') kbPower = Math.max(0.1, kbPower - 0.05);
    else if (e.key === ' ' || e.key === 'Enter') { if (kbOn && sel > 0) shoot(sel, kbAim, kbPower); else kbOn = true; }
    else used = false;
    if (used) { if (mine.indexOf(sel) < 0) sel = mine[0]; kbOn = true; e.preventDefault(); kick(); }
  });

  // Away from the app a flick on the move holds still
  C.onPause(function () { paused = true; drag = null; });
  C.onResume(function () { paused = false; last = 0; kick(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { last = 0; kick(); } });
  if (window.ResizeObserver) new ResizeObserver(function () { draw(); }).observe(box);

  /* --------------------------------------------------------------- help */

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('fbRules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [kb('Tab', C.t('fbKPick')), kb('← →', C.t('fbKAim')), kb('↑ ↓', C.t('fbKPower')), kb('Space / Enter', C.t('fbKShoot'))])
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  function tArt(kind) {
    var s = '<svg viewBox="0 0 200 110" width="100%" direction="ltr"><rect width="200" height="110" rx="10" fill="#1C5232"/><rect x="12" y="8" width="176" height="94" fill="#2F8A4A"/>' +
      '<path d="M100 8 V102 M12 8 H188 V102 H12 Z M188 38 h8 v34 h-8 M12 38 h-8 v34 h8" fill="none" stroke="#E9F2EC" stroke-width="2"/><circle cx="100" cy="55" r="16" fill="none" stroke="#E9F2EC" stroke-width="2"/>';
    var disc = function (x, y, c, ring) { return '<circle cx="' + x + '" cy="' + y + '" r="10" fill="' + ring + '"/><circle cx="' + x + '" cy="' + y + '" r="7.5" fill="' + c + '"/><circle cx="' + x + '" cy="' + y + '" r="2.6" fill="#FFFFFF"/>'; };
    var red = function (x, y) { return disc(x, y, '#E0503A', '#A3301E'); }, blue = function (x, y) { return disc(x, y, '#2E6BD8', '#183F8C'); };
    var ball = function (x, y) { return '<circle cx="' + x + '" cy="' + y + '" r="5" fill="#FFFFFF" stroke="#1E2B24" stroke-width="1"/><circle cx="' + x + '" cy="' + y + '" r="1.8" fill="#1E2B24"/>'; };
    if (kind === 1) s += red(40, 40) + red(40, 75) + red(70, 55) + blue(140, 40) + blue(150, 72) + ball(160, 56) + '<path d="M120 56 L184 56" stroke="#FFD45A" stroke-width="2.5" stroke-dasharray="5 4"/><path d="M186 56 l-7 -5 v10 z" fill="#FFD45A"/>';
    if (kind === 2) s += red(80, 55) + ball(118, 55) + '<path d="M80 55 L44 66" stroke="rgba(255,255,255,.7)" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="44" cy="66" r="7" fill="rgba(255,255,255,.55)"/>' +
      '<path d="M92 51 L108 46" stroke="#FF8A3D" stroke-width="3" stroke-linecap="round"/><path d="M113 44.5 l-7 -2 l2 8 z" fill="#FF8A3D"/>';
    if (kind === 3) s += red(50, 80) + blue(120, 40) + ball(92, 60) + '<path d="M92 60 L140 12 L186 50" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4"/>';
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('fbTutTitle1'), text: C.t('fbTutText1'), art: tArt(1) },
    { title: C.t('fbTutTitle2'), text: C.t('fbTutText2'), art: tArt(2) },
    { title: C.t('fbTutTitle3'), text: C.t('fbTutText3'), art: tArt(3) }
  ];

  /* -------------------------------------------------------------- start */

  var saved = ctx.loadSave();
  if (dailyDate) {
    // the daily match has its own slot, so a half-played day goes on
    if (!(saved && saved.g && saved.g.daily === dailyDate && restore(saved))) newGame({ daily: dailyDate });
    if (C.stats.dailyDone('football', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).football;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
    }
  } else if (!(saved && saved.g && !saved.g.daily && restore(saved))) {
    newGame(fromPrefs());
  }
  ctx.tutorialIfNew(TUT);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (G) draw(); });
})();
</script>
