<script>
/* ==== ENGINE START ==== */
function FourRowEngineFactory() {
  'use strict';

  // 7 columns × 6 rows, cell r * 7 + c with row 0 at the top. A cell holds -1 (empty) or
  // the seat (0 or 1) whose disc is in it; h[c] counts the discs in column c, so the next
  // disc there lands on row 5 - h[c]. winner: -1 playing, 0 or 1 a seat, 2 a full board.
  var W = 7, H = 6, N = W * H;
  var LEVELS = ['easy', 'medium', 'hard'];
  var ORDER = [3, 2, 4, 1, 5, 0, 6];          // the centre first: it sits in the most lines
  var DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];
  var WIN = 100000;

  // every run of four cells, for the bot's reading of a position
  var LINES = [];
  for (var r0 = 0; r0 < H; r0++) for (var c0 = 0; c0 < W; c0++) DIRS.forEach(function (d) {
    var r3 = r0 + 3 * d[0], c3 = c0 + 3 * d[1];
    if (r3 < 0 || r3 >= H || c3 < 0 || c3 >= W) return;
    LINES.push([0, 1, 2, 3].map(function (k) { return (r0 + k * d[0]) * W + c0 + k * d[1]; }));
  });

  function newGame(first) {
    var b = [];
    for (var i = 0; i < N; i++) b.push(-1);
    var f = first === 1 ? 1 : 0;
    return { b: b, h: [0, 0, 0, 0, 0, 0, 0], first: f, turn: f, winner: -1, plies: 0, last: -1 };
  }
  function clone(S) {
    return { b: S.b.slice(), h: S.h.slice(), first: S.first, turn: S.turn, winner: S.winner, plies: S.plies, last: S.last };
  }
  function landing(S, c) { return S.h[c] < H ? (H - 1 - S.h[c]) * W + c : -1; }
  function canDrop(S, c) { return S.winner === -1 && c >= 0 && c < W && c === Math.floor(c) && S.h[c] < H; }
  function legal(S) { return S.winner === -1 ? ORDER.filter(function (c) { return S.h[c] < H; }) : []; }

  // The runs of four or more through cell i if seat p held it (b[i] itself is not read)
  function runsAt(b, i, p) {
    var r = Math.floor(i / W), c = i % W, out = [];
    for (var k = 0; k < 4; k++) {
      var d = DIRS[k], run = [i];
      for (var s = -1; s <= 1; s += 2) {
        var rr = r + s * d[0], cc = c + s * d[1];
        while (rr >= 0 && rr < H && cc >= 0 && cc < W && b[rr * W + cc] === p) {
          if (s < 0) run.unshift(rr * W + cc); else run.push(rr * W + cc);
          rr += s * d[0]; cc += s * d[1];
        }
      }
      if (run.length >= 4) out.push(run);
    }
    return out;
  }
  function wins(b, i, p) {
    var r = Math.floor(i / W), c = i % W;
    for (var k = 0; k < 4; k++) {
      var d = DIRS[k], n = 1;
      for (var s = -1; s <= 1; s += 2) {
        var rr = r + s * d[0], cc = c + s * d[1];
        while (rr >= 0 && rr < H && cc >= 0 && cc < W && b[rr * W + cc] === p) { n++; rr += s * d[0]; cc += s * d[1]; }
      }
      if (n >= 4) return true;
    }
    return false;
  }

  // Drops the seat to move's disc into column c; returns the cell it landed in, or -1
  function play(S, c) {
    if (!canDrop(S, c)) return -1;
    var i = landing(S, c), p = S.turn;
    S.b[i] = p; S.h[c]++; S.plies++; S.last = i;
    if (wins(S.b, i, p)) S.winner = p;
    else if (S.plies === N) S.winner = 2;
    else S.turn = 1 - p;
    return i;
  }
  // The winning lines, each as its cells in order, or []
  function winLines(S) {
    if (S.winner !== 0 && S.winner !== 1 || S.last < 0) return [];
    return runsAt(S.b, S.last, S.winner);
  }
  // Columns where seat p would win at once
  function winning(S, p) {
    return ORDER.filter(function (c) { var i = landing(S, c); return i >= 0 && wins(S.b, i, p); });
  }

  /* ---- the bot ---- */

  function evaluate(b, p) {
    var q = 1 - p, v = 0;
    for (var k = 0; k < LINES.length; k++) {
      var L = LINES[k], mine = 0, theirs = 0;
      for (var j = 0; j < 4; j++) { var x = b[L[j]]; if (x === p) mine++; else if (x === q) theirs++; }
      if (theirs === 0) v += mine === 3 ? 5 : mine === 2 ? 2 : 0;
      else if (mine === 0) v -= theirs === 3 ? 6 : theirs === 2 ? 2 : 0;
    }
    for (var r = 0; r < H; r++) { var m = b[r * W + 3]; if (m === p) v += 3; else if (m === q) v -= 3; }
    return v;
  }

  // Negamax with alpha-beta on one shared board, made and unmade in place
  function negamax(b, h, p, depth, alpha, beta, plies, T) {
    if ((++T.nodes & 1023) === 0 && Date.now() > T.deadline) T.out = true;
    if (T.out) return 0;
    if (plies === N) return 0;
    for (var a = 0; a < W; a++) {
      var c = ORDER[a];
      if (h[c] < H && wins(b, (H - 1 - h[c]) * W + c, p)) return WIN - plies - 1;   // a sooner win is worth more
    }
    if (depth === 0) return evaluate(b, p);
    var best = -Infinity;
    for (var k = 0; k < W; k++) {
      var cc = ORDER[k];
      if (h[cc] >= H) continue;
      var i = (H - 1 - h[cc]) * W + cc;
      b[i] = p; h[cc]++;
      var v = -negamax(b, h, 1 - p, depth - 1, -beta, -alpha, plies + 1, T);
      b[i] = -1; h[cc]--;
      if (T.out) return 0;
      if (v > best) best = v;
      if (v > alpha) alpha = v;
      if (alpha >= beta) break;
    }
    return best;
  }
  // Each legal column's value for the seat to move, searched depth plies ahead
  function rate(S, cols, depth, T) {
    var b = S.b.slice(), h = S.h.slice(), p = S.turn, out = [];
    for (var k = 0; k < cols.length; k++) {
      var c = cols[k], i = (H - 1 - h[c]) * W + c;
      if (wins(b, i, p)) { out.push({ c: c, v: WIN - S.plies - 1 }); continue; }
      b[i] = p; h[c]++;
      var v = -negamax(b, h, 1 - p, depth - 1, -Infinity, Infinity, S.plies + 1, T);
      b[i] = -1; h[c]--;
      if (T.out) return null;
      out.push({ c: c, v: v });
    }
    return out;
  }

  // The bot's column. easy: takes a win, blocks only now and then, else plays loosely;
  // medium: takes a win, always blocks, then looks four plies ahead with a little noise;
  // hard: deepens until its time runs out (ms, 600 by default), centre columns first.
  function think(S, level, rnd, opt) {
    rnd = rnd || Math.random;
    var cols = legal(S), p = S.turn;
    if (!cols.length) return -1;
    var win = winning(S, p);
    if (win.length) return win[0];
    var threat = winning(S, 1 - p);
    if (level === 'easy') {
      if (threat.length && rnd() < 0.55) return threat[0];
      // mostly avoid handing over a win straight above its own disc
      var safe = cols.filter(function (c) {
        var T = clone(S); play(T, c); return !winning(T, 1 - p).length;
      });
      var pool = safe.length && rnd() < 0.7 ? safe : cols;
      // a loose lean to the middle
      var wsum = 0, ws = pool.map(function (c) { var w = 4 - Math.abs(3 - c); wsum += w; return w; }), x = rnd() * wsum;
      for (var k = 0; k < pool.length; k++) { x -= ws[k]; if (x < 0) return pool[k]; }
      return pool[pool.length - 1];
    }
    if (threat.length) return threat[0];
    if (level === 'medium') {
      var R = rate(S, cols, 4, { nodes: 0, deadline: Infinity, out: false });
      R.forEach(function (x) { x.v += rnd() * 7; });
      R.sort(function (a, b) { return b.v - a.v; });
      return R[0].c;
    }
    var ms = opt && opt.ms ? opt.ms : 600, T = { nodes: 0, deadline: Date.now() + ms, out: false };
    var order = cols.slice(), best = null;
    for (var depth = 2; depth <= N - S.plies; depth++) {
      var got = rate(S, order, depth, T);
      if (!got) break;
      got.forEach(function (x) { x.v += rnd() * 0.5; });      // only breaks ties
      got.sort(function (a, b) { return b.v - a.v; });
      best = got;
      if (got[0].v > WIN / 2 || got[0].v < -WIN / 2 || (opt && opt.depth && depth >= opt.depth)) break;
      order = got.map(function (x) { return x.c; });            // the best line first next time
    }
    return best ? best[0].c : cols[0];
  }

  function valid(S) {
    if (!S || !Array.isArray(S.b) || S.b.length !== N || !Array.isArray(S.h) || S.h.length !== W) return false;
    if (S.first !== 0 && S.first !== 1) return false;
    var n = [0, 0];
    for (var c = 0; c < W; c++) {
      var k = 0;
      for (var r = H - 1; r >= 0; r--) {
        var x = S.b[r * W + c];
        if (x === -1) break;
        if (x !== 0 && x !== 1) return false;
        n[x]++; k++;
      }
      // nothing floats: above the first gap a column is empty
      for (var r2 = H - 1 - k; r2 >= 0; r2--) if (S.b[r2 * W + c] !== -1) return false;
      if (S.h[c] !== k) return false;
    }
    var f = S.first, o = 1 - f;
    if (!(n[f] === n[o] || n[f] === n[o] + 1) || S.plies !== n[0] + n[1]) return false;
    if (S.winner !== -1) return S.winner === 0 || S.winner === 1 || S.winner === 2;
    if (S.turn !== (n[f] === n[o] ? f : o)) return false;
    for (var i = 0; i < N; i++) if (S.b[i] !== -1 && wins(S.b, i, S.b[i])) return false;
    return true;
  }

  return { W: W, H: H, N: N, LEVELS: LEVELS, ORDER: ORDER, LINES: LINES, newGame: newGame, clone: clone, landing: landing,
    canDrop: canDrop, legal: legal, play: play, winLines: winLines, winning: winning, evaluate: evaluate, think: think, valid: valid };
}
if (typeof module !== 'undefined' && module.exports) module.exports = FourRowEngineFactory;
/* ==== ENGINE END ==== */
</script>

  /* --------------------------------------------------------------- draw */

  function colors() {

  }

  function renderTop() {
    top.innerHTML = '';
    if (G.daily) {
      top.appendChild(el('span', { class: 'ch-badge ch-badge--accent' }, [C.icon('calendar', 14), el('span', { text: C.t('dailyFr') + ' — ' + C.num(G.daily) })]));

  function renderSide() {

        el('div', { class: 'fr-player__dot', style: { background: k === 0 ? 'var(--fr-a)' : 'var(--fr-b)' } }),

  /* -------------------------------------------------------------- input */

  // The column under a point, read against the size last drawn
  function readCol(x) {

    act(c);
  }
  cv.addEventListener('pointerdown', function (e) {
    if (busy()) return;
    e.preventDefault();
    kbOn = false;
    hover = -1;
    dropAt(readCol(e.clientX));
  });
  cv.addEventListener('pointermove', function (e) {
    if (e.pointerType !== 'mouse') return;
    var c = readCol(e.clientX);
    if (c !== hover) { hover = c; if (!kbOn) draw(); }
  });
  cv.addEventListener('pointerleave', function () { if (hover >= 0) { hover = -1; draw(); } });

  var DIGITS = { '1': 0, '2': 1, '3': 2, '4': 3, '5': 4, '6': 5, '7': 6, '۱': 0, '۲': 1, '۳': 2, '۴': 3, '۵': 4, '۶': 5, '۷': 6 };
  window.addEventListener('keydown', function (e) {
    if (!G || document.querySelector('.ch-scrim')) return;
    if (C.undoKey(e)) { undo(); e.preventDefault(); return; }
    if (busy() || e.ctrlKey || e.metaKey || e.altKey) return;
    var tg = e.target && e.target.tagName;
    if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT') return;
    // the board is drawn left to right in every language, so the arrows are geometric (#338)
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      if (kbOn) cur = Math.max(0, Math.min(E.W - 1, cur + (e.key === 'ArrowLeft' ? -1 : 1)));
      kbOn = true; draw(); return;
    }
    if (DIGITS[e.key] !== undefined) { e.preventDefault(); kbOn = true; cur = DIGITS[e.key]; dropAt(cur); return; }
    if ((e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') && tg !== 'BUTTON') {
      e.preventDefault();
      if (!kbOn) { kbOn = true; draw(); return; }
      dropAt(cur);
    }
  });

  if (window.ResizeObserver) new ResizeObserver(function () { draw(); }).observe(box);
  else window.addEventListener('resize', draw);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);

  /* --------------------------------------------------------------- help */

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [kb('← →', C.t('kCol')), kb('Space / Enter / ↓', C.t('kDrop')),
          kb(C.num(1) + '–' + C.num(7), C.t('kDigit')), kb('U / Ctrl+Z', C.t('undoMove'))])
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  // a 4×3 corner of the board for the tutorial
  function tArt(kind) {
    var s = '<svg viewBox="0 0 200 110" width="100%"><rect x="48" y="22" width="104" height="84" rx="10" fill="#5B2A6E"/>';
    var X = function (c) { return 63 + c * 25; }, Y = function (r) { return 38 + r * 25; };
    var cells = {};
    if (kind === 1) { cells['2,1'] = 1; cells['2,2'] = 0; }
    if (kind === 2) { cells['2,0'] = 0; cells['1,1'] = 0; cells['0,2'] = 0; cells['2,1'] = 1; cells['2,2'] = 1; cells['1,2'] = 1; }
    if (kind === 3) { cells['2,0'] = 1; cells['2,1'] = 1; cells['2,2'] = 1; cells['1,0'] = 0; cells['1,1'] = 0; }
    for (var r = 0; r < 3; r++) for (var c = 0; c < 4; c++) {
      var v = cells[r + ',' + c];
      s += '<circle cx="' + X(c) + '" cy="' + Y(r) + '" r="10" fill="' + (v === 0 ? '#E4572E' : v === 1 ? '#12998C' : '#F3ECF4') + '"/>';
      if (v === 0) s += '<circle cx="' + X(c) + '" cy="' + Y(r) + '" r="6" fill="none" stroke="#F6A487" stroke-width="1.8"/>';
      if (v === 1) s += '<circle cx="' + X(c) + '" cy="' + Y(r) + '" r="3" fill="#8FD9D1"/>';
    }
    if (kind === 1) s += '<circle cx="' + X(1) + '" cy="10" r="10" fill="#E4572E"/><path d="M' + X(1) + ' 24v' + (Y(1) - 36) + 'm-5 -6l5 6l5 -6" stroke="#3A2244" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
    if (kind === 2) s += '<circle cx="' + X(3) + '" cy="10" r="10" fill="#E4572E"/><path d="M' + (X(0) - 4) + ' ' + (Y(2) + 4) + 'L' + (X(3) + 4) + ' ' + (Y(-1) - 4) + '" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>';
    if (kind === 3) s += '<circle cx="' + X(3) + '" cy="' + Y(2) + '" r="10" fill="#E4572E"/><circle cx="' + X(3) + '" cy="' + Y(2) + '" r="6" fill="none" stroke="#F6A487" stroke-width="1.8"/><circle cx="' + X(3) + '" cy="' + Y(2) + '" r="13" fill="none" stroke="#3A2244" stroke-width="2.5"/>';
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: tArt(1) },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: tArt(2) },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: tArt(3) }
  ];

  /* -------------------------------------------------------------- start */

  var saved = ctx.loadSave();
  if (validSave(saved) && (saved.g.daily || null) === (dailyDate || null)) restore(saved.g);
  else newGame(dailyDate ? { daily: dailyDate } : { mode: prefs.mode, level: prefs.level, first: prefs.first });
  if (dailyDate && C.stats.dailyDone('fourrow', dailyDate)) {
    var rec = C.stats.dailyOf(dailyDate).fourrow;
    C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
  }
  ctx.tutorialIfNew(TUT);
})();
</script>
</body>
</html>
