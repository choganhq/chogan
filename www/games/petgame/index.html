<script>
/* ==== ENGINE START ==== */
function PetEngineFactory() {
  'use strict';

  var KINDS = ['mouse', 'butterfly', 'bug', 'light'];
  var MODES = ['mixed', 'mouse', 'bug', 'butterfly', 'light'];
  var SPEEDS = { slow: 0.6, normal: 1, fast: 1.6 };
  var HOLD_S = 1.5;        // how long the four corners are held to leave
  var RESPAWN_S = 0.45;    // a popped critter is replaced this long after
  var HIT_K = 1.35;        // a poke counts this many radii from a critter's centre: small paws and fingers miss a lot

  function unit(W, H) { return Math.min(W, H); }
  function radius(W, H) { return Math.max(26, Math.min(64, unit(W, H) * 0.085)); }
  // more critters on a bigger field, never fewer than three or more than seven
  function wanted(W, H) { return Math.max(3, Math.min(7, Math.round(W * H / 60000))); }

  function newField(W, H, mode, speed) {
    return {
      W: W, H: H, mode: MODES.indexOf(mode) < 0 ? 'mixed' : mode, speed: SPEEDS[speed] || 1,
      critters: [], bits: [], rings: [], queue: [], popped: 0, time: 0, nextId: 1, hold: 0
    };
  }

  function wrap(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }
  function turnToward(a, want, maxStep) {
    var d = wrap(want - a);
    if (Math.abs(d) <= maxStep) return want;
    return a + (d > 0 ? maxStep : -maxStep);
  }

  function retarget(S, c, rnd) {
    var m = c.r;
    c.tx = m + rnd() * Math.max(1, S.W - 2 * m);
    c.ty = m + rnd() * Math.max(1, S.H - 2 * m);
  }
  function pickKind(S, rnd) { return S.mode === 'mixed' ? KINDS[Math.floor(rnd() * KINDS.length) % KINDS.length] : S.mode; }

  function spawn(S, rnd, kind) {
    var r = radius(S.W, S.H);
    var c = {
      id: S.nextId++, kind: kind || pickKind(S, rnd), r: r,
      x: r + rnd() * Math.max(1, S.W - 2 * r), y: r + rnd() * Math.max(1, S.H - 2 * r),
      a: rnd() * 2 * Math.PI, v: 0, tx: 0, ty: 0, wait: 0, phase: rnd() * 6.28, wob: rnd() * 6.28, age: 0,
      variant: Math.floor(rnd() * 3), turn: 0, turnT: 0
    };
    retarget(S, c, rnd);
    S.critters.push(c);
    return c;
  }
  function fill(S, rnd) {
    var n = wanted(S.W, S.H);
    while (S.critters.length + S.queue.length < n) spawn(S, rnd);
  }
  function resize(S, W, H) {
    S.W = W; S.H = H;
    var r = radius(W, H);
    S.critters.forEach(function (c) {
      c.r = r;
      c.x = Math.max(r * 0.6, Math.min(W - r * 0.6, c.x));
      c.y = Math.max(r * 0.6, Math.min(H - r * 0.6, c.y));
      c.tx = Math.max(r, Math.min(W - r, c.tx)); c.ty = Math.max(r, Math.min(H - r, c.ty));
    });
  }
  // a new kind starts a fresh set, with the new ones fading in where they appear
  function setMode(S, mode, rnd) {
    S.mode = MODES.indexOf(mode) < 0 ? 'mixed' : mode;
    S.critters = []; S.queue = [];
    fill(S, rnd);
  }
  function setSpeed(S, name) { S.speed = SPEEDS[name] || 1; }

  function step(S, dt, rnd) {
    S.time += dt;
    var U = unit(S.W, S.H), k = S.speed;
    S.critters.forEach(function (c) {
      c.age += dt; c.wob += dt;
      if (c.kind === 'mouse') {
        // scurries to a spot, stops and twitches, then picks another
        if (c.wait > 0) { c.wait -= dt; c.v = 0; c.phase += dt * 3; }
        else {
          var dx = c.tx - c.x, dy = c.ty - c.y;
          if (Math.sqrt(dx * dx + dy * dy) < 0.04 * U) { c.wait = rnd() < 0.3 ? 0 : 0.25 + rnd() * 0.9; retarget(S, c, rnd); c.v = 0; }
          else { c.a = turnToward(c.a, Math.atan2(dy, dx), 9 * dt); c.v = 0.5 * U * k; c.phase += dt * 16 * k; }
        }
      } else if (c.kind === 'bug') {
        // crawls on a steady wobbly line, now and then stopping
        c.turnT -= dt;
        if (c.turnT <= 0) { c.turn = (rnd() - 0.5) * 3; c.turnT = 0.4 + rnd() * 0.9; if (rnd() < 0.15) c.wait = 0.3 + rnd() * 0.6; }
        if (c.wait > 0) { c.wait -= dt; c.v = 0; c.phase += dt * 4; }
        else { c.a += c.turn * dt; c.v = 0.2 * U * k; c.phase += dt * 18 * k; }
      } else if (c.kind === 'butterfly') {
        // flutters along a swaying path, never in a straight line
        c.turnT -= dt;
        if (c.turnT <= 0) { c.turn = (rnd() - 0.5) * 1.2; c.turnT = 0.6 + rnd() * 1.2; }
        c.a += (Math.sin(c.wob * 0.9) * 1.6 + c.turn) * dt;
        c.v = 0.17 * U * k * (0.8 + 0.4 * Math.sin(c.wob * 1.3));
        c.phase += dt * 15;
      } else {
        // a light darts to a spot, rests a moment and darts again, like a pointer on the floor
        c.turnT -= dt;
        if (c.turnT <= 0) { retarget(S, c, rnd); c.turnT = 0.45 + rnd() * 1.1 + (rnd() < 0.25 ? 0.6 : 0); }
        var lx = c.tx - c.x, ly = c.ty - c.y, d = Math.sqrt(lx * lx + ly * ly);
        c.a = Math.atan2(ly, lx);
        c.v = Math.min(d * 5, 1.7 * U * k);
        c.phase += dt * 6;
      }
      c.x += Math.cos(c.a) * c.v * dt;
      c.y += Math.sin(c.a) * c.v * dt;
      var m = c.r * 0.6;
      if (c.x < m) { c.x = m; c.a = Math.PI - c.a; }
      if (c.x > S.W - m) { c.x = S.W - m; c.a = Math.PI - c.a; }
      if (c.y < m) { c.y = m; c.a = -c.a; }
      if (c.y > S.H - m) { c.y = S.H - m; c.a = -c.a; }
    });
    // replacements arrive on their own, and a field that is short of critters is topped up
    for (var i = S.queue.length - 1; i >= 0; i--) {
      S.queue[i] -= dt;
      if (S.queue[i] <= 0) { S.queue.splice(i, 1); spawn(S, rnd); }
    }
    fill(S, rnd);
    for (var j = S.bits.length - 1; j >= 0; j--) {
      var b = S.bits[j];
      b.life -= dt; b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 420 * dt; b.vx *= Math.max(0, 1 - 2.5 * dt);
      if (b.life <= 0) S.bits.splice(j, 1);
    }
    for (var q = S.rings.length - 1; q >= 0; q--) {
      S.rings[q].t += dt;
      if (S.rings[q].t >= S.rings[q].life) S.rings.splice(q, 1);
    }
  }

  // The nearest critter within reach of a poke, or null. Reach is generous on purpose.
  function hit(S, x, y, slop) {
    var best = null, bd = Infinity;
    S.critters.forEach(function (c) {
      var reach = c.r * HIT_K + (slop || 0), dx = c.x - x, dy = c.y - y, d2 = dx * dx + dy * dy;
      if (d2 <= reach * reach && d2 < bd) { best = c; bd = d2; }
    });
    return best;
  }
  function pop(S, c, rnd) {
    var i = S.critters.indexOf(c);
    if (i < 0) return false;
    S.critters.splice(i, 1);
    S.popped++;
    S.queue.push(RESPAWN_S);
    for (var n = 0; n < 14; n++) {
      var a = (n / 14) * 2 * Math.PI + rnd() * 0.4, sp = 120 + rnd() * 220;
      S.bits.push({ x: c.x, y: c.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, life: 0.45 + rnd() * 0.4, max: 0.85, size: 3 + rnd() * 4, kind: c.kind, variant: c.variant, tone: n % 3 });
    }
    if (S.bits.length > 240) S.bits.splice(0, S.bits.length - 240);
    S.rings.push({ x: c.x, y: c.y, r: c.r, t: 0, life: 0.35, kind: c.kind, variant: c.variant });
    return true;
  }
  // a key press pops one critter, so a paw on the keyboard plays too
  function popAny(S, rnd) {
    if (!S.critters.length) return null;
    var c = S.critters[Math.floor(rnd() * S.critters.length) % S.critters.length];
    pop(S, c, rnd);
    return c;
  }

  // The four square zones in the corners of the field that are held to leave
  function zoneSize(W, H) { return Math.max(56, Math.min(110, unit(W, H) * 0.2)); }
  function zones(W, H) {
    var z = zoneSize(W, H);
    return [{ x: 0, y: 0, w: z, h: z }, { x: W - z, y: 0, w: z, h: z }, { x: 0, y: H - z, w: z, h: z }, { x: W - z, y: H - z, w: z, h: z }];
  }
  // true when every corner has a finger (or paw) in it; zones never overlap, so they
  // are four different pointers
  function cornersHeld(points, W, H) {
    if (W < 4 * zoneSize(W, H) / 2 || H < 2 * zoneSize(W, H)) return false;
    return zones(W, H).every(function (z) {
      return points.some(function (p) { return p.x >= z.x && p.x <= z.x + z.w && p.y >= z.y && p.y <= z.y + z.h; });
    });
  }
  // Counts the hold while all four are down; letting go of any resets it. True once it is long enough.
  function holdStep(S, held, dt) {
    S.hold = held ? S.hold + dt : 0;
    return S.hold >= HOLD_S;
  }

  return {
    KINDS: KINDS, MODES: MODES, SPEEDS: SPEEDS, HOLD_S: HOLD_S, RESPAWN_S: RESPAWN_S, HIT_K: HIT_K,
    radius: radius, wanted: wanted, newField: newField, spawn: spawn, fill: fill, resize: resize, setMode: setMode, setSpeed: setSpeed,
    step: step, hit: hit, pop: pop, popAny: popAny, zoneSize: zoneSize, zones: zones, cornersHeld: cornersHeld, holdStep: holdStep
  };
}
if (typeof module !== 'undefined') module.exports = PetEngineFactory;
/* ==== ENGINE END ==== */
</script>

    });
  }

  /* ------------------------------------------------------------ help */

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('pgRules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [kb(C.t('pgKeys'), C.t('pgKeyWhat')), kb(C.t('pgCorners'), C.t('pgCornersWhat'))])
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  var TUT = [{
    title: C.t('pgTutTitle'), text: C.t('pgTutText'),
    art: '<svg viewBox="0 0 200 110" width="100%" direction="ltr"><rect width="200" height="110" rx="10" fill="#F3EDE4"/>' +
      '<g fill="#005050" fill-opacity=".22" stroke="#005050" stroke-opacity=".7" stroke-width="2"><path d="M0 0H34A34 34 0 0 1 0 34Z"/><path d="M200 0V34A34 34 0 0 1 166 0Z"/><path d="M0 110V76A34 34 0 0 1 34 110Z"/><path d="M200 110H166A34 34 0 0 1 200 76Z"/></g>' +
      '<circle cx="100" cy="55" r="16" fill="#9AA1AB"/><circle cx="116" cy="55" r="8" fill="#9AA1AB"/></svg>'
  }];

  /* ----------------------------------------------------------- start */

  fit();
  draw();
  kick();
  // the first visit explains how to leave: a grown-up reads it, a pet never gets this far
  ctx.tutorialIfNew(TUT);
})();
</script>
</body>
</html>
