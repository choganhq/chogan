  /* Stone colours are part of the rules, not the theme; the wood is a little darker in dark mode. */

<script>
/* ==== ENGINE START ==== */
function GoEngineFactory() {
  'use strict';

  // 9×9 only: a short, finishable game, and the size where a light bot plays decently.
  // Board cells: 0 empty, 1 black (moves first), 2 white. PASS is -1.
  var N = 9, CELLS = 81, PASS = -1, KOMI = 6.5;

  var NB = [];
  for (var i = 0; i < CELLS; i++) {
    var r = (i / N) | 0, c = i % N, l = [];
    if (r > 0) l.push(i - N); if (r < N - 1) l.push(i + N);
    if (c > 0) l.push(i - 1); if (c < N - 1) l.push(i + 1);
    NB.push(l);
  }
  var DG = [];
  for (i = 0; i < CELLS; i++) {
    var rr = (i / N) | 0, cc = i % N, d = [];
    for (var dr = -1; dr <= 1; dr += 2) for (var dc = -1; dc <= 1; dc += 2) {
      var r2 = rr + dr, c2 = cc + dc;
      if (r2 >= 0 && r2 < N && c2 >= 0 && c2 < N) d.push(r2 * N + c2);
    }
    DG.push(d);
  }

  // The stones of the group at i and whether it has any liberty. Stops at the
  // first liberty when only that is asked, which is all a capture check needs.
  var mark = new Int32Array(CELLS), stamp = 0;
  function group(b, i, wantLibs) {
    var p = b[i], stack = [i], stones = [], libs = 0;
    stamp++;
    mark[i] = stamp;
    while (stack.length) {
      var k = stack.pop();
      stones.push(k);
      var nb = NB[k];
      for (var j = 0; j < nb.length; j++) {
        var m = nb[j];
        if (mark[m] === stamp) continue;
        if (b[m] === 0) { mark[m] = stamp; libs++; if (!wantLibs) return { stones: null, libs: 1 }; }
        else if (b[m] === p) { mark[m] = stamp; stack.push(m); }
      }
    }
    return { stones: stones, libs: libs };
  }
  function hasLiberty(b, i) { return group(b, i, false).libs > 0; }

  function newState() {
    var b = [];
    for (var k = 0; k < CELLS; k++) b.push(0);
    return { board: b, turn: 1, ko: -1, passes: 0, caps: [0, 0, 0], moves: 0 };
  }
  function clone(s) {
    return { board: s.board.slice(), turn: s.turn, ko: s.ko, passes: s.passes, caps: s.caps.slice(), moves: s.moves };
  }

  // Plays i (or PASS) for the side to move, in place. Returns false, changing
  // nothing, for an occupied point, the ko point, or suicide.
  function play(s, i) {
    var p = s.turn, o = 3 - p, b = s.board;
    if (i === PASS) { s.passes++; s.ko = -1; s.turn = o; s.moves++; return true; }
    if (b[i] !== 0 || i === s.ko) return false;
    b[i] = p;
    var captured = 0, lastCap = -1, nb = NB[i];
    for (var j = 0; j < nb.length; j++) {
      var m = nb[j];
      if (b[m] !== o || hasLiberty(b, m)) continue;
      var g = group(b, m, true).stones;
      for (var k = 0; k < g.length; k++) b[g[k]] = 0;
      captured += g.length;
      lastCap = m;
    }
    if (!captured && !hasLiberty(b, i)) { b[i] = 0; return false; }
    // Simple ko: a single stone that took a single stone and now has one liberty
    // may not be taken back at once
    var mine = captured === 1 ? group(b, i, true) : null;
    s.ko = mine && mine.stones.length === 1 && mine.libs === 1 ? lastCap : -1;
    s.caps[p] += captured;
    s.passes = 0;
    s.turn = o;
    s.moves++;
    return true;
  }

  function legal(s, i) {
    if (i === PASS) return true;
    if (s.board[i] !== 0 || i === s.ko) return false;
    var t = clone(s);
    return play(t, i);
  }

  // A point every neighbour of which is p's, with at most one opponent on the
  // diagonals (none on the edge). Filling it would throw away an eye.
  function isEye(b, i, p) {
    if (b[i] !== 0) return false;
    var nb = NB[i];
    for (var j = 0; j < nb.length; j++) if (b[nb[j]] !== p) return false;
    var bad = 0, dg = DG[i];
    for (j = 0; j < dg.length; j++) if (b[dg[j]] === 3 - p) bad++;
    return dg.length === 4 ? bad <= 1 : bad === 0;
  }

  // Area scoring: stones plus empty regions that touch only one colour. Stones
  // left on the board count as alive, so dead stones must be captured before
  // both players pass; the rules text says so.
  function score(b) {
    var area = [0, 0, 0], seen = new Uint8Array(CELLS), owner = [];
    for (var k = 0; k < CELLS; k++) owner.push(b[k]);
    for (var i = 0; i < CELLS; i++) {
      if (b[i]) { area[b[i]]++; continue; }
      if (seen[i]) continue;
      var stack = [i], region = [], touch = 0;
      seen[i] = 1;
      while (stack.length) {
        var x = stack.pop();
        region.push(x);
        var nb = NB[x];
        for (var j = 0; j < nb.length; j++) {
          var m = nb[j];
          if (b[m]) touch |= b[m];
          else if (!seen[m]) { seen[m] = 1; stack.push(m); }
        }
      }
      if (touch === 1 || touch === 2) {
        area[touch] += region.length;
        for (j = 0; j < region.length; j++) owner[region[j]] = touch;
      }
    }
    return { black: area[1], white: area[2] + KOMI, owner: owner, winner: area[1] > area[2] + KOMI ? 1 : 2 };
  }

  // Random playout to the end: random legal moves that do not fill one's own
  // eye, until no such move is left for both sides. Returns the winner.
  function playout(s, rnd) {
    var limit = CELLS * 3, empties = [];
    while (s.passes < 2 && s.moves < limit) {
      empties.length = 0;
      for (var i = 0; i < CELLS; i++) if (s.board[i] === 0) empties.push(i);
      var moved = false;
      while (empties.length) {
        var k = Math.floor(rnd() * empties.length), m = empties[k];
        empties[k] = empties[empties.length - 1]; empties.pop();
        if (isEye(s.board, m, s.turn)) continue;
        if (play(s, m)) { moved = true; break; }
      }
      if (!moved) play(s, PASS);
    }
    return score(s.board).winner;
  }

  // Stones a move at i captures, plus own stones in atari that it gives a second liberty.
  function atariStake(s, i) {
    var b = s.board, p = s.turn, o = 3 - p, nb = NB[i], stake = 0, seen = [];
    for (var j = 0; j < nb.length; j++) {
      var m = nb[j];
      if (!b[m] || seen.indexOf(m) >= 0) continue;
      var g = group(b, m, true);
      for (var k = 0; k < g.stones.length; k++) seen.push(g.stones[k]);
      if (g.libs !== 1) continue;
      if (b[m] === o) stake += g.stones.length;
      else {
        var t = clone(s);
        if (play(t, i) && group(t.board, i, true).libs >= 2) stake += g.stones.length;
      }
    }
    return stake;
  }

  // Flat Monte Carlo with UCB1 over the candidate moves (pass included): each
  // playout goes to the most promising candidate so far. Strength is the playout
  // budget. Returns PASS when passing does at least as well as any move.
  var BUDGET = { easy: 150, medium: 1500, hard: 5000 };
  function think(s, level, rnd, budget) {
    rnd = rnd || Math.random;
    var n = budget || BUDGET[level] || BUDGET.medium, p = s.turn, cands = [PASS];
    for (var i = 0; i < CELLS; i++) if (s.board[i] === 0 && !isEye(s.board, i, p) && legal(s, i)) cands.push(i);
    if (cands.length === 1) return PASS;
    // Random playouts capture a group in atari sooner or later anyway, so they
    // barely value taking it now (or saving one's own). A prior of won playouts,
    // growing with the stones at stake, makes the bot see that.
    var wins = [], tries = [], total = 0;
    for (i = 0; i < cands.length; i++) {
      // easy plays without it, so a beginner's groups in atari can get away
      var stake = cands[i] === PASS || level === 'easy' ? 0 : atariStake(s, cands[i]);
      var prior = stake ? Math.min(40, 8 * stake) : 0;
      wins.push(prior); tries.push(prior);
    }
    for (var t = 0; t < n; t++) {
      var best = 0, bestU = -1;
      for (i = 0; i < cands.length; i++) {
        var u = tries[i] ? wins[i] / tries[i] + Math.sqrt(2 * Math.log(total + 1) / tries[i]) : 1e9 + rnd();
        if (u > bestU) { bestU = u; best = i; }
      }
      var c = clone(s);
      play(c, cands[best]);
      if (playout(c, rnd) === p) wins[best]++;
      tries[best]++; total++;
    }
    var pick = 0, rate = -1;
    for (i = 1; i < cands.length; i++) {
      var w = tries[i] ? wins[i] / tries[i] : 0;
      if (w > rate || (w === rate && tries[i] > tries[pick])) { rate = w; pick = i; }
    }
    // Pass only when no move does better and the game is effectively decided
    var passRate = tries[0] ? wins[0] / tries[0] : 0;
    if (s.passes && passRate >= rate - 0.02 && passRate > 0.5) return PASS;
    return cands[pick];
  }

  // End of game: players often pass with hopeless stones still on the board.
  // Random playouts from the final position settle them; a stone that ends up
  // in the other colour's area in most playouts is dead and is removed before
  // counting. Returns the counted board and the dead stones.
  function finalScore(s, rnd, runs) {
    rnd = rnd || Math.random;
    runs = runs || 300;
    var own = [];
    for (var i = 0; i < CELLS; i++) own.push(0);
    for (var k = 0; k < runs; k++) {
      var c = clone(s);
      c.passes = 0;
      playout(c, rnd);
      var o = score(c.board).owner;
      for (i = 0; i < CELLS; i++) if (s.board[i] && o[i] === s.board[i]) own[i]++;
    }
    var b = s.board.slice(), dead = [];
    for (i = 0; i < CELLS; i++) if (b[i] && own[i] < runs * 0.3) dead.push(i);
    for (i = 0; i < dead.length; i++) b[dead[i]] = 0;
    var sc = score(b);
    sc.dead = dead;
    sc.board = b;
    return sc;
  }

  // Daily opening: two stones each on the 3-3 to 5-5 area, from the day's seed.
  function dailyOpening(rnd) {
    var s = newState(), tries = 0;
    while (s.moves < 4 && tries++ < 100) {
      var i = (2 + Math.floor(rnd() * 5)) * N + 2 + Math.floor(rnd() * 5);
      play(s, i);
    }
    return s;
  }

  var api = {
    N: N, CELLS: CELLS, PASS: PASS, KOMI: KOMI, NB: NB,
    newState: newState, clone: clone, play: play, legal: legal, group: group, isEye: isEye,
    score: score, finalScore: finalScore, playout: playout, think: think, dailyOpening: dailyOpening, BUDGET: BUDGET
  };
  if (typeof self !== 'undefined') self.GoEngine = api;
  return api;
}
if (typeof module !== 'undefined' && module.exports) module.exports = GoEngineFactory;
/* ==== ENGINE END ==== */
</script>

        tutTitle3: 'Final y recuento', tutText3: 'Cuando no quede nada útil por hacer, pasa. Tras dos pases seguidos se cuentan las piedras y el territorio de cada lado, y las piedras sin salvación se cuentan como muertas automáticamente.'

  });

  var params = new URLSearchParams(location.search);
  var dailyDate = params.get('daily');
  var DAILY_LEVEL = 'medium';
  var prefs = ctx.store.get('prefs', { mode: 'ai', level: 'medium', color: 1, p2name: '' });
  if (prefs.color !== 1 && prefs.color !== 2) prefs.color = 1;

  var S = null, aiTimer = null, note = '';
  var kbOn = false, cur = { r: 4, c: 4 };

  var cv = document.createElement('canvas');
  cv.className = 'go-canvas';
  cv.setAttribute('role', 'img');
  cv.setAttribute('aria-label', C.t('boardLabel'));
  var boardBox = el('div', { class: 'go-boardbox' }, [cv]);
  var top = el('div', { class: 'go-top ch-above' });
  var playersRow = el('div', { class: 'go-players ch-above' });
  var noteEl = el('div', { class: 'go-note', 'aria-live': 'polite' });
  var passBtn = el('button', { class: 'ch-btn ch-btn--soft', type: 'button', text: C.t('pass'), onclick: function () { if (!busy()) move(PASS); } });
  var wrap = el('div', { class: 'go-wrap ch-split' }, [el('div', { class: 'ch-fit' }, [boardBox]), el('div', { class: 'ch-side' }, [top, playersRow, el('div', { class: 'go-actions' }, [passBtn]), noteEl])]);

  ctx.button({ icon: 'help', label: C.t('help'), onClick: showHelp });
  ctx.button({ icon: 'undo', label: C.t('undoMove'), onClick: undo });
  ctx.button({ icon: 'refresh', label: C.t('newMatch'), onClick: askNew });
  ctx.main.appendChild(wrap);
  ctx.mount();

  /* ------------------------------------------------------------ setup */

  function newGame(o) {
    stopAi();
    var g = o.daily ? E.dailyOpening(C.daily('go', o.daily).rng) : E.newState();
    S = {
      mode: o.mode, level: o.daily ? DAILY_LEVEL : o.level, human: o.mode === 'ai' && !o.daily ? o.color : 1,
      daily: o.daily || null, g: g, history: [], last: -1, end: null, done: false, startedAt: Date.now()
    };
    if (!o.daily) {
      prefs.mode = o.mode; prefs.level = o.level; prefs.color = o.color;
      ctx.store.set('prefs', prefs);
    }
    note = '';
    render();
    save();
    maybeAi();
  }
  function fromPrefs() { return { mode: prefs.mode, level: prefs.level, color: prefs.color }; }
  function current() { return { mode: S.mode, level: S.level, color: S.human }; }

  function aiSide() { return 3 - S.human; }
  function busy() { return S && S.mode === 'ai' && !S.done && S.g.turn === aiSide(); }
  function stopAi() { if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; } }

  function maybeAi() {
    if (!busy()) return;
    drawPlayers();
    passBtn.disabled = true;
    // Let the page paint the human's stone before the bot's search blocks it
    aiTimer = setTimeout(function () {
      aiTimer = null;
      if (!busy()) return;
      var rnd = S.daily ? C.daily('go', S.daily + '|' + S.g.moves).rng : Math.random;
      move(E.think(S.g, S.level, rnd));
    }, 260);
  }

  /* ------------------------------------------------------------- moves */

  function move(i) {
    if (!S || S.done) return;
    var before = E.clone(S.g), who = S.g.turn;
    if (i !== PASS && !E.legal(S.g, i)) {
      note = i === S.g.ko ? C.t('koNote') : (S.g.board[i] ? '' : C.t('suicideNote'));
      C.feedback('bad');
      drawNote();
      return;
    }
    E.play(S.g, i);
    S.history.push({ g: before, last: S.last });
    S.last = i;
    var vsAi = S.mode === 'ai';
    note = i === PASS ? C.t('passedNote', { n: pname(who) }) : '';
    C.feedback(i === PASS ? 'select' : (vsAi && who === aiSide() ? 'soft' : 'tap'));
    if (S.g.passes >= 2) { endGame(); return; }
    render();
    save();
    maybeAi();
  }

  // Against the AI one undo takes back the bot's reply and your move together
  function undo() {
    if (!S || S.done || !S.history.length) return;
    stopAi();
    var steps = S.mode === 'ai' ? (S.g.turn === S.human ? 2 : 1) : 1;
    if (S.history.length < steps) return;
    for (var k = 0; k < steps; k++) { var h = S.history.pop(); S.g = h.g; S.last = h.last; }
    note = '';
    C.feedback('soft');
    render();
    save();
    maybeAi();
  }

  /* ------------------------------------------------------------ result */

  function endGame() {
    stopAi();
    var rnd = S.daily ? C.daily('go', S.daily + '|end').rng : Math.random;
    S.end = E.finalScore(S.g, rnd, 300);
    S.done = true;
    note = '';
    render();
    finish();
  }

  function finish() {
    var sc = S.end, vsAi = S.mode === 'ai', winner = sc.winner;
    var won = vsAi ? winner === S.human : true;
    var mine = S.human === 1 ? sc.black : sc.white, theirs = S.human === 1 ? sc.white : sc.black;
    var margin = Math.round((mine - theirs) * 2) / 2;
    var base = vsAi ? ({ easy: 5, medium: 12, hard: 20 }[S.level] || 12) : 8;
    var coins = Math.max(2, Math.round(won ? base : base * 0.35)) + (S.daily ? 8 : 0);
    var points = Math.max(3, Math.round(won ? base * 4 : base * 1.2)) + (S.daily ? 25 : 0);
    if (vsAi && won) {
      C.achievements.unlock('go-win');
      if (S.level === 'hard') C.achievements.unlock('go-hard');
      C.stats.best('go', 'margin', margin, false);
    }
    var label = C.t('scoreLine', { b: C.num(sc.black), w: C.num(sc.white) });
    if (S.daily) {
      var first = C.stats.daily('go', S.daily, { label: (won ? C.t('won') : C.t('lost')) + ' · ' + label, win: won, diff: margin });
      if (!first) { coins = Math.round(coins * 0.2); points = Math.round(points * 0.2); }
    }
    ctx.clearSave();
    var lines = [
      { label: C.t('black') + ' · ' + C.t('area'), value: C.num(sc.black) },
      { label: C.t('white') + ' · ' + C.t('area') + ' (+' + C.num(E.KOMI) + ' ' + C.t('komi') + ')', value: C.num(sc.white) }
    ];
    if (sc.dead.length) lines.push({ label: C.t('deadNote'), value: C.num(sc.dead.length) });
    ctx.finish({
      won: vsAi ? won : null,
      title: vsAi ? (won ? C.t('won') : C.t('lost')) : C.t('playerWon', { n: pname(winner) }),
      timeMs: Date.now() - S.startedAt, coins: coins, points: points, lines: lines,
      shareText: 'چوگان · گو' + (S.daily ? ('\nروزانه ' + S.daily) : '') + '\n' + label,
      paint: cardPaint(),
      onAgain: S.daily ? null : function () { newGame(current()); }
    });
  }

  /* ------------------------------------------------------------- saves */

  ctx.autosave(function () {
    if (!S || S.done || !S.history.length) return { inProgress: false };
    return {
      s: {
        mode: S.mode, level: S.level, human: S.human, daily: S.daily, g: S.g, last: S.last,
        history: S.history, elapsed: Date.now() - S.startedAt
      },
      prefs: prefs
    };
  });
  function save() { ctx.save(); }
  function validGame(g) {
    return !!(g && Array.isArray(g.board) && g.board.length === E.CELLS && (g.turn === 1 || g.turn === 2) && Array.isArray(g.caps));
  }
  function validSave(sv) {
    var s = sv && sv.s;
    return !!(s && validGame(s.g) && Array.isArray(s.history) && s.history.length && (s.human === 1 || s.human === 2));
  }
  function restore(v) {
    S = {
      mode: v.mode, level: v.level, human: v.human, daily: v.daily || null, g: v.g, last: typeof v.last === 'number' ? v.last : -1,
      history: v.history, end: null, done: false, startedAt: Date.now() - (v.elapsed || 0)
    };
    note = '';
    render();
    maybeAi();
  }

  function askNew() {
    var dd = S ? S.daily : null;
    function go() { if (dd) newGame({ mode: 'ai', daily: dd }); else newGame(S ? current() : fromPrefs()); }
    if (!S || S.done || !S.history.length) { go(); return; }
    C.ui.confirm({ title: C.t('newMatch'), body: C.t('resetWarn'), onOk: go });
  }

  /* --------------------------------------------------------------- draw */

  function colors() {
    var cs = getComputedStyle(document.documentElement);
    var v = function (k, f) { return cs.getPropertyValue(k).trim() || f; };
    return {
      wood: v('--go-wood', '#DDB97E'), line: v('--go-line', 'rgba(60,38,10,.55)'),
      black: v('--go-black', '#1A1A1A'), white: v('--go-white', '#F5F0E6'),
      mark: v('--c-gold', '#D9A441'), accent: v('--game', '#8A6A3B'), bad: v('--c-bad', '#D9534F')
    };
  }

  // Shared by drawing and hit-testing; the margin is 0.7 of a cell so corner stones
  // clear the board's rounded corners
  function geo(W) { var pad = W / (N + 0.4) * 0.7; return { pad: pad, cell: (W - pad * 2) / (N - 1) }; }
  var STARS = [[2, 2], [2, 6], [4, 4], [6, 2], [6, 6]];

  function paintBoard(g, W, o, col) {
    var G = geo(W), pad = G.pad, cell = G.cell, k;
    g.fillStyle = col.wood;
    C.rrect(g, 0, 0, W, W, Math.round(W * 0.03));
    g.fill();
    g.strokeStyle = col.line;
    g.lineWidth = Math.max(1, W / 380);
    g.beginPath();
    for (k = 0; k < N; k++) {
      var p = pad + k * cell;
      g.moveTo(pad, p); g.lineTo(W - pad, p);
      g.moveTo(p, pad); g.lineTo(p, W - pad);
    }
    g.stroke();
    g.fillStyle = col.line;
    STARS.forEach(function (s) { g.beginPath(); g.arc(pad + s[1] * cell, pad + s[0] * cell, Math.max(2, cell * 0.08), 0, Math.PI * 2); g.fill(); });
    var R = cell * 0.46, dead = {};
    (o.end ? o.end.dead : []).forEach(function (i) { dead[i] = true; });
    for (var i = 0; i < E.CELLS; i++) {
      var cx = pad + (i % N) * cell, cy = pad + ((i / N) | 0) * cell, who = o.board[i];
      if (!who) {
        // Territory at the end: a small square of the owner's colour
        if (o.end && o.end.owner[i]) {
          var q = cell * 0.22;
          g.fillStyle = o.end.owner[i] === 1 ? col.black : col.white;
          g.fillRect(cx - q / 2, cy - q / 2, q, q);
        }
        continue;
      }
      g.globalAlpha = dead[i] ? 0.45 : 1;
      // the stone just placed comes down onto the board, a little large and faint first (#407)
      var Rs = R;
      if (o.drop && o.drop.i === i) { var de = 1 - Math.pow(1 - o.drop.k, 3); Rs = R * (1 + 0.4 * (1 - de)); g.globalAlpha = 0.3 + 0.7 * de; }
      g.beginPath(); g.arc(cx + Rs * 0.08, cy + Rs * 0.12, Rs, 0, Math.PI * 2);
      g.fillStyle = 'rgba(0,0,0,.22)'; g.fill();
      g.beginPath(); g.arc(cx, cy, Rs, 0, Math.PI * 2);
      g.fillStyle = who === 1 ? col.black : col.white; g.fill();
      g.lineWidth = Math.max(1, R * 0.08);
      g.strokeStyle = who === 1 ? 'rgba(255,255,255,.14)' : 'rgba(0,0,0,.28)';
      g.stroke();
      g.globalAlpha = 1;
      if (dead[i]) {
        g.strokeStyle = col.bad; g.lineWidth = Math.max(2, R * 0.16); g.lineCap = 'round';
        g.beginPath(); g.moveTo(cx - R * 0.45, cy - R * 0.45); g.lineTo(cx + R * 0.45, cy + R * 0.45);
        g.moveTo(cx + R * 0.45, cy - R * 0.45); g.lineTo(cx - R * 0.45, cy + R * 0.45); g.stroke();
      } else if (i === o.last && !o.end) {
        g.beginPath(); g.arc(cx, cy, R * 0.32, 0, Math.PI * 2);
        g.strokeStyle = col.mark; g.lineWidth = Math.max(2, R * 0.14); g.stroke();
      }
    }
    // captured stones fade where they stood (#407)
    (o.gone || []).forEach(function (s) {
      var gx = pad + (s.i % N) * cell, gy = pad + ((s.i / N) | 0) * cell;
      g.globalAlpha = 1 - s.k;
      g.beginPath(); g.arc(gx, gy, R * (1 - 0.4 * s.k), 0, Math.PI * 2);
      g.fillStyle = s.who === 1 ? col.black : col.white; g.fill();
      g.globalAlpha = 1;
    });
    if (o.cursor) {
      g.strokeStyle = col.accent;
      g.lineWidth = Math.max(2, W / 200);
      g.beginPath(); g.arc(pad + o.cursor.c * cell, pad + o.cursor.r * cell, R * 1.05, 0, Math.PI * 2); g.stroke();
    }
  }

  function draw() {
    var rect = boardBox.getBoundingClientRect();
    var W = Math.max(1, Math.floor(Math.min(rect.width, rect.height || rect.width)));
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    // both sides: a new canvas is 300×150, so a board exactly 300px wide kept a
    // 150px-high backing and was drawn squashed (#359, seen in Ludo)
    if (cv.width !== W * dpr || cv.height !== W * dpr) { cv.width = W * dpr; cv.height = W * dpr; }
    cv.style.width = W + 'px'; cv.style.height = W + 'px';
    var g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, W);
    var m = motion();
    paintBoard(g, W, { board: S.g.board, last: S.last, end: S.end, cursor: kbOn && !S.done ? cur : null,
      drop: m.drop < 1 ? { i: S.last, k: m.drop } : null, gone: m.gone }, colors());
    if (m.drop < 1 || m.gone.length) requestAnimationFrame(draw);
  }

  // #407: a stone placed since the last draw drops in (180 ms) and the stones it
  // captured fade (300 ms). Restores, undo and reduced motion draw still.
  var fx = { len: -1, t0: 0, gone: [] };
  function motion() {
    var now = performance.now(), len = S.history.length;
    if (fx.len >= 0 && len === fx.len + 1 && !C.ui.reduceMotion()) {
      fx.t0 = now;
      var before = S.history[len - 1].g.board;
      fx.gone = [];
      for (var i = 0; i < before.length; i++) if (before[i] && !S.g.board[i]) fx.gone.push({ i: i, who: before[i] });
    } else if (len !== fx.len) fx.gone = [];
    fx.len = len;
    var k = Math.min(1, (now - fx.t0) / 300);
    if (k >= 1) fx.gone = [];
    return { drop: Math.min(1, (now - fx.t0) / 180), gone: fx.gone.map(function (s) { return { i: s.i, who: s.who, k: k }; }) };
  }

  function cardPaint() {
    var o = { board: S.g.board.slice(), last: S.last, end: S.end };
    return function (g, W, H) {
      var side = Math.min(W, H);
      g.translate((W - side) / 2, (H - side) / 2);
      paintBoard(g, side, o, colors());
    };
  }

  function pname(p) {
    if (S.mode === 'ai') return p === S.human ? (C.state.profile.name || C.t('you')) : C.t('rival') + ' · ' + C.t(S.level);
    return p === 1 ? (C.state.profile.name || C.t('black')) : (prefs.p2name || C.t('player2'));
  }

  function drawPlayers() {
    playersRow.innerHTML = '';
    [1, 2].forEach(function (p) {
      var box = el('div', { class: 'go-player' + (S.g.turn === p && !S.done ? ' go-player--on' : '') }, [
        el('div', { class: 'go-player__stone', style: { background: p === 1 ? 'var(--go-black)' : 'var(--go-white)' } }),
        el('div', { class: 'go-player__name', text: pname(p) }),
        el('div', { class: 'go-player__caps', title: C.t('captured'), 'aria-label': C.t('captured'), text: C.num(S.g.caps[p]) })
      ]);
      if (p === 2 && S.mode === '2p') { box.classList.add('ch-tap'); box.addEventListener('click', renameP2); }
      if (S.mode === 'ai' && p === aiSide() && busy()) box.classList.add('go-thinking');
      playersRow.appendChild(box);
    });
  }

  function renameP2() {
    var input = el('input', {
      type: 'text', value: prefs.p2name, maxlength: '16', placeholder: C.t('player2'),
      style: { font: 'inherit', width: '100%', padding: '10px 14px', 'border-radius': 'var(--r-md)',
        border: '1px solid var(--c-line)', background: 'var(--c-surface-2)', color: 'var(--c-text)' }
    });
    C.ui.modal({
      title: C.t('renameP2'), body: [input],
      actions: [{ label: C.t('cancel') }, { label: C.t('done'), kind: 'primary', onClick: function () {
        prefs.p2name = input.value.trim().slice(0, 16);
        ctx.store.set('prefs', prefs);
        drawPlayers();
      } }]
    });
  }

  function drawTop() {
    top.innerHTML = '';
    if (S.daily) {
      top.appendChild(el('span', { class: 'ch-badge ch-badge--accent' },
        [C.icon('calendar', 14), el('span', { text: C.t('dailyGo') + ' — ' + C.num(S.daily) })]));
      top.appendChild(el('span', { class: 'ch-badge', text: C.t('vsMedium') }));
      return;
    }
    function change(same, o) {
      if (same) return;
      var go = function () { newGame(o); };
      if (S.history.length && !S.done) C.ui.confirm({ title: C.t('newMatch'), body: C.t('resetWarn'), onOk: go });
      else go();
    }
    function withK(k, v) { var o = current(); o[k] = v; return o; }
    top.appendChild(C.ui.segmented([
      { value: 'ai', label: C.t('vsAi') }, { value: '2p', label: C.t('twoPlayers') }
    ], S.mode, function (v) { change(v === S.mode, withK('mode', v)); }));
    if (S.mode === 'ai') {
      top.appendChild(C.ui.segmented([
        { value: 'easy', label: C.t('easy') }, { value: 'medium', label: C.t('medium') }, { value: 'hard', label: C.t('hard') }
      ], S.level, function (v) { change(v === S.level, withK('level', v)); }));
      top.appendChild(C.ui.segmented([
        { value: 1, label: C.t('playBlack') }, { value: 2, label: C.t('playWhite') }
      ], S.human, function (v) { change(v === S.human, withK('color', v)); }));
    }
  }

  function drawNote() { noteEl.textContent = note; }

  function render() {
    drawTop();
    drawPlayers();
    passBtn.disabled = S.done || busy();
    drawNote();
    draw();
  }

  /* -------------------------------------------------------------- input */

  function cellAt(x, y) {
    var r = cv.getBoundingClientRect(), G = geo(r.width);
    var c = Math.round((x - r.left - G.pad) / G.cell), row = Math.round((y - r.top - G.pad) / G.cell);
    if (c < 0 || c >= N || row < 0 || row >= N) return -1;
    return row * N + c;
  }

  cv.addEventListener('pointerdown', function (e) {
    if (!S || S.done || busy()) return;
    var i = cellAt(e.clientX, e.clientY);
    if (i < 0 || S.g.board[i]) return;
    e.preventDefault();
    kbOn = false;
    move(i);
  });

  window.addEventListener('keydown', function (e) {
    if (!S || document.querySelector('.ch-scrim')) return;
    if (C.undoKey(e)) { undo(); e.preventDefault(); return; }
    if (S.done || busy()) return;
    // The board is drawn left to right in every language; flipping the arrows
    // in RTL made them run backwards in Persian (#338)
    var k = e.key, d = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[k];
    if (d) {
      e.preventDefault();
      kbOn = true;
      cur.r = Math.max(0, Math.min(N - 1, cur.r + d[0]));
      cur.c = Math.max(0, Math.min(N - 1, cur.c + d[1]));
      draw();
      return;
    }
    if ((k === ' ' || k === 'Enter') && kbOn) {
      e.preventDefault();
      var i = cur.r * N + cur.c;
      if (!S.g.board[i]) move(i);
      return;
    }
    if (C.keyIs(e, 'p')) { e.preventDefault(); move(PASS); }
  });

  // the board's size follows its slot, which changes with the window and the side column
  if (window.ResizeObserver) new ResizeObserver(function () { if (S) draw(); }).observe(boardBox);
  else window.addEventListener('resize', function () { if (S) draw(); });
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', function () { if (S) draw(); });
  }

  /* --------------------------------------------------------------- help */

  function kb(k, what) {
    return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]);
  }
  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [
          kb('← ↑ → ↓', C.t('moveCursor')), kb('Space / Enter', C.t('place')), kb('P', C.t('pass')), kb('U / Ctrl+Z', C.t('undoMove'))
        ])
      ],
      actions: [
        { label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } },
        { label: C.t('done'), kind: 'primary' }
      ]
    });
  }

  function art(stones, marks) {
    var s = '<svg viewBox="0 0 220 110" width="100%"><rect x="45" y="3" width="130" height="104" rx="8" fill="var(--go-wood)"/><g stroke="var(--go-line)" stroke-width="1">';
    for (var k = 0; k < 6; k++) s += '<path d="M' + (55 + k * 22) + ' 15v80M55 ' + (15 + k * 16) + 'h110"/>';
    s += '</g>';
    stones.forEach(function (m) {
      s += '<circle cx="' + (55 + m[0] * 22) + '" cy="' + (15 + m[1] * 16) + '" r="7" fill="var(--go-' + (m[2] === 1 ? 'black' : 'white') + ')" stroke="rgba(0,0,0,.3)"' + (m[3] ? ' opacity=".4"' : '') + '/>';
    });
    (marks || []).forEach(function (m) {
      s += '<rect x="' + (55 + m[0] * 22 - 3) + '" y="' + (15 + m[1] * 16 - 3) + '" width="6" height="6" fill="var(--go-' + (m[2] === 1 ? 'black' : 'white') + ')"/>';
    });
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: art([[2, 2, 2, 1], [1, 2, 1], [3, 2, 1], [2, 1, 1], [2, 3, 1]]) },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: art([[1, 1, 1], [2, 1, 1], [3, 1, 1], [1, 2, 1], [3, 2, 1], [1, 3, 1], [2, 3, 1], [3, 3, 1], [1, 4, 1], [3, 4, 1], [2, 5, 1]], [[2, 2, 1], [2, 4, 1]]) },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: art([[0, 1, 1], [1, 1, 1], [2, 2, 1], [3, 2, 2], [4, 1, 2], [5, 1, 2], [4, 4, 1, true]], [[0, 3, 1], [1, 4, 1], [5, 3, 2], [4, 3, 2]]) }
  ];

  /* -------------------------------------------------------------- start */

  var saved = ctx.loadSave();
  if (dailyDate) {
    if (validSave(saved) && saved.s.daily === dailyDate) restore(saved.s);
    else newGame({ mode: 'ai', daily: dailyDate });
    if (C.stats.dailyDone('go', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).go;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec.label });
    }
    ctx.tutorialIfNew(TUT);
  } else if (validSave(saved)) {
    if (saved.prefs) prefs = saved.prefs;
    restore(saved.s);
  } else {
    newGame(fromPrefs());
    ctx.tutorialIfNew(TUT);
  }
})();
</script>
</body>
</html>
