<!doctype html>

<style>
  .sr-wrap > .ch-fit { --fit-ar: calc(360 / 640); }
  .ch-fit > .sr-box { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
  .sr-canvas { display: block; touch-action: none; border-radius: var(--r-lg); direction: ltr; }
  .sr-top { display: flex; justify-content: center; align-items: center; gap: var(--s-2); flex-wrap: wrap; }
  .sr-hud { display: flex; justify-content: center; align-items: stretch; gap: var(--s-2); width: 100%; max-width: 420px; }
  .sr-pill { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 4px 8px; border-radius: var(--r-md); background: var(--c-surface-2); min-width: 0; }
  .sr-pill__label { font-size: var(--fs-xs); color: var(--c-text-dim); white-space: nowrap; }
  .sr-pill__value { font-size: var(--fs-lg); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.3; }
  .sr-lives { display: flex; gap: 3px; align-items: center; min-height: 1.3em; direction: ltr; }
  .sr-lives svg { display: block; }
  .sr-status { min-height: 1.6em; font-weight: 700; color: var(--c-text-dim); text-align: center; font-size: var(--fs-sm); }
  .sr-pill--ships { flex: 1.4; }
  .sr-gear .ch-icon { pointer-events: none; }
  .sr-stages { display: flex; flex-direction: column; gap: 6px; margin-bottom: var(--s-3); }
  .sr-stage { display: flex; align-items: center; gap: var(--s-2); width: 100%; padding: 8px 12px; border: 1px solid var(--c-border, transparent); border-radius: var(--r-md); background: var(--c-surface-2); color: var(--c-text); font: inherit; text-align: start; cursor: pointer; }
  .sr-stage:disabled { opacity: .45; cursor: default; }
  .sr-stage.is-on { outline: 2px solid var(--game, var(--c-accent)); outline-offset: -2px; }
  .sr-stage__n { min-width: 1.6em; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--c-text-dim); }
  .sr-stage__name { flex: 1; font-weight: 700; min-width: 0; }
  .sr-stage__best { font-size: var(--fs-sm); color: var(--c-text-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sr-wrap { touch-action: none; user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<script src="../../version.js"></script>
<script src="../../lib/chogan.js"></script>
<script>
/* ==== ENGINE START ==== */
function StarRaidEngineFactory() {
  'use strict';

  // The sky is 360 × 640 units, y down; the player's ship flies along a line near the
  // bottom. A run is one stage of five waves. It advances in fixed steps of 1/60 s, so
  // a frame rate never changes the game, and every chance is drawn from the run's own
  // seeded generator (kept in the state), so a saved run goes on exactly as it would
  // have and a bot can be tested against the very rules the page plays.
  var W = 360, H = 640, DT = 1 / 60;
  var PY = H - 72, PR = 10;             // the ship's line and its hit radius
  var PSPEED = 540, KSPEED = 330;       // top speed after a finger, speed on the keys
  var BV = 540, COOL = 0.22, EBR = 4;   // own shot speed, time between shots, enemy shot radius
  var PBMAX = 2;                        // volleys in the air at once: a miss costs time, so aim matters
  var LIVES = 3, MAXL = 5, STAGES = 9, WAVES = 5, DAILY_STAGE = 5;
  var GAP = 2.2, INTRO = 2.6, DEAD = 1.3, INV = 2.2, SHIELD_INV = 1;
  var WLMAX = 3, RFMAX = 3;             // weapon: single, double, triple; rapid fire levels
  var DROPP = 0.08, DROPV = 130;        // a raider's chance to drop a pick-up, and its fall speed
  var KIND = {
    s: { hp: 1, pts: 10, r: 12 },       // scout
    w: { hp: 1, pts: 20, r: 13 },       // winged raider
    b: { hp: 2, pts: 40, r: 14 },       // armoured raider, two hits
    k: { hp: 14, pts: 400, r: 28, boss: true } // the flagship of a stage's last wave; hp, size and points grow by stage
  };
  // Pick-ups: W weapon (+1 barrel), R rapid fire, S shield, L an extra ship, P points
  // (what falls when every upgrade is already full)
  var DROPS = { W: 1, R: 1, S: 1, L: 1, P: 1 };
  // Formations, eight columns wide, top row first. The first seven are light, for
  // the early stages; a wave takes one whose weight is near its difficulty.
  var TEMPLATES = [
    ['..ssss..', '.ssssss.'],
    ['.ss..ss.', 'ssssssss'],
    ['..wwww..', '.ssssss.'],
    ['.w.ww.w.', 'ssssssss'],
    ['.wwwwww.', '.ssssss.'],
    ['..wwww..', 'ssssssss', '..ssss..'],
    ['...bb...', '.wwwwww.', '.ssssss.'],
    ['..wwww..', 'ssssssss', '.ssssss.'],
    ['b..bb..b', 'wwwwwwww', 'ss.ss.ss'],
    ['.wwwwww.', 'w.ssss.w', 'ssssssss'],
    ['..bbbb..', '.wwwwww.', 'ssssssss'],
    ['w.w.w.w.', '.s.s.s.s', 'w.w.w.w.', '.s.s.s.s'],
    ['bb....bb', 'wwwwwwww', 'ssssssss'],
    ['...bb...', '..wwww..', '.ssssss.', 'ssssssss'],
    ['b.b..b.b', 'ww.ww.ww', '.ssssss.'],
    ['.bbbbbb.', 'w......w', 'wwssssww'],
    ['bwwbbwwb', '.s.ss.s.', 'ssssssss']
  ];
  var WEIGHT = TEMPLATES.map(function (T) {
    var n = 0;
    T.forEach(function (row) { for (var c = 0; c < row.length; c++) n += row[c] === 's' ? 1 : row[c] === 'w' ? 1.5 : row[c] === 'b' ? 2.5 : 0; });
    return n;
  });
  var STATES = { wait: 1, enter: 1, form: 1, dive: 1, back: 1 };

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function isInt(x, a, b) { return typeof x === 'number' && Math.floor(x) === x && x >= a && x <= b; }
  function rnd(S) {
    var t = (S.rs = (S.rs + 0x6D2B79F5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  // How hard a wave is: one number from 0 (stage 1, wave 1) to 1 (stage 9, wave 5),
  // so waves get harder inside a stage and every stage starts above the last one's start.
  function diff(stage, wave) { return clamp(((stage - 1) * WAVES + (clamp(wave, 1, WAVES) - 1)) / (STAGES * WAVES - 1), 0, 1); }
  // Everything the difficulty drives. x runs from -0.35 to 1.15: the first wave of the
  // campaign is gentler than the old single run's first, and the ninth stage is harder
  // than its last.
  function knobs(stage, wave) {
    var x = -0.35 + 1.5 * diff(stage, wave);
    return {
      x: x,
      diveGap: 3.2 - 1.7 * x,                       // seconds between dives
      divers: Math.max(1, 1 + Math.floor(x * 2.5)), // raiders diving at once
      fireGap: 1.7 - 0.85 * x,                      // seconds between shots from the formation
      volley: x > 0.85 ? 2 : 1,                     // raiders that fire together
      shotV: 210 + 90 * x,                          // enemy shot speed
      diveV: 190 + 110 * x,                         // dive speed
      diveShots: x < 0.3 ? 1 : x < 1 ? 2 : 3,       // shots a diver fires on the way down
      weight: 10 + 24 * diff(stage, wave)           // formation size, in scout units
    };
  }
  function K(S) { return knobs(S.stage, S.wave); }
  function lv(S) { return diff(S.stage, S.wave); }

  // The flagship of each stage: tougher, bigger and with a wider attack each time
  function bossHp(stage) { return 10 + 4 * stage; }
  function bossR(stage) { return 24 + stage; }
  function bossPts(stage) { return 300 + 100 * stage; }
  function bossFan(stage) { return [1, 1, 3, 3, 5, 5, 5, 7, 7][stage - 1]; }
  function bossGap(stage) { return 2.3 - 0.12 * stage; }
  function bossSweep(stage) { return stage >= 8 ? 10 : stage >= 6 ? 7 : 0; }
  function rad(S, f) { return KIND[f.k].boss ? bossR(S.stage) : KIND[f.k].r; }
  function bossWave(stage) {
    var L = [{ k: 'k', c: 3.5, r: 0.3 }];
    if (stage <= 1) [2, 5].forEach(function (c) { L.push({ k: 's', c: c, r: 1.6 }); });
    else [0, 1, 6, 7].forEach(function (c) { L.push({ k: stage >= 4 && (c === 0 || c === 7) ? 'b' : 'w', c: c, r: 1.6 }); });
    [2, 3, 4, 5].forEach(function (c) { L.push({ k: 's', c: c, r: 2.6 }); });
    if (stage >= 7) [0, 1, 6, 7].forEach(function (c) { L.push({ k: 's', c: c, r: 2.6 }); });
    return L;
  }

  function sway(S) { return 24 * Math.sin(S.t * 0.85); }
  function slot(S, f) { return { x: W / 2 + (f.c - 3.5) * 36 + sway(S), y: 84 + f.r * 34 }; }

  // A kit: the upgrades and ships a stage starts with
  function normKit(k) {
    k = k || {};
    return { wl: clamp(Math.floor(+k.wl) || 1, 1, WLMAX), rf: clamp(Math.floor(+k.rf) || 0, 0, RFMAX), sh: k.sh ? 1 : 0, lives: clamp(Math.floor(+k.lives) || LIVES, LIVES, MAXL) };
  }
  function kitAfter(S) { return normKit({ wl: S.up.wl, rf: S.up.rf, sh: S.up.sh, lives: S.lives }); }

  // o: { stage: 1–9, kit: the upgrades carried in, daily: true for the day's stage,
  // which always plays stage 5's numbers with a fresh ship }
  function newRun(seed, o) {
    o = o || {};
    seed = (seed >>> 0) || 1;
    var daily = !!o.daily, stage = daily ? DAILY_STAGE : clamp(Math.floor(+o.stage) || 1, 1, STAGES);
    var kit = normKit(daily ? null : o.kit);
    return {
      v: 2, seed: seed, rs: seed | 0, stage: stage, daily: daily, kit: kit, up: { wl: kit.wl, rf: kit.rf, sh: kit.sh },
      t: 0, wave: 0, phase: 'gap', timer: INTRO, lives: kit.lives,
      score: 0, kills: 0, shots: 0, hits: 0, picks: 0, clean: 0, streak: 0, top: 0, lost: false, bonus: 0, won: false, over: false,
      p: { x: W / 2, cd: 0, dead: 0, inv: 0 }, pb: [], eb: [], foes: [], drops: [], used: [], vol: 0,
      diveT: 0, fireT: 0, bossT: 0, bossN: 0, burst: 0, burstT: 0, burstA: 0, burstD: 0
    };
  }

  // A formation whose weight is near the wave's difficulty, one of the nearest three
  // not yet flown in this stage, so two runs of a stage differ
  function pick(S) {
    var want = K(S).weight + (rnd(S) - 0.5) * 3, c = [];
    for (var i = 0; i < TEMPLATES.length; i++) if (S.used.indexOf(i) < 0) c.push(i);
    c.sort(function (a, b) { return Math.abs(WEIGHT[a] - want) - Math.abs(WEIGHT[b] - want) || a - b; });
    var n = c[Math.floor(rnd(S) * Math.min(3, c.length))];
    S.used.push(n);
    return n;
  }

  function startWave(S) {
    S.wave++;
    var list = [];
    if (S.wave < WAVES) {
      var T = TEMPLATES[pick(S)];
      for (var r = 0; r < T.length; r++) for (var c = 0; c < 8; c++) if (KIND[T[r][c]]) list.push({ k: T[r][c], c: c, r: r });
    } else list = bossWave(S.stage);
    // rows fly in one after another, each half from its own side of the sky
    S.foes = list.map(function (f, i) {
      var side = f.c < 3.5 ? -1 : 1, s = slot(S, f), hp = KIND[f.k].boss ? bossHp(S.stage) : KIND[f.k].hp;
      return {
        id: S.wave * 100 + i, k: f.k, c: f.c, r: f.r, hp: hp, hpMax: hp, st: 'wait',
        d: 0.2 + Math.floor(f.r) * 0.55 + Math.abs(f.c - 3.5) * 0.07,
        x: clamp(s.x + side * 160, -40, W + 40), y: -30, vx: 0, vy: 0, side: side, dt: 0, sh: 0, shootY: 0, fl: 0
      };
    });
    S.pb = []; S.eb = []; S.lost = false; S.bonus = 0;
    var k = K(S);
    S.diveT = k.diveGap + 1.6; S.fireT = k.fireGap + 1.2; S.bossT = 2; S.bossN = 0; S.burst = 0;
    S.phase = 'play';
  }

  function enemyShot(S, x, y, vx, vy) { S.eb.push({ x: x, y: y, vx: vx, vy: vy }); }
  function aimed(S, f, speed) {
    var dx = S.p.x - f.x, dy = PY - f.y, d = Math.hypot(dx, dy) || 1;
    enemyShot(S, f.x, f.y + 10, dx / d * speed, Math.max(0.5, dy / d) * speed);
  }

  // A downed raider sometimes leaves a pick-up, a flagship always does. What would
  // help is likelier, and a kind that is already full does not fall.
  function drop(S, f, ev) {
    var boss = KIND[f.k].boss;
    if (!boss && rnd(S) >= DROPP) return;
    var u = S.up, w = [];
    if (u.wl < WLMAX) w.push(['W', boss ? 4 : 3]);
    if (u.rf < RFMAX) w.push(['R', 3]);
    if (!u.sh) w.push(['S', 2]);
    if (S.lives < MAXL) w.push(['L', boss ? 2 : 0.7]);
    if (!w.length) w.push(['P', 1]);
    var sum = 0, i;
    for (i = 0; i < w.length; i++) sum += w[i][1];
    var r = rnd(S) * sum, k = w[w.length - 1][0];
    for (i = 0; i < w.length; i++) { r -= w[i][1]; if (r < 0) { k = w[i][0]; break; } }
    S.drops.push({ x: clamp(f.x, 16, W - 16), y: f.y, k: k });
    ev.push({ e: 'drop', k: k, x: f.x, y: f.y });
  }
  function take(S, kind, ev) {
    var u = S.up;
    if (kind === 'W' && u.wl < WLMAX) u.wl++;
    else if (kind === 'R' && u.rf < RFMAX) u.rf++;
    else if (kind === 'S' && !u.sh) u.sh = 1;
    else if (kind === 'L' && S.lives < MAXL) S.lives++;
    else { kind = 'P'; S.score += 250; }
    S.picks++;
    ev.push({ e: 'pick', k: kind, x: S.p.x, y: PY });
  }

  function kill(S, f, ev, shot) {
    var boss = KIND[f.k].boss, pts = boss ? bossPts(S.stage) : KIND[f.k].pts * (f.st === 'dive' ? 2 : 1);
    S.score += pts; S.kills++;
    S.foes.splice(S.foes.indexOf(f), 1);
    ev.push({ e: 'kill', k: f.k, x: f.x, y: f.y, pts: pts });
    if (shot) drop(S, f, ev);
  }

  function die(S, ev) {
    var p = S.p;
    S.lives--; S.lost = true; S.streak = 0;
    S.up.wl = Math.max(1, S.up.wl - 1);
    p.dead = DEAD; p.inv = 0; S.eb = [];
    ev.push({ e: 'die', x: p.x, y: PY });
    if (S.lives <= 0) { S.over = true; S.phase = 'over'; ev.push({ e: 'over' }); }
  }
  // A shield takes the hit in place of the ship
  function hurt(S, ev) {
    if (S.up.sh) { S.up.sh = 0; S.p.inv = SHIELD_INV; ev.push({ e: 'shield', x: S.p.x, y: PY }); return; }
    die(S, ev);
  }

  function volleys(S) {
    var seen = [];
    for (var i = 0; i < S.pb.length; i++) if (seen.indexOf(S.pb[i].g) < 0) seen.push(S.pb[i].g);
    return seen.length;
  }
  function cooldown(S) { return COOL * (1 - 0.15 * S.up.rf); }
  function maxVolleys(S) { return PBMAX + Math.floor((S.up.rf + 1) / 2); }
  function fire(S) {
    var x = S.p.x, y = PY - 18, g = ++S.vol, wl = S.up.wl;
    if (wl === 1) S.pb.push({ x: x, y: y, vx: 0, g: g });
    else if (wl === 2) { S.pb.push({ x: x - 6, y: y, vx: 0, g: g }); S.pb.push({ x: x + 6, y: y, vx: 0, g: g }); }
    else { S.pb.push({ x: x, y: y, vx: 0, g: g }); S.pb.push({ x: x - 8, y: y + 4, vx: -100, g: g }); S.pb.push({ x: x + 8, y: y + 4, vx: 100, g: g }); }
    S.shots += wl;
  }

  // inp: { x: where the ship should go (sky units) or null, dir: -1, 0 or 1 from the
  // keys, fire: true while the player shoots }. Returns what happened, for the
  // page's sounds and sparks.
  function step(S, inp) {
    var ev = [];
    if (S.over) return ev;
    inp = inp || {};
    S.t += DT;
    var p = S.p, i, f, k = K(S);

    if (S.phase === 'gap') {
      S.timer -= DT;
      if (S.timer <= 0) {
        if (S.wave < WAVES) { startWave(S); k = K(S); ev.push({ e: 'wave', n: S.wave }); }
        // the stage ends once the flagship's pick-up is caught or gone
        else if (!S.drops.length || S.timer < -6) {
          var lb = 300 * S.lives;
          S.score += lb; S.won = true; S.over = true; S.phase = 'over';
          ev.push({ e: 'win', n: lb });
          return ev;
        }
      }
    }

    // the ship
    if (p.dead > 0) {
      p.dead -= DT;
      if (p.dead <= 0) { p.dead = 0; p.inv = INV; }
    } else {
      if (p.inv > 0) p.inv = Math.max(0, p.inv - DT);
      var dir = clamp(+inp.dir || 0, -1, 1);
      if (dir) p.x += dir * KSPEED * DT;
      else if (typeof inp.x === 'number' && isFinite(inp.x)) { var dx = inp.x - p.x, m = PSPEED * DT; p.x += clamp(dx, -m, m); }
      p.x = clamp(p.x, 18, W - 18);
      p.cd = Math.max(0, p.cd - DT);
      if (inp.fire && p.cd <= 0 && S.phase === 'play' && volleys(S) < maxVolleys(S)) { fire(S); p.cd = cooldown(S); ev.push({ e: 'shot' }); }
    }

    // pick-ups fall, and the ship catches one by touching it
    for (i = S.drops.length - 1; i >= 0; i--) {
      var d = S.drops[i];
      d.y += DROPV * DT;
      if (p.dead === 0 && Math.abs(d.x - p.x) < 22 && Math.abs(d.y - PY) < 22) { S.drops.splice(i, 1); take(S, d.k, ev); continue; }
      if (d.y > H + 20) S.drops.splice(i, 1);
    }

    // own shots
    for (i = S.pb.length - 1; i >= 0; i--) {
      var b = S.pb[i];
      b.y -= BV * DT; b.x += b.vx * DT;
      if (b.y < -20 || b.x < -10 || b.x > W + 10) { S.pb.splice(i, 1); continue; }
      for (var j = 0; j < S.foes.length; j++) {
        f = S.foes[j];
        if (f.st === 'wait') continue;
        var R = rad(S, f);
        if (Math.abs(b.x - f.x) < R + 2 && Math.abs(b.y - f.y) < (KIND[f.k].boss ? R * 0.55 : R) + 6) {
          S.pb.splice(i, 1); S.hits++;
          f.hp--; f.fl = 0.12;
          if (f.hp <= 0) kill(S, f, ev, true);
          else ev.push({ e: 'hit', k: f.k, x: f.x, y: f.y });
          break;
        }
      }
    }

    // the raiders
    var divers = 0;
    for (i = S.foes.length - 1; i >= 0; i--) {
      f = S.foes[i];
      if (f.fl > 0) f.fl = Math.max(0, f.fl - DT);
      var s = slot(S, f);
      if (f.st === 'wait') {
        f.d -= DT;
        if (f.d <= 0) f.st = 'enter';
        continue;
      }
      if (f.st === 'enter' || f.st === 'back') {
        var ex = s.x - f.x, ey = s.y - f.y, ed = Math.hypot(ex, ey), sp = (f.st === 'enter' ? 300 : 230) * DT;
        if (ed <= sp + 1) { f.x = s.x; f.y = s.y; f.st = 'form'; }
        else {
          // a swirl on the way in, gone near the slot so the raider settles
          var curl = f.st === 'enter' ? clamp((ed - 50) / 200, 0, 0.7) * f.side : 0;
          var ux = ex / ed, uy = ey / ed;
          var mx = ux - uy * curl, my = uy + ux * curl, md = Math.hypot(mx, my) || 1;
          f.x += mx / md * sp; f.y += my / md * sp;
        }
      } else if (f.st === 'form') {
        f.x = s.x; f.y = s.y;
      } else if (f.st === 'dive') {
        divers++;
        f.dt += DT;
        if (f.dt < 0.4) { f.vx = f.side * 110; f.vy = -90; }
        else {
          f.vy = Math.min(k.diveV, f.vy + 620 * DT);
          if (f.y < PY - 60 && p.dead === 0) f.vx = clamp(f.vx + clamp((p.x - f.x) * 4, -420, 420) * DT, -160, 160);
        }
        f.x += f.vx * DT; f.y += f.vy * DT;
        if (f.x < 12 || f.x > W - 12) { f.x = clamp(f.x, 12, W - 12); f.vx = -f.vx; }
        if (f.sh > 0 && f.y > f.shootY && f.vy > 0 && p.dead === 0) { aimed(S, f, k.shotV * 1.1); f.sh--; f.shootY += 110; ev.push({ e: 'eshot' }); }
        // a diver that misses goes out at the bottom and comes back in at the top
        if (f.y > H + 30) { f.y = -30; f.x = s.x; f.st = 'back'; }
      }
      // ramming the ship costs a life (or the shield), and the raider too
      if (p.dead === 0 && p.inv === 0 && S.phase === 'play' && f.st !== 'wait' && Math.hypot(f.x - p.x, f.y - PY) < rad(S, f) + PR - 2) {
        kill(S, f, ev, false);
        hurt(S, ev);
        if (S.over) return ev;
      }
    }

    if (S.phase === 'play' && p.dead === 0) {
      // dives
      S.diveT -= DT;
      if (S.diveT <= 0) {
        var ready = S.foes.filter(function (x) { return x.st === 'form' && !KIND[x.k].boss; });
        if (ready.length && divers < k.divers) {
          f = ready[Math.floor(rnd(S) * ready.length)];

  var params = new URLSearchParams(location.search);
  var dailyDate = params.get('daily');
  // the stage names for the shared text, which is always Persian like the other games'

  function stName(n) {
    // literal keys, so the string check can see every one
    return [C.t('st1'), C.t('st2'), C.t('st3'), C.t('st4'), C.t('st5'), C.t('st6'), C.t('st7'), C.t('st8'), C.t('st9')][n - 1];
  }

  /* ---------------------------------------------------------- campaign */

  // The campaign lives beside the run's save: the highest stage open, the stage to
  // play next, each stage's best score, and the kit each open stage starts with (what
  // the ship carried out of the stage before). Losing a stage replays it with that kit.
  function freshCamp() { return { v: 1, unlocked: 1, cur: 1, best: [0, 0, 0, 0, 0, 0, 0, 0, 0], kits: {}, done: false }; }
  function loadCamp() {
    var o = ctx.store.get('camp', null), c = freshCamp(), i;
    if (!o || typeof o !== 'object' || o.v !== 1) return c;
    var isInt = function (x, a, b) { return typeof x === 'number' && Math.floor(x) === x && x >= a && x <= b; };
    if (!isInt(o.unlocked, 1, E.STAGES)) return c;
    c.unlocked = o.unlocked;
    c.cur = isInt(o.cur, 1, c.unlocked) ? o.cur : c.unlocked;
    if (Array.isArray(o.best)) for (i = 0; i < E.STAGES; i++) c.best[i] = isInt(o.best[i], 0, 1e9) ? o.best[i] : 0;
    if (o.kits && typeof o.kits === 'object') for (i = 2; i <= c.unlocked; i++) if (o.kits[i]) c.kits[i] = E.normKit(o.kits[i]);
    c.done = o.done === true;
    return c;
  }
  function saveCamp() { ctx.store.set('camp', camp); }
  function kitFor(n) { return n > 1 && camp.kits[n] ? E.normKit(camp.kits[n]) : E.normKit(); }
  var camp = loadCamp();

  // S: the run. waiting: held until a tap or a key, after a return from the
  // background or a restored save, so nobody is dropped straight into enemy fire

  var sparks = [], labels = [], hudKey = '';

  var cv = el('canvas', { class: 'sr-canvas', role: 'img', 'aria-label': C.t('field') });
  var box = el('div', { class: 'sr-box' }, [cv]);
  var top = el('div', { class: 'sr-top ch-above' });
  var vScore = el('span', { class: 'sr-pill__value', text: '0' }), vStage = el('span', { class: 'sr-pill__value', text: '1' });
  var vWave = el('span', { class: 'sr-pill__value', text: '0' }), vLives = el('span', { class: 'sr-lives' });
  var stagePill = el('div', { class: 'sr-pill' }, [el('span', { class: 'sr-pill__label', text: C.t('srStage') }), vStage]);
  var hud = el('div', { class: 'sr-hud ch-above' }, [
    el('div', { class: 'sr-pill' }, [el('span', { class: 'sr-pill__label', text: C.t('srScore') }), vScore]),
    stagePill,
    el('div', { class: 'sr-pill' }, [el('span', { class: 'sr-pill__label', text: C.t('srWave') }), vWave]),
    el('div', { class: 'sr-pill sr-pill--ships' }, [el('span', { class: 'sr-pill__label', text: C.t('srLives') }), vLives])
  ]);
  if (dailyDate) stagePill.hidden = true;
  var status = el('div', { class: 'sr-status', role: 'status', 'aria-live': 'polite' });
  var wrap = el('div', { class: 'sr-wrap ch-split' }, [el('div', { class: 'ch-fit' }, [box]), el('div', { class: 'ch-side' }, [top, hud, status])]);

  ctx.button({ icon: 'help', label: C.t('help'), onClick: showHelp });
  ctx.button({ icon: 'refresh', label: C.t('restartStage'), onClick: askNew });
  ctx.main.appendChild(wrap);
  ctx.mount();

  /* ------------------------------------------------------------ setup */

  function newRun(stage) {
    if (dailyDate) S = E.newRun(C.daily('starraid', dailyDate).seed, { daily: true });
    else {
      stage = Math.max(1, Math.min(camp.unlocked, stage || camp.cur));
      if (camp.cur !== stage) { camp.cur = stage; saveCamp(); }
      S = E.newRun(Math.floor(Math.random() * 4294967295), { stage: stage, kit: kitFor(stage) });
    }
    ended = false; waiting = false; acc = 0; last = 0; sparks = []; labels = []; startedAt = Date.now();
    render(); kick();
  }
  function running() { return S && !ended && !S.over && S.wave > 0; }
  // a run under way is never thrown away without asking
  function guarded(title, go) {
    if (!running()) { go(); return; }
    C.ui.confirm({ title: title, body: C.t('resetWarn'), onOk: function () { ctx.clearSave(); go(); } });
  }
  function askNew() { guarded(C.t('restartStage'), function () { newRun(S ? S.stage : camp.cur); }); }
  function startOver() {
    camp = freshCamp(); saveCamp(); ctx.clearSave(); newRun(1);
  }
  function askStartOver(onCancel) {
    C.ui.confirm({ title: C.t('startOver'), body: C.t('startOverWarn'), okLabel: C.t('startOver'), danger: true, onOk: startOver, onCancel: onCancel });
  }

  /* -------------------------------------------------------------- loop */

  function blocked() { return paused || waiting || document.hidden || !!document.querySelector('.ch-scrim'); }
  function tick(now) {
    raf = 0;
    if (!S) return;
    var stop = blocked() || ended;
    if (!last || stop) last = now;
    acc += Math.min(0.1, (now - last) / 1000);
    last = now;
    if (stop) acc = 0;
    var ev = [], inp = input();
    while (acc >= E.DT) {
      acc -= E.DT;
      var e = E.step(S, inp);
      if (e.length) ev = ev.concat(e);
      if (S.over) { acc = 0; break; }
    }
    if (ev.length) events(ev);
    draw();
    // the campaign is written at once, so leaving during the result's delay keeps it
    if (S.over && !ended) { ended = true; ctx.clearSave(); record(); renderHud(); setTimeout(finish, C.ui.reduceMotion() ? 250 : 1200); }
    // nothing moves behind a dialog or while the app is away: stop asking for frames
    if (!document.hidden && !paused && (!ended || sparks.length || labels.length)) raf = requestAnimationFrame(tick);
  }
  function kick() { if (!raf) raf = requestAnimationFrame(tick); }

  var COLORS = { s: '#2FD3A6', w: '#FF5FA2', b: '#FFB23F', k: '#A66BFF' };
  // pick-ups: a colour each, kept apart from the raiders' and the shots'
  var DROP_COL = { W: '#FF9F43', R: '#3FE0FF', S: '#5BE37D', L: '#FF7AC8', P: '#FFD166' };
  function spark(x, y, col, big) { sparks.push({ x: x, y: y, col: col, t0: performance.now(), big: !!big }); }
  function pickLabel(kind) {
    var txt = kind === 'W' ? C.t('pkW') : kind === 'R' ? C.t('pkR') : kind === 'S' ? C.t('pkS') : kind === 'L' ? C.t('pkL') : C.t('pkP', { n: C.num(250) });
    labels.push({ x: S.p.x, y: E.PY - 34, txt: txt, col: DROP_COL[kind], t0: performance.now() });
  }

  function events(ev) {
    var shot = false, save = false;
    for (var i = 0; i < ev.length; i++) {
      var e = ev[i];
      if (e.e === 'shot') shot = true;
      else if (e.e === 'hit') { C.audio.sfx('hit'); spark(e.x, e.y, COLORS[e.k], false); }
      else if (e.e === 'kill') { C.audio.sfx(E.KIND[e.k].boss ? 'boom' : 'pop'); spark(e.x, e.y, COLORS[e.k], true); }
      else if (e.e === 'pick') { C.audio.sfx('unlock'); C.feedback('good'); spark(e.x, e.y, DROP_COL[e.k], true); pickLabel(e.k); save = true; }
      else if (e.e === 'shield') { C.audio.sfx('thud'); spark(e.x, e.y, DROP_COL.S, true); save = true; }
      else if (e.e === 'die') { C.audio.sfx('boom'); C.feedback('bad'); spark(e.x, e.y, '#7FA6FF', true); save = true; }
      else if (e.e === 'clean') C.audio.sfx('coin');
      else if (e.e === 'cleared') { C.feedback('good'); save = true; }
      else if (e.e === 'wave') { C.audio.sfx('select'); save = true; }
    }
    if (shot) C.audio.sfx('shoot');
    renderHud();
    if (save && !S.over) ctx.save();
  }

  /* ------------------------------------------------------------ result */

  function record() {
    if (dailyDate || !S) return;
    var st = S.stage, n = E.score(S);
    if (n > camp.best[st - 1]) camp.best[st - 1] = n;
    if (S.won) {
      if (st < E.STAGES) { camp.unlocked = Math.max(camp.unlocked, st + 1); camp.kits[st + 1] = E.kitAfter(S); camp.cur = st + 1; }
      else camp.done = true;
    }
    saveCamp();
  }

  function finish() {
    var n = E.score(S), won = S.won, note = null, waves = E.cleared(S), st = S.stage, lastStage = st >= E.STAGES;
    var coins = won ? 8 + 2 * st : Math.max(2, Math.round(waves * 1.6)), points = won ? 25 + 8 * st : Math.max(3, waves * 6);
    if (won && !dailyDate && lastStage) C.achievements.unlock('sr-win');
    if (S.top >= 3) C.achievements.unlock('sr-clean');
    var lines = [];
    if (!dailyDate) lines.push({ label: C.t('srStage'), value: C.num(st) + ' · ' + stName(st) });
    lines.push(
      { label: C.t('wavesDone'), value: C.num(waves) + ' / ' + C.num(E.WAVES) },
      { label: C.t('downed'), value: C.num(S.kills) },
      { label: C.t('accuracy'), value: C.num(S.shots ? Math.round(S.hits / S.shots * 100) : 0) + (C.isRtl() ? '٪' : '%') }
    );
    if (dailyDate) {
      if (waves >= 4 || won) C.achievements.unlock('sr-daily');
      coins = won ? 20 : coins; points = won ? 70 : points;
      if (!C.stats.daily('starraid', dailyDate, { label: C.t('scoreN', { n: C.num(n) }), win: won })) { coins = Math.max(1, Math.round(coins * 0.2)); points = Math.max(1, Math.round(points * 0.2)); }
    } else {
      if (C.stats.best('starraid', 'score', n) && n > 0) note = C.t('bestN', { n: C.num(n) });
      lines.push({ label: C.t('stageBest'), value: C.num(camp.best[st - 1] || n) });
    }
    var title = won ? (dailyDate || lastStage ? C.t('victory') : C.t('stageDone', { n: C.num(st) })) : C.t('shotDown');
    var again, againLabel;
    if (dailyDate) { againLabel = C.t('retryStage'); again = function () { newRun(); }; }
    else if (!won) { againLabel = C.t('retryStage'); again = function () { newRun(st); }; }
    else if (!lastStage) { againLabel = C.t('nextStage'); again = function () { newRun(st + 1); }; }
    else { againLabel = C.t('startOver'); again = function () { askStartOver(function () { newRun(st); }); }; }
    var shot = E.clone(S);
    ctx.finish({
      won: won,
      title: title,
      note: note, timeMs: Date.now() - startedAt, coins: coins, points: points,
      lines: [{ label: C.t('srScore'), value: C.num(n) }].concat(lines),
      shareText: 'چوگان · یورش' + (dailyDate ? ('\nروزانه ' + dailyDate) : ('\nمرحله‌ی ' + st + ' · ' + FA_STAGES[st - 1])) + '\nامتیاز ' + n + ' · موج ' + waves + ' از ' + E.WAVES,
      paint: function (g, w, h) {
        var k = Math.min(w / E.W, h / E.H);
        g.save(); g.translate((w - E.W * k) / 2, (h - E.H * k) / 2); g.scale(k, k);
        paint(g, shot, 0);
        g.restore();
      },
      againLabel: againLabel,
      onAgain: again
    });
  }

  /* ------------------------------------------------------------- saves */

  // A run in progress is saved at every wave, pick-up and lost ship, and when the
  // app goes away; it comes back waiting for a tap
  ctx.autosave(function () {
    if (!S || S.over || ended || S.wave === 0) return { inProgress: false };
    return { s: E.snapshot(S), daily: dailyDate || null, elapsed: Date.now() - startedAt };
  });
  function restore(sv) {
    if (!sv || !sv.s || (sv.daily || null) !== (dailyDate || null)) return false;
    var R = E.restore(sv.s);
    // a save from before the stages is refused by the engine; a stage the campaign
    // has not opened (a cleared campaign, an edited save) is refused here
    if (!R || R.daily !== !!dailyDate || (!R.daily && R.stage > camp.unlocked)) return false;
    S = R; startedAt = Date.now() - (+sv.elapsed || 0);
    if (!dailyDate && camp.cur !== S.stage) { camp.cur = S.stage; saveCamp(); }
    ended = false; waiting = true; acc = 0; last = 0; sparks = []; labels = [];
    render(); kick();
    return true;
  }

  /* -------------------------------------------------------------- input */

  // Touch: a finger anywhere steers by how far it slides, so it never has to sit on
  // (and hide) the ship; the ship fires while a finger is down. Mouse: the ship
  // follows the pointer, a held button fires. Keys: arrows or A/D move, Space fires.
  var drag = null, mouseX = null, mouseDown = false, keys = { l: false, r: false, f: false };
  function unit() { var r = cv.getBoundingClientRect(); return E.W / (r.width || 1); }
  function fieldX(e) { var r = cv.getBoundingClientRect(); return (e.clientX - r.left) / (r.width || 1) * E.W; }
  function input() {
    var dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
    return { dir: dir, x: drag ? drag.want : mouseX, fire: !!drag || mouseDown || keys.f };
  }
  function go() { if (waiting) { waiting = false; last = 0; renderStatus(); kick(); } }
  function letGo() { drag = null; mouseDown = false; keys = { l: false, r: false, f: false }; }

  wrap.addEventListener('pointerdown', function (e) {
    if (!S || (e.target.closest && e.target.closest('button, .ch-badge, a'))) return;
    e.preventDefault();
    if (C.audio.unlock) C.audio.unlock();

    })(i);
    var reset = el('button', { class: 'ch-btn ch-btn--danger ch-btn--block sr-reset', type: 'button', text: C.t('startOver') });
    reset.addEventListener('click', function () { m.close(); askStartOver(); });
    m = C.ui.modal({ title: C.t('stagesT'), body: [list, reset], actions: [{ label: C.t('done'), kind: 'primary' }] });
  }

  /* --------------------------------------------------------------- help */

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [kb('← →  /  A D', C.t('kMove')), kb('Space', C.t('kFire')), kb('Space / Enter', C.t('kGo'))])
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  function tArt(kind) {
    var s = '<svg viewBox="0 0 200 110" width="100%" direction="ltr"><rect width="200" height="110" rx="10" fill="#1B2B6E"/>' +
      '<circle cx="20" cy="18" r="1.2" fill="#fff"/><circle cx="170" cy="30" r="1" fill="#fff"/><circle cx="120" cy="12" r="1.4" fill="#fff"/><circle cx="60" cy="70" r="1" fill="#fff"/>';
    var shipAt = function (x, y) { return '<g transform="translate(' + x + ' ' + y + ') scale(.7)"><path d="M0 -12 L17 9 L11 13 L0 7 L-11 13 L-17 9Z" fill="#3D6BFF"/><path d="M0 -20 Q7 -6 6 12 L-6 12 Q-7 -6 0 -20Z" fill="#EEF2FF"/></g>'; };
    var scout = function (x, y) { return '<circle cx="' + x + '" cy="' + y + '" r="6" fill="#2FD3A6"/>'; };
    var wing = function (x, y) { return '<path d="M' + x + ' ' + (y - 3) + ' l-10 -4 l2 9 l8 2 l8 -2 l2 -9z" fill="#FF5FA2"/>'; };
    var disc = function (x, y, k) { return '<circle cx="' + x + '" cy="' + y + '" r="8" fill="' + DROP_COL[k] + '"/><circle cx="' + x + '" cy="' + y + '" r="11" fill="none" stroke="' + DROP_COL[k] + '" stroke-width="1.2" opacity=".6"/>'; };
    if (kind === 1) {
      s += '<ellipse cx="100" cy="24" rx="22" ry="8" fill="#A66BFF"/><path d="M90 20 a10 7 0 0 1 20 0z" fill="#FF5D8F"/>';
      for (var c = 0; c < 4; c++) s += wing(40 + c * 40 - (c > 1 ? -0 : 0), 46);
      s += '<rect x="99" y="62" width="2" height="9" rx="1" fill="#9FF3FF"/>' + shipAt(100, 92);
    }
    if (kind === 2) {
      s += shipAt(100, 92) + '<path d="M70 96 L130 96" stroke="#fff" stroke-width="2" stroke-dasharray="3 4"/>' +
        '<circle cx="140" cy="60" r="11" fill="rgba(255,255,255,.55)"/><path d="M112 60 L128 60 M152 60 L168 60" stroke="#fff" stroke-width="2"/><path d="M112 60 l5 -4 m-5 4 l5 4 M168 60 l-5 -4 m5 4 l-5 4" stroke="#fff" stroke-width="2"/>';
    }
    if (kind === 3) {
      for (var d = 0; d < 5; d++) s += scout(50 + d * 25, 20);
      s += wing(130, 60) + '<path d="M150 20 Q 160 40 132 56" fill="none" stroke="#FF5FA2" stroke-width="1.5" stroke-dasharray="3 3"/>' +
        '<circle cx="120" cy="78" r="3" fill="#FFC46B"/>' + shipAt(80, 92) + '<path d="M96 92 L64 92" stroke="#fff" stroke-width="1.5" stroke-dasharray="3 3"/>';
    }
    if (kind === 4) {
      s += disc(40, 30, 'W') + disc(80, 22, 'R') + disc(120, 34, 'S') + disc(160, 24, 'L') + disc(100, 66, 'W') +
        '<path d="M100 76 L100 82" stroke="#fff" stroke-width="1.5" stroke-dasharray="2 2"/>' + shipAt(100, 94);
    }
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: tArt(1) },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: tArt(2) },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: tArt(3) },
    { title: C.t('tutTitle4'), text: C.t('tutText4'), art: tArt(4) }
  ];

  /* -------------------------------------------------------------- start */

  var saved = ctx.loadSave();
  if (!restore(saved)) { if (saved) ctx.clearSave(); newRun(); }
  if (dailyDate && C.stats.dailyDone('starraid', dailyDate)) {
    var rec = C.stats.dailyOf(dailyDate).starraid;
    C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
  }
  ctx.tutorialIfNew(TUT);
  // the stage names are drawn in the app's font, which may arrive after the first frame
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { draw(); });
})();
</script>
</body>
</html>
