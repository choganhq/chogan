<script>
/* ==== ENGINE START ==== */
function MotoRushEngineFactory() {
  'use strict';

  // The road has four lanes. Positions run along the road in metres, in the frame of
  // the traffic: every car drives at the same speed TV, so in that frame the cars
  // stand still and the bike closes on them at (its speed − TV). p is the bike's front
  // wheel; the bike is BIKE_L long. x is the bike's lane as a fraction, tl the lane it
  // is steering to.
  var LANES = 4, DT = 1 / 60, START_LANE = 1;
  // Each difficulty (#783) sets the road's speed in m/s (v0 at the start, vmax after ramp
  // metres), the length of one level (lap), the reaction margin every gap leaves (react,
  // seconds) and the level from which cars change lanes (lc, 0: never). The ramp ends on
  // a level boundary, so each level up is a step of the speed ramp, not a hidden counter.
  // The daily ride is always medium, so it is the same road for everyone.
  var DIFF = {
    easy: { v0: 22, vmax: 42, ramp: 9600, lap: 1200, react: 0.5, lc: 0 },
    medium: { v0: 26, vmax: 50, ramp: 8000, lap: 1000, react: 0.35, lc: 3 },
    hard: { v0: 30, vmax: 56, ramp: 6400, lap: 800, react: 0.35, lc: 2 }
  };
  var V0 = DIFF.medium.v0, TV = 14, BOOST_V = 12, BOOST_T = 180, BOOST_MULT = 2;
  // the gas pedal (#782): held, the bike rides GAS_V above the road's speed and the
  // distance scores GAS_MULT times; it adds to nitro, so the worst case is both at once
  var GAS_V = 12, GAS_MULT = 1.5;
  // The bike's speed is a state that eases toward its target (road + gas + nitro) instead
  // of jumping there: the owner saw 180 km/h snap to 223 and back when nitro started and
  // ended. ACC m/s² brings a nitro burst to full in about 1 s, DEC lets it fall back in
  // about 1.5 s.
  var ACC = 12, DEC = 8;
  // lanes a second, and a human's reaction time, both used to keep every gap passable
  var LANE_SPEED = 5.5, REACT = 0.35, BIKE_L = 2;
  // a lane changer blinks for BLINK ticks before it moves, then slides one lane in MOVE
  var BLINK = 60, MOVE = 30;
  // a crash when the bike is this close to a car's lane, a near miss when it passed closer
  // than NEAR_X (a car in the next lane, ridden past centred, is 1.0 away and does not count)
  var HIT_X = 0.5, NEAR_X = 0.9, COMBO_T = 240, COMBO_MAX = 8, NEAR_PTS = 25;
  var DAILY_P = 5000, HORIZON = 300, PICK_ADD = 0.34, FIRST = 90;
  var LEN = { car: 4.4, van: 5.6, truck: 9.5 };

  function rand(S) {
    var a = S.r = (S.r + 0x6D2B79F5) >>> 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function cfg(diff) { return DIFF[diff] || DIFF.medium; }
  function base(p, diff) { var c = cfg(diff); return Math.min(c.vmax, c.v0 + (c.vmax - c.v0) * Math.max(0, p) / c.ramp); }
  // where the speed is heading, and the speed the bike really rides at
  function target(S) { return base(S.p, S.diff) + (S.gas ? GAS_V : 0) + (S.boostT > 0 ? BOOST_V : 0); }
  function speed(S) { return S.v; }
  function ease(S) {
    var t = target(S);
    S.v = S.v < t ? Math.min(t, S.v + ACC * DT) : Math.max(t, S.v - DEC * DT);
    S.v = Math.round(S.v * 1e9) / 1e9;
  }
  // The fastest the bike can close on traffic at p: top of the ramp there, gas and nitro.
  // The eased speed never passes the highest target it has had, and the road's speed only
  // grows with p, so this instant worst case also bounds the real, accelerating speed.
  function closing(p, diff) { return base(p, diff) + GAS_V + BOOST_V - TV; }
  function topSpeed(diff) { return cfg(diff).vmax + GAS_V + BOOST_V; }
  function levelAt(p, diff) { return 1 + Math.floor(Math.max(0, p) / cfg(diff).lap); }
  function goal(S) { return S.daily ? DAILY_P : Infinity; }
  // how far behind a wave the next one must start so that a rider who waits for the
  // first to pass can still reach the next free lane in time, even with gas and nitro
  function need(from, to, y, diff) {
    return BIKE_L + (Math.abs(from - to) / LANE_SPEED + cfg(diff).react) * closing(y + 200, diff) + 2;
  }
  // How far ahead of the bike a lane changer starts to blink. Blinking and sliding take a
  // fixed time; after that, a rider at the fastest closing speed still has its reaction
  // time and one lane change to step into the lane the car just left, which is always
  // free. A slower rider only gets more room.
  function warnAt(y, diff) {
    return ((BLINK + MOVE) * DT + 1 / LANE_SPEED + cfg(diff).react) * closing(y, diff) + BIKE_L + 2;
  }

  function fromSeed(seed, daily, diff) {
    diff = daily || !DIFF[diff] ? 'medium' : diff;
    var S = {
      r: seed >>> 0, daily: !!daily, diff: diff, p: 0, d: 0, x: START_LANE, tl: START_LANE,
      bar: 0, boostT: 0, gas: false, combo: 0, comboT: 0, bestCombo: 0, nears: 0, picks: 0,
      score: 0, tick: 0, v: DIFF[diff].v0, top: DIFF[diff].v0, lvl: 1, over: false, won: false, hit: null,
      waves: [], items: [], ny: FIRST, nf: 0, ev: []
    };
    S.nf = Math.floor(rand(S) * LANES);
    ensure(S);
    return S;
  }
  function newGame(rnd, daily, diff) { return fromSeed(Math.floor(rnd() * 4294967296), daily, diff); }

  // One wave: one to three cars side by side (staggered a little), always leaving the
  // lane f free. The next wave's free lane is drawn now, so the gap after this wave
  // can be made long enough to get there.
  function spawn(S) {
    var c0 = cfg(S.diff), y = S.ny, f = S.nf, t = Math.min(1, y / (1.5 * c0.ramp)), i;
    S.nf = Math.floor(rand(S) * LANES);
    var u = rand(S), k = u < 0.6 - 0.4 * t ? 1 : u > 1 - (0.05 + 0.3 * t) ? 3 : 2;
    var other = [];
    for (i = 0; i < LANES; i++) if (i !== f) other.push(i);
    for (i = other.length - 1; i > 0; i--) { var j = Math.floor(rand(S) * (i + 1)), s = other[i]; other[i] = other[j]; other[j] = s; }
    var cars = [], span = 0;
    for (i = 0; i < k; i++) {
      var q = rand(S), kind = q < 0.15 + 0.15 * t ? 'truck' : q < 0.4 + 0.1 * t ? 'van' : 'car';
      var c = { lane: other[i], x: other[i], o: Math.round(rand(S) * 60) / 10, len: LEN[kind], kind: kind, paint: Math.floor(rand(S) * 5), md: 9, done: false };
      cars.push(c);
      span = Math.max(span, c.o + c.len);
    }
    // From its difficulty's level on, a wave may hold one car that will change lanes
    // (#783). It moves one lane, so it only ever covers its own lane and the next one;
    // the next one is never the free lane f and never a lane another car of the wave
    // holds, so f stays free and the lane it leaves becomes a second free lane.
    var lv = levelAt(y, S.diff);
    if (c0.lc && lv >= c0.lc && rand(S) < Math.min(0.5, 0.15 + 0.07 * (lv - c0.lc))) {
      var taken = cars.map(function (q) { return q.lane; }), opts = [];
      for (i = 0; i < cars.length; i++) {
        [-1, 1].forEach(function (dl) {
          var to = cars[i].lane + dl;
          if (to >= 0 && to < LANES && to !== f && taken.indexOf(to) < 0) opts.push([i, to]);
        });
      }
      if (opts.length) {
        var pick = opts[Math.floor(rand(S) * opts.length)], lc = cars[pick[0]];
        lc.to = pick[1]; lc.ph = 0; lc.k = 0; lc.at = Math.round(warnAt(y + lc.o, S.diff) * 10) / 10;
      }
    }
    S.waves.push({ y: y, span: span, f: f, cars: cars });
    if (rand(S) < 0.3) S.items.push({ lane: f, y: y + span / 2, got: false });
    var gs = 3.2 - 1.6 * t;
    var gap = Math.max(need(f, S.nf, y + span, S.diff), gs * (base(y + span, S.diff) - TV) * (0.85 + 0.4 * rand(S)));
    // rounded up: rounding down could take a few centimetres off the margin need() asks for
    S.ny = Math.ceil((y + span + gap) * 10) / 10;
  }
  function ensure(S) {
    var g = goal(S);
    while (S.ny < S.p + HORIZON && S.ny < g - 40) spawn(S);
    while (S.waves.length && S.waves[0].y + S.waves[0].span < S.p - 40) S.waves.shift();
    while (S.items.length && S.items[0].y < S.p - 40) S.items.shift();
  }

  function steer(S, dir) {
    if (S.over) return false;
    var nt = Math.max(0, Math.min(LANES - 1, S.tl + (dir > 0 ? 1 : -1)));
    if (nt === S.tl) return false;
    S.tl = nt;
    return true;
  }
  function gas(S, on) { if (!S.over) S.gas = !!on; }

  // lane changers ahead: blink once the bike is within the car's warning distance, then slide
  function changers(S) {
    for (var i = 0; i < S.waves.length; i++) {
      var w = S.waves[i];
      for (var j = 0; j < w.cars.length; j++) {
        var c = w.cars[j];
        if (c.to === undefined || c.ph >= 3) continue;
        if (c.ph === 0) {
          if (w.y + c.o - S.p <= c.at) { c.ph = 1; c.k = 0; S.ev.push({ t: 'blink', lane: c.lane, to: c.to }); }
        } else if (c.ph === 1) {
          if (++c.k >= BLINK) { c.ph = 2; c.k = 0; }
        } else if (++c.k >= MOVE) { c.ph = 3; c.x = c.to; }
        else c.x = Math.round((c.lane + (c.to - c.lane) * c.k / MOVE) * 1e6) / 1e6;
      }
    }
  }

  function step(S) {
    if (S.over) return;
    S.tick++;
    changers(S);
    var v = speed(S), rel = v - TV;
    S.top = Math.max(S.top, v);
    // steering: the bike slides toward its lane
    if (S.x < S.tl) S.x = Math.min(S.tl, S.x + LANE_SPEED * DT);
    else if (S.x > S.tl) S.x = Math.max(S.tl, S.x - LANE_SPEED * DT);
    S.x = Math.round(S.x * 1e6) / 1e6;
    S.p += rel * DT;
    S.d += v * DT;
    var mult = 1 + 0.25 * Math.min(S.combo, COMBO_MAX);
    S.score += v * DT * 0.1 * mult * (S.boostT > 0 ? BOOST_MULT : 1) * (S.gas ? GAS_MULT : 1);
    if (S.boostT > 0) S.boostT--;
    var lv = levelAt(S.p, S.diff);
    if (lv > S.lvl) { S.lvl = lv; S.ev.push({ t: 'level', n: lv }); }
    if (S.comboT > 0 && --S.comboT === 0) S.combo = 0;
    var rear = S.p - BIKE_L, i, j;
    for (i = 0; i < S.waves.length; i++) {
      var w = S.waves[i];
      if (w.y > S.p) break;
      for (j = 0; j < w.cars.length; j++) {
        var c = w.cars[j];
        if (c.done) continue;
        var y0 = w.y + c.o, y1 = y0 + c.len;
        if (S.p > y0 && rear < y1) {
          var cx = c.x === undefined ? c.lane : c.x, dx = Math.abs(S.x - cx);
          if (dx < HIT_X) {
            S.over = true; S.hit = { lane: cx, kind: c.kind };
            S.ev.push({ t: 'crash', lane: cx });
            return;
          }
          if (dx < c.md) c.md = dx;
        } else if (rear >= y1) {
          c.done = true;
          if (c.md < NEAR_X) {
            S.combo++; S.comboT = COMBO_T; S.nears++;
            S.bestCombo = Math.max(S.bestCombo, S.combo);
            var bonus = NEAR_PTS * (1 + 0.25 * Math.min(S.combo, COMBO_MAX));
            S.score += bonus;
            S.ev.push({ t: 'near', combo: S.combo, pts: bonus, lane: c.x === undefined ? c.lane : c.x });
          }
        }
      }
    }
    for (i = 0; i < S.items.length; i++) {
      var it = S.items[i];
      if (it.got || it.y > S.p) continue;
      if (it.y >= rear && Math.abs(S.x - it.lane) < 0.6) {
        it.got = true; S.picks++;
        // n: how many of the three cans the bar now holds, so the page can say it (#781)
        var pe = { t: 'pick', n: 0, lane: it.lane }; S.ev.push(pe);
        if (S.boostT <= 0) {
          S.bar = Math.round((S.bar + PICK_ADD) * 100) / 100;
          pe.n = Math.min(3, Math.round(S.bar / PICK_ADD));
          if (S.bar >= 1) { S.bar = 0; S.boostT = BOOST_T; S.ev.push({ t: 'boost' }); }
        }
      }
    }
    // this tick rode at S.v; the next one rides a step closer to the target
    ease(S);
    if (S.p >= goal(S)) { S.over = true; S.won = true; S.ev.push({ t: 'finish' }); return; }
    ensure(S);
  }

  function drain(S) { var e = S.ev; S.ev = []; return e; }
  function snapshot(S) {
    var o = JSON.parse(JSON.stringify(S));
    delete o.ev;
    return o;
  }
  function num(v) { return typeof v === 'number' && isFinite(v); }
  function restore(o) {
    if (!o || typeof o !== 'object') return null;
    var keys = ['r', 'p', 'd', 'x', 'tl', 'bar', 'boostT', 'combo', 'comboT', 'score', 'tick', 'ny', 'nf'];
    for (var i = 0; i < keys.length; i++) if (!num(o[keys[i]])) return null;
    if (!Array.isArray(o.waves) || !Array.isArray(o.items)) return null;
    if (o.tl < 0 || o.tl >= LANES || o.tl !== Math.floor(o.tl) || o.x < 0 || o.x > LANES - 1 || o.nf < 0 || o.nf >= LANES) return null;
    for (i = 0; i < o.waves.length; i++) {
      var w = o.waves[i];
      if (!w || !num(w.y) || !num(w.span) || !Array.isArray(w.cars)) return null;
      for (var j = 0; j < w.cars.length; j++) {
        var c = w.cars[j];
        if (!c || !num(c.o) || !num(c.len) || !num(c.lane) || !LEN[c.kind]) return null;
        if (c.x !== undefined && (!num(c.x) || c.x < 0 || c.x > LANES - 1)) return null;
        // a lane changer moves exactly one lane, so a save can't teleport one
        if (c.to !== undefined && (!num(c.to) || Math.abs(c.to - c.lane) !== 1 || c.to < 0 || c.to >= LANES || !num(c.ph) || !num(c.k) || !num(c.at))) return null;
      }
    }
    var S = JSON.parse(JSON.stringify(o));
    S.ev = [];
    S.daily = !!S.daily; S.over = !!S.over; S.won = !!S.won;
    // saves from before #782/#783 ride on medium with the gas released
    if (!DIFF[S.diff] || S.daily) S.diff = 'medium';
    S.gas = false;
    S.waves.forEach(function (w) { w.cars.forEach(function (q) { if (q.x === undefined) q.x = q.lane; }); });
    ['bestCombo', 'nears', 'picks'].forEach(function (k) { if (!num(S[k])) S[k] = 0; });
    if (!num(S.top)) S.top = V0;
    // a save from before the eased speed resumes at the speed it was riding
    if (!num(S.v) || S.v <= 0) S.v = target(S);
    if (!num(S.lvl)) S.lvl = levelAt(S.p, S.diff);
    return S;
  }
  function clone(S) { var c = restore(snapshot(S)); c.ev = S.ev.slice(); c.gas = S.gas; return c; }

  return {
    LANES: LANES, DT: DT, START_LANE: START_LANE, BIKE_L: BIKE_L, DAILY_P: DAILY_P, HIT_X: HIT_X, NEAR_X: NEAR_X,
    LANE_SPEED: LANE_SPEED, REACT: REACT, TV: TV, BOOST_V: BOOST_V, BOOST_T: BOOST_T, COMBO_T: COMBO_T, COMBO_MAX: COMBO_MAX,
    PICK_ADD: PICK_ADD, LEN: LEN, DIFF: DIFF, GAS_V: GAS_V, GAS_MULT: GAS_MULT, BLINK: BLINK, MOVE: MOVE,
    ACC: ACC, DEC: DEC, target: target,
    base: base, speed: speed, need: need, warnAt: warnAt, closing: closing, topSpeed: topSpeed, levelAt: levelAt,
    newGame: newGame, fromSeed: fromSeed, step: step, steer: steer, gas: gas,
    drain: drain, snapshot: snapshot, restore: restore, clone: clone, ensure: ensure
  };
}
if (typeof module !== 'undefined') module.exports = MotoRushEngineFactory;
/* ==== ENGINE END ==== */
</script>
<script>
(function () {
  'use strict';
  var C = window.Chogan, el = C.el;
  var E = MotoRushEngineFactory();
  var ACCENT = '#3945C6';
  // the logical view, scaled to the screen: the sky and the HUD above HZ, the road below
  var VW = 360, VH = 540, HZ = 162;
  // the camera: a point at depth a ahead of the bike's rear wheel (plus D0) is drawn
  // F/a pixels a metre wide and K/a pixels below the horizon
  var D0 = 10.8, K = 3660, F = 253, LW = 3.2, BIKE_PX = 37;

  C.boot({});
  var ctx = C.game({
    id: 'motorush',
    name: { fa: 'موتورسوار', en: 'Moto Rush', zh: '摩托狂飙', de: 'Motorrad-Rausch', es: 'Moto veloz', pl: 'Motopęd' },

        gasL: 'گاز', kGas: 'گاز', lvlN: 'مرحله‌ی {n}', lvlUp: 'مرحله‌ی {n}!', lvlL: 'مرحله', dailyMed: 'موتورسوار روزانه همیشه روی سختی متوسط است و برای همه یکسان.',
        pausedTxt: 'مکث', ptsN: 'امتیاز: {n}', bestN: 'بهترین: {n}', kmh: 'کیلومتر/ساعت', kmN: '{n} کیلومتر', crash: 'تصادف!', finishLine: 'به خط پایان رسیدی!',
        dailyMr: 'موتورسوار روزانه', newRun: 'دور تازه', distL: 'مسافت', ptsL: 'امتیاز', topL: 'بیشترین سرعت', tries: 'تلاش‌ها', comboL: 'بهترین زنجیره',
        kSteer: 'بانده‌ی چپ و راست', kPause: 'مکث', kAgain: 'دور تازه', kStart: 'شروع', nitroGo: 'نیترو!', nitroN: 'نیترو {n} از {m}', nearPop: 'خطر از بیخ گوش!',
        rules: 'با موتور در جاده‌ی چهاربانده جلو برو و به ماشین‌ها و کامیون‌ها نخور. انگشت را به چپ یا راست بکش، یا سمت چپ و راست صفحه را لمس کن، تا یک بانده جابه‌جا شوی. در هر ردیف ماشین همیشه دست‌کم یک بانده‌ی باز هست. از کنار ماشین‌ها از نزدیک رد شو تا زنجیره بسازی؛ هر رد شدن نزدیک امتیاز دارد و زنجیره امتیاز همه چیز را بیشتر می‌کند. اگر چند ثانیه رد شدن نزدیکی نباشد زنجیره صفر می‌شود. قوطی‌های زرد نوار نیترو را پر می‌کنند؛ وقتی پر شد چند ثانیه تندتر می‌روی و امتیاز دوبرابر است. پدال گاز پایین صفحه، یا کلید بالا یا W، را نگه دار تا تندتر بروی و امتیاز مسافت یک‌ونیم برابر شود. هر چند کیلومتر به مرحله‌ی بعد می‌رسی و جاده تندتر می‌شود؛ در مرحله‌های بالاتر بعضی ماشین‌ها بانده عوض می‌کنند، ولی همیشه اول راهنما می‌زنند. سختی را از چرخ‌دنده انتخاب کن. در موتورسوار روزانه، که برای همه یکسان و همیشه روی سختی متوسط است، باید به خط پایان برسی.',
        tutTitle1: 'بانده عوض کن', tutText1: 'انگشت را بکش یا سمت چپ و راست را لمس کن. همیشه یک بانده باز است.',
        tutTitle2: 'از نزدیک رد شو', tutText2: 'از کنار ماشین‌ها از فاصله‌ی کم رد شو تا زنجیره بسازی و امتیاز بیشتری بگیری.',
        tutTitle3: 'نیترو', tutText3: 'قوطی‌های زرد را بردار. نوار که پر شد، نیترو سرعت و امتیازت را بالا می‌برد.'
      },

  var params = new URLSearchParams(location.search);
  var dailyDate = params.get('daily');

  var S = null, raf = 0, last = 0, acc = 0, paused = false, held = false, waiting = true, ended = false, tries = 0, startedAt = 0, seed = 0;
  // drawing state: floating words, the crash moment, a flash on each pick-up
  var pops = [], crashAt = 0, flash = 0, runAwarded = false;

  var cv = el('canvas', { class: 'mr-canvas', role: 'img', 'aria-label': C.t('scene') });
  var box = el('div', { class: 'mr-box' }, [cv]);
  var top = el('div', { class: 'mr-top ch-above' });
  var status = el('div', { class: 'mr-status', role: 'status', 'aria-live': 'polite' });
  var pauseBtn = el('button', { class: 'ch-iconbtn', type: 'button', 'aria-label': C.t('pause') }, [C.icon('pause', 22)]);
  var wrap = el('div', { class: 'mr-wrap ch-split' }, [el('div', { class: 'ch-fit' }, [box]), el('div', { class: 'ch-side' }, [top, status])]);

  // the difficulty is chosen behind a gear, never inside the help (#783), and kept
  var DIFFS = ['easy', 'medium', 'hard'];
  var prefs = ctx.store.get('prefs', null);
  if (!prefs || typeof prefs !== 'object') prefs = { diff: 'medium' };
  if (DIFFS.indexOf(prefs.diff) < 0) prefs.diff = 'medium';
  // the gas: held by a finger on the pedal or by Up / W (#782)
  var gasPtr = null, keyGas = false;

  ctx.button({ icon: 'help', label: C.t('help'), onClick: showHelp });
  ctx.button({ icon: 'gear', label: C.t('settings'), onClick: function () { settings(); } });
  ctx.button({ icon: 'refresh', label: C.t('newRun'), onClick: function () { newRun(); } });
  ctx.main.appendChild(wrap);
  ctx.mount();

  /* ------------------------------------------------------------- runs */

  function seeded(sd) {
    var a = sd >>> 0;
    return function () { a = (a + 0x6D2B79F5) >>> 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  // the daily road comes from the day, the same for everyone
  function rngFor(sd) { return dailyDate ? C.daily('motorush', dailyDate).rng : seeded(sd); }

  function newRun(diff) {
    if (diff) { prefs.diff = diff; ctx.store.set('prefs', prefs); }
    seed = Math.floor(Math.random() * 4294967296);
    // the engine rides the daily on medium whatever is passed here
    S = E.newGame(rngFor(seed), !!dailyDate, prefs.diff);
    tries++;
    startedAt = Date.now();
    ended = false; waiting = true; held = false; last = 0; acc = 0;
    pops = []; crashAt = 0; flash = 0; runAwarded = false;
    gasPtr = null; keyGas = false;
    ctx.clearSave();
    renderTop(); renderStatus();
    kick();
  }
  // each difficulty keeps its own best; medium keeps the key it had before #783
  function diffTag() { return S && S.diff !== 'medium' ? '-' + S.diff : ''; }
  function settings() {
    hold();
    var pick = prefs.diff, body = el('div', { class: 'ch-col', style: { gap: 'var(--s-3)', 'align-items': 'center' } });
    body.appendChild(el('div', { class: 'mr-label', text: C.t('difficulty') }));
    if (dailyDate) {
      // the daily ride is the same road for everyone, so it has no choice to make
      body.appendChild(el('p', { class: 'ch-dim', text: C.t('dailyMed') }));
      C.ui.modal({ title: C.t('settings'), closeButton: true, body: [body], actions: [{ label: C.t('done'), kind: 'primary' }] });
      return;
    }
    body.appendChild(C.ui.segmented(DIFFS.map(function (d) { return { value: d, label: C.t(d) }; }), pick, function (v) { pick = v; }));
    if (S && !ended && S.tick > 0) body.appendChild(el('p', { class: 'ch-xs ch-dim', text: C.t('resetWarn') }));
    C.ui.modal({
      title: C.t('settings'), closeButton: true, body: [body],
      actions: [{ label: C.t('cancel') }, { label: C.t('start'), kind: 'primary', onClick: function () { newRun(pick); } }]
    });
  }

  function blocked() { return paused || held || waiting || document.hidden || !!document.querySelector('.ch-scrim'); }
  function tick(now) {
    raf = 0;
    if (!S) return;
    var dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
    last = now;
    if (!blocked() && !ended) {
      // a fixed step, so a run plays the same on every screen
      acc += dt;
      var n = 0;
      while (acc >= E.DT && n < 8) {
        E.step(S); acc -= E.DT; n++;
        events();
        if (ended) break;
      }
      if (n >= 8) acc = 0;
    }
    for (var i = pops.length - 1; i >= 0; i--) { pops[i].t -= dt; if (pops[i].t <= 0) pops.splice(i, 1); }
    if (flash > 0) flash = Math.max(0, flash - dt * 3);
    draw();
    // a still screen needs no frames: waiting, paused, or the crash has played out;
    // go() and kick() start the loop again
    if (!paused && !held && !waiting && !(ended && Date.now() - crashAt > 1500)) raf = requestAnimationFrame(tick);
  }
  function kick() { if (!raf) { last = 0; raf = requestAnimationFrame(tick); } }

  function steer(dir) {
    if (!S || ended || S.over) return;
    if (waiting || held) { go(); return; }
    if (E.steer(S, dir)) C.audio.sfx('tap');
  }

  function events() {
    var ev = E.drain(S);
    for (var i = 0; i < ev.length; i++) {
      var e = ev[i];
      if (e.t === 'near') {
        C.audio.sfx('whoosh');
        pops.push({ text: e.combo > 1 ? '×' + C.num(e.combo) : C.t('nearPop'), lane: e.lane, t: 0.9, max: 0.9 });
        if (e.combo >= E.COMBO_MAX) C.achievements.unlock('mo-close');
      } else if (e.t === 'pick') {
        C.audio.sfx('coin'); flash = 1;
        if (e.n > 0 && e.n < 3) pops.push({ text: C.t('nitroN', { n: C.num(e.n), m: C.num(3) }), lane: e.lane, t: 1.1, max: 1.1 });
      } else if (e.t === 'boost') {
        C.audio.sfx('nitro'); C.haptic('success');
        pops.push({ text: C.t('nitroGo'), t: 1.3, max: 1.3, big: true });
      } else if (e.t === 'level') {
        // a short pop when the level changes (#783), above the nitro word so both can show
        C.audio.sfx('good');
        pops.push({ text: C.t('lvlUp', { n: C.num(e.n) }), t: 1.6, max: 1.6, big: true, y: 205, lvl: true });
      } else if (e.t === 'crash') {
        C.audio.sfx('boom'); C.haptic('error');
        crashAt = Date.now(); ended = true;
        ctx.clearSave();
        setTimeout(finish, C.ui.reduceMotion() ? 400 : 1400);
      } else if (e.t === 'finish') {
        C.audio.sfx('win'); C.haptic('success');
        crashAt = Date.now(); ended = true;
        ctx.clearSave();
        setTimeout(finish, C.ui.reduceMotion() ? 300 : 1000);
      }
    }
    if (!runAwarded && S.d >= 10000) { runAwarded = true; C.achievements.unlock('mo-run'); }
    // the HUD is on the canvas; only the badges need the DOM, so they change rarely
    if (S.tick % 60 === 0) renderTop();
  }

  function finish() {
    var sc = Math.floor(S.score), km = S.d / 1000, won = S.won, note = null;
    var coins = won ? 30 : Math.min(30, 1 + Math.floor(S.d / 400)), points = won ? 120 : Math.min(120, 4 + Math.floor(S.d / 100));
    var lines = [
      { label: C.t('ptsL'), value: C.num(sc) },
      { label: C.t('distL'), value: C.t('kmN', { n: C.num(km.toFixed(1)) }) },
      { label: C.t('topL'), value: C.num(Math.round(S.top * 3.6)) + ' ' + C.t('kmh') },
      { label: C.t('lvlL'), value: C.num(S.lvl) + (dailyDate ? '' : ' · ' + C.t(S.diff)) }
    ];
    if (S.bestCombo > 1) lines.push({ label: C.t('comboL'), value: '×' + C.num(S.bestCombo) });
    if (dailyDate) {
      if (won) C.achievements.unlock('mo-daily');
      if (!C.stats.daily('motorush', dailyDate, { label: C.t('ptsN', { n: C.num(sc) }), win: won, tries: tries })) { coins = Math.max(1, Math.round(coins * 0.2)); points = Math.max(1, Math.round(points * 0.2)); }
      lines.push({ label: C.t('tries'), value: C.num(tries) });
    } else {
      // an endless ride always ends in a crash; a new best is what counts as a win
      if (C.stats.best('motorush', 'score' + diffTag(), sc) && sc > 0) { note = C.t('bestN', { n: C.num(sc) }); won = true; }
      // a new best distance pays +5 coins for every full 1000 m it newly reaches (#812)
      var prevDist = C.stats.getBest('motorush', 'dist' + diffTag()) || 0, metres = Math.floor(S.d);
      C.stats.best('motorush', 'dist' + diffTag(), metres);
      coins += C.stats.milestoneCoins(prevDist, metres, 1000);
      lines.push({ label: C.t('best'), value: C.num(C.stats.getBest('motorush', 'score' + diffTag()) || sc) });
    }
    ctx.finish({
      won: won,
      title: S.won ? C.t('finishLine') : C.t('crash'),
      note: note, timeMs: Date.now() - startedAt, coins: coins, points: points,
      lines: lines,
      shareText: 'چوگان · موتورسوار' + (dailyDate ? ('\nروزانه ' + dailyDate) : '') + '\nامتیاز ' + sc + ' · ' + km.toFixed(1) + ' km',
      paint: function (g, w, h) { paintShare(g, w, h); },
      againLabel: C.t('newRun'),
      onAgain: function () { newRun(); }
    });
    renderTop();
  }

  /* --------------------------------------------------------------- draw */

  function dark() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t === 'dark') return true;
    if (t === 'light') return false;
    return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function palette(dk) {
    return dk ? {
      sky0: '#0B1230', sky1: '#28345E', hill: '#18213C', hill2: '#1F2B48', star: 'rgba(255,255,240,.8)', moon: '#F3E9C8',
      grass: '#1E3326', grass2: '#26402F', road: '#2A2932', edge: '#8C8798', dash: 'rgba(255,255,255,.55)', post: '#C9C2D4', reflector: '#FF6A4D',
      tail: '#FF3B3B', glass: 'rgba(150,190,240,.45)', tyre: '#0A0A0E', shadow: 'rgba(0,0,0,.45)', light: 'rgba(255,240,190,.10)',
      text: '#F4EEE4', textDim: 'rgba(244,238,228,.7)', panel: 'rgba(10,14,32,.55)', bar: 'rgba(255,255,255,.16)', can: '#F6B93B',
      // no blue car: the rider wears the indigo accent and must not read as traffic
      cars: ['#C9493F', '#D9952E', '#9AA0AC', '#3B9466', '#C86A98'], box: '#B8B4C2'
    } : {
      sky0: '#7EC3EC', sky1: '#DCEFF8', hill: '#8DB97A', hill2: '#A6CB8E', star: null, moon: null,

    g.font = '800 20px ' + font; g.fillText(C.num(Math.round(v * 3.6)), cx, cy + 4);
    g.fillStyle = P.textDim; g.font = '700 10px ' + font; g.fillText(C.t('kmh'), cx, cy + 18);
    // the level, under the speedometer (#783): the owner saw the speed rise but not why
    var lt = C.t('lvlN', { n: C.num(S.lvl) });
    g.font = '800 13px ' + font;
    var lw = Math.max(70, g.measureText(lt).width + 22);
    g.fillStyle = ACCENT; rr(g, VW - 8 - lw, 78, lw, 24, 12); g.fill();
    g.fillStyle = '#FFFFFF'; g.fillText(lt, VW - 8 - lw / 2, 95);
    // the combo, top middle
    if (S.combo > 0) {
      var cf = S.comboT / E.COMBO_T;
      g.globalAlpha = 0.35 + 0.65 * cf;
      g.fillStyle = ACCENT; rr(g, VW / 2 - 30, 12, 60, 28, 14); g.fill();
      g.fillStyle = '#FFFFFF'; g.font = '800 17px ' + font; g.fillText('×' + C.num(1 + 0.25 * Math.min(S.combo, E.COMBO_MAX)), VW / 2, 32);
      g.globalAlpha = 1;
    }
    // the daily ride's progress along the bottom of the sky
    if (S.daily) {
      var pr = Math.max(0, Math.min(1, S.p / E.DAILY_P));
      g.fillStyle = P.bar; rr(g, 8, HZ - 30, VW - 16, 6, 3); g.fill();
      g.fillStyle = ACCENT; rr(g, 8, HZ - 30, Math.max(6, (VW - 16) * pr), 6, 3); g.fill();
    }
  }

  function draw() {
    if (!S) return;
    var Z = size(), dpr = Math.min(2, window.devicePixelRatio || 1);
    // both sides: a new canvas is 300×150 (#359)
    if (cv.width !== Math.round(Z.w * dpr) || cv.height !== Math.round(Z.h * dpr)) { cv.width = Math.round(Z.w * dpr); cv.height = Math.round(Z.h * dpr); }
    cv.style.width = Z.w + 'px'; cv.style.height = Z.h + 'px';
    var g = cv.getContext('2d'), k = Z.w / VW, dk = dark(), P = palette(dk), t = S.tick * E.DT;
    var font = getComputedStyle(document.body).fontFamily || 'sans-serif';
    g.setTransform(dpr * k, 0, 0, dpr * k, 0, 0);
    g.clearRect(0, 0, VW, VH);
    g.save(); rr(g, 0, 0, VW, VH, 0); g.clip();
    scene(g, P, t, dk);
    hud(g, P, font);
    // floating words over the bike, in the page's direction: the canvas is left to right,
    // which put the "!" of «مرحله‌ی ۴!» and «خطر از بیخ گوش!» before the words in Persian
    g.direction = document.documentElement.dir === 'rtl' ? 'rtl' : 'ltr';
    for (var i = 0; i < pops.length; i++) {
      var p = pops[i], f = p.t / p.max, x = p.lane === undefined ? VW / 2 : P3(laneX(p.lane), 0, 0).x;
      g.globalAlpha = Math.min(1, f * 2.5);
      g.font = '800 ' + (p.big ? 30 : 20) + 'px ' + font; g.textAlign = 'center'; g.textBaseline = 'middle';
      var y = (p.y || (p.big ? 250 : 400)) - (1 - f) * (p.big ? 20 : 40);
      g.lineWidth = 5; g.strokeStyle = dk ? 'rgba(0,0,0,.6)' : 'rgba(255,255,255,.85)'; g.strokeText(p.text, x, y);
      g.fillStyle = p.lvl ? (dk ? '#FFFFFF' : ACCENT) : p.big ? '#FFB13B' : (dk ? '#FFFFFF' : ACCENT); g.fillText(p.text, x, y);
      g.globalAlpha = 1;
    }
    g.direction = 'ltr';
    if (!ended) pedal(g, P, font);
    if ((waiting || held) && !ended) {
      var msg = held ? C.t('pausedTxt') : C.t('tapStart');
      g.font = '800 19px ' + font; g.textAlign = 'center'; g.textBaseline = 'middle';
      var tw = g.measureText(msg).width + 40;
      g.fillStyle = 'rgba(0,0,0,.55)'; rr(g, VW / 2 - tw / 2, 262, tw, 44, 22); g.fill();
      g.fillStyle = '#FFFFFF'; g.fillText(msg, VW / 2, 285);
    }
    g.restore();
  }

  // The gas pedal (#782), in the bottom right corner where a thumb rests, clear of the
  // bike at every lane; the other thumb still steers by swiping or tapping. Pressed, it
  // sinks and takes the accent.
  var PED = { x: VW - 80, y: VH - 98, w: 68, h: 86 };
  function pedal(g, P, font) {
    var on = !!(S && S.gas), x = PED.x, y = PED.y, w = PED.w, h = PED.h, sink = on ? 5 : 0, i;
    g.fillStyle = P.panel; rr(g, x, y, w, h, 16); g.fill();
    var px = x + 13, py = y + 10 + sink, pw = w - 26, ph = h - 36 - sink;
    g.fillStyle = on ? shade(ACCENT, -0.3) : 'rgba(0,0,0,.28)'; rr(g, px, py + 3, pw, ph, 9); g.fill();
    g.fillStyle = on ? ACCENT : '#8F8C99'; rr(g, px, py, pw, ph, 9); g.fill();
    g.fillStyle = on ? 'rgba(255,255,255,.35)' : 'rgba(255,255,255,.4)';
    for (i = 0; i < 4; i++) g.fillRect(px + 6, py + 8 + i * (ph - 16) / 3 - 1.5, pw - 12, 3);
    g.fillStyle = on ? (P.star ? '#FFFFFF' : ACCENT) : P.text; g.font = '800 12px ' + font; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.fillText(C.t('gasL'), x + w / 2, y + h - 9);
  }
  function onPedal(e) {
    var r = cv.getBoundingClientRect();
    if (!r.width || !r.height) return false;
    var x = (e.clientX - r.left) / r.width * VW, y = (e.clientY - r.top) / r.height * VH;
    // a little wider than drawn, for a thumb
    return x >= PED.x - 10 && x <= PED.x + PED.w + 10 && y >= PED.y - 10 && y <= VH;
  }
  function setGas() { if (S && !ended) E.gas(S, gasPtr !== null || keyGas); }

  // the road and everything on it, without the HUD
  function scene(g, P, t, dk) {
    cam.rear = S.p - E.BIKE_L;
    cam.X = laneX(S.x) * 0.6;
    sky(g, P, t);
    ground(g, P, S.d);
    if (S.daily) finishLine(g, E.DAILY_P - cam.rear);
    var list = [], i, j;
    for (i = 0; i < S.waves.length; i++) for (j = 0; j < S.waves[i].cars.length; j++) {
      var c = S.waves[i].cars[j];
      list.push({ c: c, y: S.waves[i].y + c.o });
    }
    // far to near; what is already beside the bike is drawn over it
    list.sort(function (a, b) { return b.y - a.y; });
    var behind = [];
    for (i = 0; i < list.length; i++) { if (list[i].y < cam.rear) behind.push(list[i]); else vehicle(g, P, list[i].c, list[i].y, dk); }
    for (i = S.items.length - 1; i >= 0; i--) if (!S.items[i].got && S.items[i].y >= cam.rear) can(g, P, S.items[i], t);
    bike(g, P, t, dk);
    for (i = 0; i < behind.length; i++) vehicle(g, P, behind[i].c, behind[i].y, dk);
    // speed lines at the edges on nitro
    if (S.boostT > 0 && !S.over) {
      g.strokeStyle = dk ? 'rgba(255,255,255,.35)' : 'rgba(255,255,255,.7)'; g.lineWidth = 2;
      for (i = 0; i < 10; i++) {
        var side = i % 2 ? 1 : -1, y0 = HZ + 30 + ((i * 47 + S.tick * 9) % (VH - HZ - 30)), x0 = VW / 2 + side * (70 + (i * 13) % 60 + (y0 - HZ) * 0.5);
        g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0 + side * 22, y0 + 26); g.stroke();
      }
    }
  }

  // the share card: the road as the run ended
  function paintShare(g, w, h) {
    var P = palette(dark());
    g.fillStyle = P.grass; g.fillRect(0, 0, w, h);
    var k = Math.min(w / VW, h / VH);
    g.save();
    g.translate((w - VW * k) / 2, (h - VH * k) / 2); g.scale(k, k);
    g.beginPath(); g.rect(0, 0, VW, VH); g.clip();
    scene(g, P, S.tick * E.DT, dark());
    g.restore();
  }

  /* ----------------------------------------------------------------- ui */

  function renderTop() {
    top.innerHTML = '';
    if (dailyDate) top.appendChild(el('span', { class: 'ch-badge ch-badge--accent' }, [C.icon('calendar', 14), el('span', { text: C.t('dailyMr') + ' — ' + C.num(dailyDate) })]));
    if (!S) return;
    top.appendChild(el('span', { class: 'ch-badge', text: C.t('kmN', { n: C.num((S.d / 1000).toFixed(1)) }) }));
    var best = dailyDate ? 0 : C.stats.getBest('motorush', 'score' + diffTag());
    if (best) top.appendChild(el('span', { class: 'ch-badge', text: C.t('bestN', { n: C.num(best) }) }));
    var on = !waiting && !held && !ended;
    pauseBtn.innerHTML = '';
    pauseBtn.appendChild(C.icon(on ? 'pause' : 'play', 22));
    pauseBtn.setAttribute('aria-label', on ? C.t('pause') : C.t('resume'));
    pauseBtn.disabled = ended;
    top.appendChild(pauseBtn);
  }
  function renderStatus() { status.textContent = C.t('hint'); }
  function go() { if (ended) return; if (waiting || held) { waiting = false; held = false; last = 0; acc = 0; renderTop(); kick(); } }
  function hold() { if (!S || ended || waiting || held) return; held = true; gasPtr = null; keyGas = false; setGas(); ctx.save(); renderTop(); draw(); }
  pauseBtn.addEventListener('click', function () { C.audio.unlock(); if (held || waiting) go(); else hold(); });

  /* -------------------------------------------------------------- input */

  // A swipe steers as soon as it has gone far enough sideways; a touch that never does
  // is a tap, which steers toward its side of the road. The canvas is drawn left to
  // right in every language, so its left is the road's left.
  var ptr = null, SWIPE = 22;
  wrap.addEventListener('pointerdown', function (e) {
    if (!S || (e.target.closest && e.target.closest('button'))) return;
    if (e.button !== undefined && e.button > 0) return;
    e.preventDefault();
    C.audio.unlock();
    if (ended) return;
    // the pedal is its own finger: held, it never steers, and it starts a waiting ride
    if (gasPtr === null && onPedal(e)) {
      gasPtr = e.pointerId;
      if (waiting || held) go();
      setGas(); draw();
      return;
    }
    if (waiting || held) { go(); return; }
    ptr = { id: e.pointerId, x: e.clientX, moved: false };
  });
  function gasUp(e) { if (gasPtr !== null && e.pointerId === gasPtr) { gasPtr = null; setGas(); draw(); } }
  window.addEventListener('pointerup', gasUp);
  window.addEventListener('pointercancel', gasUp);
  window.addEventListener('pointermove', function (e) {
    if (!ptr || e.pointerId !== ptr.id) return;
    var dx = e.clientX - ptr.x;
    if (Math.abs(dx) < SWIPE) return;
    // a long swipe may cross two lanes: steer once more for each further stretch
    ptr.moved = true;
    steer(dx > 0 ? 1 : -1);
    ptr.x = e.clientX;
  });
  window.addEventListener('pointerup', function (e) {
    if (!ptr || e.pointerId !== ptr.id) return;
    if (!ptr.moved) {
      var r = cv.getBoundingClientRect();
      steer(e.clientX < r.left + r.width / 2 ? -1 : 1);
    }
    ptr = null;
  });
  window.addEventListener('pointercancel', function (e) { if (ptr && e.pointerId === ptr.id) ptr = null; });
  wrap.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  wrap.style.touchAction = 'none';
  window.addEventListener('keydown', function (e) {
    if (document.querySelector('.ch-scrim')) return;
    if (e.target && e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
    var dir = e.key === 'ArrowLeft' || C.keyIs(e, 'a') ? -1 : e.key === 'ArrowRight' || C.keyIs(e, 'd') ? 1 : 0;
    if (dir) { e.preventDefault(); if (!e.repeat) steer(dir); return; }
    if (e.key === 'ArrowUp' || C.keyIs(e, 'w')) {
      e.preventDefault();
      if (e.repeat || ended) return;
      keyGas = true;
      if (waiting || held) go();
      setGas();
      return;
    }
    if (e.repeat) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); go(); }
    else if (e.key === 'Escape' || C.keyIs(e, 'p')) { e.preventDefault(); if (held || waiting) go(); else hold(); }
    else if (C.keyIs(e, 'r')) { e.preventDefault(); newRun(); }
  });
  window.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowUp' || C.keyIs(e, 'w')) { keyGas = false; setGas(); }
  });
  // a key released in another window never sends its keyup here
  window.addEventListener('blur', function () { keyGas = false; gasPtr = null; setGas(); });
  // a run waits while the app is away, and comes back waiting for a tap
  C.onPause(function () { paused = true; if (S && !ended && !waiting) held = true; ctx.save(); renderTop(); });
  C.onResume(function () { paused = false; kick(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { if (S && !ended && !waiting) { held = true; renderTop(); } } else kick(); });
  if (window.ResizeObserver) new ResizeObserver(function () { draw(); }).observe(box);
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw); } catch (er) { /* old WebViews */ } }
  // the HUD uses the app's font, which may arrive after the first frame
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { draw(); });

  /* --------------------------------------------------------------- help */

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    hold();
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [kb('← → / A D', C.t('kSteer')), kb('↑ / W', C.t('kGas')), kb('Space', C.t('kStart')), kb('P / Esc', C.t('kPause')), kb('R', C.t('kAgain'))])
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  // little pictures for the tutorial: the road from behind, the bike, cars and a can
  var SVG_BIKE = function (x, y) {
    return '<g transform="translate(' + x + ',' + y + ')"><rect x="-3" y="-14" width="6" height="14" rx="3" fill="#1C1B21"/><rect x="-7" y="-27" width="14" height="8" rx="3.5" fill="' + ACCENT + '"/>' +
      '<rect x="-15" y="-39" width="30" height="2" fill="#2F2D36"/><path d="M-8 -27 L8 -27 L7 -42 Q0 -45 -7 -42Z" fill="' + ACCENT + '"/><circle cy="-47" r="6" fill="#fff" stroke="#ccc"/></g>';
  };
  var SVG_CAR = function (x, y, w, col) {
    return '<g transform="translate(' + x + ',' + y + ')"><rect x="' + (-w / 2) + '" y="' + (-w * 0.6) + '" width="' + w + '" height="' + (w * 0.6) + '" rx="3" fill="' + col + '"/>' +
      '<rect x="' + (-w * 0.36) + '" y="' + (-w * 0.54) + '" width="' + (w * 0.72) + '" height="' + (w * 0.2) + '" rx="2" fill="rgba(30,45,70,.6)"/>' +
      '<rect x="' + (-w * 0.46) + '" y="' + (-w * 0.26) + '" width="' + (w * 0.16) + '" height="' + (w * 0.07) + '" fill="#E3342F"/><rect x="' + (w * 0.3) + '" y="' + (-w * 0.26) + '" width="' + (w * 0.16) + '" height="' + (w * 0.07) + '" fill="#E3342F"/></g>';
  };
  function road() {
    return '<rect x="0" y="20" width="200" height="100" fill="#93C273"/><path d="M92 20 L108 20 L196 120 L4 120Z" fill="#5A5862"/>' +
      '<path d="M100 20 L100 120 M96 20 L52 120 M104 20 L148 120" stroke="#fff" stroke-width="1.5" stroke-dasharray="6 6" opacity=".85"/>' +
      '<rect x="0" y="0" width="200" height="20" fill="#B8DEF2"/>';
  }
  function tArt(kind) {
    var s = '<svg viewBox="0 0 200 120" width="100%" direction="ltr"><rect width="200" height="120" rx="10" fill="#FBE6EC"/><g clip-path="inset(0 round 10px)">' + road();
    if (kind === 1) {
      s += SVG_CAR(76, 70, 26, '#3E8FD6') + SVG_CAR(122, 56, 18, '#F0A830') + SVG_BIKE(126, 116) +
        '<path d="M70 100 h-22 M54 94 l-7 6 7 6 M132 100 h22 M148 94 l7 6 -7 6" stroke="' + ACCENT + '" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
    } else if (kind === 2) {
      s += SVG_CAR(68, 104, 40, '#E2584D') + SVG_BIKE(118, 116) +
        '<path d="M92 66 q8 -6 16 0" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>' +
        '<rect x="134" y="28" width="44" height="22" rx="11" fill="' + ACCENT + '"/><text x="156" y="44" font-size="13" font-weight="800" text-anchor="middle" fill="#fff" font-family="sans-serif">×2</text>';
    } else {
      s += '<g transform="translate(100,74)"><rect x="-9" y="-12" width="18" height="22" rx="3" fill="#F6B93B"/><path d="M2 -9 L-5 1 L0 1 L-2 8 L5 -2 L0 -2Z" fill="#fff"/></g>' +
        SVG_BIKE(100, 116) + '<rect x="20" y="30" width="70" height="8" rx="4" fill="rgba(0,0,0,.15)"/><rect x="20" y="30" width="52" height="8" rx="4" fill="#F6B93B"/>' +
        '<path d="M110 112 l6 8 M90 112 l-6 8" stroke="#FFB13B" stroke-width="3" stroke-linecap="round"/>';
    }
    return s + '</g></svg>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: tArt(1) },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: tArt(2) },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: tArt(3) }
  ];

  /* -------------------------------------------------------------- start */

  // A ride in progress is saved when it is paused and when the app goes away; the
  // daily ride has its own slot
  ctx.autosave(function () {
    if (!S || S.over || ended) return { inProgress: false };
    return { s: E.snapshot(S), seed: seed, tries: tries, daily: dailyDate || null, elapsed: Date.now() - startedAt };
  });
  function resumeRun(sv) {
    var R = E.restore(sv.s);
    if (!R || R.over || R.daily !== !!dailyDate) return false;
    S = R; seed = sv.seed; tries = sv.tries || 1; startedAt = Date.now() - (sv.elapsed || 0);
    ended = false; waiting = true; held = false; last = 0; acc = 0; pops = []; crashAt = 0;
    runAwarded = S.d >= 10000;
    renderTop(); renderStatus(); draw(); kick();
    return true;
  }
  var saved = ctx.loadSave();
  if (dailyDate) {
    if (!(saved && saved.s && saved.daily === dailyDate && resumeRun(saved))) newRun();
    if (C.stats.dailyDone('motorush', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).motorush;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
    }
  } else if (!(saved && saved.s && !saved.daily && resumeRun(saved))) {
    newRun();
  }
  ctx.tutorialIfNew(TUT);
})();
</script>
</body>
</html>
