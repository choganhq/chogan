<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FBF6EF">
<title>تپه‌سوار — چوگان</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../lib/chogan.css">
<style>
  /* upright on a phone, wide beside the side rows on a wide screen */
  .hr-wrap > .ch-fit { --fit-ar: calc(3 / 4); }
  @container game (min-aspect-ratio: 5 / 4) { .hr-wrap > .ch-fit { --fit-ar: calc(16 / 9); } }
  .ch-nocq .ch-gamemain.ch-wide .hr-wrap > .ch-fit { --fit-ar: calc(16 / 9); }
  .ch-fit > .hr-box { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; }
  /* #803: on a phone on its side the side column took 240 of 844 px and the road stayed as
     small as upright (64% of the width). The road takes the whole game area instead and
     the rows sit over its top centre as one line (a row above it still cost a fifth of
     the height), so gas and brake are at the two ends of the phone for two thumbs. The
     canvas is drawn at whatever size its box has. */
  @container game (min-aspect-ratio: 5 / 4) {
    .hr-wrap.ch-split { flex-direction: column; position: relative; }
    .hr-wrap.ch-split > .ch-fit { flex: 1 1 0; width: 100%; height: auto; max-height: none; }
    .hr-wrap.ch-split > .ch-side { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); z-index: 1; flex-direction: row; align-items: center; justify-content: center; width: auto; max-width: 60%; max-height: none; overflow: visible; pointer-events: none; }
    .hr-wrap.ch-split > .ch-side > * { width: auto; }
    .hr-wrap.ch-split > .ch-side button { pointer-events: auto; }
    .hr-wrap .hr-status--hint { display: none; }
  }
  /* the same where container queries are missing (#610); the fallback sets pixel widths
     inline, so these must win over them */
  .ch-nocq .ch-gamemain.ch-wide .hr-wrap.ch-split { flex-direction: column; position: relative; }
  .ch-nocq .ch-gamemain.ch-wide .hr-wrap.ch-split > .ch-fit { flex: 1 1 0; width: 100% !important; height: auto; max-height: none !important; }
  .ch-nocq .ch-gamemain.ch-wide .hr-wrap.ch-split > .ch-fit > .hr-box { width: 100% !important; }
  .ch-nocq .ch-gamemain.ch-wide .hr-wrap.ch-split > .ch-side { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); z-index: 1; flex-direction: row; align-items: center; justify-content: center; width: auto !important; max-width: 60%; max-height: none; overflow: visible; pointer-events: none; }
  .ch-nocq .ch-gamemain.ch-wide .hr-wrap.ch-split > .ch-side button { pointer-events: auto; }
  .ch-nocq .ch-gamemain.ch-wide .hr-wrap .hr-status--hint { display: none; }
  /* fuel for coins (#801), over the canvas under the tank; placed from E.hudLayout */
  .hr-buy { position: absolute; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; border: 0; border-radius: 999px; background: #D8382C; color: #FFFFFF; font: inherit; font-weight: 800; font-size: var(--fs-sm); box-shadow: 0 2px 6px rgba(0, 0, 0, .25); cursor: pointer; white-space: nowrap; }
  .hr-buy[hidden] { display: none; }
  .hr-buy .ch-icon { pointer-events: none; }
  /* left is the brake and right the gas in every language, like the pedals of a car */
  .hr-canvas { display: block; touch-action: none; border-radius: var(--r-lg); direction: ltr; user-select: none; -webkit-user-select: none; }
  .hr-top { display: flex; justify-content: center; align-items: center; gap: var(--s-2); flex-wrap: wrap; }
  .hr-gear .ch-icon { pointer-events: none; }
  .hr-scene { flex-wrap: wrap; }
  .hr-garage { flex-basis: 100%; display: flex; flex-direction: column; gap: var(--s-2); }
  .hr-car { display: flex; align-items: center; gap: var(--s-2); }
  .hr-car__pic { flex: none; }
  .hr-car__text { flex: 1 1 auto; min-width: 0; }
  .hr-car__name { font-weight: 800; }
  .hr-car__desc { font-size: var(--fs-sm); }
  .hr-car--locked .hr-car__pic, .hr-car--locked .hr-car__text { opacity: 0.55; }
  .hr-carbtn { flex: none; display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 12px; }
  .hr-carbtn .ch-icon { pointer-events: none; }
  .hr-gripnote { flex-basis: 100%; font-size: var(--fs-sm); }
  .hr-status { min-height: 1.6em; font-weight: 700; color: var(--c-text-dim); text-align: center; font-size: var(--fs-sm); }
</style>
</head>
<body>
<script src="../../version.js"></script>
<script src="../../lib/chogan.js"></script>
<script>
/* ==== ENGINE START ==== */
function HillriderEngineFactory() {
  'use strict';

  // Metres and seconds, y up. Fixed steps of 1/60 s, each cut into eight smaller ones so
  // the springs between the body and the wheels stay steady; the same inputs give the
  // same drive on every device.
  var DT = 1 / 60, SUB = 8, H = DT / SUB, G = 9.8;
  // the body: a box with the driver's head on top, wheels hung from two points under it
  var M = 1, INERTIA = 0.9, WM = 0.2, WROT = 0.1, WR = 0.42;
  var ANCH = [[-1.05, -0.42], [1.05, -0.42]];
  var BODY = [[-1.45, -0.2], [1.45, -0.2], [-1.35, 0.3], [1.35, 0.3], [0.6, 0.35]];
  var HEAD = [-0.15, 0.95], HEAD_R = 0.27;
  var KU = 600, CU = 14, KV = 55, CV = 3.2, STOP = 0.32;
  var MU = 1.15, VMAX = 15, VREV = 6, MOTOR = 28, BRAKE = 40, REACT = 0.55, AIR = 5.5, WMAX = 7;
  // a full tank lasts 30 s of gas, or 110 s rolling
  var BURN_GAS = 1 / 30, BURN_IDLE = 1 / 110;
  var START = 4, STEP = 1, ORIGIN = 40;
  /* Scenes (#805, owner's wish; night is the fourth, decided 2026-11-11). mu is the wheel's
     grip on the ground, sunny's 1.15 the reference: on a wet road a wheel spins and slides
     sooner, on snow sooner still, so climbs take more care and the brake needs more room.
     Night keeps a dry road and only takes the light away. The daily is always sunny. */
  var SCENES = { sun: { mu: MU }, rain: { mu: 0.34 }, snow: { mu: 0.2 }, night: { mu: MU } };
  var SCENE_IDS = ['sun', 'snow', 'rain', 'night'];
  function sceneOf(id) { return SCENES.hasOwnProperty(id) ? id : 'sun'; }
  /* Cars (#808, owner's wish; three to buy at 300, 800 and 2000 app coins, decided
     2026-11-11). The body, the wheels and the driver's head stay where they are, so every
     car meets the ground the same way; what changes is the engine's push and top speed,
     how long a tank lasts on the gas, how much the tyres grip (a factor on the scene's),
     and the turn in the air. The buggy is free and drives the daily for everyone. */
  var CARS = {
    buggy: { price: 0, motor: MOTOR, vmax: VMAX, burn: 30, grip: 1, air: AIR },
    jeep: { price: 300, motor: 30, vmax: 15.5, burn: 38, grip: 1.15, air: AIR },
    truck: { price: 800, motor: 32, vmax: 16.5, burn: 46, grip: 1.3, air: 6 },
    racer: { price: 2000, motor: 35, vmax: 18, burn: 56, grip: 1.45, air: 6.5 }
  };
  var CAR_IDS = ['buggy', 'jeep', 'truck', 'racer'];
  function carOf(id) { return CARS.hasOwnProperty(id) ? id : 'buggy'; }
  function car(id) { var c = CARS[carOf(id)]; return { id: carOf(id), price: c.price, motor: c.motor, vmax: c.vmax, burn: c.burn, grip: c.grip, air: c.air }; }
  // the car's numbers on the run, so a step reads them without a lookup
  function fit(S, carId) { var c = CARS[carOf(carId)]; S.car = carOf(carId); S.mu = SCENES[S.scene].mu * c.grip; S.cp = c; }

  function hash(seed, i) {
    var h = Math.imul((seed >>> 0) ^ Math.imul(i | 0, 0x9E3779B1), 0x85EBCA6B);
    h ^= h >>> 13; h = Math.imul(h, 0xC2B2AE35); h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function smooth(t) { return t * t * (3 - 2 * t); }

  /* ------------------------------------------------------------ terrain */

  // How hard the hills are at a distance: 0 at the start, 1 from 2,000 m on
  function hard(x) { return clamp(x / 2000, 0, 1); }
  function noise(seed, o, t) {
    var i = Math.floor(t), f = t - i, a = hash(seed + o * 7919, i) * 2 - 1, b = hash(seed + o * 7919, i + 1) * 2 - 1;
    return a + (b - a) * smooth(f);
  }
  // the raw hills: three sizes of wave that grow with the distance, flat at the start
  function raw(seed, x) {
    var d = hard(x), ramp = smooth(clamp((x - 12) / 60, 0, 1));
    return ramp * ((4 + 12 * d) * noise(seed, 1, x / 46) + (1.6 + 4.5 * d) * noise(seed, 2, x / 16) + (0.2 + 0.7 * d) * noise(seed, 3, x / 6));
  }
  // The ground is laid a metre at a time, each metre at most so steep (the raw waves can
  // stack into a wall no car climbs), then softened over five points; between points it
  // is a smooth curve, so a wheel never meets a corner.
  function maxSlope(x) { return 0.6 + 0.5 * hard(x); }
  function grow(S, i) {
    var T = S.ter;
    while (T.c.length <= i + 3) {
      var k = T.c.length, x = k - ORIGIN;
      if (x <= 0) { T.c.push(x < -14 ? 0.35 * (-x - 14) * (-x - 14) : 0); continue; }
      var prev = T.c[k - 1], m = maxSlope(x);
      T.c.push(prev + clamp(raw(S.seed, x) - prev, -m, m));
    }
    while (T.p.length <= i + 1) {
      var j = T.p.length, s = 0, n = 0;
      for (var q = j - 2; q <= j + 2; q++) if (q >= 0) { s += T.c[q]; n++; }
      T.p.push(s / n);
    }
  }
  function pt(S, j) { if (j < 0) return S.ter.c[0] + 0.35 * j * j; grow(S, j); return S.ter.p[j]; }
  // height and slope at x, on a Catmull-Rom curve through the points
  function ground(S, x) {
    var u = (x + ORIGIN) / STEP, j = Math.floor(u), t = u - j;
    var p0 = pt(S, j - 1), p1 = pt(S, j), p2 = pt(S, j + 1), p3 = pt(S, j + 2);
    var a = -0.5 * p0 + 1.5 * p1 - 1.5 * p2 + 0.5 * p3, b = p0 - 2.5 * p1 + 2 * p2 - 0.5 * p3, c = -0.5 * p0 + 0.5 * p2;
    return { h: ((a * t + b) * t + c) * t + p1, s: ((3 * a * t + 2 * b) * t + c) / STEP };
  }
  function height(S, x) { return ground(S, x).h; }

  /* ----------------------------------------------------------- pickups */

  // Fuel cans: the first at about 110 m, then the gap grows from about 160 m to 420 m with the distance; coins come in rows
  // of five between them. Both follow from the seed, so only what was taken is saved.
  function fuelAt(S, n) {
    var F = S.fx;
    while (F.length <= n) {
      var last = F.length ? F[F.length - 1] : 0;
      F.push(Math.round(last + (F.length ? 160 + 260 * hard(last) : 110) + (hash(S.seed + 31, F.length) - 0.5) * 40));
    }
    return F[n];
  }
  function coinRow(S, n) { return Math.round(45 + n * 64 + hash(S.seed + 57, n) * 24); }
  // what lies between x0 and x1, for the drawing and the pickup test
  function pickups(S, x0, x1) {
    var out = [], n = 0, x;
    while ((x = fuelAt(S, n)) < x1 + 2) { if (x >= x0 - 2 && !S.got['f' + n]) out.push({ kind: 'fuel', id: 'f' + n, x: x, y: height(S, x) + 0.55 }); n++; }
    var r0 = Math.max(0, Math.floor((x0 - 70) / 64));
    for (var r = r0; (x = coinRow(S, r)) < x1 + 2; r++) {
      for (var c = 0; c < 5; c++) {
        var cx = x + c * 1.6, id = 'c' + (r * 5 + c);
        if (cx < x0 - 2 || cx > x1 + 2 || S.got[id]) continue;
        // a coin never sits on a can
        if (Math.abs(cx - fuelAt(S, nearFuel(S, cx))) < 3) continue;
        out.push({ kind: 'coin', id: id, x: cx, y: height(S, cx) + 0.9 + 0.35 * Math.sin(c / 4 * Math.PI) });
      }
    }
    return out;
  }
  function nearFuel(S, x) { var n = 0; while (fuelAt(S, n + 1) < x) n++; return Math.abs(fuelAt(S, n + 1) - x) < Math.abs(fuelAt(S, n) - x) ? n + 1 : n; }

  /* ---------------------------------------------------- the world (#806) */

  /* Small things on the road, a rock or a branch, about one every 150 m from about 50 m on, at the
     same rate however far the car gets. Each follows from the seed alone, like the cans. One
     is never put on a steep stretch or within 10 m of a can, so it never stands between a
     car and a climb or its fuel. A wheel rolling over one is thrown up a little and loses a
     little speed: a jolt, never a wall. */
  var BUMP_GAP = 150, BUMP_FLAT = 0.3, BUMP_CAN = 10;
  function bumpAt(S, n) {
    var B = S.bx;
    while (B.length <= n) {
      var i = B.length, x0 = Math.round(80 + i * BUMP_GAP + (hash(S.seed + 91, i) - 0.5) * 60), x = null;
      // the nearest fitting spot within 35 m of its place, so steep country keeps its share
      for (var o = 0; o <= 70 && x === null; o++) { var c = x0 + (o % 2 ? (o + 1) / 2 : -o / 2); if (bumpFits(S, c)) x = c; }
      B.push(x === null ? null : { x: x, kind: hash(S.seed + 92, i) < 0.5 ? 'rock' : 'branch' });
    }
    return B[n];
  }
  function bumpFits(S, x) {
    for (var d = -3; d <= 3; d++) if (Math.abs(ground(S, x + d).s) > BUMP_FLAT) return false;
    return Math.abs(fuelAt(S, nearFuel(S, x)) - x) >= BUMP_CAN;
  }
  function bumps(S, x0, x1) {
    var out = [], n = Math.max(0, Math.floor((x0 - 120) / BUMP_GAP)), b;
    for (; 80 + n * BUMP_GAP - 70 <= x1 + 1; n++) { b = bumpAt(S, n); if (b && b.x >= x0 - 1 && b.x <= x1 + 1) out.push(b); }
    return out;
  }
  // a wheel that crossed a bump this step, on the ground, is jolted up along the normal
  function jolt(S, x0s, ev) {
    var hit = false;
    for (var k = 0; k < 2; k++) {
      var W = S.wh[k], a = Math.min(x0s[k], W.x), b = Math.max(x0s[k], W.x);
      if (b - a < 1e-6) continue;
      var near = bumps(S, a, b);
      for (var i = 0; i < near.length; i++) {
        if (near[i].x < a || near[i].x > b || depth(S, W.x, W.y, WR + 0.08).pen <= 0) continue;
        var D = depth(S, W.x, W.y, WR), sp = Math.abs(W.vx), up = Math.min(2.4, 0.6 + 0.22 * sp);
        W.vx += D.nx * up - W.vx * 0.06; W.vy += D.ny * up;
        S.vx *= 0.97;
        hit = true;
      }
    }
    if (hit) ev.push('bump');
  }

  /* Scenery beside the road (#806), a pure function of the seed: the same course always
     has the same trees, bushes, rocks, signs and fences, one slot every 6 m, so it is as
     full at 5 km as at the start. Nothing here touches the car. Animals have a home every
     40 m or so and move around it by the clock alone. */
  var SCN_CELL = 6, ANI_CELL = 40;
  function scenery(seed, x0, x1) {
    var out = [], i, r, x;
    for (i = Math.floor(x0 / SCN_CELL) - 1; i * SCN_CELL <= x1 + SCN_CELL; i++) {
      if (i * SCN_CELL < 10 - START) continue;
      r = hash(seed + 101, i); x = i * SCN_CELL + hash(seed + 102, i) * (SCN_CELL - 1);
      var kind = r < 0.3 ? 'tree' : r < 0.45 ? 'bush' : r < 0.55 ? 'stone' : r < 0.6 ? 'sign' : r < 0.72 ? 'fence' : null;
      if (kind && x >= x0 - 3 && x <= x1 + 3) out.push({ kind: kind, x: x, s: 0.75 + 0.5 * hash(seed + 103, i), v: hash(seed + 104, i) });
    }
    return out;
  }
  var ANIMALS = ['rabbit', 'bird', 'deer'];
  function animals(seed, x0, x1) {
    var out = [];
    for (var i = Math.max(1, Math.floor(x0 / ANI_CELL) - 1); i * ANI_CELL <= x1 + ANI_CELL; i++) {
      if (hash(seed + 111, i) > 0.45) continue;
      var x = i * ANI_CELL + hash(seed + 112, i) * 30;
      if (x >= x0 - 8 && x <= x1 + 8) out.push({ kind: ANIMALS[Math.floor(hash(seed + 113, i) * 3) % 3], x: x, ph: hash(seed + 114, i) * 6.283 });
    }
    return out;
  }
  // where an animal is at time t: an offset from its home and a hop or flight height, both
  // bounded, so it never wanders far from its own patch of road side
  function animalAt(A, t) {
    var w = t * (A.kind === 'bird' ? 0.9 : A.kind === 'deer' ? 0.25 : 0.6) + A.ph;
    var dx = (A.kind === 'bird' ? 6 : A.kind === 'deer' ? 2.5 : 3) * Math.sin(w), dir = Math.cos(w) >= 0 ? 1 : -1;
    var up = A.kind === 'bird' ? 3.2 + 0.6 * Math.sin(w * 2.3) : A.kind === 'rabbit' ? 0.35 * Math.abs(Math.sin(t * 5 + A.ph)) : 0;
    return { x: A.x + dx, up: up, dir: dir };
  }

  /* -------------------------------------------------------------- game */

  // seed: whole number; finish: metres for the daily course, 0 for an endless run; scene:
  // one of SCENE_IDS, sunny when missing
  function newGame(seed, finish, scene, carId) {
    var sc = sceneOf(scene);
    var S = { seed: seed >>> 0, finish: finish || 0, scene: sc, mu: SCENES[sc].mu, ter: { c: [], p: [] }, fx: [], bx: [], got: {}, t: 0,
      x: START, y: 0, a: 0, vx: 0, vy: 0, w: 0,
      wh: [], fuel: 1, coins: 0, cans: 0, best: 0, air: 0, airBest: 0, flips: 0, spin: 0, still: 0,
      over: false, won: false, cause: '', touch: [false, false] };
    fit(S, carId);
    var g = height(S, START);
    S.y = g + WR + 0.52;
    for (var k = 0; k < 2; k++) { var A = world(S, ANCH[k]); S.wh.push({ x: A[0], y: A[1], vx: 0, vy: 0, sp: 0, rot: 0 }); }
    // settle on the springs before the first frame
    for (var i = 0; i < 90; i++) step(S, 0, true);
    S.t = 0; S.best = 0; S.fuel = 1;
    return S;
  }
  function world(S, p) {
    var c = Math.cos(S.a), s = Math.sin(S.a);
    return [S.x + p[0] * c - p[1] * s, S.y + p[0] * s + p[1] * c];
  }
  function headPos(S) { return world(S, HEAD); }

  // A point's depth into the ground along the ground's normal: positive is inside
  function depth(S, x, y, r) {
    var g = ground(S, x), n = 1 / Math.sqrt(1 + g.s * g.s);
    return { pen: r - (y - g.h) * n, nx: -g.s * n, ny: n };
  }

  // One step. ctl: 1 gas, -1 brake (and reverse), 0 neither. hold: the player is being
  // offered fuel for coins (#801), so an empty tank does not end the run yet. Returns the
  // step's events.
  function step(S, ctl, settling, hold) {
    if (S.over || S.won) return [];
    var ev = [], gas = ctl > 0 && S.fuel > 0, brake = ctl < 0;
    var a0 = S.a;
    var wx = [S.wh[0].x, S.wh[1].x];
    for (var sub = 0; sub < SUB; sub++) substep(S, gas, brake, ev);
    if (settling) return ev;
    jolt(S, wx, ev);
    S.t += DT;
    S.fuel = Math.max(0, S.fuel - DT * (gas ? 1 / S.cp.burn : BURN_IDLE));
    if (S.fuel === 0 && S.fuelOut !== true) { S.fuelOut = true; ev.push('empty'); }
    // whole turns in the air: an air-time trick
    var onGround = S.touch[0] || S.touch[1];
    if (!onGround) {
      S.air += DT;
      var da = S.a - a0; S.spin += da;
      if (Math.abs(S.spin) >= Math.PI * 2 - 0.3) { S.flips++; S.spin = 0; ev.push('flip'); }
    } else {
      if (S.air > 0.6) ev.push('land');
      if (S.air > S.airBest) S.airBest = S.air;
      S.air = 0; S.spin = 0;
    }
    var d = S.x - START;
    if (d > S.best) S.best = d;
    // pickups the car passes through
    var near = pickups(S, S.x - 2.2, S.x + 2.2);
    for (var i = 0; i < near.length; i++) {
      var p = near[i];
      if (Math.abs(p.x - S.x) < 1.9 && Math.abs(p.y - (S.y + 0.2)) < 1.6) {
        S.got[p.id] = 1;
        if (p.kind === 'fuel') { S.fuel = 1; S.cans++; S.fuelOut = false; ev.push('fuel'); }
        else { S.coins++; ev.push('coin'); }
      }
    }
    // the head touching the ground ends the run
    var hp = headPos(S);
    if (depth(S, hp[0], hp[1], HEAD_R).pen > 0) { S.over = true; S.cause = 'head'; ev.push('crash'); return ev; }
    // standing still out of fuel, or stuck on a side, ends it too
    var speed = Math.hypot(S.vx, S.vy);
    var waitBuy = hold && S.fuel === 0 && Math.cos(S.a) >= 0.15;
    if (!waitBuy && (S.fuel === 0 || Math.cos(S.a) < 0.15) && speed < 0.5) S.still += DT; else S.still = 0;
    if (S.still > 1.5) { S.over = true; S.cause = S.fuel === 0 ? 'fuel' : 'stuck'; ev.push(S.cause === 'fuel' ? 'stall' : 'crash'); return ev; }
    if (S.finish && S.best >= S.finish) { S.won = true; ev.push('finish'); }
    return ev;
  }

  function substep(S, gas, brake, ev) {
    var c = Math.cos(S.a), s = Math.sin(S.a), fx = 0, fy = -M * G, tq = 0, touched = [false, false];
    for (var k = 0; k < 2; k++) {
      var W = S.wh[k], lx = ANCH[k][0] * c - ANCH[k][1] * s, ly = ANCH[k][0] * s + ANCH[k][1] * c;
      var ax = S.x + lx, ay = S.y + ly, avx = S.vx - S.w * ly, avy = S.vy + S.w * lx;
      var dx = ax - W.x, dy = ay - W.y, dvx = avx - W.vx, dvy = avy - W.vy;
      // stiff along the body, soft across it: the suspension
      var du = dx * c + dy * s, dv = -dx * s + dy * c, vu = dvx * c + dvy * s, vv = -dvx * s + dvy * c;

  });

  // the speed dial's unit, behind the gear (#777): km/h everywhere by default
  var prefs = ctx.store.get('prefs', null);
  if (!prefs || typeof prefs !== 'object') prefs = {};
  if (prefs.speed !== 'mph' && prefs.speed !== 'off') prefs.speed = 'kmh';
  // the scene, behind the gear too (#805); sunny for a new player
  prefs.scene = E.sceneOf(prefs.scene);
  // the cars bought (#808), kept as a list of ids; the buggy is always there
  var owned = ctx.store.get('cars', null);
  if (!Array.isArray(owned)) owned = [];
  owned = E.CAR_IDS.filter(function (id) { return id === 'buggy' || owned.indexOf(id) >= 0; });
  prefs.car = owned.indexOf(prefs.car) >= 0 ? prefs.car : 'buggy';
  // a free ride or a race against the bot (#807), and the bot's level; medium for a new player
  prefs.mode = prefs.mode === 'race' ? 'race' : 'solo';
  prefs.level = E.levelOf(prefs.level);
  // the shown speed in m/s, eased so the suspension's bounce does not flicker the digits
  var spd = 0;

  var params = new URLSearchParams(location.search);
  var dailyDate = params.get('daily');

  var S = null, raf = 0, last = 0, acc = 0, frameDt = 1 / 60, prev = null, paused = false, held = { l: false, r: false }, keys = { g: false, b: false };
  var tries = 0, startedAt = 0, ended = false, waiting = false, resumed = false, flipPending = false;
  // the view follows the car smoothly, so a bump does not shake the whole screen
  var cam = { x: 0, y: 0 };

  // with the same clock, never touching it; null on a free ride and on the daily road
  var race = false, raceLv = 'medium', B = null, prevB = null;

  var cv = el('canvas', { class: 'hr-canvas', role: 'img', 'aria-label': C.t('hills') });
  var buyLabel = el('span');
  var buyBtn = el('button', { class: 'hr-buy', type: 'button', hidden: true }, [C.icon('coin', 16), buyLabel]);
  var box = el('div', { class: 'hr-box' }, [cv, buyBtn]);
  var top = el('div', { class: 'hr-top ch-above' });
  var status = el('div', { class: 'hr-status', role: 'status', 'aria-live': 'polite' });
  var sideEl = el('div', { class: 'ch-side' }, [top, status]);
  var wrap = el('div', { class: 'hr-wrap ch-split' }, [el('div', { class: 'ch-fit' }, [box]), sideEl]);
  // the rows lie over the road's top centre on a wide screen (#803); read on resize, not per frame
  var rowOver = false;
  function readRowOver() { rowOver = getComputedStyle(sideEl).position === 'absolute'; }

  ctx.button({ icon: 'help', label: C.t('help'), onClick: showHelp });
  ctx.button({ icon: 'refresh', label: C.t('newRun'), onClick: function () { newRun(); } });
  ctx.main.appendChild(wrap);
  ctx.mount();

  /* ------------------------------------------------------------- runs */

  // The daily road is the same for everyone: the day's seed, moved on to a road the
  // engine's own driver finishes (E.courseSeed), worked out once a page load
  var dailySeed = null;
  function seedFor() {
    // a race course is one the bot at its level finishes in this car and weather
    if (!dailyDate) return race ? E.courseSeed(Math.floor(Math.random() * 4294967296), E.RACE, 12, prefs.scene, prefs.car, raceLv) : Math.floor(Math.random() * 4294967296);
    if (dailySeed === null) dailySeed = E.courseSeed(Math.floor(C.daily('hillrider', dailyDate).rng() * 4294967296), FINISH);
    return dailySeed;
  }

  function newRun() {
    // the daily road is sunny for everyone, so the scores compare (#805)
    // and in the buggy, for the same reason (#808)
    race = !dailyDate && prefs.mode === 'race'; raceLv = prefs.level;
    S = E.newGame(seedFor(), dailyDate ? FINISH : race ? E.RACE : 0, dailyDate ? 'sun' : prefs.scene, dailyDate ? 'buggy' : prefs.car);
    B = race ? E.newGame(S.seed, E.RACE, S.scene, S.car) : null; prevB = null;
    // a new run stands still until the first touch, so the tank is full when it starts
    waiting = true; resumed = false; flipPending = false;
    tries++;
    startedAt = Date.now();
    ended = false;
    acc = 0; last = 0; prev = null; spd = 0;
    cam.x = S.x; cam.y = S.y;
    renderTop();
    renderStatus();
    draw();
    kick();
  }

  function control() {
    var gas = held.r || keys.g, brake = held.l || keys.b;
    return gas && brake ? 0 : gas ? 1 : brake ? -1 : 0;
  }

  /* The car is drawn between the last two physics steps, not at the last one. A step is
     1/60 s and a car at speed moves 0.25 m in it; a screen that shows 0, 1 or 2 steps a frame
     moved the car by that much in uneven jumps, which read as a blur on the gas (owner,
     2026-11-11). */
  function pose(T) {
    return { x: T.x, y: T.y, a: T.a, wh: T.wh.map(function (W) { return { x: W.x, y: W.y, rot: W.rot }; }) };
  }
  function view(T, P0) {
    if (!T) { T = S; P0 = prev; }
    var now = pose(T);
    if (!P0 || ended) return now;
    var f = Math.max(0, Math.min(1, acc / E.DT));
    function mix(a, b) { return a + (b - a) * f; }
    return { x: mix(P0.x, now.x), y: mix(P0.y, now.y), a: mix(P0.a, now.a),
      wh: now.wh.map(function (W, i) { return { x: mix(P0.wh[i].x, W.x), y: mix(P0.wh[i].y, W.y), rot: mix(P0.wh[i].rot, W.rot) }; }) };
  }
  function tick(now) {
    raf = 0;
    if (!S) return;
    clock = now / 1000;
    var blocked = paused || waiting || document.hidden || !!document.querySelector('.ch-scrim');
    if (!last || blocked) last = now;
    frameDt = Math.min(0.1, (now - last) / 1000);
    acc += frameDt;
    last = now;
    var ev = [];
    if (blocked) acc = 0;
    while (acc >= E.DT && !ended) {
      acc -= E.DT;
      prev = pose(S);
      ev = ev.concat(E.step(S, control(), false, canBuy()));
      // the bot drives the same step as the player, so both clocks agree to the frame
      if (B) { prevB = pose(B); E.step(B, E.botControl(B, raceLv)); }
      if (S.over || S.won) break;
    }
    events(ev);
    spd += (Math.abs(S.vx) - spd) * (1 - Math.pow(1 - 0.2, frameDt * 60));
    draw();
    renderDist();
    if ((S.over || S.won) && !ended) { ended = true; setTimeout(finish, C.ui.reduceMotion() ? 200 : 900); }
    if (!ended) raf = requestAnimationFrame(tick);
  }
  function kick() { if (!raf) raf = requestAnimationFrame(tick); }

  /* Fuel for the app's coins (#801). The out-of-fuel stop waits while the button is offered
     and the wallet can pay, so the player has time to decide; with too few coins the run
     ends as before and a tap only explains why. */
  function canBuy() { return E.fuelOffered(S) && C.coins.can(E.FUEL_PRICE); }
  function buyFuel() {
    if (!S || ended || !E.fuelOffered(S)) return;
    if (!C.coins.can(E.FUEL_PRICE)) { C.ui.toast({ icon: 'coin', title: C.t('notEnoughCoins'), sub: C.t('playToEarn') }); return; }
    if (!C.coins.spend(E.FUEL_PRICE)) return;
    E.refuel(S);
    C.feedback('good');
    C.ui.toast({ icon: 'coin', title: C.t('fuelBought') });
    go();
    draw();
  }
  buyBtn.addEventListener('click', buyFuel);
  buyLabel.textContent = C.t('buyFuel', { n: C.num(E.FUEL_PRICE) });
  buyBtn.setAttribute('aria-label', buyLabel.textContent);
  function placeBuy(L) {
    var show = !!S && !ended && E.fuelOffered(S);
    if (buyBtn.hidden === show) buyBtn.hidden = !show;
    if (!show) return;
    var st = buyBtn.style, b = L.buy;
    st.left = Math.round(b.x) + 'px'; st.top = Math.round(b.y) + 'px'; st.height = Math.round(b.h) + 'px'; st.minWidth = Math.round(b.w) + 'px';
  }
  function events(ev) {
    if (!ev.length) return;
    if (ev.indexOf('coin') >= 0) C.audio.sfx('tap');
    if (ev.indexOf('fuel') >= 0) C.feedback('good');
    if (ev.indexOf('bump') >= 0 && ev.indexOf('land') < 0) C.feedback('thud');
    if (ev.indexOf('flip') >= 0) { flipPending = true; C.feedback('whoosh'); }
    if (ev.indexOf('land') >= 0) {
      C.feedback('thud');
      // a whole turn in the air counts once the car is back on its wheels
      if (flipPending && ev.indexOf('crash') < 0) C.achievements.unlock('hr-flip');
      flipPending = false;
    }
    if (ev.indexOf('finish') >= 0) C.feedback('good');
    if (ev.indexOf('crash') >= 0 || ev.indexOf('stall') >= 0) C.feedback('bad');
  }

  // a race time to a tenth of a second, so a close finish reads as close
  function raceTime(t) { return C.time(t * 1000) + C.num('.' + (Math.floor(t * 10) % 10)); }
  /* The race's end (#807): the bot is driven on to its own flag at once, with the same
     steps it would have taken on screen, so its time is known even when the player went
     off the road first. The first to the flag by the run's clock wins. */
  function finishRace() {
    ctx.clearSave();
    while (!B.won && !B.over && B.t < 600) E.step(B, E.botControl(B, raceLv));
    var m = E.metres(S), mine = S.won ? S.t : null, bots = B.won ? B.t : null;
    var won = mine !== null && (bots === null || mine < bots);
    var coins = Math.min(40, 2 + Math.floor(m / 150) + Math.floor(S.coins / 8)), points = Math.min(120, 6 + Math.floor(m / 30));
    if (won) { coins += 5; points += 15; }
    ctx.finish({
      won: won,
      title: won ? C.t('rcWin') : S.won ? C.t('rcLose') : S.cause === 'fuel' ? C.t('emptyT') : S.cause === 'stuck' ? C.t('stuckT') : C.t('crashT'),
      timeMs: Date.now() - startedAt, coins: coins, points: points,
      lines: [
        { label: C.t('rcYou'), value: mine !== null ? raceTime(mine) : C.t('distM', { n: C.num(m) }) },
        { label: C.t('rcBotTime') + ' · ' + C.t(raceLv), value: bots !== null ? raceTime(bots) : C.t('distM', { n: C.num(E.metres(B)) }) },
        { label: C.t('coinsGot'), value: C.num(S.coins) }
      ],
      shareText: 'چوگان · تپه‌سوار\nمسابقه · ' + (mine !== null ? (mine.toFixed(1) + ' ثانیه') : (m + ' متر')),
      againLabel: C.t('newRun'),
      onAgain: function () { newRun(); }
    });
  }

  function finish() {
    if (B) { finishRace(); return; }
    ctx.clearSave();
    var m = E.metres(S), won = S.won;
    var coins = Math.min(40, 2 + Math.floor(m / 150) + Math.floor(S.coins / 8)), points = Math.min(120, 6 + Math.floor(m / 30)), note = null;
    if (m >= 1000 && !dailyDate) C.achievements.unlock('hr-1k');
    if (won) C.achievements.unlock('hr-daily');
    if (dailyDate) {
      if (won) {
        coins += 8; points += 25;
        if (!C.stats.daily('hillrider', dailyDate, { label: C.t('distM', { n: C.num(FINISH) }), win: true, tries: tries })) { coins = Math.round(coins * 0.2); points = Math.round(points * 0.2); }
      } else { coins = 1; points = 2; }
    } else {
      // a new personal best pays +5 coins for every full 1000 m it newly reaches (#809)
      var prevBest = C.stats.getBest('hillrider', 'metres') || 0;
      if (C.stats.best('hillrider', 'metres', m)) note = C.t('bestM', { n: C.num(m) });
      coins += C.stats.milestoneCoins(prevBest, m, 1000);
    }
    var bestEver = C.stats.getBest('hillrider', 'metres');

        actions: [{ label: C.t('cancel') }, { label: C.t('buyCarT', { car: carName(id) }), kind: 'primary', onClick: function () {
          // the price is taken once, and only a car not yet owned is paid for
          if (owned.indexOf(id) >= 0 || !C.coins.spend(price)) return;
          owned.push(id); ctx.store.set('cars', owned.slice());
          C.feedback('good');
          C.ui.toast({ icon: 'coin', title: C.t('carBought', { car: carName(id) }) });
          pick(id);
        } }]
      });
    }
    render();
    return el('div', { class: 'ch-item hr-scene' }, [el('div', { class: 'ch-item__label', text: C.t('carT') }), list]);
  }
  // a small picture of a car for the garage, drawn with the road's own drawing
  function carPreview(id) {
    var w = 76, h = 46, dpr = Math.min(2, window.devicePixelRatio || 1);
    var c = el('canvas', { class: 'hr-car__pic', width: Math.round(w * dpr), height: Math.round(h * dpr), 'aria-hidden': 'true' });
    c.style.width = w + 'px'; c.style.height = h + 'px';
    var g = c.getContext('2d'), k = 20;
    g.setTransform(dpr * k, 0, 0, -dpr * k, dpr * w / 2, dpr * (h - 6));
    var pose = { x: 0, y: 0.95, a: 0, wh: [{ x: -1.05, y: 0.42, rot: 0 }, { x: 1.05, y: 0.42, rot: 0 }] };
    drawCar(g, basePalette(), pose, id);
    return c;
  }
  function gripText(sc) { return sc === 'rain' ? C.t('gripWet') : sc === 'snow' ? C.t('gripSnow') : sc === 'night' ? C.t('gripNight') : C.t('gripSun'); }
  // The speed dial's unit and the scene live behind the gear, never in the help (#777, #805)
  function showSettings() {
    var seg = C.ui.segmented([{ value: 'kmh', label: C.t('optKmh') }, { value: 'mph', label: C.t('optMph') }, { value: 'off', label: C.t('spdOff') }], prefs.speed, function (v) {
      prefs.speed = v === 'mph' || v === 'off' ? v : 'kmh';
      ctx.store.set('prefs', prefs);
      draw();
    });
    var gripEl = el('div', { class: 'ch-dim hr-gripnote', text: dailyDate ? C.t('dailySun') : gripText(prefs.scene) });
    // a new scene starts a new run: grip that changed under a running car would be unfair
    var scSeg = C.ui.segmented([{ value: 'sun', label: C.t('scSun') }, { value: 'snow', label: C.t('scSnow') }, { value: 'rain', label: C.t('scRain') }, { value: 'night', label: C.t('scNight') }], prefs.scene, function (v) {
      prefs.scene = E.sceneOf(v);
      ctx.store.set('prefs', prefs);
      if (!dailyDate) { gripEl.textContent = gripText(prefs.scene); ctx.clearSave(); newRun(); }
    });
    // a free ride or a race (#807); the bot's level shows only for a race. Either change
    // starts a new run, like the weather: a bot that changed mid-race would be no race
    var lvRow = el('div', { class: 'ch-item hr-scene', hidden: prefs.mode !== 'race' }, [el('div', { class: 'ch-item__label', text: C.t('rcBot') }),
      C.ui.segmented([{ value: 'easy', label: C.t('easy') }, { value: 'medium', label: C.t('medium') }, { value: 'hard', label: C.t('hard') }], prefs.level, function (v) {
        prefs.level = E.levelOf(v);
        ctx.store.set('prefs', prefs);
        if (!dailyDate) { ctx.clearSave(); newRun(); }
      })]);
    var modeSeg = C.ui.segmented([{ value: 'solo', label: C.t('rcSolo') }, { value: 'race', label: C.t('rcRace') }], prefs.mode, function (v) {
      prefs.mode = v === 'race' ? 'race' : 'solo';
      ctx.store.set('prefs', prefs);
      lvRow.hidden = prefs.mode !== 'race';
      if (!dailyDate) { ctx.clearSave(); newRun(); }
    });
    var modeRow = el('div', { class: 'ch-item hr-scene' }, [el('div', { class: 'ch-item__label', text: C.t('rcT') }), modeSeg].concat(dailyDate ? [el('div', { class: 'ch-dim hr-gripnote', text: C.t('rcDaily') })] : []));
    C.ui.modal({
      title: C.t('settings'),
      body: [el('div', { class: 'ch-list' }, [
        modeRow,
        lvRow,
        garage(),
        el('div', { class: 'ch-item hr-scene' }, [el('div', { class: 'ch-item__label', text: C.t('scT') }), scSeg, gripEl]),
        el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: C.t('spdT') }), seg])])],
      actions: [{ label: C.t('done'), kind: 'primary' }]
    });
  }

  /* -------------------------------------------------------------- input */

  // The whole game area is the two pedals, split at the middle of the road: on a phone
  // on its side the road is narrower than the screen, and its empty sides still drive.
  var touches = {};
  function side(e) { var r = cv.getBoundingClientRect(); return e.clientX < r.left + r.width / 2 ? 'l' : 'r'; }
  function syncHeld() { held.l = held.r = false; for (var id in touches) held[touches[id]] = true; }
  wrap.addEventListener('pointerdown', function (e) {
    if (!S || (e.target.closest && e.target.closest('button'))) return;
    e.preventDefault();
    if (ended) return;
    go();
    touches[e.pointerId] = side(e); syncHeld();
    try { wrap.setPointerCapture(e.pointerId); } catch (er) { /* old browsers */ }
  });
  wrap.addEventListener('pointermove', function (e) { if (touches[e.pointerId]) { touches[e.pointerId] = side(e); syncHeld(); } });
  function lift(e) { delete touches[e.pointerId]; syncHeld(); }
  wrap.addEventListener('pointerup', lift);
  wrap.addEventListener('pointercancel', lift);
  wrap.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  wrap.style.touchAction = 'none';

  function isGas(e) { return e.key === 'ArrowRight' || e.key === 'ArrowUp' || C.keyIs(e, 'd') || C.keyIs(e, 'w'); }
  function isBrake(e) { return e.key === 'ArrowLeft' || e.key === 'ArrowDown' || C.keyIs(e, 'a') || C.keyIs(e, 's'); }
  window.addEventListener('keydown', function (e) {
    if (document.querySelector('.ch-scrim')) return;
    if (isGas(e)) { go(); keys.g = true; e.preventDefault(); }
    else if (isBrake(e)) { go(); keys.b = true; e.preventDefault(); }
    else if (e.key === ' ') { go(); e.preventDefault(); }
    else if (C.keyIs(e, 'r')) { newRun(); e.preventDefault(); }
  });
  window.addEventListener('keyup', function (e) {
    if (isGas(e)) keys.g = false;
    else if (isBrake(e)) keys.b = false;
  });
  // a run waits while the app is away, and no pedal is held when it comes back
  C.onPause(function () { paused = true; keys.g = keys.b = false; touches = {}; syncHeld(); ctx.save(); });
  C.onResume(function () { paused = false; last = 0; kick(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { last = 0; kick(); } });
  if (window.ResizeObserver) new ResizeObserver(function () { readRowOver(); draw(); }).observe(box);
  readRowOver();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fontFam = ''; draw(); });
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw); } catch (er) { /* old WebViews */ } }

  /* --------------------------------------------------------------- help */

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('p', { class: 'ch-dim', text: C.t('buyRule', { n: C.num(E.FUEL_PRICE) }) }),
        el('p', { class: 'ch-dim', text: C.t('sceneRule') }),
        el('p', { class: 'ch-dim', text: C.t('carRule') }),
        el('p', { class: 'ch-dim', text: C.t('rcRule') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [kb('→ ↑ / D W', C.t('kGas')), kb('← ↓ / A S', C.t('kBrake')), kb('R', C.t('kAgain'))])
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  function tArt(kind) {
    var s = '<svg viewBox="0 0 200 110" width="100%" direction="ltr"><rect width="200" height="110" rx="10" fill="#A9DCF2"/>';
    var hill = '<path d="M0 84 Q 50 64 100 80 T 200 70 V110 H0Z" fill="#9A6B45"/><path d="M0 84 Q 50 64 100 80 T 200 70" fill="none" stroke="#3E9C3A" stroke-width="4"/>';
    var car = function (x, y, a) {
      return '<g transform="translate(' + x + ' ' + y + ') rotate(' + a + ')"><circle cx="-14" cy="0" r="6" fill="#1A1A1C"/><circle cx="14" cy="0" r="6" fill="#1A1A1C"/>' +
        '<path d="M-21 -6 H21 L20 -10 L9 -13 L-6 -10 L-20 -12Z" fill="#D94F2B"/><circle cx="-2" cy="-19" r="4.5" fill="#E8B21A"/></g>';
    };
    if (kind === 1) s += hill + car(100, 72, -4) + '<rect x="6" y="40" width="22" height="30" rx="5" fill="rgba(31,26,23,.25)"/><rect x="172" y="40" width="22" height="30" rx="5" fill="rgba(31,26,23,.25)"/>' +
      '<text x="17" y="34" font-size="12" text-anchor="middle" fill="#1F1A17">◀</text><text x="183" y="34" font-size="12" text-anchor="middle" fill="#1F1A17">▶</text>';
    if (kind === 2) s += hill + car(100, 36, -30) + '<path d="M70 40 A 32 32 0 0 1 120 12" fill="none" stroke="' + ACCENT + '" stroke-width="2.5" stroke-dasharray="4 4"/><path d="M118 6 l6 7 -9 2z" fill="' + ACCENT + '"/>';
    if (kind === 3) s += hill + car(56, 70, -6) + '<rect x="126" y="54" width="16" height="20" rx="3" fill="#D8382C"/><rect x="134" y="50" width="6" height="4" fill="#8E231B"/>' +
      '<rect x="10" y="10" width="70" height="9" rx="4.5" fill="#E9E2D6"/><rect x="10" y="10" width="18" height="9" rx="4.5" fill="#D8382C"/>';
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: tArt(1) },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: tArt(2) },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: tArt(3) }
  ];

  /* -------------------------------------------------------------- start */

  // A run in progress is saved when the app goes away, and comes back waiting for a tap,
  // so the car is never dropped mid-jump; the daily road has its own slot (#132)
  ctx.autosave(function () {
    if (!S || S.over || S.won || ended || S.t < 1) return { inProgress: false };
    // a race keeps the bot's car and level too (#807)
    return { s: E.snapshot(S), b: B ? E.snapshot(B) : null, lv: raceLv, tries: tries, daily: dailyDate || null, elapsed: Date.now() - startedAt };
  });
  function resumeRun(sv) {
    var R = E.restore(sv.s), RB = sv.b && !sv.daily ? E.restore(sv.b) : null;
    if (!R || (sv.b && !sv.daily && !RB)) return false;
    S = R; B = RB; prevB = null; race = !!RB; raceLv = E.levelOf(sv.lv); tries = sv.tries || 1; startedAt = Date.now() - (sv.elapsed || 0);
    ended = false; waiting = true; resumed = true; flipPending = false; acc = 0; last = 0; prev = null; spd = Math.abs(S.vx);
    cam.x = S.x; cam.y = S.y;
    renderTop(); renderStatus(); draw(); kick();
    return true;
  }
  var saved = ctx.loadSave();
  if (dailyDate) {
    if (!(saved && saved.s && saved.daily === dailyDate && resumeRun(saved))) newRun();
    if (C.stats.dailyDone('hillrider', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).hillrider;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
    }
  } else if (!(saved && saved.s && !saved.daily && resumeRun(saved))) {
    newRun();
  }
  ctx.tutorialIfNew(TUT);
})();
</script>
</body>
</html>
