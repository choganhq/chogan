  /* left is the brake and right the gas in every language, like the pedals of a car */

<script>
/* ==== ENGINE START ==== */
function HillriderEngineFactory() {
  'use strict';

  // Metres and seconds, y up. Fixed steps of 1/60 s, each cut into eight smaller ones so
  // the springs between the body and the wheels stay steady; the same inputs give the
  // same drive on every device.
  var DT = 1 / 60, SUB = 8, H = DT / SUB, G = 9.8;
  // the body: a box with the driver's head on top, wheels hung from two points under it
  var M = 1, INERTIA = 0.9, WM = 0.2, WROT = 0.1, WR = 0.42;
  var ANCH = [[-1.05, -0.42], [1.05, -0.42]];
  var BODY = [[-1.45, -0.2], [1.45, -0.2], [-1.35, 0.3], [1.35, 0.3], [0.6, 0.35]];
  var HEAD = [-0.15, 0.95], HEAD_R = 0.27;
  var KU = 600, CU = 14, KV = 55, CV = 3.2, STOP = 0.32;
  var MU = 1.15, VMAX = 15, VREV = 6, MOTOR = 28, BRAKE = 40, REACT = 0.55, AIR = 5.5, WMAX = 7;
  // a full tank lasts 30 s of gas, or 110 s rolling
  var BURN_GAS = 1 / 30, BURN_IDLE = 1 / 110;
  var START = 4, STEP = 1, ORIGIN = 40;

  function hash(seed, i) {
    var h = Math.imul((seed >>> 0) ^ Math.imul(i | 0, 0x9E3779B1), 0x85EBCA6B);
    h ^= h >>> 13; h = Math.imul(h, 0xC2B2AE35); h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function smooth(t) { return t * t * (3 - 2 * t); }

  /* ------------------------------------------------------------ terrain */

  // How hard the hills are at a distance: 0 at the start, 1 from 2,000 m on
  function hard(x) { return clamp(x / 2000, 0, 1); }
  function noise(seed, o, t) {
    var i = Math.floor(t), f = t - i, a = hash(seed + o * 7919, i) * 2 - 1, b = hash(seed + o * 7919, i + 1) * 2 - 1;
    return a + (b - a) * smooth(f);
  }
  // the raw hills: three sizes of wave that grow with the distance, flat at the start
  function raw(seed, x) {
    var d = hard(x), ramp = smooth(clamp((x - 12) / 60, 0, 1));
    return ramp * ((4 + 12 * d) * noise(seed, 1, x / 46) + (1.6 + 4.5 * d) * noise(seed, 2, x / 16) + (0.2 + 0.7 * d) * noise(seed, 3, x / 6));
  }
  // The ground is laid a metre at a time, each metre at most so steep (the raw waves can
  // stack into a wall no car climbs), then softened over five points; between points it
  // is a smooth curve, so a wheel never meets a corner.
  function maxSlope(x) { return 0.6 + 0.5 * hard(x); }
  function grow(S, i) {
    var T = S.ter;
    while (T.c.length <= i + 3) {
      var k = T.c.length, x = k - ORIGIN;
      if (x <= 0) { T.c.push(x < -14 ? 0.35 * (-x - 14) * (-x - 14) : 0); continue; }
      var prev = T.c[k - 1], m = maxSlope(x);
      T.c.push(prev + clamp(raw(S.seed, x) - prev, -m, m));
    }
    while (T.p.length <= i + 1) {
      var j = T.p.length, s = 0, n = 0;
      for (var q = j - 2; q <= j + 2; q++) if (q >= 0) { s += T.c[q]; n++; }
      T.p.push(s / n);
    }
  }
  function pt(S, j) { if (j < 0) return S.ter.c[0] + 0.35 * j * j; grow(S, j); return S.ter.p[j]; }
  // height and slope at x, on a Catmull-Rom curve through the points
  function ground(S, x) {
    var u = (x + ORIGIN) / STEP, j = Math.floor(u), t = u - j;
    var p0 = pt(S, j - 1), p1 = pt(S, j), p2 = pt(S, j + 1), p3 = pt(S, j + 2);
    var a = -0.5 * p0 + 1.5 * p1 - 1.5 * p2 + 0.5 * p3, b = p0 - 2.5 * p1 + 2 * p2 - 0.5 * p3, c = -0.5 * p0 + 0.5 * p2;
    return { h: ((a * t + b) * t + c) * t + p1, s: ((3 * a * t + 2 * b) * t + c) / STEP };
  }
  function height(S, x) { return ground(S, x).h; }

  /* ----------------------------------------------------------- pickups */

  // Fuel cans: the first at about 110 m, then the gap grows from about 160 m to 420 m with the distance; coins come in rows
  // of five between them. Both follow from the seed, so only what was taken is saved.
  function fuelAt(S, n) {
    var F = S.fx;
    while (F.length <= n) {
      var last = F.length ? F[F.length - 1] : 0;
      F.push(Math.round(last + (F.length ? 160 + 260 * hard(last) : 110) + (hash(S.seed + 31, F.length) - 0.5) * 40));
    }
    return F[n];
  }
  function coinRow(S, n) { return Math.round(45 + n * 64 + hash(S.seed + 57, n) * 24); }
  // what lies between x0 and x1, for the drawing and the pickup test
  function pickups(S, x0, x1) {
    var out = [], n = 0, x;
    while ((x = fuelAt(S, n)) < x1 + 2) { if (x >= x0 - 2 && !S.got['f' + n]) out.push({ kind: 'fuel', id: 'f' + n, x: x, y: height(S, x) + 0.55 }); n++; }
    var r0 = Math.max(0, Math.floor((x0 - 70) / 64));
    for (var r = r0; (x = coinRow(S, r)) < x1 + 2; r++) {
      for (var c = 0; c < 5; c++) {
        var cx = x + c * 1.6, id = 'c' + (r * 5 + c);
        if (cx < x0 - 2 || cx > x1 + 2 || S.got[id]) continue;
        // a coin never sits on a can
        if (Math.abs(cx - fuelAt(S, nearFuel(S, cx))) < 3) continue;
        out.push({ kind: 'coin', id: id, x: cx, y: height(S, cx) + 0.9 + 0.35 * Math.sin(c / 4 * Math.PI) });
      }
    }
    return out;
  }
  function nearFuel(S, x) { var n = 0; while (fuelAt(S, n + 1) < x) n++; return Math.abs(fuelAt(S, n + 1) - x) < Math.abs(fuelAt(S, n) - x) ? n + 1 : n; }

  /* -------------------------------------------------------------- game */

  // seed: whole number; finish: metres for the daily course, 0 for an endless run
  function newGame(seed, finish) {
    var S = { seed: seed >>> 0, finish: finish || 0, ter: { c: [], p: [] }, fx: [], got: {}, t: 0,
      x: START, y: 0, a: 0, vx: 0, vy: 0, w: 0,
      wh: [], fuel: 1, coins: 0, cans: 0, best: 0, air: 0, airBest: 0, flips: 0, spin: 0, still: 0,
      over: false, won: false, cause: '', touch: [false, false] };
    var g = height(S, START);
    S.y = g + WR + 0.52;
    for (var k = 0; k < 2; k++) { var A = world(S, ANCH[k]); S.wh.push({ x: A[0], y: A[1], vx: 0, vy: 0, sp: 0, rot: 0 }); }
    // settle on the springs before the first frame
    for (var i = 0; i < 90; i++) step(S, 0, true);
    S.t = 0; S.best = 0; S.fuel = 1;
    return S;
  }
  function world(S, p) {
    var c = Math.cos(S.a), s = Math.sin(S.a);
    return [S.x + p[0] * c - p[1] * s, S.y + p[0] * s + p[1] * c];
  }
  function headPos(S) { return world(S, HEAD); }

  // A point's depth into the ground along the ground's normal: positive is inside
  function depth(S, x, y, r) {
    var g = ground(S, x), n = 1 / Math.sqrt(1 + g.s * g.s);
    return { pen: r - (y - g.h) * n, nx: -g.s * n, ny: n };
  }

  // One step. ctl: 1 gas, -1 brake (and reverse), 0 neither. Returns the step's events.
  function step(S, ctl, settling) {
    if (S.over || S.won) return [];
    var ev = [], gas = ctl > 0 && S.fuel > 0, brake = ctl < 0;
    var a0 = S.a;
    for (var sub = 0; sub < SUB; sub++) substep(S, gas, brake, ev);
    if (settling) return ev;
    S.t += DT;
    S.fuel = Math.max(0, S.fuel - DT * (gas ? BURN_GAS : BURN_IDLE));
    if (S.fuel === 0 && S.fuelOut !== true) { S.fuelOut = true; ev.push('empty'); }
    // whole turns in the air: an air-time trick
    var onGround = S.touch[0] || S.touch[1];
    if (!onGround) {
      S.air += DT;
      var da = S.a - a0; S.spin += da;
      if (Math.abs(S.spin) >= Math.PI * 2 - 0.3) { S.flips++; S.spin = 0; ev.push('flip'); }
    } else {
      if (S.air > 0.6) ev.push('land');
      if (S.air > S.airBest) S.airBest = S.air;
      S.air = 0; S.spin = 0;
    }
    var d = S.x - START;
    if (d > S.best) S.best = d;
    // pickups the car passes through
    var near = pickups(S, S.x - 2.2, S.x + 2.2);
    for (var i = 0; i < near.length; i++) {
      var p = near[i];
      if (Math.abs(p.x - S.x) < 1.9 && Math.abs(p.y - (S.y + 0.2)) < 1.6) {
        S.got[p.id] = 1;
        if (p.kind === 'fuel') { S.fuel = 1; S.cans++; S.fuelOut = false; ev.push('fuel'); }
        else { S.coins++; ev.push('coin'); }
      }
    }
    // the head touching the ground ends the run
    var hp = headPos(S);
    if (depth(S, hp[0], hp[1], HEAD_R).pen > 0) { S.over = true; S.cause = 'head'; ev.push('crash'); return ev; }
    // standing still out of fuel, or stuck on a side, ends it too
    var speed = Math.hypot(S.vx, S.vy);
    if ((S.fuel === 0 || Math.cos(S.a) < 0.15) && speed < 0.5) S.still += DT; else S.still = 0;
    if (S.still > 1.5) { S.over = true; S.cause = S.fuel === 0 ? 'fuel' : 'stuck'; ev.push(S.cause === 'fuel' ? 'stall' : 'crash'); return ev; }
    if (S.finish && S.best >= S.finish) { S.won = true; ev.push('finish'); }
    return ev;
  }

  function substep(S, gas, brake, ev) {
    var c = Math.cos(S.a), s = Math.sin(S.a), fx = 0, fy = -M * G, tq = 0, touched = [false, false];
    for (var k = 0; k < 2; k++) {
      var W = S.wh[k], lx = ANCH[k][0] * c - ANCH[k][1] * s, ly = ANCH[k][0] * s + ANCH[k][1] * c;
      var ax = S.x + lx, ay = S.y + ly, avx = S.vx - S.w * ly, avy = S.vy + S.w * lx;
      var dx = ax - W.x, dy = ay - W.y, dvx = avx - W.vx, dvy = avy - W.vy;
      // stiff along the body, soft across it: the suspension
      var du = dx * c + dy * s, dv = -dx * s + dy * c, vu = dvx * c + dvy * s, vv = -dvx * s + dvy * c;
      var Fu = KU * du + CU * vu, Fv = KV * dv + CV * vv;
      // the wheel pushed up into the body hits a stop
      if (dv < -STOP) Fv += 900 * (dv + STOP) + 20 * vv;
      var Fx = Fu * c - Fv * s, Fy = Fu * s + Fv * c;
      W.vx += Fx / WM * H; W.vy += (Fy / WM - G) * H;
      fx -= Fx; fy -= Fy; tq -= lx * Fy - ly * Fx;
      // the motor turns both wheels; its push turns the body the other way
      var sp0 = W.sp;
      if (gas) { if (W.sp < VMAX) W.sp = Math.min(VMAX, W.sp + MOTOR * H); }
      else if (brake) { if (W.sp > 0.5) W.sp = Math.max(0, W.sp - BRAKE * H); else if (W.sp > -VREV) W.sp = Math.max(-VREV, W.sp - MOTOR * 0.6 * H); }
      else W.sp *= 1 - 0.15 * H;
      if (gas || brake) tq += REACT * WROT * (W.sp - sp0) / H * WR;
    }
    S.vx += fx / M * H; S.vy += fy / M * H; S.w += tq / INERTIA * H;
    for (var k2 = 0; k2 < 2; k2++) {
      var V = S.wh[k2];
      V.x += V.vx * H; V.y += V.vy * H;
      var D = depth(S, V.x, V.y, WR);
      if (D.pen > 0) {
        touched[k2] = true;
        V.x += D.nx * D.pen; V.y += D.ny * D.pen;
        var vn = V.vx * D.nx + V.vy * D.ny, jn = 0;
        if (vn < 0) { jn = -vn * WM; V.vx -= vn * D.nx; V.vy -= vn * D.ny; }
        // grip: the wheel's turning and its sliding meet, up to what the load allows
        jn += WM * G * D.ny * H * 0.5;
        var tx = D.ny, ty = -D.nx, vt = V.vx * tx + V.vy * ty;
        var slip = V.sp - vt, meff = 1 / (1 / WM + 1 / WROT), jt = clamp(slip * meff, -MU * jn, MU * jn);
        V.vx += jt / WM * tx; V.vy += jt / WM * ty; V.sp -= jt / WROT;
      }
      V.rot -= V.sp * H / WR;
    }
    S.touch = touched;
    if (!touched[0] && !touched[1]) {
      if (gas) S.w += AIR * H; else if (brake) S.w -= AIR * H;
    }
    S.w = clamp(S.w, -WMAX, WMAX);
    S.x += S.vx * H; S.y += S.vy * H; S.a += S.w * H;
    // the body's corners slide on the ground rather than through it
    for (var b = 0; b < BODY.length; b++) {
      var P = world(S, BODY[b]), Q = depth(S, P[0], P[1], 0);
      if (Q.pen <= 0) continue;
      var rx = P[0] - S.x, ry = P[1] - S.y;
      S.x += Q.nx * Q.pen; S.y += Q.ny * Q.pen;
      var pvx = S.vx - S.w * ry, pvy = S.vy + S.w * rx, pn = pvx * Q.nx + pvy * Q.ny;
      if (pn >= 0) continue;
      var rn = rx * Q.ny - ry * Q.nx, j = -pn / (1 / M + rn * rn / INERTIA);
      var tX = Q.ny, tY = -Q.nx, pt2 = pvx * tX + pvy * tY, rt = rx * tY - ry * tX, jt2 = clamp(-pt2 / (1 / M + rt * rt / INERTIA), -0.5 * j, 0.5 * j);
      var ix = Q.nx * j + tX * jt2, iy = Q.ny * j + tY * jt2;
      S.vx += ix / M; S.vy += iy / M; S.w += (rx * iy - ry * ix) / INERTIA;
    }
  }

  var KEEP = ['x', 'y', 'a', 'vx', 'vy', 'w', 'fuel', 'coins', 'cans', 'best', 't', 'air', 'airBest', 'flips', 'spin', 'still', 'finish', 'seed'];
  function snapshot(S) {
    var o = { wh: S.wh.map(function (W) { return { x: W.x, y: W.y, vx: W.vx, vy: W.vy, sp: W.sp, rot: W.rot }; }), got: Object.keys(S.got), fuelOut: !!S.fuelOut, touch: S.touch.slice() };
    KEEP.forEach(function (k) { o[k] = S[k]; });
    return o;
  }
  function restore(v) {
    if (!v || !Array.isArray(v.wh) || v.wh.length !== 2 || !Array.isArray(v.got) || KEEP.some(function (k) { return typeof v[k] !== 'number' || !isFinite(v[k]); })) return null;
    if (v.fuel < 0 || v.fuel > 1 || v.seed < 0 || v.seed > 4294967295 || v.finish < 0) return null;
    var S = { ter: { c: [], p: [] }, fx: [], got: {}, over: false, won: false, cause: '', fuelOut: !!v.fuelOut, touch: Array.isArray(v.touch) ? [!!v.touch[0], !!v.touch[1]] : [false, false] };
    KEEP.forEach(function (k) { S[k] = v[k]; });
    S.wh = v.wh.map(function (W) { return { x: +W.x, y: +W.y, vx: +W.vx || 0, vy: +W.vy || 0, sp: +W.sp || 0, rot: +W.rot || 0 }; });
    if (S.wh.some(function (W) { return !isFinite(W.x) || !isFinite(W.y); })) return null;
    v.got.forEach(function (id) { if (/^[fc]\d+$/.test(id)) S.got[id] = 1; });
    return S;
  }

  function metres(S) { return Math.max(0, Math.floor(S.best)); }

  // The speed on the dial (#777). The engine is in real metres and seconds (the car is
  // 2.9 m long and the distance badge counts the same metres), so the scale is fixed:
  // 1 m/s is 3.6 km/h or 3600 / 1609.344 mph. Only the horizontal speed counts, backwards
  // too; 'off' or an unknown unit gives null, so nothing is drawn.
  var KMH = 3.6, MPH = 3600 / 1609.344;
  function speedOf(vx, unit) {
    if (unit !== 'kmh' && unit !== 'mph') return null;
    var v = Math.abs(+vx) || 0;
    return Math.round(v * (unit === 'mph' ? MPH : KMH));
  }

  /* A steady driver for the tests, the proof that a course can be driven: gas, unless the
     nose is too far up for the ground under it; in the air, it turns the car to meet the
     ground it will land on. */
  function botControl(S) {
    var onGround = S.touch[0] || S.touch[1];
    var ahead = ground(S, S.x + 1.5), slopeA = Math.atan(ahead.s), rel = S.a - slopeA;
    if (!onGround) {
      var land = Math.atan(ground(S, S.x + S.vx * 0.4).s);
      if (S.a - land > 0.2) return -1;
      if (S.a - land < -0.25) return 1;
      return 0;
    }
    if (rel > 0.55) return S.w > 0 ? -1 : 0;
    if (rel > 0.4 && S.w > 0.6) return 0;
    var speed = Math.hypot(S.vx, S.vy);
    // a long way down: no gas, so a crest doesn't throw it into a spin
    if (ahead.s < -0.45 && speed > 11) return 0;
    return 1;
  }

  /* The daily course is one the steady driver above finishes: from the day's seed, the
     first of the next few seeds whose hills it drives to the flag. A course nobody can
     finish would cost every player the day's star. */
  function courseSeed(seed, finish, tries) {
    for (var k = 0; k < (tries || 12); k++) {
      var s = (seed + k * 7919) >>> 0, S = newGame(s, finish);
      while (!S.over && !S.won && S.t < 300) step(S, botControl(S));
      if (S.won) return s;
    }
    return seed >>> 0;
  }

  return { DT: DT, courseSeed: courseSeed, WR: WR, START: START, HEAD: HEAD, HEAD_R: HEAD_R, ANCH: ANCH, newGame: newGame, step: step, ground: ground, height: height, pickups: pickups, fuelAt: fuelAt, world: world, headPos: headPos, snapshot: snapshot, restore: restore, metres: metres, speedOf: speedOf, botControl: botControl, hard: hard, maxSlope: maxSlope };
}
if (typeof module !== 'undefined' && module.exports) module.exports = HillriderEngineFactory;
/* ==== ENGINE END ==== */
</script>
<script>
(function () {

  var C = window.Chogan, el = C.el;
  var E = HillriderEngineFactory();
  var ACCENT = '#0C5700';
  // the daily course's flag, in metres from the start
  var FINISH = 1000;

  C.boot({});
  var ctx = C.game({
    id: 'hillrider',
    name: { fa: 'تپه‌سوار', en: 'Hillrider', zh: '山丘车手', de: 'Hügelflitzer', es: 'Trepacolinas', pl: 'Jeździec wzgórz' },
    accent: ACCENT,
    mood: 'dots',
    strings: {

        howTo: 'راست: گاز · چپ: ترمز و دنده‌عقب', crashT: 'سرت به زمین خورد!', emptyT: 'بنزین تمام شد!', stuckT: 'ماشین گیر کرد!', flagT: 'به پرچم رسیدی!',
        distance: 'مسافت', best: 'بهترین', tries: 'تلاش‌ها', coinsGot: 'سکه‌های جاده', kGas: 'گاز', kBrake: 'ترمز و دنده‌عقب', kAgain: 'از نو',

    g.lineTo(x1 + stepX, yLow);
    g.closePath();
    g.fillStyle = P.dirt; g.fill();
    // a darker layer under the grass, then the grass on top
    g.beginPath();
    for (x = x0; x <= x1 + stepX; x += stepX) { var h = E.height(S, x) - 0.55; if (x === x0) g.moveTo(x, h); else g.lineTo(x, h); }
    g.lineWidth = 0.5; g.strokeStyle = P.dirtDk; g.stroke();
    g.beginPath();
    for (x = x0; x <= x1 + stepX; x += stepX) { var hh = E.height(S, x) - 0.1; if (x === x0) g.moveTo(x, hh); else g.lineTo(x, hh); }
    g.lineWidth = 0.32; g.lineJoin = 'round'; g.strokeStyle = P.grass; g.stroke();
    g.lineWidth = 0.08; g.strokeStyle = P.grassLt; g.stroke();

    // a post every 100 m, and the flag of the daily road
    var posts = [];
    for (var pm = Math.ceil((x0 - E.START) / 100) * 100; pm + E.START <= x1; pm += 100) if (pm > 0 && (!S.finish || pm < S.finish)) posts.push(pm);
    posts.forEach(function (m) {
      var px = m + E.START, py = E.height(S, px);
      g.fillStyle = P.post; g.fillRect(px - 0.05, py, 0.1, 1.6);
      g.fillStyle = P.gauge; g.fillRect(px - 0.6, py + 1.3, 1.2, 0.55);
    });
    if (S.finish && S.finish + E.START >= x0 && S.finish + E.START <= x1 + 2) {
      var fx = S.finish + E.START, fy = E.height(S, fx);
      g.fillStyle = P.post; g.fillRect(fx - 0.06, fy, 0.12, 3.2);
      for (var r = 0; r < 3; r++) for (var c = 0; c < 4; c++) { g.fillStyle = (r + c) % 2 ? '#FFFFFF' : '#1A1A1A'; g.fillRect(fx + 0.06 + c * 0.35, fy + 2.15 + r * 0.35, 0.35, 0.35); }
    }

    E.pickups(S, x0, x1).forEach(function (p) {
      if (p.kind === 'fuel') {
        g.fillStyle = P.canDk; C.rrect(g, p.x - 0.33, p.y - 0.42, 0.66, 0.84, 0.1); g.fill();
        g.fillStyle = P.can; C.rrect(g, p.x - 0.27, p.y - 0.36, 0.54, 0.7, 0.08); g.fill();
        g.fillStyle = P.canDk; g.fillRect(p.x + 0.05, p.y + 0.42, 0.2, 0.14);
        g.strokeStyle = '#FFFFFF'; g.lineWidth = 0.07; g.beginPath(); g.moveTo(p.x - 0.15, p.y - 0.2); g.lineTo(p.x + 0.15, p.y + 0.2); g.moveTo(p.x + 0.15, p.y - 0.2); g.lineTo(p.x - 0.15, p.y + 0.2); g.stroke();
      } else {
        g.fillStyle = P.coinDk; g.beginPath(); g.arc(p.x, p.y, 0.26, 0, Math.PI * 2); g.fill();
        g.fillStyle = P.coin; g.beginPath(); g.arc(p.x, p.y, 0.2, 0, Math.PI * 2); g.fill();
      }
    });

    drawCar(g, P, V);

    // the dials on top, in screen pixels
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    hud(g, Z, P);
  }
  function backHills(g, Z, color, speed, base, amp, freq) {
    var off = cam.x * 30 * speed;
    g.beginPath(); g.moveTo(0, Z.h);
    for (var px = 0; px <= Z.w + 8; px += 8) {
      var t = (px + off) * freq;
      g.lineTo(px, base - amp * (0.6 * Math.sin(t) + 0.4 * Math.sin(t * 2.3 + 1.7)) + cam.y * speed * 2);
    }
    g.lineTo(Z.w, Z.h); g.closePath(); g.fillStyle = color; g.fill();
  }
  function drawCar(g, P, V) {
    // springs from the body to each wheel first, so the body covers their tops
    g.strokeStyle = P.cage; g.lineWidth = 0.1;
    for (var k = 0; k < 2; k++) { var pt = E.ANCH[k], c = Math.cos(V.a), sn = Math.sin(V.a); g.beginPath(); g.moveTo(V.x + pt[0] * c - pt[1] * sn, V.y + pt[0] * sn + pt[1] * c); g.lineTo(V.wh[k].x, V.wh[k].y); g.stroke(); }
    // Design B, "Buggy", of the mock the owner chose (#763). Only the drawing: the head is
    // drawn on the engine's head hitbox and the wheels where the physics put them.
    g.save();
    g.translate(V.x, V.y); g.rotate(V.a);
    g.lineCap = 'round'; g.lineJoin = 'round';
    // the tube cage behind the driver
    g.strokeStyle = P.cage; g.lineWidth = 0.08;
    g.beginPath(); g.moveTo(-1.2, 0.1); g.lineTo(-1.0, 1.0); g.lineTo(0, 1.2); g.lineTo(0.6, 0.5); g.stroke();
    g.beginPath(); g.moveTo(-1.0, 1.0); g.lineTo(-0.6, 0.1); g.stroke();
    driver(g, P);
    // the tub, a white stripe, the sill, the lamp and the exhaust
    g.fillStyle = P.body;
    g.beginPath(); g.moveTo(-1.4, -0.2); g.lineTo(1.45, -0.2); g.lineTo(1.5, 0.05); g.lineTo(1.1, 0.32); g.lineTo(0.5, 0.36); g.lineTo(0.2, 0.28); g.lineTo(-0.45, 0.22); g.lineTo(-1.1, 0.34); g.lineTo(-1.4, 0.2); g.closePath(); g.fill();
    g.fillStyle = P.stripe; g.fillRect(-1.0, -0.02, 1.9, 0.07);
    g.fillStyle = P.bodyDk; g.fillRect(-1.4, -0.2, 2.9, 0.1);
    g.fillStyle = P.lamp; g.beginPath(); g.arc(1.3, 0.14, 0.09, 0, Math.PI * 2); g.fill();
    g.fillStyle = P.exhaust; C.rrect(g, -1.58, -0.12, 0.2, 0.2, 0.05); g.fill();
    // the steering wheel in front of the hand
    g.strokeStyle = P.steer; g.lineWidth = 0.07; g.beginPath(); g.moveTo(0.42, 0.38); g.lineTo(0.36, 0.66); g.stroke();
    g.lineWidth = 0.04; g.beginPath(); g.moveTo(0.44, 0.36); g.lineTo(0.62, 0.34); g.stroke();
    g.restore();
    // big knobbly tyres; the tread turns with the wheel, so the motion shows
    for (var w = 0; w < 2; w++) {
      var W = V.wh[w];
      g.fillStyle = P.tyre; g.beginPath(); g.arc(W.x, W.y, E.WR, 0, Math.PI * 2); g.fill();
      g.save(); g.translate(W.x, W.y); g.rotate(W.rot);
      g.strokeStyle = P.tread; g.lineWidth = 0.06; g.setLineDash([0.1, 0.1]);
      g.beginPath(); g.arc(0, 0, E.WR - 0.03, 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
      g.fillStyle = P.hub; g.beginPath(); g.arc(0, 0, E.WR * 0.45, 0, Math.PI * 2); g.fill();
      g.strokeStyle = P.tread; g.lineWidth = 0.035; g.beginPath();
      for (var s = 0; s < 3; s++) { var an = s * Math.PI * 2 / 3; g.moveTo(0, 0); g.lineTo(Math.cos(an) * E.WR * 0.45, Math.sin(an) * E.WR * 0.45); }
      g.stroke();
      g.restore();
    }
  }
  // The driver, upright in the seat with a hand on the wheel, in the car's own frame
  function driver(g, P) {
    var hx = E.HEAD[0], hy = E.HEAD[1];
    // legs, mostly behind the tub
    g.strokeStyle = P.legs; g.lineWidth = 0.22; g.beginPath(); g.moveTo(-0.38, 0.3); g.lineTo(0.12, 0.42); g.lineTo(0.3, 0.2); g.stroke();
    // torso and neck
    g.strokeStyle = P.shirt; g.lineWidth = 0.46; g.beginPath(); g.moveTo(-0.36, 0.32); g.lineTo(-0.24, 0.62); g.stroke();
    g.strokeStyle = P.skinDk; g.lineWidth = 0.14; g.beginPath(); g.moveTo(-0.22, 0.62); g.lineTo(hx, hy - 0.2); g.stroke();
    // the head, on the hitbox
    g.fillStyle = P.skin; g.beginPath(); g.arc(hx, hy, E.HEAD_R, 0, Math.PI * 2); g.fill();
    g.fillStyle = P.skinDk; g.beginPath(); g.arc(hx + E.HEAD_R * 0.98, hy - 0.03, 0.045, 0, Math.PI * 2); g.fill();
    g.strokeStyle = P.mouth; g.lineWidth = 0.025; g.beginPath(); g.arc(hx + 0.1, hy - 0.1, 0.09, 0.3, 1.5); g.stroke();
    // a cap with its peak forward and a button on top
    g.fillStyle = P.cap; g.beginPath(); g.arc(hx, hy + 0.03, E.HEAD_R + 0.03, -0.05, Math.PI + 0.1); g.closePath(); g.fill();
    C.rrect(g, hx + 0.05, hy + 0.07, 0.36, 0.06, 0.03); g.fill();
    g.fillStyle = '#FFFFFF'; g.beginPath(); g.arc(hx + 0.02, hy + 0.2, 0.05, 0, Math.PI * 2); g.fill();
    // the scarf streams back and flutters with the speed (still when motion is reduced)
    var fl = C.ui.reduceMotion() ? 0 : 0.05 * Math.min(1, Math.abs(S.vx) / 8) * Math.sin(S.t * 14);
    g.strokeStyle = P.helmet; g.lineWidth = 0.1; g.beginPath(); g.moveTo(hx - 0.1, hy - 0.2); g.lineTo(hx - 0.4, hy - 0.16 - fl * 0.5); g.lineTo(hx - 0.72, hy - 0.05 + fl); g.stroke();
    g.lineWidth = 0.07; g.beginPath(); g.moveTo(hx - 0.1, hy - 0.22); g.lineTo(hx - 0.45, hy - 0.3 + fl * 0.5); g.lineTo(hx - 0.78, hy - 0.24 - fl); g.stroke();
    g.fillStyle = P.eye; g.beginPath(); g.ellipse(hx + 0.13, hy + 0.04, 0.035, 0.05, 0, 0, Math.PI * 2); g.fill();
    // the arm: shoulder, elbow, hand on the wheel
    g.strokeStyle = P.shirtDk; g.lineWidth = 0.17; g.beginPath(); g.moveTo(-0.2, 0.6); g.lineTo(0.08, 0.46); g.lineTo(0.38, 0.62); g.stroke();
    g.fillStyle = P.skin; g.beginPath(); g.arc(0.4, 0.64, 0.075, 0, Math.PI * 2); g.fill();
  }
  function hud(g, Z, P) {
    var u = Math.max(0.8, Math.min(1.4, Z.w / 420));
    // the tank, top left; it blinks when nearly empty
    var gx = 12 * u, gy = 12 * u, gw = 110 * u, gh = 12 * u;
    g.fillStyle = P.can; C.rrect(g, gx, gy - 2 * u, 12 * u, 16 * u, 3 * u); g.fill();
    g.fillStyle = P.gauge; C.rrect(g, gx + 18 * u, gy, gw, gh, gh / 2); g.fill();
    var f = S.fuel, low = f < 0.2, blink = low && !C.ui.reduceMotion() && Math.floor(S.t * 3) % 2 === 0;
    if (f > 0 && !blink) { g.fillStyle = low ? '#D8382C' : f < 0.45 ? '#E8A21A' : '#3E9C3A'; C.rrect(g, gx + 18 * u, gy, Math.max(gh, gw * f), gh, gh / 2); g.fill(); }
    // coins picked up, top right
    g.font = font(14 * u); g.textBaseline = 'middle'; g.textAlign = 'right';
    g.fillStyle = P.text; g.fillText(C.num(S.coins), Z.w - 12 * u, gy + gh / 2);
    var tw = g.measureText(C.num(S.coins)).width;
    g.fillStyle = P.coinDk; g.beginPath(); g.arc(Z.w - 22 * u - tw, gy + gh / 2, 8 * u, 0, Math.PI * 2); g.fill();
    g.fillStyle = P.coin; g.beginPath(); g.arc(Z.w - 22 * u - tw, gy + gh / 2, 6 * u, 0, Math.PI * 2); g.fill();
    if (S.finish && !S.won) {
      g.textAlign = 'center'; g.fillStyle = P.text; g.font = font(13 * u);
      g.fillText(C.t('flagM', { n: C.num(S.finish) }), Z.w / 2, gy + gh / 2);
    }
    // the pedals: brake on the left, gas on the right
    var c = control(), pw = 46 * u, ph = 62 * u, py = Z.h - ph - 12 * u;
    pedal(g, 12 * u, py, pw, ph, c < 0, false, P);
    pedal(g, Z.w - 12 * u - pw, py, pw, ph, c > 0, true, P);
    // the speed, between the pedals like a dashboard, on its own plate so it reads over
    // any ground (#777)
    var kmh = E.speedOf(spd, prefs.speed);
    if (kmh !== null) {
      var unit = C.t(prefs.speed === 'mph' ? 'spdMph' : 'spdKmh'), num = C.num(kmh);
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = font(10 * u); var uw = g.measureText(unit).width;
      g.font = font(22 * u); var nw = g.measureText(num).width;
      var sw = Math.max(64 * u, uw + 20 * u, nw + 20 * u), sh = 46 * u, sx = Z.w / 2 - sw / 2, sy = Z.h - sh - 12 * u;
      g.fillStyle = P.gauge; g.globalAlpha = 0.88; C.rrect(g, sx, sy, sw, sh, 12 * u); g.fill(); g.globalAlpha = 1;
      g.fillStyle = P.text; g.fillText(num, Z.w / 2, sy + sh * 0.4);
      g.font = font(10 * u); g.fillText(unit, Z.w / 2, sy + sh * 0.78);
    }
  }
  function pedal(g, x, y, w, h, on, gas, P) {
    g.fillStyle = P.pedal + (on ? '0.55)' : '0.22)');
    C.rrect(g, x, y, w, h, 10); g.fill();
    g.strokeStyle = P.pedal + (on ? '0.9)' : '0.5)'); g.lineWidth = 2.5; g.lineCap = 'round';
    g.beginPath();
    // ridges: across on the brake, along on the gas, like the real pedals
    if (gas) for (var i = 1; i < 4; i++) { g.moveTo(x + w * i / 4, y + h * 0.22); g.lineTo(x + w * i / 4, y + h * 0.78); }
    else for (var j = 1; j < 4; j++) { g.moveTo(x + w * 0.22, y + h * j / 4); g.lineTo(x + w * 0.78, y + h * j / 4); }
    g.stroke();
  }

  /* ----------------------------------------------------------------- ui */

  var distEl = null;
  function renderTop() {
    top.innerHTML = '';
    if (dailyDate) top.appendChild(el('span', { class: 'ch-badge ch-badge--accent' }, [C.icon('calendar', 14), el('span', { text: C.t('dailyHr') + ' — ' + C.num(dailyDate) })]));
    distEl = el('span', { class: 'ch-badge' });
    top.appendChild(distEl);
    var best = C.stats.getBest('hillrider', 'metres');
    if (!dailyDate && best) top.appendChild(el('span', { class: 'ch-badge', text: C.t('bestM', { n: C.num(best) }) }));
    var gear = el('button', { class: 'ch-iconbtn hr-gear', type: 'button', 'aria-label': C.t('settings'), title: C.t('settings') }, [C.icon('gear', 20)]);
    gear.addEventListener('click', showSettings);
    top.appendChild(gear);
    shownM = -1;
    renderDist();
  }
  var shownM = -1;
  function renderDist() {
    if (!distEl || !S) return;
    var m = E.metres(S);
    if (m !== shownM) { shownM = m; distEl.textContent = C.t('distM', { n: C.num(m) }); }
  }
  function renderStatus() { status.textContent = waiting && resumed ? C.t('tapGo') : C.t('howTo'); }
  function go() { if (waiting) { waiting = false; last = 0; renderStatus(); kick(); } }

  // The speed dial's unit lives behind the gear, never in the help (#777)
  function showSettings() {
    var seg = C.ui.segmented([{ value: 'kmh', label: C.t('optKmh') }, { value: 'mph', label: C.t('optMph') }, { value: 'off', label: C.t('spdOff') }], prefs.speed, function (v) {
      prefs.speed = v === 'mph' || v === 'off' ? v : 'kmh';
      ctx.store.set('prefs', prefs);
      draw();
    });
    C.ui.modal({
      title: C.t('settings'),
      body: [el('div', { class: 'ch-list' }, [el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: C.t('spdT') }), seg])])],
      actions: [{ label: C.t('done'), kind: 'primary' }]
    });
  }

  /* -------------------------------------------------------------- input */

  // The whole game area is the two pedals, split at the middle of the road: on a phone
  // on its side the road is narrower than the screen, and its empty sides still drive.
  var touches = {};
  function side(e) { var r = cv.getBoundingClientRect(); return e.clientX < r.left + r.width / 2 ? 'l' : 'r'; }
  function syncHeld() { held.l = held.r = false; for (var id in touches) held[touches[id]] = true; }
  wrap.addEventListener('pointerdown', function (e) {
    if (!S || (e.target.closest && e.target.closest('button'))) return;
    e.preventDefault();
    if (ended) return;
    go();
    touches[e.pointerId] = side(e); syncHeld();
    try { wrap.setPointerCapture(e.pointerId); } catch (er) { /* old browsers */ }
  });
  wrap.addEventListener('pointermove', function (e) { if (touches[e.pointerId]) { touches[e.pointerId] = side(e); syncHeld(); } });
  function lift(e) { delete touches[e.pointerId]; syncHeld(); }
  wrap.addEventListener('pointerup', lift);
  wrap.addEventListener('pointercancel', lift);
  wrap.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  wrap.style.touchAction = 'none';

  function isGas(e) { return e.key === 'ArrowRight' || e.key === 'ArrowUp' || C.keyIs(e, 'd') || C.keyIs(e, 'w'); }
  function isBrake(e) { return e.key === 'ArrowLeft' || e.key === 'ArrowDown' || C.keyIs(e, 'a') || C.keyIs(e, 's'); }
  window.addEventListener('keydown', function (e) {
    if (document.querySelector('.ch-scrim')) return;
    if (isGas(e)) { go(); keys.g = true; e.preventDefault(); }
    else if (isBrake(e)) { go(); keys.b = true; e.preventDefault(); }
    else if (e.key === ' ') { go(); e.preventDefault(); }
    else if (C.keyIs(e, 'r')) { newRun(); e.preventDefault(); }
  });
  window.addEventListener('keyup', function (e) {
    if (isGas(e)) keys.g = false;
    else if (isBrake(e)) keys.b = false;
  });
  // a run waits while the app is away, and no pedal is held when it comes back
  C.onPause(function () { paused = true; keys.g = keys.b = false; touches = {}; syncHeld(); ctx.save(); });
  C.onResume(function () { paused = false; last = 0; kick(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { last = 0; kick(); } });
  if (window.ResizeObserver) new ResizeObserver(function () { draw(); }).observe(box);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fontFam = ''; draw(); });
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw); } catch (er) { /* old WebViews */ } }

  /* --------------------------------------------------------------- help */

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [kb('→ ↑ / D W', C.t('kGas')), kb('← ↓ / A S', C.t('kBrake')), kb('R', C.t('kAgain'))])
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  function tArt(kind) {
    var s = '<svg viewBox="0 0 200 110" width="100%" direction="ltr"><rect width="200" height="110" rx="10" fill="#A9DCF2"/>';
    var hill = '<path d="M0 84 Q 50 64 100 80 T 200 70 V110 H0Z" fill="#9A6B45"/><path d="M0 84 Q 50 64 100 80 T 200 70" fill="none" stroke="#3E9C3A" stroke-width="4"/>';
    var car = function (x, y, a) {
      return '<g transform="translate(' + x + ' ' + y + ') rotate(' + a + ')"><circle cx="-14" cy="0" r="6" fill="#1A1A1C"/><circle cx="14" cy="0" r="6" fill="#1A1A1C"/>' +
        '<path d="M-21 -6 H21 L20 -10 L9 -13 L-6 -10 L-20 -12Z" fill="#D94F2B"/><circle cx="-2" cy="-19" r="4.5" fill="#E8B21A"/></g>';
    };
    if (kind === 1) s += hill + car(100, 72, -4) + '<rect x="6" y="40" width="22" height="30" rx="5" fill="rgba(31,26,23,.25)"/><rect x="172" y="40" width="22" height="30" rx="5" fill="rgba(31,26,23,.25)"/>' +
      '<text x="17" y="34" font-size="12" text-anchor="middle" fill="#1F1A17">◀</text><text x="183" y="34" font-size="12" text-anchor="middle" fill="#1F1A17">▶</text>';
    if (kind === 2) s += hill + car(100, 36, -30) + '<path d="M70 40 A 32 32 0 0 1 120 12" fill="none" stroke="' + ACCENT + '" stroke-width="2.5" stroke-dasharray="4 4"/><path d="M118 6 l6 7 -9 2z" fill="' + ACCENT + '"/>';
    if (kind === 3) s += hill + car(56, 70, -6) + '<rect x="126" y="54" width="16" height="20" rx="3" fill="#D8382C"/><rect x="134" y="50" width="6" height="4" fill="#8E231B"/>' +
      '<rect x="10" y="10" width="70" height="9" rx="4.5" fill="#E9E2D6"/><rect x="10" y="10" width="18" height="9" rx="4.5" fill="#D8382C"/>';
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: tArt(1) },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: tArt(2) },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: tArt(3) }
  ];

  /* -------------------------------------------------------------- start */

  // A run in progress is saved when the app goes away, and comes back waiting for a tap,
  // so the car is never dropped mid-jump; the daily road has its own slot (#132)
  ctx.autosave(function () {
    if (!S || S.over || S.won || ended || S.t < 1) return { inProgress: false };
    return { s: E.snapshot(S), tries: tries, daily: dailyDate || null, elapsed: Date.now() - startedAt };
  });
  function resumeRun(sv) {
    var R = E.restore(sv.s);
    if (!R) return false;
    S = R; tries = sv.tries || 1; startedAt = Date.now() - (sv.elapsed || 0);
    ended = false; waiting = true; resumed = true; flipPending = false; acc = 0; last = 0; prev = null; spd = Math.abs(S.vx);
    cam.x = S.x; cam.y = S.y;
    renderTop(); renderStatus(); draw(); kick();
    return true;
  }
  var saved = ctx.loadSave();
  if (dailyDate) {
    if (!(saved && saved.s && saved.daily === dailyDate && resumeRun(saved))) newRun();
    if (C.stats.dailyDone('hillrider', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).hillrider;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
    }
  } else if (!(saved && saved.s && !saved.daily && resumeRun(saved))) {
    newRun();
  }
  ctx.tutorialIfNew(TUT);
})();
