<script>
/* ==== ENGINE START ==== */
function MazeEngineFactory() {
  'use strict';

  var SIZES = [8, 12, 16], DAILY_N = 12;
  // a cell is a bit mask of the sides it is open to
  var N = 1, E = 2, S = 4, W = 8, DIRS = [N, E, S, W];

  function opp(d) { return d === N ? S : d === E ? W : d === S ? N : E; }
  function nb(n, i, d) {
    var r = Math.floor(i / n) + (d === N ? -1 : d === S ? 1 : 0), c = i % n + (d === W ? -1 : d === E ? 1 : 0);
    return r < 0 || c < 0 || r >= n || c >= n ? -1 : r * n + c;
  }

  // A growing tree from the start corner: a spanning tree, so every cell is reachable
  // by exactly one path and the maze can never be sealed. Extending the newest cell
  // most of the time gives long winding corridors; a random one now and then gives the
  // side branches that make it a maze rather than one long snake.
  function carve(n, rnd) {
    var NN = n * n, m = new Array(NN).fill(0), seen = new Array(NN).fill(false), active = [0];
    seen[0] = true;
    while (active.length) {
      var k = rnd() < 0.75 ? active.length - 1 : Math.floor(rnd() * active.length), c = active[k], opts = [];
      for (var q = 0; q < 4; q++) { var j = nb(n, c, DIRS[q]); if (j >= 0 && !seen[j]) opts.push(DIRS[q]); }
      if (!opts.length) { active.splice(k, 1); continue; }
      var d = opts[Math.floor(rnd() * opts.length)], t = nb(n, c, d);
      m[c] |= d; m[t] |= opp(d); seen[t] = true; active.push(t);
    }
    return m;
  }

  function dists(n, m, from) {
    var NN = n * n, dist = new Array(NN).fill(-1), prev = new Array(NN).fill(-1), q = [from], h = 0;
    dist[from] = 0;
    while (h < q.length) {
      var i = q[h++];
      for (var k = 0; k < 4; k++) {
        if (!(m[i] & DIRS[k])) continue;
        var j = nb(n, i, DIRS[k]);
        if (j >= 0 && dist[j] < 0) { dist[j] = dist[i] + 1; prev[j] = i; q.push(j); }
      }
    }
    return { dist: dist, prev: prev };
  }

  // The exit is the cell on the far edges (last row or last column) that is farthest
  // to walk to, so the way out always crosses the board instead of sitting beside the
  // start. `par` is that walk, the fewest steps there are.
  function generate(n, rnd) {
    var m = carve(n, rnd), D = dists(n, m, 0), exit = -1;
    for (var i = 0; i < n * n; i++) {
      if ((Math.floor(i / n) === n - 1 || i % n === n - 1) && (exit < 0 || D.dist[i] > D.dist[exit])) exit = i;
    }
    return { n: n, m: m, start: 0, exit: exit, par: D.dist[exit] };
  }
  // the side the exit's doorway is cut in: the right wall if it is in the last column
  function exitSide(M) { return M.exit % M.n === M.n - 1 ? E : S; }

  function open(M, i, d) { return !!(M.m[i] & d); }
  function step(M, i, d) { return open(M, i, d) ? nb(M.n, i, d) : -1; }

  // A key or a swipe runs the corridor: on in one direction until a wall, a side
  // opening or the exit, so a long passage is one press rather than twelve.
  function slide(M, i, d) {
    var path = [], c = i;
    while (open(M, c, d)) {
      c = nb(M.n, c, d); path.push(c);
      if (c === M.exit || M.m[c] !== (d | opp(d))) break;
    }
    return path;
  }
  // Toward a cell (the finger): one step at a time through open sides only, the longer
  // axis first, and only steps that bring the ball closer. It stops at a corner the
  // finger has not turned yet, so a drag can never cut through a wall.
  function toward(M, i, t) {
    var path = [], c = i, n = M.n;
    for (var guard = 0; guard < 2 * n && c !== t; guard++) {
      var dr = Math.floor(t / n) - Math.floor(c / n), dc = t % n - c % n;
      var v = dr < 0 ? N : S, h = dc < 0 ? W : E, order = Math.abs(dr) >= Math.abs(dc) ? [v, h] : [h, v], moved = false;
      for (var k = 0; k < 2; k++) {
        var d = order[k];
        if ((d === v && !dr) || (d === h && !dc) || !open(M, c, d)) continue;
        c = nb(n, c, d); path.push(c); moved = true; break;
      }
      if (!moved || c === M.exit) break;
    }
    return path;
  }

  // the way out from the start, cell by cell, start and exit included
  function solve(M) {
    var D = dists(M.n, M.m, M.start), out = [], c = M.exit;
    if (D.dist[c] < 0) return null;
    while (c >= 0) { out.unshift(c); c = D.prev[c]; }
    return out;
  }

  // three stars close to the fewest steps, two within twice as many, one after that:
  // never a loss
  function stars(steps, par) { return steps <= Math.ceil(par * 1.2) ? 3 : steps <= par * 2 ? 2 : 1; }

  // The walked path kept on screen: stepping back onto the cell before takes the last
  // cell off, so in a tree it is always the one path from the start to the ball.
  function walk(trail, j) {
    if (trail.length > 1 && trail[trail.length - 2] === j) trail.pop(); else trail.push(j);
    return trail;
  }

  function valid(o, M) {
    if (!o || SIZES.indexOf(o.n) < 0 || typeof o.seed !== 'number' || o.seed < 1 || o.seed > 4294967295 || Math.floor(o.seed) !== o.seed) return false;
    if (!Array.isArray(o.trail) || !o.trail.length || o.trail[0] !== 0 || typeof o.steps !== 'number' || o.steps < o.trail.length - 1) return false;
    if (o.daily != null && typeof o.daily !== 'string') return false;
    if (!M) return true;
    for (var i = 0; i < o.trail.length; i++) {
      var c = o.trail[i];
      if (typeof c !== 'number' || c < 0 || c >= o.n * o.n || Math.floor(c) !== c) return false;
      if (i && !DIRS.some(function (d) { return step(M, o.trail[i - 1], d) === c; })) return false;
    }
    return o.trail[o.trail.length - 1] !== M.exit;
  }

  return {
    SIZES: SIZES, DAILY_N: DAILY_N, N: N, E: E, S: S, W: W, DIRS: DIRS,
    opp: opp, nb: nb, carve: carve, dists: dists, generate: generate, exitSide: exitSide,
    open: open, step: step, slide: slide, toward: toward, solve: solve, stars: stars, walk: walk, valid: valid
  };
}
if (typeof module !== 'undefined') module.exports = MazeEngineFactory;
/* ==== ENGINE END ==== */
</script>

    if (!S || ended || !drawn.k) return;
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* old WebViews */ }
    var p = at(e), b = cellXY(pos()), dx = p.x - (drawn.ox + b.x * drawn.k), dy = p.y - (drawn.oy + b.y * drawn.k);
    drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, trace: Math.hypot(dx, dy) <= drawn.k * 1.1 };
  });
  cv.addEventListener('pointermove', function (e) {
    if (!drag || drag.id !== e.pointerId || !drag.trace || ended) return;
    var c = cellAt(at(e));
    if (c >= 0 && c !== pos()) go(E.toward(M, pos(), c));
  });
  function release(e) {
    if (!drag || drag.id !== e.pointerId) return;
    var d = drag; drag = null;
    if (d.trace || ended || e.type === 'pointercancel') return;
    var dx = e.clientX - d.x0, dy = e.clientY - d.y0;
    if (Math.max(Math.abs(dx), Math.abs(dy)) >= SWIPE_PX) {
      // the canvas is drawn left to right in every language, so a swipe is geometric
      go(E.slide(M, pos(), Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? E.E : E.W) : (dy > 0 ? E.S : E.N)));
    } else {
      var c = cellAt(at(e));
      if (c >= 0) go(E.toward(M, pos(), c));
    }
  }
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  window.addEventListener('keydown', function (e) {
    if (document.querySelector('.ch-scrim')) return;
    if (e.ctrlKey || e.metaKey || e.altKey || !S) return;
    if (C.keyIs(e, 'n') && !dailyDate) { askNew(); e.preventDefault(); return; }
    var d = { ArrowUp: E.N, ArrowDown: E.S, ArrowLeft: E.W, ArrowRight: E.E }[e.key];
    if (!d) return;
    // a focused size button keeps its own arrows; anywhere else they roll the ball
    if (top.contains(document.activeElement)) return;
    e.preventDefault();
    go(E.slide(M, pos(), d));
  });

  /* ------------------------------------------------------------ dialogs */

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    var keys = [kb('← ↑ → ↓', C.t('kSlide'))];
    if (!dailyDate) keys.push(kb('N', C.t('kNew')));
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, keys)
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  // A fixed 4×4 maze for the tutorial, in the light theme's literal colours. The open
  // sides of each cell as a mask, the same N=1 E=2 S=4 W=8 as the engine.
  var TM = [6, 10, 10, 12, 7, 10, 8, 5, 7, 14, 8, 1, 1, 3, 10, 8];
  function tArt(trail, ballAt, arrow) {
    var k = 24, ox = 52, oy = 7, s = '<svg viewBox="0 0 200 110" width="100%"><rect x="' + (ox - 4) + '" y="' + (oy - 4) + '" width="' + (k * 4 + 8) + '" height="' + (k * 4 + 8) + '" rx="7" fill="#EEE2F5"/>' +
      '<rect x="' + ox + '" y="' + oy + '" width="' + (k * 4) + '" height="' + (k * 4) + '" fill="#FCF8FE"/>' +
      '<rect x="' + (ox + 3 * k) + '" y="' + (oy + 3 * k) + '" width="' + k + '" height="' + k + '" fill="rgba(35,135,90,0.14)"/>';
    var cx = function (i) { return ox + (i % 4) * k + k / 2; }, cy = function (i) { return oy + Math.floor(i / 4) * k + k / 2; };
    if (trail.length > 1) s += '<polyline points="' + trail.map(function (i) { return cx(i) + ',' + cy(i); }).join(' ') + '" fill="none" stroke="rgba(168,72,216,0.30)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>';
    var d = '';
    for (var i = 0; i < 16; i++) {
      var x = ox + (i % 4) * k, y = oy + Math.floor(i / 4) * k;
      if (!(TM[i] & 1)) d += 'M' + x + ' ' + y + 'h' + k;
      if (!(TM[i] & 8)) d += 'M' + x + ' ' + y + 'v' + k;
      if (i % 4 === 3 && i !== 15) d += 'M' + (x + k) + ' ' + y + 'v' + k;
      if (i >= 12) d += 'M' + x + ' ' + (y + k) + 'h' + k;
    }
    s += '<path d="' + d + '" stroke="#3C2350" stroke-width="3" stroke-linecap="round" fill="none"/>';
    s += '<path d="M' + (cx(15) - 4) + ' ' + (cy(15) + 8) + 'v-16l12 4-12 5" fill="#23875A" stroke="#23875A" stroke-width="1.5" stroke-linejoin="round"/>';
    s += '<circle cx="' + cx(ballAt) + '" cy="' + cy(ballAt) + '" r="8" fill="' + ACCENT + '"/><circle cx="' + (cx(ballAt) - 2.5) + '" cy="' + (cy(ballAt) - 2.5) + '" r="2.5" fill="#fff" opacity=".55"/>';
    if (arrow) s += '<path d="' + arrow + '" fill="none" stroke="' + ACCENT + '" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/>';
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: tArt([0, 4, 5], 5, 'M98 43h16') },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: tArt([0, 1, 2, 3], 3,'M20 ' + (7 + 60) + 'h22M36 ' + (7 + 54) + 'l6 6-6 6') },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: tArt([0, 4, 8, 9, 13, 14, 15], 15, null) }
  ];

  /* -------------------------------------------------------------- start */

  // the walk is saved after every move; the daily maze has its own slot
  ctx.autosave(function () {
    if (!S || ended) return { inProgress: false };
    return { n: S.n, seed: S.seed, trail: S.trail, steps: S.steps, daily: S.daily, elapsed: elapsed() };
  });
  function save() { ctx.save(); }
  C.onPause(function () { if (S && !ended) { S.elapsed = elapsed(); startedAt = 0; ctx.save(); } });
  var saved = ctx.loadSave();
  if (saved && E.valid(saved) && (saved.daily || null) === (dailyDate || null) &&
      E.valid(saved, E.generate(saved.n, C.rng(saved.seed)))) {
    S = { n: saved.n, seed: saved.seed, trail: saved.trail.slice(), steps: saved.steps, daily: saved.daily || null, elapsed: +saved.elapsed || 0 };
    build(); render();
  } else newMaze(dailyDate ? E.DAILY_N : prefs.n);
  if (dailyDate && C.stats.dailyDone('maze', dailyDate)) {
    var rec = C.stats.dailyOf(dailyDate).maze;
    C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
  }
  // the board is redrawn whenever its box changes (rotation, side rows) and once the
  // web font has arrived and moved the layout (Bowling lesson)
  if (window.ResizeObserver) new ResizeObserver(function () { draw(); }).observe(box);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { draw(); });
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { draw(); }); } catch (er) { /* old WebViews */ } }
  new MutationObserver(function () { draw(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  ctx.tutorialIfNew(TUT);
})();
</script>
</body>
</html>
