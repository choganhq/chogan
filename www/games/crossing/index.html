<script>
/* ==== ENGINE START ==== */
function CrossingEngineFactory() {
  'use strict';

  // The board: row 0 holds the burrows, rows 1–5 are river, 6 the safe middle verge,
  // 7–11 road and 12 the start. Columns are whole cells; on the river the hedgehog
  // rides a log or turtles, so its column there is a fraction.
  var COLS = 11, ROWS = 13, DT = 1 / 60;
  var HOME = 0, MID = 6, START = 12, START_X = 5;
  var BURROWS = [1, 3, 5, 7, 9];
  var LEVELS = 5, LIVES = 3;
  // ticks: one hop, one life (a generous minute for one burrow), the bump or splash
  var HOP = 8, LIFE = 3600, DYING = 54;
  // A lane is a loop of P cells, of which the screen shows COLS; objects wrap out of
  // sight, M cells left of the screen, so none ever pops up on it
  var ROAD_P = 17, ROAD_M = 3, RIVER_P = 23, RIVER_M = 6;

  function mulberry(sd) {
    var a = sd >>> 0;
    return function () { a = (a + 0x6D2B79F5) >>> 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function mod(a, p) { return ((a % p) + p) % p; }
  function isRiver(r) { return r >= 1 && r <= 5; }
  function isRoad(r) { return r >= 7 && r <= 11; }

  // n objects round a loop of P, each in its own slot with at least gmin free behind it
  function place(rnd, n, P, lmin, lmax, gmin) {
    var out = [], slot = P / n, off = rnd() * P;
    for (var i = 0; i < n; i++) {
      var len = lmin + Math.floor(rnd() * (lmax - lmin + 1));
      var room = Math.max(0, slot - len - gmin);
      out.push({ s: mod(off + i * slot + rnd() * room, P), len: len });
    }
    return out;
  }

  // A level's lanes come from its own seed alone, so a saved run stores only the seeds
  function makeLevel(lv, seed) {
    var rnd = mulberry(seed), f = 1 + 0.15 * (lv - 1), fr = 1 + 0.08 * (lv - 1), lanes = [], r, L, i;
    var kinds = ['car', 'truck', 'bike', 'car', 'truck'];
    for (i = kinds.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)), t = kinds[i]; kinds[i] = kinds[j]; kinds[j] = t; }
    var d = rnd() < 0.5 ? 1 : -1;
    for (r = 11; r >= 7; r--) {
      var k = kinds[11 - r];
      if (k === 'car') L = { v: (1.0 + 0.5 * rnd()) * f, objs: place(rnd, lv >= 3 ? 3 : 2, ROAD_P, 1, 1, 3) };
      else if (k === 'truck') L = { v: (0.7 + 0.35 * rnd()) * f, objs: place(rnd, 2, ROAD_P, 2, 3, lv >= 4 ? 3.5 : 4.5) };
      else L = { v: (1.9 + 0.5 * rnd()) * f, objs: place(rnd, lv >= 4 ? 2 : 1, ROAD_P, 1, 1, 4) };
      L.kind = k; L.dir = d; L.P = ROAD_P; L.M = ROAD_M; L.paint = Math.floor(rnd() * 5);
      lanes[r] = L; d = -d;
    }
    // logs get shorter as the levels go on; turtles dive more often
    var river = ['turtle', 'log', 'log', 'turtle', 'log'], lmax = 5 - Math.floor((lv - 1) / 2), lmin = Math.max(3, lmax - 1);
    d = rnd() < 0.5 ? 1 : -1;
    for (r = 5; r >= 1; r--) {
      var kk = river[5 - r];
      if (kk === 'log') L = { v: (0.7 + 0.5 * rnd()) * fr, objs: place(rnd, 3, RIVER_P, lmin, lmax, 1.5) };
      else {
        L = { v: (0.8 + 0.4 * rnd()) * fr, objs: place(rnd, 4, RIVER_P, 2, 3, 1.5) };
        // the first group never dives, so a turtle lane always has a raft
        for (i = 1; i < L.objs.length; i++) {
          if (rnd() < 0.12 * lv) { var o = L.objs[i]; o.D = Math.round((5 - 0.3 * lv) * 60); o.ph = Math.floor(rnd() * o.D); }
        }
      }
      L.kind = kk; L.dir = d; L.P = RIVER_P; L.M = RIVER_M; L.paint = 0;
      lanes[r] = L; d = -d;
    }
    return lanes;
  }

  function objX(L, o, tick) { return mod(o.s + L.dir * L.v * tick * DT, L.P) - L.M; }
  // A diving group: it sinks over 0.60–0.72 of its cycle, stays under until 0.92, then
  // comes up. It holds the hedgehog until it is fully under.
  function phase(o, tick) { return o.D ? ((tick + o.ph) % o.D) / o.D : 0; }
  function supports(o, tick) { var u = phase(o, tick); return !o.D || u < 0.72 || u >= 0.92; }
  function depth(o, tick) {
    if (!o.D) return 0;
    var u = phase(o, tick);
    if (u < 0.6) return 0;
    if (u < 0.72) return (u - 0.6) / 0.12;
    if (u < 0.92) return 1;
    return 1 - (u - 0.92) / 0.08;
  }

  function objects(S, r) {
    var L = S.lanes[r];
    if (!L) return [];
    return L.objs.map(function (o) { return { x: objX(L, o, S.tick), len: o.len, depth: depth(o, S.tick), up: supports(o, S.tick) }; });
  }
  function hitByTraffic(S) {
    var L = S.lanes[S.row];
    if (!L || !isRoad(S.row)) return false;
    for (var i = 0; i < L.objs.length; i++) {
      var x = objX(L, L.objs[i], S.tick);
      if (x < S.px + 0.85 && x + L.objs[i].len > S.px + 0.15) return true;
    }
    return false;
  }
  function onPlatform(S) {
    var L = S.lanes[S.row], c = S.px + 0.5;
    if (!L || !isRiver(S.row)) return false;
    for (var i = 0; i < L.objs.length; i++) {
      var o = L.objs[i], x = objX(L, o, S.tick);
      if (c >= x - 0.05 && c <= x + o.len + 0.05 && supports(o, S.tick)) return true;
    }
    return false;
  }

  function respawn(S) { S.row = START; S.px = START_X; S.cd = 0; S.from = null; S.time = LIFE; S.reach = START; S.dying = 0; S.cause = null; }
  function startLevel(S, lv) { S.lv = lv; S.lanes = makeLevel(lv, S.seeds[lv - 1]); S.tick = 0; S.filled = [0, 0, 0, 0, 0]; S.lvDeaths = 0; respawn(S); }
  function fromSeeds(seeds) {
    var S = { seeds: seeds.slice(0, LEVELS), lives: LIVES, score: 0, homes: 0, deaths: 0, over: false, won: false, ev: [] };
    startLevel(S, 1);
    return S;
  }
  function newGame(rnd) {
    var seeds = [];
    for (var i = 0; i < LEVELS; i++) seeds.push(Math.floor(rnd() * 4294967296));
    return fromSeeds(seeds);
  }

  function die(S, cause) {
    S.lives--; S.deaths++; S.lvDeaths++;
    S.dying = DYING; S.cause = cause;
    S.ev.push({ t: 'die', cause: cause });
  }
  function check(S) {
    if (isRoad(S.row)) { if (hitByTraffic(S)) die(S, 'car'); }
    else if (isRiver(S.row)) {
      if (S.px + 0.5 < 0 || S.px + 0.5 > COLS) die(S, 'swept');
      else if (!onPlatform(S)) die(S, 'water');
    }
  }

  function step(S) {
    if (S.over) return;
    S.tick++;
    if (S.dying) {
      if (--S.dying === 0) {
        if (S.lives <= 0) { S.over = true; S.ev.push({ t: 'over' }); } else respawn(S);
      }
      return;
    }
    if (S.cd > 0) S.cd--;
    if (isRiver(S.row)) { var L = S.lanes[S.row]; S.px += L.dir * L.v * DT; }
    if (--S.time <= 0) { S.time = 0; die(S, 'time'); return; }
    check(S);
  }

  function canHop(S) { return !S.over && !S.dying && S.cd === 0; }

  // Into the burrow row: only an empty burrow close to the hedgehog takes it. Anywhere
  // else the hop is refused rather than fatal: the hedge is a wall, not a trap.
  function enter(S) {
    var c = S.px + 0.5, b = -1, best = 0.65;
    for (var i = 0; i < BURROWS.length; i++) {
      if (S.filled[i]) continue;
      var dd = Math.abs(c - (BURROWS[i] + 0.5));
      if (dd <= best) { best = dd; b = i; }
    }
    if (b < 0) return false;
    S.filled[b] = 1; S.homes++;
    S.score += 10 + 50 + 2 * Math.floor(S.time * DT);
    S.ev.push({ t: 'home', b: b, from: { row: S.row, px: S.px } });
    if (S.filled.every(function (v) { return v; })) {
      S.score += 100 * S.lv;
      S.ev.push({ t: 'level', lv: S.lv, clean: S.lvDeaths === 0 });
      if (S.lv >= LEVELS) {
        S.score += 200 * S.lives;
        S.over = true; S.won = true; S.row = HOME; S.px = BURROWS[b]; S.cd = 0;
        S.ev.push({ t: 'win' });
        return true;
      }
      startLevel(S, S.lv + 1);
      return true;
    }
    respawn(S);
    return true;
  }

  function hop(S, dir) {
    if (!canHop(S)) return false;
    var r = S.row, x = S.px;
    if (dir === 'up') r--; else if (dir === 'down') r++; else if (dir === 'left') x--; else if (dir === 'right') x++; else return false;
    if (r > START) return false;
    if (r === HOME) return enter(S);
    if (!isRiver(r)) x = Math.round(x);
    if (x < -0.001 || x > COLS - 1 + 0.001) return false;
    S.from = { row: S.row, px: S.px };
    S.row = r; S.px = x; S.cd = HOP;
    if (r < S.reach) { S.reach = r; S.score += 10; }
    S.ev.push({ t: 'hop', dir: dir });
    check(S);
    return true;
  }

  function drain(S) { var e = S.ev; S.ev = []; return e; }

  function clone(S) {
    var c = {};
    for (var k in S) c[k] = S[k];
    c.filled = S.filled.slice();
    c.from = S.from ? { row: S.from.row, px: S.from.px } : null;
    c.ev = [];
    return c;
  }

  var KEYS = ['lv', 'tick', 'row', 'px', 'cd', 'time', 'reach', 'dying', 'lives', 'score', 'homes', 'deaths', 'lvDeaths'];
  function snapshot(S) {
    var o = { seeds: S.seeds.slice(), filled: S.filled.slice(), cause: S.cause, over: S.over, won: S.won };
    KEYS.forEach(function (k) { o[k] = S[k]; });
    return o;
  }
  function restore(o) {
    if (!o || !Array.isArray(o.seeds) || o.seeds.length !== LEVELS || !o.seeds.every(function (s) { return typeof s === 'number' && isFinite(s); })) return null;
    if (!KEYS.every(function (k) { return typeof o[k] === 'number' && isFinite(o[k]); })) return null;
    if (o.lv < 1 || o.lv > LEVELS || o.row < HOME || o.row > START || o.lives < 0 || o.lives > LIVES) return null;
    if (!Array.isArray(o.filled) || o.filled.length !== BURROWS.length) return null;
    var S = fromSeeds(o.seeds);
    startLevel(S, o.lv);
    KEYS.forEach(function (k) { S[k] = o[k]; });
    S.filled = o.filled.map(function (v) { return v ? 1 : 0; });
    S.cause = o.cause || null; S.over = !!o.over; S.won = !!o.won; S.from = null;
    return S;
  }

  return {
    COLS: COLS, ROWS: ROWS, DT: DT, HOME: HOME, MID: MID, START: START, START_X: START_X, BURROWS: BURROWS,
    LEVELS: LEVELS, LIVES: LIVES, HOP: HOP, LIFE: LIFE, DYING: DYING,
    newGame: newGame, fromSeeds: fromSeeds, makeLevel: makeLevel, step: step, hop: hop, canHop: canHop,
    clone: clone, snapshot: snapshot, restore: restore, drain: drain, objects: objects,
    isRiver: isRiver, isRoad: isRoad, onPlatform: onPlatform, hitByTraffic: hitByTraffic
  };
}
if (typeof module !== 'undefined') module.exports = CrossingEngineFactory;
/* ==== ENGINE END ==== */
</script>

  /* ------------------------------------------------------------- runs */

  function seeded(sd) {
    var a = sd >>> 0;
    return function () { a = (a + 0x6D2B79F5) >>> 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  function rngFor(sd) { return dailyDate ? C.daily('crossing', dailyDate).rng : seeded(sd); }

  function newRun() {
    seed = Math.floor(Math.random() * 4294967296);
    S = E.newGame(rngFor(seed));
    tries++;
    startedAt = Date.now();
    ended = false; waiting = false; last = 0; acc = 0;
    facing = 'up'; queued = null; pop = null; glow = null; deadAt = null;
    ctx.clearSave();
    renderTop(); renderStatus();

  }

  function blocked() { return paused || waiting || document.hidden || !!document.querySelector('.ch-scrim'); }
  function tick(now) {
    raf = 0;
    if (!S) return;
    var dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
    last = now;
    if (!blocked() && !ended) {
      // a fixed step, so a run plays the same on every screen
      acc += dt;
      var n = 0;
      while (acc >= E.DT && n < 8) {
        E.step(S); acc -= E.DT; n++;
        if (queued && E.canHop(S)) { var q = queued; queued = null; doHop(q); }
        events();
        if (ended) break;
      }
      if (n >= 8) acc = 0;
    }
    if (pop) { pop.t -= dt * 0.8; if (pop.t <= 0) pop = null; }
    if (glow) { glow.t -= dt * 1.2; if (glow.t <= 0) glow = null; }

    raf = requestAnimationFrame(tick);
  }
  function kick() { if (!raf) { last = 0; raf = requestAnimationFrame(tick); } }

  function doHop(dir) {
    if (!S || ended || S.over) return;
    if (!E.canHop(S)) { if (!S.dying) queued = dir; return; }
    facing = dir;
    E.hop(S, dir);
    events();
  }

  function causeText(c) { return c === 'car' ? C.t('bump') : c === 'time' ? C.t('timeUp') : c === 'swept' ? C.t('swept') : C.t('splash'); }

  function events() {
    var ev = E.drain(S), save = false;
    for (var i = 0; i < ev.length; i++) {

        C.feedback('good'); C.haptic('success');
        glow = { b: e.b, t: 1 };
        pop = { text: C.t('inBurrow'), t: 1 };
        facing = 'up'; queued = null; save = true;
      } else if (e.t === 'level') {
        if (e.clean) C.achievements.unlock('cx-clean');
        if (e.lv < E.LEVELS) { C.audio.sfx('win'); pop = { text: C.t('lvN', { n: C.num(e.lv + 1) }), t: 1.4 }; }
      } else if (e.t === 'die') {
        lastCause = e.cause; deadAt = { row: S.row, px: S.px, cause: e.cause };
        C.feedback('bad');
        pop = { text: causeText(e.cause), t: 1 };
        queued = null; save = true;
      } else if (e.t === 'win' || e.t === 'over') {
        ended = true;
        ctx.clearSave();
        setTimeout(finish, C.ui.reduceMotion() ? 300 : 1100);
      }
    }
    if (ev.length) { renderTop(); renderStatus(); }
    if (save && !ended) ctx.save();
    if (S && !S.dying) deadAt = null;
  }

  function finish() {
    var won = S.won, sc = S.score, note = null;
    var coins = won ? 30 : Math.min(24, 1 + S.homes), points = won ? 120 : Math.min(100, 4 + S.homes * 4);

    if (dailyDate) {
      if (won) C.achievements.unlock('cx-daily');

      lines.push({ label: C.t('tries'), value: C.num(tries) });
    } else {
      if (C.stats.best('crossing', 'score', sc) && sc > 0) note = C.t('bestN', { n: C.num(sc) });
      lines.push({ label: C.t('best'), value: C.num(C.stats.getBest('crossing', 'score') || sc) });

    g.fillStyle = P.log; rr(g, x + 2, y + 6, w - 4, T - 12, 12); g.fill();
    g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 1.5;
    for (var i = 0; i < len; i++) { g.beginPath(); g.moveTo(x + 12 + i * T, y + 14); g.lineTo(x + 30 + i * T, y + 14); g.moveTo(x + 20 + i * T, y + 25); g.lineTo(x + 38 + i * T, y + 25); g.stroke(); }
    g.fillStyle = P.log2;
    g.beginPath(); g.ellipse(x + w - 7, y + T / 2, 5, T / 2 - 7, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = P.log; g.lineWidth = 1.2;
    g.beginPath(); g.ellipse(x + w - 7, y + T / 2, 2.5, T / 2 - 11, 0, 0, Math.PI * 2); g.stroke();
  }

  function turtles(g, x, y, len, dir, depth, P, t) {
    for (var i = 0; i < len; i++) {
      var cx = x + (i + 0.5) * T, cy = y + T / 2;
      g.globalAlpha = 1 - 0.85 * depth;
      g.fillStyle = P.flip;
      var paddle = Math.sin(t * 6 + i) * 2;
      [[-9, -10], [9, -10], [-9, 10], [9, 10]].forEach(function (f) { g.beginPath(); g.ellipse(cx + f[0] + (f[1] < 0 ? paddle : -paddle), cy + f[1], 5, 3.5, 0, 0, Math.PI * 2); g.fill(); });
      g.beginPath(); g.arc(cx + dir * 15, cy, 5, 0, Math.PI * 2); g.fill();
      g.fillStyle = P.shell; g.beginPath(); g.ellipse(cx, cy, 13, 11, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = P.shell2;
      g.beginPath();
      for (var k = 0; k < 6; k++) { var a = k * Math.PI / 3; g.lineTo(cx + Math.cos(a) * 6, cy + Math.sin(a) * 5); }
      g.closePath(); g.fill();
      g.globalAlpha = 1;
      if (depth > 0 && depth < 1) {
        g.strokeStyle = P.wave; g.lineWidth = 2;
        g.beginPath(); g.ellipse(cx, cy, 15 + 4 * depth, 13 + 3 * depth, 0, 0, Math.PI * 2); g.stroke();
      }
    }
  }

  // the whole board in logical units; the hedgehog is drawn separately
  function scene(g, P, t) {
    var r, i;
    // the hedge and the five burrows
    g.fillStyle = P.hedge; g.fillRect(0, 0, VW, T);
    g.fillStyle = P.hedge2;
    for (i = 0; i < 23; i++) { g.beginPath(); g.arc(i * 20, 6 + (i % 2) * 4, 9, 0, Math.PI * 2); g.fill(); }
    E.BURROWS.forEach(function (b, k) {
      var x = b * T;
      g.fillStyle = P.earth; rr(g, x + 2, 4, T - 4, T - 2, 16); g.fill();
      g.fillStyle = P.hole; g.beginPath(); g.ellipse(x + T / 2, T / 2 + 4, 14, 13, 0, 0, Math.PI * 2); g.fill();
      if (S && S.filled[k]) hog(g, x + T / 2, T / 2 + 4, 0, 0.85, P, true);
      if (glow && glow.b === k) {
        g.strokeStyle = 'rgba(255,230,140,' + Math.max(0, glow.t) + ')'; g.lineWidth = 3;
        g.beginPath(); g.arc(x + T / 2, T / 2 + 4, 16 + (1 - glow.t) * 10, 0, Math.PI * 2); g.stroke();
      }
    });
    // the river, with ripples drifting with each lane
    g.fillStyle = P.water; g.fillRect(0, T, VW, 5 * T);
    g.strokeStyle = P.wave; g.lineWidth = 1.5;
    for (r = 1; r <= 5; r++) {
      var L = S && S.lanes[r], sh = L ? ((L.dir * L.v * t * T * 0.5) % 60 + 60) % 60 : 0;
      for (i = -1; i < 9; i++) {
        var wx = i * 60 + sh + (r % 2) * 30, wy = r * T + 12 + (i % 2) * 14;
        g.beginPath(); g.moveTo(wx, wy); g.quadraticCurveTo(wx + 6, wy - 4, wx + 12, wy); g.quadraticCurveTo(wx + 18, wy + 4, wx + 24, wy); g.stroke();
      }
    }
    // the two verges
    [E.MID, E.START].forEach(function (row) {
      g.fillStyle = P.grass; g.fillRect(0, row * T, VW, T);
      g.fillStyle = P.grass2;
      for (i = 0; i < 22; i++) { var gx = (i * 37 + row * 13) % VW, gy = row * T + 8 + (i * 11) % 24; g.fillRect(gx, gy, 2, 6); g.fillRect(gx + 3, gy + 2, 2, 5); }
      g.fillStyle = P.flower;
      for (i = 0; i < 6; i++) { g.beginPath(); g.arc((i * 73 + row * 29) % VW + 6, row * T + 10 + (i * 17) % 22, 2.2, 0, Math.PI * 2); g.fill(); }
    });
    // the road: kerbs at both edges and dashed lines between the lanes
    g.fillStyle = P.road; g.fillRect(0, 7 * T, VW, 5 * T);
    g.fillStyle = P.kerb; g.fillRect(0, 7 * T, VW, 3); g.fillRect(0, 12 * T - 3, VW, 3);
    g.fillStyle = P.dash;
    for (r = 8; r <= 11; r++) for (i = 0; i < 11; i++) g.fillRect(i * 40 + 8, r * T - 1, 22, 2);
    if (!S) return;
    // what moves in each lane
    for (r = 1; r <= 11; r++) {
      var lane = S.lanes[r];
      if (!lane) continue;
      var objs = E.objects(S, r);
      for (i = 0; i < objs.length; i++) {
        var o = objs[i], x = o.x * T, y = r * T;
        if (o.x > E.COLS || o.x + o.len < 0) continue;
        if (lane.kind === 'log') logShape(g, x, y, o.len, P);
        else if (lane.kind === 'turtle') turtles(g, x, y, o.len, lane.dir, o.depth, P, t);
        else vehicle(g, lane.kind, x, y, o.len, lane.dir, P.cars[(lane.paint + i) % P.cars.length], P);
      }
    }
  }

  function draw() {
    if (!S) return;
    var Z = size(), dpr = Math.min(2, window.devicePixelRatio || 1);
    // both sides: a new canvas is 300×150 (#359)
    if (cv.width !== Math.round(Z.w * dpr) || cv.height !== Math.round(Z.h * dpr)) { cv.width = Math.round(Z.w * dpr); cv.height = Math.round(Z.h * dpr); }
    cv.style.width = Z.w + 'px'; cv.style.height = Z.h + 'px';
    var g = cv.getContext('2d'), k = Z.w / VW, P = palette(dark()), t = S.tick * E.DT;
    g.setTransform(dpr * k, 0, 0, dpr * k, 0, 0);
    g.clearRect(0, 0, VW, VH);
    g.save();
    g.beginPath(); g.rect(0, 0, VW, BOARD); g.clip();
    scene(g, P, t);
    drawHog(g, P, t);
    g.restore();
    // the time bar: a whole minute for each life
    g.fillStyle = P.bar; rr(g, 4, BOARD + 7, VW - 8, 10, 5); g.fill();
    var f = Math.max(0, Math.min(1, S.time / E.LIFE));
    if (f > 0) { g.fillStyle = P.fill; rr(g, 4, BOARD + 7, (VW - 8) * f, 10, 5); g.fill(); }
    if (pop) {
      var font = getComputedStyle(document.body).fontFamily || 'sans-serif';
      g.globalAlpha = Math.max(0, Math.min(1, pop.t * 2));
      g.font = '800 26px ' + font; g.textAlign = 'center'; g.textBaseline = 'middle';
      var y = E.MID * T + T / 2 - (1 - Math.min(1, pop.t)) * 8;
      g.lineWidth = 5; g.strokeStyle = P.shade; g.strokeText(pop.text, VW / 2, y);
      g.fillStyle = P.text; g.fillText(pop.text, VW / 2, y);
      g.globalAlpha = 1;
    }
  }

  function drawHog(g, P, t) {
    if (S.over && S.won) return;
    if (S.dying && deadAt) {
      var a = 1 - S.dying / E.DYING, x = (deadAt.px + 0.5) * T, y = deadAt.row * T + T / 2;
      if (deadAt.cause === 'water' || deadAt.cause === 'swept') {
        g.strokeStyle = P.wave; g.lineWidth = 3;
        for (var i = 0; i < 3; i++) { var rad = 6 + a * 22 - i * 7; if (rad > 0) { g.beginPath(); g.ellipse(x, y, rad, rad * 0.7, 0, 0, Math.PI * 2); g.stroke(); } }
        if (a < 0.4) { g.globalAlpha = 1 - a / 0.4; hog(g, x, y, ANG[facing], 1 - a, P); g.globalAlpha = 1; }
      } else {
        // a bump or the end of the minute: flattened and dizzy, never gory
        hog(g, x, y, ANG[facing], 1, P, false, deadAt.cause === 'car');
        g.fillStyle = '#F6C445';
        for (var s = 0; s < 3; s++) { var sa = t * 5 + s * 2.1; g.beginPath(); g.arc(x + Math.cos(sa) * 14, y - 12 + Math.sin(sa) * 5, 3, 0, Math.PI * 2); g.fill(); }
      }
      return;
    }
    if (S.dying) return;
    // between hops the hedgehog glides from the last square to the new one
    var p = 1 - S.cd / E.HOP, fx = S.px, fy = S.row;
    if (S.from && S.cd > 0) { fx = S.from.px + (S.px - S.from.px) * p; fy = S.from.row + (S.row - S.from.row) * p; }
    var lift = S.cd > 0 ? Math.sin(p * Math.PI) : 0;
    var cx = (fx + 0.5) * T, cy = fy * T + T / 2;
    g.fillStyle = 'rgba(0,0,0,.18)'; g.beginPath(); g.ellipse(cx, cy + 4, 12, 7, 0, 0, Math.PI * 2); g.fill();
    hog(g, cx, cy - lift * 5, ANG[facing], 1 + lift * 0.15, P);
  }

  // the share card: the board as it ended, burrows and all
  function paintShare(g, w, h) {
    var P = palette(dark());
    g.fillStyle = P.grass; g.fillRect(0, 0, w, h);
    var k = Math.min(w / VW, h / BOARD);
    g.save();
    g.translate((w - VW * k) / 2, (h - BOARD * k) / 2); g.scale(k, k);
    scene(g, P, S.tick * E.DT);
    g.restore();
  }

  /* ----------------------------------------------------------------- ui */

  function renderTop() {
    top.innerHTML = '';
    if (dailyDate) top.appendChild(el('span', { class: 'ch-badge ch-badge--accent' }, [C.icon('calendar', 14), el('span', { text: C.t('dailyCx') + ' — ' + C.num(dailyDate) })]));
    if (!S) return;
    top.appendChild(el('span', { class: 'ch-badge', text: C.t('lvN', { n: C.num(S.lv) }) }));
    top.appendChild(el('span', { class: 'ch-badge', text: C.t('livesN', { n: C.num(Math.max(0, S.lives)) }) }));
    top.appendChild(el('span', { class: 'ch-badge', text: C.t('ptsN', { n: C.num(S.score) }) }));
    var best = dailyDate ? 0 : C.stats.getBest('crossing', 'score');
    if (best) top.appendChild(el('span', { class: 'ch-badge', text: C.t('bestN', { n: C.num(best) }) }));
  }
  function renderStatus() { status.textContent = waiting ? C.t('tapGo') : C.t('hint'); }
  function go() { if (waiting) { waiting = false; last = 0; acc = 0; renderStatus(); kick(); } }

  /* -------------------------------------------------------------- input */

  // A swipe hops as soon as it has gone far enough; a touch that never does is a tap,
  // which hops forward. The whole game area listens, so a thumb need not find the hedgehog.
  var ptr = null, SWIPE = 22;
  wrap.addEventListener('pointerdown', function (e) {
    if (!S || (e.target.closest && e.target.closest('button'))) return;
    if (e.button !== undefined && e.button > 0) return;
    e.preventDefault();
    C.audio.unlock();
    if (waiting) { go(); return; }
    ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, done: false };
  });
  window.addEventListener('pointermove', function (e) {
    if (!ptr || ptr.done || e.pointerId !== ptr.id) return;
    var dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE) return;
    ptr.done = true;
    doHop(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });
  window.addEventListener('pointerup', function (e) {
    if (!ptr || e.pointerId !== ptr.id) return;
    if (!ptr.done) doHop('up');
    ptr = null;
  });
  window.addEventListener('pointercancel', function () { ptr = null; });
  wrap.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  wrap.style.touchAction = 'none';
  // the board is drawn left to right in every language, so the arrows are never flipped
  var KEYDIR = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', ' ': 'up' };
  window.addEventListener('keydown', function (e) {
    if (document.querySelector('.ch-scrim') || e.repeat) return;
    if (e.target && e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
    var dir = KEYDIR[e.key] || (C.keyIs(e, 'w') ? 'up' : C.keyIs(e, 's') ? 'down' : C.keyIs(e, 'a') ? 'left' : C.keyIs(e, 'd') ? 'right' : null);
    if (dir) {
      e.preventDefault();
      if (waiting) go(); else doHop(dir);
    } else if (C.keyIs(e, 'r')) { e.preventDefault(); newRun(); }
  });
  // a run waits while the app is away, and comes back waiting for a tap
  C.onPause(function () { paused = true; if (S && !ended) waiting = true; ctx.save(); renderStatus(); });
  C.onResume(function () { paused = false; kick(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { if (S && !ended) { waiting = true; renderStatus(); } } else kick(); });
  if (window.ResizeObserver) new ResizeObserver(function () { draw(); }).observe(box);
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw); } catch (er) { /* old WebViews */ } }
  // the floating words use the app's font, which may arrive after the first frame
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { draw(); });

  /* --------------------------------------------------------------- help */

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [kb('← ↑ → ↓ / W A S D', C.t('kHop')), kb('Space', C.t('kFwd')), kb('R', C.t('kAgain'))])
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  // little pictures for the tutorial: a hedgehog, a strip of road or river, burrows
  var SVG_HOG = function (x, y) {
    return '<g transform="translate(' + x + ',' + y + ')"><circle r="11" fill="#5A3A24"/><path d="M-11 0 L-15 -4 L-11 -6 L-13 -11 L-7 -10 L-6 -15 L0 -11 L6 -15 L7 -10 L13 -11 L11 -6 L15 -4 L11 0 Z" fill="#5A3A24" transform="rotate(180)"/><circle r="9" fill="#8B5E3C"/><ellipse cy="-6" rx="6" ry="6" fill="#EFCFA4"/><path d="M-3 -10 L0 -15 L3 -10Z" fill="#EFCFA4"/><circle cy="-14.5" r="2" fill="#241A15"/><circle cx="-3" cy="-7" r="1.3" fill="#241A15"/><circle cx="3" cy="-7" r="1.3" fill="#241A15"/></g>';
  };
  function tArt(kind) {
    var s = '<svg viewBox="0 0 200 120" width="100%" direction="ltr"><rect width="200" height="120" rx="10" fill="#EFE2F8"/>';
    if (kind === 1) {
      s += '<rect x="10" y="20" width="180" height="60" fill="#56535F"/><rect x="10" y="49" width="180" height="2" fill="#fff" opacity=".6"/>' +
        '<rect x="30" y="26" width="34" height="20" rx="6" fill="#E2584D"/><rect x="120" y="55" width="50" height="20" rx="5" fill="#3E8FD6"/>' +
        '<rect x="10" y="80" width="180" height="30" fill="#A8CF88"/>' + SVG_HOG(100, 95) +
        '<path d="M100 78 v-18 M94 66 l6 -7 6 7" stroke="' + ACCENT + '" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
    } else if (kind === 2) {
      s += '<rect x="10" y="20" width="180" height="80" fill="#74B2DA"/><rect x="24" y="30" width="110" height="24" rx="12" fill="#93623C"/>' +
        '<g fill="#3D8C58"><ellipse cx="120" cy="80" rx="13" ry="11"/><ellipse cx="148" cy="80" rx="13" ry="11"/></g>' +
        '<ellipse cx="176" cy="80" rx="13" ry="11" fill="#3D8C58" opacity=".35"/>' + SVG_HOG(70, 42);
    } else {
      s += '<rect x="10" y="20" width="180" height="40" fill="#4F8443"/>' +
        [30, 70, 110, 150].map(function (x, i) { return '<rect x="' + (x + 2) + '" y="24" width="36" height="34" rx="14" fill="#A07A55"/><ellipse cx="' + (x + 20) + '" cy="44" rx="13" ry="12" fill="#3A2A1F"/>' + (i < 2 ? '<circle cx="' + (x + 20) + '" cy="44" r="9" fill="#8B5E3C"/>' : ''); }).join('') +
        '<rect x="10" y="60" width="180" height="50" fill="#74B2DA"/><rect x="100" y="76" width="80" height="22" rx="11" fill="#93623C"/>' + SVG_HOG(130, 87) +
        '<path d="M130 72 v-6" stroke="' + ACCENT + '" stroke-width="3" stroke-linecap="round"/>';
    }
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: tArt(1) },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: tArt(2) },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: tArt(3) }
  ];

  /* -------------------------------------------------------------- start */

  // A run in progress is saved after each burrow and each lost life and when the app
  // goes away; the daily run has its own slot
  ctx.autosave(function () {
    if (!S || S.over || ended) return { inProgress: false };
    return { s: E.snapshot(S), seed: seed, tries: tries, daily: dailyDate || null, elapsed: Date.now() - startedAt };
  });
  function resumeRun(sv) {
    var R = E.restore(sv.s);
    if (!R || R.over) return false;
    S = R; seed = sv.seed; tries = sv.tries || 1; startedAt = Date.now() - (sv.elapsed || 0);
    ended = false; waiting = true; last = 0; acc = 0;
    renderTop(); renderStatus(); draw(); kick();
    return true;
  }
  var saved = ctx.loadSave();
  if (dailyDate) {
    if (!(saved && saved.s && saved.daily === dailyDate && resumeRun(saved))) newRun();
    if (C.stats.dailyDone('crossing', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).crossing;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
    }
  } else if (!(saved && saved.s && !saved.daily && resumeRun(saved))) {
    newRun();
  }
  ctx.tutorialIfNew(TUT);
})();
</script>
</body>
