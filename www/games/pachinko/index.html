<style>
  /* the board (100 × 150) with the power dial under it (16 more), in every window */
  .pc-wrap > .ch-fit { --fit-ar: calc(100 / 166); }
  .ch-fit > .pc-box { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
  /* drawn left to right in every language; the launch lane is on the left in all of them */
  .pc-canvas { display: block; width: 100%; height: 100%; touch-action: none; direction: ltr; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .pc-top { display: flex; justify-content: center; align-items: center; gap: var(--s-2); flex-wrap: wrap; }
  .pc-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: var(--c-surface-2); font-weight: 700; font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }
  .pc-chip--open { background: var(--c-accent); color: var(--c-accent-ink); }
  .pc-goals { display: flex; justify-content: center; gap: var(--s-2); flex-wrap: wrap; }
  .pc-goal { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--c-line); font-size: var(--fs-sm); color: var(--c-text-dim); font-variant-numeric: tabular-nums; }
  .pc-goal svg { opacity: .45; }
  .pc-goal--on { border-color: var(--c-gold); color: var(--c-text); }
  .pc-goal--on svg { opacity: 1; fill: currentColor; color: var(--c-gold); }
  /* two lines of room, so a longer hint never moves the board under a finger */
  .pc-status { min-height: 2.8em; font-weight: 700; color: var(--c-text-dim); text-align: center; font-size: var(--fs-sm); }
  .pc-levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--s-2); }
  .pc-lv {
    min-height: 56px; border: 2px solid transparent; border-radius: var(--r-md);
    background: var(--c-surface-2); color: var(--c-text); font: inherit; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    touch-action: manipulation;
  }
  .pc-lv b { font-size: var(--fs-lg); font-variant-numeric: tabular-nums; }
  .pc-lv--on { border-color: var(--game); }
  .pc-lv--done { background: var(--game-soft); }
  .pc-lv[disabled] { opacity: .45; cursor: default; }
  .pc-lv__stars { display: flex; gap: 1px; color: var(--c-gold); }
</style>

<body>
<script src="../../version.js"></script>
<script src="../../lib/chogan.js"></script>
<script>
/* ==== ENGINE START ==== */
function PachinkoEngineFactory() {
  'use strict';
  // every global lookup is several times slower inside the test sandbox, so the hot
  // maths are local names (the group took 36 s with Math.* in the step loop)
  var sqrt = Math.sqrt, floor = Math.floor, ceil = Math.ceil, abs = Math.abs, max = Math.max, imul = Math.imul;

  // Board units, y down: 100 across and 150 tall. One fixed step of 1/120 s and no
  // trigonometry or randomness in the simulation, so the same launch strength at the
  // same moment takes the same path on every device, and a board can be learnt (#949).
  var W = 100, H = 150, R = 1.5, PR = 0.7, DT = 1 / 120, G = 220;
  var E_PIN = 0.5, E_WALL = 0.35, FRICT = 0.03, RAIL_DRAG = 0.0012;
  // the launch lane on the left: a guide wall at GX, then a guide arc of radius ARC_R
  // round the dome's centre (CX, CY); the dome itself has radius DOME
  var GX = 6, GW = 0.5, CX = 50, CY = 50, DOME = 50, ARC_R = 44, ARC_T = 0.65;
  var START_X = 2.75, START_Y = 147;
  // launch speed for strength 0 and 100: the weakest falls back down the lane, the
  // strongest rides the dome all the way over to the right wall
  var VMIN = 252, VMAX = 283;
  var BALLS = 25, FOUL_MAX = 25, GAP = 300, TUL = 720, CAP = 30 * 120, LEVELS = 10;
  // windmills turn a quarter (they are crosses, so a quarter looks the same) every
  // MILL_P steps; the skilled player is modelled at PH moments of that turn
  var MILL_P = 120, PH = 4, SLOT = MILL_P / PH;
  var STAR_K = [0.35, 0.65, 0.9], AIM = 1, START_BONUS = 30;

  function rng(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = imul(t ^ (t >>> 15), t | 1);
      t ^= t + imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  // a quarter turn as MILL_P unit vectors, by repeated small rotations (a short series
  // for the step's cosine and sine, renormalised each time), so no Math.sin is needed
  var TURN = (function () {
    var x = Math.PI / 2 / MILL_P, c = 1 - x * x / 2 + x * x * x * x / 24, s = x - x * x * x / 6 + x * x * x * x * x / 120;
    var out = [], ux = 1, uy = 0;
    for (var i = 0; i < MILL_P; i++) {
      out.push([ux, uy]);
      var nx = ux * c - uy * s, ny = ux * s + uy * c, l = sqrt(nx * nx + ny * ny);
      ux = nx / l; uy = ny / l;
    }
    return out;
  })();
  // a blade's angular speed in radians a second, before its direction
  var MILL_W = (Math.PI / 2 / MILL_P) * 120;
  function millDir(m, clock) {
    var k = ((clock * m.dir + m.ph) % MILL_P + MILL_P) % MILL_P;
    return TURN[k];
  }

  // distance from (x, y) to a segment; the answer goes into one reused object, since a
  // step asks this thousands of times
  var SQ = { d: 0, ex: 0, ey: 0, px: 0, py: 0 };
  function segTo(ax, ay, bx, by, x, y) {
    var dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
    var t = l2 ? clamp(((x - ax) * dx + (y - ay) * dy) / l2, 0, 1) : 0;
    var px = ax + dx * t, py = ay + dy * t, ex = x - px, ey = y - py;
    SQ.d = sqrt(ex * ex + ey * ey); SQ.ex = ex; SQ.ey = ey; SQ.px = px; SQ.py = py;
    return SQ;
  }
  function segDist(s, x, y) { return segTo(s.ax, s.ay, s.bx, s.by, x, y); }

  // the guide arc, a polyline on the circle from the rational parametrisation
  function guide() {
    var segs = [{ ax: GX, ay: H, bx: GX, by: CY, r: GW, k: 'guide' }], N = 22, px = GX, py = CY;
    for (var i = 1; i <= N; i++) {
      var t = ARC_T * i / N, c = (1 - t * t) / (1 + t * t), s = 2 * t / (1 + t * t);
      var x = CX - ARC_R * c, y = CY - ARC_R * s;
      segs.push({ ax: px, ay: py, bx: x, by: y, r: GW, k: 'guide' });
      px = x; py = y;
    }
    return segs;
  }
  var GUIDE = guide(), ARC_END = [GUIDE[GUIDE.length - 1].bx, GUIDE[GUIDE.length - 1].by];
  // the stop on the dome's right shoulder: a ball strong enough to ride over the top
  // strikes it and is thrown back into the field, the harder the further left, instead
  // of riding the dome all the way down the right wall
  var STOP = { ax: 88.3, ay: 17.9, bx: 83.7, by: 21.8, r: 0.9, k: 'stop' }, E_STOP = 0.55;

  // Board parameters by level: denser pins, then windmills from board 3 (two from 6),
  // rails from 4 and more fixed pockets. Level 0 is the daily board's mix.
  function params(level) {
    var k = (level | 0) === 0 ? 5 : clamp(level | 0, 1, LEVELS) - 1;
    return { holes: max(0.06, 0.26 - 0.022 * k), mills: k >= 5 ? 2 : k >= 2 ? 1 : 0, rails: k >= 3 ? (k >= 7 ? 2 : 1) : 0, pockets: k >= 4 ? 4 : 3 };
  }

  function pocket(x, y, v, kind) { return { x: x, y: y, v: v, kind: kind, w: kind === 'start' ? 2.3 : kind === 'tulip' ? 2.6 : 2.4 }; }

  /* One board from a seed and a level: the tulip in the middle, the start pocket off to
     one side above it, fixed pockets, windmills and rails, and brass pins on a staggered
     grid with seeded holes. Pins too close to anything else go, so no ball can wedge. */
  function make(seed, level) {
    seed = seed >>> 0;
    var r = rng(seed), P = params(level), pins = [], segs = GUIDE.slice(), mills = [], pockets = [], i;
    var side = r() < 0.5 ? -1 : 1;
    pockets.push(pocket(50, 118 + floor(r() * 4), 40, 'tulip'));
    pockets.push(pocket(50 + side * (16 + floor(r() * 10)), 80 + floor(r() * 10), 10, 'start'));
    var spots = [[22, 58], [78, 58], [18, 128], [82, 128], [36, 98], [64, 98]];
    // a fixed shuffle of the spots by the board's own generator
    for (i = spots.length - 1; i > 0; i--) { var j = floor(r() * (i + 1)), t = spots[i]; spots[i] = spots[j]; spots[j] = t; }
    var vals = [30, 20, 20, 10];
    for (i = 0; i < P.pockets - 1; i++) {
      var sp = spots[i], px = sp[0] + floor(r() * 5) - 2, py = sp[1] + floor(r() * 5) - 2;
      // keep clear of the start pocket
      var st = pockets[1];
      if (abs(px - st.x) < 12 && abs(py - st.y) < 12) px += px < st.x ? -10 : 10;
      pockets.push(pocket(clamp(px, 16, 90), py, vals[i], 'fix'));
    }
    for (i = 0; i < P.mills; i++) {
      var mx = P.mills === 2 ? (i ? 70 : 30) : 50 - side * 22, my = P.mills === 2 ? 40 + floor(r() * 6) : 44 + floor(r() * 8);
      mills.push({ x: mx, y: my, L: 4.6, dir: i ? -1 : 1, ph: floor(r() * MILL_P) });
    }
    for (i = 0; i < P.rails; i++) {
      var left = i ? side > 0 : side < 0, ry = 64 + floor(r() * 30), len = 10 + floor(r() * 6);
      // short rails sloping down off a wall, turning balls back toward the middle
      segs.push(left ? { ax: GX + GW, ay: ry, bx: GX + GW + len, by: ry + len * 0.45, r: 0.6, k: 'rail' } : { ax: W, ay: ry, bx: W - len, by: ry + len * 0.45, r: 0.6, k: 'rail' });
    }
    pockets.forEach(function (p) {
      var w = p.w;
      // the cup under each pocket's rim, so a ball only goes in from above
      segs.push({ ax: p.x - w, ay: p.y, bx: p.x - w, by: p.y + 3.2, r: 0.5, k: 'cup' });
      segs.push({ ax: p.x + w, ay: p.y, bx: p.x + w, by: p.y + 3.2, r: 0.5, k: 'cup' });
      segs.push({ ax: p.x - w, ay: p.y + 3.2, bx: p.x + w, by: p.y + 3.2, r: 0.5, k: 'cup' });
    });
    // the field: a staggered grid inside the guide arc and the walls
    for (var row = 0; row * 5 + 20 <= 141; row++) {
      var y = 20 + row * 5, odd = row % 2 === 1;
      for (var x = odd ? 12 : 9; x <= 96; x += 6) {
        var dx = x - CX, dy = y - CY;
        if (y < CY && dx * dx + dy * dy > 38.5 * 38.5) continue;
        if (x < GX + GW + PR + 2 * R + 0.6) continue;
        if (row >= 2 && r() < P.holes) continue;
        pins.push({ x: x, y: y, r: PR });
      }
      // half pins on the right wall and on the lane's guide, so no ball can slide down a wall
      if (y >= CY - 2 && !odd) pins.push({ x: W, y: y, r: PR });
      if (y > CY + 2 && odd) pins.push({ x: GX + GW, y: y, r: PR });
    }
    var clear = 2 * R + PR + 0.6;
    pins = pins.filter(function (p) {
      for (var a = 0; a < pockets.length; a++) {
        var q = pockets[a], reach = q.kind === 'tulip' ? 8.5 : q.w + 0.6;
        if (abs(p.x - q.x) < reach + clear && p.y > q.y - (q.kind === 'tulip' ? 6.5 : 0.8) - clear && p.y < q.y + 3.7 + clear) return false;
      }
      for (var m = 0; m < mills.length; m++) {
        var ex = p.x - mills[m].x, ey = p.y - mills[m].y, rr = mills[m].L + 0.5 + clear;
        if (ex * ex + ey * ey < rr * rr) return false;
      }
      for (var s = GUIDE.length; s < segs.length; s++) if (segDist(segs[s], p.x, p.y).d < segs[s].r + PR + 2 * R + 0.6) return false;
      return true;
    });
    // the pocket rims are pins of their own, and so are the windmill hubs
    pockets.forEach(function (p) { pins.push({ x: p.x - p.w, y: p.y, r: 0.6, rim: true }); pins.push({ x: p.x + p.w, y: p.y, r: 0.6, rim: true }); });
    var tu = pockets[0];
    var B = {
      seed: seed, level: level | 0, pins: pins, segs: segs, mills: mills, pockets: pockets, side: side,
      wings: {
        shut: [{ ax: tu.x - tu.w, ay: tu.y, bx: tu.x - tu.w, by: tu.y - 4.5, r: 0.6, k: 'wing' }, { ax: tu.x + tu.w, ay: tu.y, bx: tu.x + tu.w, by: tu.y - 4.5, r: 0.6, k: 'wing' }],
        open: [{ ax: tu.x - tu.w, ay: tu.y, bx: tu.x - 7.6, by: tu.y - 5.4, r: 0.6, k: 'wing' }, { ax: tu.x + tu.w, ay: tu.y, bx: tu.x + 7.6, by: tu.y - 5.4, r: 0.6, k: 'wing' }]
      }
    };
    index(B);
    return B;
  }

  function cellKey(gx, gy) { return (gx + 2) * 40 + gy + 2; }
  // pins bucketed by 6-unit cells, so a step looks at a handful, not hundreds
  function index(B) {
    var cells = [];
    B.pins.forEach(function (p, n) {
      var k = cellKey(floor(p.x / 6), floor(p.y / 6));
      (cells[k] = cells[k] || []).push(n);
    });
    B.cells = cells;
    // the long guide is tested only near the lane; the rest of the segments always
    B.near = B.segs.slice(GUIDE.length);
  }

  // bounce off a surface with outward normal (nx, ny) moving at (ux, uy)
  function bounce(b, nx, ny, pen, e, ux, uy, fr) {
    b.x += nx * pen; b.y += ny * pen;
    var rvx = b.vx - ux, rvy = b.vy - uy, vn = rvx * nx + rvy * ny;
    if (vn >= 0) return 0;
    var tx = rvx - vn * nx, ty = rvy - vn * ny;
    b.vx = ux + tx * (1 - fr) - e * vn * nx;
    b.vy = uy + ty * (1 - fr) - e * vn * ny;
    return -vn;
  }

  function strengthSpeed(s) { return VMIN + clamp(s | 0, 0, 100) * (VMAX - VMIN) / 100; }
  function ball(s, clock) { return { x: START_X, y: START_Y, vx: 0, vy: -strengthSpeed(s), s: s | 0, c0: clock | 0, n: 0, still: 0, done: false, res: null, top: false }; }

  /* One step of one ball at board time `clock`, with the tulip open or shut. Events go
     into ev: ['pin', index], ['mill', index]; when the ball ends, b.res is a pocket
     index, -1 for out at the bottom, or -2 for a foul (fell back down the lane). */
  function step(B, b, clock, open, ev) {
    if (b.done) return;
    var sp = sqrt(b.vx * b.vx + b.vy * b.vy), n = max(1, ceil(sp * DT / 0.6)), h = DT / n, touch = false;
    for (var sub = 0; sub < n; sub++) {
      b.vy += G * h;
      b.x += b.vx * h; b.y += b.vy * h;
      var i, d, q;
      // the dome above CY and the walls below it: a ball rides them, losing almost nothing
      if (b.y < CY) {
        var ox = b.x - CX, oy = b.y - CY, od = sqrt(ox * ox + oy * oy);
        if (od > DOME - R) { bounce(b, -ox / od, -oy / od, od - (DOME - R), 0, 0, 0, RAIL_DRAG); touch = true; }
      }
      if (b.x < R) { b.x = R; if (b.vx < 0) b.vx = -b.vx * E_WALL; }
      if (b.x > W - R) { b.x = W - R; if (b.vx > 0) b.vx = -b.vx * E_WALL; touch = true; }
      // the lane's guide, only near it
      if (b.x < GX + 3 || b.y < CY + 2) {
        for (i = 0; i < GUIDE.length; i++) {
          q = segDist(GUIDE[i], b.x, b.y);
          var mg = R + GW;
          if (q.d >= mg) continue;
          d = q.d || 1e-9;
          bounce(b, q.ex / d, q.ey / d, mg - d, b.x < GX ? 0 : E_WALL, 0, 0, b.x < GX ? RAIL_DRAG : FRICT);
          touch = true;
        }
      }
      var cx = floor(b.x / 6), cy = floor(b.y / 6);
      for (var gx = cx - 1; gx <= cx + 1; gx++) {
        for (var gy = cy - 1; gy <= cy + 1; gy++) {
          var cell = B.cells[cellKey(gx, gy)];
          if (!cell) continue;
          for (i = 0; i < cell.length; i++) {
            var p = B.pins[cell[i]], ex = b.x - p.x, ey = b.y - p.y, m = R + p.r;
            if (ex * ex + ey * ey >= m * m) continue;
            d = sqrt(ex * ex + ey * ey) || 1e-9;
            if (bounce(b, ex / d, ey / d, m - d, E_PIN, 0, 0, FRICT) > 14 && ev) ev.push(['pin', cell[i]]);
            touch = true;
          }
        }
      }
      q = segDist(STOP, b.x, b.y);
      if (q.d < R + STOP.r) { d = q.d || 1e-9; bounce(b, q.ex / d, q.ey / d, R + STOP.r - d, E_STOP, 0, 0, FRICT); touch = true; }
      var segs = B.near, wings = open ? B.wings.open : B.wings.shut;
      for (i = 0; i < segs.length + 2; i++) {
        var sg = i < segs.length ? segs[i] : wings[i - segs.length];
        q = segDist(sg, b.x, b.y);
        var ms = R + sg.r;
        if (q.d >= ms) continue;
        d = q.d || 1e-9;
        bounce(b, q.ex / d, q.ey / d, ms - d, E_WALL, 0, 0, FRICT);
        touch = true;
      }
      for (i = 0; i < B.mills.length; i++) {
        var mi = B.mills[i], u = millDir(mi, clock), w = MILL_W * mi.dir;
        for (var arm = 0; arm < 2; arm++) {
          var ux = arm ? -u[1] : u[0], uy = arm ? u[0] : u[1];
          q = segTo(mi.x - ux * mi.L, mi.y - uy * mi.L, mi.x + ux * mi.L, mi.y + uy * mi.L, b.x, b.y);
          var mm = R + 0.5;
          if (q.d >= mm) continue;
          d = q.d || 1e-9;
          // the blade's own speed where the ball touches it
          var rx = q.px - mi.x, ry = q.py - mi.y;
          if (bounce(b, q.ex / d, q.ey / d, mm - d, E_PIN, -w * ry, w * rx, FRICT) > 10 && ev) ev.push(['mill', i]);
          touch = true;
        }
      }
      // in a pocket: below its rim and between its walls
      for (i = 0; i < B.pockets.length; i++) {
        var pk = B.pockets[i];
        if (b.y > pk.y + 0.3 && b.y < pk.y + 3.2 && abs(b.x - pk.x) < pk.w) { b.res = i; b.done = true; return; }
      }
      if (b.y > H - R && b.x > GX) { b.res = -1; b.done = true; return; }
      if (b.x < GX && b.y > START_Y - 6 && b.vy > 0) { b.res = -2; b.done = true; return; }
    }
    b.n++;
    // a ball balanced on something is nudged toward the middle, always the same way
    if (touch && b.x > GX && abs(b.vx) + abs(b.vy) < 3) b.still++; else b.still = 0;
    if (b.still > 24) { b.vx += b.x < CX ? 6 : -6; b.still = 0; }
    if (b.n >= CAP) { b.res = -1; b.done = true; }
  }

  function value(B, res) { return res >= 0 ? B.pockets[res].v : 0; }

  // one ball alone from its launch to its end, with the tulip held open or shut
  function run(B, s, clock, open) {
    var b = ball(s, clock), c = clock | 0;
    while (!b.done) { step(B, b, c, open, null); c++; }
    return b;
  }

  /* ------------------------------------------------------------ rounds */

  function round(B) { return { B: B, clock: 0, tray: BALLS, fly: [], shots: [], score: 0, fouls: 0, tulipUntil: 0, hits: [], last: -1 }; }
  function canFire(Rd) { return Rd.tray > 0 && Rd.shots.length < BALLS + FOUL_MAX && (Rd.last < 0 || Rd.clock - Rd.last >= GAP); }
  function fire(Rd, s) {
    if (!canFire(Rd) || s !== (s | 0) || s < 0 || s > 100) return null;
    var b = ball(s, Rd.clock);
    Rd.shots.push([s, Rd.clock]); Rd.tray--; Rd.last = Rd.clock;
    Rd.fly.push(b);
    return b;
  }
  function tulipOpen(Rd) { return Rd.clock < Rd.tulipUntil; }
  /* One step of the board: every ball in flight in launch order, then the clock. Returns
     the events, with ['end', ball, result, points] for each ball that finished. */
  function tick(Rd) {
    var ev = [], open = tulipOpen(Rd), keep = [];
    for (var i = 0; i < Rd.fly.length; i++) {
      var b = Rd.fly[i];
      step(Rd.B, b, Rd.clock, open, ev);
      if (!b.done) { keep.push(b); continue; }
      var v = value(Rd.B, b.res);
      if (b.res === -2) {
        // a ball that falls back down the lane comes back to the tray, up to a limit
        Rd.fouls++;
        if (Rd.fouls <= FOUL_MAX) Rd.tray++;
      } else {
        Rd.score += v;
        Rd.hits.push(b.res);
        if (b.res >= 0 && Rd.B.pockets[b.res].kind === 'start') Rd.tulipUntil = max(Rd.tulipUntil, Rd.clock + TUL);
      }
      ev.push(['end', b, b.res, v]);
    }
    Rd.fly = keep;
    Rd.clock++;
    return ev;
  }
  function over(Rd) { return Rd.tray === 0 && Rd.fly.length === 0; }

  // a round is saved as its shots (strength and moment) and its clock, and restored by
  // playing them again, so a save can never claim a score the board did not give
  function snapshot(Rd) { return { seed: Rd.B.seed, level: Rd.B.level, shots: Rd.shots.map(function (x) { return [x[0], x[1]]; }), clock: Rd.clock }; }

  }

  /* --------------------------------------------------------------- help */

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    holding = false; drag = null;
    var keys = [kb('← → / A D', C.t('pcKPower')), kb('Shift + ← →', C.t('pcKFar')), kb('Space / Enter', C.t('pcKFire'))];
    if (!dailyDate) keys.push(kb('L', C.t('pcChoose')), kb('R', C.t('pcKAgain')));
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('pcRules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, keys)
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  function tArt(kind) {
    var s = '<svg viewBox="0 0 200 120" width="100%" direction="ltr"><rect width="200" height="120" rx="10" fill="#ECE4FB"/>', x, y;
    s += '<path d="M60 112 V52 A40 40 0 0 1 140 52 V112" fill="#FBF8FF" stroke="#D7CBF0" stroke-width="2"/>';
    s += '<path d="M66 112 V54 A34 34 0 0 1 128 36" fill="none" stroke="#A87A22" stroke-width="2"/>';
    for (y = 0; y < 5; y++) for (x = 0; x < 6; x++) { var px = 74 + x * 11 + (y % 2) * 5.5, py = 50 + y * 11; if (px < 136) s += '<circle cx="' + px + '" cy="' + py + '" r="1.8" fill="#B8862B"/>'; }
    if (kind === 1) s += '<circle cx="63" cy="80" r="3.2" fill="#fff" stroke="#3E414C"/><path d="M63 72 V60" stroke="' + ACCENT + '" stroke-width="2.5" stroke-linecap="round"/><path d="M58 64 L63 58 L68 64" stroke="' + ACCENT + '" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="160" cy="70" r="14" fill="' + ACCENT + '" fill-opacity=".18"/><circle cx="160" cy="70" r="6" fill="' + ACCENT + '"/>';
    if (kind === 2) s += '<rect x="30" y="100" width="140" height="6" rx="3" fill="#E2D8F6"/><rect x="30" y="100" width="88" height="6" rx="3" fill="' + ACCENT + '"/><circle cx="118" cy="103" r="7" fill="#fff" stroke="' + ACCENT + '" stroke-width="2"/>' +
      '<path d="M100 18 Q120 24 112 44" stroke="' + ACCENT + '" stroke-width="2" stroke-dasharray="3 3" fill="none"/><circle cx="112" cy="46" r="3.2" fill="#fff" stroke="#3E414C"/>';
    if (kind === 3) s += '<path d="M93 96 L86 86 M107 96 L114 86" stroke="#EC407A" stroke-width="3" stroke-linecap="round"/><path d="M93 96 V102 H107 V96" stroke="#8E6A1E" stroke-width="2" fill="none"/>' +
      '<path d="M128 80 V86 H140 V80" stroke="#2E9E4F" stroke-width="2" fill="none"/><circle cx="134" cy="82" r="3" fill="#fff" stroke="#3E414C"/><path d="M126 76 Q112 74 108 88" stroke="#2E9E4F" stroke-width="1.5" stroke-dasharray="2 3" fill="none"/>';
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('pcTut1'), text: C.t('pcTutText1'), art: tArt(1) },
    { title: C.t('pcTut2'), text: C.t('pcTutText2'), art: tArt(2) },
    { title: C.t('pcTut3'), text: C.t('pcTutText3'), art: tArt(3) }
  ];

  /* -------------------------------------------------------------- start */

  // saved at every launch and on pause: the shots and the board clock, replayed on return,
  // so balls in flight come back exactly where they were
  ctx.autosave(function () {
    if (!Rd || ended || E.over(Rd) || Rd.shots.length === 0) return { inProgress: false };
    return { r: E.snapshot(Rd), daily: dailyDate || null, tries: tries, last: lastPow, elapsed: Date.now() - startedAt };
  });
  function resume(sv) {
    if (!sv || typeof sv !== 'object' || (sv.daily || null) !== (dailyDate || null)) return false;
    var R = E.restore(sv.r);
    if (!R) return false;
    // a save must be on the board it claims: the day's board, or an open campaign board
    if (dailyDate ? R.B.seed !== dailySeed || R.B.level !== 0 : R.B.level < 1 || R.B.seed !== E.level(R.B.level).seed || R.B.level > prog.unlocked) return false;
    if (!dailyDate) R.B.th = E.level(R.B.level).th;
    Rd = R;
    tries = sv.tries >= 1 ? sv.tries | 0 : 1;
    startedAt = Date.now() - (sv.elapsed > 0 ? sv.elapsed : 0);
    begin();
    lastPow = sv.last === (sv.last | 0) && sv.last >= 0 && sv.last <= 100 ? sv.last : null;
    if (!dailyDate) { prog.cur = Rd.B.level; saveProg(); }
    renderSide(); draw();
    return true;
  }
  var saved = ctx.loadSave();
  if (!(saved && resume(saved))) startRound(dailyDate ? 0 : prog.cur);
  if (dailyDate && C.stats.dailyDone('pachinko', dailyDate)) {
    var rec = C.stats.dailyOf(dailyDate).pachinko;
    C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
  }
  ctx.tutorialIfNew(TUT);
})();
</script>
