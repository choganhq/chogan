<script>
/* ==== ENGINE START ==== */
function TwinLanesEngineFactory() {
  'use strict';

  // Four lanes across the road: the left car keeps to lanes 0 and 1, the right car to
  // 2 and 3. Distances run along the road in lane widths; the cars sit at S.dist.
  var DT = 1 / 60, LANES = 4, STAGES = 5, LIVES = 3;
  // lane widths a second, one speed a stage
  var SPEED = [3.6, 4.3, 5.0, 5.7, 6.4];
  // seconds of stars and barriers in a stage, quiet seconds after it, and how far ahead
  // of the cars a stage's first object starts (off the screen)
  var STAGE_S = 40, GAP_S = 2, LEAD = 7;
  // The fewest seconds between two objects on one side. A lane change takes SWITCH
  // ticks, so even the fifth stage leaves a thumb more than three times that.
  var MIN_SAME = [0.9, 0.8, 0.7, 0.62, 0.55];
  var STEP_LO = [0.55, 0.48, 0.42, 0.37, 0.33], STEP_HI = [0.85, 0.75, 0.65, 0.57, 0.5];
  var SWITCH = 9, HIT_X = 0.6;

  function mulberry(sd) {
    var a = sd >>> 0;
    return function () { a = (a + 0x6D2B79F5) >>> 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function sideOf(lane) { return lane < 2 ? 0 : 1; }

  // A whole course from one seed, so a saved run stores only the seed. Each event asks
  // one side for one lane: a star in it, a barrier in the other lane, or both. The two
  // sides take turns three times in four, and a side never gets two events closer
  // than MIN_SAME, so every course can be driven without a mistake.
  function makeCourse(seed) {
    var rnd = mulberry(seed), objs = [], ends = [], starts = [], d0 = 0;
    for (var s = 0; s < STAGES; s++) {
      var v = SPEED[s], base = d0 + LEAD, t = 0, lastT = [-9, -9], side = rnd() < 0.5 ? 0 : 1;
      starts.push(d0);
      for (;;) {
        t += STEP_LO[s] + rnd() * (STEP_HI[s] - STEP_LO[s]);
        if (rnd() < 0.75) side = 1 - side;
        var at = Math.max(t, lastT[side] + MIN_SAME[s]);
        if (at > STAGE_S) break;
        t = at; lastT[side] = at;
        var need = side * 2 + (rnd() < 0.5 ? 0 : 1), other = side * 2 + (need === side * 2 ? 1 : 0), r = rnd();
        var d = base + at * v;
        if (r < 0.85) objs.push({ d: d, lane: need, kind: 'star' });
        if (r >= 0.5) objs.push({ d: d, lane: other, kind: 'block' });
      }
      d0 = base + (STAGE_S + GAP_S) * v;
      ends.push(d0);
    }
    return { objs: objs, ends: ends, starts: starts };
  }

  function fromSeed(seed) {
    return {
      seed: seed >>> 0, course: makeCourse(seed >>> 0), tick: 0, dist: 0, stage: 0, idx: 0,
      lane: [0, 3], x: [0.5, 3.5], lives: LIVES, score: 0, stars: 0, lost: 0, stageLost: 0,
      over: false, won: false, ev: []
    };
  }
  function newGame(rnd) { return fromSeed(Math.floor(rnd() * 4294967296)); }

  function lose(S, side, why, i) {
    S.lives--; S.lost++; S.stageLost++;
    S.ev.push({ t: why, side: side, i: i });
    if (S.lives <= 0) { S.lives = 0; S.over = true; S.ev.push({ t: 'over' }); }
  }
  // An object is settled the moment it reaches the cars' line: a car still between its
  // two lanes counts as in both, for a star and for a barrier alike.
  function settle(S, o, i) {
    var side = sideOf(o.lane), on = Math.abs(S.x[side] - (o.lane + 0.5)) < HIT_X;
    if (o.kind === 'star') {
      if (on) { S.stars++; S.score += 10; S.ev.push({ t: 'star', side: side, i: i }); }
      else lose(S, side, 'miss', i);
    } else if (on) lose(S, side, 'hit', i);
  }

  function step(S) {
    if (S.over) return;
    S.tick++;
    for (var c = 0; c < 2; c++) {
      var goal = S.lane[c] + 0.5, dx = goal - S.x[c], m = 1 / SWITCH;
      S.x[c] = Math.abs(dx) <= m ? goal : S.x[c] + (dx > 0 ? m : -m);
    }
    S.dist += SPEED[S.stage] * DT;
    var O = S.course.objs;
    while (S.idx < O.length && O[S.idx].d <= S.dist) {
      settle(S, O[S.idx], S.idx);
      S.idx++;
      if (S.over) return;
    }
    if (S.dist >= S.course.ends[S.stage]) {
      S.score += 50 * (S.stage + 1);
      S.ev.push({ t: 'stage', n: S.stage + 1, clean: S.stageLost === 0 });
      if (S.stage + 1 >= STAGES) {
        S.score += 100 * S.lives;
        S.over = true; S.won = true;
        S.ev.push({ t: 'win' });
        return;
      }
      S.stage++; S.stageLost = 0;
    }
  }

  // one tap: the car on that side goes to its other lane (back again if it was moving)
  function toggle(S, side) {
    if (S.over || (side !== 0 && side !== 1)) return false;
    S.lane[side] = side * 2 + (S.lane[side] === side * 2 ? 1 : 0);
    S.ev.push({ t: 'turn', side: side });
    return true;
  }

  // objects from `back` lane widths behind the cars to `ahead` in front, for drawing
  function near(S, back, ahead) {
    var O = S.course.objs, out = [], i = S.idx;
    while (i > 0 && O[i - 1].d > S.dist - back) i--;
    for (; i < O.length && O[i].d < S.dist + ahead; i++) out.push({ i: i, rel: O[i].d - S.dist, lane: O[i].lane, kind: O[i].kind, done: i < S.idx });
    return out;
  }
  // how far through the current stage the cars are, 0 to 1
  function progress(S) {
    var a = S.course.starts[S.stage], b = S.course.ends[S.stage];
    return Math.max(0, Math.min(1, (S.dist - a) / (b - a)));
  }

  function drain(S) { var e = S.ev; S.ev = []; return e; }

  var KEYS = ['tick', 'dist', 'stage', 'idx', 'lives', 'score', 'stars', 'lost', 'stageLost'];
  function snapshot(S) {
    var o = { seed: S.seed, lane: S.lane.slice(), x: S.x.slice(), over: S.over, won: S.won };
    KEYS.forEach(function (k) { o[k] = S[k]; });
    return o;
  }
  function restore(o) {
    if (!o || typeof o.seed !== 'number' || !isFinite(o.seed)) return null;
    if (!KEYS.every(function (k) { return typeof o[k] === 'number' && isFinite(o[k]); })) return null;
    if (o.stage < 0 || o.stage >= STAGES || o.lives < 0 || o.lives > LIVES || o.idx < 0) return null;
    if (!Array.isArray(o.lane) || o.lane.length !== 2 || sideOf(o.lane[0]) !== 0 || sideOf(o.lane[1]) !== 1 || o.lane[0] < 0 || o.lane[1] > 3) return null;
    if (!Array.isArray(o.x) || o.x.length !== 2 || !o.x.every(function (v) { return typeof v === 'number' && v >= 0 && v <= LANES; })) return null;
    var S = fromSeed(o.seed);
    if (o.idx > S.course.objs.length) return null;
    KEYS.forEach(function (k) { S[k] = o[k]; });
    S.lane = o.lane.slice(); S.x = o.x.slice(); S.over = !!o.over; S.won = !!o.won;
    return S;
  }

  return {
    DT: DT, LANES: LANES, STAGES: STAGES, LIVES: LIVES, SPEED: SPEED, STAGE_S: STAGE_S, GAP_S: GAP_S, LEAD: LEAD,
    MIN_SAME: MIN_SAME, SWITCH: SWITCH, HIT_X: HIT_X,
    makeCourse: makeCourse, fromSeed: fromSeed, newGame: newGame, step: step, toggle: toggle,
    near: near, progress: progress, drain: drain, snapshot: snapshot, restore: restore, sideOf: sideOf
  };
}
if (typeof module !== 'undefined') module.exports = TwinLanesEngineFactory;
/* ==== ENGINE END ==== */
</script>

  function seeded(sd) {
    var a = sd >>> 0;
    return function () { a = (a + 0x6D2B79F5) >>> 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  // A run starts waiting for a tap: a reflex game must not begin before the thumbs are ready
  function newRun() {
    seed = Math.floor(Math.random() * 4294967296);
    S = E.newGame(rngFor(seed));
    tries++;
    startedAt = Date.now();
    ended = false; waiting = true; last = 0; acc = 0;
    pop = { text: C.t('stageN', { n: C.num(1) }), t: 1.4 }; fate = {}; flash = [0, 0]; sparks = [];

  }

  function blocked() { return paused || waiting || document.hidden || !!document.querySelector('.ch-scrim'); }
  function tick(now) {
    raf = 0;
    if (!S) return;
    var dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
    last = now;
    var run = !blocked() && !ended;
    if (run) {
      // a fixed step, so a run plays the same on every screen
      acc += dt;
      var n = 0;
      while (acc >= E.DT && n < 8) {

        if (ended) break;

      if (n >= 8) acc = 0;

      flash[0] = Math.max(0, flash[0] - dt * 2); flash[1] = Math.max(0, flash[1] - dt * 2);
      sparks = sparks.filter(function (s) { s.t -= dt * 2.2; return s.t > 0; });

    if (!S || ended || S.over) return;

    if (blocked()) return;
    E.toggle(S, side);

  function events() {
    var ev = E.drain(S), save = false;
    for (var i = 0; i < ev.length; i++) {
      var e = ev[i];
      if (e.t === 'turn') C.audio.sfx('tap');
      else if (e.t === 'star') {
        fate[e.i] = 'got';
        sparks.push({ x: (S.course.objs[e.i].lane + 0.5) * T, side: e.side, t: 1 });
        C.audio.sfx('coin');
      } else if (e.t === 'miss' || e.t === 'hit') {
        fate[e.i] = e.t;
        flash[e.side] = 1;
        C.feedback('bad'); C.haptic('error');
        pop = { text: e.t === 'hit' ? C.t('gotHit') : C.t('missed'), t: 1 };
        save = true;
      } else if (e.t === 'stage') {
        if (e.n < E.STAGES) { C.audio.sfx('win'); pop = { text: C.t('stageN', { n: C.num(e.n + 1) }), t: 1.4 }; }
        save = true;
      } else if (e.t === 'win' || e.t === 'over') {
        ended = true;
        if (e.t === 'win') { C.feedback('good'); C.haptic('success'); }
        ctx.clearSave();
        setTimeout(finish, C.ui.reduceMotion() ? 300 : 1100);

  function finish() {
    var won = S.won, sc = S.score, note = null;
    var coins = won ? 30 : Math.min(24, 1 + S.stage * 5), points = won ? 120 : Math.min(100, 4 + S.stage * 20);
    if (won) C.achievements.unlock('tl-win');
    if (won && S.lost === 0) C.achievements.unlock('tl-clean');
    var lines = [{ label: C.t('ptsL'), value: C.num(sc) }, { label: C.t('stageL'), value: C.num(S.stage + 1) }, { label: C.t('starsL'), value: C.num(S.stars) }];
    if (dailyDate) {
      if (won) C.achievements.unlock('tl-daily');
      if (!C.stats.daily('twinlanes', dailyDate, { label: C.t('ptsN', { n: C.num(sc) }), win: won, tries: tries })) { coins = Math.max(1, Math.round(coins * 0.2)); points = Math.max(1, Math.round(points * 0.2)); }
      lines.push({ label: C.t('tries'), value: C.num(tries) });
    } else {
      if (C.stats.best('twinlanes', 'score', sc) && sc > 0) note = C.t('bestN', { n: C.num(sc) });
      lines.push({ label: C.t('best'), value: C.num(C.stats.getBest('twinlanes', 'score') || sc) });

      won: won,
      title: won ? C.t('bothHome') : C.t('outLives'),
      note: note, timeMs: Date.now() - startedAt, coins: coins, points: points,
      lines: lines,
      shareText: 'چوگان · دوقلو' + (dailyDate ? ('\nروزانه ' + dailyDate) : '') + '\nامتیاز ' + sc,
      paint: function (g, w, h) { paintShare(g, w, h); },
      againLabel: C.t('newRun'),
      onAgain: function () { newRun(); }

  }

    r = Math.min(r, w / 2, h / 2);
    g.beginPath();

    var w = 44, h = 18, x = cx - w / 2, y = cy - h / 2;
    g.fillStyle = P.tyre; g.fillRect(x + 6, y + h - 2, 5, 6); g.fillRect(x + w - 11, y + h - 2, 5, 6);
    g.save();
    rr(g, x, y, w, h, 5); g.clip();
    g.fillStyle = P.stripe; g.fillRect(x, y, w, h);
    g.fillStyle = col;
    for (var k = -2; k < 8; k++) { g.beginPath(); g.moveTo(x + k * 10, y + h); g.lineTo(x + k * 10 + 6, y + h); g.lineTo(x + k * 10 + 6 + h, y); g.lineTo(x + k * 10 + h, y); g.closePath(); g.fill(); }
    g.restore();
    g.strokeStyle = lit ? P.red : 'rgba(0,0,0,.35)'; g.lineWidth = lit ? 3 : 1.5;
    rr(g, x, y, w, h, 5); g.stroke();
  }
  // a small round car from above, leaning into a lane change
  function car(g, cx, cy, col, P, lean, hurt) {
    g.save(); g.translate(cx, cy); g.rotate(lean * 0.35);
    g.fillStyle = 'rgba(0,0,0,.22)'; rr(g, -15, -22, 32, 48, 12); g.fill();
    g.fillStyle = P.tyre;
    [[-17, -15], [11, -15], [-17, 7], [11, 7]].forEach(function (p) { rr(g, p[0], p[1], 6, 11, 2); g.fill(); });
    g.fillStyle = col; rr(g, -14, -24, 28, 46, 12); g.fill();
    g.fillStyle = P.glass; rr(g, -10, -14, 20, 10, 4); g.fill();
    rr(g, -9, 8, 18, 6, 3); g.fill();
    g.fillStyle = 'rgba(255,255,255,.35)'; rr(g, -4, -22, 8, 6, 3); g.fill();
    g.fillStyle = '#FFF4C8'; g.beginPath(); g.arc(-8, -21, 2.4, 0, Math.PI * 2); g.arc(8, -21, 2.4, 0, Math.PI * 2); g.fill();
    if (hurt > 0) { g.strokeStyle = P.red; g.globalAlpha = hurt; g.lineWidth = 4; rr(g, -18, -28, 36, 54, 14); g.stroke(); g.globalAlpha = 1; }
    g.restore();
  }

  function scene(g, P, t) {
    var i;
    g.fillStyle = P.road; g.fillRect(0, 0, VW, VH);
    // each side its own faint tint, so the two halves read as two roads
    g.fillStyle = P.road2; g.fillRect(VW / 2, 0, VW / 2, VH);
    g.fillStyle = P.edge; g.fillRect(0, 0, 3, VH); g.fillRect(VW - 3, 0, 3, VH);
    var off = S ? (S.dist * T) % 40 : 0;
    // dashes within each side scroll with the road; the middle is one solid double line
    g.fillStyle = P.line;
    [T, 3 * T].forEach(function (x) { for (i = -1; i < VH / 40 + 1; i++) g.fillRect(x - 1.5, i * 40 + off, 3, 22); });
    g.fillStyle = P.mid; g.fillRect(VW / 2 - 4, 0, 2.5, VH); g.fillRect(VW / 2 + 1.5, 0, 2.5, VH);
    if (!S) return;
    var objs = E.near(S, VH / T, CAR_Y / T + 1);
    for (i = 0; i < objs.length; i++) {
      var o = objs[i], f = fate[o.i];
      if (o.kind === 'star' && f === 'got') continue;
      var side = E.sideOf(o.lane), cx = (o.lane + 0.5) * T, cy = CAR_Y - o.rel * T;
      if (o.kind === 'star') star(g, cx, cy, P.star[side], P, t, f === 'miss');
      else barrier(g, cx, cy, P.cars[side], P, f === 'hit');
    }
  }
  function drawCars(g, P) {
    for (var c = 0; c < 2; c++) {
      var goal = S.lane[c] + 0.5, lean = Math.max(-1, Math.min(1, (goal - S.x[c]) * 2));
      car(g, S.x[c] * T, CAR_Y, P.cars[c], P, lean, flash[c]);
    }
    sparks.forEach(function (s) {
      g.strokeStyle = P.star[s.side]; g.globalAlpha = s.t; g.lineWidth = 3;
      for (var k = 0; k < 6; k++) {
        var a = k * Math.PI / 3, r1 = 14 + (1 - s.t) * 18, r2 = r1 + 7;
        g.beginPath(); g.moveTo(s.x + Math.cos(a) * r1, CAR_Y - 6 + Math.sin(a) * r1); g.lineTo(s.x + Math.cos(a) * r2, CAR_Y - 6 + Math.sin(a) * r2); g.stroke();
      }
      g.globalAlpha = 1;
    });
  }

  function font() { return getComputedStyle(document.body).fontFamily || 'sans-serif'; }
  function label(g, P, text, y, size, alpha) {
    g.globalAlpha = alpha;
    g.font = '800 ' + size + 'px ' + font(); g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = 5; g.strokeStyle = P.shade; g.strokeText(text, VW / 2, y, VW - 16);
    g.fillStyle = P.text; g.fillText(text, VW / 2, y, VW - 16);
    g.globalAlpha = 1;
  }

  // reads the box as last laid out; the same size is used to map taps (#1019 bowling)
  var view = { w: 0, h: 0 };
  function draw() {
    if (!S) return;
    var r = box.getBoundingClientRect(), W = Math.max(60, Math.round(r.width)), H = Math.max(100, Math.round(r.height));
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    // both sides: a new canvas is 300×150 (#359)
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    view.w = W; view.h = H;
    var g = cv.getContext('2d'), P = palette(dark()), t = S.tick * E.DT, k = Math.min(W / VW, H / VH);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    g.translate((W - VW * k) / 2, (H - VH * k) / 2); g.scale(k, k);
    g.save();
    rr(g, 0, 0, VW, VH, 14); g.clip();
    scene(g, P, t);
    drawCars(g, P);
    // how far through the stage: a thin bar along the top
    g.fillStyle = P.bar; g.fillRect(0, 0, VW, 6);
    g.fillStyle = P.mid; g.fillRect(0, 0, VW * E.progress(S), 6);
    if (waiting && !ended) {
      g.fillStyle = P.veil; g.fillRect(0, 0, VW, VH);
      // a thumb mark in each half says where to tap
      [VW / 4, 3 * VW / 4].forEach(function (x, c) {
        g.strokeStyle = P.cars[c]; g.lineWidth = 4;
        g.beginPath(); g.arc(x, CAR_Y - 110, 24, 0, Math.PI * 2); g.stroke();
        g.globalAlpha = 0.35; g.fillStyle = P.cars[c]; g.beginPath(); g.arc(x, CAR_Y - 110, 24, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1;
      });
      label(g, P, C.t('tapGo'), VH * 0.32, 22, 1);
    }
    if (pop) label(g, P, pop.text, VH * 0.42 - (1 - Math.min(1, pop.t)) * 10, 26, Math.max(0, Math.min(1, pop.t * 2)));
    g.restore();
  }

  // the share card: the road as the run ended
  function paintShare(g, w, h) {
    var P = palette(dark());
    g.fillStyle = P.road; g.fillRect(0, 0, w, h);
    var k = Math.min(w / VW, h / VH);
    g.save();
    g.translate((w - VW * k) / 2, (h - VH * k) / 2); g.scale(k, k);
    scene(g, P, S.tick * E.DT);
    drawCars(g, P);
    g.restore();
  }

  /* ----------------------------------------------------------------- ui */

  function renderTop() {
    top.innerHTML = '';
    if (dailyDate) top.appendChild(el('span', { class: 'ch-badge ch-badge--accent' }, [C.icon('calendar', 14), el('span', { text: C.t('dailyTl') + ' — ' + C.num(dailyDate) })]));
    if (!S) return;
    top.appendChild(el('span', { class: 'ch-badge', text: C.t('stageN', { n: C.num(Math.min(E.STAGES, S.stage + 1)) }) }));
    top.appendChild(el('span', { class: 'ch-badge', text: C.t('livesN', { n: C.num(Math.max(0, S.lives)) }) }));
    top.appendChild(el('span', { class: 'ch-badge', text: C.t('ptsN', { n: C.num(S.score) }) }));
    var best = dailyDate ? 0 : C.stats.getBest('twinlanes', 'score');
    if (best) top.appendChild(el('span', { class: 'ch-badge', text: C.t('bestN', { n: C.num(best) }) }));
  }
  function renderStatus() { status.textContent = waiting ? C.t('tapGo') : C.t('hint'); }
  function go() { if (waiting) { waiting = false; last = 0; acc = 0; renderStatus(); kick(); } }

  /* -------------------------------------------------------------- input */

  // Every finger is its own tap, so two thumbs steer both cars at once. The side is set
  // by the board's middle, wherever the finger lands in the game area: on a phone held
  // sideways the thumbs rest beside the board, not on it. The board is drawn left to
  // right in every language, so left is the left car in Persian too.
  function sideAt(clientX) {
    var r = box.getBoundingClientRect();
    return clientX < r.left + r.width / 2 ? 0 : 1;
  }
  ctx.main.addEventListener('pointerdown', function (e) {
    if (!S || (e.target.closest && e.target.closest('button, a, input, select'))) return;
    if (e.button !== undefined && e.button > 0) return;
    e.preventDefault();
    C.audio.unlock();
    steer(sideAt(e.clientX));
  });
  ctx.main.addEventListener('contextmenu', function (e) { if (e.target === cv) e.preventDefault(); });
  ctx.main.style.touchAction = 'none';
  window.addEventListener('keydown', function (e) {
    if (document.querySelector('.ch-scrim') || e.repeat) return;
    if (e.target && e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
    var side = (e.key === 'ArrowLeft' || C.keyIs(e, 'a')) ? 0 : (e.key === 'ArrowRight' || C.keyIs(e, 'l')) ? 1 : -1;
    if (side >= 0) { e.preventDefault(); steer(side); }
    else if (e.key === ' ' || e.key === 'Enter') { if (waiting) { e.preventDefault(); go(); } }
    else if (C.keyIs(e, 'r')) { e.preventDefault(); newRun(); }
  });
  // a run waits while the app is away, and comes back waiting for a tap
  C.onPause(function () { paused = true; if (S && !ended) waiting = true; ctx.save(); renderStatus(); draw(); });
  C.onResume(function () { paused = false; draw(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { if (S && !ended) { waiting = true; renderStatus(); } } else draw(); });
  if (window.ResizeObserver) new ResizeObserver(function () { draw(); }).observe(box);
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw); } catch (er) { /* old WebViews */ } }
  // the words on the board use the app's font, which may arrive after the first frame
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { draw(); });

  /* --------------------------------------------------------------- help */

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [kb('A / ←', C.t('kLeft')), kb('L / →', C.t('kRight')), kb('Space', C.t('kGo')), kb('R', C.t('kAgain'))])
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  // little pictures for the tutorial: the road, the two cars, a star and a barrier
  var CAR_SVG = function (x, y, c) { return '<g transform="translate(' + x + ',' + y + ')"><rect x="-9" y="-15" width="18" height="30" rx="8" fill="' + c + '"/><rect x="-6" y="-9" width="12" height="6" rx="2" fill="#14282E" opacity=".6"/></g>'; };
  var STAR_SVG = function (x, y, c) { var p = []; for (var k = 0; k < 10; k++) { var a = k * Math.PI / 5 - Math.PI / 2, r = k % 2 ? 4.5 : 10; p.push((x + Math.cos(a) * r).toFixed(1) + ',' + (y + Math.sin(a) * r).toFixed(1)); } return '<polygon points="' + p.join(' ') + '" fill="' + c + '"/>'; };
  var BAR_SVG = function (x, y, c) { return '<g transform="translate(' + x + ',' + y + ')"><rect x="-16" y="-6" width="32" height="12" rx="3" fill="#fff"/><path d="M-12 6 l6 -12 h5 l-6 12z M0 6 l6 -12 h5 l-6 12z" fill="' + c + '"/></g>'; };
  function tArt(kind) {
    var s = '<svg viewBox="0 0 200 120" width="100%" direction="ltr"><rect width="200" height="120" rx="10" fill="#DDEDEE"/>' +
      '<rect x="60" y="6" width="80" height="108" rx="6" fill="#3A474B"/><rect x="100" y="6" width="40" height="108" fill="#425156"/>' +
      '<rect x="98" y="6" width="1.5" height="108" fill="#9FE0D2"/><rect x="101" y="6" width="1.5" height="108" fill="#9FE0D2"/>' +
      '<path d="M80 10 v14 M80 34 v14 M80 58 v14 M80 82 v14 M120 10 v14 M120 34 v14 M120 58 v14 M120 82 v14" stroke="#fff" stroke-opacity=".45" stroke-width="2"/>';
    if (kind === 0) {
      s += CAR_SVG(70, 96, '#F07A3A') + CAR_SVG(130, 96, '#24B3A0') +
        '<circle cx="28" cy="70" r="16" fill="#F07A3A" fill-opacity=".3" stroke="#F07A3A" stroke-width="3"/><circle cx="172" cy="70" r="16" fill="#24B3A0" fill-opacity=".3" stroke="#24B3A0" stroke-width="3"/>' +
        '<path d="M74 78 q8 -8 14 0 M126 78 q-8 -8 -14 0" stroke="' + ACCENT + '" stroke-width="3" fill="none" stroke-linecap="round"/>';
    } else if (kind === 1) {
      s += STAR_SVG(70, 40, '#FFBE4F') + STAR_SVG(130, 62, '#7FE0CE') + CAR_SVG(70, 96, '#F07A3A') + CAR_SVG(130, 96, '#24B3A0');
    } else {
      s += BAR_SVG(90, 46, '#F07A3A') + BAR_SVG(110, 30, '#24B3A0') + CAR_SVG(70, 96, '#F07A3A') + CAR_SVG(130, 96, '#24B3A0') +
        '<g fill="' + ACCENT + '">' + [0, 1, 2, 3, 4].map(function (i) { return '<circle cx="' + (24 + (i % 2) * 0) + '" cy="' + (20 + i * 20) + '" r="5"' + (i < 2 ? '' : ' fill-opacity=".3"') + '/>'; }).join('') + '</g>';
    }
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('tutTitle0'), text: C.t('tutText0'), art: tArt(0) },
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: tArt(1) },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: tArt(2) }
  ];

  /* -------------------------------------------------------------- start */

  // A run in progress is saved after each lost life and each stage and when the app
  // goes away; the daily run has its own slot
  ctx.autosave(function () {
    if (!S || S.over || ended) return { inProgress: false };
    return { s: E.snapshot(S), seed: seed, tries: tries, daily: dailyDate || null, elapsed: Date.now() - startedAt };
  });
  function resumeRun(sv) {
    var R = E.restore(sv.s);
    if (!R || R.over) return false;
    S = R; seed = sv.seed; tries = sv.tries || 1; startedAt = Date.now() - (sv.elapsed || 0);
    ended = false; waiting = true; last = 0; acc = 0; pop = null; fate = {}; flash = [0, 0]; sparks = [];
    renderTop(); renderStatus(); draw(); kick();
    return true;
  }
  var saved = ctx.loadSave();
  if (dailyDate) {
    if (!(saved && saved.s && saved.daily === dailyDate && resumeRun(saved))) newRun();
    if (C.stats.dailyDone('twinlanes', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).twinlanes;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
    }
  } else if (!(saved && saved.s && !saved.daily && resumeRun(saved))) {
    newRun();
  }
  ctx.tutorialIfNew(TUT);
})();
</script>
</body>
