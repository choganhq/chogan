<script>
/* ==== ENGINE START ==== */
function StorekeeperEngineFactory() {
  'use strict';

  // Three sizes. cols × rows is the room inside its outer wall; the generator keeps a
  // level only when its best solution takes at least `min` pushes.
  var SIZES = {
    small: { cols: 5, rows: 6, boxes: 2, walls: 4, min: 8, cap: 6000 },
    medium: { cols: 6, rows: 7, boxes: 3, walls: 6, min: 14, cap: 16000 },
    large: { cols: 7, rows: 8, boxes: 3, walls: 9, min: 18, cap: 14000 }
  };
  var ORDER = ['small', 'medium', 'large'];
  // 0 up, 1 right, 2 down, 3 left: screen directions, the same in every language
  var DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];

  function off(L, d) { return DY[d] * L.w + DX[d]; }
  function isFloor(L, i) { return i >= 0 && i < L.map.length && L.map.charAt(i) !== '#'; }
  function isGoal(L, i) { return L.map.charAt(i) === '.'; }
  function has(arr, v) { return arr.indexOf(v) >= 0; }
  function sorted(a) { return a.slice().sort(function (x, y) { return x - y; }); }

  // Cells the keeper can reach from `from` without passing a crate; `prev` lets a
  // walk be traced back. Breadth first, so the walk found is a shortest one.
  function reach(L, boxes, from) {
    var N = L.map.length, seen = new Int16Array(N).fill(-1), q = [from], blocked = {};
    for (var k = 0; k < boxes.length; k++) blocked[boxes[k]] = 1;
    seen[from] = 4;
    for (var h = 0; h < q.length; h++) {
      var c = q[h];
      for (var d = 0; d < 4; d++) {
        var n = c + off(L, d);
        if (seen[n] !== -1 || !isFloor(L, n) || blocked[n]) continue;
        seen[n] = d; q.push(n);
      }
    }
    return { seen: seen, cells: q };
  }
  function norm(R) { var m = R.cells[0]; for (var k = 1; k < R.cells.length; k++) if (R.cells[k] < m) m = R.cells[k]; return m; }
  function key(boxes, p) { return boxes.join(',') + '|' + p; }

  // the steps of a shortest walk to `to`, or null when a crate is in the way
  function walk(L, boxes, from, to) {
    if (from === to) return [];
    var R = reach(L, boxes, from);
    if (R.seen[to] === -1) return null;
    var out = [], c = to;
    while (c !== from) { var d = R.seen[c]; out.push(d); c -= off(L, d); }
    return out.reverse();
  }

  // Dead cells: a crate pushed there can never reach a goal. A crate can reach a goal
  // from exactly the cells a single crate can be pulled to from some goal.
  function live(L) {
    var N = L.map.length, ok = new Uint8Array(N), q = [];
    for (var i = 0; i < N; i++) if (isGoal(L, i)) { ok[i] = 1; q.push(i); }
    for (var h = 0; h < q.length; h++) {
      for (var d = 0; d < 4; d++) {
        var b = q[h] + off(L, d), p = b + off(L, d);
        if (isFloor(L, b) && isFloor(L, p) && !ok[b]) { ok[b] = 1; q.push(b); }
      }
    }
    return ok;
  }

  // Forward solver: breadth first over pushes, so the first answer found has the
  // fewest pushes. A state is the crates plus the area the keeper stands in. Returns
  // { pushes, path: [[crate, dir], …] } or null if there is no answer within `cap` states.
  function solve(L, boxes, player, cap) {
    cap = cap || 200000;
    var ok = live(L), start = sorted(boxes), R0 = reach(L, start, player);
    var seen = new Map(), front = [{ b: start, p: player, r: R0, k: key(start, norm(R0)), par: null, mv: null }];
    seen.set(front[0].k, 1);
    var goals = L.goals, n = 0;
    function solved(b) { for (var k = 0; k < b.length; k++) if (!isGoal(L, b[k])) return false; return true; }
    if (solved(start)) return { pushes: 0, path: [] };
    for (var depth = 1; front.length; depth++) {
      var next = [];
      for (var f = 0; f < front.length; f++) {
        var s = front[f], R = s.r || reach(L, s.b, s.p);
        s.r = null;
        for (var k = 0; k < s.b.length; k++) {
          var b = s.b[k];
          for (var d = 0; d < 4; d++) {
            var o = off(L, d), stand = b - o, to = b + o;
            if (R.seen[stand] === -1 || !isFloor(L, to) || !ok[to] || has(s.b, to)) continue;
            var nb = s.b.slice(); nb[k] = to; nb = sorted(nb);
            var R2 = reach(L, nb, b), kk = key(nb, norm(R2));
            if (seen.has(kk)) continue;
            seen.set(kk, 1);
            var st = { b: nb, p: b, r: R2, k: kk, par: s, mv: [b, d] };
            if (solved(nb)) {
              var path = [];
              for (var x = st; x.par; x = x.par) path.push(x.mv);
              return { pushes: depth, path: path.reverse() };
            }
            if (++n > cap) return null;
            next.push(st);
          }
        }
      }
      // reach() is kept only for the newest layer, so memory stays small
      front = next;
    }
    return null;
  }

  function shuffle(a, rnd) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  // A room: the floor inside an outer wall, with a few wall blocks dropped in as long
  // as the floor stays in one piece and no floor cell is left walled on three sides.
  function room(sz, rnd) {
    var w = sz.cols + 2, h = sz.rows + 2, m = [];
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) m.push(x === 0 || y === 0 || x === w - 1 || y === h - 1 ? '#' : ' ');
    var inner = [];
    for (y = 1; y < h - 1; y++) for (x = 1; x < w - 1; x++) inner.push(y * w + x);
    shuffle(inner, rnd);
    var placed = 0;
    for (var t = 0; t < inner.length && placed < sz.walls; t++) {
      var c = inner[t];
      m[c] = '#';
      if (connectedRoom(m, w) && !pockets(m, w)) placed++;
      else m[c] = ' ';
    }
    return { w: w, h: h, m: m };
  }
  function connectedRoom(m, w) {
    var first = m.indexOf(' '), total = 0, i;
    for (i = 0; i < m.length; i++) if (m[i] !== '#') total++;
    var seen = {}, q = [first]; seen[first] = 1;
    for (var h = 0; h < q.length; h++) {
      var nb = [q[h] - w, q[h] + 1, q[h] + w, q[h] - 1];
      for (i = 0; i < 4; i++) if (m[nb[i]] !== '#' && !seen[nb[i]]) { seen[nb[i]] = 1; q.push(nb[i]); }
    }
    return q.length === total;
  }
  function pockets(m, w) {
    for (var i = 0; i < m.length; i++) {
      if (m[i] === '#') continue;
      var open = (m[i - w] !== '#') + (m[i + 1] !== '#') + (m[i + w] !== '#') + (m[i - 1] !== '#');
      if (open < 2) return true;
    }
    return false;
  }

  // Backwards from the finished room: every crate on its goal and the keeper anywhere,
  // the search pulls crates away one step at a time, breadth first. The depth of a
  // state is then exactly the fewest pushes that solve it, and the deepest state with
  // every crate off its goal is the level.
  function deepest(L, sz, rnd) {
    var start = sorted(L.goals), seen = new Map(), front = [], all = [];
    for (var i = 0; i < L.map.length; i++) {
      if (!isFloor(L, i) || has(start, i)) continue;
      var R = reach(L, start, i), k = key(start, norm(R));
      if (!seen.has(k)) { seen.set(k, 0); front.push({ b: start, p: i }); }
    }
    var best = null, depth = 0, count = front.length;
    while (front.length && count < sz.cap) {
      var next = [];
      depth++;
      for (var f = 0; f < front.length; f++) {
        var s = front[f], Rs = reach(L, s.b, s.p);
        for (var j = 0; j < s.b.length; j++) {
          var b = s.b[j];
          for (var d = 0; d < 4; d++) {
            // the keeper stands at b+o and steps back to b+2o, pulling the crate to b+o
            var o = off(L, d), stand = b + o, back = b + 2 * o;
            if (Rs.seen[stand] === -1 || !isFloor(L, back) || has(s.b, back)) continue;
            var nb = s.b.slice(); nb[j] = stand; nb = sorted(nb);
            var R2 = reach(L, nb, back), kk = key(nb, norm(R2));
            if (seen.has(kk)) continue;
            seen.set(kk, depth);
            next.push({ b: nb, p: back });
            count++;
          }
        }
      }
      var cand = [];
      for (f = 0; f < next.length; f++) {
        var off0 = true;
        for (j = 0; j < next[f].b.length; j++) if (isGoal(L, next[f].b[j])) { off0 = false; break; }
        if (off0) cand.push(next[f]);
      }
      if (cand.length) best = { s: cand[Math.floor(rnd() * cand.length)], depth: depth };
      front = next;
    }
    return best;
  }

  // One level: rooms are tried until one gives a deep enough start. Returns
  // { size, w, h, map, goals, boxes, player, best }; `map` has '#' walls, '.' goals.
  function generate(size, rnd) {
    var sz = SIZES[size] || SIZES.medium, fallback = null;
    for (var attempt = 0; attempt < 40; attempt++) {
      var R = room(sz, rnd), floor = [];
      for (var i = 0; i < R.m.length; i++) if (R.m[i] !== '#') floor.push(i);
      // goals not in a corner, where a crate pushed off could never come back
      var goals = shuffle(floor.filter(function (c) {
        var openX = (R.m[c - 1] !== '#') + (R.m[c + 1] !== '#'), openY = (R.m[c - R.w] !== '#') + (R.m[c + R.w] !== '#');
        return openX > 0 && openY > 0;
      }), rnd).slice(0, sz.boxes);
      if (goals.length < sz.boxes) continue;
      var m = R.m.slice();
      for (i = 0; i < goals.length; i++) m[goals[i]] = '.';
      var L = { size: size, w: R.w, h: R.h, map: m.join(''), goals: sorted(goals) };
      var D = deepest(L, sz, rnd);
      if (!D) continue;
      var lv = { size: size, w: L.w, h: L.h, map: L.map, goals: L.goals, boxes: D.s.b, player: D.s.p, best: D.depth };
      if (D.depth >= sz.min) return lv;
      if (!fallback || D.depth > fallback.best) fallback = lv;
    }
    return fallback;
  }

  /* ------------------------------------------------------------- play */

  function start(L) { return { boxes: L.boxes.slice(), player: L.player, moves: 0, pushes: 0, face: 2 }; }
  // One step: 'wall' or 'blocked' changes nothing; 'move' walks; 'push' moves a crate.
  function step(L, S, d) {
    var o = off(L, d), to = S.player + o;
    S.face = d;
    if (!isFloor(L, to)) return 'wall';
    var k = S.boxes.indexOf(to);
    if (k >= 0) {
      var beyond = to + o;
      if (!isFloor(L, beyond) || has(S.boxes, beyond)) return 'blocked';
      S.boxes[k] = beyond; S.player = to; S.moves++; S.pushes++;
      return 'push';
    }
    S.player = to; S.moves++;
    return 'move';
  }
  function won(L, S) {
    for (var k = 0; k < S.boxes.length; k++) if (!isGoal(L, S.boxes[k])) return false;
    return true;
  }
  // a crate that can never move again off a goal: stuck in a corner, for a hint
  function stuck(L, S, b) {
    if (isGoal(L, b)) return false;
    var u = !isFloor(L, b - L.w), dn = !isFloor(L, b + L.w), l = !isFloor(L, b - 1), r = !isFloor(L, b + 1);
    return (u || dn) && (l || r);
  }
  // Three stars at the solver's best, two within a fifth more (at least two pushes),
  // one otherwise: never a loss
  function stars(pushes, best) {
    if (pushes <= best) return 3;
    return pushes <= best + Math.max(2, Math.ceil(best * 0.2)) ? 2 : 1;
  }

  function validLevel(L) {
    if (!L || !SIZES[L.size] || !(L.w > 2) || !(L.h > 2) || typeof L.map !== 'string' || L.map.length !== L.w * L.h || !/^[# .]+$/.test(L.map)) return false;
    if (!Array.isArray(L.goals) || !Array.isArray(L.boxes) || L.goals.length !== L.boxes.length || !L.boxes.length) return false;
    for (var k = 0; k < L.goals.length; k++) if (!isGoal(L, L.goals[k]) || !isFloor(L, L.boxes[k])) return false;
    return isFloor(L, L.player) && !has(L.boxes, L.player) && L.best > 0;
  }
  function validState(L, S) {
    if (!S || !Array.isArray(S.boxes) || S.boxes.length !== L.boxes.length || !isFloor(L, S.player) || has(S.boxes, S.player)) return false;
    var u = {};
    for (var k = 0; k < S.boxes.length; k++) { if (!isFloor(L, S.boxes[k]) || u[S.boxes[k]]) return false; u[S.boxes[k]] = 1; }
    return S.moves >= 0 && S.pushes >= 0;
  }

  return {
    SIZES: SIZES, ORDER: ORDER, DX: DX, DY: DY,
    off: off, isFloor: isFloor, isGoal: isGoal, reach: reach, walk: walk, live: live, solve: solve,
    room: room, deepest: deepest, generate: generate,
    start: start, step: step, won: won, stuck: stuck, stars: stars, validLevel: validLevel, validState: validState
  };
}
if (typeof module !== 'undefined') module.exports = StorekeeperEngineFactory;
/* ==== ENGINE END ==== */
</script>

    }
    // a soft shadow where the floor meets a wall above or to the left
    g.fillStyle = 'rgba(0,0,0,.12)';
    for (i = 0; i < lv.map.length; i++) {
      if (!E.isFloor(lv, i)) continue;
      xy = cellXY(i); x0 = X(xy[0]); y0 = Y(xy[1]);
      if (!E.isFloor(lv, i - lv.w)) g.fillRect(x0, y0, c, c * 0.08);
      if (!E.isFloor(lv, i - 1)) g.fillRect(x0, y0, c * 0.08, c);
    }
    // goal marks: a ring of four corner ticks around a diamond
    for (i = 0; i < lv.goals.length; i++) {
      xy = cellXY(lv.goals[i]); var cx = X(xy[0]) + c / 2, cy = Y(xy[1]) + c / 2, q = c * 0.3, t = c * 0.12;
      g.strokeStyle = P.goal; g.lineWidth = Math.max(2, c * 0.06); g.lineCap = 'round';
      g.beginPath();
      [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(function (s) { g.moveTo(cx + s[0] * q, cy + s[1] * (q - t)); g.lineTo(cx + s[0] * q, cy + s[1] * q); g.lineTo(cx + s[0] * (q - t), cy + s[1] * q); });
      g.stroke();
      g.fillStyle = P.goal; g.beginPath(); g.moveTo(cx, cy - c * 0.12); g.lineTo(cx + c * 0.12, cy); g.lineTo(cx, cy + c * 0.12); g.lineTo(cx - c * 0.12, cy); g.closePath(); g.fill();
    }
    var f = anim ? Math.min(1, (performance.now() - anim.t0) / Math.max(1, anim.dur)) : 1;
    f = 1 - (1 - f) * (1 - f);
    function at(from, to) { var a = cellXY(from), b = cellXY(to); return [X(a[0] + (b[0] - a[0]) * f), Y(a[1] + (b[1] - a[1]) * f)]; }
    for (i = 0; i < st.boxes.length; i++) {
      var pos = anim && anim.k === i ? at(anim.b0, st.boxes[i]) : at(st.boxes[i], st.boxes[i]);
      var home = E.isGoal(lv, st.boxes[i]) && (!anim || anim.k !== i || f >= 1);
      crate(g, P, pos[0], pos[1], c, home, !home && E.stuck(lv, st, st.boxes[i]));
    }
    var pp = anim ? at(anim.p0, st.player) : at(st.player, st.player);
    keeper(g, P, pp[0] + c / 2, pp[1] + c / 2, c, st.face);
  }
  function crate(g, P, x, y, c, home, stuck) {
    var p = c * 0.09, s = c - 2 * p, r = c * 0.08, b = s * 0.16;
    g.fillStyle = 'rgba(0,0,0,.18)'; rr(g, x + p + c * 0.04, y + p + c * 0.06, s, s, r); g.fill();
    g.fillStyle = home ? P.done : P.wood; rr(g, x + p, y + p, s, s, r); g.fill();
    g.lineWidth = Math.max(1.5, c * 0.045); g.strokeStyle = home ? P.doneDk : P.woodDk; g.stroke();
    // the inner frame and one diagonal brace of a wooden crate
    g.strokeStyle = home ? P.doneLt : P.woodLt; g.lineWidth = Math.max(1, c * 0.035);
    g.strokeRect(x + p + b, y + p + b, s - 2 * b, s - 2 * b);
    g.strokeStyle = home ? P.doneDk : P.woodDk; g.lineWidth = Math.max(1.5, c * 0.06);
    g.beginPath(); g.moveTo(x + p + b, y + p + s - b); g.lineTo(x + p + s - b, y + p + b); g.stroke();
    if (stuck) { g.strokeStyle = P.stuck; g.lineWidth = Math.max(2, c * 0.06); rr(g, x + p - 1, y + p - 1, s + 2, s + 2, r); g.stroke(); }
  }
  // the storekeeper from above: shoulders, head and a cap whose peak shows the way he faces
  function keeper(g, P, cx, cy, c, face) {
    var a = [-Math.PI / 2, 0, Math.PI / 2, Math.PI][face || 0];
    g.save(); g.translate(cx, cy); g.rotate(a + Math.PI / 2);
    g.fillStyle = 'rgba(0,0,0,.18)'; g.beginPath(); g.ellipse(c * 0.03, c * 0.05, c * 0.36, c * 0.24, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = P.body; g.strokeStyle = P.bodyDk; g.lineWidth = Math.max(1.5, c * 0.04);
    g.beginPath(); g.ellipse(0, c * 0.04, c * 0.34, c * 0.21, 0, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = P.skin; g.beginPath(); g.arc(0, 0, c * 0.17, 0, Math.PI * 2); g.fill();
    g.fillStyle = P.cap; g.strokeStyle = P.capDk;
    g.beginPath(); g.arc(0, c * 0.02, c * 0.165, Math.PI * 1.05, Math.PI * 1.95 + Math.PI, false); g.closePath(); g.fill();
    // the peak, in front
    g.beginPath(); g.ellipse(0, -c * 0.15, c * 0.13, c * 0.07, 0, Math.PI, 0); g.fill(); g.stroke();
    g.restore();
  }

  function render() {
    if (!S) return;
    top.innerHTML = '';
    if (S.daily) top.appendChild(el('span', { class: 'ch-badge ch-badge--accent' }, [C.icon('calendar', 14), el('span', { text: C.t('skDaily') + ' — ' + C.num(S.daily) })]));
    else top.appendChild(C.ui.segmented(E.ORDER.map(function (s) { return { value: s, label: C.t(sizeKey(s)) }; }), S.lv.size, setSize));
    var a = 0;
    for (var i = 0; i < S.st.boxes.length; i++) if (E.isGoal(S.lv, S.st.boxes[i])) a++;
    status.textContent = C.t('skMoves', { n: C.num(S.st.moves) }) + ' · ' + C.t('skPushes', { n: C.num(S.st.pushes) });
    goalLine.textContent = C.t('skOnGoal', { a: C.num(a), n: C.num(S.st.boxes.length) }) + ' · ' + C.t('skFewest', { n: C.num(S.lv.best) });
    cv.setAttribute('aria-label', C.t('skBoard') + ' · ' + C.t('skOnGoal', { a: C.num(a), n: C.num(S.st.boxes.length) }));
    restartBtn.disabled = ended || !moved();
    draw();
  }

  /* -------------------------------------------------------------- input */

  // A swipe is one step; a tap walks to a cell, or pushes a crate beside the keeper.
  var down = null;
  cv.addEventListener('pointerdown', function (e) {
    if (!view || !S) return;
    down = { id: e.pointerId, x: e.clientX, y: e.clientY };
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* not every browser */ }
    e.preventDefault();
  });
  cv.addEventListener('pointerup', function (e) {
    if (!down || down.id !== e.pointerId) return;
    var dx = e.clientX - down.x, dy = e.clientY - down.y, d0 = down;
    down = null;
    var far = Math.max(16, view.c * 0.35);
    if (Math.abs(dx) >= far || Math.abs(dy) >= far) {
      act([Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0)]);
      return;
    }
    var r = cv.getBoundingClientRect();
    tapAt(Math.floor((d0.x - r.left - view.m) / view.c) + 1, Math.floor((d0.y - r.top - view.m) / view.c) + 1);
  });
  cv.addEventListener('pointercancel', function () { down = null; });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  function tapAt(x, y) {
    if (!S || ended) return;
    var lv = S.lv;
    if (x < 1 || y < 1 || x > lv.w - 2 || y > lv.h - 2) return;
    var i = y * lv.w + x, st = S.st;
    if (anim) finishAnim();
    if (ended) return;
    if (i === st.player) return;
    if (st.boxes.indexOf(i) >= 0) {
      for (var d = 0; d < 4; d++) if (st.player + E.off(lv, d) === i) { act([d]); return; }
      C.feedback('bad'); return;
    }
    var path = E.isFloor(lv, i) ? E.walk(lv, st.boxes, st.player, i) : null;
    if (path && path.length) act(path);
    else C.feedback('bad');
  }

  window.addEventListener('keydown', function (e) {
    if (document.querySelector('.ch-scrim')) return;
    if (C.undoKey(e)) { undo(); e.preventDefault(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var d = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 }[e.key];
    if (d !== undefined) {
      e.preventDefault();
      // a held key queues at most one step behind the one moving
      if (anim && queue.length) return;
      if (anim) { queue.push(d); return; }
      act([d]); return;
    }
    if (C.keyIs(e, 'r')) { restart(); e.preventDefault(); return; }
    if (C.keyIs(e, 'n') && !dailyDate) { askNew(); e.preventDefault(); }
  });
  if (window.ResizeObserver) new ResizeObserver(function () { draw(); }).observe(box);
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw); } catch (er) { /* old WebViews */ } }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { draw(); });
  window.addEventListener('resize', draw);

  /* ------------------------------------------------------------ dialogs */

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    var keys = [kb('← ↑ → ↓', C.t('skKMove')), kb('U / Ctrl+Z', C.t('undo')), kb('R', C.t('skKRestart'))];
    if (!dailyDate) keys.push(kb('N', C.t('skKNew')));
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, keys)
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  // little warehouses for the tutorial: rows of '#' walls, '.' marks, '$' crates,
  // '*' a crate on a mark, '@' the keeper and '>' an arrow of the way to go
  function tArt(rows, note) {
    var P = PAL[dark() ? 'dark' : 'light'], n = rows[0].length, k = 22, w = n * k, h = rows.length * k, ox = (200 - w) / 2;
    var s = '<svg viewBox="0 0 200 ' + (h + 8) + '" width="100%"><g transform="translate(' + ox + ' 4)">';
    rows.forEach(function (row, y) {
      for (var x = 0; x < n; x++) {
        var ch = row.charAt(x), X0 = x * k, Y0 = y * k;
        if (ch === '#') { s += '<rect x="' + X0 + '" y="' + Y0 + '" width="' + k + '" height="' + k + '" fill="' + P.wall + '"/>'; continue; }
        s += '<rect x="' + X0 + '" y="' + Y0 + '" width="' + k + '" height="' + k + '" fill="' + P.floor + '" stroke="' + P.seam + '"/>';
        if (ch === '.' || ch === '*') s += '<path d="M' + (X0 + 11) + ' ' + (Y0 + 7) + 'l4 4-4 4-4-4z" fill="' + P.goal + '"/>';
        if (ch === '$' || ch === '*') s += '<rect x="' + (X0 + 3) + '" y="' + (Y0 + 3) + '" width="16" height="16" rx="2" fill="' + (ch === '*' ? P.done : P.wood) + '" stroke="' + (ch === '*' ? P.doneDk : P.woodDk) + '" stroke-width="1.5"/><path d="M' + (X0 + 6) + ' ' + (Y0 + 16) + 'l10-10" stroke="' + (ch === '*' ? P.doneDk : P.woodDk) + '" stroke-width="2"/>';
        if (ch === 'x') s += '<rect x="' + (X0 + 3) + '" y="' + (Y0 + 3) + '" width="16" height="16" rx="2" fill="' + P.wood + '" stroke="' + P.stuck + '" stroke-width="2.5"/>';
        if (ch === '@') s += '<ellipse cx="' + (X0 + 11) + '" cy="' + (Y0 + 12) + '" rx="8" ry="5" fill="' + P.body + '"/><circle cx="' + (X0 + 11) + '" cy="' + (Y0 + 11) + '" r="4" fill="' + P.cap + '"/>';
        if (ch === '>') s += '<path d="M' + (X0 + 5) + ' ' + (Y0 + 11) + 'h11m-4-4 4 4-4 4" fill="none" stroke="' + P.goal + '" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';
      }
    });
    return s + '</g>' + (note || '') + '</svg>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: tArt(['#######', '#@>$ .#', '#######']) },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: tArt(['#####', '#x  #', '#  @#', '#####']) },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: tArt(['#######', '# *@  #', '#  >  #', '#######']) }
  ];

  /* -------------------------------------------------------------- start */

  // saved after every step; the daily one has its own slot
  ctx.autosave(function () {
    if (!S || ended) return { inProgress: false };
    var st = S.st;
    return { lv: S.lv, boxes: st.boxes, player: st.player, moves: st.moves, pushes: st.pushes, face: st.face, daily: S.daily, stack: S.stack.slice(-200), elapsed: Date.now() - startedAt };
  });
  function save() { ctx.save(); }
  var saved = ctx.loadSave();
  if (saved && E.validLevel(saved.lv) && E.validState(saved.lv, saved) && (saved.daily || null) === (dailyDate || null) && !E.won(saved.lv, saved)) {
    var lv0 = saved.lv;
    var stack = Array.isArray(saved.stack) ? saved.stack.filter(function (u) {
      return Array.isArray(u) && E.validState(lv0, { boxes: u[0], player: u[1], moves: u[2], pushes: u[3] });
    }) : [];
    S = { lv: lv0, st: { boxes: saved.boxes.slice(), player: saved.player, moves: saved.moves, pushes: saved.pushes, face: saved.face | 0 }, daily: saved.daily || null, stack: stack };
    startedAt = Date.now() - (saved.elapsed || 0);
    layout(); render();
  } else newLevel(dailyDate ? DAILY : prefs.size);
  if (dailyDate && C.stats.dailyDone('storekeeper', dailyDate)) {
    var rec = C.stats.dailyOf(dailyDate).storekeeper;
    C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
  }
  ctx.tutorialIfNew(TUT);
})();
</script>
</body>
</html>
