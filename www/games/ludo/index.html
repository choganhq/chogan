<script>
/* ==== ENGINE START ==== */
function LudoEngineFactory() {
  'use strict';

  // The loop of 52 squares on a 15×15 board, as [column, row], clockwise from
  // red's start. Colour c starts at square 13c; a token walks 51 squares of the
  // loop (positions 0..50), then 5 squares up its own home column (51..55), and
  // is home at 56.
  var TRACK = [];
  (function () {
    var runs = [
      [1, 6, 1, 0, 5], [6, 5, 0, -1, 6], [7, 0, 1, 0, 1], [8, 0, 0, 1, 1],
      [8, 1, 0, 1, 5], [9, 6, 1, 0, 6], [14, 7, 0, 1, 1], [14, 8, -1, 0, 1],
      [13, 8, -1, 0, 5], [8, 9, 0, 1, 6], [7, 14, -1, 0, 1], [6, 14, 0, -1, 1],
      [6, 13, 0, -1, 5], [5, 8, -1, 0, 6], [0, 7, 0, -1, 1], [0, 6, 1, 0, 1]
    ];
    runs.forEach(function (r) { for (var k = 0; k < r[4]; k++) TRACK.push([r[0] + r[2] * k, r[1] + r[3] * k]); });
  })();
  var LOOP = 52, LAST = 50, HOME = 56;
  // Start squares and the four stars, eight squares after each start: nobody is
  // captured there.
  var SAFE = [0, 8, 13, 21, 26, 34, 39, 47];
  // Colours in play order (clockwise): red, green, yellow, blue. With two players
  // the colours sit opposite each other, as on a real board.
  var SEATS = { 2: [0, 2], 3: [0, 1, 2], 4: [0, 1, 2, 3] };

  function square(c, p) { return p >= 0 && p <= LAST ? (13 * c + p) % LOOP : -1; }
  function isSafe(sq) { return SAFE.indexOf(sq) >= 0; }

  // Board cell of a token: the loop, its home column, or -1 in base or home
  function cell(c, p) {
    if (p >= 0 && p <= LAST) return TRACK[square(c, p)];
    if (p > LAST && p < HOME) {
      var k = p - LAST;
      if (c === 0) return [k, 7];
      if (c === 1) return [7, k];
      if (c === 2) return [14 - k, 7];
      return [7, 14 - k];
    }
    return null;
  }

  // tokens: 2 for the quick game, 4 for the full one
  function newGame(players, tokens) {
    var seats = SEATS[players], pos = [];
    for (var i = 0; i < seats.length; i++) {
      var t = [];
      for (var k = 0; k < tokens; k++) t.push(-1);
      pos.push(t);
    }
    return { colours: seats.slice(), tokens: tokens, pos: pos, turn: 0, sixes: 0, winner: -1, rolls: 0 };
  }

  function copy(S) {
    return {
      colours: S.colours.slice(), tokens: S.tokens, pos: S.pos.map(function (t) { return t.slice(); }),
      turn: S.turn, sixes: S.sixes, winner: S.winner, rolls: S.rolls
    };
  }

  function canMove(S, k, roll) {
    var p = S.pos[S.turn][k];
    if (p < 0) return roll === 6;
    if (p >= HOME) return false;
    return p + roll <= HOME;
  }

  // Tokens that can move; two tokens on the same spot are the same move, so only
  // the first of them is listed.
  function moves(S, roll) {
    var out = [], seen = {};
    for (var k = 0; k < S.tokens; k++) {
      if (!canMove(S, k, roll)) continue;
      var key = S.pos[S.turn][k];
      if (seen[key]) continue;
      seen[key] = 1;
      out.push(k);
    }
    return out;
  }

  function nextSeat(S) { return (S.turn + 1) % S.colours.length; }

  // A roll that cannot be played: a third six in a row loses the turn, and so
  // does a roll with no token to move. Returns null when the roll can be played.
  function dead(S, roll) {
    if (roll === 6 && S.sixes === 2) return 'sixes';
    if (!moves(S, roll).length) return 'none';
    return null;
  }
  function pass(S) {
    var N = copy(S);
    N.turn = nextSeat(N);
    N.sixes = 0;
    N.rolls++;
    return N;
  }

  // Moves token k by the roll. Returns the new state, the cells the token steps
  // through (for the animation), who was sent home, and whether the player
  // rolls again: after a six, a capture, or a token reaching home.
  function play(S, k, roll) {
    if (S.winner >= 0 || !canMove(S, k, roll) || (roll === 6 && S.sixes === 2)) return null;
    var N = copy(S), me = N.turn, c = N.colours[me], p = N.pos[me][k], steps = [];
    var to = p < 0 ? 0 : p + roll;
    if (p < 0) steps.push(0);
    else for (var q = p + 1; q <= to; q++) steps.push(q);
    N.pos[me][k] = to;
    var captured = [];
    var sq = square(c, to);
    if (sq >= 0 && !isSafe(sq)) {
      for (var s = 0; s < N.colours.length; s++) {
        if (s === me) continue;
        for (var j = 0; j < N.tokens; j++) {
          if (square(N.colours[s], N.pos[s][j]) === sq) { N.pos[s][j] = -1; captured.push({ seat: s, k: j }); }
        }
      }
    }
    var home = to === HOME;
    if (N.pos[me].every(function (x) { return x === HOME; })) N.winner = me;
    var again = N.winner < 0 && (roll === 6 || captured.length > 0 || home);
    N.rolls++;
    if (again) N.sixes = roll === 6 ? N.sixes + 1 : 0;
    else { N.turn = nextSeat(N); N.sixes = 0; }
    return { state: N, steps: steps, captured: captured, home: home, again: again };
  }

  // How many enemy tokens could hit square sq with one roll: those on the loop
  // one to six squares behind it.
  function threats(S, me, sq) {
    if (sq < 0 || isSafe(sq)) return 0;
    var n = 0;
    for (var s = 0; s < S.colours.length; s++) {
      if (s === me) continue;
      for (var j = 0; j < S.tokens; j++) {
        var e = square(S.colours[s], S.pos[s][j]);
        if (e < 0) continue;
        var d = (sq - e + LOOP) % LOOP;
        // an enemy turns off into its home column before it could reach sq
        if (d >= 1 && d <= 6 && S.pos[s][j] + d <= LAST) n++;
      }
    }
    return n;
  }

  // The worth of moving token k for the player to move. medium weighs captures,
  // reaching home, leaving base and progress; hard also avoids landing where an
  // enemy can hit it, rescues tokens under threat and keeps tokens on safe squares.
  function score(S, k, roll, level) {
    var me = S.turn, c = S.colours[me], p = S.pos[me][k], r = play(S, k, roll);
    var to = r.state.pos[me][k], v = 0;
    if (r.captured.length) v += 60 + r.captured.length * 5;
    if (r.home) v += 50;
    if (p < 0) v += 35;
    if (to > LAST) v += 18;
    v += to * 0.4;
    if (level === 'hard') {
      var after = r.state, sq = square(c, to), from = square(c, p);
      v -= threats(after, me, sq) * 22;
      v += threats(S, me, from) * 16;
      if (isSafe(sq)) v += 12;
      if (r.again) v += 6;
    } else if (isSafe(square(c, to))) v += 8;
    return v;
  }

  // easy: a random token, but it always takes a token home or a capture when one
  // is there. medium and hard: the best score.
  function think(S, roll, level, rnd) {
    rnd = rnd || Math.random;
    var list = moves(S, roll);
    if (!list.length) return -1;
    if (level === 'easy') {
      for (var i = 0; i < list.length; i++) {
        var r = play(S, list[i], roll);
        if (r.captured.length || r.home) return list[i];
      }
      return list[Math.floor(rnd() * list.length)];
    }
    var best = list[0], bestV = -Infinity;
    for (i = 0; i < list.length; i++) {
      var v = score(S, list[i], roll, level) + rnd() * 0.01;
      if (v > bestV) { bestV = v; best = list[i]; }
    }
    return best;
  }

  function roll(rnd) { return 1 + Math.floor(rnd() * 6); }

  var api = {
    TRACK: TRACK, SAFE: SAFE, SEATS: SEATS, LAST: LAST, HOME: HOME, square: square, isSafe: isSafe, cell: cell,
    newGame: newGame, copy: copy, canMove: canMove, moves: moves, dead: dead, pass: pass, play: play,
    threats: threats, think: think, roll: roll
  };
  if (typeof self !== 'undefined') self.LudoEngine = api;
  return api;
}
if (typeof module !== 'undefined' && module.exports) module.exports = LudoEngineFactory;
/* ==== ENGINE END ==== */
</script>

        boardLabel: 'Tablero de ludo', roll: 'Tirar el dado', rolling: 'Tirando…', pick: 'Elige una ficha',
        noMove: 'Sin jugada', threeSixes: 'Tres seises seguidos: pierdes el turno', rollAgain: 'Tira otra vez',
        captured: '¡Comida!', wasCaptured: 'Te han comido una ficha', reachedHome: 'Una ficha ha llegado a casa',
        turnOf: 'Turno: {n}', yourTurn: 'Tu turno', dailyLudo: 'Ludo diario', vsMedium: 'contra el bot medio', home: 'casa',
        rollsLabel: 'Tus tiradas', capturesLabel: 'Fichas que comiste', playerWon: 'Gana: {n}',
        rules: 'Tirad el dado por turnos. Un seis saca una ficha de su casa y da otra tirada. Las fichas dan una vuelta al tablero y suben por su color hasta la meta del centro; para llegar, la tirada debe encajar justa. Caer sobre una ficha rival la manda a su casa, salvo en las casillas seguras (la salida de cada color y las estrellas). Comer, llegar a la meta y sacar un seis dan otra tirada; tres seises seguidos pierden el turno. Gana quien lleve primero todas sus fichas a la meta.',
        keyboard: 'Teclado', rollKey: 'Tirar el dado', pickKey: 'Elegir ficha', moveKey: 'Mover la ficha elegida',

        tutTitle3: 'A la meta', tutText3: 'Tras una vuelta, la ficha sube por su color hasta el centro. Gana quien lleve primero todas sus fichas a la meta.'
      }
    }
  });

  var params = new URLSearchParams(location.search);
  var dailyDate = params.get('daily');
  var LEVELS = ['easy', 'medium', 'hard'];
  var prefs = ctx.store.get('prefs', { players: 2, mode: 'bots', level: 'medium', tokens: 2 });
  if ([2, 3, 4].indexOf(prefs.players) < 0) prefs.players = 2;
  if (prefs.mode !== 'bots' && prefs.mode !== 'people') prefs.mode = 'bots';
  if (LEVELS.indexOf(prefs.level) < 0) prefs.level = 'medium';
  if (prefs.tokens !== 2 && prefs.tokens !== 4) prefs.tokens = 2;

  // G: the game. phase: 'roll' (waiting for the die), 'choose' (the player picks a
  // token), 'busy' (the die or a token is moving).
  var G = null, timer = null, anim = null, spots = [], sel = -1, kbOn = false;

  // #407: a captured token was back in its base in one frame, and reaching
  // home was only a message. Now a captured token flies home in an arc, and
  // home gets a burst in the player's colour. The game state is final first.
  var FLY_MS = 480, lfx = null, lfxRaf = 0;
  // each captured token's flight, from where it was taken (at0) to its base (at1)
  function flyFx(captured, at0, at1) {
    return captured.map(function (c) { return { seat: c.seat, k: c.k, from: at0(c.seat, c.k), to: at1(c.seat, c.k) }; });
  }
  // a flight's point at t (0..1), in board cells; it rises up to 1.6 cells mid-way
  function flyAt(f, t) {
    var e = 1 - Math.pow(1 - t, 3);
    return [f.from[0] + (f.to[0] - f.from[0]) * e, f.from[1] + (f.to[1] - f.from[1]) * e - Math.sin(Math.PI * t) * 1.6];
  }
  function lfxTick() {
    lfxRaf = 0;
    draw();
    if (lfx && performance.now() - lfx.t0 < FLY_MS) lfxRaf = requestAnimationFrame(lfxTick);
    else { lfx = null; draw(); }
  }

  var cv = document.createElement('canvas');
  cv.className = 'lu-canvas';
  cv.setAttribute('role', 'img');
  cv.setAttribute('aria-label', C.t('boardLabel'));
  var boardBox = el('div', { class: 'lu-boardbox' }, [cv]);
  var top = el('div', { class: 'lu-top ch-above' });
  var playersRow = el('div', { class: 'lu-players ch-above' });
  var status = el('div', { class: 'lu-status', role: 'status', 'aria-live': 'polite' });
  var die = el('button', { class: 'lu-die', type: 'button', 'aria-label': C.t('roll') });
  var bar = el('div', { class: 'lu-bar' }, [status, die]);
  var wrap = el('div', { class: 'lu-wrap ch-split' }, [el('div', { class: 'ch-fit' }, [boardBox]), el('div', { class: 'ch-side' }, [top, playersRow, bar])]);

  ctx.button({ icon: 'help', label: C.t('help'), onClick: showHelp });
  ctx.button({ icon: 'refresh', label: C.t('newMatch'), onClick: askNew });
  ctx.main.appendChild(wrap);
  ctx.mount();

  /* ------------------------------------------------------------ setup */

  // Seat 0 is always the person holding the phone (red). Against bots every other
  // seat is a bot of the chosen level; in pass-and-play they are people.
  function newGame(o) {
    stop();
    anim = null; lfx = null;
    var daily = o.daily || null;
    G = {
      players: daily ? 2 : o.players, mode: daily ? 'bots' : o.mode, level: daily ? 'medium' : o.level,
      tokens: daily ? 2 : o.tokens, daily: daily, phase: 'roll', roll: 0, msg: '',
      captures: 0, myRolls: 0, startedAt: Date.now(), done: false
    };
    G.s = E.newGame(G.players, G.tokens);
    if (!daily) {
      prefs.players = o.players; prefs.mode = o.mode; prefs.level = o.level; prefs.tokens = o.tokens;
      ctx.store.set('prefs', prefs);
    }
    render();
    save();
    startTurn();
  }
  function current() { return { players: G.players, mode: G.mode, level: G.level, tokens: G.tokens }; }
  function fromPrefs() { return { players: prefs.players, mode: prefs.mode, level: prefs.level, tokens: prefs.tokens }; }

  function isBot(seat) { return G.mode === 'bots' && seat !== 0; }
  function stop() { if (timer) { clearTimeout(timer); timer = null; } }
  function later(fn, ms) { stop(); timer = setTimeout(function () { timer = null; fn(); }, ms); }

  /* ------------------------------------------------------------- turns */

  function startTurn() {
    if (!G || G.done) return;
    G.phase = 'roll';
    G.roll = 0;
    sel = -1;
    render();
    if (isBot(G.s.turn)) later(doRoll, 650);
  }

  // The daily dice come from the day's seed and the roll number, so everyone
  // gets the same throws whatever they choose.
  function throwDie() {
    var rnd = G.daily ? C.daily('ludo', G.daily + '|' + G.s.rolls).rng : Math.random;
    return E.roll(rnd);
  }

  function doRoll() {
    if (!G || G.done || G.phase !== 'roll') return;
    G.phase = 'busy';
    var who = G.s.turn, v = throwDie();
    if (who === 0) G.myRolls++;
    die.classList.add('lu-die--roll');
    drawDie(1 + Math.floor(Math.random() * 6));
    C.feedback('clack');
    render();
    later(function () {
      die.classList.remove('lu-die--roll');
      G.roll = v;
      // Saved the moment it is known: without it a reload threw the die again,
      // so a bad roll could be swapped for a new one
      save();
      afterRoll(v);
    }, C.ui.reduceMotion() ? 120 : 520);
  }

  function afterRoll(v) {
    var who = G.s.turn;
    drawDie(v);
    var dead = E.dead(G.s, v);
    if (dead) {
      G.msg = C.t(dead === 'sixes' ? 'threeSixes' : 'noMove');
      render();
      later(function () { G.s = E.pass(G.s); G.roll = 0; G.msg = ''; save(); startTurn(); }, 1000);
      return;
    }
    var list = E.moves(G.s, v);
    if (isBot(who)) {
      var rnd = G.daily ? C.daily('ludo', G.daily + '|bot|' + G.s.rolls).rng : Math.random;
      later(function () { move(E.think(G.s, v, G.level, rnd)); }, 420);
    } else if (list.length === 1) {
      // one possible move: no need to ask
      later(function () { move(list[0]); }, 380);
    } else {
      G.phase = 'choose';
      sel = list[0];
      G.msg = C.t('pick');
      render();
      kick();
    }
  }

  function move(k) {
    if (!G || G.done || !G.roll) return;
    var who = G.s.turn, r = E.play(G.s, k, G.roll);
    if (!r) return;
    G.phase = 'busy';
    G.msg = '';
    sel = -1;
    var step = C.ui.reduceMotion() ? 30 : 120;
    anim = { seat: who, k: k, steps: r.steps, i: 0, from: G.s };
    render();
    kick();
    (function next() {
      if (!anim) return;
      if (anim.i < anim.steps.length - 1) {
        anim.i++;
        C.feedback('place');
        draw();
        later(next, step);
        return;
      }
      var before = anim.from;
      anim = null;
      G.s = r.state;
      if (r.captured.length && !C.ui.reduceMotion()) {
        lfx = { t0: performance.now(), list: flyFx(r.captured,
          function (st, kk) { return tokenAt(before, st, kk, before.pos[st][kk]); },
          function (st, kk) { return tokenAt(r.state, st, kk, -1); }) };
        if (!lfxRaf) lfxRaf = requestAnimationFrame(lfxTick);
      }
      if (r.home) {
        var hr = cv.getBoundingClientRect(), hu = hr.width / 15, hp = tokenAt(G.s, who, k, E.HOME), hc = colors().c[G.s.colours[who]];
        C.ui.burst({ x: hr.left + hp[0] * hu, y: hr.top + hp[1] * hu }, { count: 26, speed: 260, ring: hu * 1.2, colors: [hc, '#FFF1C9', '#F2B84B'] });
      }
      if (r.captured.length) {
        C.feedback(who === 0 || !isBot(who) ? 'good' : 'bad');
        if (who === 0) G.captures += r.captured.length;
        G.msg = r.captured.some(function (x) { return x.seat === 0; }) && G.mode === 'bots' ? C.t('wasCaptured') : C.t('captured');
        if (who === 0 && G.mode === 'bots' && G.captures >= 3) C.achievements.unlock('lu-hunter');
      } else if (r.home) { C.feedback('good'); G.msg = C.t('reachedHome'); }
      if (G.s.winner >= 0) {
        G.done = true;
        render();
        later(finish, 600);
        return;
      }
      if (r.again && !G.msg) G.msg = C.t('rollAgain');
      G.roll = 0;
      save();
      later(startTurn, r.captured.length || r.home ? 600 : 250);
    })();
  }

  /* ------------------------------------------------------------ result */

  function finish() {
    stop();
    var vsBots = G.mode === 'bots', w = G.s.winner, won = vsBots ? w === 0 : true;
    var base = vsBots ? ({ easy: 5, medium: 10, hard: 18 }[G.level] || 10) + (G.players - 2) * 3 + (G.tokens === 4 ? 4 : 0) : 8;
    var coins = Math.max(2, Math.round(won && vsBots ? base : base * 0.35)) + (G.daily ? 8 : 0);
    var points = Math.max(3, Math.round(won && vsBots ? base * 4 : base * 1.2)) + (G.daily ? 25 : 0);
    if (vsBots && won) {
      C.achievements.unlock('lu-win');
      if (G.level === 'hard') C.achievements.unlock('lu-hard');
      // Fewest rolls of your own in a quick win against bots
      if (G.tokens === 2) C.stats.best('ludo', 'rolls', G.myRolls, true);
    }
    if (G.daily) {
      var first = C.stats.daily('ludo', G.daily, { label: won ? C.t('won') + ' · ' + C.num(G.myRolls) : C.t('lost'), win: won });
      if (!first) { coins = Math.round(coins * 0.2); points = Math.round(points * 0.2); }
    }
    ctx.clearSave();
    ctx.finish({
      won: vsBots ? won : null,
      title: vsBots ? (won ? C.t('won') : C.t('lost')) : C.t('playerWon', { n: pname(w) }),
      timeMs: Date.now() - G.startedAt, coins: coins, points: points,
      lines: [
        { label: C.t('rollsLabel'), value: C.num(G.myRolls) },
        { label: C.t('capturesLabel'), value: C.num(G.captures) }
      ],
      shareText: 'چوگان · منچ' + (G.daily ? ('\nروزانه ' + G.daily) : '') + '\n' + pname(w),
      paint: cardPaint(),
      onAgain: G.daily ? null : function () { newGame(current()); }
    });
  }

  /* ------------------------------------------------------------- saves */

  // Saved between turns and as soon as the die lands, with the roll. A token
  // caught mid-move is saved as the turn before it, so a reload plays that same
  // roll again.
  ctx.autosave(function () {
    if (!G || G.done || (!G.s.rolls && !G.roll)) return { inProgress: false };
    return {
      g: {
        players: G.players, mode: G.mode, level: G.level, tokens: G.tokens, daily: G.daily, s: G.s,
        // a die that has landed but not been played yet; 0 between turns
        roll: G.roll,
        captures: G.captures, myRolls: G.myRolls, elapsed: Date.now() - G.startedAt
      },
      prefs: prefs
    };
  });
  function save() { ctx.save(); }

  function validSave(sv) {
    var g = sv && sv.g, s = g && g.s;
    return !!(g && [2, 3, 4].indexOf(g.players) >= 0 && (g.tokens === 2 || g.tokens === 4) && LEVELS.indexOf(g.level) >= 0 &&
      (g.mode === 'bots' || g.mode === 'people') && s && Array.isArray(s.pos) && s.pos.length === g.players &&
      s.pos.every(function (t) { return Array.isArray(t) && t.length === g.tokens; }) && s.winner < 0 &&
      s.turn >= 0 && s.turn < g.players);
  }
  function restore(g) {
    G = {
      players: g.players, mode: g.mode, level: g.level, tokens: g.tokens, daily: g.daily || null, s: g.s,
      phase: 'roll', roll: 0, msg: '', captures: g.captures || 0, myRolls: g.myRolls || 0,
      startedAt: Date.now() - (g.elapsed || 0), done: false
    };
    render();
    if (g.roll >= 1 && g.roll <= 6) { G.phase = 'busy'; G.roll = g.roll; afterRoll(g.roll); }
    else startTurn();
  }

  function askNew() {
    if (!G || !G.daily) { settings(); return; }
    var dd = G.daily;
    if (G.done || !G.s.rolls) { newGame({ daily: dd }); return; }
    C.ui.confirm({ title: C.t('newMatch'), body: C.t('resetWarn'), onOk: function () { newGame({ daily: dd }); } });
  }

  // New game settings in one window, so the board keeps the room on a phone.
  // Nothing changes until Start, so it doubles as the "end this game?" question.
  function settings() {
    var o = G ? current() : fromPrefs(), body = el('div', { class: 'ch-col', style: { gap: 'var(--s-3)', 'align-items': 'center' } });
    function rows() {
      body.innerHTML = '';
      body.appendChild(C.ui.segmented([2, 3, 4].map(function (n) { return { value: n, label: C.num(n) + ' ' + C.t('players') }; }),
        o.players, function (v) { o.players = v; }));
      body.appendChild(C.ui.segmented([{ value: 'bots', label: C.t('vsBots') }, { value: 'people', label: C.t('people') }],
        o.mode, function (v) { o.mode = v; rows(); }));
      if (o.mode === 'bots') {
        body.appendChild(C.ui.segmented(LEVELS.map(function (l) { return { value: l, label: C.t(l) }; }), o.level, function (v) { o.level = v; }));
      }
      body.appendChild(C.ui.segmented([{ value: 2, label: C.t('quick') }, { value: 4, label: C.t('full') }], o.tokens, function (v) { o.tokens = v; }));
      if (G && G.s.rolls && !G.done) body.appendChild(el('p', { class: 'ch-xs ch-dim', text: C.t('resetWarn') }));
    }
    rows();
    C.ui.modal({
      title: C.t('newMatch'), closeButton: true, body: [body],
      actions: [{ label: C.t('cancel') }, { label: C.t('start'), kind: 'primary', onClick: function () { newGame(o); } }]
    });
  }

  /* --------------------------------------------------------------- draw */

  function colors() {
    var cs = getComputedStyle(document.documentElement);
    var v = function (k, f) { return cs.getPropertyValue(k).trim() || f; };
    return {
      c: [v('--lu-c0', '#E5484D'), v('--lu-c1', '#23A26D'), v('--lu-c2', '#E8A317'), v('--lu-c3', '#2F6FDE')],
      cell: v('--c-surface', '#FFFFFF'), bg: v('--c-surface-2', '#F7F1E8'), line: v('--c-line', '#E6DDD0'),
      text: v('--c-text', '#2B2118'), dim: v('--c-text-faint', '#A89A88')
    };
  }

  function boardSize() {
    // the slot the core sized for the board (#359); before, 520-560px wide at most and
    // the window's height less a guess for the rows below
    var maxW = boardBox.clientWidth || 360, maxH = boardBox.clientHeight || maxW;
    var cell = Math.floor(Math.min(maxW, maxH) / 15);
    return { cell: cell, w: cell * 15 };
  }

  // Corners of the four bases, in board cells, by colour
  var BASE = [[0, 0], [9, 0], [9, 9], [0, 9]];
  var BASE_SPOT = [[2, 2], [4, 2], [2, 4], [4, 4]];
  // Where finished tokens wait in the middle, by colour
  var HOME_AT = [[6.65, 7.5], [7.5, 6.65], [8.35, 7.5], [7.5, 8.35]];

  function tint(hex, a) {
    var n = parseInt(hex.slice(1), 16);
    return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  function star(g, x, y, r, color) {
    g.beginPath();
    for (var k = 0; k < 10; k++) {
      var a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * 0.45 : r;
      g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    g.closePath();
    g.fillStyle = color; g.fill();
  }

  // Where token k of a seat is drawn, in board cells (its centre)
  function tokenAt(s, seat, k, p) {
    var c = s.colours[seat];
    if (p < 0) { var b = BASE[c], o = BASE_SPOT[k]; return [b[0] + o[0], b[1] + o[1]]; }
    if (p >= E.HOME) { var h = HOME_AT[c]; return [h[0] + (k - (s.tokens - 1) / 2) * 0.28 * (c % 2 ? 1 : 0), h[1] + (k - (s.tokens - 1) / 2) * 0.28 * (c % 2 ? 0 : 1)]; }
    var q = E.cell(c, p);
    return [q[0] + 0.5, q[1] + 0.5];
  }

  function paintBoard(g, W, o, col) {
    var u = W / 15, s = o.s;
    g.fillStyle = col.bg;
    C.rrect(g, 0, 0, W, W, Math.round(u * 0.6));
    g.fill();
    // bases
    for (var c = 0; c < 4; c++) {
      var b = BASE[c], playing = s.colours.indexOf(c) >= 0;
      g.fillStyle = playing ? col.c[c] : tint(col.c[c], 0.25);
      C.rrect(g, b[0] * u + u * 0.15, b[1] * u + u * 0.15, 6 * u - u * 0.3, 6 * u - u * 0.3, u * 0.6);
      g.fill();
      g.fillStyle = col.cell;
      C.rrect(g, (b[0] + 1) * u, (b[1] + 1) * u, 4 * u, 4 * u, u * 0.5);
      g.fill();
      for (var k = 0; k < 4; k++) {
        g.beginPath();
        g.arc((b[0] + BASE_SPOT[k][0]) * u, (b[1] + BASE_SPOT[k][1]) * u, u * 0.55, 0, Math.PI * 2);
        g.fillStyle = tint(col.c[c], playing ? 0.22 : 0.1); g.fill();
      }
    }
    // the loop and the home columns
    g.lineWidth = Math.max(1, u / 24);
    E.TRACK.forEach(function (q, i) {
      var colour = -1;
      for (var c2 = 0; c2 < 4; c2++) if (i === 13 * c2) colour = c2;
      g.fillStyle = colour >= 0 ? col.c[colour] : col.cell;
      g.fillRect(q[0] * u, q[1] * u, u, u);
      g.strokeStyle = col.line;
      g.strokeRect(q[0] * u, q[1] * u, u, u);
      if (E.SAFE.indexOf(i) >= 0 && colour < 0) star(g, (q[0] + 0.5) * u, (q[1] + 0.5) * u, u * 0.32, col.dim);
      if (colour >= 0) star(g, (q[0] + 0.5) * u, (q[1] + 0.5) * u, u * 0.3, 'rgba(255,255,255,.75)');
    });
    for (c = 0; c < 4; c++) {
      for (var p = E.LAST + 1; p < E.HOME; p++) {
        var h = E.cell(c, p);
        g.fillStyle = tint(col.c[c], 0.85);
        g.fillRect(h[0] * u, h[1] * u, u, u);
        g.strokeStyle = col.line;
        g.strokeRect(h[0] * u, h[1] * u, u, u);
      }
    }
    // the home in the middle: four triangles, one per colour
    var cx = 7.5 * u, cy = 7.5 * u, tri = [[[6, 6], [6, 9]], [[6, 6], [9, 6]], [[9, 6], [9, 9]], [[6, 9], [9, 9]]];
    for (c = 0; c < 4; c++) {
      g.beginPath();
      g.moveTo(tri[c][0][0] * u, tri[c][0][1] * u);
      g.lineTo(tri[c][1][0] * u, tri[c][1][1] * u);
      g.lineTo(cx, cy);
      g.closePath();
      g.fillStyle = col.c[c]; g.fill();
    }
    // tokens; several on one cell sit side by side and a little smaller
    var list = [];
    for (var seat = 0; seat < s.colours.length; seat++) {
      for (k = 0; k < s.tokens; k++) {
        var pp = s.pos[seat][k];
        if (o.anim && o.anim.seat === seat && o.anim.k === k) pp = o.anim.steps[o.anim.i];
        var at = tokenAt(s, seat, k, pp), fl = null;
        if (o.fly) for (var fi = 0; fi < o.fly.length; fi++) if (o.fly[fi].seat === seat && o.fly[fi].k === k) fl = o.fly[fi];
        if (fl) { list.push({ seat: seat, k: k, p: pp, x: fl.x, y: fl.y, key: '', flying: true }); continue; }
        list.push({ seat: seat, k: k, p: pp, x: at[0], y: at[1], key: pp >= 0 && pp < E.HOME ? at[0] + ',' + at[1] : '' });
      }
    }
    var groups = {};
    list.forEach(function (t) { if (t.key) (groups[t.key] = groups[t.key] || []).push(t); });
    Object.keys(groups).forEach(function (key) {
      var gr = groups[key];
      if (gr.length < 2) return;
      gr.forEach(function (t, i) {
        var a = i * Math.PI * 2 / gr.length - Math.PI / 4;
        t.x += Math.cos(a) * 0.2; t.y += Math.sin(a) * 0.2; t.small = true;
      });
    });
    spots = [];
    var now = o.now || 0, pulse = 0.5 + 0.5 * Math.sin(now / 160);
    list.forEach(function (t) {
      var c3 = s.colours[t.seat], R = u * (t.small ? 0.3 : (t.p >= E.HOME ? 0.22 : 0.38));
      if (t.flying) R = u * 0.42;
      var x = t.x * u, y = t.y * u;
      var movable = o.movable && t.seat === s.turn && o.movable.indexOf(t.k) >= 0;
      if (movable) {
        g.beginPath(); g.arc(x, y, R * (1.35 + pulse * 0.15), 0, Math.PI * 2);
        g.fillStyle = tint(col.c[c3], 0.3); g.fill();
      }
      g.beginPath(); g.arc(x + R * 0.08, y + R * 0.14, R, 0, Math.PI * 2);
      g.fillStyle = 'rgba(0,0,0,.25)'; g.fill();
      g.beginPath(); g.arc(x, y, R, 0, Math.PI * 2);
      g.fillStyle = col.c[c3]; g.fill();
      g.lineWidth = Math.max(1.5, R * 0.22);
      g.strokeStyle = '#FFFFFF'; g.stroke();
      g.beginPath(); g.arc(x - R * 0.3, y - R * 0.32, R * 0.28, 0, Math.PI * 2);
      g.fillStyle = 'rgba(255,255,255,.45)'; g.fill();
      if (o.sel === t.k && movable) {
        g.beginPath(); g.arc(x, y, R * 1.55, 0, Math.PI * 2);
        g.lineWidth = Math.max(2, u / 12); g.strokeStyle = col.text; g.stroke();
      }
      spots.push({ seat: t.seat, k: t.k, x: x, y: y, r: Math.max(R * 1.6, u * 0.6) });
    });
  }

  var raf = 0;
  function draw() {
    if (!G) return;
    var B = boardSize(), dpr = Math.min(2, window.devicePixelRatio || 1);
    // both sides: a new canvas is 300×150, so a board exactly 300px wide kept a
    // 150px-high backing and was drawn squashed (#359, seen in Ludo)
    if (cv.width !== B.w * dpr || cv.height !== B.w * dpr) { cv.width = B.w * dpr; cv.height = B.w * dpr; }
    cv.style.width = B.w + 'px'; cv.style.height = B.w + 'px';
    var g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, B.w, B.w);
    var movable = G.phase === 'choose' ? E.moves(G.s, G.roll) : null;
    var fly = null;
    if (lfx) {
      var ft = Math.min(1, (performance.now() - lfx.t0) / FLY_MS);
      if (ft < 1) fly = lfx.list.map(function (f) { var q = flyAt(f, ft); return { seat: f.seat, k: f.k, x: q[0], y: q[1] }; });
    }
    paintBoard(g, B.w, { s: anim ? anim.from : G.s, anim: anim, movable: movable, sel: kbOn ? sel : -1, now: performance.now(), fly: fly }, colors());
  }
  function loop() {
    raf = 0;
    draw();
    if (G && G.phase === 'choose' && !C.ui.reduceMotion() && !document.hidden) raf = requestAnimationFrame(loop);
  }
  function kick() { if (!raf) raf = requestAnimationFrame(loop); }

  var PIPS = { 1: [[1, 1]], 2: [[0, 0], [2, 2]], 3: [[0, 0], [1, 1], [2, 2]], 4: [[0, 0], [2, 0], [0, 2], [2, 2]],
    5: [[0, 0], [2, 0], [1, 1], [0, 2], [2, 2]], 6: [[0, 0], [2, 0], [0, 1], [2, 1], [0, 2], [2, 2]] };
  function drawDie(v) {
    var c = G ? 'var(--lu-c' + G.s.colours[G.s.turn] + ')' : 'var(--c-text)';
    var s = '<svg viewBox="0 0 44 44" width="44" height="44" aria-hidden="true">';
    if (v) PIPS[v].forEach(function (q) { s += '<circle cx="' + (10 + q[0] * 12) + '" cy="' + (10 + q[1] * 12) + '" r="4.6" fill="' + c + '"/>'; });
    else s += '<path d="M14 22h16M22 14v16" stroke="' + c + '" stroke-width="3" stroke-linecap="round" opacity=".4"/>';
    die.innerHTML = s + '</svg>';
  }

  function cardPaint() {
    var s = E.copy(G.s);
    return function (g, W, H) {
      var side = Math.min(W, H);
      g.translate((W - side) / 2, (H - side) / 2);
      paintBoard(g, side, { s: s, now: 0 }, colors());
    };
  }

  function pname(seat) {
    if (seat === 0) return C.state.profile.name || C.t('you');
    if (isBot(seat)) return G.players > 2 ? C.t('bot') + ' ' + C.num(seat + 1) : C.t('bot') + ' · ' + C.t(G.level);
    return C.t('playerN', { n: C.num(seat + 1) });
  }

  function drawPlayers() {
    playersRow.innerHTML = '';
    playersRow.classList.toggle('lu-players--many', G.players > 2);
    for (var seat = 0; seat < G.players; seat++) {
      var homeN = G.s.pos[seat].filter(function (p) { return p >= E.HOME; }).length;
      var box = el('div', {
        class: 'lu-player' + (G.s.turn === seat && !G.done ? ' lu-player--on' : ''),
        style: { '--pc': 'var(--lu-c' + G.s.colours[seat] + ')' }
      }, [
        el('div', { class: 'lu-player__dot' }),
        el('div', { class: 'lu-player__name', text: pname(seat) }),
        el('span', { class: 'lu-player__n', text: C.num(homeN) + '/' + C.num(G.tokens) })
      ]);
      if (isBot(seat) && G.s.turn === seat && !G.done) box.classList.add('lu-thinking');
      playersRow.appendChild(box);
    }
  }

  function drawTop() {
    top.innerHTML = '';
    if (G.daily) {
      top.appendChild(el('span', { class: 'ch-badge ch-badge--accent' },
        [C.icon('calendar', 14), el('span', { text: C.t('dailyLudo') + ' — ' + C.num(G.daily) })]));
      top.appendChild(el('span', { class: 'ch-badge', text: C.t('vsMedium') }));
      return;
    }
    var o = current();
    var parts = [C.num(o.players) + ' ' + C.t('players'), o.mode === 'bots' ? C.t('vsBots') + ' · ' + C.t(o.level) : C.t('people'), C.t(o.tokens === 2 ? 'quick' : 'full')];
    top.appendChild(el('button', { class: 'ch-badge ch-tap', type: 'button', onclick: askNew, text: parts.join(' · ') }));
  }

  function drawBar() {
    var mine = !isBot(G.s.turn) && !G.done;
    die.style.setProperty('--pc', 'var(--lu-c' + G.s.colours[G.s.turn] + ')');
    die.disabled = !(mine && G.phase === 'roll');
    die.classList.toggle('lu-die--ready', mine && G.phase === 'roll');
    if (G.phase === 'roll' && !G.roll) drawDie(0);
    // "You's turn" read wrong; seat one is always the person holding the phone
    var who = G.s.turn === 0 ? C.t('yourTurn') : C.t('turnOf', { n: pname(G.s.turn) });
    status.textContent = G.msg ? (G.phase === 'roll' && !isBot(G.s.turn) ? G.msg + ' · ' + C.t('roll') : G.msg) :
      (G.phase === 'roll' && mine ? (G.players > 1 && G.mode === 'people' ? who + ' · ' : '') + C.t('roll') : who);
  }

  function render() {
    if (!G) return;
    drawTop();
    drawPlayers();
    drawBar();
    draw();
  }

  /* -------------------------------------------------------------- input */

  die.addEventListener('click', function () { if (G && !G.done && !isBot(G.s.turn) && G.phase === 'roll') { kbOn = false; doRoll(); } });

  cv.addEventListener('pointerdown', function (e) {
    if (!G || G.done || G.phase !== 'choose' || isBot(G.s.turn)) return;
    var r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    var list = E.moves(G.s, G.roll), best = null, bestD = Infinity;
    spots.forEach(function (t) {
      if (t.seat !== G.s.turn) return;
      // a token that shares its spot with the listed one makes the same move
      var k = list.indexOf(t.k) >= 0 ? t.k : list.filter(function (m) { return G.s.pos[t.seat][m] === G.s.pos[t.seat][t.k]; })[0];
      if (k === undefined) return;
      var d = Math.hypot(t.x - x, t.y - y);
      if (d <= t.r && d < bestD) { bestD = d; best = k; }
    });
    if (best === null) return;
    e.preventDefault();
    kbOn = false;
    move(best);
  });

  window.addEventListener('keydown', function (e) {
    if (!G || G.done || document.querySelector('.ch-scrim') || isBot(G.s.turn)) return;
    var k = e.key;
    if (G.phase === 'roll' && (k === ' ' || k === 'Enter' || C.keyIs(e, 'r'))) { e.preventDefault(); doRoll(); return; }
    if (G.phase !== 'choose') return;
    var list = E.moves(G.s, G.roll);
    if (k === 'ArrowRight' || k === 'ArrowLeft' || k === 'ArrowUp' || k === 'ArrowDown' || k === 'Tab') {
      e.preventDefault();
      kbOn = true;
      var i = list.indexOf(sel), d = (k === 'ArrowLeft' || k === 'ArrowUp' || (k === 'Tab' && e.shiftKey)) ? -1 : 1;
      sel = list[((i < 0 ? 0 : i + d) % list.length + list.length) % list.length];
      draw();
      return;
    }
    if ((k === ' ' || k === 'Enter') && list.indexOf(sel) >= 0) { e.preventDefault(); move(sel); }
  });

  // the board follows its slot, which changes with the window and the side column (#359)
  if (window.ResizeObserver) new ResizeObserver(function () { if (G) draw(); }).observe(boardBox);
  else window.addEventListener('resize', function () { if (G) draw(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && G) kick(); });
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', function () { if (G) draw(); });
  }
  // A pause in the middle of a move plays the same roll again from the turn's
  // start (the move is applied only when it ends); a die still in the air is
  // thrown again, before anyone has seen it.
  C.onPause(function () { stop(); });
  C.onResume(function () {
    if (!G || G.done) return;
    if (G.phase === 'choose') { kick(); return; }
    anim = null;
    die.classList.remove('lu-die--roll');
    if (G.roll) { G.phase = 'busy'; G.msg = ''; afterRoll(G.roll); }
    else startTurn();
  });

  /* --------------------------------------------------------------- help */

  function kb(k, what) {
    return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]);
  }
  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [
          kb('Space / R', C.t('rollKey')), kb('← → / Tab', C.t('pickKey')), kb('Space / Enter', C.t('moveKey'))
        ])
      ],
      actions: [
        { label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } },
        { label: C.t('done'), kind: 'primary' }
      ]
    });
  }

  function art(kind) {
    var s = '<svg viewBox="0 0 220 120" width="100%">';
    if (kind === 1) {
      s += '<rect x="30" y="10" width="100" height="100" rx="14" fill="var(--lu-c0)"/><rect x="47" y="27" width="66" height="66" rx="10" fill="var(--c-surface)"/>' +
        '<circle cx="64" cy="44" r="10" fill="var(--lu-c0)" stroke="#fff" stroke-width="3"/><circle cx="96" cy="76" r="10" fill="var(--lu-c0)" stroke="#fff" stroke-width="3"/>' +
        '<rect x="150" y="38" width="44" height="44" rx="10" fill="var(--c-surface)" stroke="var(--c-line)" stroke-width="2"/>';
      [[0, 0], [2, 0], [0, 1], [2, 1], [0, 2], [2, 2]].forEach(function (q) { s += '<circle cx="' + (160 + q[0] * 12) + '" cy="' + (48 + q[1] * 12) + '" r="3.8" fill="var(--lu-c0)"/>'; });
    } else if (kind === 2) {
      for (var i = 0; i < 6; i++) s += '<rect x="' + (20 + i * 30) + '" y="45" width="30" height="30" fill="var(--c-surface)" stroke="var(--c-line)" stroke-width="1.5"/>';
      s += '<path d="M155 50l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" fill="var(--c-text-faint)"/>' +
        '<circle cx="95" cy="60" r="10" fill="var(--lu-c2)" stroke="#fff" stroke-width="3" opacity=".35"/><circle cx="95" cy="60" r="10" fill="var(--lu-c0)" stroke="#fff" stroke-width="3"/>' +
        '<path d="M50 40q22-26 40 6" stroke="var(--lu-c0)" stroke-width="3" fill="none" stroke-linecap="round"/>';
    } else {
      s += '<path d="M70 20h80v80H70z" fill="var(--c-surface)"/><path d="M70 20l40 40-40 40z" fill="var(--lu-c0)"/><path d="M70 20h80l-40 40z" fill="var(--lu-c1)"/>' +
        '<path d="M150 20v80l-40-40z" fill="var(--lu-c2)"/><path d="M70 100h80l-40-40z" fill="var(--lu-c3)"/>' +
        '<circle cx="86" cy="52" r="7" fill="var(--lu-c0)" stroke="#fff" stroke-width="2.5"/><circle cx="86" cy="68" r="7" fill="var(--lu-c0)" stroke="#fff" stroke-width="2.5"/>';
    }
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: art(1) },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: art(2) },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: art(3) }
  ];

  /* -------------------------------------------------------------- start */

  var saved = ctx.loadSave();
  if (dailyDate) {
    // The daily game has its own save slot, so a half-played day continues
    if (validSave(saved) && saved.g.daily === dailyDate) restore(saved.g);
    else newGame({ daily: dailyDate });
    if (C.stats.dailyDone('ludo', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).ludo;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec.label });
    }
    ctx.tutorialIfNew(TUT);
  } else if (validSave(saved) && !saved.g.daily) {
    if (saved.prefs) prefs = saved.prefs;
    restore(saved.g);
  } else {
    newGame(fromPrefs());
    ctx.tutorialIfNew(TUT);
  }
})();
</script>
</body>
</html>
