  /* Sandstone squares in the light theme, dark stone in the dark one. Each side's piece has
     an edge that reaches 3:1 on a square in both, since an ivory spool on a pale square or
     a dark cone on a dark square cannot rely on its fill */
  :root { --sn-sq: #EADFC6; --sn-sq-sp: #DDCBA6; --sn-frame: #B08D58; --sn-glyph: #7A5C2E; --sn-p0: #FBF6EA; --sn-p0-edge: #6B5532; --sn-p1: #3D2B1F; --sn-p1-edge: #24170E; --sn-ring: var(--game); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --sn-sq: #3A3127; --sn-sq-sp: #4A3D2E; --sn-frame: #241D16; --sn-glyph: #C9A774; --sn-p0: #EDE3CC; --sn-p0-edge: #F7EFDC; --sn-p1: #1E150D; --sn-p1-edge: #C9A26A; --sn-ring: var(--game-text-dark, #C8CC9C); }
  }
  :root[data-theme="dark"] { --sn-sq: #3A3127; --sn-sq-sp: #4A3D2E; --sn-frame: #241D16; --sn-glyph: #C9A774; --sn-p0: #EDE3CC; --sn-p0-edge: #F7EFDC; --sn-p1: #1E150D; --sn-p1-edge: #C9A26A; --sn-ring: var(--game-text-dark, #C8CC9C); }
  /* three columns of ten with the two trays beside them in a tall window, three rows of ten
     with the trays above and below in a wide one; the script lays the squares out for
     whichever shape the slot gives it */

  @container game (min-aspect-ratio: 5 / 4) { .sn-wrap > .ch-fit { --fit-ar: 2.17; } }

  .sn-board { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: grid; direction: ltr; gap: 3px; padding: 4px;
    background: var(--sn-frame); border-radius: var(--r-md); box-shadow: var(--sh-1);
    grid-template-columns: .8fr repeat(3, 1fr) .8fr; grid-template-rows: repeat(10, 1fr); }
  .sn-board.sn-wide { grid-template-columns: repeat(10, 1fr); grid-template-rows: .8fr repeat(3, 1fr) .8fr; }

<script src="../../version.js"></script>
<script src="../../lib/chogan.js"></script>
<script>
/* ==== ENGINE START ==== */
function SenetEngineFactory() {
  'use strict';

  // Thirty squares on one path, index 0 (square 1) to 29 (square 30), laid out in an S on
  // a 3×10 board. b[i] is the side on square i (0 light, 1 dark) or -1. The rules are the
  // simplified modern ones after Timothy Kendall's reconstruction: nobody knows the
  // Egyptians' own, so the game says so in its help.
  var N = 30, OFF = 30, PIECES = 5, REBIRTH = 14, HAPPY = 25, WATER = 26;
  var LEVELS = ['easy', 'medium', 'hard'];
  // four two-sided sticks: k marked sides up has C(4,k)/16 odds, and none up counts as 5
  var PROB = [0, 4 / 16, 6 / 16, 4 / 16, 1 / 16, 1 / 16];

  function newGame() {
    var b = [];
    for (var i = 0; i < N; i++) b.push(i < 10 ? i % 2 : -1);
    return { b: b, off: [0, 0], turn: 0, roll: 0, throws: 0, plies: 0, winner: -1, wet: [0, 0], last: null };
  }
  function clone(S) {
    return { b: S.b.slice(), off: S.off.slice(), turn: S.turn, roll: S.roll, throws: S.throws, plies: S.plies, winner: S.winner,
      wet: S.wet.slice(), last: S.last ? JSON.parse(JSON.stringify(S.last)) : null };
  }
  function sticks(rnd) { return [0, 1, 2, 3].map(function () { return rnd() < 0.5 ? 1 : 0; }); }
  function count(st) { var k = 0; for (var i = 0; i < st.length; i++) if (st[i]) k++; return k || 5; }

  // from square 26 on, a piece can never be swapped
  function safe(i) { return i >= HAPPY; }
  function isProtected(b, i) { var o = b[i]; return o >= 0 && ((i > 0 && b[i - 1] === o) || (i < N - 1 && b[i + 1] === o)); }
  function runAt(b, i) {
    var o = b[i], n = 1, k;
    if (o < 0) return 0;
    for (k = i - 1; k >= 0 && b[k] === o; k--) n++;
    for (k = i + 1; k < N && b[k] === o; k++) n++;
    return n;
  }
  // a piece out of the water goes to 15, or the nearest free square before it, or after it
  function rebirth(b) {
    if (b[REBIRTH] < 0) return REBIRTH;
    for (var i = REBIRTH - 1; i >= 0; i--) if (b[i] < 0) return i;
    for (var j = REBIRTH + 1; j < HAPPY; j++) if (b[j] < 0) return j;
    return -1;
  }

  // Where the piece on f goes with a throw of r, or null: {kind, to[, back]}
  function dest(S, f, r) {
    var b = S.b, me = b[f], foe = 1 - me;
    if (me < 0 || r < 1 || r > 5) return null;
    if (f > HAPPY) return f + r === N ? { kind: 'off', to: OFF } : null;
    if (f === HAPPY) {
      if (r === 5) return { kind: 'off', to: OFF };
      if (r === 1) {
        var nb = b.slice(); nb[f] = -1;
        var back = rebirth(nb);
        return back < 0 ? null : { kind: 'water', to: WATER, back: back };
      }
      return b[f + r] < 0 ? { kind: 'step', to: f + r } : null;
    }
    var t = f + r;
    // every piece must stop on 26 before going on
    if (t > HAPPY) return null;
    for (var j = f + 1; j < t; j++) if (b[j] === foe && runAt(b, j) >= 3) return null;
    if (b[t] === me) return null;
    if (b[t] === foe) return safe(t) || isProtected(b, t) ? null : { kind: 'swap', to: t };
    return { kind: 'step', to: t };
  }
  function moves(S, r) {
    if (r === undefined) r = S.roll;
    var out = [];
    if (S.winner >= 0 || !r) return out;
    for (var i = 0; i < N; i++) if (S.b[i] === S.turn && dest(S, i, r)) out.push(i);
    return out;
  }
  // A throw: with no legal move the turn passes at once
  function setRoll(S, r) {
    if (S.winner >= 0 || S.roll || r < 1 || r > 5) return null;
    S.roll = r; S.throws++;
    if (!moves(S).length) { S.roll = 0; S.turn = 1 - S.turn; return { passed: true, roll: r }; }
    return { passed: false, roll: r };
  }
  function play(S, f) {
    if (S.winner >= 0 || !S.roll || S.b[f] !== S.turn) return null;
    var r = S.roll, d = dest(S, f, r), me = S.turn;
    if (!d) return null;
    var info = { side: me, from: f, to: d.to, kind: d.kind, roll: r, back: -1, extra: false };
    S.b[f] = -1;
    if (d.kind === 'off') S.off[me]++;
    else if (d.kind === 'water') { S.b[d.back] = me; info.back = d.back; S.wet[me]++; }
    else if (d.kind === 'swap') { S.b[f] = 1 - me; S.b[d.to] = me; }
    else S.b[d.to] = me;
    S.plies++;
    S.roll = 0;
    if (S.off[me] >= PIECES) S.winner = me;
    else if (r === 1 || r === 4 || r === 5) info.extra = true;
    else S.turn = 1 - me;
    S.last = info;
    return info;
  }

  // Squares gained, plus bonuses: a piece borne off is worth more than square 30, a pair is
  // safe, and a lone piece loses about twice its distance when an enemy behind it can swap
  function sideValue(S, p) {
    var b = S.b, q = 1 - p, v = S.off[p] * 40;
    for (var i = 0; i < N; i++) {
      if (b[i] !== p) continue;
      v += i + 1;
      if (i === HAPPY) v += 2;
      if (i < HAPPY) {
        if (isProtected(b, i)) v += 1.5;
        else for (var d = 1; d <= 5 && i - d >= 0; d++) if (b[i - d] === q) v -= 2 * d * PROB[d];
      }
    }
    return v;
  }
  function evaluate(S, p) {
    if (S.winner >= 0) return S.winner === p ? 1e4 : -1e4;
    return sideValue(S, p) - sideValue(S, 1 - p);
  }

  // easy: any legal move. medium: the best position after this move, with a little noise.
  // hard: expectimax over the five throws and their odds, deepened while time allows.
  function think(S, level, rnd, ms) {
    var mv = moves(S);
    if (!mv.length) return -1;
    if (mv.length === 1) return mv[0];
    rnd = rnd || Math.random;
    if (level === 'easy') return mv[Math.floor(rnd() * mv.length)];
    var me = S.turn, i, U;
    if (level !== 'hard') {
      var best = mv[0], bv = -Infinity;
      for (i = 0; i < mv.length; i++) {
        U = clone(S); play(U, mv[i]);
        var v = evaluate(U, me) + rnd();
        if (v > bv) { bv = v; best = mv[i]; }
      }
      return best;
    }
    var deadline = Date.now() + (ms || 450), nodes = 0, STOP = {};
    function tick() { if ((++nodes & 255) === 0 && Date.now() > deadline) throw STOP; }
    // T is waiting for a throw
    function chance(T, depth) {
      if (T.winner >= 0 || depth <= 0) return evaluate(T, me);
      var v = 0;
      for (var r = 1; r <= 5; r++) {
        var X = clone(T), res = setRoll(X, r);
        tick();
        v += PROB[r] * (res.passed ? chance(X, depth - 1) : choose(X, depth));
      }
      return v;
    }
    function choose(T, depth) {
      var ms2 = moves(T), maxi = T.turn === me, bestV = maxi ? -Infinity : Infinity;
      for (var k = 0; k < ms2.length; k++) {
        var X = clone(T); play(X, ms2[k]);
        var v = chance(X, depth - 1);
        if (maxi ? v > bestV : v < bestV) bestV = v;
      }
      return bestV;
    }
    var pick = mv[0];
    try {
      for (var depth = 1; depth <= 8; depth++) {
        var bd = mv[0], bvd = -Infinity;
        for (i = 0; i < mv.length; i++) {
          U = clone(S); play(U, mv[i]);
          var val = chance(U, depth - 1);
          if (val > bvd) { bvd = val; bd = mv[i]; }
        }
        pick = bd;
        // try the last depth's choice first, so an interrupted depth still has it
        mv.splice(mv.indexOf(bd), 1); mv.unshift(bd);
      }
    } catch (e) { if (e !== STOP) throw e; }
    return pick;
  }

  // A save is checked before it is restored
  function valid(S) {
    if (!S || typeof S !== 'object' || !Array.isArray(S.b) || S.b.length !== N || !Array.isArray(S.off) || S.off.length !== 2 ||
      !Array.isArray(S.wet) || S.wet.length !== 2) return false;
    var n = [0, 0];
    for (var i = 0; i < N; i++) { var o = S.b[i]; if (o !== -1 && o !== 0 && o !== 1) return false; if (o >= 0) n[o]++; }
    if (S.b[WATER] !== -1) return false;
    for (var p = 0; p < 2; p++) {
      if (!Number.isInteger(S.off[p]) || S.off[p] < 0 || n[p] + S.off[p] !== PIECES) return false;
      if (!Number.isInteger(S.wet[p]) || S.wet[p] < 0) return false;
    }
    if (!Number.isInteger(S.throws) || S.throws < 0 || !Number.isInteger(S.plies) || S.plies < 0) return false;
    if (S.turn !== 0 && S.turn !== 1) return false;
    if (!Number.isInteger(S.roll) || S.roll < 0 || S.roll > 5) return false;
    if (S.winner !== -1 && S.winner !== 0 && S.winner !== 1) return false;
    if (S.winner >= 0 ? S.off[S.winner] !== PIECES || S.roll : S.off[0] >= PIECES || S.off[1] >= PIECES) return false;
    if (S.roll && !moves(S).length) return false;
    if (S.last !== null && (typeof S.last !== 'object' || Array.isArray(S.last))) return false;
    return true;
  }

  return { N: N, OFF: OFF, PIECES: PIECES, REBIRTH: REBIRTH, HAPPY: HAPPY, WATER: WATER, LEVELS: LEVELS, PROB: PROB,
    newGame: newGame, clone: clone, sticks: sticks, count: count, dest: dest, moves: moves, setRoll: setRoll, play: play,
    isProtected: isProtected, evaluate: evaluate, think: think, valid: valid };
}
if (typeof module !== 'undefined') module.exports = SenetEngineFactory;
/* ==== ENGINE END ==== */
</script>

    var b = G.S.b.slice();
    return function (g, W, H) {
      var col = colors(), d = Math.min(W / 10.4, H / 3.4), ox = (W - d * 10) / 2, oy = (H - d * 3) / 2;
      g.fillStyle = col.frame; g.fillRect(ox - d * 0.15, oy - d * 0.15, d * 10.3, d * 3.3);
      for (var i = 0; i < N; i++) {
        var line = Math.floor(i / 10), k = line % 2 ? 9 - i % 10 : i % 10, x = ox + k * d, y = oy + line * d;
        g.fillStyle = GLYPH[i] ? col.sp : col.sq; g.fillRect(x + d * 0.05, y + d * 0.05, d * 0.9, d * 0.9);
        if (b[i] >= 0) {
          g.fillStyle = b[i] ? col.p1 : col.p0; g.strokeStyle = b[i] ? col.e1 : col.e0; g.lineWidth = Math.max(1, d * 0.06);
          g.beginPath(); g.arc(x + d / 2, y + d / 2, d * 0.3, 0, Math.PI * 2); g.fill(); g.stroke();
        }
      }
    };
  }

  /* -------------------------------------------------------------- input */

  window.addEventListener('keydown', function (e) {
    if (!G || document.querySelector('.ch-scrim')) return;
    if (busy() || e.ctrlKey || e.metaKey || e.altKey) return;
    var tg = e.target && e.target.tagName;
    if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT') return;
    if (C.keyIs(e, 't')) { e.preventDefault(); if (canThrow()) doThrow(); return; }
    var S = G.S;
    // the board is the same picture in every language, so the arrows step along the path
    var step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (step && S.roll) {
      e.preventDefault();
      var can = E.moves(S);
      if (!can.length) return;
      var at = can.indexOf(sel);
      sel = at < 0 ? can[step > 0 ? 0 : can.length - 1] : can[(at + step + can.length) % can.length];
      renderBoard();
      return;
    }
    if ((e.key === 'Enter' || e.key === ' ') && tg !== 'BUTTON') {
      e.preventDefault();
      if (!S.roll) doThrow();
      else if (sel >= 0) act(sel);
    }
  });

  if (window.ResizeObserver) new ResizeObserver(function () { if (G) renderBoard(); }).observe(box);
  else window.addEventListener('resize', function () { if (G) renderBoard(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (G) renderBoard(); });

  /* --------------------------------------------------------------- help */

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('p', { class: 'ch-dim', text: C.t('rulesSq') }),
        el('p', { class: 'ch-xs ch-dim', text: C.t('rulesSrc') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [kb('T / Space', C.t('kThrow')), kb('← ↑ → ↓', C.t('kCursor')), kb('Space / Enter', C.t('kGo'))])
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  // small pictures in fixed colours for the three tutorial slides
  function tArt(kind) {
    var s = '<svg viewBox="0 0 200 90" width="100%">', d = 17, ox = 15, oy = 19;
    var sq = function (i, fill) {
      var line = Math.floor(i / 10), k = line % 2 ? 9 - i % 10 : i % 10;
      return '<rect x="' + (ox + k * d + 1) + '" y="' + (oy + line * d + 1) + '" width="' + (d - 2) + '" height="' + (d - 2) + '" rx="3" fill="' + fill + '"/>';
    };
    var at = function (i) { var line = Math.floor(i / 10), k = line % 2 ? 9 - i % 10 : i % 10; return [ox + k * d + d / 2, oy + line * d + d / 2]; };
    var dot = function (i, side) { var p = at(i); return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="5.5" fill="' + (side ? '#3D2B1F' : '#FBF6EA') + '" stroke="' + (side ? '#24170E' : '#6B5532') + '" stroke-width="1.8"/>'; };
    if (kind === 2) {
      // four sticks, two marked sides up: a throw of 2
      [1, 0, 1, 0].forEach(function (up, k) {
        s += '<rect x="' + (52 + k * 22) + '" y="14" width="12" height="62" rx="6" fill="' + (up ? '#4B3420' : '#E6D3AE') + '" stroke="#7A5C2E" stroke-width="2"/>';
        if (up) for (var j = 0; j < 5; j++) s += '<rect x="' + (52 + k * 22) + '" y="' + (22 + j * 11) + '" width="12" height="4" fill="#8A643A"/>';
      });
      s += '<text x="160" y="56" font-size="26" font-weight="800" fill="#4A5030" text-anchor="middle">= 2</text>';
      return s + '</svg>';
    }
    s += '<rect x="' + (ox - 3) + '" y="' + (oy - 3) + '" width="' + (d * 10 + 6) + '" height="' + (d * 3 + 6) + '" rx="5" fill="#B08D58"/>';
    for (var i = 0; i < N; i++) s += sq(i, GLYPH[i] ? '#DDCBA6' : '#EADFC6');
    if (kind === 1) {
      // the path as one line through the S
      var pts = [];
      for (var k2 = 0; k2 < N; k2++) pts.push(at(k2).join(','));
      s += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#4A5030" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>';
      [0, 2, 4, 6, 8].forEach(function (k3) { s += dot(k3, 0); });
      [1, 3, 5, 7, 9].forEach(function (k3) { s += dot(k3, 1); });
    } else {
      // a swap on the second row, and the water square
      s += dot(12, 0) + dot(15, 1);
      var a = at(12), b = at(15);
      s += '<path d="M' + a[0] + ' ' + (a[1] - 8) + 'Q' + ((a[0] + b[0]) / 2) + ' ' + (a[1] - 24) + ' ' + b[0] + ' ' + (b[1] - 8) + '" fill="none" stroke="#4A5030" stroke-width="2.2" marker-end="url(#ah)"/>';
      s += '<defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4A5030"/></marker></defs>';
      var w = at(E.WATER);
      s += '<rect x="' + (w[0] - d / 2 + 1) + '" y="' + (w[1] - d / 2 + 1) + '" width="' + (d - 2) + '" height="' + (d - 2) + '" rx="3" fill="#7FB2D6"/>';
      s += dot(E.HAPPY, 0);
    }
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: tArt(1) },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: tArt(2) },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: tArt(3) }
  ];

  /* -------------------------------------------------------------- start */

  var saved = ctx.loadSave();
  if (validSave(saved) && (saved.g.daily || null) === (dailyDate || null)) restore(saved.g);
  else newGame(dailyDate ? { daily: dailyDate } : { mode: prefs.mode, level: prefs.level });
  if (dailyDate && C.stats.dailyDone('senet', dailyDate)) {
    var rec = C.stats.dailyOf(dailyDate).senet;
    C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
  }
  ctx.tutorialIfNew(TUT);
})();
</script>
