<script>
/* ==== ENGINE START ==== */
function FiveDiceEngineFactory() {
  'use strict';

  var CATS = ['ones', 'twos', 'threes', 'fours', 'fives', 'sixes', 'three', 'four', 'full', 'small', 'large', 'yacht', 'chance'];
  var UPPER = 6, ROUNDS = 13, ROLLS = 3, BONUS_AT = 63, BONUS = 35;

  function counts(d) { var c = [0, 0, 0, 0, 0, 0, 0]; for (var i = 0; i < d.length; i++) c[d[i]]++; return c; }
  function sum(d) { var s = 0; for (var i = 0; i < d.length; i++) s += d[i]; return s; }
  // `len` faces in a row: 1-2-3-4 is a small straight whatever the fifth die shows
  function run(c, len) { var n = 0; for (var f = 1; f <= 6; f++) { n = c[f] ? n + 1 : 0; if (n >= len) return true; } return false; }

  // What the five dice score in one row. No joker rule: five alike is not a full house
  // or a straight, it counts only where its own pattern does
  function score(cat, d) {
    var k = CATS.indexOf(cat);
    if (k < 0) return 0;
    var c = counts(d), most = Math.max.apply(null, c);
    if (k < UPPER) return c[k + 1] * (k + 1);
    switch (cat) {
      case 'three': return most >= 3 ? sum(d) : 0;
      case 'four': return most >= 4 ? sum(d) : 0;
      case 'full': return c.indexOf(3) > 0 && c.indexOf(2) > 0 ? 25 : 0;
      case 'small': return run(c, 4) ? 30 : 0;
      case 'large': return run(c, 5) ? 40 : 0;
      case 'yacht': return most === 5 ? 50 : 0;
      default: return sum(d);
    }
  }

  // Every die is a fixed function of the game's seed and where it is rolled (round, roll,
  // position). Reopening the game can never roll again for a better result, and the daily
  // game gives everyone the same dice for the same choices
  function fmix(x) {
    x = Math.imul(x ^ (x >>> 16), 0x85EBCA6B);
    x = Math.imul(x ^ (x >>> 13), 0xC2B2AE35);
    return (x ^ (x >>> 16)) | 0;
  }
  // the seed is mixed on its own first: adding it raw to the position let seeds in a
  // pattern favour a face (one face came up 18.3% over a thousand such seeds)
  function die(seed, round, roll, i) {
    var x = fmix(fmix(seed ^ 0x5F3759DF) + Math.imul((round * 4 + roll) * 8 + i + 1, 0x9E3779B1));
    return Math.floor((fmix(x) >>> 0) / 4294967296 * 6) + 1;
  }

  function emptySheet() { var s = {}; CATS.forEach(function (c) { s[c] = null; }); return s; }
  function newGame(seed) {
    return { dice: [1, 2, 3, 4, 5], held: [false, false, false, false, false], rolls: 0, round: 0, sheet: emptySheet(), seed: seed | 0 };
  }
  function over(S) { return S.round >= ROUNDS; }

  // Rolls every die that is not kept (all five on a round's first roll); the indexes
  // that rolled, or null when no roll is left
  function roll(S) {
    if (over(S) || S.rolls >= ROLLS) return null;
    if (S.rolls === 0) S.held = [false, false, false, false, false];
    var rolled = [];
    for (var i = 0; i < 5; i++) {
      if (S.held[i]) continue;
      S.dice[i] = die(S.seed, S.round, S.rolls, i);
      rolled.push(i);
    }
    if (!rolled.length) return null;
    S.rolls++;
    return rolled;
  }
  // Keeping a die only means something between rolls
  function toggle(S, i) {
    if (over(S) || S.rolls === 0 || S.rolls >= ROLLS || i < 0 || i > 4) return false;
    S.held[i] = !S.held[i];
    return true;
  }

  function upper(sheet) { var s = 0; for (var k = 0; k < UPPER; k++) s += sheet[CATS[k]] || 0; return s; }
  function bonus(sheet) { return upper(sheet) >= BONUS_AT ? BONUS : 0; }
  function total(sheet) { var s = 0; CATS.forEach(function (c) { s += sheet[c] || 0; }); return s + bonus(sheet); }

  // Writes the dice into an empty row; a round must have been rolled at least once
  function place(S, cat) {
    if (over(S) || S.rolls === 0 || !Object.prototype.hasOwnProperty.call(S.sheet, cat) || S.sheet[cat] !== null) return null;
    var had = bonus(S.sheet) > 0, pts = score(cat, S.dice);
    S.sheet[cat] = pts;
    S.round++; S.rolls = 0; S.held = [false, false, false, false, false];
    return { cat: cat, points: pts, bonus: !had && bonus(S.sheet) > 0, over: over(S) };
  }

  function potentials(S) {
    var out = {};
    CATS.forEach(function (c) { out[c] = S.rolls > 0 && S.sheet[c] === null ? score(c, S.dice) : null; });
    return out;
  }

  // A value a row can really hold, so a damaged save is not restored
  function possible(cat, v) {
    var k = CATS.indexOf(cat);
    if (!Number.isInteger(v) || v < 0) return false;
    if (k < UPPER) return v % (k + 1) === 0 && v <= 5 * (k + 1);
    if (cat === 'three' || cat === 'four' || cat === 'chance') return v === 0 || (v >= 5 && v <= 30);
    return v === 0 || v === { full: 25, small: 30, large: 40, yacht: 50 }[cat];
  }
  function valid(s) {
    if (!s || !Array.isArray(s.dice) || s.dice.length !== 5 || !Array.isArray(s.held) || s.held.length !== 5 || !s.sheet) return false;
    if (!s.dice.every(function (v) { return Number.isInteger(v) && v >= 1 && v <= 6; })) return false;
    if (!s.held.every(function (v) { return typeof v === 'boolean'; })) return false;
    if (!Number.isInteger(s.round) || s.round < 0 || s.round >= ROUNDS || !Number.isInteger(s.rolls) || s.rolls < 0 || s.rolls > ROLLS || !Number.isInteger(s.seed)) return false;
    var filled = 0;
    for (var k = 0; k < CATS.length; k++) {
      var v = s.sheet[CATS[k]];
      if (v === null) continue;
      if (!possible(CATS[k], v)) return false;
      filled++;
    }
    return filled === s.round && Object.keys(s.sheet).length === CATS.length;
  }

  return { CATS: CATS, UPPER: UPPER, ROUNDS: ROUNDS, ROLLS: ROLLS, BONUS_AT: BONUS_AT, BONUS: BONUS,
    score: score, die: die, newGame: newGame, over: over, roll: roll, toggle: toggle, place: place,
    upper: upper, bonus: bonus, total: total, potentials: potentials, valid: valid };
}
if (typeof module !== 'undefined') module.exports = FiveDiceEngineFactory;
/* ==== ENGINE END ==== */
</script>

    bestV.textContent = C.num(best());
    top.innerHTML = '';
    if (S.daily) top.appendChild(el('span', { class: 'ch-badge ch-badge--accent' }, [C.icon('calendar', 14), el('span', { text: C.t('fdDaily') + ' — ' + C.num(S.daily) })]));
    status.textContent = ended ? '' : S.rolls === 0 ? C.t('fdHintRoll') : S.rolls < E.ROLLS ? C.t('fdHintHold') : C.t('fdHintPick');
  }

  function fitSize() {
    var w = table.getBoundingClientRect().width;
    if (w) table.style.setProperty('--u', (w / 100).toFixed(2) + 'px');
  }
  if (window.ResizeObserver) new ResizeObserver(fitSize).observe(table); else window.addEventListener('resize', fitSize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitSize);

  /* ------------------------------------------------------------- game */

  function seedFor() {
    var r = dailyDate ? C.daily('fivedice', dailyDate).rng : Math.random;
    return Math.floor(r() * 4294967296) | 0;
  }
  function newGame() {
    S = E.newGame(seedFor());
    S.daily = dailyDate || null;
    startedAt = Date.now(); ended = false;
    diceShown = [];
    render();
    save();
  }
  function askNew() {
    if (S && !ended && (S.round > 0 || S.rolls > 0)) C.ui.confirm({ title: C.t('newGame'), body: C.t('resetWarn'), onOk: newGame });
    else newGame();
  }

  function doRoll() {
    if (!S || ended) return;
    var rolled = E.roll(S);
    if (!rolled) return;
    C.feedback('clack');
    render();
    save();
    if (!C.ui.reduceMotion()) {
      // each die tumbles in from the button: the move on the button, the spin on its picture
      rolled.forEach(function (i, n) {
        C.ui.fly(dieBtns[i], rollBtn, { ms: 380, delay: n * 45 });
        var svg = dieBtns[i].firstChild;
        if (svg && svg.animate) svg.animate([{ transform: 'rotate(' + (n % 2 ? 260 : -260) + 'deg) scale(.7)' }, { transform: 'rotate(' + (n % 2 ? -12 : 12) + 'deg) scale(1.06)', offset: .75 }, { transform: 'none' }],
          { duration: 480, delay: n * 45, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'backwards' });
      });
    }
    var c = [0, 0, 0, 0, 0, 0, 0];
    S.dice.forEach(function (v) { c[v]++; });
    if (c.indexOf(5) > 0) setTimeout(function () { C.ui.burst(diceRow, { colors: ['#962A00', '#E8A15C', '#FFD27A'], count: 40, ring: true }); }, C.ui.reduceMotion() ? 0 : 450);
  }

  function hold(i) {
    if (!S || ended || !E.toggle(S, i)) return;
    C.feedback('select');
    render();
    save();
  }

  function pick(cat) {
    if (!S || ended) return;
    var t = E.place(S, cat);
    if (!t) return;
    C.feedback(t.points > 0 ? 'place' : 'tap');
    render();
    if (t.points > 0) C.ui.fly(rows[cat].v, diceRow, { ms: 340 });
    if (cat === 'yacht' && t.points === 50) { C.achievements.unlock('fd-yacht'); C.ui.burst(rows[cat].b, { colors: ['#962A00', '#FFD27A'], count: 30 }); }
    if (t.bonus) { C.achievements.unlock('fd-bonus'); C.ui.burst(bonusRow, { colors: ['#5C9A6B', '#FFD27A'], count: 24 }); }
    if (t.over) { finishGame(); return; }
    save();
    rollBtn.focus({ preventScroll: true });
  }

  function finishGame() {
    ended = true;
    var tot = E.total(S.sheet), prev = best(), isBest = tot > prev;
    C.stats.best('fivedice', 'score', tot);
    if (tot >= 250) C.achievements.unlock('fd-250');
    var coins = Math.max(2, Math.round(tot / 25)), points = Math.max(1, Math.min(120, Math.round(tot / 3)));
    if (S.daily) {
      C.achievements.unlock('fd-daily');
      if (!C.stats.daily('fivedice', S.daily, { label: C.t('fdScoreN', { s: C.num(tot) }), win: true })) {
        coins = Math.round(coins * 0.2); points = Math.round(points * 0.2);
      }
    }
    ctx.clearSave();
    render();
    var lines = [];
    if (S.daily) lines.push({ label: C.t('daily'), value: C.num(S.daily) });
    lines.push({ label: C.t('score'), value: C.num(tot) });
    lines.push({ label: C.t('fdBonusL'), value: E.bonus(S.sheet) ? '+' + C.num(E.BONUS) : C.num(E.upper(S.sheet)) + '/' + C.num(E.BONUS_AT) });
    lines.push({ label: C.t('fdPrevBest'), value: prev ? C.num(prev) : '–' });
    var note = isBest ? C.t('fdNewBest') : tot < prev ? C.t('fdBelow', { d: C.num(prev - tot) }) : null;
    setTimeout(function () {
      ctx.finish({
        won: true, title: C.t('fdDoneT'), note: note, timeMs: Date.now() - startedAt, coins: coins, points: points,
        lines: lines,
        shareText: 'چوگان · پنج‌تاس' + (S.daily ? '\nروزانه ' + S.daily : '') + '\n' + tot,
        againLabel: S.daily ? null : C.t('newGame'), onAgain: S.daily ? null : newGame
      });
    }, C.ui.reduceMotion() ? 200 : 700);
  }

  /* -------------------------------------------------------------- input */

  window.addEventListener('keydown', function (e) {
    if (document.querySelector('.ch-scrim') || e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target;
    var onButton = t && t.tagName === 'BUTTON';
    if ((e.key === ' ' && !onButton) || C.keyIs(e, 'r')) { e.preventDefault(); doRoll(); return; }
    var n = '12345'.indexOf(e.key);
    if (n < 0 && /^Digit[1-5]$/.test(e.code || '')) n = +e.code.slice(5) - 1;
    if (n >= 0) { e.preventDefault(); hold(n); return; }
    if (C.keyIs(e, 'n') && !dailyDate) { e.preventDefault(); askNew(); }
  });

  /* --------------------------------------------------------------- help */

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    var keys = [kb('Space · R', C.t('fdKRoll')), kb('1–5', C.t('fdKHold'))];
    if (!dailyDate) keys.push(kb('N', C.t('fdKNew')));
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('fdRules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, keys)
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  // five dice for the tutorial; kept dice are raised and filled with the game's colour.
  // Colours are the theme's own variables, so the art fits the dark dialog too
  function tArt(vals, kept, rowsArt) {
    var s = '<svg viewBox="0 0 200 120" width="100%" font-family="sans-serif" font-weight="700">';
    vals.forEach(function (v, i) {
      var x = 12 + i * 37, y = kept && kept[i] ? 8 : 18, on = kept && kept[i];
      s += '<rect x="' + x + '" y="' + y + '" width="30" height="30" rx="6" fill="' + (on ? '#962A00' : 'var(--c-surface)') + '" stroke="' + (on ? '#962A00' : 'var(--c-line)') + '" stroke-width="1.2"/>';
      PIPS[v].forEach(function (p) { s += '<circle cx="' + (x + p[0] * 0.3) + '" cy="' + (y + p[1] * 0.3) + '" r="2.8" fill="' + (on ? '#FFFFFF' : 'var(--c-text)') + '"/>'; });
    });
    (rowsArt || []).forEach(function (r, k) {
      var y = 60 + k * 19;
      s += '<rect x="20" y="' + y + '" width="160" height="15" rx="4" fill="' + (r[2] ? 'var(--game-soft, #F1E3DE)' : 'var(--c-surface)') + '"' + (r[2] ? ' stroke="#962A00" stroke-width="1.2"' : '') + '/>';
      s += '<rect x="28" y="' + (y + 5) + '" width="' + r[0] + '" height="5" rx="2.5" fill="var(--c-text-dim)"/>';
      s += '<text x="172" y="' + (y + 11) + '" font-size="10" text-anchor="end" fill="' + (r[2] ? '#962A00' : 'var(--c-text)') + '">' + C.num(r[1]) + '</text>';
    });
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('fdTut1T'), text: C.t('fdTut1'), art: tArt([5, 5, 2, 5, 6], [true, true, false, true, false]) },
    { title: C.t('fdTut2T'), text: C.t('fdTut2'), art: tArt([5, 5, 2, 5, 5], null, [[50, 20, true], [70, 22, false], [40, 0, false]]) },
    { title: C.t('fdTut3T', {}), text: C.t('fdTut3'), art: tArt([3, 3, 3, 4, 4], null, [[60, 63, false], [44, 35, true]]) }
  ];

  /* -------------------------------------------------------------- start */

  // saved after every roll, keep and row; the daily game has its own slot
  ctx.autosave(function () {
    if (!S || ended) return { inProgress: false };
    return { dice: S.dice, held: S.held, rolls: S.rolls, round: S.round, sheet: S.sheet, seed: S.seed, daily: S.daily, elapsed: Date.now() - startedAt };
  });
  function save() { ctx.save(); }
  var saved = ctx.loadSave();
  if (saved && E.valid(saved) && (saved.daily || null) === (dailyDate || null)) {
    S = { dice: saved.dice.slice(), held: saved.held.slice(), rolls: saved.rolls, round: saved.round, seed: saved.seed, daily: saved.daily || null, sheet: {} };
    CATS.forEach(function (c) { S.sheet[c] = saved.sheet[c]; });
    startedAt = Date.now() - (saved.elapsed || 0);
    render();
  } else newGame();
  if (dailyDate && C.stats.dailyDone('fivedice', dailyDate)) {
    var rec = C.stats.dailyOf(dailyDate).fivedice;
    C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
  }
  fitSize();
  ctx.tutorialIfNew(TUT);
})();
</script>
</body>
