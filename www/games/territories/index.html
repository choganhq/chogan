<script>
/* ==== ENGINE START ==== */
function TerritoriesEngineFactory() {
  'use strict';

  var SIZES = [6, 7, 8];
  var EMPTY = 0, CROSS = 1, ANIMAL = 2;

  function rowOf(n, i) { return Math.floor(i / n); }
  function colOf(n, i) { return i % n; }
  function touching(n, a, b) {
    return a !== b && Math.abs(rowOf(n, a) - rowOf(n, b)) <= 1 && Math.abs(colOf(n, a) - colOf(n, b)) <= 1;
  }
  // two animals clash when they share a row, a column or a region, or touch, corners too
  function clash(n, reg, a, b) {
    return a !== b && (rowOf(n, a) === rowOf(n, b) || colOf(n, a) === colOf(n, b) || reg[a] === reg[b] || touching(n, a, b));
  }

  function shuffle(a, rnd) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  // One animal a row, a column each, and no two in neighbouring rows on neighbouring
  // columns: a random permutation found by backtracking. sol[r] is the column of row r.
  function solution(n, rnd) {
    var sol = [], used = [];
    function go(r) {
      if (r === n) return true;
      var cols = shuffle(Array.from({ length: n }, function (_, i) { return i; }), rnd);
      for (var k = 0; k < n; k++) {
        var c = cols[k];
        if (used[c] || (r > 0 && Math.abs(sol[r - 1] - c) < 2)) continue;
        used[c] = true; sol[r] = c;
        if (go(r + 1)) return true;
        used[c] = false;
      }
      return false;
    }
    go(0);
    return sol;
  }

  // Regions grow from the animals' cells, each at its own pace, so some stay small and
  // some sprawl: small ones give a solver its first foothold
  function grow(n, sol, rnd) {
    var N = n * n, reg = new Array(N).fill(-1), w = [], left = N - n;
    for (var r = 0; r < n; r++) { reg[r * n + sol[r]] = r; w.push(0.5 + rnd() * 0.7); }
    while (left > 0) {
      var opts = [], tot = 0;
      for (var i = 0; i < N; i++) {
        if (reg[i] >= 0) continue;
        var nb = neighbours4(n, i);
        for (var k = 0; k < nb.length; k++) {
          var g = reg[nb[k]];
          if (g >= 0) { opts.push([i, g]); tot += w[g]; }
        }
      }
      var x = rnd() * tot, pick = opts[opts.length - 1];
      for (k = 0; k < opts.length; k++) { x -= w[opts[k][1]]; if (x <= 0) { pick = opts[k]; break; } }
      reg[pick[0]] = pick[1]; left--;
    }
    return reg;
  }
  function biggest(n, reg) {
    var c = new Array(n).fill(0);
    for (var i = 0; i < reg.length; i++) c[reg[i]]++;
    return Math.max.apply(null, c);
  }
  function neighbours4(n, i) {
    var r = rowOf(n, i), c = colOf(n, i), out = [];
    if (r > 0) out.push(i - n);
    if (r < n - 1) out.push(i + n);
    if (c > 0) out.push(i - 1);
    if (c < n - 1) out.push(i + 1);
    return out;
  }
  function connected(n, reg, g) {
    var cells = [], i;
    for (i = 0; i < reg.length; i++) if (reg[i] === g) cells.push(i);
    if (!cells.length) return false;
    var seen = {}, stack = [cells[0]], k = 0;
    seen[cells[0]] = 1;
    while (stack.length) {
      var c = stack.pop(); k++;
      var nb = neighbours4(n, c);
      for (i = 0; i < nb.length; i++) if (reg[nb[i]] === g && !seen[nb[i]]) { seen[nb[i]] = 1; stack.push(nb[i]); }
    }
    return k === cells.length;
  }

  // The units every animal belongs to: n rows, n columns, n regions
  function units(n, reg) {
    var U = [], i, r;
    for (r = 0; r < n; r++) { U.push([]); }
    for (r = 0; r < n; r++) { U.push([]); }
    for (r = 0; r < n; r++) { U.push([]); }
    for (i = 0; i < n * n; i++) { U[rowOf(n, i)].push(i); U[n + colOf(n, i)].push(i); U[2 * n + reg[i]].push(i); }
    return U;
  }
  // every cell an animal on i rules out: its row, column, region and the eight around it
  // The solver builds this for all n*n cells on every call and the generator calls it
  // hundreds of times a puzzle; through clash() it made an 8x8 board take up to 1.6 s
  // (#656), so the same test is written out here with the row and column worked out once.
  function sees(n, reg, i) {
    var out = [], ri = Math.floor(i / n), ci = i % n, gi = reg[i];
    for (var j = 0, r = 0, c = 0; j < n * n; j++) {
      if (j !== i && (r === ri || c === ci || reg[j] === gi || (r - ri <= 1 && ri - r <= 1 && c - ci <= 1 && ci - c <= 1))) out.push(j);
      if (++c === n) { c = 0; r++; }
    }
    return out;
  }

  // A solver that only deduces, never guesses. Each step is one a person can follow:
  //  - a unit with one free cell left takes the animal, and the animal crosses what it sees;
  //  - k regions that fit inside k rows (or columns) use those lines up, and the other
  //    way round: k lines that fit inside k regions use those regions up;
  //  - a cell that would leave some unit with no free cell can hold no animal.
  // Every step is sound, so if it fills the board, the board has exactly one answer.
  // Returns { g, solved, broken, steps, levels }.
  function solve(n, reg, start) {
    var N = n * n, U = units(n, reg), SEE = [], i;
    for (i = 0; i < N; i++) SEE.push(sees(n, reg, i));
    var g = start ? start.slice() : new Array(N).fill(EMPTY), steps = 0, levels = [0, 0, 0], broken = false;
    function place(i) {
      g[i] = ANIMAL; steps++;
      var s = SEE[i];
      for (var k = 0; k < s.length; k++) { if (g[s[k]] === ANIMAL) broken = true; else g[s[k]] = CROSS; }
    }
    function free(u) { var out = []; for (var k = 0; k < u.length; k++) if (g[u[k]] === EMPTY) out.push(u[k]); return out; }
    function done(u) { for (var k = 0; k < u.length; k++) if (g[u[k]] === ANIMAL) return true; return false; }
    function singles() {
      for (var u = 0; u < U.length; u++) {
        if (done(U[u])) continue;
        var f = free(U[u]);
        if (!f.length) { broken = true; return false; }
        if (f.length === 1) { place(f[0]); return true; }
      }
      return false;
    }
    // A = the kind of unit that is confined, B = the kind it is confined to (0 rows,
    // 1 columns, 2 regions); bit masks of B indices
    function confined() {
      for (var A = 0; A < 3; A++) for (var B = 0; B < 3; B++) {
        if (A === B) continue;
        var open = [], masks = [];
        for (var a = 0; a < n; a++) {
          var u = U[A * n + a];
          if (done(u)) continue;
          var m = 0, f = free(u);
          for (var k = 0; k < f.length; k++) m |= 1 << bOf(B, f[k]);
          open.push(a); masks.push(m);
        }
        var m2 = open.length;
        for (var set = 1; set < (1 << m2) - 1; set++) {
          var mask = 0, cnt = 0, inA = {};
          for (k = 0; k < m2; k++) if (set & (1 << k)) { mask |= masks[k]; cnt++; inA[open[k]] = 1; }
          if (popcount(mask) !== cnt) continue;
          var changed = false;
          for (var b = 0; b < n; b++) {
            if (!(mask & (1 << b))) continue;
            var ub = U[B * n + b];
            for (k = 0; k < ub.length; k++) {
              var c = ub[k];
              if (g[c] === EMPTY && !inA[bOf(A, c)]) { g[c] = CROSS; changed = true; }
            }
          }
          if (changed) { steps++; return true; }
        }
      }
      return false;
    }
    function bOf(K, c) { return K === 0 ? rowOf(n, c) : K === 1 ? colOf(n, c) : reg[c]; }
    function lookahead() {
      for (var i = 0; i < N; i++) {
        if (g[i] !== EMPTY) continue;
        var hit = {}, s = SEE[i], k;
        for (k = 0; k < s.length; k++) hit[s[k]] = 1;
        hit[i] = 1;
        for (var u = 0; u < U.length; u++) {
          var cell = U[u];
          if (cell.indexOf(i) >= 0 || done(cell)) continue;
          var left = false;
          for (k = 0; k < cell.length; k++) if (g[cell[k]] === EMPTY && !hit[cell[k]]) { left = true; break; }
          if (!left) { g[i] = CROSS; steps++; return true; }
        }
      }
      return false;
    }
    for (;;) {
      if (broken) break;
      if (singles()) { levels[0]++; continue; }
      if (broken) break;
      if (confined()) { levels[1]++; continue; }
      if (lookahead()) { levels[2]++; continue; }
      break;
    }
    var animals = 0;
    for (i = 0; i < N; i++) if (g[i] === ANIMAL) animals++;
    return { g: g, solved: !broken && animals === n, broken: broken, steps: steps, levels: levels };
  }
  function popcount(m) { var k = 0; while (m) { m &= m - 1; k++; } return k; }

  // Brute force, row by row, stopping at `limit` answers: the tests' second opinion
  function count(n, reg, limit) {
    var usedC = 0, usedR = 0, found = 0;
    limit = limit || 2;
    function go(r, prev) {
      if (r === n) { found++; return; }
      for (var c = 0; c < n && found < limit; c++) {
        var g = reg[r * n + c];
        if (usedC & (1 << c) || usedR & (1 << g) || Math.abs(c - prev) < 2) continue;
        usedC |= 1 << c; usedR |= 1 << g;
        go(r + 1, c);
        usedC &= ~(1 << c); usedR &= ~(1 << g);
      }
    }
    go(0, -9);
    return found;
  }

  // A puzzle: an answer, regions grown around it, and then, while the solver gets
  // stuck, a stuck cell handed to a neighbouring region (keeping both whole and every
  // animal in its own) until the solver finishes. Starts over after too many tries.
  function generate(n, rnd) {
    for (var attempt = 0; attempt < 60; attempt++) {
      var sol = solution(n, rnd), reg = grow(n, sol, rnd), home = {};
      for (var r = 0; r < n; r++) home[r * n + sol[r]] = 1;
      var res = solve(n, reg);
      for (var t = 0; t < 40 && !res.solved; t++) {
        var open = [];
        for (var i = 0; i < n * n; i++) if (res.g[i] === EMPTY && !home[i]) open.push(i);
        if (!open.length) break;
        var moved = false;
        shuffle(open, rnd);
        for (var k = 0; k < open.length && !moved; k++) {
          var c = open[k], nb = shuffle(neighbours4(n, c), rnd);
          for (var j = 0; j < nb.length; j++) {
            var to = reg[nb[j]], from = reg[c];
            if (to === from) continue;
            reg[c] = to;
            if (connected(n, reg, from)) { moved = true; break; }
            reg[c] = from;
          }
        }
        if (!moved) break;
        res = solve(n, reg);
      }
      // the first draft let one region sprawl over 15 of 36 cells on a typical board,
      // which read as a blank field with a few specks; keep every region within 2.5n cells
      if (res.solved && biggest(n, reg) <= Math.floor(2.5 * n)) return { n: n, reg: reg, sol: sol, levels: res.levels };
    }
    return null;
  }

  // what the board shows about the player's marks
  function animals(g) { var out = []; for (var i = 0; i < g.length; i++) if (g[i] === ANIMAL) out.push(i); return out; }
  function conflicts(n, reg, g) {
    var a = animals(g), bad = new Array(g.length).fill(false);
    for (var x = 0; x < a.length; x++) for (var y = x + 1; y < a.length; y++)
      if (clash(n, reg, a[x], a[y])) { bad[a[x]] = true; bad[a[y]] = true; }
    return bad;
  }
  // cells some animal rules out: what auto-cross shows, without storing a mark
  function seen(n, reg, g) {
    var a = animals(g), out = new Array(g.length).fill(false);
    for (var i = 0; i < g.length; i++) {
      if (g[i] === ANIMAL) continue;
      for (var k = 0; k < a.length; k++) if (clash(n, reg, a[k], i)) { out[i] = true; break; }
    }
    return out;
  }
  function won(n, reg, g) {
    return animals(g).length === n && conflicts(n, reg, g).indexOf(true) < 0;
  }
  // a tap: empty → cross → animal → empty
  function cycle(v) { return v === EMPTY ? CROSS : v === CROSS ? ANIMAL : EMPTY; }

  // three stars with no rule broken, two after one, one after more: never a loss
  function stars(mistakes) { return mistakes <= 0 ? 3 : mistakes === 1 ? 2 : 1; }

  function valid(o) {
    if (!o || SIZES.indexOf(o.n) < 0 || !Array.isArray(o.reg) || !Array.isArray(o.g)) return false;
    var N = o.n * o.n, seenR = {};
    if (o.reg.length !== N || o.g.length !== N) return false;
    for (var i = 0; i < N; i++) {
      if (!(o.reg[i] >= 0 && o.reg[i] < o.n) || [0, 1, 2].indexOf(o.g[i]) < 0) return false;
      seenR[o.reg[i]] = 1;
    }
    for (var r = 0; r < o.n; r++) if (!seenR[r] || !connected(o.n, o.reg, r)) return false;
    return typeof o.mistakes === 'number' && o.mistakes >= 0;
  }

  return {
    SIZES: SIZES, EMPTY: EMPTY, CROSS: CROSS, ANIMAL: ANIMAL,
    clash: clash, touching: touching, solution: solution, grow: grow, connected: connected, solve: solve, count: count,
    generate: generate, conflicts: conflicts, seen: seen, won: won, cycle: cycle, stars: stars, valid: valid
  };
}
if (typeof module !== 'undefined') module.exports = TerritoriesEngineFactory;
/* ==== ENGINE END ==== */
</script>

  var ctx = C.game({

    name: { fa: 'قلمرو', en: 'Territories', zh: '领地', de: 'Reviere', es: 'Territorios', pl: 'Terytoria', fr: 'Territoires', ar: 'الأقاليم', hi: 'इलाक़े' },

  function newPuzzle(n) {
    var rnd = dailyDate ? C.daily('territories', dailyDate).rng : Math.random;
    var P = E.generate(n, rnd);
    S = { n: n, reg: P.reg, g: new Array(n * n).fill(E.EMPTY), mistakes: 0, daily: dailyDate || null, stack: [] };
    startedAt = Date.now(); ended = false; focusAt = 0;
    build();
    save();
  }
  function hasMarks() { return !!S && S.g.some(function (v) { return v !== E.EMPTY; }); }
  function askNew() {
    if (hasMarks() && !ended) C.ui.confirm({ title: C.t('trNew'), body: C.t('resetWarn'), onOk: function () { newPuzzle(prefs.n); } });
    else newPuzzle(prefs.n);
  }
  function setSize(n) {
    if (n === S.n) return;
    var go = function () { prefs.n = n; ctx.store.set('prefs', prefs); newPuzzle(n); };
    if (hasMarks() && !ended) C.ui.confirm({ title: C.t('trNew'), body: C.t('resetWarn'), onOk: go, onCancel: render });
    else go();
  }

  // A tap moves the cell on one step: empty, cross, animal, empty. An animal that
  // breaks a rule costs a star at the moment it is placed; taking it away or undoing
  // it does not give the star back, or a player could test cells for free.
  function tap(i) {
    if (!S || ended) return;
    var prev = S.g[i], next = E.cycle(prev);
    S.stack.push([i, prev]);
    S.g[i] = next;
    focusAt = i;
    if (next === E.ANIMAL && E.conflicts(S.n, S.reg, S.g)[i]) {
      S.mistakes++;
      shakeAt = i;
      C.feedback('bad');
    } else C.feedback(next === E.ANIMAL ? 'select' : 'tap');
    render(); save();
    if (E.won(S.n, S.reg, S.g)) win();
  }
  function clearAll() {
    if (!S || ended || !hasMarks()) return;
    S.stack.push([-1, S.g.slice()]);
    S.g = new Array(S.n * S.n).fill(E.EMPTY);
    C.feedback('tap');
    render(); save();
  }
  function undo() {
    if (!S || ended || !S.stack.length) { C.feedback('bad'); return; }
    var u = S.stack.pop();
    if (u[0] < 0) S.g = u[1].slice();
    else { S.g[u[0]] = u[1]; focusAt = u[0]; }
    C.feedback('tap');
    render(); save();
  }

  function win() {
    ended = true;
    var st = E.stars(S.mistakes), clean = S.mistakes === 0;
    var base = { 6: [4, 15], 7: [6, 25], 8: [9, 40] }[S.n], k = st === 3 ? 1 : st === 2 ? 0.7 : 0.4;

    if (clean && S.n >= 7) C.achievements.unlock('tr-clean');
    if (S.n === 8) C.achievements.unlock('tr-big');
    if (S.daily) {

      if (clean) C.achievements.unlock('tr-daily');
    }
    ctx.clearSave();
    C.feedback('good');
    render();
    var elapsed = Date.now() - startedAt;
    setTimeout(function () {

    '<circle cx="-7" cy="-8" r="5.5" fill="#7CC46A"' + O + '/><circle cx="7" cy="-8" r="5.5" fill="#7CC46A"' + O + '/><ellipse cy="3" rx="13.5" ry="10" fill="#7CC46A"' + O + '/><circle cx="-7" cy="-8" r="2.6" fill="#fff"/><circle cx="7" cy="-8" r="2.6" fill="#fff"/><circle cx="-7" cy="-8" r="1.4" fill="' + INK + '"/><circle cx="7" cy="-8" r="1.4" fill="' + INK + '"/><path d="M-7 4q7 6 14 0" fill="none" stroke="' + INK + '" stroke-width="1.6" stroke-linecap="round"/>',
    // mouse
    '<circle cx="-10" cy="-8" r="7" fill="#B9BAC8"' + O + '/><circle cx="10" cy="-8" r="7" fill="#B9BAC8"' + O + '/><circle cx="-10" cy="-8" r="3.6" fill="#F2B8C6"/><circle cx="10" cy="-8" r="3.6" fill="#F2B8C6"/><circle r="10.5" cy="3" fill="#B9BAC8"' + O + '/>' + eyes(1) + '<circle cy="5" r="1.6" fill="#E88AA2"/>' + smile(7),
    // pig
    '<path d="M-11-4-9-14-3-9zM11-4 9-14 3-9z" fill="#F4A7B9"' + O + '/><circle r="12" cy="1" fill="#F4A7B9"' + O + '/>' + eyes(-3) + '<ellipse cy="4" rx="5" ry="3.6" fill="#F7C3CF"' + O + '/><circle cx="-1.7" cy="4" r="1" fill="' + INK + '"/><circle cx="1.7" cy="4" r="1" fill="' + INK + '"/>',
    // chick
    '<path d="M-2-12q2-6 4 0" fill="none" stroke="' + INK + '" stroke-width="1.6"/><circle r="12" cy="1" fill="#FFD45C"' + O + '/>' + eyes(-1) + '<path d="M-3 3h6l-3 4z" fill="#F08A24"' + O + '/>',
    // panda
    '<circle cx="-9.5" cy="-9.5" r="4.8" fill="' + INK + '"/><circle cx="9.5" cy="-9.5" r="4.8" fill="' + INK + '"/><circle r="12" cy="1" fill="#FAFAF7"' + O + '/><ellipse cx="-5" cy="0" rx="3.4" ry="4" fill="' + INK + '" transform="rotate(25 -5 0)"/><ellipse cx="5" cy="0" rx="3.4" ry="4" fill="' + INK + '" transform="rotate(-25 5 0)"/><circle cx="-4.6" cy="-0.5" r="1.2" fill="#fff"/><circle cx="4.6" cy="-0.5" r="1.2" fill="#fff"/><ellipse cy="5" rx="1.8" ry="1.2" fill="' + INK + '"/>' + smile(7)
  ];
  function animal(kind) { return '<svg class="tr-animal" viewBox="-20 -20 40 40" aria-hidden="true">' + FACES[kind % FACES.length] + '</svg>'; }
  var CROSS = '<svg class="tr-x" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3 17 17M17 3 3 17" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>';

  // a thick line wherever two regions meet, drawn inside each cell so the grid needs
  // no extra layer
  function edges(n, reg, i) {
    var r = Math.floor(i / n), c = i % n, w = '2px', out = [];
    if (r > 0 && reg[i - n] !== reg[i]) out.push('inset 0 ' + w + ' 0 var(--tr-line)');
    if (r < n - 1 && reg[i + n] !== reg[i]) out.push('inset 0 -' + w + ' 0 var(--tr-line)');
    if (c > 0 && reg[i - 1] !== reg[i]) out.push('inset ' + w + ' 0 0 var(--tr-line)');
    if (c < n - 1 && reg[i + 1] !== reg[i]) out.push('inset -' + w + ' 0 0 var(--tr-line)');
    return out.join(', ') || 'none';
  }

  function build() {
    board.innerHTML = '';
    cells = [];
    board.style.setProperty('--n', S.n);
    for (var i = 0; i < S.n * S.n; i++) {
      (function (k) {
        var b = el('button', { class: 'tr-cell', type: 'button', tabindex: '-1' });
        b.style.background = 'var(--tr-r' + S.reg[k] + ')';
        b.style.boxShadow = edges(S.n, S.reg, k);
        b.addEventListener('click', function () { tap(k); });
        cells.push(b); board.appendChild(b);
      })(i);
    }
    render();
  }
  function render() {
    var bad = E.conflicts(S.n, S.reg, S.g), seen = prefs.auto ? E.seen(S.n, S.reg, S.g) : null, a = 0, order = 0;
    for (var i = 0; i < cells.length; i++) {
      var v = S.g[i], auto = v === E.EMPTY && seen && seen[i], b = cells[i];
      if (v === E.ANIMAL) a++;
      var html = v === E.ANIMAL ? animal(S.reg[i]) : (v === E.CROSS || auto) ? CROSS : '';
      if (b.getAttribute('data-v') !== html) { b.innerHTML = html; b.setAttribute('data-v', html); }
      b.classList.toggle('tr-cell--auto', !!auto);
      b.classList.toggle('tr-cell--bad', !!bad[i]);
      if (i === shakeAt && bad[i]) { b.classList.remove('tr-cell--bad'); void b.offsetWidth; b.classList.add('tr-cell--bad'); }
      if (v === E.ANIMAL && ended) b.style.setProperty('--d', (order++ * 70) + 'ms');
      b.setAttribute('aria-label', C.t('cellN', { r: C.num(Math.floor(i / S.n) + 1), c: C.num(i % S.n + 1) }) + ' · ' + C.t('regionN', { k: C.num(S.reg[i] + 1) }) + ' · ' +
        C.t(v === E.ANIMAL ? 'stAnimal' : (v === E.CROSS || auto) ? 'stCross' : 'stEmpty'));
      b.setAttribute('tabindex', i === focusAt ? '0' : '-1');
    }
    shakeAt = -1;
    board.classList.toggle('tr-board--done', ended);
    top.innerHTML = '';
    if (S.daily) top.appendChild(el('span', { class: 'ch-badge ch-badge--accent' }, [C.icon('calendar', 14), el('span', { text: C.t('dailyTr') + ' — ' + C.num(S.daily) })]));
    else top.appendChild(C.ui.segmented(E.SIZES.map(function (n) { return { value: n, label: C.t('sizeN', { n: C.num(n) }) }; }), S.n, setSize));
    // options behind a gear in the top row, never in «?» (#409)
    var gear = el('button', { class: 'ch-iconbtn', type: 'button', 'aria-label': C.t('settings'), title: C.t('settings') }, [C.icon('gear', 20)]);
    gear.addEventListener('click', showSettings);
    top.appendChild(gear);
    var st = E.stars(S.mistakes);
    stars.innerHTML = '';
    for (var s = 0; s < 3; s++) stars.appendChild(el('span', { class: s < st ? '' : 'tr-lost', text: '★' }));
    stars.setAttribute('aria-label', C.t('starsN', { s: C.num(st) }));
    status.textContent = C.t('placed', { a: C.num(a), n: C.num(S.n) }) + ' · ' + C.t('mistakesN', { m: C.num(S.mistakes) });
    clearBtn.disabled = ended || !hasMarks();
  }

  /* -------------------------------------------------------------- input */

  board.addEventListener('keydown', function (e) {
    var d = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
    if (!d || !S) return;
    e.preventDefault();
    var r = Math.floor(focusAt / S.n), c = focusAt % S.n;
    r = Math.max(0, Math.min(S.n - 1, r + d[1])); c = Math.max(0, Math.min(S.n - 1, c + d[0]));
    focusAt = r * S.n + c;
    render();
    cells[focusAt].focus();
  });
  window.addEventListener('keydown', function (e) {
    if (document.querySelector('.ch-scrim')) return;
    if (C.undoKey(e)) { undo(); e.preventDefault(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (C.keyIs(e, 'n') && !dailyDate) { askNew(); e.preventDefault(); return; }
    // the first arrow from anywhere on the page lands on the board
    if (/^Arrow/.test(e.key) && cells.length && !board.contains(document.activeElement)) { cells[focusAt].focus(); e.preventDefault(); }
  });

  /* ------------------------------------------------------------ dialogs */

  function showSettings() {
    C.ui.modal({
      title: C.t('settings'),
      body: [el('div', { class: 'ch-list' }, [
        el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: C.t('autoCross') }),
          C.ui.switch(prefs.auto, function (v) { prefs.auto = v; ctx.store.set('prefs', prefs); if (S) render(); })])
      ]), el('p', { class: 'ch-dim', text: C.t('autoNote') })],
      actions: [{ label: C.t('done'), kind: 'primary' }]
    });
  }
  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    var keys = [kb('← ↑ → ↓', C.t('kMove')), kb('Space / Enter', C.t('kCycle')), kb('U / Ctrl+Z', C.t('undo'))];
    if (!dailyDate) keys.push(kb('N', C.t('kNew')));
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, keys)
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  // 4×4 boards for the tutorial: four regions, the animals on them, crosses, and a
  // ring on animals that break a rule
  var T_REG = [0, 0, 1, 1, 0, 2, 1, 1, 3, 2, 2, 1, 3, 3, 2, 2];
  var T_FILL = ['#F9D9A8', '#CFE6B8', '#BFDDF2', '#F5C6D6'];
  function tArt(animals, crosses, bad) {
    var s = '<svg viewBox="0 0 200 110" width="100%"><rect x="54" y="3" width="92" height="92" rx="6" fill="#3A2E28"/>';
    for (var i = 0; i < 16; i++) {
      var x = 57 + (i % 4) * 21.5, y = 6 + Math.floor(i / 4) * 21.5;
      s += '<rect x="' + x + '" y="' + y + '" width="21" height="21" fill="' + T_FILL[T_REG[i]] + '"/>';
    }
    for (i = 0; i < 16; i++) {
      var cx = 67.5 + (i % 4) * 21.5, cy = 16.5 + Math.floor(i / 4) * 21.5;
      if (animals.indexOf(i) >= 0) s += '<g transform="translate(' + cx + ' ' + cy + ') scale(.42)">' + FACES[T_REG[i] * 2 % 8] + '</g>';
      if (crosses.indexOf(i) >= 0) s += '<path d="M' + (cx - 4) + ' ' + (cy - 4) + 'l8 8m0-8-8 8" stroke="#3A2E28" stroke-width="2" stroke-linecap="round"/>';
      if (bad.indexOf(i) >= 0) s += '<circle cx="' + cx + '" cy="' + cy + '" r="9" fill="none" stroke="#D62828" stroke-width="2"/>';
    }
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: tArt([1, 7, 8, 14], [], []) },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: tArt([5, 10], [], [5, 10]) },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: tArt([1], [0, 2, 3, 4, 5, 6, 9, 13], []) }
  ];

  /* -------------------------------------------------------------- start */

  // the board is saved after every tap; the daily one has its own slot
  ctx.autosave(function () {
    if (!S || ended) return { inProgress: false };
    return { n: S.n, reg: S.reg, g: S.g, mistakes: S.mistakes, daily: S.daily, stack: S.stack.slice(-200), elapsed: Date.now() - startedAt };
  });
  function save() { ctx.save(); }
  var saved = ctx.loadSave();
  if (saved && E.valid(saved) && (saved.daily || null) === (dailyDate || null) && !E.won(saved.n, saved.reg, saved.g)) {
    var N = saved.n * saved.n;
    var stack = Array.isArray(saved.stack) ? saved.stack.filter(function (u) {
      return Array.isArray(u) && (u[0] === -1 ? Array.isArray(u[1]) && u[1].length === N : u[0] >= 0 && u[0] < N && [0, 1, 2].indexOf(u[1]) >= 0);
    }) : [];
    S = { n: saved.n, reg: saved.reg.slice(), g: saved.g.slice(), mistakes: saved.mistakes, daily: saved.daily || null, stack: stack };
    startedAt = Date.now() - (saved.elapsed || 0); focusAt = 0;
    build();
  } else newPuzzle(dailyDate ? DAILY_N : prefs.n);
  if (dailyDate && C.stats.dailyDone('territories', dailyDate)) {
    var rec = C.stats.dailyOf(dailyDate).territories;
    C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
  }
  ctx.tutorialIfNew(TUT);
})();
</script>
