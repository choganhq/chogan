<style>
  .wf-wrap > .ch-fit { --fit-ar: 0.9; }
  .ch-fit > .wf-box { width: 100%; height: 100%; position: relative; }
  /* a canvas is a replaced element: without its own width and height it keeps the
     backing-store size times the pixel ratio (#919) */
  .wf-box canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; border-radius: var(--r-md);
    touch-action: none; direction: ltr; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .wf-top { display: flex; justify-content: center; align-items: center; gap: var(--s-2) var(--s-3); flex-wrap: wrap;
    font-weight: 700; color: var(--c-text-dim); font-variant-numeric: tabular-nums; min-height: 40px; }
  .wf-top > span { white-space: nowrap; }
  /* The keyboard is drawn by the game for the alphabet in play, so a phone never has
     to open its own keyboard over the sky. Rows keep the physical order of a real
     keyboard in every language, hence ltr even under a Persian page. */
  .wf-kb { direction: ltr; display: flex; flex-direction: column; gap: 5px; user-select: none; -webkit-user-select: none;
    touch-action: manipulation; --gap: 4px; }
  .wf-row { display: flex; justify-content: center; gap: var(--gap); }
  .wf-key { flex: 0 1 calc((100% - (var(--cols) - 1) * var(--gap)) / var(--cols)); min-width: 0; padding: 0;
    height: 44px; height: clamp(40px, 8cqh, 56px); border: 0; border-radius: 8px; font: inherit; font-size: 1.15rem; font-weight: 700;
    background: var(--c-surface-2, var(--c-surface)); color: var(--c-text); box-shadow: 0 2px 0 var(--c-border);
    cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background-color .12s, transform .06s; }
  .wf-key--wide { flex-basis: calc(1.5 * (100% - (var(--cols) - 1) * var(--gap)) / var(--cols)); }
  .wf-key svg { pointer-events: none; }
  .wf-key.wf-next { background: var(--game, var(--c-accent)); color: var(--game-ink, #fff); }
  .wf-key.wf-hit { transform: translateY(2px); box-shadow: none; }
  .wf-key.wf-bad { background: var(--c-danger, #C0392B); color: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .wf-key.wf-next { color: var(--game-ink-dark, #111); } }
  :root[data-theme="dark"] .wf-key.wf-next { color: var(--game-ink-dark, #111); }
  @container game (min-aspect-ratio: 5 / 4) {
    /* beside the sky the keyboard needs room for twelve keys a row */
    .wf-wrap.ch-split { --side-w: clamp(300px, 44cqw, 560px); }
    .wf-wrap > .ch-fit { --fit-ar: 1; }
  }
  .wf-words { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--s-3); max-height: 40vh; overflow-y: auto; }
  .wf-chip { display: inline-flex; align-items: center; gap: 2px; padding: 2px 4px 2px 10px; border-radius: 999px;
    background: var(--c-surface-2, var(--c-surface)); border: 1px solid var(--c-border); font-weight: 600; }
  [dir="rtl"] .wf-chip { padding: 2px 10px 2px 4px; }
  .wf-chip button { border: 0; background: none; color: var(--c-text-dim); width: 32px; height: 32px; border-radius: 50%;
    cursor: pointer; font: inherit; font-size: 1.1rem; line-height: 1; }
  .wf-addrow { display: flex; gap: var(--s-2); margin-top: var(--s-3); }
  .wf-addrow .ch-field { flex: 1; min-width: 0; }
  .wf-err { min-height: 1.4em; color: var(--c-danger, #C0392B); font-size: .9rem; margin-top: 4px; }
</style>

/* ==== ENGINE START ==== */
function WordfallEngineFactory() {
  'use strict';

  var WAVES = 8, LIVES = 5, MAX_CUSTOM = 50, MIN_CUSTOM = 5, LEVELS = ['easy', 'medium', 'hard'];
  // Seconds a word of five letters takes to fall in the first wave, and the gap between
  // two new words. Tuned by the bot runs in tools/tests/wordfall.js: a steady typist of
  // about 1.6, 2 and 2.8 letters a second clears easy, medium and hard.
  var FALL = { easy: 15, medium: 11, hard: 8 }, GAP = { easy: 5.2, medium: 3.7, hard: 2.6 };
  var BREAK = 2.2;
  // shortest and longest word of each wave, so a run grows from cat to elephant
  var LO = [3, 3, 3, 4, 4, 4, 5, 5], HI = [4, 5, 5, 6, 6, 7, 8, 9];

  // The keyboard of each alphabet, row by row, in the order of the usual physical layout
  var KB = {
    fa: ['ضصثقفغعهخحجچ', 'شسیبلاتنمکگ', 'ظطزرذدپوژ'],
    ar: ['ضصثقفغعهخحجد', 'شسيبلاتنمكط', 'ئءؤرىةوزظذ'],
    ru: ['йцукенгшщзхъ', 'фывапролджэ', 'ячсмитьбю'],
    en: ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'],
    pl: ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'],
    fr: ['azertyuiop', 'qsdfghjklm', 'wxcvbn'],
    de: ['qwertzuiopü', 'asdfghjklöä', 'yxcvbnmß'],
    es: ['qwertyuiop', 'asdfghjklñ', 'zxcvbnm'],
    pt: ['qwertyuiop', 'asdfghjklç', 'zxcvbnm']
  };
  // Where those keys sit on a keyboard without the layout installed (e.code), for the
  // scripts a Latin keyboard cannot type
  var CODES = [
    ['KeyQ', 'KeyW', 'KeyE', 'KeyR', 'KeyT', 'KeyY', 'KeyU', 'KeyI', 'KeyO', 'KeyP', 'BracketLeft', 'BracketRight'],
    ['KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyG', 'KeyH', 'KeyJ', 'KeyK', 'KeyL', 'Semicolon', 'Quote'],
    ['KeyZ', 'KeyX', 'KeyC', 'KeyV', 'KeyB', 'KeyN', 'KeyM', 'Comma', 'Period']
  ];

  // Letters typed or written in more than one way count as the key they share: Arabic
  // yeh and kaf on a Persian keyboard, accents a phone keyboard hides behind a long press
  // Quoted keys: a bare `en: {` here would be read as the page's string table by tools/test.js
  var FOLD = {
    'fa': { 'ي': 'ی', 'ى': 'ی', 'ئ': 'ی', 'ك': 'ک', 'آ': 'ا', 'أ': 'ا', 'إ': 'ا', 'ۀ': 'ه', 'ة': 'ه' },
    'ar': { 'أ': 'ا', 'إ': 'ا', 'آ': 'ا', 'ٱ': 'ا' },
    'ru': { 'ё': 'е' },
    'pl': { 'ą': 'a', 'ć': 'c', 'ę': 'e', 'ł': 'l', 'ń': 'n', 'ó': 'o', 'ś': 's', 'ź': 'z', 'ż': 'z' },
    'fr': { 'é': 'e', 'è': 'e', 'ê': 'e', 'ë': 'e', 'à': 'a', 'â': 'a', 'ç': 'c', 'î': 'i', 'ï': 'i', 'ô': 'o', 'ù': 'u', 'û': 'u', 'ü': 'u' },
    'es': { 'á': 'a', 'é': 'e', 'í': 'i', 'ó': 'o', 'ú': 'u', 'ü': 'u' },
    'pt': { 'á': 'a', 'à': 'a', 'â': 'a', 'ã': 'a', 'é': 'e', 'ê': 'e', 'í': 'i', 'ó': 'o', 'ô': 'o', 'õ': 'o', 'ú': 'u', 'ü': 'u' },
    'en': {}, 'de': {}
  };
  // Common, easy words written for this game, three to nine letters
  var WORDS = {
    en: 'cat dog sun sea sky car bus egg hat cup pen box map key owl fox ant bee jam toy ' +
      'tree bird fish frog lion bear duck goat milk cake rice soup corn rain snow wind star moon lamp door road ship boat book ball song kite leaf rose seed nest home park farm hill lake sand bell ' +
      'river apple grape lemon melon bread honey water cloud storm green black white brown happy smile dance music piano tiger zebra horse sheep mouse train plant beach chair table ' +
      'rabbit monkey turtle garden window pencil orange yellow purple winter summer spring autumn forest island bridge castle planet rocket dragon flower basket butter cookie candle jacket pocket ladder violin guitar kitten parrot ' +
      'blanket balloon rainbow thunder chicken dolphin penguin giraffe kitchen picture morning evening journey teacher pumpkin library ' +
      'sunshine elephant mountain umbrella treasure dinosaur notebook pancakes sandwich squirrel ' +
      'butterfly chocolate adventure wonderful pineapple snowflake telescope',
    fa: 'سیب باغ ماه کوه شیر نان چای قند توت هلو کیف میز قلم شعر ساز گرم سرد شاد روز سال برف باد ابر رود دشت ' +
      'کتاب دریا خانه مادر پدر دوست شهر جنگل باران زمین درخت ماهی گربه روباه زنبور پنیر انار انگور گیلاس بادام گردو پسته کفش کلاه دامن مداد دفتر پنجره دیوار حیاط کوچه بازی توپ قایق ماشین قطار رنگ سبز سرخ زرد سفید سیاه بنفش صبح ظهر هفته بهار پاییز شادی لبخند آرام زیبا بزرگ کوچک تازه شیرین قصه آواز عکس چراغ آینه فرش گلدان خیار پیاز گنجشک کبوتر آبشار نیمکت ' +
      'برادر خواهر ستاره خورشید آسمان پرنده خرگوش پروانه پیراهن شلوار صندلی خیابان مدرسه معلم شاگرد زمستان مهربان نقاشی باغچه هندوانه پرتقال نارنگی زردآلو داستان بیابان بادکنک سنجاقک دبستان شیرینی آفتابی ' +
      'بادبادک دوچرخه هواپیما تابستان خانواده آموزگار روزنامه کوهستان جشنواره خوشحالی ماهیگیر کارخانه دانشگاه شهربازی ' +
      'کتابخانه آشپزخانه ماهیگیری نوازندگی بهارستان',
    de: 'Hut Eis Tee Kuh Bus Zug Uhr Rad Bär See Tag ' +
      'Haus Baum Hund Maus Ball Buch Brot Mond Wind Wald Berg Meer Boot Auto Bett Rock Ente Hase Igel Eule Saft Lied Turm Blatt Licht rot blau gelb ' +
      'Katze Milch Apfel Birne Sonne Stern Regen Wolke Blume Fluss Insel Tisch Stuhl Lampe Schuh Jacke Farbe Vogel Fisch Pferd Schaf Löwe Tiger Fuchs Biene Käse Suppe Honig Woche Musik Spiel Puppe Feuer Schnee Wiese Kerze Gabel Abend Nacht grün weiß Gurke ' +
      'Garten Schiff Straße Schule Freund Mutter Vater Fenster Zucker Wasser Kaffee Morgen Sommer Winter Herbst Drache Schloss Brücke Zimmer Küche Teller Löffel Messer Banane Tomate Kirsche Traube Zitrone ' +
      'Fahrrad Spiegel Geschenk Elefant Giraffe Pinguin Frühling Erdbeere Kartoffel Abenteuer Sonnenhut',
    es: 'sol mar pan pez oso uva día ' +
      'casa gato luna flor agua mesa cama tren lago nube pato mono rojo azul rosa niño niña sopa río isla pera ' +
      'perro cielo árbol leche queso fruta libro silla barco avión calle playa nieve vaca oveja ratón tigre león zorro abeja falda color verde feliz amigo madre padre juego tarde noche torre fuego dulce arroz huevo pollo otoño ' +
      'manzana limón naranja fresa melón puerta ventana ciudad pueblo bosque lluvia viento jardín pájaro caballo conejo tortuga camisa zapato blanco negro familia escuela maestro música canción baile pelota cometa regalo fiesta mañana semana verano guitarra piano dragón puente lámpara espejo cuchara tenedor cocina galleta helado tomate patata jirafa delfín ballena tesoro sonrisa estrella montaña hermano ' +
      'mariposa sombrero amarillo invierno castillo elefante pingüino aventura primavera chocolate zanahoria bicicleta',
    pl: 'dom kot lis ser sok noc las ' +
      'pies ryba ptak koń mysz wilk sowa jeż żaba góra okno stół zupa woda brat lato zima smok skarb słoń most rano ' +
      'krowa owca kaczka zając motyl słońce niebo chmura deszcz śnieg wiatr morze rzeka drzewo kwiat liść trawa ogród park miasto droga zamek wieża statek łódź pociąg auto rower szkoła drzwi łóżko lampa zegar kubek chleb mleko masło jabłko banan ciasto miód matka ojciec babcia muzyka taniec zabawa piłka lalka prezent wiosna jesień biały czarny radość żółty żyrafa delfin ' +
      'księżyc gwiazda jezioro książka zeszyt ołówek krzesło talerz łyżka gruszka śliwka wiśnia cytryna pomidor ogórek marchew herbata siostra dziadek dziecko kolega piosenka latawiec święto wieczór tydzień zielony uśmiech pingwin ' +
      'pszczoła czerwony przygoda wieloryb truskawka niebieski czekolada',
    fr: 'chat lune mer ciel pain lait lit rue lac vent ours riz feu jeu ami été île ' +
      'chien arbre fleur pomme poire table porte train ville plage neige lapin tigre lion singe robe rouge bleu vert jaune blanc noir rose mère père frère danse fête matin soir nuit hiver piano pont tour lampe glace soupe ' +
      'maison soleil raisin citron orange fraise melon livre chaise bateau avion rivière forêt nuage pluie étoile jardin oiseau cheval vache mouton canard souris renard abeille tortue chemise chapeau couleur heureux enfant famille école musique chanson ballon cadeau semaine automne guitare dragon château miroir cuisine gâteau bonbon poulet tomate carotte girafe dauphin baleine trésor sourire ' +
      'fromage fenêtre voiture village montagne poisson papillon chaussure chocolat cuillère éléphant pingouin aventure printemps',
    pt: 'sol mar pão céu rio lua chá mel uva boi rei sal mão rua dia ovo gol cão ' +
      'casa gato flor água mesa cama trem lago pato vaca leão rosa azul bola bolo sapo urso fogo ilha neve sopa doce suco café mapa sino roda pera jogo ninho ' +
      'verde feliz amigo carro barco avião chuva campo festa noite tarde manhã piano tigre zebra cobra fruta folha areia porta canto leite peixe vento praia arroz nuvem livro ponte limão ' +
      'abelha queijo cavalo coelho janela cidade escola música verão jardim cereja tomate caneta camisa sapato panela ovelha macaco girafa baleia violão jacaré ' +
      'inverno laranja castelo foguete estrela cadeira abacaxi morango cenoura amarelo família cozinha tesouro caderno esquilo pinguim sorvete ' +
      'floresta montanha elefante aventura presente vermelho papagaio cachorro golfinho ' +
      'borboleta chocolate primavera bicicleta tartaruga sanduíche relâmpago',
    ru: 'дом кот пёс сад лес сыр мёд чай суп сок мяч кит ' +
      'рыба конь утка мышь лиса волк заяц сова луна небо снег море река гора лист парк мост поезд стол стул окно часы хлеб груша слива лимон банан мама папа брат друг игра утро ночь лето зима слон жираф клад ' +
      'собака птица корова овца пчела солнце звезда облако дождь ветер озеро дерево цветок трава город дорога замок башня лодка машина школа книга дверь лампа чашка ложка масло яблоко вишня огурец морковь пирог вода сестра музыка песня танец кукла вечер неделя весна осень синий белый радость улыбка дракон пингвин дельфин ' +
      'медведь бабочка лягушка деревня корабль тетрадь кровать тарелка молоко помидор бабушка дедушка ребёнок подарок красный зелёный жёлтый чёрный шоколад ' +
      'велосипед карандаш клубника праздник',
    ar: 'بيت قطة كلب شمس قمر بحر نهر جبل ماء خبز جبن عنب موز تمر قلم طفل سمك أسد نمر قرد باب كوب صحن مطر ثلج ريح ليل يوم شهر سنة صيف فرح عيد عسل شاي جسر برج كنز فيل ' +
      'نجمة سماء شجرة وردة زهرة حليب تفاح ليمون كتاب دفتر مدرسة معلم طالب صديق أخت عائلة طائر حصان بقرة خروف بطة فأر أرنب ثعلب نحلة فراشة نافذة سرير كرسي طاولة مصباح ساعة ملعقة سيارة قطار سفينة طائرة دراجة شارع مدينة قرية حديقة غابة بحيرة سحابة صباح مساء أسبوع ربيع خريف شتاء أحمر أزرق أخضر أصفر أبيض أسود لعبة كرة هدية أغنية رقص حلوى كعكة قهوة زرافة دلفين بطريق تنين قلعة ' +
      'برتقال سلحفاة موسيقى مغامرة ابتسامة تلفزيون استراحة مستكشف بستاني'
  };

  function alpha(lang) { return KB[lang] ? lang : 'en'; }
  var SETS = {};
  Object.keys(KB).forEach(function (a) { var s = {}; KB[a].join('').split('').forEach(function (c) { s[c] = true; }); SETS[a] = s; });
  function fold(a, ch) { var c = String(ch).toLowerCase(); return (FOLD[a] && FOLD[a][c]) || c; }
  function foldWord(a, w) { var out = ''; for (var i = 0; i < w.length; i++) out += fold(a, w[i]); return out; }
  function isLetter(a, ch) { return !!SETS[alpha(a)][ch]; }
  function list(a) { return WORDS[alpha(a)].split(' ').filter(Boolean); }
  function count(w) { return 4 + w; }

  // a small seeded generator whose state lives in the run, so a saved run carries on
  // with the same words it would have had
  function rnd(S) {
    S.r = (S.r + 0x6D2B79F5) >>> 0;
    var t = S.r;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  function newRun(o) {
    var a = alpha(o.lang), custom = o.custom && o.custom.length >= MIN_CUSTOM ? o.custom.slice() : null;
    return {
      v: 1, lang: a, level: LEVELS.indexOf(o.level) >= 0 ? o.level : 'medium', custom: custom,
      wave: 1, left: count(1), words: [], target: -1, next: 1, used: [],
      lives: LIVES, score: 0, hits: 0, misses: 0, kills: 0, status: 'run',
      pause: BREAK, spawnT: 0, r: (o.seed >>> 0) || 1, t: 0
    };
  }

  // The next word: of the wave's length, not used yet this run, and if possible not
  // starting with a letter already falling, so the first key never has to guess
  function pick(S) {
    var pool = S.custom || list(S.lang), w = S.wave - 1, cand = [];
    var fresh = pool.filter(function (x) { return S.used.indexOf(x) < 0; });
    if (!fresh.length) { S.used = []; fresh = pool.slice(); }
    if (S.custom) cand = fresh;
    else {
      for (var widen = 0; widen < 10 && cand.length < 3; widen++) {
        cand = fresh.filter(function (x) { var n = x.length; return n >= LO[w] - widen && n <= HI[w] + widen; });
      }
      if (!cand.length) cand = fresh;
    }
    var firsts = S.words.map(function (x) { return x.f[0]; });
    var clear = cand.filter(function (x) { return firsts.indexOf(fold(S.lang, x[0])) < 0; });
    if (clear.length) cand = clear;
    var word = cand[Math.floor(rnd(S) * cand.length)];
    S.used.push(word);
    return word;
  }
  function fallTime(S, n) { return FALL[S.level] * (0.7 + n * 0.06) * (1 - 0.035 * (S.wave - 1)); }
  function gapTime(S) { return GAP[S.level] * (1 - 0.03 * (S.wave - 1)); }

  function spawn(S) {
    var w = pick(S), f = foldWord(S.lang, w);
    var o = { id: S.next++, w: w, f: f, x: 0.15 + rnd(S) * 0.7, y: 0, v: 1 / fallTime(S, f.length), typed: 0 };
    S.words.push(o); S.left--; S.spawnT = gapTime(S);
    return o;
  }
  function byId(S, id) { for (var i = 0; i < S.words.length; i++) if (S.words[i].id === id) return S.words[i]; return null; }

  // Time passes: words fall, new ones appear, a wave ends when its last word is gone.
  // Returns what happened, for the page's sounds and sparks.
  function step(S, dt) {
    var ev = [];
    if (S.status !== 'run') return ev;
    S.t += dt;
    if (S.pause > 0) {
      S.pause -= dt;
      if (S.pause > 0) return ev;
      ev.push({ type: 'spawn', word: spawn(S) });
    } else if (S.left > 0) {
      S.spawnT -= dt;
      // an empty sky never makes a quick typist wait for the next word
      if (S.spawnT <= 0 || !S.words.length) ev.push({ type: 'spawn', word: spawn(S) });
    }
    for (var i = S.words.length - 1; i >= 0; i--) {
      var o = S.words[i];
      o.y += o.v * dt;
      if (o.y < 1) continue;
      S.words.splice(i, 1);
      if (S.target === o.id) S.target = -1;
      S.lives--;
      ev.push({ type: 'ground', word: o });
      if (S.lives <= 0) { S.status = 'lost'; ev.push({ type: 'lose' }); return ev; }
    }
    if (S.left <= 0 && !S.words.length) {
      if (S.wave >= WAVES) { S.status = 'won'; ev.push({ type: 'win' }); }
      else { S.wave++; S.left = count(S.wave); S.pause = BREAK; ev.push({ type: 'wave', wave: S.wave }); }
    }
    return ev;
  }

  // points for a burst word: longer words and words caught high up are worth more
  function points(o) { var n = o.f.length; return n * 10 + Math.round(n * 10 * Math.max(0, 1 - o.y)); }

  // One letter typed (already folded). The first letter of a word picks the lowest
  // word that starts with it; the rest must follow in order. A wrong letter costs
  // accuracy only, never a flower.
  function key(S, ch) {
    if (S.status !== 'run' || !S.words.length) return { type: 'none' };
    var o = S.target >= 0 ? byId(S, S.target) : null;
    if (!o) {
      S.target = -1;
      for (var i = 0; i < S.words.length; i++) {
        var c = S.words[i];
        if (c.f[0] === ch && (!o || c.y > o.y)) o = c;

          prefs.hint = v; ctx.store.set('prefs', prefs); hintKeys();
        }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('wfWords') }),
        words, edit, err,
        el('p', { class: 'ch-dim', text: C.t('wfCustomNote') })
      ],
      actions: [{ label: C.t('done'), kind: 'primary' }]
    });
  }

  function editWords() {
    var a = appAlpha(), list = myWords(a);
    var input = el('input', { class: 'ch-field', type: 'text', maxlength: '24', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', dir: 'auto', lang: a, placeholder: C.t('wfPlaceholder'), 'aria-label': C.t('wfPlaceholder') });
    var err = el('p', { class: 'wf-err', role: 'status' }), count = el('p', { class: 'ch-dim' }), chips = el('div', { class: 'wf-words' });
    var clear = el('button', { class: 'ch-btn ch-btn--ghost', type: 'button', onclick: function () {
      if (!list.length) return;
      C.ui.confirm({ title: C.t('wfClear'), body: C.t('wfClear') + '?', danger: true, okLabel: C.t('wfClear'), onOk: function () { list = []; store(); paint(); } });
    } }, C.t('wfClear'));
    function store() {
      custom[a] = list.slice(); ctx.store.set('custom', custom);
      if (list.length < E.MIN_CUSTOM && useCustom) { useCustom = false; ctx.store.set('useCustom', false); }
    }
    function paint() {
      count.textContent = C.t('wfCount', { n: C.num(list.length), m: C.num(E.MAX_CUSTOM) }) + (list.length < E.MIN_CUSTOM ? ' · ' + C.t('wfNeed', { n: C.num(E.MIN_CUSTOM) }) : '');
      chips.innerHTML = '';
      list.forEach(function (w, i) {
        var x = el('button', { type: 'button', 'aria-label': C.t('wfDel', { w: w }), text: '×' });
        x.addEventListener('click', function () { list.splice(i, 1); store(); paint(); C.feedback('tap'); });
        chips.appendChild(el('span', { class: 'wf-chip', lang: a }, [el('span', { text: w }), x]));
      });
      clear.disabled = !list.length;
    }
    function add() {
      var v = E.validateCustom(a, input.value, list);
      if (!v.ok) {
        err.textContent = { letters: C.t('wfErrLetters'), length: C.t('wfErrLen'), dup: C.t('wfErrDup'), full: C.t('wfErrFull') }[v.reason];
        C.feedback('bad'); return;
      }
      list.push(v.word); store(); input.value = ''; err.textContent = ''; paint(); C.feedback('select');
      input.focus();
    }
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); add(); } });
    var addBtn = el('button', { class: 'ch-btn ch-btn--primary', type: 'button', onclick: add }, C.t('wfAdd'));
    paint();
    C.ui.modal({
      title: C.t('wfMine'), closeButton: true,
      body: [el('p', { class: 'ch-dim', text: C.t('wfCustomNote') }), el('div', { class: 'wf-addrow' }, [input, addBtn]), err, count, chips],
      actions: [{ label: C.t('wfClear'), kind: 'danger', keepOpen: true, onClick: function () { clear.click(); } },
        { label: C.t('done'), kind: 'primary', onClick: function () {
          // a full enough list is put to use at once; that is why the player opened it
          if (list.length >= E.MIN_CUSTOM && !useCustom) apply(function () { useCustom = true; ctx.store.set('useCustom', true); });
        } }]
    });
    setTimeout(function () { input.focus(); }, 60);
  }

  // Tutorial pictures: a small sky with word pills drawn as bars, in the light
  // theme's literal colours, so they read the same in every language
  function tArt(step) {
    var s = '<svg viewBox="0 0 200 110" width="100%"><defs><linearGradient id="wfs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCD4F3"/><stop offset="1" stop-color="#F7F2EC"/></linearGradient></defs>' +
      '<rect x="20" y="2" width="160" height="106" rx="10" fill="url(#wfs)"/><rect x="20" y="88" width="160" height="20" fill="#9FCB8C"/>';
    var fl = function (x, alive) {
      return alive ? '<path d="M' + x + ' 104v-9" stroke="#3D8A55" stroke-width="2"/><circle cx="' + x + '" cy="93" r="5" fill="#E0568A"/><circle cx="' + x + '" cy="93" r="2.2" fill="#FFE9A8"/>'
        : '<path d="M' + x + ' 104q1-5 5-6" stroke="#A69FB0" stroke-width="2" fill="none"/><circle cx="' + (x + 6) + '" cy="98" r="3.5" fill="#A69FB0"/>';
    };
    for (var i = 0; i < 5; i++) s += fl(40 + i * 30, !(step === 3 && i === 4));
    var pill = function (x, y, w, typed, on) {
      var t = '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="14" rx="7" fill="' + (on ? '#EEE9FB' : '#fff') + '"' + (on ? ' stroke="' + ACCENT + '" stroke-width="1.5"' : '') + '/>';
      for (var k = 0; k < Math.floor((w - 10) / 7); k++) t += '<rect x="' + (x + 6 + k * 7) + '" y="' + (y + 4) + '" width="5" height="6" rx="1" fill="' + (k < typed ? ACCENT : '#241A49') + '" opacity="' + (k < typed ? 1 : 0.55) + '"/>';
      return t;
    };
    if (step === 1) s += pill(40, 14, 46, 0) + pill(110, 40, 40, 0) + pill(60, 62, 52, 0) + '<path d="M86 30v8M82 34l4 4 4-4" stroke="' + ACCENT + '" stroke-width="1.5" fill="none"/>';
    if (step === 2) s += pill(40, 14, 46, 0) + pill(110, 26, 40, 0) + '<path d="M100 88L86 70" stroke="rgba(62,44,119,0.45)" stroke-width="1.5" stroke-dasharray="3 4"/>' + pill(60, 56, 52, 3, true);
    if (step === 3) s += pill(70, 20, 46, 0) + '<rect x="146" y="76" width="40" height="12" rx="6" fill="#fff" opacity=".7"/>';
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: tArt(1) },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: tArt(2) },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: tArt(3) }
  ];

  /* -------------------------------------------------------------- start */

  // the run is saved on every burst word, every lost flower and when the app goes away;
  // the daily run has its own slot
  ctx.autosave(function () {
    if (!S || ended) return { inProgress: false };
    return { run: S, daily: daily, elapsed: elapsed() };
  });
  function save() { ctx.save(); }
  C.onPause(function () { paused = true; hold(); ctx.save(); });
  C.onResume(function () { paused = false; last = 0; kick(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { hold(); ctx.save(); } else { last = 0; kick(); } });
  // back from the back/forward cache, the page runs on without a load (#385)
  window.addEventListener('pageshow', function (e) { if (e.persisted) { paused = false; hold(); last = 0; kick(); } });
  // a dialog closing does not tell the page; the loop looks again while one is open
  setInterval(function () { if (S && !raf && !ended && !document.hidden && !paused) kick(); }, 400);

  var saved = ctx.loadSave();
  if (saved && saved.run && E.valid(saved.run) && (saved.daily || null) === (dailyDate || null)) {
    S = saved.run; daily = saved.daily || null; elapsed0 = +saved.elapsed || 0; startedAt = 0;
    ended = false; waiting = true;
    buildKeys(); renderTop(); draw();
  } else newRun();
  if (dailyDate && C.stats.dailyDone('wordfall', dailyDate)) {
    var rec = C.stats.dailyOf(dailyDate).wordfall;
    C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
  }
  // the sky is redrawn whenever its box changes (rotation, side rows) and once the web
  // font has arrived and moved the layout (Bowling lesson)
  if (window.ResizeObserver) new ResizeObserver(function () { draw(); }).observe(box);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { font = null; draw(); });
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { draw(); }); } catch (er) { /* old WebViews */ } }
  new MutationObserver(function () { draw(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  ctx.tutorialIfNew(TUT);
})();
</script>
</body>
</html>
