<style>
  /* slate pipes on pale stone; the water is the one bright blue on the board, so how far
     it has come reads at a glance in both themes */
  :root { --fl-tile: #E6ECEE; --fl-tile2: #DCE4E7; --fl-line: #B9C7CD; --fl-case: #3E4D56; --fl-flange: #2A353C; --fl-chan: #F5F8F9;
    --fl-water: #1C86D1; --fl-rock: #8A8478; --fl-rockhi: #B4AEA2; --fl-frame: #2A353C; --fl-cursor: #E8A33A; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fl-tile: #1E282D; --fl-tile2: #222D33; --fl-line: #11181C;
    --fl-case: #8EA2AC; --fl-flange: #B7C6CD; --fl-chan: #26333A; --fl-water: #47AEF0; --fl-rock: #5D584F; --fl-rockhi: #7C766B; --fl-frame: #0C1215; --fl-cursor: #F2B556; } }
  :root[data-theme="dark"] { --fl-tile: #1E282D; --fl-tile2: #222D33; --fl-line: #11181C;
    --fl-case: #8EA2AC; --fl-flange: #B7C6CD; --fl-chan: #26333A; --fl-water: #47AEF0; --fl-rock: #5D584F; --fl-rockhi: #7C766B; --fl-frame: #0C1215; --fl-cursor: #F2B556; }
  .fl-wrap > .ch-fit { --fit-ar: 1; }
  .ch-fit > .fl-box { width: 100%; height: 100%; position: relative; display: grid; place-items: center; }
  /* the board is drawn left to right in every language, so the arrow keys are geometric */
  .fl-board { width: 100%; height: 100%; display: block; direction: ltr; touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; border-radius: var(--r-md); box-shadow: var(--sh-2); cursor: pointer; }
  .fl-board:focus-visible { outline: 3px solid var(--game, var(--c-accent)); outline-offset: 2px; }
  .fl-tile { fill: var(--fl-tile); stroke: var(--fl-line); stroke-width: 1.5; }
  .fl-tile--b { fill: var(--fl-tile2); }
  .fl-case { fill: none; stroke: var(--fl-case); stroke-width: 46; }
  .fl-chan { fill: none; stroke: var(--fl-chan); stroke-width: 24; }
  .fl-hub { fill: var(--fl-case); }
  .fl-hubc { fill: var(--fl-chan); }
  .fl-flange { fill: var(--fl-flange); }
  .fl-arrow { fill: var(--fl-case); }
  .fl-wat { fill: none; stroke: var(--fl-water); stroke-width: 17; stroke-linejoin: round; }
  .fl-rockb { fill: var(--fl-rock); }
  .fl-rockh { fill: var(--fl-rockhi); }
  .fl-src { fill: var(--game, var(--c-accent)); }
  .fl-srcw { fill: var(--fl-water); }
  .fl-ring { fill: none; stroke: var(--fl-cursor); stroke-width: 7; stroke-linecap: round; }
  .fl-cur { fill: none; stroke: var(--fl-cursor); stroke-width: 6; }
  .fl-puddle { fill: var(--fl-water); opacity: .75; }
  .fl-cell--poof { animation: fl-poof 420ms var(--ease); transform-box: fill-box; transform-origin: center; }
  @keyframes fl-poof { 0% { opacity: .2; transform: scale(.7); } 100% { opacity: 1; transform: none; } }
  .fl-cell--no { animation: fl-no 300ms var(--ease); transform-box: fill-box; transform-origin: center; }
  @keyframes fl-no { 0%, 100% { transform: none; } 25% { transform: translateX(-5%); } 75% { transform: translateX(5%); } }
  /* a word over the board between levels; pointer events pass through to the board,
     which reads any tap as "go on" in these states */
  /* the note sits at the edge away from the source, so the source can be seen before the
     water starts (in the middle it hid the source on the first screenshots) */
  .fl-note { position: absolute; bottom: 4%; left: 50%; transform: translateX(-50%); width: max-content; max-width: 92%; box-sizing: border-box;
    background: var(--c-surface); color: var(--c-text); border-radius: var(--r-lg); box-shadow: var(--sh-3);
    padding: var(--s-3) var(--s-4); text-align: center; display: flex; flex-direction: column; gap: var(--s-2); align-items: center; }
  .fl-note--top { bottom: auto; top: 4%; }
  .fl-note[hidden] { display: none; }
  .fl-note__t { font-weight: 800; font-size: 1.2rem; }
  .fl-note__s { color: var(--c-text-dim); font-size: .95rem; }
  /* the label sits above the tiles, so five tiles fit the 240px side column in phone landscape */
  .fl-queue { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .fl-queue__l { font-weight: 700; color: var(--c-text-dim); font-size: .9rem; }
  .fl-qrow { display: flex; align-items: center; gap: 6px; direction: ltr; position: relative; }
  .fl-qt { width: 38px; height: 38px; border-radius: var(--r-sm); background: var(--fl-tile); border: 1.5px solid var(--fl-line); box-sizing: border-box; display: block; flex: none; }
  .fl-qt svg { width: 100%; height: 100%; display: block; }
  .fl-qt--next { width: 52px; height: 52px; border: 3px solid var(--game, var(--c-accent)); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fl-qt--next { border-color: var(--game-text-dark, var(--game, var(--c-accent))); } }
  :root[data-theme="dark"] .fl-qt--next { border-color: var(--game-text-dark, var(--game, var(--c-accent))); }
  .fl-qrow--busy .fl-qt--next { opacity: .45; }
  .fl-busy { position: absolute; left: 0; bottom: -6px; height: 3px; border-radius: 2px; background: var(--fl-cursor); width: 0; }
  .fl-status { min-height: 1.6em; font-weight: 700; color: var(--c-text-dim); text-align: center; font-variant-numeric: tabular-nums; }
  .fl-acts { display: flex; justify-content: center; align-items: center; gap: var(--s-2); flex-wrap: wrap; min-height: 44px; }
  .fl-timer { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 7em; text-align: center; }
  @media (prefers-reduced-motion: reduce) { .fl-cell--poof, .fl-cell--no { animation: none; } }

<script>
/* ==== ENGINE START ==== */
function FloodEngineFactory() {
  'use strict';

  var COLS = 8, ROWS = 8, NN = COLS * ROWS, DT = 1 / 60, QUEUE = 5;
  // a cell's sides as bits; one clockwise step turns N→E→S→W
  var N = 1, E = 2, S = 4, W = 8, DIRS = [N, E, S, W];
  // replacing a piece the water has not reached costs this long with no placing, and points
  var REPLACE_T = 0.6, HURRY_T = 0.12;
  var P_CELL = 10, P_EXTRA = 20, P_CROSS = 50, P_REPLACE = 5;
  var SPEEDS = { calm: 1.3, normal: 1, brisk: 0.8 };

  function opp(d) { return d === N ? S : d === E ? W : d === S ? N : E; }
  function cw(d) { return ((d << 1) | (d >> 3)) & 15; }
  function nb(i, d) {
    var r = Math.floor(i / COLS) + (d === N ? -1 : d === S ? 1 : 0), c = i % COLS + (d === W ? -1 : d === E ? 1 : 0);
    return r < 0 || c < 0 || r >= ROWS || c >= COLS ? -1 : r * COLS + c;
  }

  // The pieces. A tee is named by its stem. Water that comes in by either end of a tee's
  // bar runs straight through; water that comes in by the stem turns to its own right
  // (clockwise), and the page draws an arrow at that end, so the branch is never a guess.
  var PIECES = {
    h: { m: E | W, k: 'straight' }, v: { m: N | S, k: 'straight' },
    ne: { m: N | E, k: 'bend' }, es: { m: E | S, k: 'bend' }, sw: { m: S | W, k: 'bend' }, wn: { m: W | N, k: 'bend' },
    tn: { m: N | E | W, k: 'tee', stem: N }, te: { m: E | N | S, k: 'tee', stem: E },
    ts: { m: S | E | W, k: 'tee', stem: S }, tw: { m: W | N | S, k: 'tee', stem: W },
    x: { m: 15, k: 'cross' }
  };
  var KINDS = ['h', 'v', 'ne', 'es', 'sw', 'wn', 'tn', 'te', 'ts', 'tw', 'x'];
  var WEIGHTS = [3, 3, 2, 2, 2, 2, 1, 1, 1, 1, 2];
  for (var key in PIECES) if (PIECES[key].k === 'tee') PIECES[key].turn = cw(opp(PIECES[key].stem));

  // the side the water leaves a piece by, given the side it came in by; 0 if it cannot come in there
  function exitOf(p, inSide) {
    var P = PIECES[p];
    if (!P || !(P.m & inSide)) return 0;
    if (P.k === 'cross') return opp(inSide);
    if (P.k === 'tee') return inSide === P.stem ? P.turn : opp(inSide);
    return P.m & ~inSide;
  }
  function axis(side) { return side === N || side === S ? 'v' : 'h'; }

  // the core's seeded generator, kept as a number so a level saves and restores exactly
  function draw32(st) {
    var a = (st.s + 0x6D2B79F5) | 0; st.s = a;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function mulberry(seed) { var st = { s: seed | 0 }; return function () { return draw32(st); }; }
  function nextPiece(S) {
    var st = { s: S.qs }, r = draw32(st) * 20, k = 0;
    S.qs = st.s;
    while (r >= WEIGHTS[k]) { r -= WEIGHTS[k]; k++; }
    return KINDS[k];
  }

  // Each level asks for more pipe, gives less time before the water and lets it run
  // faster, with a rock more on the board, up to a ceiling where it stays.
  function params(lv, speed) {
    var k = SPEEDS[speed] || 1, L = Math.max(0, lv - 1);
    return { goal: Math.min(28, 8 + 2 * L), cd: Math.round(Math.max(12, 26 - 1.5 * L) * k * 10) / 10,
      cellT: Math.round(Math.max(1, 3 - 0.18 * L) * k * 100) / 100, rocks: Math.min(10, L) };
  }
  function clearBonus(lv) { return 50 + 10 * lv; }

  // A self-avoiding walk of `len` cells from `start` over free cells, or null. The
  // generator keeps only boards where one exists, so the goal can always be laid.
  function findPath(rock, src, start, len, rnd, limit) {
    if (start < 0 || rock[start] || start === src) return null;
    var seen = new Array(NN).fill(false), path = [start], nodes = 0;
    seen[start] = true; seen[src] = true;
    function go() {
      if (path.length >= len) return true;
      if (++nodes > (limit || 6000)) return false;
      var c = path[path.length - 1], ds = DIRS.slice();
      for (var k = 3; k > 0; k--) { var j = Math.floor(rnd() * (k + 1)), t = ds[k]; ds[k] = ds[j]; ds[j] = t; }
      for (var q = 0; q < 4; q++) {
        var n = nb(c, ds[q]);
        if (n < 0 || seen[n] || rock[n]) continue;
        seen[n] = true; path.push(n);
        if (go()) return true;
        path.pop(); seen[n] = false;
      }
      return false;
    }
    return go() ? path : null;
  }

  // A level from its number and seed: a source with one outlet away from the edge, rocks
  // that never sit on the outlet, and the first five pieces. A board on which no walk
  // of goal + 4 cells leaves the outlet is thrown away.
  function level(lv, seed, speed, base) {
    var rnd = mulberry(seed), P = params(lv, speed);
    for (var attempt = 0; attempt < 80; attempt++) {
      var rocksN = attempt < 50 ? P.rocks : Math.floor(P.rocks / 2);
      var src = (1 + Math.floor(rnd() * (ROWS - 2))) * COLS + 1 + Math.floor(rnd() * (COLS - 2));
      var srcDir = DIRS[Math.floor(rnd() * 4)], out = nb(src, srcDir);
      var rock = new Array(NN).fill(false), placed = 0, tries = 0;
      while (placed < rocksN && tries++ < 200) {
        var c = Math.floor(rnd() * NN);
        if (c === src || c === out || rock[c]) continue;
        rock[c] = true; placed++;
      }
      if (!findPath(rock, src, out, P.goal + 4, rnd)) continue;
      var St = {
        v: 1, level: lv, seed: seed | 0, speed: SPEEDS[speed] ? speed : 'normal', goal: P.goal, cd: P.cd, cd0: P.cd, cellT: P.cellT,
        grid: new Array(NN).fill(''), rock: rock, src: src, srcDir: srcDir,
        segs: [], qs: (seed ^ 0x5bd1e995) | 0, queue: [], busy: 0, hurry: false, head: null,
        filled: 0, score: Math.max(0, base | 0), crosses: 0, replaced: 0, placed: 0, over: false, passed: false, spill: null, t: 0, ev: []
      };
      for (var i = 0; i < NN; i++) St.segs.push([]);
      for (var q = 0; q < QUEUE; q++) St.queue.push(nextPiece(St));
      return St;
    }
    return null;
  }

  // can the water come into cell j by side inSide? A piece the water has been through
  // is full, except a cross, which takes a second pass along its other line
  function canEnter(St, j, inSide) {
    var p = St.grid[j];
    if (!p || St.rock[j] || j === St.src || !exitOf(p, inSide)) return false;
    var segs = St.segs[j];
    if (!segs.length) return true;
    if (PIECES[p].k !== 'cross' || segs.length > 1) return false;
    return axis(segs[0][0]) !== axis(inSide);
  }

  // Lay the next piece on cell i, or swap a laid piece for it. Refused on rocks, the
  // source and anything the water has entered; a swap waits REPLACE_T and costs points.
  function place(St, i) {
    if (St.over) return 'over';
    if (!(i >= 0 && i < NN)) return 'off';
    if (St.rock[i] || i === St.src) return 'blocked';
    if (St.segs[i].length) return 'wet';
    if (St.busy > 0) return 'busy';
    var was = St.grid[i], p = St.queue.shift();
    St.queue.push(nextPiece(St));
    St.grid[i] = p;
    if (was) {
      St.busy = REPLACE_T; St.score = Math.max(0, St.score - P_REPLACE); St.replaced++;
      St.ev.push({ t: 'replace', i: i, was: was, p: p });
      return 'replaced';
    }
    St.placed++;
    St.ev.push({ t: 'place', i: i, p: p });
    return 'placed';
  }

  function start(St) {
    St.cd = 0;
    St.head = { i: St.src, from: 0, to: St.srcDir, p: 0.5 };
    St.segs[St.src] = [[0, St.srcDir]];
    St.ev.push({ t: 'go' });
  }
  // open the tap now: the countdown ends and the water runs fast to the end
  function hurry(St) {
    if (St.over || St.hurry) return false;
    St.hurry = true;
    if (St.cd > 0) start(St);
    St.ev.push({ t: 'hurry' });
    return true;
  }

  function step(St, dt) {
    if (St.over) return;
    St.t += dt;
    if (St.busy > 0) St.busy = Math.max(0, St.busy - dt);
    if (St.cd > 0) {
      var before = Math.ceil(St.cd - 1e-9);
      St.cd -= dt;
      if (St.cd > 1e-9) {
        var now = Math.ceil(St.cd - 1e-9);
        if (now !== before && now <= 3) St.ev.push({ t: 'count', n: now });
        return;
      }
      dt = -St.cd; start(St);
    }
    var h = St.head;
    h.p += dt / (St.hurry ? HURRY_T : St.cellT);
    while (h.p >= 1 && !St.over) {
      if (h.i !== St.src) {
        St.filled++;
        var pts = St.filled > St.goal ? P_EXTRA : P_CELL;
        St.score += pts;
        St.ev.push({ t: 'fill', i: h.i, n: St.filled, pts: pts });
        if (St.filled === St.goal) St.ev.push({ t: 'goal' });
      }
      var j = nb(h.i, h.to), inSide = opp(h.to);
      if (j < 0 || !canEnter(St, j, inSide)) {
        St.over = true; St.passed = St.filled >= St.goal; h.p = 1;
        St.spill = { i: h.i, side: h.to, into: j };
        if (St.passed) St.score += clearBonus(St.level);
        St.ev.push({ t: 'over', passed: St.passed, filled: St.filled });
        break;
      }
      var second = St.segs[j].length === 1;
      var out = exitOf(St.grid[j], inSide);
      St.segs[j].push([inSide, out]);
      if (second) { St.crosses++; St.score += P_CROSS; St.ev.push({ t: 'cross', i: j }); }
      h.p -= 1; h.i = j; h.from = inSide; h.to = out;
    }
  }
  function drain(St) { var e = St.ev; St.ev = []; return e; }

  function snapshot(St) {
    var o = JSON.parse(JSON.stringify(St));
    delete o.ev;
    return o;
  }
  function restore(o) {
    if (!o || o.v !== 1 || typeof o !== 'object') return null;
    var num = function (x, lo, hi) { return typeof x === 'number' && isFinite(x) && x >= lo && x <= hi; };
    if (!num(o.level, 1, 999) || !num(o.goal, 1, NN) || !num(o.cd, 0, 120) || !num(o.cd0, 0, 120) || !num(o.cellT, 0.1, 10) || !num(o.busy, 0, 5) ||
      !num(o.src, 0, NN - 1) || DIRS.indexOf(o.srcDir) < 0 || !num(o.filled, 0, 999) || !num(o.score, 0, 1e7) || typeof o.qs !== 'number' || !SPEEDS[o.speed]) return null;
    if (!Array.isArray(o.grid) || o.grid.length !== NN || !Array.isArray(o.rock) || o.rock.length !== NN || !Array.isArray(o.segs) || o.segs.length !== NN) return null;
    if (!Array.isArray(o.queue) || o.queue.length !== QUEUE || o.queue.some(function (p) { return !PIECES[p]; })) return null;
    for (var i = 0; i < NN; i++) {
      if (o.grid[i] !== '' && !PIECES[o.grid[i]]) return null;
      if (typeof o.rock[i] !== 'boolean' || !Array.isArray(o.segs[i]) || o.segs[i].length > 2) return null;
      if ((o.rock[i] || i === o.src) && o.grid[i]) return null;
      for (var s = 0; s < o.segs[i].length; s++) {
        var g = o.segs[i][s];
        if (!Array.isArray(g) || g.length !== 2 || DIRS.indexOf(g[1]) < 0 || (g[0] !== 0 && DIRS.indexOf(g[0]) < 0)) return null;
        if (i !== o.src && exitOf(o.grid[i], g[0]) !== g[1]) return null;
      }
    }
    if (o.cd > 0 ? o.head !== null : !(o.head && num(o.head.i, 0, NN - 1) && num(o.head.p, 0, 1) && o.segs[o.head.i].length > 0)) return null;
    var St = JSON.parse(JSON.stringify(o));
    St.ev = [];
    return St;
  }

  return {
    COLS: COLS, ROWS: ROWS, NN: NN, DT: DT, QUEUE: QUEUE, N: N, E: E, S: S, W: W, DIRS: DIRS, PIECES: PIECES, KINDS: KINDS,
    REPLACE_T: REPLACE_T, HURRY_T: HURRY_T, P_CELL: P_CELL, P_EXTRA: P_EXTRA, P_CROSS: P_CROSS, P_REPLACE: P_REPLACE, SPEEDS: SPEEDS,
    opp: opp, cw: cw, nb: nb, exitOf: exitOf, mulberry: mulberry, params: params, clearBonus: clearBonus, findPath: findPath,
    level: level, canEnter: canEnter, place: place, hurry: hurry, step: step, drain: drain, snapshot: snapshot, restore: restore
  };
}
if (typeof module !== 'undefined') module.exports = FloodEngineFactory;
/* ==== ENGINE END ==== */
</script>

  var E = FloodEngineFactory();

  C.boot({});
  var ctx = C.game({
    id: 'flood',
    name: { fa: 'سیل', en: 'Flood', zh: '洪水', de: 'Flut', es: 'Riada', pl: 'Powódź', fr: 'Crue' },
    accent: ACCENT,
    mood: 'dots',
    strings: {

        flLevelN: 'مرحله‌ی {n}', flGoalN: 'آب: {a} از {b}', flScoreN: 'امتیاز: {n}', flWaterIn: 'آب تا {s} ثانیه', flFlowing: 'آب راه افتاد', flRushing: 'آب با شتاب',
        flHurry: 'آب را باز کن', flStartL: 'شروع', flGoOn: 'برای ادامه صفحه را لمس کن.', flLevelGoal: 'دست‌کم {n} خانه لوله بگذار تا آب از آن بگذرد.',
        flCleared: 'مرحله‌ی {n} تمام شد!', flNextLevel: 'مرحله‌ی {n}', flSpilled: 'آب بیرون ریخت', flShort: 'آب به هدف نرسید',
        flGoalHit: 'به هدف رسیدی!', flCrossBonus: 'دوبار از چهارراه!', flNewRun: 'دور تازه', flDaily: 'سیل روزانه',
        flSpeed: 'سرعت آب', flCalm: 'آرام', flNormal: 'معمولی', flBrisk: 'تند',

  }
  // pointerdown, not click: the board redraws as the water moves, and a click whose press
  // and release land on different redrawn nodes is not sent (#750)
  svg.addEventListener('pointerdown', function (ev) {
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    ev.preventDefault();
    kbMode = false;
    act(cellAt(ev));
  });
  svg.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
  note.addEventListener('pointerdown', function (ev) { ev.preventDefault(); act(-1); });

  window.addEventListener('keydown', function (e) {
    if (document.querySelector('.ch-scrim')) return;
    if (e.ctrlKey || e.metaKey || e.altKey || !S) return;
    var d = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
    if (d) {
      e.preventDefault();
      kbMode = true;
      var r = Math.floor(cursor / E.COLS), c = cursor % E.COLS;
      r = Math.max(0, Math.min(E.ROWS - 1, r + d[1])); c = Math.max(0, Math.min(E.COLS - 1, c + d[0]));
      cursor = r * E.COLS + c;
      if (document.activeElement !== svg) svg.focus();
      renderAll();
      return;
    }
    if ((e.key === ' ' || e.key === 'Enter') && !(document.activeElement && /^(BUTTON|INPUT|A|SELECT)$/.test(document.activeElement.tagName))) {
      e.preventDefault();
      if (e.repeat) return;
      kbMode = true;
      act(mode === 'play' ? cursor : -1);
      return;
    }
    if (C.keyIs(e, 'f')) { e.preventDefault(); doHurry(); return; }
    if (C.keyIs(e, 'n') && !dailyDate) { e.preventDefault(); askNew(); }
  });

  /* ------------------------------------------------------------ dialogs */

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    var keys = [kb('← ↑ → ↓', C.t('kMove')), kb('Space / Enter', C.t('kPlace')), kb('F', C.t('kHurry'))];
    if (!dailyDate) keys.push(kb('N', C.t('kNew')));
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, keys)
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  // tutorial boards: a 4×2 strip in the light theme's colours, cells given as
  // [piece or 's'/'r', water segments]
  var LIGHT = '--fl-tile:#E6ECEE;--fl-tile2:#DCE4E7;--fl-line:#B9C7CD;--fl-case:#3E4D56;--fl-flange:#2A353C;--fl-chan:#F5F8F9;--fl-water:#1C86D1;--fl-rock:#8A8478;--fl-rockhi:#B4AEA2;--fl-cursor:#E8A33A;--game:' + ACCENT;
  function tArt(cells, extra) {
    var s = '<svg viewBox="-4 -4 408 208" width="100%" style="' + LIGHT + '"><rect x="-4" y="-4" width="408" height="208" rx="10" fill="#2A353C"/>';
    for (var i = 0; i < 8; i++) {
      var x = (i % 4) * 100, y = Math.floor(i / 4) * 100, c = cells[i] || [''];
      s += '<rect class="fl-tile' + ((i % 4 + Math.floor(i / 4)) % 2 ? ' fl-tile--b' : '') + '" x="' + x + '" y="' + y + '" width="100" height="100"/><g transform="translate(' + x + ' ' + y + ')">';
      if (c[0] === 's') s += sourceSvg(c[2]) + waterSvg('', c[1] || [], null);
      else if (c[0] === 'r') s += rockSvg(i);
      else if (c[0]) s += pieceSvg(c[0]) + waterSvg(c[0], c[1] || [], null);
      s += '</g>';
    }
    return s + (extra || '') + '</svg>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: tArt([['s', [], 2], ['h'], ['sw'], [''], [''], ['ne'], [''], ['r']],
      '<rect x="306" y="6" width="88" height="88" rx="10" fill="none" stroke="#E8A33A" stroke-width="6"/>') },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: tArt([['s', [[0, 2]], 2], ['h', [[8, 2]]], ['sw', [[8, 4]]], [''], ['r'], ['ne'], ['wn', [[1, 8]]], ['']]) },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: tArt([['s', [[0, 2]], 2], ['ts', [[8, 2]]], ['x', [[8, 2]]], ['sw'], [''], ['ne'], ['x', [[1, 4], [8, 2]]], ['wn']]) }
  ];

  /* ------------------------------------------------------------- start */

  // the level is saved after every piece and at each change of state; a game that comes
  // back waits for a tap before the water moves again
  ctx.autosave(function () {
    if (!S || !run || mode === 'end') return { inProgress: false };
    return { run: run, S: E.snapshot(S), between: mode === 'between', elapsed: Date.now() - startedAt, tries: tries };
  });
  var saved = ctx.loadSave(), back = saved && saved.run && E.restore(saved.S);
  if (back && !back.over === !saved.between && (saved.run.daily || null) === (dailyDate || null) && E.SPEEDS[saved.run.speed] && typeof saved.run.cleared === 'number') {
    run = { daily: saved.run.daily || null, speed: saved.run.speed, cleared: saved.run.cleared, bestFill: saved.run.bestFill || 0 };
    S = back; tries = saved.tries || 1; startedAt = Date.now() - (saved.elapsed || 0);
    cursor = S.src;
    mode = saved.between ? 'between' : (S.cd < S.cd0 || S.placed > 0 || S.head) ? 'paused' : 'ready';
    renderAll();
  } else newRun();
  if (dailyDate && C.stats.dailyDone('flood', dailyDate)) {
    var rec = C.stats.dailyOf(dailyDate).flood;
    C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
  }

  C.onPause(function () { paused = true; if (mode === 'play') mode = 'paused'; ctx.save(); renderAll(); });
  C.onResume(function () { paused = false; renderAll(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden && mode === 'play') { mode = 'paused'; ctx.save(); renderAll(); } });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { renderAll(); });
  ctx.tutorialIfNew(TUT);
})();
</script>
</body>
</html>
