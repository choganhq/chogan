<script>
/* ==== ENGINE START ==== */
function HamletEngineFactory() {
  'use strict';

  // The faces: 1 timber, 2 stone, 3 reed, 4 water, 5 seed, 6 sun. The sun stands in for any other face.
  var SUN = 6, ROUNDS = 12, ROLLS = 3, DICE = 5;
  var KINDS = ['path', 'hut', 'well', 'field'];
  // cost: the faces to pay (one die each); pts: what each slot scores, built left to right;
  // bonus: paid once the whole row is built
  var PLAN = {
    path:  { cost: [1, 1, 2],    pts: [1, 1, 1, 2, 2, 3], bonus: 4 },
    hut:   { cost: [1, 3, 3, 5], pts: [2, 3, 4, 5],       bonus: 6 },
    well:  { cost: [2, 2, 4, 4], pts: [3, 4, 5],          bonus: 5 },
    field: { cost: [5, 5, 4, 3], pts: [2, 2, 3, 3],       bonus: 4 }
  };
  var BALANCE = 5, BALANCE_AT = 2;   // two of every kind builds a balanced hamlet

  function sumOf(a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s; }
  var MAX = (function () {
    var m = BALANCE;
    KINDS.forEach(function (k) { m += sumOf(PLAN[k].pts) + PLAN[k].bonus; });
    return m;
  })();

  // Every die is a fixed function of the game's seed and where it is rolled (round, roll,
  // position): reopening the game can never roll again for a better result, and the daily
  // game gives everyone the same dice for the same choices
  function mix(a, b) {
    var h = (a ^ 0x9E3779B9) | 0;
    h = Math.imul(h ^ (h >>> 15), 0x2C1B3C6D);
    h = (h + Math.imul(b | 0, 0x297A2D39)) | 0;
    h = Math.imul(h ^ (h >>> 12), 0x7FEB352D);
    h = Math.imul(h ^ (h >>> 15), 0x846CA68B);
    return (h ^ (h >>> 16)) >>> 0;
  }
  function die(seed, round, roll, i) {
    var slot = (round * ROLLS + roll) * DICE + i;
    return mix(mix(seed | 0, 0x68E31DA4), slot + 1) % 6 + 1;
  }

  function newGame(seed) {
    return { dice: [1, 1, 1, 1, 1], held: [false, false, false, false, false], used: [false, false, false, false, false],
      rolls: 0, round: 0, built: { path: 0, hut: 0, well: 0, field: 0 }, seed: seed | 0 };
  }
  function over(S) { return S.round >= ROUNDS; }

  // Rolls every die that is neither kept nor spent (all five on a round's first roll); the
  // indexes that rolled, or null when no roll is left
  function roll(S) {
    if (over(S) || S.rolls >= ROLLS) return null;
    if (S.rolls === 0) { S.held = [false, false, false, false, false]; S.used = [false, false, false, false, false]; }
    var rolled = [];
    for (var i = 0; i < DICE; i++) {
      if (S.held[i] || S.used[i]) continue;
      S.dice[i] = die(S.seed, S.round, S.rolls, i);
      rolled.push(i);
    }
    if (!rolled.length) return null;
    S.rolls++;
    return rolled;
  }
  // Keeping a die only means something between rolls, and a spent die has left the table
  function toggle(S, i) {
    if (over(S) || S.rolls === 0 || S.rolls >= ROLLS || i < 0 || i >= DICE || S.used[i]) return false;
    S.held[i] = !S.held[i];
    return true;
  }

  // The dice that would pay for the next building of a kind: each cost face from a die showing
  // it first, then suns for what is left. Null when they cannot be found
  function pay(S, kind) {
    var cost = PLAN[kind].cost, take = [], taken = [false, false, false, false, false], i, j;
    var missing = [];
    for (i = 0; i < cost.length; i++) {
      for (j = 0; j < DICE; j++) if (!S.used[j] && !taken[j] && S.dice[j] === cost[i]) break;
      if (j < DICE) { taken[j] = true; take.push(j); } else missing.push(i);
    }
    for (i = 0; i < missing.length; i++) {
      for (j = 0; j < DICE; j++) if (!S.used[j] && !taken[j] && S.dice[j] === SUN) break;
      if (j >= DICE) return null;
      taken[j] = true; take.push(j);
    }
    return take;
  }
  // A hut needs a path to stand on: the first hut one path, the second two, and so on
  function unlocked(S, kind) { return kind !== 'hut' || S.built.hut < S.built.path; }
  function room(S, kind) { return S.built[kind] < PLAN[kind].pts.length; }
  function canBuild(S, kind) {
    return !over(S) && S.rolls > 0 && !!PLAN[kind] && room(S, kind) && unlocked(S, kind) && pay(S, kind) !== null;
  }
  // Spends the dice and builds the next slot of the row
  function build(S, kind) {
    if (!canBuild(S, kind)) return null;
    var dice = pay(S, kind), n = S.built[kind], pts = PLAN[kind].pts[n], had = rowDone(S, kind);
    dice.forEach(function (j) { S.used[j] = true; S.held[j] = false; });
    S.built[kind]++;
    return { kind: kind, slot: n, points: pts, dice: dice, rowDone: !had && rowDone(S, kind), balanced: balanced(S) };
  }
  // Ends the round: whatever dice are left are lost
  function endRound(S) {
    if (over(S) || S.rolls === 0) return null;
    S.round++; S.rolls = 0;
    S.held = [false, false, false, false, false]; S.used = [false, false, false, false, false];
    return { over: over(S) };
  }

  function rowDone(S, kind) { return S.built[kind] >= PLAN[kind].pts.length; }
  function balanced(S) { return KINDS.every(function (k) { return S.built[k] >= BALANCE_AT; }); }
  function rowPoints(S, kind) { var s = 0; for (var i = 0; i < S.built[kind]; i++) s += PLAN[kind].pts[i]; return s; }
  function total(S) {
    var s = balanced(S) ? BALANCE : 0;
    KINDS.forEach(function (k) { s += rowPoints(S, k) + (rowDone(S, k) ? PLAN[k].bonus : 0); });
    return s;
  }
  function count(S) { return sumOf(KINDS.map(function (k) { return S.built[k]; })); }

  // A save that no game could have reached is not restored
  function valid(s) {
    if (!s || !Array.isArray(s.dice) || s.dice.length !== DICE || !Array.isArray(s.held) || s.held.length !== DICE ||
      !Array.isArray(s.used) || s.used.length !== DICE || !s.built || !Number.isInteger(s.seed)) return false;
    if (!s.dice.every(function (v) { return Number.isInteger(v) && v >= 1 && v <= 6; })) return false;
    if (!s.held.every(function (v) { return typeof v === 'boolean'; }) || !s.used.every(function (v) { return typeof v === 'boolean'; })) return false;
    if (!Number.isInteger(s.round) || s.round < 0 || s.round >= ROUNDS || !Number.isInteger(s.rolls) || s.rolls < 0 || s.rolls > ROLLS) return false;
    if (s.rolls === 0 && (s.used.some(Boolean) || s.held.some(Boolean))) return false;
    if (s.held.some(function (h, i) { return h && s.used[i]; })) return false;
    for (var k = 0; k < KINDS.length; k++) {
      var n = s.built[KINDS[k]];
      if (!Number.isInteger(n) || n < 0 || n > PLAN[KINDS[k]].pts.length) return false;
    }
    if (Object.keys(s.built).length !== KINDS.length || s.built.hut > s.built.path) return false;
    // a building costs at least three dice and a round has five: more buildings than that
    // cannot have been paid for
    return count(s) <= Math.floor(DICE * (s.round + (s.rolls ? 1 : 0)) / 3);
  }

  return { KINDS: KINDS, PLAN: PLAN, SUN: SUN, ROUNDS: ROUNDS, ROLLS: ROLLS, DICE: DICE, MAX: MAX, BALANCE: BALANCE, BALANCE_AT: BALANCE_AT,
    die: die, newGame: newGame, over: over, roll: roll, toggle: toggle, pay: pay, canBuild: canBuild, build: build, endRound: endRound,
    unlocked: unlocked, room: room, rowDone: rowDone, balanced: balanced, rowPoints: rowPoints, total: total, count: count, valid: valid };
}
if (typeof module !== 'undefined') module.exports = HamletEngineFactory;
/* ==== ENGINE END ==== */
</script>

  function sym(v, size) { return '<svg viewBox="0 0 100 100" aria-hidden="true">' + SYM[v] + '</svg>'; }
  function faceSvg(v) {
    return '<svg viewBox="0 0 100 100" aria-hidden="true"><rect class="hm-face" x="3" y="3" width="94" height="94" rx="20"/>' + (v ? SYM[v] : '') + '</svg>';
  }

  /* --------------------------------------------------------------- view */

  var dieBtns = [], diceShown = [];
  for (var di = 0; di < 5; di++) {
    (function (i) {
      dieBtns.push(el('button', { class: 'hm-die', type: 'button', onclick: function () { hold(i); } }));
    })(di);
  }
  var diceRow = el('div', { class: 'hm-dice' }, dieBtns);
  var rollLabel = el('span'), rollSub = el('small');
  var rollBtn = el('button', { class: 'ch-btn ch-btn--primary hm-roll', type: 'button', onclick: doRoll }, [rollLabel, rollSub]);
  var endBtn = el('button', { class: 'ch-btn hm-end', type: 'button', onclick: doEnd, text: C.t('hmEnd') });
  var btns = el('div', { class: 'hm-btns' }, [rollBtn, endBtn]);
  var plots = el('div', { class: 'hm-plots' });
  var rows = {};
  KINDS.forEach(function (k) {
    var cost = el('div', { class: 'hm-cost' }), faces = el('div', { class: 'hm-faces' }), bon = el('div', { class: 'hm-bon' });
    faces.innerHTML = E.PLAN[k].cost.map(sym).join('');
    cost.appendChild(faces); cost.appendChild(bon);
    var slots = el('div', { class: 'hm-slots' }), cells = [];
    E.PLAN[k].pts.forEach(function (p) {
      var cell = el('div', { class: 'hm-slot' }), pt = el('span', { class: 'hm-pts', text: C.num(p) });
      cell.innerHTML = bldSvg(k);
      cell.appendChild(pt);
      cells.push(cell); slots.appendChild(cell);
    });
    var b = el('button', { class: 'hm-row', type: 'button', onclick: function () { buildKind(k); } }, [cost, slots]);
    rows[k] = { b: b, bon: bon, cells: cells, state: '' };
    plots.appendChild(b);
  });
  var table = el('div', { class: 'hm-table' }, [diceRow, btns, plots]);

  var top = el('div', { class: 'hm-top ch-above' });
  function box(label, v) { return el('div', { class: 'hm-score' }, [el('div', { class: 'hm-score__l', text: label }), v]); }
  var roundV = el('div', { class: 'hm-score__v', text: '1' }), scoreV = el('div', { class: 'hm-score__v', text: '0' }), bestV = el('div', { class: 'hm-score__v', text: '0' });
  var scores = el('div', { class: 'hm-scores ch-above' }, [box(C.t('hmRound'), roundV), box(C.t('score'), scoreV), box(C.t('best'), bestV)]);

  var wrap = el('div', { class: 'hm-wrap ch-split' }, [el('div', { class: 'ch-fit' }, [table]), el('div', { class: 'ch-side hm-side' }, [top, scores, el('div', { class: 'hm-top' }, [balChip]), status])]);

  ctx.button({ icon: 'help', label: C.t('help'), onClick: showHelp });
  if (!dailyDate) ctx.button({ icon: 'refresh', label: C.t('newGame'), onClick: askNew });
  ctx.main.appendChild(wrap);
  ctx.mount();

  function best() { return C.stats.getBest('hamlet', 'score') || 0; }

  // Writes only what changed: rebuilding a die or a row under a finger eats the tap (#750)
  function render() {
    var blank = S.rolls === 0 || E.over(S);
    for (var i = 0; i < 5; i++) {
      var b = dieBtns[i], v = blank ? 0 : S.dice[i], key = v + (blank ? 'b' : '');
      if (diceShown[i] !== key) { b.innerHTML = faceSvg(v); diceShown[i] = key; }
      b.classList.toggle('hm-blank', blank);
      b.classList.toggle('hm-used', !blank && S.used[i]);
      b.setAttribute('aria-pressed', !blank && S.held[i] ? 'true' : 'false');
      b.disabled = blank || S.rolls >= E.ROLLS || S.used[i] || ended;
      b.setAttribute('aria-label', blank ? C.t('hmDieBlank', { i: i + 1 }) : S.used[i] ? C.t('hmDieUsed', { i: i + 1, f: FNAME[v] }) : C.t('hmDie', { i: i + 1, f: FNAME[v] }));
    }
    var left = E.ROLLS - S.rolls, free = 0;
    for (i = 0; i < 5; i++) if (!S.used[i]) free++;
    rollLabel.textContent = C.t('hmRoll');
    // no "·" separator: beside a Persian digit it reads as the zero «۰» ("۱۰ بار مانده")
    rollSub.textContent = left > 0 && free > 0 ? C.t('hmLeft', { n: C.num(left) }) : '';
    rollBtn.disabled = left <= 0 || free === 0 || ended;
    endBtn.disabled = S.rolls === 0 || ended;
    KINDS.forEach(function (k) {
      var r = rows[k], n = S.built[k], m = E.PLAN[k].pts.length, can = E.canBuild(S, k), done = E.rowDone(S, k), lock = !done && !E.unlocked(S, k);
      var st = done ? 'full' : can ? 'can' : lock ? 'lock' : 'idle';
      if (r.state !== st) {
        r.state = st;
        r.b.classList.toggle('hm-can', st === 'can');
        r.b.classList.toggle('hm-full', st === 'full');
        r.b.classList.toggle('hm-lock', st === 'lock');
      }
      r.b.disabled = !can || ended;
      r.cells.forEach(function (cell, j) {
        cell.classList.toggle('hm-built', j < n);
        cell.classList.toggle('hm-ghost', j >= n);
        cell.classList.toggle('hm-next', j === n && !done);
      });
      var bt = '★ +' + C.num(E.PLAN[k].bonus);
      if (r.bon.textContent !== bt) r.bon.textContent = bt;
      r.b.setAttribute('aria-label', done ? C.t('hmRowFull', { b: BNAME[k] }) : can ? C.t('hmRowCan', { b: BNAME[k], p: E.PLAN[k].pts[n] }) : lock ? C.t('hmRowLock', { b: BNAME[k] }) : C.t('hmRowNo', { b: BNAME[k], n: n, m: m }));
    });
    var tot = E.total(S);
    roundV.textContent = C.num(Math.min(S.round + 1, E.ROUNDS)) + '/' + C.num(E.ROUNDS);
    scoreV.textContent = C.num(tot);
    bestV.textContent = C.num(best());
    var bn = 0;
    KINDS.forEach(function (k) { if (S.built[k] >= E.BALANCE_AT) bn++; });
    balChip.textContent = E.balanced(S) ? C.t('hmBalDone') : C.t('hmBal', { n: C.num(bn) });
    balChip.className = 'ch-badge' + (E.balanced(S) ? ' ch-badge--accent' : '');
    top.innerHTML = '';
    if (S.daily) top.appendChild(el('span', { class: 'ch-badge ch-badge--accent' }, [C.icon('calendar', 14), el('span', { text: C.t('hmDaily') + ' — ' + C.num(S.daily) })]));
    status.textContent = ended ? '' : S.rolls === 0 ? C.t('hmHintRoll') : S.rolls < E.ROLLS && free > 0 ? C.t('hmHintHold') : C.t('hmHintLast');
  }

  function fitSize() {
    var w = table.getBoundingClientRect().width;
    if (w) table.style.setProperty('--u', (w / 100).toFixed(2) + 'px');
  }
  if (window.ResizeObserver) new ResizeObserver(fitSize).observe(table); else window.addEventListener('resize', fitSize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fitSize(); });

  /* ------------------------------------------------------------- game */

  function seedFor() {
    var r = dailyDate ? C.daily('hamlet', dailyDate).rng : Math.random;
    return Math.floor(r() * 4294967296) | 0;
  }
  function newGame() {
    S = E.newGame(seedFor());
    S.daily = dailyDate || null;
    startedAt = Date.now(); ended = false;
    diceShown = [];
    render();
    save();
  }
  function askNew() {
    if (S && !ended && (S.round > 0 || S.rolls > 0)) C.ui.confirm({ title: C.t('newGame'), body: C.t('resetWarn'), onOk: newGame });
    else newGame();
  }

  function doRoll() {
    if (!S || ended) return;
    var rolled = E.roll(S);
    if (!rolled) return;
    C.feedback('clack');
    render();
    save();
    if (!C.ui.reduceMotion()) {
      // each die tumbles in from the button: the move on the button, the spin on its picture
      rolled.forEach(function (i, n) {
        C.ui.fly(dieBtns[i], rollBtn, { ms: 380, delay: n * 45 });
        var svg = dieBtns[i].firstChild;
        if (svg && svg.animate) svg.animate([{ transform: 'rotate(' + (n % 2 ? 260 : -260) + 'deg) scale(.7)' }, { transform: 'rotate(' + (n % 2 ? -12 : 12) + 'deg) scale(1.06)', offset: .75 }, { transform: 'none' }],
          { duration: 480, delay: n * 45, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'backwards' });
      });
    }
  }

  function hold(i) {
    if (!S || ended || !E.toggle(S, i)) return;
    C.feedback('select');
    render();
    save();
  }

  function buildKind(k) {
    if (!S || ended) return;
    var t = E.build(S, k);
    if (!t) return;
    C.feedback('place');
    render();
    var cell = rows[k].cells[t.slot];
    if (!C.ui.reduceMotion()) {
      C.ui.fly(cell, dieBtns[t.dice[0]], { ms: 360 });
      if (cell.firstChild && cell.firstChild.animate) cell.firstChild.animate([{ transform: 'scale(.4)' }, { transform: 'scale(1.15)', offset: .7 }, { transform: 'none' }], { duration: 420, easing: 'ease-out' });
    }
    if (t.rowDone) { C.achievements.unlock('hm-row'); C.ui.burst(rows[k].b, { colors: ['#1B3729', '#6FA33A', '#F2B21A'], count: 30 }); }
    if (t.balanced && !S.balancedSeen) { S.balancedSeen = true; C.achievements.unlock('hm-bal'); C.ui.burst(balChip, { colors: ['#1B3729', '#F2B21A'], count: 22 }); }
    save();
  }

  function doEnd() {
    if (!S || ended) return;
    var t = E.endRound(S);
    if (!t) return;
    C.feedback('tap');
    diceShown = [];
    render();
    if (t.over) { finishGame(); return; }
    save();
    rollBtn.focus({ preventScroll: true });
  }

  function finishGame() {
    ended = true;
    var tot = E.total(S), prev = best(), isBest = tot > prev;
    C.stats.best('hamlet', 'score', tot);
    if (tot >= 45) C.achievements.unlock('hm-big');
    var coins = Math.max(2, Math.round(tot / 8)), points = Math.max(1, Math.min(120, Math.round(tot * 2)));
    if (S.daily) {
      C.achievements.unlock('hm-daily');
      if (!C.stats.daily('hamlet', S.daily, { label: C.t('hmScoreN', { s: C.num(tot) }), win: true })) {
        coins = Math.round(coins * 0.2); points = Math.round(points * 0.2);
      }
    }
    ctx.clearSave();
    render();
    var rowsBonus = 0;
    KINDS.forEach(function (k) { if (E.rowDone(S, k)) rowsBonus += E.PLAN[k].bonus; });
    var lines = [];
    if (S.daily) lines.push({ label: C.t('daily'), value: C.num(S.daily) });
    lines.push({ label: C.t('score'), value: C.num(tot) });
    lines.push({ label: C.t('hmBuilt'), value: C.num(E.count(S)) });
    lines.push({ label: C.t('hmRowsL'), value: rowsBonus ? '+' + C.num(rowsBonus) : C.num(0) });
    lines.push({ label: C.t('hmBalL'), value: E.balanced(S) ? '+' + C.num(E.BALANCE) : C.num(0) });
    lines.push({ label: C.t('hmPrevBest'), value: prev ? C.num(prev) : '–' });
    var note = isBest ? C.t('hmNewBest') : tot < prev ? C.t('hmBelow', { d: C.num(prev - tot) }) : null;
    setTimeout(function () {
      ctx.finish({
        won: true, title: C.t('hmDoneT'), note: note, timeMs: Date.now() - startedAt, coins: coins, points: points,
        lines: lines,
        shareText: 'چوگان · دهکده' + (S.daily ? '\nروزانه ' + S.daily : '') + '\n' + tot,
        againLabel: S.daily ? null : C.t('newGame'), onAgain: S.daily ? null : newGame
      });
    }, C.ui.reduceMotion() ? 200 : 700);
  }

  /* -------------------------------------------------------------- input */

  window.addEventListener('keydown', function (e) {
    if (document.querySelector('.ch-scrim') || e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target;
    var onButton = t && t.tagName === 'BUTTON';
    if ((e.key === ' ' && !onButton) || C.keyIs(e, 'r')) { e.preventDefault(); doRoll(); return; }
    if (C.keyIs(e, 'e')) { e.preventDefault(); doEnd(); return; }
    var n = '12345'.indexOf(e.key);
    if (n < 0 && /^Digit[1-5]$/.test(e.code || '')) n = +e.code.slice(5) - 1;
    if (n >= 0 && e.key.length === 1) { e.preventDefault(); hold(n); return; }
    var b = '6789'.indexOf(e.key);
    if (b < 0 && /^Digit[6-9]$/.test(e.code || '')) b = +e.code.slice(5) - 6;
    if (b >= 0) { e.preventDefault(); buildKind(KINDS[b]); return; }
    if (C.keyIs(e, 'n') && !dailyDate) { e.preventDefault(); askNew(); }
  });

  /* --------------------------------------------------------------- help */

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    var keys = [kb('Space · R', C.t('hmKRoll')), kb('1–5', C.t('hmKHold')), kb('6–9', C.t('hmKBuild')), kb('E', C.t('hmKEnd'))];
    if (!dailyDate) keys.push(kb('N', C.t('hmKNew')));
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('hmRules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, keys)
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  // The tutorial art: five faces (kept ones ringed in the game's colour), and optionally a
  // building with the faces it costs. Colours are the theme's own variables, so it fits the dark dialog too
  function mini(v, x, y, s) { return '<svg x="' + x + '" y="' + y + '" width="' + s + '" height="' + s + '" viewBox="0 0 100 100">' + SYM[v] + '</svg>'; }
  function tArt(vals, kept, build) {
    var s = '<svg viewBox="0 0 200 120" width="100%" direction="ltr">';
    vals.forEach(function (v, i) {
      var x = 12 + i * 37, y = kept && kept[i] ? 8 : 18, on = kept && kept[i];
      s += '<rect x="' + x + '" y="' + y + '" width="30" height="30" rx="6" fill="var(--c-surface)" stroke="' + (on ? '#1B3729' : 'var(--c-line)') + '" stroke-width="' + (on ? 2.4 : 1.2) + '"/>' + mini(v, x + 3, y + 3, 24);
    });
    if (build) {
      s += '<rect x="20" y="62" width="160" height="46" rx="8" fill="var(--game-soft, #E0ECE5)" stroke="#1B3729" stroke-width="1.6"/>';
      build.cost.forEach(function (f, i) { s += mini(f, 30 + i * 24, 72, 22); });
      s += '<svg x="128" y="68" width="38" height="34" viewBox="0 0 100 100">' + BLD[build.kind] + '</svg>';
    }
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('hmTut1T'), text: C.t('hmTut1'), art: tArt([1, 3, 3, 2, 6], [true, false, true, false, false]) },
    { title: C.t('hmTut2T'), text: C.t('hmTut2'), art: tArt([1, 3, 3, 5, 2], [false, false, false, false, false], { kind: 'hut', cost: [1, 3, 3] }) },
    { title: C.t('hmTut3T'), text: C.t('hmTut3'), art: tArt([6, 3, 3, 4, 4], null, { kind: 'hut', cost: [1, 3, 3] }) }
  ];

  /* -------------------------------------------------------------- start */

  // saved after every roll, keep, building and round; the daily game has its own slot
  ctx.autosave(function () {
    if (!S || ended) return { inProgress: false };
    return { dice: S.dice, held: S.held, used: S.used, rolls: S.rolls, round: S.round, built: S.built, seed: S.seed, daily: S.daily, elapsed: Date.now() - startedAt };
  });
  function save() { ctx.save(); }
  var saved = ctx.loadSave();
  if (saved && E.valid(saved) && (saved.daily || null) === (dailyDate || null)) {
    S = { dice: saved.dice.slice(), held: saved.held.slice(), used: saved.used.slice(), rolls: saved.rolls, round: saved.round, seed: saved.seed, daily: saved.daily || null,
      built: { path: saved.built.path, hut: saved.built.hut, well: saved.built.well, field: saved.built.field } };
    S.balancedSeen = E.balanced(S);
    startedAt = Date.now() - (saved.elapsed || 0);
    render();
  } else newGame();
  if (dailyDate && C.stats.dailyDone('hamlet', dailyDate)) {
    var rec = C.stats.dailyOf(dailyDate).hamlet;
    C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
  }
  fitSize();
  ctx.tutorialIfNew(TUT);
})();
</script>
</body>
</html>
