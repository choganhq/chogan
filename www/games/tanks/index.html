<script>
/* ==== ENGINE START ==== */
function TanksEngineFactory() {
  'use strict';

  // The field is 640 × 440 units, y down; the ground is a height for every unit of x,
  // measured up from the bottom. Throws fly in fixed steps, as in Gorillas, so a shot
  // lands in the same place on every device and the bot thinks with the same code.
  var W = 640, H = 440, GRAV = 300, DT = 1 / 60, SPEED = 4.4, MAX_STEPS = 700;
  var TW = 26, TH = 12, WIND = 30, SHOTS = 10, MOVES = 4, STEP = 24;
  // the arsenal: blast radius, most damage at the centre, how many each player has
  // (shells: whatever shots are left)
  var ARMS = {
    shell:  { r: 26, dmg: 35, n: Infinity },
    heavy:  { r: 44, dmg: 50, n: 2 },
    triple: { r: 18, dmg: 22, n: 2 },
    roller: { r: 28, dmg: 38, n: 2 },
    dirt:   { r: 34, dmg: 0, n: 1 }
  };
  var ORDER = ['shell', 'heavy', 'triple', 'roller', 'dirt'];

  // Rolling hills: a few slow waves on a base, kept low at the two ends where the tanks
  // start so neither begins in a pit or on a cliff
  function terrain(rnd) {
    var h = [], waves = [];
    for (var k = 0; k < 4; k++) waves.push({ a: 18 + rnd() * 42 / (k + 1), f: (k + 1) * (0.6 + rnd() * 0.9) * Math.PI * 2 / W, p: rnd() * Math.PI * 2 });
    var base = 120 + rnd() * 60, hill = rnd() * 90;
    for (var x = 0; x <= W; x++) {
      var y = base + hill * Math.sin(Math.PI * x / W);
      waves.forEach(function (w) { y += w.a * Math.sin(w.f * x + w.p); });
      h.push(Math.max(40, Math.min(H - 120, Math.round(y))));
    }
    return h;
  }
  function groundY(h, x) { var i = Math.max(0, Math.min(W, Math.round(x))); return H - h[i]; }
  // a tank sits on the ground under its middle
  function tankY(M, i) { return groundY(M.h, M.tanks[i].x); }

  function match(rnd) {
    var M = { h: terrain(rnd), tanks: [{ x: 70 + Math.round(rnd() * 70) }, { x: W - 70 - Math.round(rnd() * 70) }], score: [0, 0], shots: [SHOTS, SHOTS],
      moves: [MOVES, MOVES], ammo: [{}, {}], turn: 0, wind: 0, n: 0, last: [{ angle: 45, power: 55 }, { angle: 45, power: 55 }] };
    for (var s = 0; s < 2; s++) ORDER.forEach(function (a) { M.ammo[s][a] = ARMS[a].n === Infinity ? -1 : ARMS[a].n; });
    M.wind = Math.round((rnd() * 2 - 1) * WIND);
    return M;
  }
  function left(M, who, arm) { return arm === 'shell' ? M.shots[who] : Math.min(M.shots[who], M.ammo[who][arm]); }

  function tankAt(M, x, y) {
    for (var i = 0; i < 2; i++) {
      var t = M.tanks[i], ty = tankY(M, i);
      if (Math.abs(x - t.x) <= TW / 2 && y <= ty + 2 && y >= ty - TH - 4) return i;
    }
    return -1;
  }

  // One projectile from (x, y) with velocity (vx, vy), over terrain h. Ends on the ground,
  // on a tank, or off the side or bottom; above the sky it comes back down.
  function fly(M, h, x, y, vx, vy, who) {
    var path = [[x, y]];
    for (var n = 0; n < MAX_STEPS; n++) {
      vx += M.wind * DT; vy += GRAV * DT;
      x += vx * DT; y += vy * DT;
      path.push([x, y]);
      if (x < -40 || x > W + 40 || y > H) return { path: path, end: { kind: 'out', x: x, y: y } };
      if (y < 0) continue;
      var ti = tankAt(M, x, y);
      if (ti >= 0 && (ti !== who || n > 10)) return { path: path, end: { kind: 'tank', who: ti, x: x, y: y } };
      if (x >= 0 && x <= W && y >= H - h[Math.round(x)]) return { path: path, end: { kind: 'ground', x: x, y: y } };
    }
    return { path: path, end: { kind: 'out', x: x, y: y } };
  }
  // A roller runs downhill from where it lands until the ground levels out, it meets a
  // tank, or it has run 220 units; then it goes off
  function roll(M, h, x, y, dir) {
    var path = [], d = dir || 1;
    var down = function (xx) { var i = Math.round(xx); return h[Math.max(0, Math.min(W, i - 1))] - h[Math.max(0, Math.min(W, i + 1))]; };
    // it starts the way the slope falls, or the way it was flying on flat ground
    var sl = down(x); if (Math.abs(sl) > 0.5) d = sl > 0 ? 1 : -1;
    for (var n = 0; n < 220; n++) {
      var nx = x + d;
      if (nx < 1 || nx > W - 1) break;
      if (h[Math.round(nx)] > h[Math.round(x)] + 1) break;
      x = nx; y = H - h[Math.round(x)];
      path.push([x, y]);
      if (tankAt(M, x, y - 3) >= 0) break;
    }
    return { path: path, x: x, y: y };
  }

  function hand(M, who) { var t = M.tanks[who], dir = who === 0 ? 1 : -1; return { x: t.x + dir * 6, y: tankY(M, who) - TH - 4 }; }

  // Everything a shot does, worked out on a copy of the ground: the paths to draw and the
  // blasts in order. Nothing in M changes.
  function simulate(M, who, arm, angle, power) {
    var h = M.h.slice(), dir = who === 0 ? 1 : -1, p = hand(M, who), v = power * SPEED, out = { paths: [], blasts: [] };
    var angles = arm === 'triple' ? [angle - 5, angle, angle + 5] : [angle];
    angles.forEach(function (ag) {
      var a = ag * Math.PI / 180, f = fly(M, h, p.x, p.y, Math.cos(a) * v * dir, -Math.sin(a) * v, who);
      out.paths.push(f.path);
      var e = f.end;
      if (e.kind === 'out') return;
      if (arm === 'roller' && e.kind === 'ground') {
        var rl = roll(M, h, e.x, e.y, Math.cos(a) * dir >= 0 ? 1 : -1);
        out.paths[out.paths.length - 1] = f.path.concat(rl.path);
        e = { kind: 'ground', x: rl.x, y: rl.y };
      }
      var b = { x: e.x, y: e.y, r: ARMS[arm].r, arm: arm, dmg: [0, 0] };
      if (arm === 'dirt') build(h, b.x, b.y, b.r);
      else { dig(h, b.x, b.y, b.r); b.dmg = hurt(M, b.x, b.y, b.r, ARMS[arm].dmg); }
      out.blasts.push(b);
    });
    out.h = h;
    return out;
  }
  // a crater: each column loses the part of it inside the circle, and what was above falls in
  function dig(h, cx, cy, r) {
    for (var x = Math.max(0, Math.floor(cx - r)); x <= Math.min(W, Math.ceil(cx + r)); x++) {
      var dy = Math.sqrt(Math.max(0, r * r - (x - cx) * (x - cx))), top = H - h[x];
      var cut = Math.max(0, Math.min(H, cy + dy) - Math.max(top, cy - dy));
      h[x] = Math.max(0, h[x] - Math.round(cut));
    }
  }
  // dirt: a round mound on the ground where it lands
  function build(h, cx, cy, r) {
    for (var x = Math.max(0, Math.floor(cx - r)); x <= Math.min(W, Math.ceil(cx + r)); x++) h[x] = Math.min(H - 60, h[x] + Math.round(Math.sqrt(Math.max(0, r * r - (x - cx) * (x - cx)))));
  }
  // damage falls off from the centre of the blast to its edge (plus half a tank)
  function hurt(M, x, y, r, most) {
    var d = [0, 0];
    for (var i = 0; i < 2; i++) {
      var t = M.tanks[i], dist = Math.hypot(x - t.x, y - (tankY(M, i) - TH / 2)), reach = r + TW / 2;
      if (dist < reach) d[i] = Math.round(most * (1 - dist / reach));
    }
    return d;
  }

  // Applies a simulated shot: the ground, the points (damage to the other tank scores for
  // the shooter; damage to yourself scores for the other), the arsenal, and the turn.
  function fire(M, who, arm, angle, power, sim, rnd) {
    if (M.shots[who] <= 0 || left(M, who, arm) <= 0) return null;
    sim = sim || simulate(M, who, arm, angle, power);
    M.h = sim.h;
    var got = [0, 0];
    sim.blasts.forEach(function (b) { got[1 - who] += b.dmg[1 - who]; M.score[who] += b.dmg[1 - who]; M.score[1 - who] += b.dmg[who]; });
    M.shots[who]--;
    if (arm !== 'shell') M.ammo[who][arm]--;
    M.last[who] = { angle: angle, power: power };
    M.n++;
    M.turn = 1 - who;
    M.wind = Math.round((rnd() * 2 - 1) * WIND);
    return { sim: sim, dealt: got[1 - who] };
  }
  function over(M) { return M.shots[0] <= 0 && M.shots[1] <= 0; }
  function winner(M) { return M.score[0] === M.score[1] ? -1 : (M.score[0] > M.score[1] ? 0 : 1); }

  // A step left or right, if the player has moves left; it can't pass the other tank or
  // climb a wall steeper than the tank itself is tall
  function move(M, who, d) {
    if (M.moves[who] <= 0) return false;
    var t = M.tanks[who], nx = Math.max(20, Math.min(W - 20, t.x + d * STEP));
    var other = M.tanks[1 - who].x;
    if (Math.abs(nx - other) < TW + 6 || (t.x - other) * (nx - other) < 0) return false;
    if (H - groundY(M.h, nx) - (H - groundY(M.h, t.x)) > 40) return false;
    if (nx === t.x) return false;
    t.x = nx;
    M.moves[who]--;
    return true;
  }

  /* The bot: a coarse then fine sweep of angle and power with the very shot it means to
     fire, scored by the damage it would do (and how close it lands when it would do
     none); then it misses by its level's spread. It picks the heavy shell and the
     roller while it has them and the triple when it is close, keeping dirt for a
     player sitting behind a hill. */
  var SPREAD = { easy: { a: 6, p: 8 }, medium: { a: 3.2, p: 4 }, hard: { a: 1.8, p: 2.2 } };
  function aim(M, who, arm) {
    var other = M.tanks[1 - who], tx = other.x, ty = tankY(M, 1 - who) - TH / 2, best = null;
    function look(a, p) {
      var s = simulate(M, who, arm, a, p), v = 0, near = 1e9;
      s.blasts.forEach(function (b) { v += b.dmg[1 - who] - 1.5 * b.dmg[who]; near = Math.min(near, Math.hypot(b.x - tx, b.y - ty)); });
      var score = v * 100 - near;
      if (!best || score > best.score) best = { angle: a, power: p, score: score, dmg: v };
    }
    var a, p;
    // about 200 shots an arm: a turn's thinking stays well under the bot's pause on a phone
    for (a = 15; a <= 81; a += 6) for (p = 22; p <= 100; p += 6) look(a, p);
    var a0 = best.angle, p0 = best.power;
    for (a = Math.max(5, a0 - 3); a <= Math.min(85, a0 + 3); a += 1) for (p = Math.max(5, p0 - 3); p <= Math.min(100, p0 + 3); p += 1) look(a, p);
    return best;
  }
  function gauss(rnd) { var u = 1 - rnd(), v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
  function botPlan(M, who, level, rnd) {
    var tries = ['heavy', 'roller', 'triple', 'shell'].filter(function (x) { return left(M, who, x) > 0; });
    var best = null;
    tries.forEach(function (arm) { var t = aim(M, who, arm); t.arm = arm; if (!best || t.dmg > best.dmg + 2) best = t; });
    var sp = SPREAD[level] || SPREAD.medium;
    return { arm: best.arm, angle: Math.max(5, Math.min(85, Math.round((best.angle + gauss(rnd) * sp.a) * 10) / 10)),
      power: Math.max(5, Math.min(100, Math.round((best.power + gauss(rnd) * sp.p) * 10) / 10)) };
  }

  function validMatch(M) {
    if (!M || !Array.isArray(M.h) || M.h.length !== W + 1 || !Array.isArray(M.tanks) || M.tanks.length !== 2) return false;
    if (!Array.isArray(M.score) || !Array.isArray(M.shots) || !Array.isArray(M.moves) || !Array.isArray(M.ammo) || !(M.turn === 0 || M.turn === 1)) return false;
    if (over(M) || M.shots.some(function (s) { return s < 0 || s > SHOTS; }) || Math.abs(M.wind) > WIND) return false;
    return M.h.every(function (v) { return typeof v === 'number' && v >= 0 && v <= H; }) && M.tanks.every(function (t) { return t.x >= 0 && t.x <= W; });
  }

  return { W: W, H: H, TW: TW, TH: TH, WIND: WIND, SHOTS: SHOTS, MOVES: MOVES, ARMS: ARMS, ORDER: ORDER, SPREAD: SPREAD, terrain: terrain, groundY: groundY,
    tankY: tankY, match: match, left: left, simulate: simulate, fire: fire, over: over, winner: winner, move: move, hand: hand, dig: dig, build: build, aim: aim, botPlan: botPlan, validMatch: validMatch };
}
if (typeof module !== 'undefined' && module.exports) module.exports = TanksEngineFactory;
/* ==== ENGINE END ==== */
</script>

  var params = new URLSearchParams(location.search);

  if (prefs.mode !== 'bot' && prefs.mode !== 'people') prefs.mode = 'bot';
  if (LEVELS.indexOf(prefs.level) < 0) prefs.level = 'medium';
  if (prefs.control !== 'nums') prefs.control = 'drag';

  // G: the game. phase: 'aim' (a person aims), 'busy' (a shot flies or the bot thinks),
  // 'done'. arm: the weapon picked for this turn.
  var G = null, timer = null, raf = 0, flight = null, blasts = [], floaters = [], aiming = null, msg = '', arm = 'shell';

  var box = el('div', { class: 'tk-box' }, [cv]);

  var players = el('div', { class: 'tk-players ch-above' });
  var status = el('div', { class: 'tk-status', role: 'status', 'aria-live': 'polite' });
  var arms = el('div', { class: 'tk-arms' });
  var pad = el('div', { class: 'tk-pad' });

  ctx.mount();

  /* ------------------------------------------------------------ setup */

  function rngFor(tag) { return G.daily ? C.daily('tanks', G.daily + '|' + tag).rng : Math.random; }

  function newGame(o) {
    stop();
    var daily = o.daily || null;
    G = { mode: daily ? 'bot' : o.mode, level: daily ? 'medium' : o.level, daily: daily, startedAt: Date.now(), done: false, phase: 'aim', best: 0 };
    G.M = E.match(rngFor('field'));
    if (!daily) { prefs.mode = o.mode; prefs.level = o.level; ctx.store.set('prefs', prefs); }
    flight = null; blasts = []; floaters = []; aiming = null; msg = ''; arm = 'shell';
    render();
    save();
    startTurn();
  }
  function current() { return { mode: G.mode, level: G.level }; }
  function fromPrefs() { return { mode: prefs.mode, level: prefs.level }; }

  function isBot(seat) { return G.mode === 'bot' && seat === 1; }
  function stop() { if (timer) { clearTimeout(timer); timer = null; } }
  function later(fn, ms) { stop(); timer = setTimeout(function () { timer = null; fn(); }, ms); }
  function pname(seat) {
    if (seat === 0) return G.mode === 'people' ? C.t('playerN', { n: C.num(1) }) : (C.state.profile.name || C.t('you'));
    return isBot(seat) ? C.t('bot') : C.t('playerN', { n: C.num(2) });
  }

  /* ------------------------------------------------------------- turns */

  function startTurn() {
    if (!G || G.done) return;
    var seat = G.M.turn;
    if (G.M.shots[seat] <= 0) { G.M.turn = 1 - seat; seat = G.M.turn; }
    if (E.left(G.M, seat, arm) <= 0) arm = 'shell';
    G.phase = isBot(seat) ? 'busy' : 'aim';
    render();
    if (isBot(seat)) later(botFire, C.ui.reduceMotion() ? 300 : 900);
  }

  function botFire() {
    if (!G || G.done || !isBot(G.M.turn)) return;
    var M = G.M, plan = E.botPlan(M, 1, G.level, rngFor('bot' + M.n));
    M.last[1] = { angle: plan.angle, power: plan.power };
    shoot(1, plan.arm, plan.angle, plan.power);
  }

  function shoot(who, a, angle, power) {
    var M = G.M;
    if (E.left(M, who, a) <= 0) return;
    G.phase = 'busy';
    msg = ''; aiming = null;
    var sim = E.simulate(M, who, a, angle, power);
    C.feedback('whoosh');
    flight = { who: who, arm: a, sim: sim, t0: performance.now(), angle: angle, power: power };
    renderStatus(); renderPlayers(); renderArms(); renderPad();
    if (C.ui.reduceMotion()) { landed(); return; }
    kick();
  }

  function landed() {
    var f = flight, M = G.M;
    flight = null;
    var r = E.fire(M, f.who, f.arm, f.angle, f.power, f.sim, rngFor('wind' + M.n));
    if (!r) return;
    var now = performance.now();
    f.sim.blasts.forEach(function (b, i) {
      blasts.push({ x: b.x, y: b.y, r: b.r, t0: now + i * 80, dirt: b.arm === 'dirt' });
      var d = b.dmg[1 - f.who], self = b.dmg[f.who];
      if (d) floaters.push({ x: b.x, y: b.y - b.r, text: '+' + C.num(d), t0: now, who: f.who });
      if (self) floaters.push({ x: M.tanks[f.who].x, y: E.tankY(M, f.who) - 30, text: '−' + C.num(self), t0: now, who: 1 - f.who, bad: true });
    });
    var self = f.sim.blasts.reduce(function (s, b) { return s + b.dmg[f.who]; }, 0);
    if (f.arm === 'dirt') msg = C.t('mound');
    else if (r.dealt) msg = C.t('hitN', { n: C.num(r.dealt) });
    else if (self) msg = C.t('selfHit');
    else msg = C.t('missed');
    if (f.who === 0 || G.mode === 'people') G.best = Math.max(G.best, r.dealt);
    if (f.sim.blasts.length) C.feedback(r.dealt >= 30 ? 'boom' : 'thud'); else C.feedback('tap');
    if (r.dealt) C.haptic('tap');
    kick();
    if (E.over(M)) {
      G.done = true; G.phase = 'done';
      render();
      later(finish, C.ui.reduceMotion() ? 300 : 1800);
      return;
    }
    save();
    render();
    later(startTurn, C.ui.reduceMotion() ? 200 : 900);
  }

  /* ------------------------------------------------------------ result */

  function finish() {
    stop();
    var M = G.M, w = E.winner(M), won = G.mode === 'people' ? null : w === 0;
    var coins = 6, points = 15;
    if (G.mode === 'bot') {
      var base = { easy: 6, medium: 12, hard: 20 }[G.level];
      coins = won ? base : Math.max(2, Math.round(base * 0.3));
      points = won ? base * 4 : Math.round(base * 1.2);
      if (won) {
        C.achievements.unlock('tnk-win');
        if (G.level === 'hard') C.achievements.unlock('tnk-hard');
      }
    }
    if (G.best >= 40) C.achievements.unlock('tnk-big');
    var label = C.num(M.score[0]) + '–' + C.num(M.score[1]);
    if (G.daily) {
      var first = C.stats.daily('tanks', G.daily, { label: label, win: won });
      if (!first) { coins = Math.round(coins * 0.2); points = Math.round(points * 0.2); }
    }
    ctx.clearSave();
    ctx.finish({
      won: won,
      title: w < 0 ? C.t('draw') : (G.mode === 'people' ? C.t('playerWon', { n: pname(w) }) : (won ? C.t('won') : C.t('lost'))),
      timeMs: Date.now() - G.startedAt, coins: coins, points: points,
      lines: [{ label: C.t('points'), value: label }, { label: C.t('best'), value: C.num(G.best) }],
      shareText: 'چوگان · تانک‌ها' + (G.daily ? ('\nروزانه ' + G.daily) : '') + '\n' + label,
      paint: cardPaint(),
      onAgain: G.daily ? null : function () { newGame(current()); }
    });
  }

  /* ------------------------------------------------------------- saves */

  ctx.autosave(function () {
    if (!G || G.done || !G.M.n) return { inProgress: false };
    return { g: { mode: G.mode, level: G.level, daily: G.daily, M: G.M, best: G.best, elapsed: Date.now() - G.startedAt } };
  });
  function save() { ctx.save(); }
  function validSave(sv) { var g = sv && sv.g; return !!(g && (g.mode === 'bot' || g.mode === 'people') && LEVELS.indexOf(g.level) >= 0 && E.validMatch(g.M)); }
  function restore(g) {
    G = { mode: g.mode, level: g.level, daily: g.daily || null, M: g.M, best: g.best || 0, startedAt: Date.now() - (g.elapsed || 0), done: false, phase: 'aim' };
    render();
    startTurn();
  }

      if (o.mode === 'bot') body.appendChild(C.ui.segmented(LEVELS.map(function (l) { return { value: l, label: C.t(l) }; }), o.level, function (v) { o.level = v; }));
      if (G && !G.done && G.M.n) body.appendChild(el('p', { class: 'ch-xs ch-dim', text: C.t('resetWarn') }));
    }
    rows();
    C.ui.modal({
      title: C.t('newMatch'), closeButton: true, body: [body],
      actions: [{ label: C.t('cancel') }, { label: C.t('start'), kind: 'primary', onClick: function () { newGame(o); } }]
    });

  function css(name, fb) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fb; }
  function dark() {
    var t = document.documentElement.getAttribute('data-theme');

      : { sky0: '#9FD3EE', sky1: '#F2F8EC', earth0: '#7FA458', earth1: '#8B6A44', grass: '#5E8C3A', t: ['#2F6FD0', '#C8473A'], text: '#1F1A17', halo: 'rgba(255,255,255,.85)', star: null };
  }

  function drawTank(g, M, i, P, angleDeg) {
    var t = M.tanks[i], y = E.tankY(M, i), dir = i === 0 ? 1 : -1, a = (angleDeg == null ? 45 : angleDeg) * Math.PI / 180;
    g.strokeStyle = P.t[i]; g.lineWidth = 4; g.lineCap = 'round';
    g.beginPath(); g.moveTo(t.x, y - E.TH + 2); g.lineTo(t.x + Math.cos(a) * 16 * dir, y - E.TH + 2 - Math.sin(a) * 16); g.stroke();
    g.fillStyle = P.t[i];
    C.rrect(g, t.x - E.TW / 2, y - E.TH + 2, E.TW, E.TH - 4, 4); g.fill();
    g.beginPath(); g.arc(t.x, y - E.TH + 2, 7, Math.PI, 0); g.fill();
    g.fillStyle = 'rgba(0,0,0,.45)';
    C.rrect(g, t.x - E.TW / 2 - 1, y - 4, E.TW + 2, 5, 2.5); g.fill();
  }

  function paint(g, w, h, now, card) {
    var M = G.M, P = palette(), k = w / E.W;
    var sky = g.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, P.sky0); sky.addColorStop(1, P.sky1);
    g.fillStyle = sky; g.fillRect(0, 0, w, h);
    g.save(); g.scale(k, k);
    if (P.star) { g.fillStyle = P.star; for (var s = 0; s < 30; s++) g.fillRect((s * 97) % E.W, (s * 53) % 160, 1.5, 1.5); }
    // the ground: the terrain heights, with a band of grass on top
    // the ground changes when a shot lands, not while it flies
    var hh = M.h;
    var earth = g.createLinearGradient(0, E.H - 360, 0, E.H);
    earth.addColorStop(0, P.earth0); earth.addColorStop(1, P.earth1);
    g.fillStyle = earth;
    g.beginPath(); g.moveTo(0, E.H);
    for (var x = 0; x <= E.W; x += 2) g.lineTo(x, E.H - hh[x]);
    g.lineTo(E.W, E.H); g.closePath(); g.fill();
    g.strokeStyle = P.grass; g.lineWidth = 3;
    g.beginPath(); for (x = 0; x <= E.W; x += 2) { if (x === 0) g.moveTo(x, E.H - hh[x]); else g.lineTo(x, E.H - hh[x]); } g.stroke();
    // the tanks, each turret at its last aim (the aim being set now, for the one aiming)
    var aim = aimNow();
    for (var i = 0; i < 2; i++) drawTank(g, M, i, P, aim && M.turn === i ? aim.angle : M.last[i].angle);
    if (aim && !card) {
      var hp = E.hand(M, M.turn), dir = M.turn === 0 ? 1 : -1, a = aim.angle * Math.PI / 180, len = 20 + aim.power * 0.8;
      var tx = hp.x + Math.cos(a) * len * dir, ty = hp.y - Math.sin(a) * len;
      g.strokeStyle = css('--game', '#4A5D23'); g.fillStyle = g.strokeStyle; g.lineWidth = 3; g.lineCap = 'round';
      g.beginPath(); g.moveTo(hp.x, hp.y); g.lineTo(tx, ty); g.stroke();
      g.beginPath(); g.arc(tx, ty, 4, 0, Math.PI * 2); g.fill();
      var label = Math.round(aim.angle) + '° · ' + Math.round(aim.power);
      g.font = font(14); g.textAlign = dir > 0 ? 'left' : 'right'; g.textBaseline = 'bottom';
      g.lineWidth = 4; g.strokeStyle = P.halo; g.strokeText(label, tx + dir * 6, ty - 4);
      g.fillStyle = P.text; g.fillText(label, tx + dir * 6, ty - 4);
    }
    // shots in flight, each with a short trail
    if (flight && !card) {
      var n = Math.floor((now - flight.t0) / 1000 * 60), done = true;
      flight.sim.paths.forEach(function (path) {
        var m = Math.min(path.length - 1, n);
        if (m < path.length - 1) done = false;
        g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 2;
        g.beginPath(); for (var q = Math.max(0, m - 10); q <= m; q++) { if (q === Math.max(0, m - 10)) g.moveTo(path[q][0], path[q][1]); else g.lineTo(path[q][0], path[q][1]); } g.stroke();
        g.fillStyle = '#2B2B2B'; g.beginPath(); g.arc(path[m][0], path[m][1], 3.5, 0, Math.PI * 2); g.fill();
      });
      flight.done = done;
    }
    // blasts: rings that grow and fade; dirt is a brown puff
    blasts = blasts.filter(function (b) { return now - b.t0 < 700; });
    blasts.forEach(function (b) {
      var t = (now - b.t0) / 600; if (t < 0 || t > 1) return;
      g.fillStyle = b.dirt ? 'rgba(139,106,68,' + (1 - t) + ')' : 'rgba(255,196,64,' + (1 - t) + ')';
      g.beginPath(); g.arc(b.x, b.y, b.r * (0.4 + 0.8 * t), 0, Math.PI * 2); g.fill();
      if (!b.dirt) { g.fillStyle = 'rgba(232,90,40,' + (1 - t) * 0.9 + ')'; g.beginPath(); g.arc(b.x, b.y, b.r * (0.2 + 0.5 * t), 0, Math.PI * 2); g.fill(); }
    });
    // points float up from where they were scored
    floaters = floaters.filter(function (f) { return now - f.t0 < 1400; });
    floaters.forEach(function (f) {
      var t = (now - f.t0) / 1400;
      g.globalAlpha = 1 - t; g.font = font(16); g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = 4; g.strokeStyle = P.halo; g.strokeText(f.text, f.x, f.y - 30 * t);
      g.fillStyle = f.bad ? '#C8302A' : P.t[f.who]; g.fillText(f.text, f.x, f.y - 30 * t);
      g.globalAlpha = 1;
    });
    // the wind at the bottom
    var wv = M.wind;
    g.fillStyle = 'rgba(255,255,255,.85)'; C.rrect(g, E.W / 2 - 70, E.H - 28, 140, 20, 10); g.fill();
    g.fillStyle = '#1F1A17'; g.strokeStyle = '#1F1A17'; g.lineWidth = 3; g.font = font(11); g.textAlign = 'center'; g.textBaseline = 'middle';
    if (!wv) g.fillText(C.t('calm'), E.W / 2, E.H - 18);
    else {
      var L = 8 + Math.abs(wv) / E.WIND * 50, sx = E.W / 2 - Math.sign(wv) * L / 2, ex = E.W / 2 + Math.sign(wv) * L / 2;
      g.beginPath(); g.moveTo(sx, E.H - 18); g.lineTo(ex, E.H - 18); g.stroke();
      g.beginPath(); g.moveTo(ex, E.H - 18); g.lineTo(ex - Math.sign(wv) * 7, E.H - 24); g.lineTo(ex - Math.sign(wv) * 7, E.H - 12); g.closePath(); g.fill();
    }
    g.restore();
  }

  function size() {
    var r = box.getBoundingClientRect(), w = Math.floor(Math.min(r.width, r.height * E.W / E.H));
    w = Math.max(160, w || 0);
    return { w: w, h: Math.round(w * E.H / E.W) };
  }
  function draw() {
    if (!G) return;
    var S = size(), dpr = Math.min(2, window.devicePixelRatio || 1), now = performance.now();
    // both sides: a new canvas is 300×150 (#359)
    if (cv.width !== Math.round(S.w * dpr) || cv.height !== Math.round(S.h * dpr)) { cv.width = Math.round(S.w * dpr); cv.height = Math.round(S.h * dpr); }
    cv.style.width = S.w + 'px'; cv.style.height = S.h + 'px';
    var g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    paint(g, S.w, S.h, now);
    if (flight && flight.done) landed();
  }
  function loop() {
    raf = 0;
    draw();
    var moving = flight || aiming || blasts.length || floaters.length;
    if (moving && !document.hidden) raf = requestAnimationFrame(loop);
  }
  function kick() { if (!raf) raf = requestAnimationFrame(loop); }

  function cardPaint() {
    return function (g, W, H) {
      var w = Math.min(W, H * E.W / E.H), h = w * E.H / E.W;
      g.save(); g.translate((W - w) / 2, (H - h) / 2);
      paint(g, w, h, performance.now(), true);
      g.restore();
    };
  }

  /* ----------------------------------------------------------------- ui */

  function aimNow() {
    if (!G || G.phase !== 'aim' || isBot(G.M.turn)) return null;
    if (prefs.control === 'drag') return aiming && aiming.aim ? aiming.aim : null;
    return G.M.last[G.M.turn];
  }
  function renderTop() {
    top.innerHTML = '';
    if (G.daily) top.appendChild(el('span', { class: 'ch-badge ch-badge--accent' }, [C.icon('calendar', 14), el('span', { text: C.t('dailyTk') + ' — ' + C.num(G.daily) })]));
    else top.appendChild(el('button', { class: 'ch-badge ch-tap', type: 'button', onclick: askNew, text: G.mode === 'bot' ? C.t('vsBot') + ' · ' + C.t(G.level) : C.t('people') }));
    var gear = el('button', { class: 'ch-iconbtn tk-gear', type: 'button', 'aria-label': C.t('settings'), title: C.t('settings') }, [C.icon('gear', 20)]);
    gear.addEventListener('click', showSettings);
    top.appendChild(gear);
  }
  function renderPlayers() {
    players.innerHTML = '';
    var P = palette();
    for (var s = 0; s < 2; s++) {
      players.appendChild(el('div', { class: 'tk-player' + (G.M.turn === s && !G.done ? ' tk-player--on' : '') }, [
        el('i', { class: 'tk-player__dot', style: { background: P.t[s] } }),
        el('span', { class: 'tk-player__name', text: pname(s) }),
        el('span', { class: 'tk-player__shots', text: C.t('shotsLeft', { n: C.num(G.M.shots[s]) }) }),
        el('span', { class: 'tk-player__score', text: C.num(G.M.score[s]) })
      ]));
    }
  }
  function renderStatus() {
    var seat = G.M.turn, who = isBot(seat) ? C.t('botThinks', { n: pname(seat) }) : (G.mode === 'people' ? C.t('turnOf', { n: pname(seat) }) : C.t('yourTurn'));
    var how = G.phase === 'aim' ? ' — ' + C.t(prefs.control === 'nums' ? 'aimNums' : 'aimDrag') : '';
    status.textContent = flight ? '…' : (msg && (G.phase !== 'aim' || G.done) ? msg : who + how);
  }
  // the weapons with what is left of each, and the two step buttons with the moves left
  function renderArms() {
    arms.innerHTML = '';
    if (!G || G.done || isBot(G.M.turn) || G.phase !== 'aim') return;
    var seat = G.M.turn;
    E.ORDER.forEach(function (a) {
      var n = E.left(G.M, seat, a), b = el('button', { class: 'tk-arm' + (a === arm ? ' tk-arm--on' : ''), type: 'button' },
        [el('span', { text: C.t(a) }), a === 'shell' ? null : el('b', { text: C.num(n) })].filter(Boolean));
      if (n <= 0) b.disabled = true;
      b.addEventListener('click', function () { arm = a; renderArms(); });
      arms.appendChild(b);
    });
    var mv = G.M.moves[seat];
    var stepBtn = function (d, label, icon) {
      var b = el('button', { class: 'tk-arm', type: 'button', 'aria-label': C.t(label), title: C.t(label), text: icon });
      if (mv <= 0) b.disabled = true;
      b.addEventListener('click', function () { stepTank(d); });
      return b;
    };
    arms.appendChild(el('span', { class: 'tk-dial__lbl', text: C.t('movesLeft', { n: C.num(mv) }) }));
    // The field is drawn left to right in every language, so in Persian the row's RTL
    // order put ◀ (step left) on the right (#510); the pair keeps its own direction.
    arms.appendChild(el('span', { class: 'tk-steps', dir: 'ltr' }, [stepBtn(-1, 'moveL', '◀'), stepBtn(1, 'moveR', '▶')]));
  }
  function stepTank(d) {
    if (!canAim()) return;
    if (!E.move(G.M, G.M.turn, d)) { C.feedback('bad'); msg = C.t('noMove'); renderStatus(); return; }
    C.feedback('tap');
    save(); render();
  }
  function dial(key, min, max) {
    var val = el('span', { class: 'tk-dial__val' });
    function show() { var v = G.M.last[G.M.turn][key]; val.textContent = C.num(Math.round(v)) + (key === 'angle' ? '°' : ''); }
    function step(d) { var L = G.M.last[G.M.turn]; L[key] = Math.max(min, Math.min(max, Math.round(L[key]) + d)); show(); draw(); }
    function btn(d, label) {
      var b = el('button', { class: 'ch-iconbtn', type: 'button', 'aria-label': C.t(key) + ' ' + label, text: label });
      var rep = null, t0 = null, end = function () { clearTimeout(t0); clearInterval(rep); t0 = rep = null; };
      b.addEventListener('pointerdown', function (e) {
        if (!canAim()) return;
        e.preventDefault(); step(d);
        t0 = setTimeout(function () { rep = setInterval(function () { step(d); }, 70); }, 380);
      });
      b.addEventListener('pointerup', end); b.addEventListener('pointerleave', end); b.addEventListener('pointercancel', end);
      return b;
    }
    show();
    return el('div', { class: 'tk-dial' }, [el('span', { class: 'tk-dial__lbl', text: C.t(key) }), btn(-1, '−'), val, btn(1, '+')]);
  }
  function renderPad() {
    pad.innerHTML = '';
    if (!G || prefs.control !== 'nums' || G.done || isBot(G.M.turn) || G.phase !== 'aim') return;
    pad.appendChild(dial('angle', 0, 90));
    pad.appendChild(dial('power', 1, 100));
    var go = el('button', { class: 'ch-btn ch-btn--primary', type: 'button', text: C.t('fireIt') });
    go.addEventListener('click', function () { if (canAim()) { var L = G.M.last[G.M.turn]; shoot(G.M.turn, arm, L.angle, L.power); } });
    pad.appendChild(go);
  }
  function render() {
    if (!G) return;
    renderTop(); renderPlayers(); renderStatus(); renderArms(); renderPad();
    draw(); kick();
  }

  /* -------------------------------------------------------------- input */

  function canAim() { return G && !G.done && G.phase === 'aim' && !isBot(G.M.turn) && !document.querySelector('.ch-scrim'); }
  // A slingshot, as in Gorillas: the pull sets the shot, the other way; a full pull is
  // 40% of the field's width
  function pullAim(dx, dy) {
    var dir = G.M.turn === 0 ? 1 : -1, tx = -dx * dir, ty = dy, len = Math.hypot(dx, dy), full = size().w * 0.4;
    var angle = Math.atan2(ty, tx) * 180 / Math.PI;
    if (tx < 0) angle = ty >= 0 ? 90 : 0;
    return { angle: Math.round(Math.max(0, Math.min(90, angle))), power: Math.max(0, Math.min(100, Math.round(len / full * 100))) };
  }
  cv.addEventListener('pointerdown', function (e) {
    if (!canAim() || prefs.control !== 'drag') return;
    e.preventDefault();
    aiming = { id: e.pointerId, x: e.clientX, y: e.clientY, aim: null };
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* old browsers */ }
    kick();
  });
  cv.addEventListener('pointermove', function (e) { if (aiming && e.pointerId === aiming.id) aiming.aim = pullAim(e.clientX - aiming.x, e.clientY - aiming.y); });
  cv.addEventListener('pointerup', function (e) {
    if (!aiming || e.pointerId !== aiming.id) return;
    var a = aiming.aim;
    aiming = null;
    // a short pull is taken back, not fired
    if (!a || a.power < 6 || !canAim()) { draw(); return; }
    G.M.last[G.M.turn] = a;
    shoot(G.M.turn, arm, a.angle, a.power);
  });
  cv.addEventListener('pointercancel', function () { aiming = null; draw(); });

  // Keys: ↑ ↓ angle, ← → power (towards the other tank is more), Tab the next weapon,
  // , and . move the tank, Space or Enter fires
  window.addEventListener('keydown', function (e) {
    if (!canAim()) return;
    var tg = e.target, tag = tg && tg.tagName;
    if (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
    var L = G.M.last[G.M.turn], step = e.shiftKey ? 5 : 1, dir = G.M.turn === 0 ? 1 : -1, k = e.key;
    if (k === 'ArrowUp' || k === 'ArrowDown') L.angle = Math.max(0, Math.min(90, Math.round(L.angle) + (k === 'ArrowUp' ? step : -step)));
    else if (k === 'ArrowLeft' || k === 'ArrowRight') L.power = Math.max(1, Math.min(100, Math.round(L.power) + (k === 'ArrowRight' ? step : -step) * dir));
    else if (k === 'Tab') { e.preventDefault(); var i = E.ORDER.indexOf(arm); for (var t = 1; t <= E.ORDER.length; t++) { var nx = E.ORDER[(i + t) % E.ORDER.length]; if (E.left(G.M, G.M.turn, nx) > 0) { arm = nx; break; } } renderArms(); return; }
    else if (k === ',' || k === '.') { e.preventDefault(); stepTank(k === ',' ? -1 : 1); return; }
    else if (k === ' ' || k === 'Enter') { e.preventDefault(); shoot(G.M.turn, arm, L.angle, L.power); return; }
    else return;
    e.preventDefault();
    if (prefs.control === 'drag') aiming = { id: -1, aim: { angle: L.angle, power: L.power } };
    renderPad(); draw();
  });

  if (window.ResizeObserver) new ResizeObserver(function () { if (G) draw(); }).observe(box);
  else window.addEventListener('resize', function () { if (G) draw(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && G) kick(); });
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { draw(); }); } catch (er) { /* old WebViews */ } }
  // A pause mid-flight lets that shot land when the game comes back
  C.onPause(function () { stop(); aiming = null; });
  C.onResume(function () {
    if (!G || G.done) return;
    if (flight) { landed(); return; }
    startTurn();
  });

  /* --------------------------------------------------------------- help */

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [kb('↑ ↓ / Shift', C.t('kAngle')), kb('← → / Shift', C.t('kPower')), kb('Tab', C.t('kArm')), kb(', .', C.t('kMove')), kb('Space / Enter', C.t('kFire'))])
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  function tArt(kind) {
    var tank = function (x, y, c, d) { return '<g transform="translate(' + x + ' ' + y + ')"><path d="M0 -10 l' + (12 * d) + ' -9" stroke="' + c + '" stroke-width="3.5" stroke-linecap="round"/><rect x="-12" y="-10" width="24" height="8" rx="3" fill="' + c + '"/><path d="M-7 -10a7 7 0 0 1 14 0z" fill="' + c + '"/></g>'; };
    var s = '<svg viewBox="0 0 220 110" width="100%" direction="ltr"><rect width="220" height="110" rx="10" fill="#9FD3EE"/>' +
      '<path d="M0 110 L0 80 Q 40 60 70 74 T 140 66 T 220 82 L220 110 Z" fill="#7FA458"/>' + tank(36, 70, '#2F6FD0', 1) + tank(186, 78, '#C8473A', -1);
    if (kind === 1) s += '<path d="M48 52 Q 112 -4 180 64" fill="none" stroke="#2B2B2B" stroke-width="2" stroke-dasharray="4 4"/><circle cx="186" cy="70" r="14" fill="rgba(255,196,64,.7)"/>';
    if (kind === 2) s += '<path d="M48 54 L76 30" stroke="#4A5D23" stroke-width="3.5" stroke-linecap="round"/><text x="80" y="32" font-size="12" font-weight="800" fill="#1F1A17">45° · 60</text>';
    if (kind === 3) s += '<rect x="56" y="8" width="108" height="20" rx="10" fill="#fff"/><text x="110" y="22" font-size="11" font-weight="700" text-anchor="middle" fill="#1F1A17">◀  ●  ●  ●  ▶</text>';
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: tArt(1) },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: tArt(2) },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: tArt(3) }
  ];

  /* -------------------------------------------------------------- start */

  var saved = ctx.loadSave();
  if (dailyDate) {
    // the daily match has its own save slot, so a half-played day goes on
    if (validSave(saved) && saved.g.daily === dailyDate) restore(saved.g);
    else newGame({ daily: dailyDate });
    if (C.stats.dailyDone('tanks', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).tanks;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
    }
  } else if (validSave(saved) && !saved.g.daily) {
    restore(saved.g);
  } else {
    newGame(fromPrefs());
  }
  ctx.tutorialIfNew(TUT);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (G) draw(); });
})();
</script>
</body>
</html>
