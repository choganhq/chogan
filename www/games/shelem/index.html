<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FBF6EF">
<title>شلم — چوگان</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../lib/chogan.css">
<style>
  :root { --sh-gold: #D4A72C; --ch-pface: var(--c-surface); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ch-pface: var(--c-surface-3); } }
  :root[data-theme="dark"] { --ch-pface: var(--c-surface-3); }
  /* the table and its cards grow with the game area (#359), as in Hokm */
  .sh-wrap { --cw: clamp(40px, min(12.8cqw, (100cqh - 360px) / 6), 104px); margin-block: auto; width: 100%; max-width: max(560px, calc(var(--cw) * 9.33)); display: flex; flex-direction: column; align-items: center; gap: var(--s-2); }
  .sh-top { display: flex; flex-wrap: wrap; gap: var(--s-2); justify-content: center; align-items: center; }
  /* scoreboard: us · the contract · them */
  .sh-score { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; gap: var(--s-2); align-items: stretch; }
  .sh-team { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 8px;
    background: var(--c-surface); border-radius: var(--r-md); box-shadow: var(--sh-1); font-size: var(--fs-xs, 12px); color: var(--c-text-dim); font-weight: 700; font-variant-numeric: tabular-nums; }
  .sh-team b { font-size: var(--fs-sm); color: var(--c-text); }
  .sh-team--us { box-shadow: var(--sh-1), inset 0 -3px 0 var(--game); }
  .sh-deal { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 72px; padding: 4px 10px;
    border-radius: var(--r-md); background: var(--ch-pface); border: 2px solid var(--sh-gold); color: var(--c-text); }
  .sh-deal--red .sh-deal__s { color: var(--c-bad); }
  .sh-deal__s { font-size: 24px; line-height: 1.1; }
  .sh-deal__v { font-size: var(--fs-sm); font-weight: 800; font-variant-numeric: tabular-nums; }
  .sh-deal__l { font-size: var(--fs-xs, 12px); color: var(--c-text-dim); font-weight: 700; }
  /* partner on top, opponents at the sides; seats are physical places, never mirrored */
  .sh-table { direction: ltr; width: 100%; display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto;
    grid-template-areas: "top top top" "left trick right"; gap: var(--s-2); align-items: center;
    background: var(--c-surface-2); border-radius: var(--r-lg); padding: 10px; box-shadow: inset 0 0 0 1px var(--c-line); }
  .sh-seat { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 52px; }
  .sh-seat--top { grid-area: top; }
  .sh-seat--left { grid-area: left; }
  .sh-seat--right { grid-area: right; }
  .sh-seat__name { display: flex; align-items: center; gap: 4px; font-weight: 800; font-size: var(--fs-sm); padding: 2px 8px; border-radius: 99px; color: var(--c-text-dim); }
  .sh-seat--partner .sh-seat__name { color: var(--game-text, var(--game)); }
  .sh-seat--on .sh-seat__name { background: var(--game); color: var(--game-ink, #fff); }
  .sh-crown { color: var(--sh-gold); display: inline-flex; }
  .sh-say { font-size: var(--fs-xs, 12px); font-weight: 800; padding: 1px 8px; border-radius: 99px; background: var(--c-surface); box-shadow: var(--sh-1); color: var(--c-text); font-variant-numeric: tabular-nums; }
  .sh-say--pass { color: var(--c-text-dim); }
  .sh-fan { display: flex; }
  .sh-fan .ch-pback { width: 16px; border-width: 1px; border-radius: 3px; }
  .sh-fan .ch-pback + .ch-pback { margin-left: -10px; }
  .sh-seat--left .sh-fan, .sh-seat--right .sh-fan { flex-direction: column; }
  .sh-seat--left .sh-fan .ch-pback + .sh-fan .ch-pback, .sh-seat--left .sh-fan .ch-pback + .ch-pback, .sh-seat--right .sh-fan .ch-pback + .ch-pback { margin-left: 0; margin-top: -18px; }
  .sh-trick { grid-area: trick; position: relative; height: calc(var(--cw) * 1.4 * 2.3); min-width: calc(var(--cw) * 2.6); }
  .sh-widow { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .sh-widow .ch-pback { width: calc(var(--cw) * .8); margin-inline: calc(var(--cw) * -.22); }
  .sh-tcard { --pw: var(--cw); position: absolute; }
  .sh-tcard--b { left: 50%; bottom: 0; transform: translateX(-50%); }
  .sh-tcard--t { left: 50%; top: 0; transform: translateX(-50%); }
  .sh-tcard--l { left: 0; top: 50%; transform: translateY(-50%); }
  .sh-tcard--r { right: 0; top: 50%; transform: translateY(-50%); }
  .sh-tcard--win { box-shadow: 0 0 0 3px var(--sh-gold), var(--sh-2); z-index: 2; }
  .sh-tcard[disabled] { opacity: 1; cursor: default; }
  /* rows of up to eight, no overlap: a tap must land on the card it is on (as in Hokm) */
  .sh-hand { direction: ltr; width: 100%; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding-top: 12px;
    min-height: calc((var(--pw, 56px) * 1.4) * 2 + 18px); align-content: flex-start; }
  .sh-card--ok { transform: translateY(-10px); }
  .sh-card--no { filter: brightness(.82) saturate(.6); }
  .sh-card--cur { outline: 2px dashed var(--game); outline-offset: 2px; }
  .sh-card--sel { transform: translateY(-14px); box-shadow: 0 0 0 3px var(--game), var(--sh-2); }
  .sh-status { min-height: 1.6em; font-weight: 700; color: var(--c-text-dim); text-align: center; }
  /* the bid, the cards to put back and trump are asked on the page, not in a modal:
     a modal's backdrop hides the hand it asks about (Hokm #186) */
  .sh-ask { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: var(--s-2); }
  .sh-ask[hidden] { display: none; }
  .sh-ask__sub { margin: 0; text-align: center; color: var(--c-text-dim); font-size: var(--fs-sm); }
  .sh-bidrow { direction: ltr; display: flex; align-items: center; justify-content: center; gap: var(--s-2); }
  .sh-bidval { min-width: 64px; text-align: center; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .sh-btns { display: flex; gap: var(--s-2); justify-content: center; flex-wrap: wrap; }
  .sh-suits { direction: ltr; width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s-2); }
  .sh-suit { min-height: 56px; border: 2px solid var(--c-line); border-radius: var(--r-md); background: var(--ch-pface); color: var(--c-text); font-size: 34px; cursor: pointer; }
  .sh-suit--red { color: var(--c-bad); }
  .sh-res { display: flex; justify-content: center; gap: var(--s-4); margin: var(--s-2) 0; font-weight: 800; font-size: var(--fs-lg); font-variant-numeric: tabular-nums; }
  .sh-res--sum { font-size: var(--fs-sm); font-weight: 700; color: var(--c-text-dim); gap: var(--s-3); }
</style>
</head>
<body>
<script src="../../version.js"></script>
<script src="../../lib/chogan.js"></script>

<script>
/* ==== ENGINE START ==== */
/* Shelem, the Iranian partnership trick-taking game with bidding (#418). Seats as in
   Hokm: 0 you (bottom), 1 right, 2 your partner (top), 3 left; play passes 0 → 1 → 2 → 3.
   A card is rank << 2 | suit like the shared deck: rank 0 ace … 12 king. Aces are high.
   The owner's rules (2026-10-23): 12 cards each and a widow of four; bids from 100 to
   165 in fives, a pass is final; the declarer takes the widow, puts four back (they are
   the declarer's first trick) and names trump. Aces and tens are worth 10, fives 5,
   and every trick 5: 165 in a hand. */
function ShelemEngineFactory() {
  'use strict';
  var MIN_BID = 100, MAX_BID = 165, STEP = 5, TRICK = 5, SHELEM = 330, TOTAL = 165;

  function rank(c) { return c >> 2; }
  function suit(c) { return c & 3; }
  // ace high: 2 is 0 … king 11, ace 12
  function power(c) { return (rank(c) + 12) % 13; }
  function team(p) { return p & 1; }
  // aces and tens 10, fives 5
  function cardPoints(c) { var r = rank(c); return r === 0 || r === 9 ? 10 : r === 4 ? 5 : 0; }
  function sumPoints(cs) { var s = 0; for (var i = 0; i < cs.length; i++) s += cardPoints(cs[i]); return s; }

  function shuffled(rnd) {
    var d = [];
    for (var i = 0; i < 52; i++) d.push(i);
    for (var k = 51; k > 0; k--) { var j = Math.floor(rnd() * (k + 1)); var t = d[k]; d[k] = d[j]; d[j] = t; }
    return d;
  }

  // clubs, diamonds, spades, hearts: black and red alternate
  var SUIT_ORDER = [0, 1, 3, 2];
  function sortHand(h) {
    h.sort(function (a, b) { return SUIT_ORDER[suit(a)] - SUIT_ORDER[suit(b)] || power(b) - power(a); });
    return h;
  }

  function newMatch(rnd, target, dealer) {
    var S = { target: target === 1165 ? 1165 : 505, score: [0, 0], dealer: dealer >= 0 ? dealer % 4 : Math.floor(rnd() * 4), handNo: 0, done: false, winner: -1 };
    newHand(S, rnd);
    return S;
  }

  // Twelve cards each in batches of four, starting left of the dealer; four left over
  // are the widow. A redeal after four passes keeps the hand's number.
  function newHand(S, rnd, redeal) {
    var d = shuffled(rnd);
    S.hands = [[], [], [], []];
    for (var b = 0; b < 3; b++) for (var j = 1; j <= 4; j++) { var p = (S.dealer + j) % 4; for (var n = 0; n < 4; n++) S.hands[p].push(d.pop()); }
    S.hands.forEach(sortHand);
    S.widow = d;
    S.bids = [0, 0, 0, 0];
    S.high = 0;
    S.declarer = -1;
    S.turn = (S.dealer + 1) % 4;
    S.phase = 'bid';
    S.trump = -1;
    S.trick = [];
    S.lastTrick = null;
    S.taken = [0, 0];
    S.tricks = [0, 0];
    S.played = [];
    S.buried = [];
    if (!redeal) S.handNo++;
    S.lastHand = null;
    return S;
  }

  function minBid(S) { return Math.max(MIN_BID, S.high + STEP); }
  function canBid(S, p, v) {
    return S.phase === 'bid' && S.turn === p && S.bids[p] !== -1 && v % STEP === 0 && v >= minBid(S) && v <= MAX_BID;
  }
  function bid(S, p, v) {
    if (!canBid(S, p, v)) return false;
    S.bids[p] = v; S.high = v; S.declarer = p;
    advance(S);
    return true;
  }
  function pass(S, p) {
    if (S.phase !== 'bid' || S.turn !== p || S.bids[p] === -1) return false;
    S.bids[p] = -1;
    advance(S);
    return true;
  }
  // The auction ends when one bidder is left, or on the top bid of 165. When all four
  // pass, the next dealer deals again.
  function advance(S) {
    var live = [0, 1, 2, 3].filter(function (q) { return S.bids[q] !== -1; });
    if (!live.length) { S.dealer = (S.dealer + 1) % 4; S.phase = 'redeal'; return; }
    if (S.high === MAX_BID || (live.length === 1 && S.high > 0 && live[0] === S.declarer)) { takeWidow(S); return; }
    var p = S.turn;
    do { p = (p + 1) % 4; } while (S.bids[p] === -1);
    S.turn = p;
  }
  function takeWidow(S) {
    S.phase = 'widow';
    S.hands[S.declarer] = sortHand(S.hands[S.declarer].concat(S.widow));
    S.widow = [];
    S.turn = S.declarer;
  }
  // The declarer puts back four cards; they are the declarer's first trick, points and all
  function bury(S, cards) {
    if (S.phase !== 'widow' || !cards || cards.length !== 4) return false;
    var h = S.hands[S.declarer];
    for (var i = 0; i < 4; i++) if (h.indexOf(cards[i]) < 0 || cards.indexOf(cards[i]) !== i) return false;
    S.hands[S.declarer] = h.filter(function (c) { return cards.indexOf(c) < 0; });
    S.buried = cards.slice();
    S.taken[team(S.declarer)] += TRICK + sumPoints(cards);
    S.phase = 'trump';
    return true;
  }
  function chooseTrump(S, s) {
    if (S.phase !== 'trump' || !(s >= 0 && s <= 3)) return false;
    S.trump = s;
    S.phase = 'play';
    S.turn = S.declarer;
    return true;
  }

  function legal(S, p) {
    var h = S.hands[p];
    if (S.phase !== 'play' || S.turn !== p) return [];
    if (!S.trick.length) return h.slice();
    var led = suit(S.trick[0].c), same = h.filter(function (c) { return suit(c) === led; });
    return same.length ? same : h.slice();
  }

  // the card currently taking the trick
  function trickBest(trick, trump) {
    if (!trick.length) return null;
    var led = suit(trick[0].c), best = trick[0];
    for (var i = 1; i < trick.length; i++) {
      var t = trick[i];
      var tb = suit(best.c) === trump, tt = suit(t.c) === trump;
      if (tt && !tb) best = t;
      else if (tt === tb && suit(t.c) === suit(best.c) && power(t.c) > power(best.c)) best = t;
      else if (!tt && !tb && suit(t.c) === led && suit(best.c) !== led) best = t;
    }
    return best;
  }

  // Plays a card. Returns null if illegal, else what happened: the trick if it closed,
  // and the hand's result after the twelfth trick.
  function play(S, p, c) {
    if (legal(S, p).indexOf(c) < 0) return null;
    var h = S.hands[p];
    h.splice(h.indexOf(c), 1);
    S.trick.push({ p: p, c: c });
    S.played.push(c);
    var out = { p: p, c: c, trickDone: false, hand: null };
    if (S.trick.length < 4) { S.turn = (p + 1) % 4; return out; }
    var w = trickBest(S.trick, S.trump).p;
    S.tricks[team(w)]++;
    S.taken[team(w)] += TRICK + sumPoints(S.trick.map(function (t) { return t.c; }));
    S.lastTrick = { cards: S.trick.slice(), winner: w };
    S.trick = [];
    S.turn = w;
    out.trickDone = true; out.winner = w;
    if (!S.hands[0].length) out.hand = score(S);
    return out;
  }

  // The declarer's team scores what it took if that reaches the bid, 330 for a shelem
  // (every trick); short of the bid it loses the bid, twice over when the defenders took
  // more. The defenders always score what they took.
  function score(S) {
    var dt = team(S.declarer), made = S.taken[dt], other = S.taken[1 - dt];
    var shelem = S.tricks[dt] === 12, delta = [0, 0];
    if (shelem) delta[dt] = SHELEM;
    else if (made >= S.high) delta[dt] = made;
    else delta[dt] = -(other > made ? 2 : 1) * S.high;
    delta[1 - dt] = other;
    S.score[0] += delta[0]; S.score[1] += delta[1];
    var res = { declarer: S.declarer, bid: S.high, trump: S.trump, made: made, other: other, delta: delta, shelem: shelem, set: !shelem && made < S.high };
    S.lastHand = res;
    // the match ends when a team reaches the target; level at or past it, it goes on
    var top = S.score[0] >= S.target || S.score[1] >= S.target;
    if (top && S.score[0] !== S.score[1]) { S.done = true; S.phase = 'done'; S.winner = S.score[0] > S.score[1] ? 0 : 1; }
    else { S.phase = 'handover'; S.dealer = (S.dealer + 1) % 4; }
    return res;
  }

  /* ------------------------------------------------------------ AI */
  // the trump a hand would name: long and high
  function aiTrump(hand) {
    var sc = [0, 0, 0, 0];
    hand.forEach(function (c) { sc[suit(c)] += 4 + Math.max(0, power(c) - 7); });
    var best = 0;
    for (var s = 1; s < 4; s++) if (sc[s] > sc[best]) best = s;
    return best;
  }

  // What a hand of twelve is worth to its team as declarer, in points of 165: a linear
  // fit to the engine's own medium bots playing out 10,000 hands (#418). The partner's
  // cards and the widow are unknown, so it misses by about 21 points either way.
  function handValue(hand) {
    var t = aiTrump(hand), n = [0, 0, 0, 0], aces = 0, kings = 0, tHigh = 0, tens = 0, short = 0;
    hand.forEach(function (c) {
      var r = rank(c), s = suit(c);
      n[s]++;
      if (r === 0) aces++;
      if (r === 12) kings++;
      if (r === 9) tens++;
      if (s === t && (r === 0 || r >= 10)) tHigh++;
    });
    for (var s = 0; s < 4; s++) if (s !== t && n[s] <= 1) short++;
    return Math.round(72 + 9 * aces + kings + 5 * n[t] + 3 * tHigh + 2 * tens + 3 * short);
  }

  // Bots bid up to what their hand is worth, one step at a time. Easy guesses widely;
  // a bot whose partner holds the bid lets it stand unless it is much stronger.
  function aiBid(S, p, level, rnd) {
    // a margin of about half the estimate's miss: the bid is made about two times in three
    var est = handValue(S.hands[p]) - 10;
    if (level === 'easy') est += Math.round((rnd() - 0.5) * 40);
    else if (level === 'hard') est += 3;
    var partnerHolds = S.declarer >= 0 && team(S.declarer) === team(p) && S.declarer !== p;
    if (partnerHolds) est -= 15;
    var v = minBid(S);
    return v <= MAX_BID && v <= est ? { bid: v } : { pass: true };
  }

  // Four cards to put back: never trump or an ace; first the cards that make a short
  // side suit empty, and a ten or five with no ace behind it, whose points are safe there.
  function aiBury(hand, trump) {
    var n = [0, 0, 0, 0], ace = [false, false, false, false];
    hand.forEach(function (c) { n[suit(c)]++; if (rank(c) === 0) ace[suit(c)] = true; });
    var cost = function (c) {
      var s = suit(c);
      if (s === trump) return 1000 + power(c);
      if (rank(c) === 0) return 900;
      var k = n[s] * 6 + power(c);
      if (cardPoints(c) && !ace[s]) k -= 12;
      return k;
    };
    return hand.slice().sort(function (a, b) { return cost(a) - cost(b) || a - b; }).slice(0, 4);
  }

  // the highest card of a suit not yet played, nor held
  function topLeft(S, s, mine) {
    for (var pw = 12; pw >= 0; pw--) {
      var c = ((pw + 1) % 13) << 2 | s;
      if (S.played.indexOf(c) < 0 && mine.indexOf(c) < 0) return pw;
    }
    return -1;
  }

  function aiPlay(S, p, level, rnd) {
    var L = legal(S, p);
    if (!L.length) return null;
    if (level === 'easy' && rnd() < 0.5) return L[Math.floor(rnd() * L.length)];
    var hand = S.hands[p], tr = S.trump;
    // the cheapest card: no points if possible, then the lowest
    var low = function (cs) { return cs.slice().sort(function (a, b) { return cardPoints(a) - cardPoints(b) || power(a) - power(b); })[0]; };
    var high = function (cs) { return cs.slice().sort(function (a, b) { return power(b) - power(a); })[0]; };
    // a card to give the partner: the most points, then the lowest
    var rich = function (cs) { return cs.slice().sort(function (a, b) { return cardPoints(b) - cardPoints(a) || power(a) - power(b); })[0]; };
    var nonTrump = function (cs) { return cs.filter(function (c) { return suit(c) !== tr; }); };
    if (!S.trick.length) {
      // the declarer's side draws trumps while it holds more than are left outside
      var myTr = hand.filter(function (c) { return suit(c) === tr; });
      var outTr = 13 - myTr.length - S.played.filter(function (c) { return suit(c) === tr; }).length;
      if (team(p) === team(S.declarer) && myTr.length && outTr > 0 && myTr.length >= outTr && (level === 'hard' || myTr.length >= 4)) return high(myTr);
      var winners = nonTrump(L).filter(function (c) {
        return rank(c) === 0 || (level === 'hard' && power(c) > topLeft(S, suit(c), hand));
      });
      if (winners.length) return high(winners);
      var nt = nonTrump(L);
      if (!nt.length) return low(L);
      var bySuit = [0, 0, 0, 0];
      nt.forEach(function (c) { bySuit[suit(c)]++; });
      var longest = nt.map(suit).sort(function (a, b) { return bySuit[b] - bySuit[a]; })[0];
      return low(nt.filter(function (c) { return suit(c) === longest; }));
    }
    var best = trickBest(S.trick, tr);
    var partnerWins = team(best.p) === team(p);
    var lastToPlay = S.trick.length === 3;
    var beats = L.filter(function (c) { return trickBest(S.trick.concat([{ p: p, c: c }]), tr).p === p; });
    var led = suit(S.trick[0].c), following = L.every(function (c) { return suit(c) === led; });
    var sure = partnerWins && (lastToPlay || (suit(best.c) === tr ? power(best.c) > topLeft(S, tr, hand) : (suit(best.c) === led && power(best.c) > topLeft(S, led, hand) && level !== 'easy')));
    if (sure) return following ? rich(L) : (rich(nonTrump(L).filter(function (c) { return rank(c) !== 0; })) || low(L));
    if (partnerWins && level !== 'hard') return following ? low(L) : (low(nonTrump(L)) || low(L));
    var onTable = sumPoints(S.trick.map(function (t) { return t.c; }));
    if (beats.length) {
      if (lastToPlay) return low(beats);
      var safe = beats.filter(function (c) { return suit(c) === led && power(c) > topLeft(S, led, hand); });
      if (safe.length) return low(safe);
      // trump in when there is something to take, or the suit is not ours to follow
      if (!following || onTable > 0 || level === 'hard') return low(beats);
    }
    return following ? low(L) : (low(nonTrump(L)) || low(L));
  }

  var api = {
    MIN_BID: MIN_BID, MAX_BID: MAX_BID, STEP: STEP, TRICK: TRICK, SHELEM: SHELEM, TOTAL: TOTAL,
    rank: rank, suit: suit, power: power, team: team, cardPoints: cardPoints, sumPoints: sumPoints, shuffled: shuffled, sortHand: sortHand,
    newMatch: newMatch, newHand: newHand, minBid: minBid, canBid: canBid, bid: bid, pass: pass, bury: bury, chooseTrump: chooseTrump,
    legal: legal, trickBest: trickBest, play: play, score: score,
    aiTrump: aiTrump, handValue: handValue, aiBid: aiBid, aiBury: aiBury, aiPlay: aiPlay
  };
  return api;
}
if (typeof module !== 'undefined' && module.exports) module.exports = ShelemEngineFactory;

    if (S.phase === 'redeal') {
      C.ui.toast({ title: C.t('allPassed') });
      aiTimer = setTimeout(function () { nextHand(true); }, C.cards.pace(900));
      return;
    }
    if (S.phase === 'bid' && S.turn !== 0) {
      aiTimer = setTimeout(function () {
        var p = S.turn, m = E.aiBid(S, p, S.level, rngFor('b' + S.handNo + '|' + p + '|' + S.high));
        if (m.bid) E.bid(S, p, m.bid); else E.pass(S, p);
        afterBid();
      }, C.cards.pace(650));
      return;
    }
    if (S.phase === 'widow' && S.declarer !== 0) {
      aiTimer = setTimeout(function () {
        var p = S.declarer, s = E.aiTrump(S.hands[p]);
        E.bury(S, E.aiBury(S.hands[p], s));
        E.chooseTrump(S, s);
        C.ui.toast({ title: C.t('contract', { v: C.num(S.high), n: pname(p) }) + ' · ' + C.t('trump') + ' ' + G[s] });
        render(); save(); step();
      }, C.cards.pace(900));
      return;
    }
    // a daily is one hand; restored on its result, it ends there
    if (S.phase === 'handover') { if (S.daily) finish(); else showHandOver(); return; }
    if (S.phase === 'play' && S.turn !== 0) {
      aiTimer = setTimeout(function () {
        var p = S.turn;
        doPlay(p, E.aiPlay(S, p, S.level, rngFor(S.handNo + '|' + S.played.length)));
      }, C.cards.pace(holdTrick ? 950 : 600));
    }
  }
  function stopAi() { if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; } }

  function afterBid() {
    C.audio.sfx('tap');
    if (S.phase === 'widow' && S.declarer === 0) C.feedback('good');
    render(); save(); step();
  }
  function humanBid(v) {
    if (!S || S.phase !== 'bid' || S.turn !== 0) return;
    if (v ? !E.bid(S, 0, v) : !E.pass(S, 0)) { C.feedback('bad'); return; }
    myBid = 0;
    afterBid();
  }

  function seatOf(p) { return [handRow, seatRight, seatTop, seatLeft][p]; }
  function doPlay(p, c) {
    var src = p === 0 ? handRow.children[S.hands[0].indexOf(c)] : seatOf(p);
    var from = src && src.getBoundingClientRect ? src.getBoundingClientRect() : null;
    var r = E.play(S, p, c);
    if (!r) return;
    C.audio.sfx('place');
    if (p === 0) C.haptic('tap');
    cur = -1;
    if (r.trickDone) {
      holdTrick = S.lastTrick;
      if (r.hand && r.hand.shelem && E.team(r.hand.declarer) === 0) C.achievements.unlock('sh-shelem');
    } else holdTrick = null;
    save();
    paint();
    C.ui.fly(trickBox.querySelector('[data-p="' + p + '"]'), from, { flip: p !== 0, ms: 260 });
    if (r.trickDone) {
      aiTimer = setTimeout(function () { sweep(function () { holdTrick = null; if (S.done || (S.daily && r.hand)) { finish(); return; } paint(); step(); }); }, C.cards.pace(950));
      return;
    }
    step();
  }

  // After the hold, the trick slides to the player who took it (#407)
  function sweep(then) {
    var mine = S, w = holdTrick ? holdTrick.winner : -1, last = null;
    var cards = trickBox.querySelectorAll('.sh-tcard');
    for (var i = 0; i < cards.length && w >= 0; i++) last = C.ui.sendTo(cards[i], seatOf(w), { delay: i * 30 }) || last;
    if (!last) { then(); return; }
    var go = function () { if (S === mine) then(); };
    last.onfinish = go;
    last.oncancel = go;
  }

  function toggleSel(c) {
    var i = sel.indexOf(c);
    if (i >= 0) sel.splice(i, 1);
    else if (sel.length < 4) sel.push(c);
    else { C.feedback('bad'); return; }
    C.feedback('select');
    paint();
  }
  function humanBury() {
    if (!S || S.phase !== 'widow' || S.declarer !== 0 || sel.length !== 4) return;
    var rects = sel.map(function (c) { var n = handRow.children[S.hands[0].indexOf(c)]; return n ? n.getBoundingClientRect() : null; });
    if (!E.bury(S, sel)) { C.feedback('bad'); return; }
    sel = [];
    C.audio.sfx('place');
    render(); save();
    // the four cards go face down to the middle
    rects.forEach(function (r) { if (r && trickBox.firstChild) C.ui.fly(trickBox.firstChild, r, { ms: 260 }); });
    step();
  }
  function pickTrump(s) {
    if (!S || S.phase !== 'trump' || S.declarer !== 0) return;
    E.chooseTrump(S, s);
    C.feedback('select');
    render(); save(); step();
  }

  function showHandOver() {
    var r = S.lastHand;
    var title = r.shelem ? C.t('shelemWin') : (r.set ? C.t('down') : C.t('made'));
    paint();
    if (r.delta[0] > r.delta[1]) C.feedback('good');
    // a signed number stays in one piece inside Persian text
    var num = function (n, signed) { return el('bdi', { dir: 'ltr', text: (signed && n > 0 ? '+' : n < 0 ? '−' : '') + C.num(Math.abs(n)) }); };
    var pair = function (t, n, signed) { return el('span', {}, [el('span', { text: C.t(t) + ' ' }), num(n, signed)]); };
    C.ui.modal({
      title: title,
      body: [el('p', { class: 'ch-dim', text: pname(r.declarer) + ' · ' + C.t('resLine', { v: C.num(r.bid), m: C.num(r.made) }) }),
        el('p', { class: 'sh-res' }, [pair('us', r.delta[0], true), pair('them', r.delta[1], true)]),
        el('p', { class: 'sh-res sh-res--sum' }, [el('span', { text: C.t('points') }), pair('us', S.score[0]), pair('them', S.score[1])])],
      actions: [{ label: C.t('nextHand'), kind: 'primary' }],
      // dealing lives in onClose only; with both, one tap dealt two hands (as in Hokm)
      onClose: function () { if (S.phase === 'handover') nextHand(false); }
    });
  }

  function finish() {
    stopAi();
    var r = S.lastHand;
    var won = S.daily ? r.delta[0] > r.delta[1] : S.winner === 0;
    var base = { easy: 6, medium: 12, hard: 20 }[S.level] || 12;
    if (S.target === 1165) base = Math.round(base * 1.8);
    var coins = Math.max(2, Math.round(won ? base : base * 0.35)) + (S.daily ? 8 : 0);
    var points = Math.max(3, Math.round(won ? base * 4 : base * 1.2)) + (S.daily ? 25 : 0);
    if (won) { C.achievements.unlock('sh-win'); if (S.level === 'hard' && !S.daily) C.achievements.unlock('sh-hard'); }
    var a = S.daily ? r.delta[0] : S.score[0], b = S.daily ? r.delta[1] : S.score[1];
    if (S.daily) {
      var firstDaily = C.stats.daily('shelem', S.daily, { label: C.num(a) + ' - ' + C.num(b), win: won });
      if (!firstDaily) { coins = Math.round(coins * 0.2); points = Math.round(points * 0.2); }
    }
    ctx.clearSave();
    var level = S.level, target = S.target;
    ctx.finish({
      won: won, title: won ? C.t('won') : C.t('lost'),
      timeMs: Date.now() - S.startedAt, coins: coins, points: points,
      lines: [
        { label: C.t('us') + ' - ' + C.t('them'), value: C.num(a) + ' - ' + C.num(b) },
        { label: C.t('handN', { n: C.num(S.handNo) }), value: C.t(level) }
      ],
      shareText: 'چوگان · شلم' + (S.daily ? ('\nروزانه ' + S.daily) : '') + '\n' + C.num(a) + ' - ' + C.num(b),
      paint: function (g, w, h, col) {
        g.fillStyle = col.surface2; C.rrect(g, 0, 0, w, h, 18); g.fill();
        g.fillStyle = col.game; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.font = '800 ' + Math.round(h * 0.3) + 'px Vazirmatn, system-ui, sans-serif';
        g.fillText(C.num(a) + ' - ' + C.num(b), w / 2, h / 2);
      },
      onAgain: S.daily ? null : function () { newMatch(level, target); }
    });
  }

  /* ----------------------------------------------------------- render */
  function render() {
    top.innerHTML = '';
    if (S.daily) {
      top.appendChild(el('span', { class: 'ch-badge ch-badge--accent' }, [C.icon('calendar', 14), el('span', { text: C.t('dailySh') + ' — ' + C.num(S.daily) })]));
      top.appendChild(el('span', { class: 'ch-badge', text: C.t('vsHard') }));
    } else {
      top.appendChild(el('span', { class: 'ch-badge', text: C.t('handN', { n: C.num(S.handNo) }) }));
      top.appendChild(el('span', { class: 'ch-badge', text: C.t('matchTo', { n: C.num(S.target) }) }));
    }
    top.appendChild(C.cards.backPicker());
    // options behind a gear, never in «?» (#409)
    var gear = el('button', { class: 'ch-iconbtn', type: 'button', 'aria-label': C.t('settings'), title: C.t('settings') }, [C.icon('gear', 20)]);
    gear.addEventListener('click', showSettings);
    top.appendChild(gear);
    paint();
  }

  function seat(box, p) {
    box.innerHTML = '';
    var on = !S.done && (S.phase === 'play' || S.phase === 'bid') && S.turn === p && !holdTrick;
    box.className = box.className.replace(/ sh-seat--on| sh-seat--partner/g, '') + (on ? ' sh-seat--on' : '') + (p === 2 ? ' sh-seat--partner' : '');
    var name = el('div', { class: 'sh-seat__name' }, [el('span', { text: pname(p) })]);
    if (S.declarer === p && S.phase !== 'bid') name.appendChild(el('span', { class: 'sh-crown', title: C.t('bidWord'), 'aria-label': C.t('bidWord') }, [C.icon('crown', 14)]));
    box.appendChild(name);
    var fan = el('div', { class: 'sh-fan' });
    for (var k = 0; k < Math.min(S.hands[p].length, 16); k++) fan.appendChild(C.cards.back());
    box.appendChild(fan);
    if (S.phase === 'bid' && S.bids[p]) box.appendChild(sayTag(p));
  }
  function sayTag(p) {
    var b = S.bids[p];
    return el('span', { class: 'sh-say' + (b < 0 ? ' sh-say--pass' : ''), text: b < 0 ? C.t('passed') : C.num(b) });
  }

  function paint() {
    if (!S) return;
    board.innerHTML = '';
    var inPlay = S.phase === 'play' || S.phase === 'trump' || S.phase === 'widow' || S.phase === 'handover' || S.phase === 'done';
    var teamBox = function (t) {
      return el('div', { class: 'sh-team' + (t === 0 ? ' sh-team--us' : '') }, [el('b', { text: C.t(t === 0 ? 'us' : 'them') }),
        el('span', { text: C.t('points') + ' ' + C.num(S.score[t]) }),
        el('span', { text: inPlay ? C.t('taken') + ' ' + C.num(S.taken[t]) : ' ' })]);
    };
    board.appendChild(teamBox(0));
    var dealKids = [];
    if (S.trump >= 0) dealKids.push(el('span', { class: 'sh-deal__s', text: G[S.trump] }));
    dealKids.push(el('span', { class: 'sh-deal__v', text: S.high ? C.num(S.high) : '—' }));
    dealKids.push(el('span', { class: 'sh-deal__l', text: S.trump >= 0 ? C.t('trump') : C.t('bidWord') }));
    board.appendChild(el('div', { class: 'sh-deal' + (S.trump === 1 || S.trump === 2 ? ' sh-deal--red' : '') }, dealKids));
    board.appendChild(teamBox(1));

    seat(seatTop, 2); seat(seatLeft, 3); seat(seatRight, 1);

    trickBox.innerHTML = '';
    if (S.phase === 'bid' || S.phase === 'redeal' || S.phase === 'widow' || S.phase === 'trump') {
      // the widow face down in the middle, then the four cards put back
      var w = el('div', { class: 'sh-widow', 'aria-hidden': 'true' });
      var n = S.phase === 'bid' || S.phase === 'redeal' ? S.widow.length : S.phase === 'trump' ? 4 : 0;
      for (var k = 0; k < n; k++) w.appendChild(C.cards.back());
      trickBox.appendChild(w);
    }
    var shown = holdTrick ? holdTrick.cards : S.trick;
    var POS = ['b', 'r', 't', 'l'];
    shown.forEach(function (t) {
      var b = C.cards.el(t.c, 'sh-tcard sh-tcard--' + POS[t.p] + (holdTrick && holdTrick.winner === t.p ? ' sh-tcard--win' : ''));
      b.disabled = true;
      b.setAttribute('data-p', t.p);
      trickBox.appendChild(b);
    });

    paintAsk();
    paintHand();

    var msg = '';
    if (S.phase === 'bid') msg = S.turn === 0 ? C.t('yourBid') : C.t('thinking', { n: pname(S.turn) });
    else if (S.phase === 'widow') msg = S.declarer === 0 ? C.t('burySub') : C.t('thinking', { n: pname(S.declarer) });
    else if (S.phase === 'trump') msg = S.declarer === 0 ? C.t('chooseTrump') : '';
    else if (S.phase === 'play' && !holdTrick) {
      if (S.turn === 0) {
        var legal = E.legal(S, 0);
        msg = C.t('yourTurn') + (S.trick.length && legal.length && legal.length < S.hands[0].length ? ' · ' + C.t('mustFollow') : '');
      } else msg = C.t('thinking', { n: pname(S.turn) });
    }
    status.textContent = msg;
  }

  function paintHand() {
    handRow.innerHTML = '';
    var mine = S.hands[0];
    var legal = S.phase === 'play' && S.turn === 0 && !holdTrick ? E.legal(S, 0) : [];
    var burying = S.phase === 'widow' && S.declarer === 0;
    // up to eight to a row, as wide as the row allows, never below the 44px touch target
    var w = handRow.clientWidth || 360, per = mine.length > 14 ? 8 : 7;
    var cw = Math.max(44, Math.min(64, Math.floor((w - (per - 1) * 4) / per)));
    handRow.style.setProperty('--pw', cw + 'px');
    mine.forEach(function (c, i) {
      var ok = burying || legal.indexOf(c) >= 0;
      var cls = 'sh-card' + (legal.length && !ok ? ' sh-card--no' : '') + (legal.length && ok ? ' sh-card--ok' : '') +
        (sel.indexOf(c) >= 0 ? ' sh-card--sel' : '') + (i === cur ? ' sh-card--cur' : '');
      var b = C.cards.el(c, cls);
      b.disabled = !ok;
      if (burying) b.setAttribute('aria-pressed', sel.indexOf(c) >= 0 ? 'true' : 'false');
      b.addEventListener('click', function () { if (burying) toggleSel(c); else if (ok) doPlay(0, c); });
      handRow.appendChild(b);
    });
    // a deal, or the widow: new cards come from the middle of the table, turning over
    var fresh = mine.filter(function (c) { return handSeen.indexOf(c) < 0; });
    if (fresh.length > 1) fresh.forEach(function (c, k) { C.ui.fly(handRow.children[mine.indexOf(c)], trickBox, { flip: true, ms: 280, delay: k * 40 }); });
    handSeen = mine.slice();
  }

  // the question on the page: a bid, the four cards to put back, or trump
  function paintAsk() {
    askBox.innerHTML = '';
    var kids = null;
    if (S.phase === 'bid' && S.turn === 0) {
      var lo = E.minBid(S);
      if (myBid < lo || myBid > E.MAX_BID) myBid = lo;
      var canRaise = lo <= E.MAX_BID;
      var valEl = el('span', { class: 'sh-bidval', text: C.num(myBid) });
      var minus = el('button', { class: 'ch-iconbtn', type: 'button', 'aria-label': '−5', text: '−' });
      var plus = el('button', { class: 'ch-iconbtn', type: 'button', 'aria-label': '+5', text: '+' });
      minus.disabled = myBid <= lo; plus.disabled = myBid >= E.MAX_BID;
      minus.addEventListener('click', function () { if (myBid > lo) { myBid -= E.STEP; C.feedback('tap'); paint(); } });
      plus.addEventListener('click', function () { if (myBid < E.MAX_BID) { myBid += E.STEP; C.feedback('tap'); paint(); } });
      var bidB = el('button', { class: 'ch-btn ch-btn--primary', type: 'button', text: C.t('bidBtn', { v: C.num(myBid) }) });
      bidB.addEventListener('click', function () { humanBid(myBid); });
      var passB = el('button', { class: 'ch-btn ch-btn--soft', type: 'button', text: C.t('passBtn') });
      passB.addEventListener('click', function () { humanBid(0); });
      kids = [el('p', { class: 'sh-ask__sub', text: S.high ? C.t('highBid', { v: C.num(S.high), n: pname(S.declarer) }) : C.t('noBid') })];
      if (canRaise) kids.push(el('div', { class: 'sh-bidrow' }, [minus, valEl, plus]));
      kids.push(el('div', { class: 'sh-btns' }, canRaise ? [bidB, passB] : [passB]));
    } else if (S.phase === 'widow' && S.declarer === 0) {
      var go = el('button', { class: 'ch-btn ch-btn--primary', type: 'button', text: C.t('buryBtn') + ' (' + C.num(sel.length) + '/' + C.num(4) + ')' });
      go.disabled = sel.length !== 4;
      go.addEventListener('click', humanBury);
      kids = [el('p', { class: 'sh-ask__sub', text: C.t('buryTitle') }), go];
    } else if (S.phase === 'trump' && S.declarer === 0) {
      var row = el('div', { class: 'sh-suits' });
      [0, 1, 3, 2].forEach(function (s) {
        var b = el('button', { class: 'sh-suit' + (s === 1 || s === 2 ? ' sh-suit--red' : ''), type: 'button', 'aria-label': C.t('trump') + ' ' + G[s], text: G[s] });
        b.addEventListener('click', function () { pickTrump(s); });
        row.appendChild(b);
      });
      kids = [el('p', { class: 'sh-ask__sub', text: C.t('chooseSub') }), row];
    }
    if (!kids) { askBox.setAttribute('hidden', ''); return; }
    askBox.removeAttribute('hidden');
    kids.forEach(function (k) { askBox.appendChild(k); });
  }

  /* --------------------------------------------------------- keyboard */
  window.addEventListener('keydown', function (e) {
    if (!S || document.querySelector('.ch-scrim')) return;
    var k = e.key;
    if (S.phase === 'trump' && S.declarer === 0 && /^[1-4]$/.test(k)) { pickTrump([0, 1, 3, 2][+k - 1]); e.preventDefault(); return; }
    if (S.phase === 'bid' && S.turn === 0) {
      var lo = E.minBid(S);
      if (k === 'ArrowUp' && myBid < E.MAX_BID) { myBid += E.STEP; paint(); e.preventDefault(); }
      else if (k === 'ArrowDown' && myBid > lo) { myBid -= E.STEP; paint(); e.preventDefault(); }
      else if (k === 'Enter' && lo <= E.MAX_BID) { humanBid(myBid); e.preventDefault(); }
      else if (C.keyIs(e, 'p')) { humanBid(0); e.preventDefault(); }
      return;
    }
    var mine = S.hands[0], burying = S.phase === 'widow' && S.declarer === 0;
    if (!burying && (S.phase !== 'play' || S.turn !== 0 || holdTrick)) return;
    var choices = burying ? mine.slice() : E.legal(S, 0);
    var idx = choices.map(function (c) { return mine.indexOf(c); }).sort(function (a, b) { return a - b; });
    if (!idx.length) return;
    if (k === 'ArrowRight' || k === 'ArrowLeft') {
      var at = idx.indexOf(cur);
      at = at < 0 ? 0 : (at + (k === 'ArrowRight' ? 1 : idx.length - 1)) % idx.length;
      cur = idx[at]; paint(); e.preventDefault(); return;
    }
    if ((k === ' ' || k === 'Enter') && cur >= 0) {
      if (burying) { if (k === 'Enter' && sel.length === 4) humanBury(); else toggleSel(mine[cur]); }
      else if (choices.indexOf(mine[cur]) >= 0) doPlay(0, mine[cur]);
      e.preventDefault();
    }
  });

  var resizeT = null;
  window.addEventListener('resize', function () { clearTimeout(resizeT); resizeT = setTimeout(paint, 120); });

  /* ------------------------------------------------------------- help */
  function showSettings() {
    var seg1 = C.ui.segmented(LEVELS.map(function (l) { return { value: l, label: C.t(l) }; }), prefs.level, function (v) { prefs.level = v; ctx.store.set('prefs', prefs); });
    var seg2 = C.ui.segmented([505, 1165].map(function (n) { return { value: n, label: C.num(n) }; }), prefs.target, function (v) { prefs.target = v; ctx.store.set('prefs', prefs); });
    C.ui.modal({
      title: C.t('settings'),
      body: [el('div', { class: 'ch-list' }, [
        el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: C.t('level') }), seg1]),
        el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: C.t('matchLen') }), seg2]),
        C.cards.speedRow()
      ]), el('p', { class: 'ch-dim', text: C.t('optNote') })],
      actions: [{ label: C.t('done'), kind: 'primary' }]
    });
  }
  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [kb('↑ ↓ · Enter · P', C.t('bidKeys')), kb('← →', C.t('moveKey')), kb('Space / Enter', C.t('playKey')), kb('1 2 3 4', C.t('suitKey'))])
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function askNew() {
    if (S && S.daily) { C.feedback('bad'); return; }
    var go = function () { newMatch(prefs.level, prefs.target); };
    if (!S || S.done || (S.handNo <= 1 && S.phase === 'bid' && !S.high)) { go(); return; }
    C.ui.confirm({ title: C.t('newMatch'), body: C.t('resetWarn'), onOk: go });
  }
  function art(cards) {
    var s = '<svg viewBox="0 0 200 110" width="100%" direction="ltr">';
    cards.forEach(function (c) {
      s += '<g><rect x="' + c[0] + '" y="' + c[1] + '" width="34" height="48" rx="6" fill="var(--c-surface)" stroke="' + (c[3] ? 'var(--game)' : 'var(--c-line)') + '" stroke-width="' + (c[3] ? 3 : 1) + '"/>' +
        '<text x="' + (c[0] + 17) + '" y="' + (c[1] + 31) + '" text-anchor="middle" font-size="14" font-weight="800" fill="' + (/[♦♥]/.test(c[2]) ? 'var(--c-bad)' : 'var(--c-text)') + '">' + c[2] + '</text></g>';
    });
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: '<svg viewBox="0 0 200 110" width="100%"><text x="100" y="66" text-anchor="middle" font-size="40" font-weight="800" fill="var(--game)" direction="ltr">' + C.num(120) + '</text></svg>' },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: art([[30, 31, 'A' + G[3], true], [83, 31, '10' + G[2], true], [136, 31, '5' + G[0], true]]) },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: '<svg viewBox="0 0 200 110" width="100%"><text x="100" y="66" text-anchor="middle" font-size="40" font-weight="800" fill="var(--game)" direction="ltr">' + C.num(330) + '</text></svg>' }
  ];

  /* ------------------------------------------------------------- save */
  ctx.autosave(function () {
    if (!S || S.done || (S.handNo <= 1 && S.phase === 'bid' && !S.high && !S.bids.some(function (b) { return b; }))) return { inProgress: false };
    var copy = JSON.parse(JSON.stringify(S));
    copy.elapsed = Date.now() - S.startedAt;
    return { s: copy };
  });
  function save() { ctx.save(); }

  function restore(v) {
    S = v; S.startedAt = Date.now() - (v.elapsed || 0);
    resetHand();
    handSeen = S.hands[0].slice();
    render(); step();
  }
  function validSave(s) {
    if (!s || !Array.isArray(s.hands) || s.hands.length !== 4 || !Array.isArray(s.score) || !Array.isArray(s.bids)) return false;
    var seen = {}, n = 0, ok = true;
    var add = function (c) { if (typeof c !== 'number' || c < 0 || c > 51 || seen[c]) ok = false; seen[c] = 1; n++; };
    s.hands.forEach(function (h) { h.forEach(add); });
    (s.widow || []).forEach(add); (s.buried || []).forEach(add); (s.played || []).forEach(add);
    return ok && n === 52 && ['bid', 'redeal', 'widow', 'trump', 'play', 'handover'].indexOf(s.phase) >= 0;
  }
  var saved = ctx.loadSave();
  var ok = saved && validSave(saved.s);
  if (dailyDate) {
    if (ok && saved.s.daily === dailyDate) restore(saved.s);
    else newMatch('hard', 505, dailyDate);
    if (C.stats.dailyDone('shelem', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).shelem;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
    }
    ctx.tutorialIfNew(TUT);
  } else if (ok && !saved.s.daily) restore(saved.s);
  else {
    newMatch(prefs.level, prefs.target);
    ctx.tutorialIfNew(TUT);
  }
})();
</script>
