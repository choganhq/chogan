<style>
  .wp-wrap > .ch-fit { --fit-ar: 1.45; }
  .ch-fit > .wp-box { width: 100%; height: 100%; position: relative; }
  /* a canvas is a replaced element: without its own width and height it keeps the
     backing-store size times the pixel ratio (#919) */
  .wp-box canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; border-radius: var(--r-md);
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .wp-top { display: flex; justify-content: center; align-items: center; gap: var(--s-2) var(--s-3); flex-wrap: wrap;
    font-weight: 700; color: var(--c-text-dim); font-variant-numeric: tabular-nums; min-height: 36px; }
  .wp-top > span { white-space: nowrap; }
  .wp-dots { display: inline-flex; gap: 5px; align-items: center; }
  .wp-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--c-line); box-sizing: border-box; }
  .wp-dot.wp-got { background: var(--game, var(--c-accent)); border-color: var(--game, var(--c-accent)); }
  .wp-dot.wp-now { border-color: var(--game, var(--c-accent)); }
  .wp-dot.wp-miss { background: var(--c-line); }
  .wp-cat { text-align: center; min-height: 1.5em; color: var(--game-text, var(--c-text-dim)); font-weight: 700; font-size: .95rem; }
  /* one box a letter; the row shrinks its boxes before it ever wraps a word */
  .wp-word { display: flex; justify-content: center; gap: 4px; --n: 5; padding: var(--s-1) 0; }
  .wp-slot { flex: 0 1 calc((100% - (var(--n) - 1) * 4px) / var(--n)); max-width: 46px; min-width: 0; height: 52px;
    display: flex; align-items: center; justify-content: center; border-bottom: 3px solid var(--c-line);
    font-size: 1.5rem; font-size: min(1.6rem, calc(150cqw / var(--n) / 2.2)); font-weight: 800; color: var(--c-text); line-height: 1; }
  .wp-slot.wp-open { border-color: var(--game, var(--c-accent)); }
  .wp-slot.wp-gave { color: var(--c-text-dim); border-color: var(--c-line); }
  .wp-slot.wp-pop { animation: wp-pop .28s ease-out; }
  .wp-slot.wp-gap { flex: 0 0 6px; border: 0; }
  @keyframes wp-pop { 0% { transform: scale(.6); } 70% { transform: scale(1.12); } 100% { transform: none; } }
  @media (prefers-reduced-motion: reduce) { :root:not([data-motion="on"]) .wp-slot.wp-pop { animation: none; } }
  /* the line under the word keeps its room, so the keys never move under a finger */
  .wp-msg { display: flex; justify-content: center; align-items: center; gap: var(--s-2); min-height: 44px; text-align: center; flex-wrap: wrap; }
  .wp-msg > span { font-weight: 700; color: var(--c-text-dim); }
  /* the row's min-height already keeps the button's room, so a hidden button need not hold space
     and push the message off centre */
  .wp-msg .ch-btn { display: none; }
  .wp-msg.wp-over .ch-btn { display: inline-flex; }
  .wp-kb { direction: ltr; display: flex; flex-direction: column; gap: 5px; user-select: none; -webkit-user-select: none;
    touch-action: manipulation; --gap: 4px; }
  .wp-row { display: flex; justify-content: center; gap: var(--gap); }
  .wp-key { flex: 0 1 calc((100% - (var(--cols) - 1) * var(--gap)) / var(--cols)); min-width: 0; padding: 0;
    height: 44px; height: clamp(40px, 7.5cqh, 54px); border: 0; border-radius: 8px; font: inherit; font-size: 1.15rem; font-weight: 700;
    background: var(--c-surface-2, var(--c-surface)); color: var(--c-text); box-shadow: 0 2px 0 var(--c-line);
    cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background-color .12s, opacity .12s; }
  .wp-key.wp-in { background: var(--game, var(--c-accent)); color: var(--game-ink, #fff); box-shadow: none; }
  .wp-key.wp-out { opacity: .32; box-shadow: none; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .wp-key.wp-in { color: var(--game-ink-dark, #111); } }
  :root[data-theme="dark"] .wp-key.wp-in { color: var(--game-ink-dark, #111); }
  @container game (min-aspect-ratio: 5 / 4) {
    .wp-wrap.ch-split { --side-w: clamp(300px, 46cqw, 560px); }
    .wp-wrap > .ch-fit { --fit-ar: 0.95; }
    /* a phone on its side was 18px short: plain centring cut off the top row where it could
       not be scrolled to, so the column packs tighter and centres only when it fits */
    .wp-wrap.ch-split > .ch-side { justify-content: safe center; gap: var(--s-2); }
    .wp-wrap .wp-word { padding: 0; }
    .wp-wrap .wp-slot { height: 40px; }
  }

  document.addEventListener('visibilitychange', function () { if (document.hidden) ctx.save(); else draw(); });
  // back from the back/forward cache, the page runs on without a load (#385)
  window.addEventListener('pageshow', function (e) { if (e.persisted) { if (!startedAt) startedAt = Date.now(); draw(); } });

  var saved = ctx.loadSave();
  if (saved && saved.game && E.valid(saved.game) && saved.game.lang === appAlpha() && (saved.daily || null) === (dailyDate || null)) {
    S = saved.game; daily = saved.daily || null; elapsed0 = +saved.elapsed || 0; startedAt = Date.now();
    ended = false;
    if (S.over === 'won') bloomAt = 1;
    buildKeys(); paintAll();
    if (S.over) say(S.over === 'won' ? C.t('wpSolved') : C.t('wpOut', { w: shown(E.current(S)) }));
  } else newGame();
  if (dailyDate && C.stats.dailyDone('petals', dailyDate)) {
    var rec = C.stats.dailyOf(dailyDate).petals;
    C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
  }
  // the flower is redrawn whenever its box changes (rotation, side rows) and once the
  // web font has arrived and moved the layout (Bowling lesson)
  if (window.ResizeObserver) new ResizeObserver(function () { draw(); }).observe(box);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { draw(); });
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { draw(); }); } catch (er) { /* old WebViews */ } }
  new MutationObserver(function () { draw(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  ctx.tutorialIfNew(TUT);
})();
</script>
