<style>
  /* the cabinet is taller than wide in every window; a wide one puts the side rows beside it */
  .cw-wrap > .ch-fit { --fit-ar: calc(100 / 140); }
  .ch-fit > .cw-box { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
  /* the cabinet is drawn left to right in every language, so the claw follows the finger */
  .cw-canvas { display: block; touch-action: none; direction: ltr; user-select: none; -webkit-user-select: none; max-width: 100%; max-height: 100%; }
  .cw-top { display: flex; justify-content: center; align-items: center; gap: var(--s-2); flex-wrap: wrap; }
  .cw-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: var(--c-surface-2); font-weight: 700; font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }
  .cw-goals { display: flex; justify-content: center; gap: var(--s-2); flex-wrap: wrap; }
  .cw-goal { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--c-line); font-size: var(--fs-sm); color: var(--c-text-dim); font-variant-numeric: tabular-nums; }
  .cw-goal svg { opacity: .45; }
  .cw-goal--on { border-color: var(--c-gold); color: var(--c-text); }
  .cw-goal--on svg { opacity: 1; fill: currentColor; color: var(--c-gold); }
  .cw-status { min-height: 1.6em; font-weight: 700; color: var(--c-text-dim); text-align: center; font-size: var(--fs-sm); }
  /* the drop button keeps its room while a grab runs, so nothing moves under the finger */
  .cw-drop { min-height: 52px; min-width: min(240px, 100%); font-size: var(--fs-lg); align-self: center; }
  .cw-levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--s-2); }
  .cw-lv {
    min-height: 56px; border: 2px solid transparent; border-radius: var(--r-md);
    background: var(--c-surface-2); color: var(--c-text); font: inherit; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    touch-action: manipulation;
  }
  .cw-lv b { font-size: var(--fs-lg); font-variant-numeric: tabular-nums; }
  .cw-lv--on { border-color: var(--game); }
  .cw-lv--done { background: var(--game-soft); }
  .cw-lv[disabled] { opacity: .45; cursor: default; }
  .cw-lv__stars { display: flex; gap: 1px; color: var(--c-gold); }

<script>
/* ==== ENGINE START ==== */
function ClawEngineFactory() {
  'use strict';

  // Cabinet units, y down: 100 across and 140 tall, the chute on the left. One fixed step
  // of 1/60 s and no randomness or trigonometry in the play, so the same moves give the
  // same grab on every device and a player can learn the machine (#949). Whether a toy is
  // held depends only on how well the claw is centred on it and on the toy itself: there
  // is no random claw strength.
  var W = 100, H = 140, FLOOR = 130, TOP = 14, PRONG = 7, DT = 1 / 60;
  var VD = 55, VU = 55, VC = 40, CLOSE = 20, OPEN = 20, REACH = 3;
  // the claw head swings on its cable: a damped spring kicked by every start and stop
  var K = 23.4, GAIN = 0.45;
  var LEVELS = 10, TRIES = 8;
  // shares of a steady player's median for one, two and three stars
  var STAR_K = [0.35, 0.6, 0.85], AIM = 1.2, BOT_ROUNDS = 24;

  // toy kinds: radius, weight and points. Heavier and smaller toys need a better-centred
  // claw (tolerance r * 0.38 / weight), and the harder ones are worth more
  var KINDS = {
    duck:  { r: 5,   w: 1,   pts: 10 },
    ball:  { r: 4.2, w: 1,   pts: 15 },
    bear:  { r: 6.2, w: 1.4, pts: 20 },
    whale: { r: 7.5, w: 2,   pts: 30 },
    star:  { r: 3.8, w: 1.1, pts: 40 }
  };
  var KIND_IDS = ['duck', 'ball', 'bear', 'whale', 'star'];

  function rng(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function tolA(t) { return t.r * 0.38 / t.w; }
  function tolB(t) { return 2 * tolA(t); }

  /* The machine by level: the chute narrows, the carriage gets faster, the head starts to
     swing from level 6 (so a player waits for it to settle or times it), and the toy belt
     moves from level 7 (so a drop leads the toy). Level 0 is the daily board's mix. */
  function params(level) {
    var n = clamp(level | 0, 1, LEVELS);
    return {
      chute: n >= 9 ? 14 : n >= 5 ? 16 : 19,
      speed: n >= 4 ? 45 : 35,
      damp: n >= 6 ? 1.2 : 9,
      belt: n >= 7 ? (n >= 9 ? 6 : 5) : 0,
      period: n >= 9 ? 300 : 420,
      toys: n >= 8 ? 7 : n >= 4 ? 6 : 5,
      kinds: n >= 3 ? (n >= 6 ? KIND_IDS : ['duck', 'ball', 'bear', 'star']) : ['duck', 'ball', 'bear']
    };
  }

  /* A board from a seed and a level: toys of the level's kinds placed on the floor left
     to right with small gaps, never overlapping and never over the chute. */
  function make(seed, level) {
    seed = seed >>> 0;
    var r = rng(seed), P = params(level), toys = [], i;
    var lo = P.chute + 2 + P.belt, hi = W - 2 - P.belt;
    var picks = [];
    for (i = 0; i < P.toys; i++) picks.push(P.kinds[Math.floor(r() * P.kinds.length)]);
    // at most one rare star on a board
    var stars = 0;
    picks = picks.map(function (k) { if (k === 'star' && stars++) return 'duck'; return k; });
    // a board never holds more toys than fit with room to spare
    var need = 0;
    picks.forEach(function (k) { need += KINDS[k].r * 2; });
    while (need > (hi - lo) * 0.85) { need -= KINDS[picks.pop()].r * 2; }
    var spare = Math.max(0, hi - lo - need), gaps = [], gs = 0;
    for (i = 0; i <= picks.length; i++) { var g = 0.3 + r(); gaps.push(g); gs += g; }
    var x = lo;
    for (i = 0; i < picks.length; i++) {
      x += spare * gaps[i] / gs;
      var K0 = KINDS[picks[i]];
      toys.push({ id: i, k: picks[i], x: Math.round((x + K0.r) * 10) / 10, r: K0.r, w: K0.w, pts: K0.pts });
      x += K0.r * 2;
    }
    var B = { seed: seed, level: level | 0, P: P, toys: toys, tries: Math.min(TRIES, toys.length + 2), ph: Math.floor(r() * P.period) };
    return B;
  }
  // the campaign boards' targets, worked out once by thresholds() and checked by the tests,
  // so opening a board never waits for the bot rounds
  var TH = [[30, 50, 70], [20, 35, 50], [30, 55, 75], [40, 65, 95], [40, 70, 100],
    [35, 65, 90], [35, 65, 90], [35, 60, 85], [35, 65, 90], [30, 50, 70]];
  function level(n, fresh) { var B = make((9491 + n * 7919) >>> 0, n); if (!fresh) B.th = TH[n - 1]; return B; }
  function daily(seed) { var B = make(seed >>> 0, 8); B.level = 0; return B; }
  function home(B) { return B.P.chute / 2; }

  // the belt slides the whole floor back and forth on the board clock (a triangle wave)
  function shift(B, clock) {
    if (!B.P.belt) return 0;
    var p = B.P.period, u = (((clock + B.ph) % p) + p) % p / p;
    return B.P.belt * (4 * Math.abs(u - 0.5) - 1);
  }

  /* A round: the board's toys as they lie now, the drops made so far (where the
     carriage stood, the swing and the clock at each drop), the score and the clock. The
     whole round follows from the board and its drops, which is also what a save holds. */
  function round(B) {
    return { B: B, toys: B.toys.map(function (t) { return { id: t.id, k: t.k, x: t.x, r: t.r, w: t.w, pts: t.pts }; }), drops: [], got: [], score: 0, clock: 0, cx: home(B), v: 0, s: 0, sv: 0 };
  }
  function over(Rd) { return Rd.drops.length >= Rd.B.tries || !Rd.toys.length; }

  function swing(Rd, damp) {
    Rd.sv += (-K * Rd.s - damp * Rd.sv) * DT;
    Rd.s += Rd.sv * DT;
  }

  /* One step between drops: the carriage heads for tx (null = stay) at the level's
     speed, the head swings, and the clock runs. */
  function move(Rd, tx) {
    var P = Rd.B.P, v = 0;
    if (tx != null) {
      tx = clamp(tx, home(Rd.B), W - 4);
      var dx = tx - Rd.cx, st = P.speed * DT;
      if (Math.abs(dx) <= st) Rd.cx = tx;
      else { v = dx > 0 ? P.speed : -P.speed; Rd.cx += v * DT; }
    }
    if (v !== Rd.v) { Rd.sv -= (v - Rd.v) * GAIN; Rd.v = v; }
    swing(Rd, P.damp);
    Rd.clock++;
  }

  // the nearest free spot on the floor for a toy, in belt coordinates
  function place(Rd, toy, x) {
    var P = Rd.B.P, lo = P.chute + 1.5 + toy.r + P.belt, hi = W - 1.5 - toy.r - P.belt;
    function free(c) {
      if (c < lo || c > hi) return false;
      for (var i = 0; i < Rd.toys.length; i++) { var o = Rd.toys[i]; if (o !== toy && Math.abs(o.x - c) < o.r + toy.r + 0.4) return false; }
      return true;
    }
    x = Math.round(x * 10) / 10;
    for (var d = 0; d <= 100; d += 0.1) {
      if (free(Math.round((x - d) * 10) / 10)) return Math.round((x - d) * 10) / 10;
      if (free(Math.round((x + d) * 10) / 10)) return Math.round((x + d) * 10) / 10;
    }
    return clamp(x, lo, hi);
  }

  /* A drop: from here the machine runs on its own. A = the claw's state; step it until
     A.done. Events: ['touch', toyId|-1], ['grip', 'firm'|'loose'|'nudge'|'miss'],
     ['slip', toyId, delivered], ['deliver', toyId, points]. */
  function drop(Rd) {
    Rd.drops.push({ x: Rd.cx, s: Rd.s, sv: Rd.sv, clock: Rd.clock });
    if (Rd.v) { Rd.sv -= -Rd.v * GAIN; Rd.v = 0; }
    return { phase: 'down', y: TOP, t: 0, held: null, grip: null, d: 0, slipU: 2, u: 0, x0: Rd.cx, open: 1, done: false };
  }
  function tipsOver(Rd, gx, tips) {
    var best = null, bd = 1e9, sh = shift(Rd.B, Rd.clock);
    for (var i = 0; i < Rd.toys.length; i++) {
      var t = Rd.toys[i], dx = gx - (t.x + sh);
      if (Math.abs(dx) < t.r + REACH && tips >= FLOOR - 2 * t.r && Math.abs(dx) < bd) { bd = Math.abs(dx); best = t; }
    }
    return best;
  }
  function slipNow(Rd, A, ev) {
    var t = A.held, x = Rd.cx;
    A.held = null;
    if (x <= Rd.B.P.chute - 0.5) { deliver(Rd, t, ev); ev.push(['slip', t.id, true]); return; }
    Rd.toys.push(t);
    t.x = place(Rd, t, x - shift(Rd.B, Rd.clock));
    ev.push(['slip', t.id, false]);
  }
  function deliver(Rd, t, ev) {
    Rd.got.push(t.id); Rd.score += t.pts;
    ev.push(['deliver', t.id, t.pts]);
  }
  function step(Rd, A) {
    var ev = [], P = Rd.B.P, H0 = FLOOR - TOP;
    if (A.done) return ev;
    swing(Rd, P.damp);
    Rd.clock++; A.t++;
    if (A.phase === 'down') {
      A.y += VD * DT;
      var gx = Rd.cx + Rd.s, tips = A.y + PRONG, t = tipsOver(Rd, gx, tips);
      if (t || tips >= FLOOR - 1) {
        A.phase = 'close'; A.t = 0;
        if (!t) { A.grip = 'miss'; ev.push(['touch', -1], ['grip', 'miss']); return ev; }
        var d = Math.abs(gx - (t.x + shift(Rd.B, Rd.clock)));
        A.d = d; A.toy = t.id;
        ev.push(['touch', t.id]);
        if (d <= tolA(t)) A.grip = 'firm';
        else if (d <= tolB(t)) { A.grip = 'loose'; A.slipU = 0.1 + 0.88 * (tolB(t) - d) / (tolB(t) - tolA(t)); }
        else {
          // a claw coming down on a toy's side shoves it away, always the same way
          A.grip = 'nudge';
          var dir = gx < t.x + shift(Rd.B, Rd.clock) ? 1 : -1;
          t.x = place(Rd, t, t.x + dir * Math.min(3, t.r + REACH - d) * 0.8);
        }
        ev.push(['grip', A.grip]);
        if (A.grip === 'firm' || A.grip === 'loose') {
          A.held = t; A.hx = t.x + shift(Rd.B, Rd.clock) - Rd.cx;
          Rd.toys.splice(Rd.toys.indexOf(t), 1);
        }
      }
    } else if (A.phase === 'close') {
      A.open = Math.max(0, 1 - A.t / CLOSE);
      if (A.t >= CLOSE) { A.phase = 'up'; A.t = 0; A.y0 = A.y; }
    } else if (A.phase === 'up') {
      A.y = Math.max(TOP, A.y - VU * DT);
      A.u = 0.3 * (A.y0 - A.y) / Math.max(1, A.y0 - TOP);
      if (A.held && A.u >= A.slipU) slipNow(Rd, A, ev);
      if (A.y <= TOP) { A.phase = 'carry'; A.t = 0; A.x0 = Rd.cx; }
    } else if (A.phase === 'carry') {
      var hx = home(Rd.B), dxc = hx - Rd.cx, stc = VC * DT;
      if (Math.abs(dxc) <= stc) Rd.cx = hx; else Rd.cx += dxc > 0 ? stc : -stc;
      A.u = 0.3 + 0.7 * (A.x0 === hx ? 1 : (A.x0 - Rd.cx) / (A.x0 - hx));
      if (A.held && A.u >= A.slipU) slipNow(Rd, A, ev);
      if (Rd.cx === hx) { A.phase = 'open'; A.t = 0; }
    } else if (A.phase === 'open') {
      A.open = Math.min(1, A.t / OPEN);
      if (A.held && A.t === 4) { var h = A.held; A.held = null; deliver(Rd, h, ev); }
      if (A.t >= OPEN) { A.done = true; Rd.v = 0; }
    }
    void H0;
    return ev;
  }
  function finishDrop(Rd, A) { var ev = []; while (!A.done) ev = ev.concat(step(Rd, A)); return ev; }

  // descent steps from the top until the tips reach a toy of radius r lying on the floor
  function descentSteps(r) { return Math.ceil((FLOOR - 2 * r - PRONG - TOP) / (VD * DT)); }

  /* ---------------------------------------------------------------- players
     Bots used for the star targets and the tests. A player is a function that, before
     each drop, returns where to send the carriage and whether to wait for the swing. */
  function play(B, player) {
    var Rd = round(B), guard = 0;
    while (!over(Rd) && guard++ < 100) {
      var plan = player(Rd);
      var n = 0;
      while (Math.abs(Rd.cx - clamp(plan.x, home(B), W - 4)) > 1e-9 && n++ < 2000) move(Rd, plan.x);
      move(Rd, plan.x);
      n = 0;
      if (plan.settle) while ((Math.abs(Rd.s) > 0.05 || Math.abs(Rd.sv) > 0.3) && n++ < 600) move(Rd, null);
      if (plan.wait) for (n = 0; n < plan.wait; n++) move(Rd, null);
      finishDrop(Rd, drop(Rd));
    }
    return Rd;
  }
  // where the carriage must stand so the claw meets toy t square on, dropping at clock c
  // after a settled swing
  function lead(Rd, t, c) { return t.x + shift(Rd.B, c + descentSteps(t.r)); }

  /* A player who knows the machine but whose aim is off by up to `aim` units: goes for
     the toy with the best points times its chance of a firm grip, waits for the swing,
     leads a moving toy, and stands off by the error. */
  function skilled(seed, aim) {
    var r = rng(seed);
    return function (Rd) {
      var best = null, bv = -1;
      Rd.toys.forEach(function (t) { var v = t.pts * Math.min(1, tolA(t) / aim); if (v > bv) { bv = v; best = t; } });
      var e = (r() * 2 - 1) * aim;
      // the carriage takes time to get there; the bot plans the drop for when it arrives
      var c = Rd.clock, x = lead(Rd, best, c), arrive = Math.ceil(Math.abs(x - Rd.cx) / (Rd.B.P.speed * DT)) + 1;
      var settle = Rd.B.P.damp < 5 ? 150 : 40, cd = c + arrive + settle;
      return { x: lead(Rd, best, cd) + e, wait: settle };
    };
  }
  function randomPlayer(seed) {
    var r = rng(seed);
    return function () { return { x: home({ P: { chute: 19 } }) + r() * 90, wait: 0 }; };
  }
  function fixedPlayer(x) { return function () { return { x: x, wait: 0 }; }; }

  function thresholds(B) {
    if (B.th) return B.th;
    var sc = [];
    for (var i = 0; i < BOT_ROUNDS; i++) sc.push(play(B, skilled((B.seed ^ 0x51) + i * 977, AIM)).score);
    sc.sort(function (a, b) { return a - b; });
    var med = sc[Math.floor(sc.length / 2)];
    B.th = STAR_K.map(function (f) { return Math.max(10, Math.round(med * f / 5) * 5); });
    B.med = med;
    return B.th;
  }
  function stars(B, score) { var t = thresholds(B); return score >= t[2] ? 3 : score >= t[1] ? 2 : score >= t[0] ? 1 : 0; }

  /* Saves: the board and its drops. A drop in progress is saved as it left and replayed
     on restore, so leaving mid-grab never gives a try back or changes its outcome. */
  function snapshot(Rd) { return { seed: Rd.B.seed, level: Rd.B.level, drops: Rd.drops.map(function (d) { return { x: d.x, s: d.s, sv: d.sv, clock: d.clock }; }) }; }
  function num(x) { return typeof x === 'number' && isFinite(x); }
  function restore(o) {
    if (!o || typeof o !== 'object' || !Array.isArray(o.drops)) return null;
    if (o.seed !== (o.seed >>> 0) || o.level !== (o.level | 0) || o.level < 0 || o.level > LEVELS) return null;
    if (o.drops.length > TRIES) return null;
    var B = o.level ? make(o.seed, o.level) : daily(o.seed), Rd = round(B);
    for (var i = 0; i < o.drops.length; i++) {
      var d = o.drops[i];
      if (!d || !num(d.x) || !num(d.s) || !num(d.sv) || d.clock !== (d.clock | 0)) return null;
      if (d.x < home(B) - 1e-9 || d.x > W - 4 + 1e-9 || d.clock < Rd.clock || Math.abs(d.s) > 30 || Math.abs(d.sv) > 200 || !Rd.toys.length) return null;
      Rd.cx = d.x; Rd.s = d.s; Rd.sv = d.sv; Rd.clock = d.clock; Rd.v = 0;
      finishDrop(Rd, drop(Rd));
      Rd.drops[i] = { x: d.x, s: d.s, sv: d.sv, clock: d.clock };
    }
    return Rd;
  }

  var api = {
    W: W, H: H, FLOOR: FLOOR, TOP: TOP, PRONG: PRONG, DT: DT, LEVELS: LEVELS, TRIES: TRIES, KINDS: KINDS, KIND_IDS: KIND_IDS, STAR_K: STAR_K, AIM: AIM, REACH: REACH,
    rng: rng, params: params, make: make, level: level, daily: daily, home: home, shift: shift, tolA: tolA, tolB: tolB,
    round: round, over: over, move: move, drop: drop, step: step, finishDrop: finishDrop, place: place, descentSteps: descentSteps, lead: lead,
    play: play, skilled: skilled, randomPlayer: randomPlayer, fixedPlayer: fixedPlayer, thresholds: thresholds, stars: stars, snapshot: snapshot, restore: restore
  };
  if (typeof self !== 'undefined') self.ClawEngine = api;
  return api;
}
if (typeof module !== 'undefined' && module.exports) module.exports = ClawEngineFactory;
/* ==== ENGINE END ==== */
</script>
<script>
(function () {
  'use strict';
  var C = window.Chogan, el = C.el;
  var E = ClawEngineFactory();
  // a deep plum, apart from every other game's colour; white text on it passes 4.5:1 (#949)
  var ACCENT = '#783053';

  C.boot({});
  var ctx = C.game({
    id: 'claw',
    name: { fa: 'چنگک', en: 'Grabber', zh: '抓娃娃', de: 'Greifer', es: 'Gancho', pl: 'Chwytak', fr: 'Grappin', ar: 'المخلب', hi: 'पंजा' },
    accent: ACCENT,
    mood: 'dots',
    strings: {
      fa: {
        cwScene: 'دستگاه چنگک با عروسک‌ها و دریچه', cwLevelN: 'دستگاه {n}', cwDaily: 'دستگاه روزانه', cwTriesN: 'نوبت: {n}', cwScoreN: 'امتیاز: {n}',
        cwHint: 'چنگک را بالای یک عروسک ببر و «بنداز» را بزن.', cwSwingHint: 'سر چنگک تاب می‌خورد؛ صبر کن آرام شود.', cwBeltHint: 'کف دستگاه حرکت می‌کند؛ کمی جلوتر بنداز.', cwLast: 'نوبت آخر!',
        cwGot: 'گرفتی! +{n}', cwSlip: 'لیز خورد…', cwMiss: 'خالی', cwNudge: 'هلش دادی',
        cwCleared: 'دستگاه تمام شد!', cwNoStar: 'این بار ستاره‌ای نشد', cwNext: 'دستگاه بعدی', cwRetry: 'دوباره همین دستگاه',

      g.restore();
    });

    // the claw: carriage, cable, head and prongs
    var cx = Rd.cx, y = A ? A.y : E.TOP, gx = cx + Rd.s, open = A ? A.open : 1;
    if (prefs.line && !A && !ended && !E.over(Rd)) {
      g.strokeStyle = P.line; g.lineWidth = Math.max(1, X(0.4)); g.setLineDash([X(1.5), X(1.5)]);
      g.beginPath(); g.moveTo(X(gx), X(y + E.PRONG)); g.lineTo(X(gx), X(E.FLOOR)); g.stroke();
      g.setLineDash([]);
    }
    g.fillStyle = P.metal2;
    C.rrect(g, X(cx - 4), X(3.5), X(8), X(4), X(1)); g.fill();
    g.strokeStyle = P.cable; g.lineWidth = Math.max(1, X(0.5));
    g.beginPath(); g.moveTo(X(cx), X(7.5)); g.lineTo(X(gx), X(y)); g.stroke();
    if (A && A.held) drawToy(g, A.held.k, X(cx + A.hx), X(y + E.PRONG + A.held.r * 0.6), X(A.held.r));
    g.fillStyle = P.metal;
    g.beginPath(); g.arc(X(gx), X(y + 0.5), X(2.4), Math.PI, 0); g.fill();
    g.fillRect(X(gx - 2.4), X(y + 0.5), X(4.8), X(1.4));
    g.strokeStyle = P.metal2; g.lineWidth = Math.max(1.5, X(0.9)); g.lineCap = 'round';
    var spread = 1.2 + open * 3.2;
    [-1, 1].forEach(function (sd) {
      g.beginPath();
      g.moveTo(X(gx + sd * 1.8), X(y + 1.8));
      g.lineTo(X(gx + sd * (1.8 + spread)), X(y + E.PRONG * 0.6));
      g.lineTo(X(gx + sd * (0.9 + spread * 0.55)), X(y + E.PRONG));
      g.stroke();
    });
    g.lineCap = 'butt';

    // glass shine
    g.fillStyle = P.glass;
    g.beginPath(); g.moveTo(X(70), 0); g.lineTo(X(82), 0); g.lineTo(X(58), X(E.H)); g.lineTo(X(46), X(E.H)); g.closePath(); g.fill();

    // points rising from the chute
    pops.forEach(function (p) {
      g.globalAlpha = Math.max(0, 1 - p.t);
      g.font = font(Math.max(12, X(5)), 800); g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = p.star ? P.star : P.text;
      g.fillText(p.text, X(p.x), X(p.y - (still ? 0 : p.t * 10)));
      g.globalAlpha = 1;
    });
    g.restore();
    g.restore();
    void t;
  }

  /* -------------------------------------------------------------- input */

  // the claw heads for the finger anywhere on the machine; it moves at the machine's
  // speed, so a long drag takes time, as on a real cabinet
  function aimAt(e) {
    var r = cv.getBoundingClientRect(), V = view();
    target = (e.clientX - r.left - V.ox) / V.k;
    kick();
  }
  cv.addEventListener('pointerdown', function (e) {
    if (busy()) return;
    dragging = true;
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* an old WebView */ }
    aimAt(e);
    e.preventDefault();
  });
  cv.addEventListener('pointermove', function (e) { if (dragging && !busy()) aimAt(e); });
  cv.addEventListener('pointerup', function () { dragging = false; });
  cv.addEventListener('pointercancel', function () { dragging = false; });

  window.addEventListener('keydown', function (e) {
    if (!Rd || e.target && e.target.closest && e.target.closest('.ch-modal')) return;
    var k = e.key;
    if (k === 'ArrowLeft' || C.keyIs(e, 'a')) { e.preventDefault(); if (!busy()) { keyDir = -1; target = null; kick(); } }
    else if (k === 'ArrowRight' || C.keyIs(e, 'd')) { e.preventDefault(); if (!busy()) { keyDir = 1; target = null; kick(); } }
    else if (k === ' ' || k === 'Enter' || k === 'ArrowDown') { if (!e.repeat) { e.preventDefault(); drop(); } }
    else if (C.keyIs(e, 'r') && !dailyDate) { e.preventDefault(); restartAsk(); }
    else if (C.keyIs(e, 'l') && !dailyDate) { e.preventDefault(); showLevels(); }
  });
  window.addEventListener('keyup', function (e) {
    var k = e.key;
    if ((k === 'ArrowLeft' || C.keyIs(e, 'a')) && keyDir < 0) keyDir = 0;
    if ((k === 'ArrowRight' || C.keyIs(e, 'd')) && keyDir > 0) keyDir = 0;
  });
  window.addEventListener('blur', function () { keyDir = 0; dragging = false; });

  C.onPause(function () { paused = true; dragging = false; keyDir = 0; ctx.save(); });
  C.onResume(function () { paused = false; last = 0; kick(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { last = 0; kick(); } });
  if (window.ResizeObserver) new ResizeObserver(function () { draw(); }).observe(box);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fontFam = ''; draw(); });
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { draw(); }); } catch (er) { /* old WebViews */ } }

  /* ----------------------------------------------------- machines, gear */

  function restartAsk() {
    if (!Rd) return;
    if (Rd.drops.length > 0 && !ended) C.ui.confirm({ title: C.t('restart'), body: C.t('resetWarn'), onOk: function () { ctx.clearSave(); startRound(Rd.B.level); } });
    else startRound(Rd.B.level);
  }
  function showLevels() {
    if (dailyDate) return;
    var grid = el('div', { class: 'cw-levels' }), m = null;
    for (var i = 0; i < E.LEVELS; i++) {
      (function (n) {
        var locked = n > prog.unlocked, best = prog.best[n - 1], kids = [el('b', { text: C.num(n) })];
        if (locked) kids.push(C.icon('lock', 14));
        else if (best) {
          var sr = el('span', { class: 'cw-lv__stars' });
          for (var s = 1; s <= 3; s++) { var ic = C.icon('star', 11); if (s <= best.stars) ic.setAttribute('fill', 'currentColor'); else ic.style.opacity = '.4'; sr.appendChild(ic); }
          kids.push(sr);
        }
        var b = el('button', {
          class: 'cw-lv' + (Rd && n === Rd.B.level ? ' cw-lv--on' : '') + (best ? ' cw-lv--done' : ''),
          type: 'button', disabled: locked,
          'aria-label': C.t('cwLevelN', { n: C.num(n) }) + (locked ? ' — ' + C.t('cwLocked') : '')
        }, kids);
        b.addEventListener('click', function () {
          if (m) m.close();
          if (Rd && Rd.drops.length > 0 && !ended) C.ui.confirm({ title: C.t('restart'), body: C.t('resetWarn'), onOk: function () { ctx.clearSave(); startRound(n); } });
          else startRound(n);
        });
        grid.appendChild(b);
      })(i + 1);
    }
    m = C.ui.modal({ title: C.t('cwChoose'), body: [grid], actions: [{ label: C.t('cancel') }] });
  }
  function showSettings() {
    var sw = C.ui.switch(prefs.line, function (v) { prefs.line = !!v; ctx.store.set('prefs', prefs); draw(); });
    C.ui.modal({
      title: C.t('settings'), closeButton: true,
      body: [el('div', { class: 'ch-list' }, [el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: C.t('cwAimLine') }), sw])])],
      actions: [{ label: C.t('done'), kind: 'primary' }]
    });
  }

  /* --------------------------------------------------------------- help */

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    var keys = [kb('← → / A D', C.t('cwKMove')), kb('Space / Enter / ↓', C.t('cwKDrop'))];
    if (!dailyDate) keys.push(kb('L', C.t('cwChoose')), kb('R', C.t('cwKAgain')));
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('cwRules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, keys)
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  function tArt(kind) {
    var s = '<svg viewBox="0 0 200 110" width="100%" direction="ltr"><rect width="200" height="110" rx="10" fill="#F6E6EE"/>' +
      '<rect x="10" y="10" width="180" height="3" rx="1.5" fill="#8C5B74"/><rect x="10" y="94" width="180" height="12" fill="#E9D2DD"/>' +
      '<rect x="10" y="84" width="26" height="22" fill="#3A1F2D"/>';
    var cx = kind === 1 ? 120 : 104, gy = kind === 1 ? 30 : 62;
    s += '<circle cx="80" cy="85" r="9" fill="#F7CB3C" stroke="#5a3a48"/><circle cx="104" cy="83" r="11" fill="#B07A4E" stroke="#5a3a48"/><circle cx="150" cy="86" r="8" fill="#4FA3E0" stroke="#5a3a48"/>';
    s += '<rect x="' + (cx - 8) + '" y="8" width="16" height="7" rx="2" fill="#5E4D57"/><path d="M' + cx + ' 15 V' + gy + '" stroke="#6F5E68" stroke-width="1.5"/>' +
      '<path d="M' + (cx - 4) + ' ' + gy + ' l-7 9 l3 6 M' + (cx + 4) + ' ' + gy + ' l7 9 l-3 6" stroke="#5E4D57" stroke-width="2.5" fill="none" stroke-linecap="round"/>' +
      '<circle cx="' + cx + '" cy="' + gy + '" r="5" fill="#9A8A93"/>';
    if (kind === 1) s += '<path d="M60 40 H96 M96 40 L90 35 M96 40 L90 45" stroke="' + ACCENT + '" stroke-width="2.5" stroke-linecap="round" fill="none"/>';
    if (kind === 2) s += '<path d="M104 74 V96" stroke="' + ACCENT + '" stroke-width="1.5" stroke-dasharray="3 3"/><text x="160" y="40" font-size="14" font-weight="700" font-family="sans-serif" fill="' + ACCENT + '">✓</text>';
    if (kind === 3) s += '<path d="M' + (cx - 14) + ' 40 q14 10 28 0" stroke="' + ACCENT + '" stroke-width="2" fill="none" stroke-dasharray="3 3"/><path d="M60 100 H140 M140 100 l-5 -4 M140 100 l-5 4" stroke="' + ACCENT + '" stroke-width="2" fill="none"/>';
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('cwTut1'), text: C.t('cwTutText1'), art: tArt(1) },
    { title: C.t('cwTut2'), text: C.t('cwTutText2'), art: tArt(2) },
    { title: C.t('cwTut3'), text: C.t('cwTutText3'), art: tArt(3) }
  ];

  /* -------------------------------------------------------------- start */

  // saved at every drop and after every grab: a grab in progress comes back as the drop
  // that started it and finishes at once, exactly as it would have
  ctx.autosave(function () {
    if (!Rd || ended || E.over(Rd) || !Rd.drops.length) return { inProgress: false };
    return { r: E.snapshot(Rd), daily: dailyDate || null, tries: tries, elapsed: Date.now() - startedAt };
  });
  function resume(sv) {
    if (!sv || typeof sv !== 'object' || (sv.daily || null) !== (dailyDate || null)) return false;
    var R = E.restore(sv.r);
    if (!R) return false;
    // a save must be on the machine it claims: the day's machine, or an open campaign one
    if (dailyDate ? R.B.seed !== dailySeed || R.B.level !== 0 : R.B.seed !== E.level(R.B.level).seed || R.B.level < 1 || R.B.level > prog.unlocked) return false;
    if (!dailyDate) R.B.th = E.level(R.B.level).th;
    Rd = R;
    tries = sv.tries >= 1 ? sv.tries | 0 : 1;
    startedAt = Date.now() - (sv.elapsed > 0 ? sv.elapsed : 0);
    begin();
    if (!dailyDate) { prog.cur = Rd.B.level; saveProg(); }
    if (E.over(Rd)) setTimeout(finish, 300);
    return true;
  }
  var saved = ctx.loadSave();
  if (!(saved && resume(saved))) startRound(prog.cur);
  if (dailyDate && C.stats.dailyDone('claw', dailyDate)) {
    var rec = C.stats.dailyOf(dailyDate).claw;
    C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
  }
  ctx.tutorialIfNew(TUT);
})();
</script>
