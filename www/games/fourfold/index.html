  /* The board and pieces are the game's own: a pale wood board in the light theme and a dark

  :root { --ff-board: #D8CCD3; --ff-cell: #EFE8EC; --ff-lf: #F6E7C8; --ff-ls: #E0C690; --ff-le: #8A6A3A; --ff-lh: #B89660;
    --ff-d: #5B3A55; --ff-ds: #3E2539; --ff-de: #2A1727; --ff-dh: #2E1B2A; --ff-ring: #584A5A; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ff-board: #1E191C; --ff-cell: #2C262A; --ff-lf: #F2E2C0; --ff-ls: #CDB07A; --ff-le: #A88A55; --ff-lh: #8C7046;
      --ff-d: #9C6A90; --ff-ds: #74486A; --ff-de: #1A1219; --ff-dh: #4A2C43; --ff-ring: #E3BFD8; }
  }
  :root[data-theme="dark"] { --ff-board: #1E191C; --ff-cell: #2C262A; --ff-lf: #F2E2C0; --ff-ls: #CDB07A; --ff-le: #A88A55; --ff-lh: #8C7046;

  @container game (min-aspect-ratio: 5 / 4) and (min-height: 600px) { .fo-wrap .fo-tray { grid-template-columns: repeat(4, minmax(44px, 1fr)); } }

    box-shadow: var(--sh-1); cursor: pointer; display: grid; place-items: center; touch-action: manipulation; -webkit-tap-highlight-color: transparent;

  .fo-slot--gone { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c-line, rgba(127, 127, 127, .25)); cursor: default; }
  .fo-slot--gone .fo-pc { visibility: hidden; }

<script>
/* ==== ENGINE START ==== */
function FourfoldEngineFactory() {
  'use strict';

  // Sixteen pieces, each a 4-bit number: bit 1 tall, 2 dark, 4 round, 8 hollow. The board is
  // 4×4, index r * 4 + c. One player hands a piece over, the other places it and then hands
  // the next one. Completing a line of four that all have, or all lack, any one trait wins
  // for whoever placed the fourth piece.
  var PIECES = 16, TRAITS = [1, 2, 4, 8], LEVELS = ['easy', 'medium', 'hard'], WIN = 100;
  var LINES = [];
  for (var r0 = 0; r0 < 4; r0++) LINES.push([r0 * 4, r0 * 4 + 1, r0 * 4 + 2, r0 * 4 + 3]);
  for (var c0 = 0; c0 < 4; c0++) LINES.push([c0, c0 + 4, c0 + 8, c0 + 12]);
  LINES.push([0, 5, 10, 15], [3, 6, 9, 12]);
  var CELL_LINES = [];
  for (var i0 = 0; i0 < 16; i0++) CELL_LINES.push(LINES.filter(function (l) { return l.indexOf(i0) >= 0; }));

  function shares(ps) {
    if (!ps || ps.length !== 4) return false;
    var and = 15, or = 0;
    for (var k = 0; k < 4; k++) { var p = ps[k]; if (!(p >= 0 && p < 16)) return false; and &= p; or |= p; }
    return (and | (~or & 15)) !== 0;
  }
  // who places the nth piece (0-based): the player who did not hand over first
  function placer(S, n) { return n % 2 === 0 ? 1 - S.first : S.first; }
  function count(board) { var n = 0; for (var i = 0; i < 16; i++) if (board[i] >= 0) n++; return n; }

  function newGame(first) {
    var f = first === 1 ? 1 : 0, b = [];
    for (var i = 0; i < 16; i++) b.push(-1);
    return { board: b, hand: -1, turn: f, phase: 'give', first: f, winner: -1, draw: false, plies: 0, last: -1 };
  }
  function clone(S) {
    return { board: S.board.slice(), hand: S.hand, turn: S.turn, phase: S.phase, first: S.first, winner: S.winner, draw: S.draw, plies: S.plies, last: S.last };
  }
  function over(S) { return S.winner >= 0 || S.draw; }
  function give(S, p) {
    if (S.phase !== 'give' || over(S) || !(p === (p | 0) && p >= 0 && p < 16) || S.board.indexOf(p) >= 0) return false;
    S.hand = p; S.phase = 'place'; S.turn = 1 - S.turn; S.plies++;
    return true;
  }
  function lineWins(board, l) { return shares([board[l[0]], board[l[1]], board[l[2]], board[l[3]]]); }
  function place(S, c) {
    if (S.phase !== 'place' || over(S) || !(c === (c | 0) && c >= 0 && c < 16) || S.board[c] !== -1) return false;
    S.board[c] = S.hand; S.last = c; S.hand = -1; S.plies++; S.phase = 'give';
    if (CELL_LINES[c].some(function (l) { return lineWins(S.board, l); })) S.winner = S.turn;
    else if (count(S.board) === 16) S.draw = true;
    return true;
  }
  function winningLines(board) { return LINES.filter(function (l) { return lineWins(board, l); }); }
  function winningLine(board) { var w = winningLines(board); return w.length ? w[0].slice() : null; }
  function avail(S) { var out = []; for (var p = 0; p < 16; p++) if (S.board.indexOf(p) < 0 && p !== S.hand) out.push(p); return out; }

  // A save is restored only if it is a position the rules can reach
  function valid(S) {
    if (!S || typeof S !== 'object' || !Array.isArray(S.board) || S.board.length !== 16) return false;
    var seen = {}, n = 0;
    for (var i = 0; i < 16; i++) {
      var x = S.board[i];
      if (x !== (x | 0) || x < -1 || x > 15) return false;
      if (x >= 0) { if (seen[x]) return false; seen[x] = true; n++; }
    }
    if ((S.first !== 0 && S.first !== 1) || (S.turn !== 0 && S.turn !== 1) || typeof S.draw !== 'boolean' || S.plies !== (S.plies | 0)) return false;
    if (S.last !== -1 && !(S.last === (S.last | 0) && S.last >= 0 && S.last < 16 && S.board[S.last] >= 0)) return false;
    var wins = winningLines(S.board);
    if (S.phase === 'place') {
      if (!(S.hand === (S.hand | 0) && S.hand >= 0 && S.hand < 16) || seen[S.hand]) return false;
      if (n >= 16 || S.plies !== 2 * n + 1 || S.turn !== placer(S, n) || S.winner !== -1 || S.draw || wins.length) return false;
      return true;
    }
    if (S.phase !== 'give' || S.hand !== -1 || S.plies !== 2 * n) return false;
    if (S.turn !== (n === 0 ? S.first : placer(S, n - 1))) return false;
    if (wins.length) {
      if (S.winner !== placer(S, n - 1) || S.draw) return false;
      if (S.last >= 0 && !wins.every(function (l) { return l.indexOf(S.last) >= 0; })) return false;
    } else if (S.winner !== -1) return false;
    return S.draw === (n === 16 && !wins.length);
  }

  /* ------------------------------------------------------------ search */

  // WINMASK[A * 16 + Z]: the pieces that complete a line whose three pieces all have the
  // traits in A and all lack the traits in Z. danger(board) is the set of pieces that would
  // win somewhere at once, so "is this piece safe to hand over" is one bit test.
  var WINMASK = [];
  for (var A = 0; A < 16; A++) for (var Z = 0; Z < 16; Z++) {
    var m = 0;
    for (var p0 = 0; p0 < 16; p0++) if (((A & p0) | (Z & ~p0 & 15)) !== 0) m |= 1 << p0;
    WINMASK[A * 16 + Z] = m;
  }
  function danger(board) {
    var d = 0;
    for (var k = 0; k < 10; k++) {
      var l = LINES[k], a = 15, z = 15, empty = 0;
      for (var j = 0; j < 4; j++) { var x = board[l[j]]; if (x < 0) empty++; else { a &= x; z &= ~x & 15; } }
      if (empty === 1) d |= WINMASK[a * 16 + z];
    }
    return d;
  }
  function winsAt(board, p) {
    var out = [];
    for (var c = 0; c < 16; c++) {
      if (board[c] !== -1) continue;
      board[c] = p;
      if (CELL_LINES[c].some(function (l) { return lineWins(board, l); })) out.push(c);
      board[c] = -1;
    }
    return out;
  }
  function bits(m) { var out = []; for (var p = 0; p < 16; p++) if ((m >> p) & 1) out.push(p); return out; }
  function shuffle(a, rnd) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function availMask(S) { var m = 0; for (var p = 0; p < 16; p++) if (S.board.indexOf(p) < 0 && p !== S.hand) m |= 1 << p; return m; }
  function emptyCells(board) { var out = []; for (var c = 0; c < 16; c++) if (board[c] === -1) out.push(c); return out; }

  var nodes = 0, deadline = 0, ABORT = { abort: true };
  // Negamax for the player who must place `hand`; dm is danger(board). A win is worth more
  // the sooner it comes, so the bot takes a quick win and drags out a loss.
  function search(board, hand, av, empties, depth, alpha, beta, dm) {
    if ((++nodes & 1023) === 0 && deadline && Date.now() > deadline) throw ABORT;
    if ((dm >> hand) & 1) return WIN + empties;
    if (empties === 1 || depth === 0) return 0;
    var best = -Infinity;
    for (var c = 0; c < 16; c++) {
      if (board[c] !== -1) continue;
      board[c] = hand;
      var d2 = danger(board), safe = av & ~d2, v;
      if (!safe) v = -(WIN + empties - 1);
      else {
        v = -Infinity;
        for (var g = 0; g < 16; g++) {
          if (!((safe >> g) & 1)) continue;
          var s = -search(board, g, av & ~(1 << g), empties - 1, depth - 1, -beta, -Math.max(alpha, v), d2);
          if (s > v) v = s;
          if (v >= beta) break;
        }
      }
      board[c] = -1;
      if (v > best) best = v;
      if (best > alpha) alpha = best;
      if (alpha >= beta) break;
    }
    return best;
  }
  function rootPlace(S, depth, rnd) {
    var board = S.board.slice(), hand = S.hand, av = availMask(S), cells = shuffle(emptyCells(board), rnd), empties = cells.length;
    var wins = winsAt(board, hand);
    if (wins.length) return { cell: wins[Math.floor(rnd() * wins.length)], give: -1, v: WIN + empties };
    if (empties === 1) return { cell: cells[0], give: -1, v: 0 };
    var best = null;
    cells.forEach(function (c) {
      board[c] = hand;
      var d2 = danger(board), safe = shuffle(bits(av & ~d2), rnd);
      if (!safe.length) {
        var all = bits(av), v0 = -(WIN + empties - 1);
        if (!best || v0 > best.v) best = { cell: c, give: all[Math.floor(rnd() * all.length)], v: v0 };
      }
      safe.forEach(function (g) {
        var alpha = best ? best.v : -Infinity;
        var v = -search(board, g, av & ~(1 << g), empties - 1, depth - 1, -Infinity, -alpha, d2);
        if (!best || v > best.v) best = { cell: c, give: g, v: v };
      });
      board[c] = -1;
    });
    return best;
  }
  function rootGive(S, depth, rnd) {
    var board = S.board, av = availMask(S), list = shuffle(bits(av), rnd), empties = emptyCells(board).length, dm = danger(board), best = null;
    list.forEach(function (g) {
      var v;
      if ((dm >> g) & 1) v = -(WIN + empties);
      else {
        var alpha = best ? best.v : -Infinity;
        v = -search(board.slice(), g, av & ~(1 << g), empties, depth, -Infinity, -alpha, dm);
      }
      if (!best || v > best.v) best = { cell: -1, give: g, v: v };
    });
    return best;
  }

  // easy: often misses; medium: looks one placement ahead, so it takes any win and never hands
  // over a winning piece when it has a choice; hard: deepens until its time budget runs out
  // and keeps the answer of the last depth it finished.
  function think(S, level, rnd, opts) {
    rnd = rnd || Math.random;
    opts = opts || {};
    if (over(S)) return { cell: -1, give: -1 };
    var giving = S.phase === 'give';
    if (level === 'easy') {
      if (giving) {
        var safe = bits(availMask(S) & ~danger(S.board)), all = avail(S);
        var pool = safe.length && rnd() < 0.5 ? safe : all;
        return { cell: -1, give: pool[Math.floor(rnd() * pool.length)] };
      }
      var w = winsAt(S.board, S.hand), cells = emptyCells(S.board);
      return { cell: w.length && rnd() < 0.6 ? w[0] : cells[Math.floor(rnd() * cells.length)], give: -1 };
    }
    deadline = 0;
    var res = giving ? rootGive(S, 1, rnd) : rootPlace(S, 1, rnd);
    if (level === 'hard' && Math.abs(res.v) < WIN) {
      var empties = emptyCells(S.board).length;
      nodes = 0;
      deadline = Date.now() + (opts.budget || 150);
      try {
        for (var d = 2; d <= empties; d++) {
          var r = giving ? rootGive(S, d, rnd) : rootPlace(S, d, rnd);
          res = r;
          if (Math.abs(r.v) >= WIN) break;
        }
      } catch (e) { if (e !== ABORT) throw e; }
      deadline = 0;
    }
    return { cell: res.cell, give: res.give };
  }

  // The day's game: four pieces already down with no line, and a piece in your hand that has
  // no winning cell yet and leaves you at least one safe answer
  function dailyPosition(rnd) {
    for (var tries = 0; tries < 500; tries++) {
      var pcs = shuffle(Array.from({ length: 16 }, function (x, i) { return i; }), rnd);
      var cells = shuffle(Array.from({ length: 16 }, function (x, i) { return i; }), rnd);
      var board = [];
      for (var i = 0; i < 16; i++) board.push(-1);
      for (var k = 0; k < 4; k++) board[cells[k]] = pcs[k];
      if (winningLines(board).length) continue;
      var dm = danger(board), rest = pcs.slice(4), hand = -1;
      for (var h = 0; h < rest.length && hand < 0; h++) {
        var p = rest[h];
        if ((dm >> p) & 1) continue;
        var others = 0;
        rest.forEach(function (q) { if (q !== p) others |= 1 << q; });
        var ok = emptyCells(board).some(function (c) { board[c] = p; var fine = (others & ~danger(board)) !== 0; board[c] = -1; return fine; });
        if (ok) hand = p;
      }
      if (hand < 0) continue;
      return { board: board, hand: hand, turn: 0, phase: 'place', first: 1, winner: -1, draw: false, plies: 9, last: -1 };
    }
    return null;
  }

  return { PIECES: PIECES, TRAITS: TRAITS, LINES: LINES, CELL_LINES: CELL_LINES, LEVELS: LEVELS, shares: shares, newGame: newGame, clone: clone,
    give: give, place: place, avail: avail, winningLine: winningLine, winningLines: winningLines, winsAt: winsAt, danger: danger, valid: valid,
    think: think, dailyPosition: dailyPosition };
}
if (typeof module !== 'undefined') module.exports = FourfoldEngineFactory;
/* ==== ENGINE END ==== */
</script>

    name: { fa: 'چهارگانه', en: 'Fourfold', zh: '四同棋', de: 'Vierfalt', es: 'Cuádruple', pl: 'Czworaki', fr: 'Quadruple', ar: 'الرباعية', hi: 'चौगुना', ru: 'Четвёрка' },
    accent: '#584A5A',
    mood: 'sudoku',
    strings: {

        newMatch: 'بازی تازه', begin: 'شروع', undoMove: 'برگرداندن حرکت', endWarn: 'بازی فعلی تمام می‌شود. ادامه؟', settingsT: 'بازی تازه',
        yourPlace: 'مهره‌ای را که گرفتی در یک خانه‌ی خالی بگذار', yourGive: 'مهره‌ای برای {n} انتخاب کن و «بده» را بزن',
        placeOf: 'نوبت {n}: مهره را بگذار', giveOf: 'نوبت {n}: مهره‌ای برای {m} انتخاب کن', thinking: 'ربات فکر می‌کند…', giveBtn: 'بده',

        tTall: 'alta', tShort: 'baja', tDark: 'oscura', tLight: 'clara', tRound: 'redonda', tSquare: 'cuadrada', tHollow: 'hueca', tSolid: 'maciza', emptyCell: 'Casilla vacía'

  var params = new URLSearchParams(location.search);
  var dailyDate = params.get('daily');
  var MODES = ['bot', 'two'];
  var prefs = ctx.store.get('prefs', null);
  if (!prefs) prefs = { mode: 'bot', level: 'medium' };

  if (E.LEVELS.indexOf(prefs.level) < 0) prefs.level = 'medium';

  /* ------------------------------------------------------------ pieces */

  // A piece drawn as a small block seen from above at an angle: a cylinder or a box, tall or
  // short, with a hole in its top when hollow. Each part is a path, so the share card can draw
  // the same shapes on a canvas with Path2D.
  function ell(cx, cy, rx, ry) {

  }

      out.push(['t', 'M23,' + T + ' L50,' + (T - 12) + ' L77,' + T + ' L50,' + (T + 12) + ' Z']);
      if (p & 8) out.push(['h', 'M39,' + T + ' L50,' + (T - 5) + ' L61,' + T + ' L50,' + (T + 5) + ' Z']);

  /* ------------------------------------------------------------ setup */

  function newGame(o) {

    G.hist.length = k;
    sel = -1;
    C.feedback('soft');
    render(); save();
    maybeBot();
  }

  /* ------------------------------------------------------------ result */

  function pname(side) {
    if (G.mode === 'bot') return side === 0 ? (C.state.profile.name || C.t('you')) : C.t('bot') + ' · ' + C.t(G.level);
    return C.t('playerN', { n: C.num(side + 1) });
  }

  function finish() {

    var S = G.S, vsBot = G.mode === 'bot', draw = S.draw, won = vsBot && !draw && S.winner === 0;

    var share = won || !vsBot ? 1 : draw ? 0.6 : 0.3;

    var title = draw ? C.t('drawn') : vsBot ? (won ? C.t('won') : C.t('lost')) : C.t('playerWon', { n: pname(S.winner) });
    if (G.daily) {
      var first = C.stats.daily('fourfold', G.daily, { label: title, win: won });

    }

    if (!draw && !C.ui.reduceMotion()) {
      (E.winningLines(S.board)).forEach(function (l) {
        l.forEach(function (c, k) { setTimeout(function () { C.ui.burst(cells[c], { count: 10, colors: ['#E3BFD8', '#584A5A', '#F6E7C8'] }); }, 80 * k); });

  }

  /* ------------------------------------------------------------- saves */

  ctx.autosave(function () {

  function save() { ctx.save(); }

      hand.setAttribute('data-k', hk);

      hand.setAttribute('aria-label', C.t('handL') + (show >= 0 ? ': ' + traits(show) : ''));

    if (G.done) return;
    var line;
    if (isBot(t)) line = C.t('thinking');
    else if (S.phase === 'place') line = G.mode === 'bot' ? C.t('yourPlace') : C.t('placeOf', { n: pname(t) });
    else line = G.mode === 'bot' ? C.t('yourGive', { n: C.t('bot') }) : C.t('giveOf', { n: pname(t), m: pname(1 - t) });

    if (!isBot(t) && S.phase === 'give' && sel >= 0) {

  /* -------------------------------------------------------------- input */

  function trayCols() {
    var n = getComputedStyle(tray).gridTemplateColumns.split(' ').filter(Boolean).length;
    return n > 0 ? n : 8;
  }
  window.addEventListener('keydown', function (e) {
    if (!G || document.querySelector('.ch-scrim')) return;
    if (C.undoKey(e)) { undo(); e.preventDefault(); return; }
    if (busy() || e.ctrlKey || e.metaKey || e.altKey) return;
    var tg = e.target && e.target.tagName;
    if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT') return;
    var S = G.S;
    if (C.keyIs(e, 'g') && S.phase === 'give' && sel >= 0) { e.preventDefault(); doGive(sel); return; }
    // the board and the tray are laid out left to right in every language, so the arrows are
    // geometric and never flip in RTL (#338)
    var d = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
    if (d) {
      e.preventDefault();
      if (!kbOn) { kbOn = true; render(); return; }
      if (S.phase === 'place') {
        var r = Math.floor(curCell / 4) + d[1], c = curCell % 4 + d[0];
        if (r >= 0 && r < 4 && c >= 0 && c < 4) curCell = r * 4 + c;
      } else {
        var n = trayCols(), next = curSlot + d[0] + d[1] * n;
        if (next >= 0 && next < 16 && (d[1] !== 0 || Math.floor(next / n) === Math.floor(curSlot / n))) curSlot = next;
      }
      render(); return;
    }
    if ((e.key === 'Enter' || e.key === ' ') && kbOn && tg !== 'BUTTON') {
      e.preventDefault();
      if (S.phase === 'place') { if (S.board[curCell] === -1) doPlace(curCell); else C.feedback('bad'); }
      else if (S.board.indexOf(curSlot) >= 0) C.feedback('bad');
      else if (sel === curSlot) doGive(curSlot);
      else { sel = curSlot; render(); }
    }
  });

  /* --------------------------------------------------------------- help */

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [kb('← ↑ → ↓', C.t('kCursor')), kb('Space / Enter', C.t('kGo')), kb('G', C.t('kGive')), kb('U / Ctrl+Z', C.t('undoMove'))])
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  // small scenes for the tutorial, drawn with the same pieces
  function tPiece(p, x, y, s, extra) {
    return '<g class="fo-pc fo-pc--' + (p & 2 ? 'd' : 'l') + '" transform="translate(' + x + ',' + y + ') scale(' + s + ')"' + (extra || '') + '>' + pieceInner(p) + '</g>';
  }
  function tArt(kind) {
    var s = '<svg viewBox="0 0 200 110" width="100%">', k;
    if (kind === 1) {
      // four tall pieces in a row, otherwise all different
      var row = [1, 7, 11, 13];
      s += '<rect x="6" y="18" width="188" height="64" rx="12" fill="#D8CCD3"/>';
      for (k = 0; k < 4; k++) s += '<circle cx="' + (31 + k * 46) + '" cy="50" r="21" fill="#EFE8EC" stroke="#584A5A" stroke-width="3"/>' + tPiece(row[k], 11 + k * 46, 28, 0.4);
      s += '<text x="100" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#584A5A">↑ ↑ ↑ ↑</text>';
    } else if (kind === 2) {
      // a piece arrives from the opponent's side and goes into the empty cell
      s += '<rect x="96" y="14" width="98" height="82" rx="12" fill="#D8CCD3"/>';
      for (k = 0; k < 4; k++) s += '<circle cx="' + (121 + (k % 2) * 48) + '" cy="' + (35 + Math.floor(k / 2) * 40) + '" r="16" fill="#EFE8EC"/>';
      s += tPiece(4, 105, 59, 0.32) + tPiece(10, 153, 19, 0.32) + tPiece(15, 105, 19, 0.32);
      s += '<rect x="12" y="34" width="46" height="46" rx="10" fill="#EFE8EC" stroke="#584A5A" stroke-width="2" stroke-dasharray="4 3"/>' + tPiece(3, 14, 36, 0.42);
      s += '<path d="M62,57 C90,57 120,72 150,72" fill="none" stroke="#584A5A" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 5"/>';
      s += '<circle cx="169" cy="75" r="16" fill="none" stroke="#584A5A" stroke-width="3"/>';
    } else {
      // the tray: hand over a safe piece, never the one that completes a line
      var tr = [0, 6, 9, 12, 5, 14];
      for (k = 0; k < 6; k++) {
        var x = 10 + k * 31;
        s += '<rect x="' + x + '" y="30" width="28" height="28" rx="6" fill="#FFFFFF" stroke="' + (k === 1 ? '#584A5A' : '#D8CCD3') + '" stroke-width="' + (k === 1 ? 3 : 1.5) + '"/>' + tPiece(tr[k], x + 1, 31, 0.26);
      }
      s += '<path d="M138,26 L162,62 M162,26 L138,62" stroke="#C0262D" stroke-width="3" stroke-linecap="round"/>';
      s += '<path d="M54,64 L54,86 L100,86" fill="none" stroke="#584A5A" stroke-width="3" stroke-linecap="round"/><path d="M94,80 L100,86 L94,92" fill="none" stroke="#584A5A" stroke-width="3" stroke-linecap="round"/>';
    }
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: tArt(1) },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: tArt(2) },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: tArt(3) }
  ];

  /* -------------------------------------------------------------- start */

  var saved = ctx.loadSave();
  if (validSave(saved) && (saved.g.daily || null) === (dailyDate || null)) restore(saved.g);
  else newGame(dailyDate ? { daily: dailyDate } : { mode: prefs.mode, level: prefs.level });
  if (dailyDate && C.stats.dailyDone('fourfold', dailyDate)) {
    var rec = C.stats.dailyOf(dailyDate).fourfold;
    C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
  }
  ctx.tutorialIfNew(TUT);
})();
</script>
