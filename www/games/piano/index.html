<title>پیانو — چوگان</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">

<style>
  /* A column, not .ch-split: in a wide window .ch-split puts its rows in a side column,
     and on a phone held sideways that column took a third of the width a keyboard needs. */
  .pn-wrap { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s-3); }
  .pn-wrap > .ch-fit { width: 100%; }
  .pn-board { position: relative; aspect-ratio: var(--fit-ar, 2); }
  /* A canvas given only offsets keeps its backing-store size and is drawn at that many
     CSS pixels, so on a phone with a pixel ratio above 1 it would run off the screen
     (Goose Race, 2026-11-15). Both sizes come from CSS. */
  .pn-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; touch-action: none;
    direction: ltr; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .pn-bar { display: flex; align-items: center; justify-content: center; gap: var(--s-2); flex-wrap: wrap; width: 100%; max-width: 560px; }
  /* low notes are on the left of every piano, so the octave arrows stay left to right in Persian too */
  .pn-oct { display: flex; align-items: center; gap: var(--s-1); direction: ltr; }
  .pn-oct b { min-width: 3.2em; text-align: center; font-variant-numeric: tabular-nums; }
  .pn-len { display: flex; gap: 3px; justify-content: center; align-items: center; height: 14px; min-height: 14px; direction: ltr; }
  .pn-len i { display: block; height: 10px; border-radius: 5px; background: var(--game); opacity: .55; }
  .pn-status { width: 100%; max-width: 560px; min-height: 3em; line-height: 1.5; text-align: center; margin: 0; font-size: var(--fs-sm); }
  /* the buttons and the line under them took 110 px of a sideways phone's 412, leaving the keys
     187 px; there they share one row (#1114). Elsewhere .pn-head adds no box. */
  .pn-head { display: contents; }
  @media (orientation: landscape) and (max-height: 540px) {
    .pn-wrap { gap: var(--s-2); }
    .pn-head { display: flex; align-items: center; justify-content: center; gap: var(--s-3); width: 100%; }
    .pn-head > .pn-bar { width: auto; flex: none; flex-wrap: nowrap; }
    .pn-head > .pn-status { flex: 0 1 auto; width: auto; min-height: 0; text-align: start; }
  }
  .pn-tunes { display: grid; gap: var(--s-2); }
  .pn-tune { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); width: 100%; text-align: start; }
</style>

<script>
/* ==== ENGINE START ==== */
function PianoEngineFactory() {
  'use strict';

  var LOW = 48, HIGH = 84;          // C3 to C6: three octaves and the top C
  var BASES = [3, 4, 5];            // the octave the lower letter row starts on
  var KEY_MIN = 44;                 // the narrowest white key a finger can hit
  var MIN_WHITES = 8;               // one octave and its top C, even on the smallest phone
  var TALL = 7;                     // a white key is at most this many times as tall as wide (5.2 until #1114: taller keys, as a player asked)
  var SQUAT = 4;                    // and at least a quarter of its height wide: a phone held sideways showed 20 keys 45 px wide and 187 px tall (#1114)
  var KEY_WIDE = 64;                // but no wider than this, so a desktop keeps more than two octaves
  var STEPS = [0, 2, 4, 5, 7, 9, 11];
  var LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];

  // Built by stepping one equal-tempered semitone at a time out from A4 = 440 Hz, so the
  // test can check it against the closed formula instead of against itself.
  var FREQ = {};
  (function () {
    var r = Math.pow(2, 1 / 12), f = 440, m;
    for (m = 69; m <= HIGH; m++) { FREQ[m] = f; f *= r; }
    for (f = 440, m = 68; m >= LOW; m--) { f /= r; FREQ[m] = f; }
  })();
  function freq(m) { return FREQ[m] || 0; }
  function pc(m) { return ((m % 12) + 12) % 12; }
  function isBlack(m) { return STEPS.indexOf(pc(m)) < 0; }
  function octave(m) { return Math.floor(m / 12) - 1; }
  // the white step 0-6 a key sits on; a black key gives the white below it
  function step(m) { var s = STEPS.indexOf(pc(m)); return s >= 0 ? s : STEPS.indexOf(pc(m) - 1); }
  function name(m) { return LETTERS[step(m)] + (isBlack(m) ? '#' : '') + octave(m); }
  function parse(s) {
    var x = /^([A-G])(#?)(\d)$/.exec(s);
    if (!x) return -1;
    var m = (+x[3] + 1) * 12 + STEPS[LETTERS.indexOf(x[1])] + (x[2] ? 1 : 0);
    return m >= LOW && m <= HIGH ? m : -1;
  }
  var WHITES = [];
  for (var w = LOW; w <= HIGH; w++) if (!isBlack(w)) WHITES.push(w);

  /* -------------------------------------------------------- layout */

  function whitesFor(width, height) {
    var key = height ? Math.max(KEY_MIN, Math.min(KEY_WIDE, height / SQUAT)) : KEY_MIN;
    return Math.max(MIN_WHITES, Math.min(WHITES.length, Math.floor(width / key)));
  }
  // The window starts on the C of the chosen octave when it can, and slides left near the
  // top so it never shows past C6.
  function windowStart(count, base) { return Math.max(0, Math.min(7 * (base - 3), WHITES.length - count)); }
  function layout(W, H, base) {
    var count = whitesFor(W, H), start = windowStart(count, base), ww = W / count;
    var bw = ww * 0.6, bh = H * 0.62, whites = [], blacks = [];
    for (var i = 0; i < count; i++) {
      var m = WHITES[start + i];
      whites.push({ m: m, x: i * ww, w: ww });
      if (i < count - 1 && isBlack(m + 1)) blacks.push({ m: m + 1, x: (i + 1) * ww - bw / 2, w: bw, h: bh });
    }
    return { W: W, H: H, base: base, ww: ww, bh: bh, whites: whites, blacks: blacks, lo: whites[0].m, hi: whites[count - 1].m };
  }
  // black keys lie on top, so they are tried first
  function hit(L, x, y) {
    if (!L || x < 0 || y < 0 || x >= L.W || y >= L.H) return -1;
    for (var i = 0; i < L.blacks.length; i++) { var b = L.blacks[i]; if (y < b.h && x >= b.x && x < b.x + b.w) return b.m; }
    var k = L.whites[Math.min(L.whites.length - 1, Math.floor(x / L.ww))];
    return k ? k.m : -1;
  }
  function shown(L, m) { return !!L && m >= L.lo && m <= L.hi; }

  /* -------------------------------------------- the computer keyboard */

  // Two rows laid out like a piano: the letters are the white keys and the row above them
  // the black ones, Z for the C of the chosen octave and Q for the C above it. Letters are
  // matched with Chogan.keyIs (the Persian layout types other characters on these keys);
  // the digits have no letter, so the page matches them by their physical code.
  var KEYS = [['z', 0], ['s', 1], ['x', 2], ['d', 3], ['c', 4], ['v', 5], ['g', 6], ['b', 7], ['h', 8], ['n', 9], ['j', 10], ['m', 11],
    ['q', 12], ['2', 13], ['w', 14], ['3', 15], ['e', 16], ['r', 17], ['5', 18], ['t', 19], ['6', 20], ['y', 21], ['7', 22], ['u', 23], ['i', 24]];
  function keyNote(k, base) {
    for (var i = 0; i < KEYS.length; i++) if (KEYS[i][0] === k) { var m = (base + 1) * 12 + KEYS[i][1]; return m >= LOW && m <= HIGH ? m : -1; }
    return -1;
  }
  function keyFor(m, base) {
    var off = m - (base + 1) * 12;
    for (var i = 0; i < KEYS.length; i++) if (KEYS[i][1] === off) return KEYS[i][0];
    return '';
  }
  function shift(base, d) { var b = base + d; return b < BASES[0] ? BASES[0] : (b > BASES[BASES.length - 1] ? BASES[BASES.length - 1] : b); }

  /* ------------------------------------------------- practice tunes */

  // Public-domain melodies, every note between C4 and C5 so the whole tune fits the
  // eight keys a phone held upright shows. A number after the colon is the length in beats.
  var TUNES = [
    { id: 'twinkle', notes: 'C4 C4 G4 G4 A4 A4 G4:2 F4 F4 E4 E4 D4 D4 C4:2 G4 G4 F4 F4 E4 E4 D4:2 G4 G4 F4 F4 E4 E4 D4:2 C4 C4 G4 G4 A4 A4 G4:2 F4 F4 E4 E4 D4 D4 C4:2' },
    { id: 'mary', notes: 'E4 D4 C4 D4 E4 E4 E4:2 D4 D4 D4:2 E4 G4 G4:2 E4 D4 C4 D4 E4 E4 E4 E4 D4 D4 E4 D4 C4:4' },
    { id: 'clair', notes: 'C4 C4 C4 D4 E4:2 D4:2 C4 E4 D4 D4 C4:4 C4 C4 C4 D4 E4:2 D4:2 C4 E4 D4 D4 C4:4' },
    { id: 'london', notes: 'G4:1.5 A4:0.5 G4 F4 E4 F4 G4:2 D4 E4 F4:2 E4 F4 G4:2 G4:1.5 A4:0.5 G4 F4 E4 F4 G4:2 D4:2 G4 E4 C4:2' },
    { id: 'ode', notes: 'E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 E4:1.5 D4:0.5 D4:2 E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 D4:1.5 C4:0.5 C4:2' },
    { id: 'jingle', notes: 'E4 E4 E4:2 E4 E4 E4:2 E4 G4 C4:1.5 D4:0.5 E4:4 F4 F4 F4:1.5 F4:0.5 F4 E4 E4 E4:0.5 E4:0.5 E4 D4 D4 E4 D4:2 G4:2' },
    { id: 'frere', notes: 'C4 D4 E4 C4 C4 D4 E4 C4 E4 F4 G4:2 E4 F4 G4:2 G4:0.5 A4:0.5 G4:0.5 F4:0.5 E4 C4 G4:0.5 A4:0.5 G4:0.5 F4:0.5 E4 C4 C4 G4 C4:2 C4 G4 C4:2' },
    { id: 'row', notes: 'C4 C4 C4:0.75 D4:0.25 E4 E4:0.75 D4:0.25 E4:0.75 F4:0.25 G4:2 C5:0.5 C5:0.5 C5:0.5 G4:0.5 G4:0.5 G4:0.5 E4:0.5 E4:0.5 E4:0.5 C4:0.5 C4:0.5 C4:0.5 G4:0.75 F4:0.25 E4:0.75 D4:0.25 C4:2' },
    { id: 'macdonald', notes: 'C4 C4 C4 G4 A4 A4 G4:2 E4 E4 D4 D4 C4:2 G4 C4 C4 C4 G4 A4 A4 G4:2 E4 E4 D4 D4 C4:2' },
    { id: 'buns', notes: 'E4 D4 C4:2 E4 D4 C4:2 C4:0.5 C4:0.5 C4:0.5 C4:0.5 D4:0.5 D4:0.5 D4:0.5 D4:0.5 E4 D4 C4:2 E4 D4 C4:2 E4 D4 C4:2 C4:0.5 C4:0.5 C4:0.5 C4:0.5 D4:0.5 D4:0.5 D4:0.5 D4:0.5 E4 D4 C4:2' },
    { id: 'saints', notes: 'C4 E4 F4 G4:2 C4 E4 F4 G4:2 C4 E4 F4 G4 E4 C4 E4 D4:2 E4 E4 D4 D4 C4:2 C4 E4 F4 G4:2 C4 E4 F4 G4:2 C4 E4 F4 G4 E4 C4 D4 C4:2' },
    { id: 'susanna', notes: 'C4:0.5 D4:0.5 E4 G4 G4:1.5 A4:0.5 G4 E4 C4:0.5 D4:0.5 E4 E4 D4 C4 D4:2 C4:0.5 D4:0.5 E4 G4 G4:1.5 A4:0.5 G4 E4 C4:0.5 D4:0.5 E4 E4 D4 D4 C4:2' },
    { id: 'lightly', notes: 'G4 E4 E4:2 F4 D4 D4:2 C4 D4 E4 F4 G4 G4 G4:2 G4 E4 E4:2 F4 D4 D4:2 C4 E4 G4 G4 C4:2' },
    { id: 'deck', notes: 'C5:1.5 B4:0.5 A4 G4 F4 G4 A4 F4 G4:0.5 A4:0.5 B4:0.5 G4:0.5 A4:1.5 G4:0.5 F4 E4 D4 E4 C4:2 G4:0.5 A4:0.5 B4:0.5 G4:0.5 A4:1.5 G4:0.5 F4 E4 D4 E4 C4:2' },
    { id: 'cucaracha', notes: 'C4:0.5 C4:0.5 C4:0.5 F4:1.5 A4:2 F4:0.5 F4:0.5 E4:0.5 E4:0.5 D4:0.5 D4:0.5 C4:2 C4:0.5 C4:0.5 C4:0.5 F4:1.5 A4:2 F4:0.5 F4:0.5 E4:0.5 E4:0.5 D4:0.5 D4:0.5 C4:2' },
    { id: 'itsy', notes: 'G4 C4 C4 C4:0.75 D4:0.25 E4:2 E4 E4:0.75 E4:0.25 D4 C4 D4 E4 C4:2 E4:2 E4 F4 G4:2 G4 F4 E4 F4 G4 E4:2' },
    { id: 'canon', notes: 'C5:2 G4:2 A4:2 E4:2 F4:2 C4:2 F4:2 G4:2 C5:2 G4:2 A4:2 E4:2 F4:2 C4:2 F4:2 G4:2 C5:2 G4:2 A4:2 E4:2 F4:2 C4:2 F4:2 G4:2' }
  ];
  function tune(id) {
    for (var i = 0; i < TUNES.length; i++) {
      if (TUNES[i].id !== id) continue;
      return TUNES[i].notes.split(' ').map(function (t) { var p = t.split(':'); return { m: parse(p[0]), beats: p[1] ? +p[1] : 1 }; });
    }
    return null;
  }
  function practice(id) { var n = tune(id); return n ? { id: id, notes: n, i: 0 } : null; }
  function expected(P) { return P && P.i < P.notes.length ? P.notes[P.i].m : -1; }
  // A wrong key only sounds: there is nothing to lose in a toy. A key after the end
  // starts the tune again from the top. A right key does not move the tune on by itself:
  // it begins a hold, and the note counts once it has been held for HOLD of its beats
  // (#1012; before that the key alone counted, so a half note and a quarter note felt the same).
  function press(P, m) {
    if (!P) return 'free';
    if (P.i >= P.notes.length) P.i = 0;
    if (m !== P.notes[P.i].m) return 'miss';
    return 'hold';
  }
  function need(P) { return P && P.i < P.notes.length ? Math.max(120, Math.round(P.notes[P.i].beats * BEAT_MS * HOLD)) : 0; }
  // the held note was long enough: move on
  function advance(P) {
    P.i++;
    return P.i === P.notes.length ? 'done' : 'hit';
  }
  var BEAT_MS = 520;
  var HOLD = 0.8;

  /* ------------------------------------------------------- recording */
  // #1104: a recording is the notes played, each with its start and length in ms. It is read
  // back from the saved data, so anything stored that is not a clean list is dropped, and a
  // forgotten recording cannot grow without end.
  var REC_MAX_NOTES = 1000, REC_MAX_MS = 300000;
  function recClean(raw) {
    if (!Array.isArray(raw)) return [];
    var out = [], i, n;
    for (i = 0; i < raw.length && out.length < REC_MAX_NOTES; i++) {
      n = raw[i];
      if (!n || typeof n.m !== 'number' || typeof n.t !== 'number' || typeof n.d !== 'number') continue;
      if (!freq(n.m) || !(n.t >= 0) || n.t > REC_MAX_MS || !(n.d > 0)) continue;
      out.push({ m: n.m, t: Math.round(n.t), d: Math.min(Math.round(n.d), 10000) });
    }
    out.sort(function (a, b) { return a.t - b.t; });
    return out;
  }
  // the time the last note ends
  function recSpan(rec) {
    var end = 0;
    rec.forEach(function (n) { end = Math.max(end, n.t + n.d); });
    return end;
  }

  // The optional colourful keys (#1209): one colour for each of the seven notes, the same in
  // every octave, light enough for dark lettering. Black keys stay black, as a piano's do.
  var RAINBOW = ['#FF8A80', '#FFB74D', '#FFE066', '#9CD67A', '#6FD3D0', '#85B6FF', '#C9A0F0'];
  function colorsPref(v) { return v === 'rainbow' ? v : 'plain'; }

  return {
    RAINBOW: RAINBOW, colorsPref: colorsPref,
    LOW: LOW, HIGH: HIGH, BASES: BASES, KEY_MIN: KEY_MIN, KEY_WIDE: KEY_WIDE, SQUAT: SQUAT, MIN_WHITES: MIN_WHITES, TALL: TALL, WHITES: WHITES, KEYS: KEYS, TUNES: TUNES, BEAT_MS: BEAT_MS,
    freq: freq, isBlack: isBlack, octave: octave, step: step, name: name, parse: parse,
    whitesFor: whitesFor, windowStart: windowStart, layout: layout, hit: hit, shown: shown,
    keyNote: keyNote, keyFor: keyFor, shift: shift,
    tune: tune, practice: practice, expected: expected, press: press, need: need, advance: advance, HOLD: HOLD,
    REC_MAX_NOTES: REC_MAX_NOTES, REC_MAX_MS: REC_MAX_MS, recClean: recClean, recSpan: recSpan
  };
}
if (typeof module !== 'undefined') module.exports = PianoEngineFactory;
/* ==== ENGINE END ==== */
</script>

        g.fillText(t, k.x + k.w / 2, L.H - Math.max(10, L.ww * 0.25));
      }
      // a small ring under the C of every octave helps find one's place
      if (E.step(k.m) === 0 && !E.isBlack(k.m)) {
        g.strokeStyle = rainbow ? '#1F1A22' : dk ? '#7E737B' : '#B9AEB4'; g.lineWidth = 1.5; g.beginPath();
        g.arc(k.x + k.w / 2, L.H - Math.max(26, L.ww * 0.25 + fs + 8), 3, 0, Math.PI * 2); g.stroke();
      }
    });
    L.blacks.forEach(function (k) {
      rr(g, k.x, 0, k.w, k.h, Math.min(5, k.w * 0.15));
      g.fillStyle = lit[k.m] ? ACCENT : ebony; g.fill();
      if (k.m === next && !lit[k.m]) { g.fillStyle = 'rgba(222,112,152,.85)'; g.fill(); }
      if (k.m === next && lit[k.m] && holding) { g.fillStyle = '#F3C9D6'; g.globalAlpha = 0.6; g.fillRect(k.x, k.h - k.h * prog, k.w, k.h * prog); g.globalAlpha = 1; }
      if (!lit[k.m]) { g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(k.x + k.w * 0.18, k.h * 0.06, k.w * 0.64, k.h * 0.78); }
      var t = label(k.m);
      if (t) {
        g.fillStyle = '#FFFFFF'; g.font = '600 ' + Math.max(10, fs * 0.8) + 'px ' + font; g.textAlign = 'center';
        g.fillText(t, k.x + k.w / 2, k.h - Math.max(8, k.w * 0.25));
      }
    });
    g.restore();
    L.top = felt;
    drawn = L;
    octLabel.textContent = 'C' + C.num(prefs.base);
    lowBtn.disabled = prefs.base === E.BASES[0];
    highBtn.disabled = prefs.base === E.BASES[E.BASES.length - 1];
  }

  /* ----------------------------------------------------------- status */

  function showLength() {
    lenRow.textContent = '';
    if (!prac || prac.i >= prac.notes.length) return;
    var b = prac.notes[prac.i].beats;
    lenRow.setAttribute('title', C.num(b) + ' ' + C.t('pnBeats'));
    for (var k = 0; k < Math.ceil(b); k++) lenRow.appendChild(el('i', { style: { width: (Math.min(1, b - k) * 28) + 'px' } }));
  }
  function showStatus() {
    var t;
    if (msg) t = msg;
    else if (recording) t = C.t('pnRecording');
    else if (prac) t = C.t('pnProgress', { name: TUNE_NAMES[prac.id], n: C.num(prac.i), total: C.num(prac.notes.length) });
    else t = C.t('pnFreeHint');
    // only free play gives way to the muted note: a tune is still followed by its lit keys,
    // and hiding its progress and "well done" behind the note left a silent player blind
    if (soundOff() && !prac) t = C.t('pnMuted');
    status.textContent = t;
    listenBtn.hidden = !prac;
    showLength();
    listenBtn.textContent = demo ? C.t('pnStop') : C.t('pnListen');
    recBtn.textContent = recording ? C.t('pnRecStop') : C.t('pnRec');
    recBtn.className = 'ch-btn ' + (recording ? 'ch-btn--primary' : 'ch-btn--soft');
    playRecBtn.hidden = !recorded.length || recording;
    playRecBtn.textContent = '';
    playRecBtn.appendChild(C.icon(replay ? 'pause' : 'play', 20));
    playRecBtn.setAttribute('aria-label', replay ? C.t('pnStop') : C.t('pnRecPlay'));
  }

  /* ------------------------------------------------------------ notes */

  function sound(m) { return C.audio.piano ? C.audio.piano(E.freq(m)) : null; }
  // A key is struck and later released through one handle. For a tune, the handle also owns
  // the hold: the note counts after need() ms while the key is still down, and a release
  // before that says to hold longer and changes nothing.
  var holding = null;               // { i, t0, need, timer } for the note being held now
  function endHold() { if (holding) { clearTimeout(holding.timer); holding = null; } }
  function strike(m) {
    if (demo) stopDemo();
    if (replay) stopReplay();
    var h = sound(m), mine = null, rn = null, rt0 = recording && recording.t0;
    if (recording && recording.notes.length < E.REC_MAX_NOTES) {
      rn = { m: m, t: Date.now() - recording.t0, d: 0 };
      recording.notes.push(rn);
    }
    if (prac) {
      var was = msg;
      msg = '';
      endHold();
      var r = E.press(prac, m);
      if (r === 'hold' && prefs.hold === 'off') {
        if (E.advance(prac) === 'done') finishTune();
      } else if (r === 'hold') {
        mine = holding = { i: prac.i, t0: Date.now(), need: E.need(prac), timer: 0 };
        mine.timer = setTimeout(function () { completeHold(mine); }, mine.need);
        pulse();
      } else if (was && r === 'miss') msg = was;
    }
    showStatus();
    return { stop: function () {
      if (h) h.stop();
      // a recording that ended first has already closed this note
      if (rn && !rn.d) rn.d = Math.max(80, Date.now() - rt0 - rn.t);
      if (mine && holding === mine) { endHold(); msg = C.t('pnLonger'); showStatus(); draw(); }
    } };
  }
  function completeHold(mine) {
    if (holding !== mine || !prac || prac.i !== mine.i) return;
    holding = null;
    var r = E.advance(prac);
    msg = '';
    if (r === 'done') finishTune();
    showStatus(); draw();
  }
  // the key being held fills like a bar while the hold runs
  var pulsing = 0;
  function pulse() {
    if (pulsing) return;
    pulsing = requestAnimationFrame(function tick() {
      pulsing = 0;
      draw();
      if (holding) pulsing = requestAnimationFrame(tick);
    });
  }
  function release(h) { if (h) h.stop(); }
  function finishTune() {
    msg = C.t('pnWell');
    if (played.indexOf(prac.id) < 0) { played.push(prac.id); ctx.store.set('played', played); }
    C.haptic('success');
    var r = cv.getBoundingClientRect();
    if (r.width) C.ui.burst({ x: r.left + r.width / 2, y: r.top + r.height * 0.35 }, { colors: [ACCENT, '#F3C9D6', '#FFFFFF'], count: 18, speed: 0.9 });
    C.achievements.unlock('pn-tune');
    if (E.TUNES.every(function (t) { return played.indexOf(t.id) >= 0; })) C.achievements.unlock('pn-all');
  }

  /* ---------------------------------------------------------- touches */

  function local(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function keyAt(e) {
    var L = drawn;
    if (!L) return -1;
    var p = local(e);
    return E.hit(L, p.x, Math.max(0, p.y - L.top));
  }
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (x) { /* a synthetic pointer has nothing to capture */ }
    var m = keyAt(e);
    if (m < 0) return;
    fingers[e.pointerId] = { m: m, h: strike(m) };
    draw();
  });
  // a finger slid onto another key lets the first go and strikes the next, as on a real keyboard
  cv.addEventListener('pointermove', function (e) {
    var f = fingers[e.pointerId];
    if (!f) return;
    var m = keyAt(e);
    if (m < 0 || m === f.m) return;
    release(f.h);
    fingers[e.pointerId] = { m: m, h: strike(m) };
    draw();
  });
  function lift(e) {
    var f = fingers[e.pointerId];
    if (!f) return;
    release(f.h);
    delete fingers[e.pointerId];
    draw();
  }
  cv.addEventListener('pointerup', lift);
  cv.addEventListener('pointercancel', lift);
  cv.addEventListener('lostpointercapture', lift);
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* -------------------------------------------------------- keyboard */

  function letterOf(e) {
    if (/^Digit[23567]$/.test(e.code)) return e.code.slice(5);
    for (var i = 0; i < E.KEYS.length; i++) { var k = E.KEYS[i][0]; if (/[a-z]/.test(k) && C.keyIs(e, k)) return k; }
    return '';
  }
  window.addEventListener('keydown', function (e) {
    if (document.querySelector('.ch-scrim')) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); if (!e.repeat) setBase(E.shift(prefs.base, e.key === 'ArrowLeft' ? -1 : 1)); return; }
    var k = letterOf(e);
    if (!k) return;
    e.preventDefault();
    if (e.repeat || keysDown[e.code]) return;
    var m = E.keyNote(k, prefs.base);
    if (m < 0) return;
    keysDown[e.code] = { m: m, h: strike(m) };
    draw();
  });
  window.addEventListener('keyup', function (e) {
    var d = keysDown[e.code];
    if (!d) return;
    release(d.h);
    delete keysDown[e.code];
    draw();
  });
  // a key held while the window loses focus never sends its keyup, and would ring on
  window.addEventListener('blur', function () { allOff(); draw(); });

  function allOff() {
    var k;
    for (k in fingers) release(fingers[k].h);
    for (k in keysDown) release(keysDown[k].h);
    fingers = {}; keysDown = {};
  }
  function setBase(b) {
    if (b === prefs.base) return;
    // the keys under the fingers change note, so the old notes stop rather than hang
    allOff();
    prefs.base = b; savePrefs();
    draw();
  }
  lowBtn.addEventListener('click', function () { setBase(E.shift(prefs.base, -1)); });
  highBtn.addEventListener('click', function () { setBase(E.shift(prefs.base, 1)); });

  /* --------------------------------------------------------- practice */

  function startTune(id) {
    stopDemo(); finishRec();
    prac = E.practice(id);
    msg = '';
    // every tune lies between C4 and C5, the window the middle octave shows on any screen
    if (prac && prefs.base !== 4) setBase(4);
    showStatus(); draw();
  }
  function stopDemo() {
    if (!demo) return;
    clearTimeout(demo.timer);
    release(demo.h);
    demo = null; demoLit = -1;
    showStatus(); draw();
  }
  function playDemo() {
    if (!prac) return;
    allOff();
    var notes = prac.notes, i = 0;
    demo = { timer: 0, h: null };
    prac.i = 0; msg = '';
    function next() {
      if (!demo) return;
      release(demo.h); demo.h = null;
      if (i >= notes.length) { demo = null; demoLit = -1; showStatus(); draw(); return; }
      var n = notes[i++];
      demoLit = n.m; demo.h = sound(n.m);
      draw();
      var len = n.beats * E.BEAT_MS;
      // a short gap before the next note, so two of the same note are heard as two
      demo.timer = setTimeout(function () { if (!demo) return; release(demo.h); demo.h = null; demoLit = -1; draw(); demo.timer = setTimeout(next, 70); }, len - 70);
    }
    showStatus();
    next();
  }
  listenBtn.addEventListener('click', function () { if (demo) stopDemo(); else playDemo(); });

  /* ------------------------------------------------------- recording */

  function startRec() {
    stopDemo(); stopReplay(); endHold();
    prac = null; msg = '';
    recording = { t0: Date.now(), notes: [], timer: setTimeout(finishRec, E.REC_MAX_MS) };
    showStatus(); draw();
  }
  function finishRec() {
    if (!recording) return;
    var r = recording, now = Date.now() - r.t0;
    clearTimeout(r.timer);
    recording = null;
    // a key still down when the recording ends lasts until that moment
    r.notes.forEach(function (n) { if (!n.d) n.d = Math.max(80, now - n.t); });
    var clean = E.recClean(r.notes);
    if (clean.length) {
      // the first note starts the recording, so a pause before it is not replayed
      var t0 = clean[0].t;
      clean.forEach(function (n) { n.t -= t0; });
      recorded = clean;
      ctx.store.set('rec', recorded);
      msg = C.t('pnRecSaved', { n: C.num(recorded.length), s: C.num(Math.round(E.recSpan(recorded) / 100) / 10) });
    } else msg = C.t('pnRecNone');
    showStatus(); draw();
  }
  function stopReplay() {
    if (!replay) return;
    replay.timers.forEach(clearTimeout);
    replay.hs.forEach(release);
    replay = null; demoLit = -1;
    showStatus(); draw();
  }
  function playRec() {
    if (!recorded.length) return;
    allOff(); stopDemo(); msg = '';
    var me = replay = { timers: [], hs: [] };
    recorded.forEach(function (n) {
      me.timers.push(setTimeout(function () {
        if (replay !== me) return;
        var h = sound(n.m);
        me.hs.push(h);
        demoLit = n.m; draw();
        me.timers.push(setTimeout(function () { if (replay !== me) return; release(h); if (demoLit === n.m) { demoLit = -1; draw(); } }, n.d));
      }, n.t));
    });
    me.timers.push(setTimeout(function () { if (replay === me) { replay = null; demoLit = -1; showStatus(); draw(); } }, E.recSpan(recorded) + 100));
    showStatus();
  }
  recBtn.addEventListener('click', function () { if (recording) finishRec(); else startRec(); });
  playRecBtn.addEventListener('click', function () { if (replay) stopReplay(); else playRec(); });
  function deleteRec() {
    stopReplay();
    recorded = []; ctx.store.set('rec', recorded); msg = '';
    showStatus();
  }

  function showTunes() {
    var m = null, list = el('div', { class: 'pn-tunes' });
    function item(text, on, done, fn) {
      var b = el('button', { class: 'ch-btn pn-tune ' + (on ? 'ch-btn--primary' : 'ch-btn--soft'), type: 'button' }, [el('span', { text: text }), done ? C.icon('check', 18) : el('span')]);
      b.addEventListener('click', function () { if (m) m.close(); fn(); });
      list.appendChild(b);
    }
    item(C.t('pnFree'), !prac, false, function () { stopDemo(); prac = null; msg = ''; showStatus(); draw(); });
    E.TUNES.forEach(function (t) { item(TUNE_NAMES[t.id], !!prac && prac.id === t.id, played.indexOf(t.id) >= 0, function () { startTune(t.id); }); });
    m = C.ui.modal({
      title: C.t('pnTunes'), closeButton: true,
      body: [el('p', { class: 'ch-dim', text: C.t('pnPick') }), list, el('p', { class: 'ch-dim', text: C.t('pnPlayed', { n: C.num(played.length), total: C.num(E.TUNES.length) }) })],
      actions: [{ label: C.t('cancel') }]
    });
  }
  tunesBtn.addEventListener('click', showTunes);

  /* -------------------------------------------------------- settings */

  function showSettings() {
    var seg = C.ui.segmented([{ value: 'names', label: C.t('pnLabNames') }, { value: 'keys', label: C.t('pnLabKeys') }, { value: 'none', label: C.t('pnLabNone') }], prefs.labels, function (v) {
      prefs.labels = v; savePrefs(); draw();
    });
    // three choices do not fit one row at 390px in German or Polish, so they wrap
    seg.classList.add('ch-seg--wrap');
    var hseg = C.ui.segmented([{ value: 'on', label: C.t('pnHoldOn') }, { value: 'off', label: C.t('pnHoldOff') }], prefs.hold, function (v) {
      prefs.hold = v; savePrefs(); endHold(); showStatus(); draw();
    });
    hseg.classList.add('ch-seg--wrap');
    var cseg = C.ui.segmented([{ value: 'plain', label: C.t('pnColPlain') }, { value: 'rainbow', label: C.t('pnColRainbow') }], prefs.colors, function (v) {
      prefs.colors = v; savePrefs(); draw();
    });
    cseg.classList.add('ch-seg--wrap');
    var items = [el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: C.t('pnColors') }), cseg]), el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: C.t('pnLabels') }), seg]), el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: C.t('pnHold') }), hseg])];
    if (recorded.length) {
      var delBtn = el('button', { class: 'ch-btn ch-btn--soft', type: 'button', text: C.t('pnRecDel') });
      delBtn.addEventListener('click', function () { deleteRec(); delBtn.disabled = true; });
      items.push(el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: C.t('pnRec') }), delBtn]));
    }
    C.ui.modal({
      title: C.t('settings'), closeButton: true,
      body: [el('div', { class: 'ch-list' }, items)],
      actions: [{ label: C.t('done'), kind: 'primary' }]
    });
  }

  /* ------------------------------------------------------------ help */

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('pnRules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [kb('Z X C V B N M', C.t('pnKLowWhat')), kb('Q W E R T Y U I', C.t('pnKHighWhat')), kb('← →', C.t('pnKArrowsWhat'))])
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  function tArt(kind) {
    var s = '<svg viewBox="0 0 200 110" width="100%" direction="ltr"><rect width="200" height="110" rx="10" fill="#F7E4EA"/><rect x="16" y="14" width="168" height="6" fill="' + ACCENT + '"/>';
    for (var i = 0; i < 8; i++) {
      var on = kind === 1 ? (i === 0 || i === 2 || i === 4) : i === 3;
      s += '<rect x="' + (16 + i * 21) + '" y="20" width="20" height="76" rx="3" fill="' + (on ? (kind === 1 ? '#F3C9D6' : '#DE98AE') : '#FFFDF7') + '" stroke="#C9BFB3"/>';
    }
    [1, 2, 4, 5, 6].forEach(function (i) { s += '<rect x="' + (16 + i * 21 - 6) + '" y="20" width="12" height="46" rx="2" fill="#1F1A22"/>'; });
    if (kind === 1) [0, 2, 4].forEach(function (i) { s += '<circle cx="' + (26 + i * 21) + '" cy="82" r="7" fill="' + ACCENT + '" fill-opacity=".8"/>'; });
    else s += '<path d="M89 104 l0 -10 M84 99 l5 -5 l5 5" stroke="' + ACCENT + '" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('pnTutTitle1'), text: C.t('pnTutText1'), art: tArt(1) },
    { title: C.t('pnTutTitle2'), text: C.t('pnTutText2'), art: tArt(2) }
  ];

  /* ----------------------------------------------------------- start */

  C.onPause(function () { paused = true; stopDemo(); stopReplay(); finishRec(); allOff(); draw(); });
  C.onResume(function () { paused = false; showStatus(); });
  window.addEventListener('pageshow', function (e) { if (e.persisted) { allOff(); shape(); draw(); showStatus(); } });
  function relayout() { shape(); draw(); }
  if (window.ResizeObserver) new ResizeObserver(relayout).observe(wrap);
  else window.addEventListener('resize', relayout);
  // the web font arriving changes the bar's height above the keyboard, and the labels
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);

  relayout();
  showStatus();
  ctx.tutorialIfNew(TUT);
})();
</script>
</body>
</html>
