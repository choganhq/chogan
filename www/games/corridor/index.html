     wooden walls and pawns */

<script>
/* ==== ENGINE START ==== */
function CorridorEngineFactory() {
  'use strict';

  // 9×9 cells, index r * 9 + c. Seat 0 starts in the middle of the bottom row and
  // makes for the top row; seat 1 the other way round. A wall is two cells long and
  // lies in the groove under or beside its anchor (r, c), 0..7 each way.
  var N = 9, WALLS = 10, MAX_PLIES = 300;
  var START = [8 * N + 4, 4];
  var FLAGS = { none: [], edge: [4 * N], centre: [4 * N + 4], both: [4 * N, 4 * N + 4] };
  var DIRS = [[-1, 0], [1, 0], [0, -1], [0, 1]];

  function rc(i) { return [Math.floor(i / N), i % N]; }
  function at(r, c) { return r >= 0 && r < N && c >= 0 && c < N ? r * N + c : -1; }
  function key(a, b) { return a < b ? a + '-' + b : b + '-' + a; }

  // the two cell sides a wall closes
  function sides(w) {
    var a = w.r * N + w.c;
    return w.o === 'h' ? [[a, a + N], [a + 1, a + 1 + N]] : [[a, a + 1], [a + N, a + N + 1]];
  }
  function blockedSet(walls) {
    var s = {};
    walls.forEach(function (w) { sides(w).forEach(function (p) { s[key(p[0], p[1])] = 1; }); });
    return s;
  }
  // walls may not overlap along a groove or cross at their middle
  function clashes(walls, w) {
    for (var i = 0; i < walls.length; i++) {
      var x = walls[i];
      if (x.r === w.r && x.c === w.c) return true;                       // same anchor: same wall, or a cross
      if (x.o === w.o) {
        if (w.o === 'h' && x.r === w.r && Math.abs(x.c - w.c) === 1) return true;
        if (w.o === 'v' && x.c === w.c && Math.abs(x.r - w.r) === 1) return true;
      }
    }
    return false;
  }

  function newGame(flags) {
    return { pos: START.slice(), walls: [], left: [WALLS, WALLS], turn: 0, winner: -1, plies: 0,
      flag: FLAGS[flags] ? flags : 'none', flags: (FLAGS[flags] || []).slice() };
  }
  function clone(S) {
    return { pos: S.pos.slice(), walls: S.walls.map(function (w) { return { o: w.o, r: w.r, c: w.c }; }), left: S.left.slice(),
      turn: S.turn, winner: S.winner, plies: S.plies, flag: S.flag, flags: S.flags.slice() };
  }

  function open(blk, a, b) { return !blk[key(a, b)]; }
  function isFlag(S, i) { return S.flags.indexOf(i) >= 0; }

  // A seat wins on the far row, or, in the flag game, on a cell beside a flag (above,
  // below, left or right, with no wall between them)
  function isGoal(S, who, i, blk) {
    var r = Math.floor(i / N);
    if (who === 0 ? r === 0 : r === N - 1) return true;
    for (var k = 0; k < S.flags.length; k++) {
      var f = S.flags[k], d = Math.abs(f - i);
      var beside = (d === N) || (d === 1 && Math.floor(f / N) === r);
      if (beside && open(blk, f, i)) return true;
    }
    return false;
  }

  // Steps to the nearest goal, pawns ignored (they move), flag cells closed; with the
  // way back, so the bot can see which grooves a path runs through
  function path(S, who, blk) {
    blk = blk || blockedSet(S.walls);
    var from = S.pos[who], prev = {}, q = [from], seen = {};
    seen[from] = 1;
    for (var h = 0; h < q.length; h++) {
      var p = q[h];
      if (isGoal(S, who, p, blk)) {
        var out = [p];
        while (out[0] !== from) out.unshift(prev[out[0]]);
        return out;
      }
      var pr = rc(p);
      for (var d = 0; d < 4; d++) {
        var n = at(pr[0] + DIRS[d][0], pr[1] + DIRS[d][1]);
        if (n < 0 || seen[n] || isFlag(S, n) || !open(blk, p, n)) continue;
        seen[n] = 1; prev[n] = p; q.push(n);
      }
    }
    return null;
  }
  function dist(S, who, blk) { var p = path(S, who, blk); return p ? p.length - 1 : Infinity; }

  // Cells the pawn may go to: one step, or over the other pawn when they stand side by
  // side; with a wall or the edge behind it, to either side of it instead
  function pawnMoves(S, who) {
    var blk = blockedSet(S.walls), p = S.pos[who], o = S.pos[1 - who], out = [];
    var pr = rc(p);
    for (var d = 0; d < 4; d++) {
      var q = at(pr[0] + DIRS[d][0], pr[1] + DIRS[d][1]);
      if (q < 0 || isFlag(S, q) || !open(blk, p, q)) continue;
      if (q !== o) { out.push(q); continue; }
      var qr = rc(q), j = at(qr[0] + DIRS[d][0], qr[1] + DIRS[d][1]);
      if (j >= 0 && !isFlag(S, j) && open(blk, q, j)) { out.push(j); continue; }
      for (var e = 0; e < 4; e++) {
        if (DIRS[e][0] === DIRS[d][0] || DIRS[e][1] === DIRS[d][1]) continue;   // only the two sides
        var s = at(qr[0] + DIRS[e][0], qr[1] + DIRS[e][1]);
        if (s >= 0 && s !== p && !isFlag(S, s) && open(blk, q, s) && out.indexOf(s) < 0) out.push(s);
      }
    }
    return out;
  }

  // A wall must fit, the seat must have one left, and no pawn may be shut off from
  // every goal
  function wallOk(S, w) {
    if (!w || (w.o !== 'h' && w.o !== 'v') || w.r < 0 || w.r > N - 2 || w.c < 0 || w.c > N - 2) return false;
    if (S.left[S.turn] < 1 || clashes(S.walls, w)) return false;
    var walls = S.walls.concat([w]), blk = blockedSet(walls), T = { pos: S.pos, flags: S.flags, walls: walls };
    return dist(T, 0, blk) < Infinity && dist(T, 1, blk) < Infinity;
  }

  function legal(S, m) {
    if (S.winner >= 0 || !m) return false;
    if (m.t === 'm') return pawnMoves(S, S.turn).indexOf(m.to) >= 0;
    if (m.t === 'w') return wallOk(S, m);
    return false;
  }

  // Plays a legal move in place; returns false and changes nothing otherwise
  function play(S, m) {
    if (!legal(S, m)) return false;
    var who = S.turn;
    if (m.t === 'm') {
      S.pos[who] = m.to;
      if (isGoal(S, who, m.to, blockedSet(S.walls))) S.winner = who;
    } else {
      S.walls.push({ o: m.o, r: m.r, c: m.c });
      S.left[who]--;
    }
    S.plies++;
    if (S.winner < 0 && S.plies >= MAX_PLIES) S.winner = 2;          // a draw, only if both stall for ever
    S.turn = 1 - who;
    return true;
  }

  /* --------------------------------------------------------------- bot */

  // The grooves a path runs through, as the walls that would close them
  function wallsOnPath(p) {
    var out = [];
    for (var k = 0; k + 1 < p.length; k++) {
      var a = rc(p[k]), b = rc(p[k + 1]);
      if (a[1] === b[1]) {                                  // a step up or down: a horizontal wall
        var r = Math.min(a[0], b[0]);
        [a[1] - 1, a[1]].forEach(function (c) { out.push({ t: 'w', o: 'h', r: r, c: c }); });
      } else {                                              // a step sideways: a vertical wall
        var c2 = Math.min(a[1], b[1]);
        [a[0] - 1, a[0]].forEach(function (r2) { out.push({ t: 'w', o: 'v', r: r2, c: c2 }); });
      }
    }
    return out;
  }
  function candidates(S) {
    var who = S.turn, out = pawnMoves(S, who).map(function (to) { return { t: 'm', to: to }; });
    if (S.left[who] > 0) {
      var p = path(S, 1 - who), seen = {};
      (p ? wallsOnPath(p.slice(0, 7)) : []).forEach(function (w) {
        var k = w.o + w.r + ',' + w.c;
        if (seen[k] || !wallOk(S, w)) return;
        seen[k] = 1; out.push(w);
      });
    }
    return out;
  }
  // From who's side: how much shorter their way is, and walls kept in hand are worth a
  // little, so the bot does not spend them on nothing
  function score(S, who) {
    if (S.winner === who) return 1000;
    if (S.winner === 1 - who) return -1000;
    var blk = blockedSet(S.walls), me = dist(S, who, blk), op = dist(S, 1 - who, blk);
    return (op - me) * 10 + (S.left[who] - S.left[1 - who]) * 3 + (S.turn === who ? 5 : 0);
  }

  var LEVELS = ['easy', 'medium', 'hard'];
  function think(S, level, rnd) {
    var who = S.turn, moves = candidates(S);
    if (!moves.length) return null;
    // a step onto a goal is always taken
    for (var i = 0; i < moves.length; i++) if (moves[i].t === 'm' && isGoal(S, who, moves[i].to, blockedSet(S.walls))) return moves[i];
    var pick = function (list) { return list[Math.floor(rnd() * list.length)]; };
    if (level === 'easy') {
      // mostly walks its shortest way, now and then puts a wall in your way or wanders
      var p = path(S, who), step = p && p.length > 1 ? p[1] : -1;
      var walk = moves.filter(function (m) { return m.t === 'm' && m.to === step; });
      var walls = moves.filter(function (m) { return m.t === 'w'; });
      var x = rnd();
      if (walls.length && x < 0.18) return pick(walls);
      if (walk.length && x < 0.85) return walk[0];
      return pick(moves.filter(function (m) { return m.t === 'm'; }).concat(walk));
    }
    var best = -Infinity, bestMoves = [];
    moves.forEach(function (m) {
      var T = clone(S);
      play(T, m);
      var v;
      if (level === 'hard' && T.winner < 0) {
        // the reply that hurts most
        var worst = Infinity;
        candidates(T).forEach(function (r) {
          var U = clone(T);
          play(U, r);
          worst = Math.min(worst, score(U, who));
        });
        v = worst === Infinity ? score(T, who) : worst;
      } else v = score(T, who);
      if (level === 'medium') v += rnd() * 6;                 // a little uneven, so it is beatable
      if (v > best + 1e-9) { best = v; bestMoves = [m]; } else if (Math.abs(v - best) <= 1e-9) bestMoves.push(m);
    });
    return pick(bestMoves);
  }

  function valid(S) {
    if (!S || !Array.isArray(S.pos) || S.pos.length !== 2 || !Array.isArray(S.walls) || !Array.isArray(S.left) || !FLAGS[S.flag]) return false;
    if (S.pos.some(function (i) { return !(i >= 0 && i < N * N); }) || S.pos[0] === S.pos[1]) return false;
    if (S.left.some(function (n) { return !(n >= 0 && n <= WALLS); }) || (S.turn !== 0 && S.turn !== 1)) return false;
    if (S.walls.length !== 2 * WALLS - S.left[0] - S.left[1]) return false;
    var seen = [];
    for (var i = 0; i < S.walls.length; i++) {
      var w = S.walls[i];
      if ((w.o !== 'h' && w.o !== 'v') || !(w.r >= 0 && w.r <= N - 2 && w.c >= 0 && w.c <= N - 2) || clashes(seen, w)) return false;
      seen.push(w);
    }
    return true;
  }

  return { N: N, WALLS: WALLS, START: START, FLAGS: FLAGS, LEVELS: LEVELS, rc: rc, at: at, newGame: newGame, clone: clone,
    pawnMoves: pawnMoves, wallOk: wallOk, legal: legal, play: play, path: path, dist: dist, isGoal: isGoal,
    blockedSet: blockedSet, clashes: clashes, candidates: candidates, think: think, score: score, valid: valid };
}
if (typeof module !== 'undefined') module.exports = CorridorEngineFactory;
/* ==== ENGINE END ==== */
</script>

  var params = new URLSearchParams(location.search);

  /* ------------------------------------------------------------ setup */

  function newGame(o) {

  function current() { return { mode: G.mode, level: G.level, flag: G.flag }; }

  function isBot(seat) { return G.mode === 'bot' && seat === 1; }

      var rnd = G.daily ? C.daily('corridor', G.daily + '|' + G.S.plies).rng : Math.random;
      var m = E.think(G.S, G.level, rnd);

  }

  /* ------------------------------------------------------------- moves */

  function act(m) {
    var before = E.clone(G.S), who = G.S.turn;

    G.hist.push({ S: before, moves: G.moves.slice() });
    if (G.hist.length > 80) G.hist.shift();
    if (m.t === 'm') G.moves[who]++;
    preview = null; msg = ''; mode = 'pawn';
    C.feedback(isBot(who) ? 'soft' : m.t === 'w' ? 'place' : 'tap');
    if (G.S.winner >= 0) { G.done = true; render(); finish(); return true; }
    cur = G.S.pos[G.S.turn];
    render(); save();
    maybeBot();
    return true;
  }

  // Against the bot one undo takes back its reply and your move together
  function undo() {

    var steps = G.mode === 'bot' ? (isBot(G.S.turn) ? 1 : 2) : 1;
    if (G.hist.length < steps) steps = G.hist.length;
    var h;
    for (var k = 0; k < steps; k++) h = G.hist.pop();
    G.S = h.S; G.moves = h.moves;
    preview = null; msg = ''; cur = G.S.pos[G.S.turn];
    if (G.S.left[G.S.turn] < 1) mode = 'pawn';
    C.feedback('soft');
    render(); save();
    maybeBot();
  }

  function tryWall(w) {
    if (G.S.left[G.S.turn] < 1) { msg = C.t('noWalls'); C.feedback('bad'); preview = null; render(); return; }
    if (preview && preview.o === w.o && preview.r === w.r && preview.c === w.c) {

      C.feedback('bad'); msg = C.t('wallBad'); render(); return;

  }
  function placePreview() {

  function dropPreview() { preview = null; msg = ''; render(); }

  /* ------------------------------------------------------------ result */

  function pname(seat) {

    return isBot(seat) ? C.t('bot') + ' · ' + C.t(G.level) : (prefs.p2name || C.t('playerN', { n: C.num(2) }));
  }

  function finish() {
    stop();
    var S = G.S, vsBot = G.mode === 'bot', tie = S.winner === 2, won = vsBot ? S.winner === 0 : !tie;
    var base = vsBot ? ({ easy: 6, medium: 12, hard: 20 }[G.level] || 12) : 8;
    var coins = Math.max(2, Math.round(won ? base : base * 0.3)) + (G.daily ? 8 : 0);
    var points = Math.max(3, Math.round(won ? base * 4 : base * 1.2)) + (G.daily ? 25 : 0);
    if (vsBot && won) {

    }
    ctx.clearSave();

        timeMs: Date.now() - G.startedAt, coins: coins, points: points,
        lines: [

          { label: C.t('wallsL'), value: C.num(E.WALLS - S.left[0]) + ' / ' + C.num(E.WALLS - S.left[1]) }

        shareText: 'چوگان · راهرو' + (G.daily ? ('\nروزانه ' + G.daily) : '') + '\n' + (tie ? C.t('drawn') : pname(seat)),
        paint: cardPaint(),
        onAgain: G.daily ? null : function () { newGame(current()); }
      });
    }, C.ui.reduceMotion() ? 150 : 600);
  }

  /* ------------------------------------------------------------- saves */

  ctx.autosave(function () {

  function save() { ctx.save(); }

      E.valid(g.S) && g.S.winner < 0 && g.S.flag === g.flag && Array.isArray(g.moves));
  }
  function restore(g) {

  function askNew() {

      if (o.mode === 'bot') body.appendChild(C.ui.segmented(E.LEVELS.map(function (l) { return { value: l, label: C.t(l) }; }), o.level, function (v) { o.level = v; }));

  /* --------------------------------------------------------------- draw */

  function colors() {
    var cs = getComputedStyle(document.documentElement);
    var v = function (k, f) { return cs.getPropertyValue(k).trim() || f; };
    return { board: v('--cr-board', '#2B2622'), cell: v('--cr-cell', '#3A3530'), groove: v('--cr-groove', '#B3262E'),
      wall: v('--cr-wall', '#C68B4A'), wallDk: v('--cr-wall-dk', '#8A5A2B'), p0: v('--cr-p0', '#EED9AE'), p1: v('--cr-p1', '#7A4526'),

  // Shared by drawing and by reading a tap, so a tap lands on what is drawn under it
  function geo(W) {

  function wallRect(G2, w) {

  function paintBoard(g, W, o, col) {
    var Q = geo(W), S = o.S;
    g.fillStyle = col.groove;
    C.rrect(g, 0, 0, W, W, W * 0.03); g.fill();
    // the far rows a little lit in the colour of the pawn that makes for them
    g.fillStyle = col.board;
    C.rrect(g, Q.pad * 0.35, Q.pad * 0.35, W - Q.pad * 0.7, W - Q.pad * 0.7, W * 0.025); g.fill();
    g.fillStyle = col.groove;

    for (var i = 0; i < E.N * E.N; i++) {
      var p = cellXY(Q, i), r = Math.floor(i / E.N);

    });

      var q = cellXY(Q, f), x = q.x + Q.s * 0.36, y0 = q.y + Q.s * 0.14, y1 = q.y + Q.s * 0.88;
      g.fillStyle = '#4A423B'; C.rrect(g, q.x, q.y, Q.s, Q.s, Q.s * 0.14); g.fill();
      g.strokeStyle = '#E8C27A'; g.lineWidth = Math.max(2, Q.s * 0.07); g.lineCap = 'round';

      g.fillStyle = '#E23B3B';
      g.beginPath(); g.moveTo(x, y0); g.lineTo(x + Q.s * 0.46, y0 + Q.s * 0.17); g.lineTo(x, y0 + Q.s * 0.34); g.closePath(); g.fill();

      g.strokeStyle = edge; g.lineWidth = Math.max(1, Q.g * 0.14); g.stroke();

      grd.addColorStop(0, seat === 0 ? '#FFF6E2' : '#A56A44'); grd.addColorStop(1, seat === 0 ? col.p0 : col.p1);
      g.fillStyle = grd; g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();
      g.strokeStyle = 'rgba(0,0,0,.3)'; g.lineWidth = Math.max(1, R * 0.08); g.stroke();
      if (o.turn === seat && !o.done) { g.strokeStyle = col.accent; g.lineWidth = Math.max(2, R * 0.16); g.beginPath(); g.arc(cx, cy, R * 1.22, 0, Math.PI * 2); g.stroke(); }
    });

      var k = cellXY(Q, o.cursor);
      g.strokeStyle = '#FFFFFF'; g.lineWidth = Math.max(2, Q.s * 0.06);

    }
  }

  function boardSize() {

  }
  function cardPaint() {
    var o = { S: E.clone(G.S), turn: -1, done: true };
    return function (g, W, H) {
      var side = Math.min(W, H);
      g.translate((W - side) / 2, (H - side) / 2);
      paintBoard(g, side, o, colors());
    };
  }

  function renderTop() {
    top.innerHTML = '';
    if (G.daily) {
      top.appendChild(el('span', { class: 'ch-badge ch-badge--accent' }, [C.icon('calendar', 14), el('span', { text: C.t('dailyCr') + ' — ' + C.num(G.daily) })]));
      top.appendChild(el('span', { class: 'ch-badge', text: C.t('vsMedium') }));
      return;
    }
    top.appendChild(el('button', { class: 'ch-badge ch-tap', type: 'button', onclick: settings,
      text: (G.mode === 'bot' ? C.t('vsBot') + ' · ' + C.t(G.level) : C.t('people')) + (G.flag !== 'none' ? ' · ' + C.t('flagT') + ': ' + C.t('flag' + G.flag.charAt(0).toUpperCase() + G.flag.slice(1)) : '') }));
    var gear = el('button', { class: 'ch-iconbtn', type: 'button', 'aria-label': C.t('settings'), title: C.t('settings') }, [C.icon('gear', 20)]);
    gear.addEventListener('click', settings);
    top.appendChild(gear);
  }
  function renderSide() {
    players.innerHTML = '';
    [0, 1].forEach(function (seat) {
      var b = el('div', { class: 'cr-player' + (G.S.turn === seat && !G.done ? ' cr-player--on' : '') + (isBot(seat) && G.S.turn === 1 && !G.done ? ' cr-thinking' : '') }, [
        el('div', { class: 'cr-player__dot', style: { background: seat === 0 ? 'var(--cr-p0)' : 'var(--cr-p1)' } }),
        el('div', { class: 'cr-player__name', text: pname(seat) }),
        el('div', { class: 'cr-player__walls', text: C.t('wallsN', { n: C.num(G.S.left[seat]) }) })
      ]);
      players.appendChild(b);
    });
    modeRow.innerHTML = '';
    var mine = !busy(), left = G.S.left[G.S.turn];
    var seg = C.ui.segmented([{ value: 'pawn', label: C.t('modePawn') }, { value: 'wall', label: C.t('modeWall', { n: C.num(left) }) }], mode, function (v) {
      if (v === 'wall' && left < 1) { msg = C.t('noWalls'); C.feedback('bad'); renderSide(); return; }
      mode = v; preview = null; msg = ''; render();
    });
    if (!mine) seg.style.opacity = '.5';
    modeRow.appendChild(seg);
    tools.innerHTML = '';
    tools.classList.toggle('cr-tools--off', !preview || !mine);
    if (preview) {
      var ok = E.wallOk(G.S, preview);
      tools.appendChild(el('button', { class: 'ch-btn ch-btn--soft ch-btn--sm', type: 'button', onclick: rotatePreview }, [C.icon('rotate', 16), el('span', { text: C.t('rotate') })]));
      var put = el('button', { class: 'ch-btn ch-btn--primary ch-btn--sm', type: 'button', onclick: placePreview, text: C.t('place') });
      put.disabled = !ok;
      tools.appendChild(put);
      tools.appendChild(el('button', { class: 'ch-iconbtn ch-iconbtn--plain', type: 'button', 'aria-label': C.t('drop'), title: C.t('drop'), onclick: dropPreview }, [C.icon('close', 18)]));
    }
    var line = msg;
    if (!line) {
      if (G.done) line = '';
      else if (isBot(G.S.turn)) line = C.t('thinking');
      else if (G.mode === 'people') line = C.t('turnOf', { n: pname(G.S.turn) });
      else line = C.t('yourMove') + (G.flag !== 'none' ? ' · ' + C.t('flagGoal') : '');
    }
    status.textContent = line;
  }
  function render() { renderTop(); renderSide(); draw(); }

  /* -------------------------------------------------------------- input */

  function readTap(x, y) {
    var r = cv.getBoundingClientRect(), Q = geo(r.width);
    var lx = x - r.left - Q.pad, ly = y - r.top - Q.pad;
    var c = Math.floor(lx / Q.step), rr = Math.floor(ly / Q.step);
    var inCell = c >= 0 && rr >= 0 && c < E.N && rr < E.N && lx - c * Q.step <= Q.s && ly - rr * Q.step <= Q.s;
    // the nearest groove crossing, and which groove of it the tap is nearer to
    var ac = Math.max(0, Math.min(E.N - 2, Math.round((lx - Q.s - Q.g / 2) / Q.step)));
    var ar = Math.max(0, Math.min(E.N - 2, Math.round((ly - Q.s - Q.g / 2) / Q.step)));
    var cx = (ac + 1) * Q.s + ac * Q.g + Q.g / 2, cy = (ar + 1) * Q.s + ar * Q.g + Q.g / 2;
    var o = Math.abs(lx - cx) >= Math.abs(ly - cy) ? 'h' : 'v';
    return { cell: inCell ? rr * E.N + c : -1, wall: { o: o, r: ar, c: ac } };
  }
  cv.addEventListener('pointerdown', function (e) {
    if (busy()) return;
    e.preventDefault();
    kbOn = false;
    var t = readTap(e.clientX, e.clientY);
    if (mode === 'pawn' && t.cell >= 0) {
      if (E.pawnMoves(G.S, G.S.turn).indexOf(t.cell) >= 0) { act({ t: 'm', to: t.cell }); return; }
      if (preview) { dropPreview(); return; }
      return;
    }
    // in wall mode anywhere, and in pawn mode on a groove, a tap shows a wall
    if (mode === 'wall' || t.cell < 0) { if (mode !== 'wall' && G.S.left[G.S.turn] > 0) mode = 'wall'; tryWall(t.wall); }
  });

  window.addEventListener('keydown', function (e) {
    if (!G || document.querySelector('.ch-scrim')) return;
    if (C.undoKey(e)) { undo(); e.preventDefault(); return; }
    if (busy() || e.ctrlKey || e.metaKey || e.altKey) return;
    var tg = e.target && e.target.tagName;
    if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT') return;
    // the board is drawn left to right in every language, so the arrows are geometric (#338)
    var d = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    if (C.keyIs(e, 'w')) {
      e.preventDefault();
      if (mode === 'pawn' && G.S.left[G.S.turn] < 1) { msg = C.t('noWalls'); renderSide(); return; }
      mode = mode === 'pawn' ? 'wall' : 'pawn'; preview = null; msg = '';
      if (mode === 'wall') { var p = E.rc(G.S.pos[G.S.turn]); preview = { o: 'h', r: Math.max(0, Math.min(7, p[0] - (G.S.turn === 0 ? 1 : 0))), c: Math.max(0, Math.min(7, p[1])) }; msg = E.wallOk(G.S, preview) ? '' : C.t('wallBad'); }
      render(); return;
    }
    if (mode === 'wall') {
      if (!preview) preview = { o: 'h', r: 3, c: 3 };
      if (d) { e.preventDefault(); preview = { o: preview.o, r: Math.max(0, Math.min(7, preview.r + d[0])), c: Math.max(0, Math.min(7, preview.c + d[1])) }; msg = E.wallOk(G.S, preview) ? '' : C.t('wallBad'); render(); return; }
      if (C.keyIs(e, 'r')) { e.preventDefault(); rotatePreview(); return; }
      if (e.key === 'Escape') { e.preventDefault(); mode = 'pawn'; dropPreview(); return; }
      if (e.key === 'Enter' || e.key === ' ') { if (tg === 'BUTTON') return; e.preventDefault(); placePreview(); return; }
      return;
    }
    if (d) {
      e.preventDefault();
      if (!kbOn) { kbOn = true; cur = G.S.pos[G.S.turn]; }
      var q = E.rc(cur);
      cur = E.at(Math.max(0, Math.min(8, q[0] + d[0])), Math.max(0, Math.min(8, q[1] + d[1])));
      draw(); return;
    }
    if ((e.key === 'Enter' || e.key === ' ') && kbOn && tg !== 'BUTTON') {
      e.preventDefault();
      if (E.pawnMoves(G.S, G.S.turn).indexOf(cur) >= 0) act({ t: 'm', to: cur });
      else C.feedback('bad');
    }
  });

  if (window.ResizeObserver) new ResizeObserver(function () { draw(); }).observe(box);
  else window.addEventListener('resize', draw);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);

  /* --------------------------------------------------------------- help */

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [
          kb('← ↑ → ↓', C.t('kCursor')), kb('Space / Enter', C.t('kGo')), kb('W', C.t('kWall')), kb('R', C.t('kRotate')), kb('Esc', C.t('kDrop')), kb('U / Ctrl+Z', C.t('undoMove'))
        ])
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  // 5×5 corner of the board for the tutorial
  function tArt(kind) {
    var s = '<svg viewBox="0 0 200 110" width="100%"><rect x="45" y="2" width="110" height="106" rx="8" fill="#B3262E"/>';
    for (var r = 0; r < 5; r++) for (var c = 0; c < 5; c++) s += '<rect x="' + (50 + c * 20.5) + '" y="' + (6 + r * 20.5) + '" width="17" height="17" rx="3" fill="' + (r === 0 ? '#5C5346' : '#3A3530') + '"/>';
    var pawn = function (r2, c2, f) { return '<circle cx="' + (58.5 + c2 * 20.5) + '" cy="' + (14.5 + r2 * 20.5) + '" r="6.5" fill="' + f + '" stroke="rgba(0,0,0,.35)"/>'; };
    if (kind === 1) s += pawn(3, 2, '#EED9AE') + '<path d="M108 75v-55" stroke="#E80450" stroke-width="3" stroke-dasharray="3 4"/>';
    if (kind === 2) s += pawn(4, 2, '#EED9AE') + pawn(0, 2, '#7A4526') + '<rect x="70" y="40.5" width="38" height="3.5" rx="1.5" fill="#C68B4A"/>';
    if (kind === 3) s += pawn(2, 2, '#EED9AE') + pawn(1, 2, '#7A4526') + '<path d="M101 50 L101 30" stroke="#E80450" stroke-width="2.5" marker-end="url(#a)"/><defs><marker id="a" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#E80450"/></marker></defs>';
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: tArt(1) },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: tArt(2) },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: tArt(3) }
  ];

  /* -------------------------------------------------------------- start */

  var saved = ctx.loadSave();
  if (validSave(saved) && (saved.g.daily || null) === (dailyDate || null)) restore(saved.g);
  else newGame(dailyDate ? { daily: dailyDate } : { mode: prefs.mode, level: prefs.level, flag: prefs.flag });
  if (dailyDate && C.stats.dailyDone('corridor', dailyDate)) {
    var rec = C.stats.dailyOf(dailyDate).corridor;
    C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
  }
  ctx.tutorialIfNew(TUT);
})();
</script>
</body>
</html>
