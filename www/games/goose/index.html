<script>
/* ==== ENGINE START ==== */
function GooseEngineFactory() {
  'use strict';

  // The classic Game of the Goose: 63 squares and a start, wound into an 8×8 spiral.
  var END = 63;
  var GEESE = [5, 9, 14, 18, 23, 27, 32, 36, 41, 45, 50, 54, 59];
  // bridge, maze and death move the pawn at once; the inn, the well and the prison hold it
  var JUMPS = { 6: 12, 42: 39, 58: 1 };
  var NAMES = { 0: 'start', 6: 'bridge', 19: 'inn', 31: 'well', 42: 'maze', 52: 'prison', 58: 'death', 63: 'goal' };
  var IS_GOOSE = {};
  GEESE.forEach(function (n) { IS_GOOSE[n] = true; });

  function kind(n) { return IS_GOOSE[n] ? 'goose' : (NAMES[n] || ''); }

  // Square n as [column, row], row 0 at the top: the start in the bottom left corner,
  // then round the edge and inwards, so 63 ends in the middle as on the printed boards.
  var CELLS = (function () {
    var out = [], t = 0, b = 7, l = 0, r = 7, x, y;
    while (out.length < 64) {
      for (x = l; x <= r && out.length < 64; x++) out.push([x, b]);
      b--;
      for (y = b; y >= t && out.length < 64; y--) out.push([r, y]);
      r--;
      for (x = r; x >= l && out.length < 64; x--) out.push([x, t]);
      t++;
      for (y = t; y <= b && out.length < 64; y++) out.push([l, y]);
      l++;
    }
    return out;
  })();
  function cell(n) { return CELLS[n].slice(); }

  // pos: 0 is the start. wait: turns still to miss. trap: 31 or 52 while held in the
  // well or the prison, which another player landing there ends. moved: the first
  // throw is made (only the first throw of 9 takes the shortcut to 26 or 53).
  function newGame(n) {
    var S = { pos: [], wait: [], trap: [], moved: [], turn: 0, winner: -1, rolls: 0 };
    for (var i = 0; i < n; i++) { S.pos.push(0); S.wait.push(0); S.trap.push(0); S.moved.push(false); }
    return S;
  }
  function copy(S) {
    return { pos: S.pos.slice(), wait: S.wait.slice(), trap: S.trap.slice(), moved: S.moved.slice(), turn: S.turn, winner: S.winner, rolls: S.rolls };
  }

  function isInt(v) { return typeof v === 'number' && Math.floor(v) === v; }

  // A saved game is checked before it is restored, so a hand-edited or stale save
  // cannot leave a pawn off the board or held for ever
  function valid(S) {
    if (!S || typeof S !== 'object' || !Array.isArray(S.pos)) return false;
    var n = S.pos.length;
    if (n < 2 || n > 4) return false;
    if (!Array.isArray(S.wait) || !Array.isArray(S.trap) || !Array.isArray(S.moved)) return false;
    if (S.wait.length !== n || S.trap.length !== n || S.moved.length !== n) return false;
    if (!isInt(S.turn) || S.turn < 0 || S.turn >= n) return false;
    if (!isInt(S.winner) || S.winner < -1 || S.winner >= n) return false;
    if (!isInt(S.rolls) || S.rolls < 0) return false;
    for (var i = 0; i < n; i++) {
      var p = S.pos[i], w = S.wait[i], tr = S.trap[i];
      if (!isInt(p) || p < 0 || p > END) return false;
      if ((p === END) !== (S.winner === i)) return false;
      if (!isInt(w) || w < 0 || w > 2) return false;
      if (tr !== 0 && tr !== 31 && tr !== 52) return false;
      if (tr && (p !== tr || w < 1)) return false;
      if (w && !tr && !(p === 19 && w === 1)) return false;
      if (typeof S.moved[i] !== 'boolean') return false;
    }
    return true;
  }

  function roll(rnd) { return [1 + Math.floor(rnd() * 6), 1 + Math.floor(rnd() * 6)]; }

  // Walks t squares one by one. Past 63 the rest of the throw walks back (once the
  // direction has turned it stays turned, so a goose met on the way back keeps going back).
  function walk(p, t, dir, steps, ev) {
    for (var k = 0; k < t; k++) {
      if (p === END && dir > 0) { dir = -1; ev.push({ type: 'bounce' }); }
      p += dir;
      if (p < 0) p = 0;
      steps.push({ n: p });
    }
    return { p: p, dir: dir };
  }

  // Plays the throw a + b for the player to move. Returns the new state, every
  // square passed (for the animation; jump: a bridge, maze, death or the first 9)
  // and the events in the order they happened.
  function play(S, a, b) {
    if (!S || S.winner >= 0) return null;
    if (!isInt(a) || !isInt(b) || a < 1 || a > 6 || b < 1 || b > 6) return null;
    if (S.wait[S.turn] > 0) return null;
    var N = copy(S), me = N.turn, t = a + b, steps = [], ev = [], p = N.pos[me];
    if (!N.moved[me] && t === 9) {
      // without this a first 9 rides the geese straight home: 9, 18, … 63
      p = (a === 6 || b === 6) ? 26 : 53;
      steps.push({ n: p, jump: true });
      ev.push({ type: 'nine', to: p });
    } else {
      var w = walk(p, t, 1, steps, ev);
      p = w.p;
      for (var guard = 0; guard < 40; guard++) {
        if (IS_GOOSE[p]) {
          var e = { type: 'goose', at: p, to: p };
          ev.push(e);
          w = walk(p, t, w.dir, steps, ev);
          p = e.to = w.p;
        } else if (JUMPS[p] !== undefined) {
          ev.push({ type: kind(p), at: p, to: JUMPS[p] });
          p = JUMPS[p];
          steps.push({ n: p, jump: true });
        } else break;
      }
    }
    N.pos[me] = p;
    N.moved[me] = true;
    if (p === 19) {
      N.wait[me] = 1;
      ev.push({ type: 'inn' });
    } else if (p === 31 || p === 52) {
      ev.push({ type: p === 31 ? 'well' : 'prison' });
      for (var j = 0; j < N.pos.length; j++) {
        if (j !== me && N.trap[j] === p) { N.wait[j] = 0; N.trap[j] = 0; ev.push({ type: 'free', seat: j }); }
      }
      // two turns at most, for everyone: with only bots left in the well a game
      // could otherwise wait for a rescuer who never comes
      N.wait[me] = 2;
      N.trap[me] = p;
    } else if (p === END) {
      N.winner = me;
      ev.push({ type: 'win' });
    }
    N.rolls++;
    if (N.winner < 0) N.turn = (me + 1) % N.pos.length;
    return { state: N, steps: steps, events: ev };
  }

  // A held player's turn goes by without a throw
  function pass(S) {
    if (!S || S.winner >= 0 || !(S.wait[S.turn] > 0)) return null;
    var N = copy(S), me = N.turn;
    N.wait[me]--;
    if (!N.wait[me]) N.trap[me] = 0;
    N.turn = (me + 1) % N.pos.length;
    return { state: N, steps: [], events: [{ type: 'skip', seat: me }] };
  }

  function waiting(S) { return S.wait[S.turn] > 0; }

  var api = {
    END: END, GEESE: GEESE, JUMPS: JUMPS, kind: kind, cell: cell, newGame: newGame, copy: copy,
    valid: valid, roll: roll, play: play, pass: pass, waiting: waiting
  };
  if (typeof self !== 'undefined') self.GooseEngine = api;
  return api;
}
if (typeof module !== 'undefined' && module.exports) module.exports = GooseEngineFactory;
/* ==== ENGINE END ==== */
</script>

  // seats[0] is always the person holding the phone; the others are people or bots
  var prefs = ctx.store.get('prefs', { players: 2, seats: ['person', 'bot', 'bot', 'bot'] });
  function cleanPrefs(p) {
    var out = { players: [2, 3, 4].indexOf(p && p.players) >= 0 ? p.players : 2, seats: ['person', 'bot', 'bot', 'bot'] };
    for (var i = 1; i < 4; i++) if (p && Array.isArray(p.seats) && p.seats[i] === 'person') out.seats[i] = 'person';
    return out;
  }
  prefs = cleanPrefs(prefs);

  // G: the game. phase: 'roll' (waiting for a throw) or 'busy' (dice or a pawn moving).
  var G = null, timer = null, raf = 0, anim = null;

  var cv = document.createElement('canvas');
  cv.className = 'gs-canvas';
  cv.setAttribute('role', 'img');
  cv.setAttribute('aria-label', C.t('boardLabel'));
  var box = el('div', { class: 'gs-box' }, [cv]);
  var top = el('div', { class: 'gs-top ch-above' });
  var playersRow = el('div', { class: 'gs-players ch-above' });
  var logLine = el('div', { class: 'gs-log' });
  var turnLine = el('div', { class: 'gs-turn' });
  var status = el('div', { class: 'gs-status', role: 'status', 'aria-live': 'polite' }, [logLine, turnLine]);
  var dice = el('button', { class: 'gs-dice', type: 'button', 'aria-label': C.t('roll') });
  var bar = el('div', { class: 'gs-bar' }, [status, dice]);
  var wrap = el('div', { class: 'gs-wrap ch-split' }, [el('div', { class: 'ch-fit' }, [box]), el('div', { class: 'ch-side' }, [top, playersRow, bar])]);

  ctx.button({ icon: 'help', label: C.t('help'), onClick: showHelp });
  ctx.button({ icon: 'refresh', label: C.t('newMatch'), onClick: settings });
  ctx.main.appendChild(wrap);
  ctx.mount();

  /* ------------------------------------------------------------ setup */

  function newGame(o) {
    stop();
    anim = null;
    G = {
      players: o.players, seats: o.seats.slice(0, o.players), phase: 'roll', roll: null, log: '',
      myThrows: 0, geese: 0, startedAt: Date.now(), done: false
    };
    G.s = E.newGame(G.players);
    prefs.players = o.players;
    for (var i = 1; i < o.players; i++) prefs.seats[i] = o.seats[i];
    ctx.store.set('prefs', prefs);
    render();
    save();
    startTurn();
  }
  function current() {
    var seats = prefs.seats.slice();
    for (var i = 0; i < G.players; i++) seats[i] = G.seats[i];
    return { players: G.players, seats: seats };
  }
  function fromPrefs() { return { players: prefs.players, seats: prefs.seats.slice() }; }

  function isBot(seat) { return G.seats[seat] === 'bot'; }
  function humans() { return G.seats.filter(function (s) { return s !== 'bot'; }).length; }
  function stop() {
    if (timer) { clearTimeout(timer); timer = null; }
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  }
  function later(fn, ms) { stop(); timer = setTimeout(function () { timer = null; fn(); }, ms); }
  // card games' Slow / Normal / Fast setting paces the bots, the dice and the pawn
  function pace(ms) { return C.cards.pace(ms); }

  /* ------------------------------------------------------------- turns */

  function startTurn() {
    if (!G || G.done) return;
    G.phase = 'roll';
    G.roll = null;
    render();
    // a held player's turn goes by on its own, slow enough to read why
    if (E.waiting(G.s)) { G.phase = 'busy'; render(); later(doPass, pace(900)); return; }
    if (isBot(G.s.turn)) later(doRoll, pace(700));
  }

  function doPass() {
    if (!G || G.done) return;
    var r = E.pass(G.s);
    if (!r) { startTurn(); return; }
    G.s = r.state;
    G.log = C.t('evSkip', { n: pname(r.events[0].seat) });
    save();
    startTurn();
  }

  function doRoll() {
    if (!G || G.done || G.phase !== 'roll' || E.waiting(G.s)) return;
    G.phase = 'busy';
    var who = G.s.turn, v = E.roll(Math.random);
    if (who === 0) G.myThrows++;
    dice.classList.add('gs-dice--roll');
    drawDice([1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)]);
    C.feedback('clack');
    render();
    later(function () {
      dice.classList.remove('gs-dice--roll');
      G.roll = v;
      // saved the moment it is known, so a reload plays this throw, not a new one
      save();
      drawDice(v);
      later(move, pace(260));
    }, C.ui.reduceMotion() ? 120 : pace(520));
  }

  function evText(r) {
    var parts = [], geese = 0;
    r.events.forEach(function (e) { if (e.type === 'goose') geese++; });
    var saidGoose = false;
    r.events.forEach(function (e) {
      var t = e.type;
      if (t === 'goose') {
        // a chain of six geese reads as one line, not six
        if (!saidGoose) parts.push(C.t('evGoose') + (geese > 1 ? ' ×' + C.num(geese) : ''));
        saidGoose = true;
      } else if (t === 'nine') parts.push(C.t('evNine', { n: C.num(e.to) }));
      else if (t === 'free') parts.push(C.t('evFree', { n: pname(e.seat) }));
      else if (t !== 'win') parts.push(C.t('ev' + t.charAt(0).toUpperCase() + t.slice(1)));
    });
    return parts;
  }

  function move() {
    if (!G || G.done || !G.roll) return;
    var who = G.s.turn, a = G.roll[0], b = G.roll[1], r = E.play(G.s, a, b);
    if (!r) { G.roll = null; startTurn(); return; }
    G.phase = 'busy';
    var pts = [{ n: G.s.pos[who] }].concat(r.steps);
    anim = { seat: who, pts: pts, k: 0, f: 0, t0: 0, from: G.s };
    G.log = C.t('threw', { n: pname(who), a: C.num(a), b: C.num(b) });
    render();
    C.feedback('place');
    var reduce = C.ui.reduceMotion();
    function dur(st) { return reduce ? pace(st.jump ? 160 : 70) : pace(st.jump ? 420 : 170); }
    function frame(now) {
      raf = 0;
      if (!anim) return;
      if (!anim.t0) anim.t0 = now;
      var d = dur(anim.pts[anim.k + 1]), f = (now - anim.t0) / d;
      if (f >= 1) {
        anim.k++;
        anim.t0 = now;
        f = 0;
        if (anim.k >= anim.pts.length - 1) { arrive(who, r); return; }
        C.feedback(anim.pts[anim.k + 1].jump ? 'whoosh' : 'place');
      }
      // reduced motion: the pawn steps square to square without the hop in between
      anim.f = reduce ? 0 : f;
      draw();
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
  }

  function arrive(who, r) {
    anim = null;
    G.s = r.state;
    var a = G.roll[0], b = G.roll[1], parts = evText(r);
    G.log = C.t('threw', { n: pname(who), a: C.num(a), b: C.num(b) }) + (parts.length ? ' · ' + parts.join(' · ') : '');
    if (who === 0) r.events.forEach(function (e) { if (e.type === 'goose') G.geese++; });
    var bad = r.events.some(function (e) { return /inn|well|prison|maze|death/.test(e.type); });
    var good = r.events.some(function (e) { return /goose|bridge|nine/.test(e.type); });
    if (bad) C.feedback('bad'); else if (good) C.feedback('good');
    G.roll = null;
    if (G.s.winner >= 0) {
      G.done = true;
      render();
      later(finish, pace(700));
      return;
    }
    save();
    render();
    later(startTurn, pace(parts.length ? 750 : 300));
  }

  /* ------------------------------------------------------------ result */

  // A game of pure luck: small rewards, and the one award is for finishing a race
  function finish() {
    stop();
    var w = G.s.winner, solo = humans() === 1, won = solo ? w === 0 : null;
    var coins = solo ? (won ? 4 : 2) : 3, points = solo ? (won ? 12 + (G.players - 2) * 3 : 5) : 8;
    C.achievements.unlock('gs-finish');
    ctx.clearSave();
    ctx.finish({
      won: won,
      title: solo ? (won ? C.t('won') : C.t('lost')) : C.t('playerWon', { n: pname(w) }),
      timeMs: Date.now() - G.startedAt, coins: coins, points: points,
      lines: [
        { label: C.t('throwsLabel'), value: C.num(G.myThrows) },
        { label: C.t('geeseLabel'), value: C.num(G.geese) }
      ],
      shareText: 'چوگان · بازی غاز\n' + pname(w),
      paint: cardPaint(),
      onAgain: function () { newGame(current()); }
    });
  }

  /* ------------------------------------------------------------- saves */

  // Saved between turns and as soon as the dice land, with the throw. A pawn caught
  // mid-move is saved as the turn before it, so a reload plays the same throw again.
  ctx.autosave(function () {
    if (!G || G.done || (!G.s.rolls && !G.roll)) return { inProgress: false };
    return {
      g: { players: G.players, seats: G.seats, s: G.s, roll: G.roll, myThrows: G.myThrows, geese: G.geese, elapsed: Date.now() - G.startedAt },
      prefs: prefs
    };
  });
  function save() { ctx.save(); }

  function validSave(sv) {
    var g = sv && sv.g;
    return !!(g && E.valid(g.s) && g.s.winner < 0 && g.players === g.s.pos.length && Array.isArray(g.seats) &&
      g.seats.length === g.players && g.seats[0] === 'person' && g.seats.every(function (s) { return s === 'person' || s === 'bot'; }));
  }
  function restore(g) {
    G = {
      players: g.players, seats: g.seats.slice(), s: g.s, phase: 'roll', roll: null, log: '',
      myThrows: g.myThrows || 0, geese: g.geese || 0, startedAt: Date.now() - (g.elapsed || 0), done: false
    };
    render();
    var rl = g.roll;
    if (Array.isArray(rl) && rl.length === 2 && rl.every(function (v) { return v >= 1 && v <= 6 && Math.floor(v) === v; }) && !E.waiting(G.s)) {
      G.phase = 'busy'; G.roll = rl; drawDice(rl); later(move, 300);
    } else startTurn();
  }

  // New game settings in one window. Nothing changes until Start, so it doubles as
  // the "end this game?" question.
  function settings() {
    var o = G ? current() : fromPrefs(), body = el('div', { class: 'ch-col', style: { gap: 'var(--s-3)', 'align-items': 'center' } });
    var seatRows = [];
    body.appendChild(C.ui.segmented([2, 3, 4].map(function (n) { return { value: n, label: C.num(n) + ' ' + C.t('players') }; }),
      o.players, function (v) { o.players = v; seatRows.forEach(function (row, i) { row.hidden = i + 1 >= v; }); }));
    var list = el('div', { class: 'ch-list gs-seats' });
    for (var i = 1; i < 4; i++) {
      (function (i) {
        var row = el('div', { class: 'ch-item gs-seat' }, [
          el('div', { class: 'ch-item__label', text: C.t('playerN', { n: C.num(i + 1) }) }),
          C.ui.segmented([{ value: 'person', label: C.t('person') }, { value: 'bot', label: C.t('bot') }], o.seats[i], function (v) { o.seats[i] = v; })
        ]);
        row.hidden = i >= o.players;
        seatRows.push(row);
        list.appendChild(row);
      })(i);
    }
    list.appendChild(C.cards.speedRow());
    body.appendChild(list);
    if (G && G.s.rolls && !G.done) body.appendChild(el('p', { class: 'ch-xs ch-dim', text: C.t('resetWarn') }));
    C.ui.modal({
      title: C.t('newMatch'), closeButton: true, body: [body],
      actions: [{ label: C.t('cancel') }, { label: C.t('start'), kind: 'primary', onClick: function () { o.seats[0] = 'person'; newGame(o); } }]
    });
  }

  /* --------------------------------------------------------------- draw */

  var TILE = { goose: '#3C8CC0', bridge: '#A26A37', inn: '#D2742A', well: '#3F63B0', maze: '#3F8B4B', prison: '#5E6673', death: '#2B2B2B', goal: '#C9961A' };

  function colors() {
    var cs = getComputedStyle(document.documentElement);
    var v = function (k, f) { return cs.getPropertyValue(k).trim() || f; };
    return {
      c: [v('--gs-c0', '#E5484D'), v('--gs-c1', '#2F6FDE'), v('--gs-c2', '#E8A317'), v('--gs-c3', '#2E9E5B')],
      cell: v('--c-surface', '#FFFFFF'), bg: v('--c-surface-2', '#F7F1E8'), line: v('--c-line', '#E6DDD0'),
      text: v('--c-text', '#2B2118'), dim: v('--c-text-dim', '#7A6C5C'), accent: '#6E3C70'
    };
  }

  function centre(n) { var q = E.cell(n); return [q[0] + 0.5, q[1] + 0.5]; }

  function tint(hex, a) {
    var n = parseInt(hex.slice(1), 16);
    return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  // The glyph of a special square, drawn in white inside a box of side s centred on (x, y)
  function glyph(g, k, x, y, s, bgc) {
    g.save();
    g.translate(x, y);
    g.scale(s / 24, s / 24);
    g.fillStyle = '#FFFFFF'; g.strokeStyle = '#FFFFFF';
    g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = 2.2;
    g.beginPath();
    if (k === 'goose') {
      // body, neck and head looking right, with an orange beak
      g.ellipse(-2, 5, 8, 5, 0, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.moveTo(-9, 3); g.lineTo(-12, 0); g.lineTo(-8, 6); g.fill();
      g.beginPath(); g.lineWidth = 3.4; g.moveTo(4, 3); g.quadraticCurveTo(6, -2, 3, -6); g.stroke();
      g.beginPath(); g.arc(4, -7, 3, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.fillStyle = '#F2A33A'; g.moveTo(6.5, -8); g.lineTo(11, -6.5); g.lineTo(6.5, -5.5); g.fill();
      g.beginPath(); g.fillStyle = bgc; g.arc(4.6, -7.6, 0.9, 0, Math.PI * 2); g.fill();
    } else if (k === 'bridge') {
      g.moveTo(-11, 4); g.lineTo(11, 4); g.stroke();
      g.beginPath(); g.moveTo(-9, 4); g.quadraticCurveTo(0, -12, 9, 4); g.stroke();
      g.beginPath(); for (var i = -1; i <= 1; i++) { g.moveTo(i * 4.5, 4); g.lineTo(i * 4.5, i ? -1.5 : -4); } g.stroke();
      g.beginPath(); g.lineWidth = 1.6; g.moveTo(-11, 9); g.quadraticCurveTo(-5.5, 7, 0, 9); g.quadraticCurveTo(5.5, 11, 11, 9); g.stroke();
    } else if (k === 'inn') {
      g.moveTo(-10, -1); g.lineTo(0, -10); g.lineTo(10, -1); g.closePath(); g.fill();
      g.fillRect(-7.5, -1, 15, 11);
      g.fillStyle = bgc; g.fillRect(-2, 3, 4, 7);
      g.fillRect(-6, 1, 3, 3); g.fillRect(3, 1, 3, 3);
    } else if (k === 'well') {
      g.moveTo(-8, 1); g.lineTo(-8, 10); g.lineTo(8, 10); g.lineTo(8, 1); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(-7, 1); g.lineTo(-7, -7); g.moveTo(7, 1); g.lineTo(7, -7); g.stroke();
      g.beginPath(); g.moveTo(-10, -6); g.lineTo(0, -11); g.lineTo(10, -6); g.closePath(); g.fill();
      g.beginPath(); g.lineWidth = 1.4; g.moveTo(0, -6); g.lineTo(0, -2); g.stroke();
      g.fillRect(-1.6, -2, 3.2, 3);
      g.fillStyle = bgc; g.fillRect(-8, 4, 16, 1.4);
    } else if (k === 'maze') {
      g.lineWidth = 2;
      g.moveTo(-10, -10); g.lineTo(10, -10); g.lineTo(10, 10); g.lineTo(-10, 10); g.lineTo(-10, -5);
      g.moveTo(-5, -5); g.lineTo(5, -5); g.lineTo(5, 5); g.lineTo(-5, 5); g.lineTo(-5, 0); g.lineTo(0, 0);
      g.stroke();
    } else if (k === 'prison') {
      g.lineWidth = 2;
      g.rect(-9, -10, 18, 20); g.stroke();
      g.beginPath(); for (var b = -4.5; b <= 4.5; b += 4.5) { g.moveTo(b, -10); g.lineTo(b, 10); } g.stroke();
      g.beginPath(); g.moveTo(-9, -1); g.lineTo(9, -1); g.stroke();
    } else if (k === 'death') {
      g.arc(0, -2, 9, 0, Math.PI * 2); g.fill();
      g.fillRect(-5, 5, 10, 6);
      g.fillStyle = bgc;
      g.beginPath(); g.arc(-3.6, -2, 2.6, 0, Math.PI * 2); g.arc(3.6, -2, 2.6, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.moveTo(0, 2); g.lineTo(-1.5, 4.5); g.lineTo(1.5, 4.5); g.fill();
      g.fillRect(-2.6, 7.5, 1.2, 3.5); g.fillRect(1.4, 7.5, 1.2, 3.5);
    } else if (k === 'goal') {
      for (var p = 0; p < 10; p++) {
        var rr = p % 2 ? 4.8 : 11, an = -Math.PI / 2 + p * Math.PI / 5;
        if (p) g.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); else g.moveTo(Math.cos(an) * rr, Math.sin(an) * rr);
      }
      g.closePath(); g.fill();
    } else if (k === 'start') {
      g.strokeStyle = bgc; g.fillStyle = bgc;
      g.moveTo(-6, 11); g.lineTo(-6, -10); g.stroke();
      g.beginPath(); g.moveTo(-5, -10); g.lineTo(9, -6); g.lineTo(-5, -1); g.closePath(); g.fill();
    }
    g.restore();
  }

  function paintBoard(g, W, o, col) {
    var u = W / 8, s = o.s, gap = Math.max(1.5, u * 0.07), rad = u * 0.18;
    g.fillStyle = col.bg;
    C.rrect(g, 0, 0, W, W, Math.round(u * 0.3));
    g.fill();
    // the path: a band joining each square to the next, so the spiral reads at a glance
    // while squares on neighbouring rings stay apart
    g.strokeStyle = tint(col.accent, 0.35); g.lineWidth = u * 0.5; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath();
    for (var n = 0; n <= E.END; n++) { var c0 = centre(n); if (n) g.lineTo(c0[0] * u, c0[1] * u); else g.moveTo(c0[0] * u, c0[1] * u); }
    g.stroke();
    for (n = 0; n <= E.END; n++) {
      var q = E.cell(n), x = q[0] * u + gap, y = q[1] * u + gap, w = u - gap * 2, k = E.kind(n), fill = TILE[k];
      g.fillStyle = fill || (n === 0 ? tint(col.accent, 0.22) : col.cell);
      C.rrect(g, x, y, w, w, rad);
      g.fill();
      if (!fill) { g.strokeStyle = col.line; g.lineWidth = Math.max(1, u / 40); g.stroke(); }
      g.direction = 'ltr';
      if (fill || n === 0) {
        // the start flag is drawn in the text colour: white on the pale start tile vanished
        glyph(g, k, x + w / 2, y + w * 0.56, w * 0.62, fill || col.text);
        if (n) {
          g.fillStyle = 'rgba(255,255,255,.92)';
          g.font = '700 ' + Math.max(7, Math.round(u * 0.2)) + 'px Vazirmatn, system-ui, sans-serif';
          g.textAlign = 'left'; g.textBaseline = 'top';
          g.fillText(C.num(n), x + w * 0.08, y + w * 0.04);
        }
      } else {
        g.fillStyle = col.dim;
        g.font = '700 ' + Math.max(8, Math.round(u * 0.3)) + 'px Vazirmatn, system-ui, sans-serif';
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(C.num(n), x + w / 2, y + w / 2 + u * 0.02);
      }
    }
    // pawns; several on one square sit side by side and a little smaller
    var list = [];
    for (var seat = 0; seat < s.pos.length; seat++) {
      var at = centre(s.pos[seat]), key = 'n' + s.pos[seat], lift = 0;
      if (o.anim && o.anim.seat === seat) {
        var A = o.anim, p0 = centre(A.pts[A.k].n), p1 = centre(A.pts[Math.min(A.k + 1, A.pts.length - 1)].n), f = A.f;
        at = [p0[0] + (p1[0] - p0[0]) * f, p0[1] + (p1[1] - p0[1]) * f];
        lift = Math.sin(Math.PI * f) * (A.pts[A.k + 1] && A.pts[A.k + 1].jump ? 0.8 : 0.3);
        key = '';
      }
      list.push({ seat: seat, x: at[0], y: at[1], lift: lift, key: key });
    }
    var groups = {};
    list.forEach(function (t) { if (t.key) (groups[t.key] = groups[t.key] || []).push(t); });
    Object.keys(groups).forEach(function (key) {
      var gr = groups[key];
      if (gr.length < 2) return;
      gr.forEach(function (t, i) {
        var a = i * Math.PI * 2 / gr.length - Math.PI * 3 / 4;
        t.x += Math.cos(a) * 0.2; t.y += Math.sin(a) * 0.2; t.small = true;
      });
    });
    // the moving pawn is drawn last, on top of the others
    list.sort(function (a, b) { return (a.key ? 0 : 1) - (b.key ? 0 : 1); });
    list.forEach(function (t) {
      var R = u * (t.small ? 0.19 : 0.26), x = t.x * u, y = (t.y - t.lift) * u;
      g.beginPath(); g.ellipse(t.x * u + R * 0.1, t.y * u + R * 0.35, R * (1 - t.lift * 0.3), R * 0.55 * (1 - t.lift * 0.3), 0, 0, Math.PI * 2);
      g.fillStyle = 'rgba(0,0,0,.25)'; g.fill();
      g.beginPath(); g.arc(x, y, R, 0, Math.PI * 2);
      g.fillStyle = col.c[t.seat]; g.fill();
      g.lineWidth = Math.max(1.5, R * 0.22);
      g.strokeStyle = '#FFFFFF'; g.stroke();
      g.beginPath(); g.arc(x - R * 0.3, y - R * 0.32, R * 0.28, 0, Math.PI * 2);
      g.fillStyle = 'rgba(255,255,255,.45)'; g.fill();
    });
  }

  function boxSize() {
    var r = box.getBoundingClientRect(), side = Math.max(1, Math.floor(Math.min(r.width, r.height || r.width)));
    return { w: side, h: side };
  }

  function draw() {
    if (!G) return;
    var sz = boxSize(), W = sz.w, H = sz.h, dpr = Math.min(2, window.devicePixelRatio || 1);
    // both sides: a new canvas is 300×150 (#359)
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    var g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    paintBoard(g, W, { s: anim ? anim.from : G.s, anim: anim }, colors());
  }

  var PIPS = { 1: [[1, 1]], 2: [[0, 0], [2, 2]], 3: [[0, 0], [1, 1], [2, 2]], 4: [[0, 0], [2, 0], [0, 2], [2, 2]],
    5: [[0, 0], [2, 0], [1, 1], [0, 2], [2, 2]], 6: [[0, 0], [2, 0], [0, 1], [2, 1], [0, 2], [2, 2]] };
  function face(v, c) {
    var s = '<svg viewBox="0 0 44 44" width="44" height="44" aria-hidden="true"><rect x="2" y="2" width="40" height="40" rx="9" fill="var(--c-surface-2)" stroke="var(--c-line)" stroke-width="2"/>';
    if (v) PIPS[v].forEach(function (q) { s += '<circle cx="' + (10 + q[0] * 12) + '" cy="' + (10 + q[1] * 12) + '" r="4.4" fill="' + c + '"/>'; });
    // before a throw: a faint five, so the button reads as dice, not as "add"
    else PIPS[5].forEach(function (q) { s += '<circle cx="' + (10 + q[0] * 12) + '" cy="' + (10 + q[1] * 12) + '" r="4.4" fill="' + c + '" opacity=".25"/>'; });
    return s + '</svg>';
  }
  function drawDice(v) {
    var c = G ? 'var(--gs-c' + G.s.turn + ')' : 'var(--c-text)';
    dice.innerHTML = face(v && v[0], c) + face(v && v[1], c);
  }

  function cardPaint() {
    var s = E.copy(G.s);
    return function (g, W, H) {
      var side = Math.min(W, H);
      g.translate((W - side) / 2, (H - side) / 2);
      paintBoard(g, side, { s: s }, colors());
    };
  }

  function pname(seat) {
    if (seat === 0) return C.state.profile.name || C.t('you');
    if (isBot(seat)) return C.t('botN', { n: C.num(seat + 1) });
    return C.t('playerN', { n: C.num(seat + 1) });
  }

  function drawPlayers() {
    playersRow.innerHTML = '';
    for (var seat = 0; seat < G.players; seat++) {
      var p = G.s.pos[seat], w = G.s.wait[seat];
      var box = el('div', {
        class: 'gs-player' + (G.s.turn === seat && !G.done ? ' gs-player--on' : ''),
        style: { '--pc': 'var(--gs-c' + seat + ')' }
      }, [
        el('div', { class: 'gs-player__dot' }),
        el('div', { class: 'gs-player__name', text: pname(seat) }),
        el('span', { class: 'gs-player__n', text: (p ? C.num(p) : '–') + (w ? ' · ' + C.t('waits') : '') })
      ]);
      if (isBot(seat) && G.s.turn === seat && !G.done) box.classList.add('gs-thinking');
      playersRow.appendChild(box);
    }
  }

  function drawTop() {
    top.innerHTML = '';
    var bots = G.seats.filter(function (s) { return s === 'bot'; }).length;
    var text = C.num(G.players) + ' ' + C.t('players') + (bots ? ' · ' + C.num(bots) + ' ' + C.t('bot') : '');
    top.appendChild(el('button', { class: 'ch-badge ch-tap', type: 'button', onclick: settings, text: text }));
    var gear = el('button', { class: 'ch-iconbtn', type: 'button', 'aria-label': C.t('settings'), title: C.t('settings') }, [C.icon('gear', 20)]);
    gear.addEventListener('click', settings);
    top.appendChild(gear);
  }

  function drawBar() {
    var mine = !isBot(G.s.turn) && !G.done && !E.waiting(G.s);
    dice.style.setProperty('--pc', 'var(--gs-c' + G.s.turn + ')');
    dice.disabled = !(mine && G.phase === 'roll');
    dice.classList.toggle('gs-dice--ready', mine && G.phase === 'roll');
    if (G.phase === 'roll' && !G.roll) drawDice(null);
    var who = G.done ? C.t('playerWon', { n: pname(G.s.winner) }) : (G.s.turn === 0 ? C.t('yourTurn') : C.t('turnOf', { n: pname(G.s.turn) }));
    if (!G.done && E.waiting(G.s)) who = C.t('evSkip', { n: pname(G.s.turn) });
    else if (!G.done && G.phase === 'roll' && mine) who += ' · ' + C.t('roll');
    logLine.textContent = G.log || ' ';
    turnLine.textContent = who;
  }

  function render() {
    if (!G) return;
    drawTop();
    drawPlayers();
    drawBar();
    draw();
  }

  /* -------------------------------------------------------------- input */

  dice.addEventListener('click', function () { if (G && !G.done && !isBot(G.s.turn) && G.phase === 'roll') doRoll(); });

  window.addEventListener('keydown', function (e) {
    if (!G || G.done || document.querySelector('.ch-scrim') || isBot(G.s.turn)) return;
    var k = e.key;
    if (G.phase === 'roll' && (k === ' ' || k === 'Enter' || C.keyIs(e, 'r'))) { e.preventDefault(); doRoll(); }
  });

  // the board follows its slot, which changes with the window and the side column (#359)
  if (window.ResizeObserver) new ResizeObserver(function () { draw(); }).observe(box);
  else window.addEventListener('resize', function () { draw(); });
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', function () { draw(); });
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  // A pause mid-move plays the same throw again from the turn's start (the move is
  // applied only when it ends); dice still in the air are thrown again.
  C.onPause(function () { stop(); });
  C.onResume(function () {
    if (!G || G.done) return;
    anim = null;
    dice.classList.remove('gs-dice--roll');
    if (G.roll) { G.phase = 'busy'; drawDice(G.roll); later(move, 300); }
    else startTurn();
  });

  /* --------------------------------------------------------------- help */

  function kb(k, what) {
    return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]);
  }
  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [kb('Space / Enter', C.t('rollKey'))])
      ],
      actions: [
        { label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } },
        { label: C.t('done'), kind: 'primary' }
      ]
    });
  }

  function art(kind) {
    var s = '<svg viewBox="0 0 220 120" width="100%">';
    if (kind === 1) {
      s += face(4, 'var(--gs-c0)').replace('<svg', '<svg x="50" y="38"') + face(5, 'var(--gs-c0)').replace('<svg', '<svg x="126" y="38"');
    } else if (kind === 2) {
      var ks = [['goose', 20], ['bridge', 70], ['well', 120], ['death', 170]];
      ks.forEach(function (q) { s += '<rect x="' + q[1] + '" y="35" width="40" height="40" rx="8" fill="' + TILE[q[0]] + '"/>'; });
      s += '<path d="M33 60c4-10 10-12 12-6 2-8-2-12-4-14" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>' +
        '<path d="M76 62h28M78 62q12-18 24 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>' +
        '<path d="M128 56v12h24V56M126 50l14-7 14 7" stroke="#fff" stroke-width="3" fill="#fff" stroke-linejoin="round"/>' +
        '<circle cx="190" cy="52" r="10" fill="#fff"/><rect x="184" y="58" width="12" height="8" fill="#fff"/><circle cx="186" cy="52" r="3" fill="#2B2B2B"/><circle cx="194" cy="52" r="3" fill="#2B2B2B"/>';
    } else {
      s += '<rect x="80" y="20" width="60" height="60" rx="10" fill="' + TILE.goal + '"/><text x="110" y="58" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">63</text>' +
        '<circle cx="110" cy="100" r="10" fill="var(--gs-c0)" stroke="#fff" stroke-width="3"/>';
    }
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: art(1) },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: art(2) },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: art(3) }
  ];

  /* -------------------------------------------------------------- start */

  var saved = ctx.loadSave();
  if (validSave(saved)) {
    if (saved.prefs) prefs = cleanPrefs(saved.prefs);
    restore(saved.g);
  } else {
    newGame(fromPrefs());
    ctx.tutorialIfNew(TUT);
  }
})();
</script>
</body>
</html>
