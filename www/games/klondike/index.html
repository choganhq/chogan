<style>
  /* a card face in the dark theme is a step lighter than the surface, as in Hokm,
     so long columns don't read as one dark block */
  :root { --ch-pface: var(--c-surface); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ch-pface: var(--c-surface-3); } }
  :root[data-theme="dark"] { --ch-pface: var(--c-surface-3); }

  .kl-wrap { flex: 1; min-height: 0; align-self: stretch; display: flex; flex-direction: column; align-items: center; gap: var(--s-2); }
  .kl-top { display: flex; gap: var(--s-2); flex-wrap: wrap; justify-content: center; align-items: center; }
  /* a table is a physical thing: stock on the left, homes on the right, in every language */
  .kl-board { direction: ltr; position: relative; flex: 1; min-height: 0; width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
  .kl-slot {
    position: absolute; left: 0; top: 0; width: var(--cw); aspect-ratio: 5 / 7; box-sizing: border-box; border-radius: 8px;
    border: 2px dashed var(--c-line); display: grid; place-items: center; color: var(--c-text-faint); font-size: calc(var(--cw) * .42);
  }
  .kl-slot--stock { cursor: pointer; border-style: solid; }
  .kl-card { position: absolute; left: 0; top: 0; width: var(--cw); aspect-ratio: 5 / 7; transition: transform var(--kl-move, 180ms) var(--ease); }
  .kl-card > .ch-pcard { --pw: var(--cw); position: absolute; inset: 0; cursor: pointer; }
  .kl-card > .ch-pback { position: absolute; inset: 0; width: var(--cw); }
  .kl-card--down > .ch-pcard, .kl-card:not(.kl-card--down) > .ch-pback { display: none; }
  .kl-card--still, .kl-card--drag { transition: none; }
  .kl-card--drag > * { box-shadow: var(--sh-3, var(--sh-2)); }
  /* its own layer while dragged, so a move does not re-rasterise the cards (#532, as Spider) */
  .kl-card--drag { will-change: transform; }
  /* a card turned face up opens like a page (#407) */
  .kl-flip > .ch-pcard { animation: kl-flip 240ms var(--ease); }
  @keyframes kl-flip { from { transform: scaleX(0); } }
  .kl-focus { outline: 3px solid var(--game); outline-offset: 2px; border-radius: 8px; }
  .kl-hint { position: absolute; left: 0; top: 0; width: var(--cw); aspect-ratio: 5 / 7; border-radius: 8px; box-sizing: border-box;
    border: 3px solid var(--game); pointer-events: none; display: none; }
  .kl-cascade { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 5000; }
  .kl-gear .ch-icon { pointer-events: none; }
</style>

<script src="../../version.js"></script>
<script src="../../lib/chogan.js"></script>
<script>
/* ==== ENGINE START ==== */
function KlondikeEngineFactory() {
  'use strict';

  // A card is rank * 4 + suit, as in Chogan.cards: suits ♣ ♦ ♥ ♠, so 1 and 2 are red.
  function rank(c) { return c >> 2; }
  function suit(c) { return c & 3; }
  function isRed(c) { var s = c & 3; return s === 1 || s === 2; }

  function shuffled(rnd) {
    var d = [];
    for (var i = 0; i < 52; i++) d.push(i);
    for (var j = 51; j > 0; j--) { var k = Math.floor(rnd() * (j + 1)), t = d[j]; d[j] = d[k]; d[k] = t; }
    return d;
  }

  // S: tab — seven columns, bottom first; down[i] — how many of column i lie face down
  // (always the first ones); stock and waste — top is the last card; found[s] — how
  // many of suit s are home, so its top card has rank found[s] - 1; hist — the moves,
  // each one exactly reversible, for undo.
  function deal(rnd, draw) {
    var d = shuffled(rnd), S = { tab: [], down: [], stock: [], waste: [], found: [0, 0, 0, 0], draw: draw === 3 ? 3 : 1, hist: [], undos: 0, passes: 0 };
    var k = 0;
    for (var i = 0; i < 7; i++) { S.tab.push(d.slice(k, k + i + 1)); S.down.push(i); k += i + 1; }
    S.stock = d.slice(k);
    return S;
  }

  function clone(S) {
    return { tab: S.tab.map(function (c) { return c.slice(); }), down: S.down.slice(), stock: S.stock.slice(), waste: S.waste.slice(),
      found: S.found.slice(), draw: S.draw, hist: S.hist.slice(), undos: S.undos, passes: S.passes };
  }

  function canTab(S, c, col) {
    var t = S.tab[col];
    if (!t.length) return rank(c) === 12;
    var top = t[t.length - 1];
    return rank(top) === rank(c) + 1 && isRed(top) !== isRed(c);
  }
  function canFound(S, c) { return S.found[suit(c)] === rank(c); }

  // Where cards can be taken from: { k: 'waste' }, { k: 'tab', col, i } (the card at
  // index i and everything on it) or { k: 'found', s }. Null if nothing can be taken.
  function cardsAt(S, src) {
    if (src.k === 'waste') return S.waste.length ? [S.waste[S.waste.length - 1]] : null;
    if (src.k === 'found') return S.found[src.s] ? [(S.found[src.s] - 1) * 4 + src.s] : null;
    if (src.k === 'tab') {
      var t = S.tab[src.col];
      if (!t || src.i < S.down[src.col] || src.i >= t.length) return null;
      return t.slice(src.i);
    }
    return null;
  }

  // dst: { k: 'found' } or { k: 'tab', col }
  function legal(S, src, dst) {
    var cards = cardsAt(S, src);
    if (!cards) return false;
    if (dst.k === 'found') return src.k !== 'found' && cards.length === 1 && canFound(S, cards[0]);
    if (dst.k === 'tab') {
      if (src.k === 'tab' && src.col === dst.col) return false;
      return dst.col >= 0 && dst.col < 7 && canTab(S, cards[0], dst.col);
    }
    return false;
  }

  function take(S, src, n) {
    if (src.k === 'waste') return S.waste.splice(S.waste.length - n, n);
    if (src.k === 'tab') return S.tab[src.col].splice(S.tab[src.col].length - n, n);
    S.found[src.s]--;
    return [S.found[src.s] * 4 + src.s];
  }
  function put(S, dst, cards) {
    if (dst.k === 'tab') { for (var i = 0; i < cards.length; i++) S.tab[dst.col].push(cards[i]); return; }
    if (dst.k === 'waste') { for (var j = 0; j < cards.length; j++) S.waste.push(cards[j]); return; }
    S.found[suit(cards[0])]++;
  }

  // Returns the move it made, or null. A column whose face-up cards are all gone turns
  // its new top card over.
  function move(S, src, dst) {
    if (!legal(S, src, dst)) return null;
    var n = cardsAt(S, src).length;
    var cards = take(S, src, n);
    put(S, dst, cards);
    var flip = false;
    if (src.k === 'tab') {
      var t = S.tab[src.col];
      if (t.length && S.down[src.col] >= t.length) { S.down[src.col] = t.length - 1; flip = true; }
    }
    var from = src.k === 'tab' ? { k: 'tab', col: src.col } : (src.k === 'found' ? { k: 'found', s: src.s } : { k: 'waste' });
    var h = { t: 'mv', from: from, to: dst.k === 'tab' ? { k: 'tab', col: dst.col } : { k: 'found' }, n: n, flip: flip, c: cards[0] };
    S.hist.push(h);
    return h;
  }

  // One tap on the stock: turn over one or three cards, or, when it is empty, turn the
  // waste back into the stock (as often as you like).
  function drawStock(S) {
    if (S.stock.length) {
      var n = Math.min(S.draw, S.stock.length);
      for (var i = 0; i < n; i++) S.waste.push(S.stock.pop());
      S.hist.push({ t: 'draw', n: n });
      return 'draw';
    }
    if (S.waste.length) {
      S.stock = S.waste.reverse();
      S.waste = [];
      S.passes++;
      S.hist.push({ t: 'rec', n: S.stock.length });
      return 'recycle';
    }
    return null;
  }

  function undo(S) {
    var h = S.hist.pop();
    if (!h) return null;
    S.undos++;
    if (h.t === 'draw') { for (var i = 0; i < h.n; i++) S.stock.push(S.waste.pop()); return h; }
    if (h.t === 'rec') { S.waste = S.stock.reverse(); S.stock = []; S.passes--; return h; }
    if (h.flip) S.down[h.from.col] = S.tab[h.from.col].length;
    var cards = h.to.k === 'found' ? [h.c] : S.tab[h.to.col].splice(S.tab[h.to.col].length - h.n, h.n);
    if (h.to.k === 'found') S.found[suit(h.c)]--;
    if (h.from.k === 'found') S.found[h.from.s] += cards.length;
    else put(S, h.from, cards);
    return h;
  }

  function won(S) { return S.found[0] + S.found[1] + S.found[2] + S.found[3] === 52; }

  // Where a tap sends cards: home if it can go, else the first column that takes them,
  // a column with cards before an empty one. A king already at the bottom of a column
  // is not moved to another empty column; that changes nothing.
  function autoTarget(S, src) {
    var cards = cardsAt(S, src);
    if (!cards) return null;
    if (cards.length === 1 && src.k !== 'found' && canFound(S, cards[0])) return { k: 'found' };
    var empty = null;
    for (var col = 0; col < 7; col++) {
      if (src.k === 'tab' && src.col === col) continue;
      if (!canTab(S, cards[0], col)) continue;
      if (S.tab[col].length) return { k: 'tab', col: col };
      if (empty === null && !(src.k === 'tab' && src.i === 0)) empty = { k: 'tab', col: col };
    }
    return empty;
  }

  // Everything is face up and the stock and waste are empty: the rest goes home alone
  function canFinish(S) {
    if (S.stock.length || S.waste.length) return false;
    for (var i = 0; i < 7; i++) if (S.down[i]) return false;
    return !won(S);
  }
  // the lowest card that can go home now, as a source
  function nextHome(S) {
    var best = null, br = 99;
    if (S.waste.length && canFound(S, S.waste[S.waste.length - 1])) { best = { k: 'waste' }; br = rank(S.waste[S.waste.length - 1]); }
    for (var col = 0; col < 7; col++) {
      var t = S.tab[col];
      if (!t.length) continue;
      var c = t[t.length - 1];
      if (canFound(S, c) && rank(c) < br) { best = { k: 'tab', col: col, i: t.length - 1 }; br = rank(c); }
    }
    return best;
  }

  /* The solver for the daily deal: a depth-first search over positions with every
     position seen kept, so a deal is only offered when a winning line is known.
     Moves it tries, best first: home, a whole face-up run onto another column when
     that turns a card over (or frees a column for a king), the waste onto a column,
     then the stock. It gives up after `limit` positions; an unsolved deal is not
     proven lost, it is just not offered. */
  function key(S) {
    var k = S.found.join(',') + '|' + S.stock.join(',') + '|' + S.waste.join(',');
    for (var i = 0; i < 7; i++) k += '|' + S.down[i] + ':' + S.tab[i].join(',');
    return k;
  }
  function solverMoves(S) {
    var out = [], col, t, w = S.waste.length ? S.waste[S.waste.length - 1] : -1;
    if (w >= 0 && canFound(S, w)) out.push([{ k: 'waste' }, { k: 'found' }]);
    for (col = 0; col < 7; col++) {
      t = S.tab[col];
      if (t.length && canFound(S, t[t.length - 1])) out.push([{ k: 'tab', col: col, i: t.length - 1 }, { k: 'found' }]);
    }
    // emptying a column only helps if a king could move into it
    var kingFree = w >= 0 && rank(w) === 12;
    for (col = 0; col < 7 && !kingFree; col++) if (S.down[col] > 0 && S.tab[col].length && rank(S.tab[col][S.down[col]]) === 12) kingFree = true;
    for (col = 0; col < 7; col++) {
      t = S.tab[col];
      if (!t.length) continue;
      var i = S.down[col], c = t[i];
      if (i === 0 && (rank(c) === 12 || !kingFree)) continue;
      for (var d = 0; d < 7; d++) {
        if (d === col || !canTab(S, c, d)) continue;
        if (!S.tab[d].length && i === 0) continue;
        out.push([{ k: 'tab', col: col, i: i }, { k: 'tab', col: d }]);
        if (!S.tab[d].length) break;
      }
    }
    if (w >= 0) for (col = 0; col < 7; col++) if (canTab(S, w, col)) { out.push([{ k: 'waste' }, { k: 'tab', col: col }]); if (!S.tab[col].length) break; }
    if (S.stock.length || S.waste.length) out.push(null);
    return out;
  }
  function solve(S0, limit) {
    var S = clone(S0), seen = {}, nodes = 0, path = [];
    S.hist = [];
    function rec() {
      if (won(S)) return true;
      if (++nodes > limit) return false;
      var k = key(S);
      if (seen[k]) return false;
      seen[k] = 1;
      var ms = solverMoves(S);
      for (var m = 0; m < ms.length; m++) {
        if (ms[m]) { if (!move(S, ms[m][0], ms[m][1])) continue; path.push({ src: ms[m][0], dst: ms[m][1] }); }
        else { drawStock(S); path.push(null); }
        if (rec()) return true;
        path.pop();
        undo(S);
        if (nodes > limit) return false;
      }
      return false;
    }
    var ok = rec();
    return { solved: ok, nodes: nodes, path: ok ? path : null };
  }

  // The daily deal: the first of the day's deals the solver wins, drawing one card.
  var DAILY_TRIES = 40, SOLVE_LIMIT = 20000;
  function dailyDeal(rnd) {
    for (var n = 0; n < DAILY_TRIES; n++) {
      var S = deal(rnd, 1);
      if (solve(S, SOLVE_LIMIT).solved) { S.tries = n + 1; return S; }
    }
    return deal(rnd, 1);
  }

  function validState(v) {
    if (!v || !Array.isArray(v.tab) || v.tab.length !== 7 || !Array.isArray(v.down) || !Array.isArray(v.stock) || !Array.isArray(v.waste) || !Array.isArray(v.found)) return false;
    var seen = {}, n = 0;
    var add = function (c) { if (typeof c !== 'number' || c < 0 || c > 51 || seen[c]) return false; seen[c] = 1; n++; return true; };
    for (var i = 0; i < 7; i++) {
      if (!Array.isArray(v.tab[i]) || v.down[i] < 0 || (v.tab[i].length && v.down[i] >= v.tab[i].length) || (!v.tab[i].length && v.down[i] !== 0)) return false;
      for (var j = 0; j < v.tab[i].length; j++) if (!add(v.tab[i][j])) return false;
    }
    for (var a = 0; a < v.stock.length; a++) if (!add(v.stock[a])) return false;
    for (var b = 0; b < v.waste.length; b++) if (!add(v.waste[b])) return false;
    for (var s = 0; s < 4; s++) {
      if (!(v.found[s] >= 0 && v.found[s] <= 13)) return false;
      for (var r = 0; r < v.found[s]; r++) if (!add(r * 4 + s)) return false;
    }
    return n === 52;
  }

  return {
    rank: rank, suit: suit, isRed: isRed, deal: deal, clone: clone, canTab: canTab, canFound: canFound,
    cardsAt: cardsAt, legal: legal, move: move, drawStock: drawStock, undo: undo, won: won,
    autoTarget: autoTarget, canFinish: canFinish, nextHome: nextHome, solve: solve, dailyDeal: dailyDeal,
    validState: validState, DAILY_TRIES: DAILY_TRIES, SOLVE_LIMIT: SOLVE_LIMIT
  };
}
if (typeof module !== 'undefined' && module.exports) module.exports = KlondikeEngineFactory;
/* ==== ENGINE END ==== */
</script>

    };
    cv.addEventListener('pointerdown', stop);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    (function frame(t) {
      if (over) return;
      if (frames++ % 7 === 0 && queue.length) {
        var f = queue.shift();
        nodes[f.c].style.visibility = 'hidden';
        f.vx = (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 4);
        f.vy = -Math.random() * 6;
        flying.push(f);
      }
      var floor = L.H - L.ch;
      flying = flying.filter(function (f) {
        f.vy += 0.6; f.x += f.vx; f.y += f.vy;
        if (f.y > floor) { f.y = floor; f.vy *= -0.72; }
        paintCard(g, T, f.c, f.x, f.y, L.cw);
        return f.x > -L.cw && f.x < L.W;
      });
      if ((!queue.length && !flying.length) || t - t0 > 5000) { stop(); return; }
      requestAnimationFrame(frame);
    })(t0);
  }
  function paintCard(g, T, c, x, y, w) {
    var h = w * 1.4;
    g.fillStyle = T.face;
    C.rrect(g, x, y, w, h, Math.max(3, w * 0.1));
    g.fill();
    g.lineWidth = 1; g.strokeStyle = T.line; g.stroke();
    g.fillStyle = E.isRed(c) ? T.red : T.text;
    g.textBaseline = 'top'; g.textAlign = 'left';
    g.font = '800 ' + Math.round(w * 0.32) + 'px ' + T.font;
    g.fillText(C.cards.rankText(E.rank(c)), x + w * 0.08, y + w * 0.06);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = Math.round(w * 0.55) + 'px ' + T.font;
    g.fillText(C.cards.GLYPH[E.suit(c)], x + w / 2, y + h * 0.62);
  }

  function finish() {
    var ms = Date.now() - S.startedAt;
    var clean = S.undos === 0, three = S.draw === 3;
    var coins = 12 + (three ? 4 : 0) + (clean ? 2 : 0) + (S.daily ? 8 : 0);
    var points = 48 + (three ? 16 : 0) + (S.daily ? 25 : 0);
    C.achievements.unlock('kl-win');
    if (three) C.achievements.unlock('kl-three');
    if (ms < 5 * 60 * 1000) C.achievements.unlock('kl-fast');
    C.stats.best('klondike', 'timeMs' + S.draw, ms, true);
    C.stats.best('klondike', 'moves' + S.draw, S.hist.length, true);
    if (S.daily) {
      var first = C.stats.daily('klondike', S.daily, { label: C.t('movesN', { n: C.num(S.hist.length) }), win: true });
      if (!first) { coins = Math.round(coins * 0.2); points = Math.round(points * 0.2); }
    }
    ctx.clearSave();
    ctx.finish({
      won: true,
      title: C.t('won'),
      timeMs: ms, coins: coins, points: points,
      lines: [
        { label: C.t('drawMode'), value: C.t(three ? 'draw3' : 'draw1') },
        { label: C.t('moves'), value: C.num(S.hist.length) },
        { label: C.t('time'), value: C.time(ms) }
      ],
      shareText: 'چوگان · سالیتر' + (S.daily ? ('\nروزانه ' + S.daily) : '') + '\n' + C.num(S.hist.length) + ' حرکت در ' + C.time(ms),
      paint: cardPaint(),
      onAgain: S.daily ? null : function () { start(null); }
    });
  }

  // the four kings on their foundations, all that is left on the table at the end
  function cardPaint() {
    return function (g, W, H, col) {
      var cw = Math.min(W / 4.8, H / 1.5), gap = cw * 0.2, x0 = (W - (cw * 4 + gap * 3)) / 2, y0 = (H - cw * 1.4) / 2;
      var font = getComputedStyle(document.body).fontFamily || 'system-ui, sans-serif';
      var red = getComputedStyle(document.documentElement).getPropertyValue('--c-bad').trim() || '#C8574B';
      try { g.direction = 'ltr'; } catch (e) { /* older WebViews */ }
      for (var s = 0; s < 4; s++) paintCard(g, { face: col.surface2, line: col.line || 'rgba(0,0,0,.15)', text: col.text, red: red, font: font }, 48 + s, x0 + s * (cw + gap), y0, cw);
    };
  }

  /* ------------------------------------------------------------ save */

  ctx.autosave(function () {
    if (!S || S.done || !S.hist.length) return { inProgress: false };
    return {
      s: {
        tab: S.tab, down: S.down, stock: S.stock, waste: S.waste, found: S.found, draw: S.draw,
        hist: S.hist, undos: S.undos, passes: S.passes, daily: S.daily,
        elapsed: (pausedAt || Date.now()) - S.startedAt
      }
    };
  });
  function save() { ctx.save(); }

  // the clock only runs while the app is open
  C.onPause(function () { if (!pausedAt) pausedAt = Date.now(); });
  C.onResume(function () {
    if (pausedAt && S) S.startedAt += Date.now() - pausedAt;
    pausedAt = 0;
  });

  function askNew() {
    if (document.querySelector('.ch-scrim')) return;
    var started = S && !S.done && S.hist.length;
    if (S && S.daily) {
      var dd = S.daily;
      if (!started) { start(dd); return; }
      C.ui.confirm({ title: C.t('restartDaily'), body: C.t('resetWarn'), onOk: function () { start(dd); } });
      return;
    }
    if (!started) { start(null); return; }
    C.ui.confirm({ title: C.t('newDeal'), body: C.t('resetWarn'), onOk: function () { start(null); } });
  }

  function showSettings() {
    var seg = C.ui.segmented([{ value: 1, label: C.t('draw1') }, { value: 3, label: C.t('draw3') }], prefs.draw, function (v) {
      prefs.draw = v === 3 ? 3 : 1;
      ctx.store.set('prefs', prefs);
      // a deal that has not been played yet simply starts again with the new rule
      if (S && !S.daily && !S.done && !S.hist.length) start(null);
    });
    C.ui.modal({
      title: C.t('settings'),
      body: [el('div', { class: 'ch-list' }, [
        el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: C.t('drawRule') }), seg]),
        C.cards.speedRow()
      ]), el('p', { class: 'ch-dim', text: C.t('drawNote') })],
      actions: [{ label: C.t('done'), kind: 'primary' }]
    });
  }

  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [
          kb('← →', C.t('kbSpot')),
          kb('Enter', C.t('kbAuto')),
          kb('Space', C.t('kbDraw')),
          kb('U / Ctrl+Z', C.t('undoMove')),
          kb('N', C.t('kbNew'))
        ])
      ],
      actions: [
        { label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } },
        { label: C.t('done'), kind: 'primary' }
      ]
    });
  }
  function kb(k, what) {
    return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]);
  }

  function svgCard(x, y, label, red, down) {
    if (down) return '<rect x="' + x + '" y="' + y + '" width="34" height="48" rx="5" fill="#1F3A93" stroke="#FBF5E6" stroke-width="2"/>';
    return '<rect x="' + x + '" y="' + y + '" width="34" height="48" rx="5" fill="var(--c-surface)" stroke="var(--c-line)"/>' +
      '<text x="' + (x + 4) + '" y="' + (y + 15) + '" font-size="13" font-weight="800" fill="' + (red ? 'var(--c-bad)' : 'var(--c-text)') + '">' + label + '</text>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'),
      art: '<svg viewBox="0 0 200 110" width="100%" direction="ltr">' +
        svgCard(20, 30, 'A♣︎', false) + svgCard(62, 30, 'A♦︎', true) + svgCard(104, 30, '2♥︎', true) + svgCard(146, 30, 'K♠︎', false) + '</svg>' },
    { title: C.t('tutTitle2'), text: C.t('tutText2'),
      art: '<svg viewBox="0 0 200 110" width="100%" direction="ltr">' +
        svgCard(40, 6, '', false, true) + svgCard(40, 16, '', false, true) + svgCard(40, 26, '8♠︎', false) + svgCard(40, 50, '7♥︎', true) +
        '<rect x="120" y="30" width="34" height="48" rx="5" fill="none" stroke="var(--game)" stroke-width="2" stroke-dasharray="4 3"/>' +
        '<text x="137" y="60" font-size="16" font-weight="800" text-anchor="middle" fill="var(--game)">K</text></svg>' },
    { title: C.t('tutTitle3'), text: C.t('tutText3'),
      art: '<svg viewBox="0 0 200 110" width="100%" direction="ltr">' +
        svgCard(30, 40, '5♦︎', true) + svgCard(130, 20, '6♠︎', false) +
        '<path d="M70 62 C 100 62, 110 52, 128 50" stroke="var(--game)" stroke-width="4" fill="none" stroke-linecap="round"/>' +
        '<path d="M120 42 l 9 8 -11 5" stroke="var(--game)" stroke-width="4" fill="none" stroke-linecap="round"/></svg>' }
  ];

  window.addEventListener('resize', function () { render(true); });
  if (window.ResizeObserver) new ResizeObserver(function () { render(true); }).observe(board);
  // the face font arriving can change the board's room; place the cards again then
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { render(true); });

  /* ------------------------------------------------------------ start */

  var saved = ctx.loadSave();
  var sv = saved && E.validState(saved.s) ? saved.s : null;
  if (dailyDate) {
    // the daily page has its own save slot, so the same deal goes on
    if (sv && sv.daily === dailyDate) resume(sv);
    else start(dailyDate);
    if (C.stats.dailyDone('klondike', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).klondike;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
    }
  } else if (sv && !sv.daily) {
    resume(sv);
  } else {
    start(null);
  }
  ctx.tutorialIfNew(TUT);
  requestAnimationFrame(function () { render(true); });
})();
</script>
</body>
</html>
