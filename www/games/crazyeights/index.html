<script>
/* ==== ENGINE START ==== */
function CrazyEightsEngineFactory() {
  'use strict';

  // A card is rank * 4 + suit, as in Chogan.cards: ranks A..K are 0..12, so the eight is rank 7
  var EIGHT = 7, TARGET = 100;
  // The Iranian «هفت خبیث» (#449): the jack is wild, a seven makes the next player draw
  // two (sevens stack), an eight plays again, a ten reverses, an ace skips the next player.
  // A round without `rules` (saved before #449) plays the international rules.
  var ACE = 0, SEVEN = 6, TEN = 9, JACK = 10;
  function rank(c) { return c >> 2; }
  function suit(c) { return c & 3; }
  function iran(R) { return R.rules === 'iran'; }
  function wildRank(R) { return iran(R) ? JACK : EIGHT; }
  function isWild(R, c) { return rank(c) === wildRank(R); }
  // a card with an effect; a starter like that is buried, so nobody is hit before playing
  function special(R, c) { var r = rank(c); return iran(R) ? r === JACK || r === SEVEN || r === EIGHT || r === TEN || r === ACE : r === EIGHT; }
  function perHand(n, rules) { return rules === 'iran' || n === 2 ? 7 : 5; }

  function shuffled(rnd) {
    var d = [];
    for (var i = 0; i < 52; i++) d.push(i);
    for (var j = 51; j > 0; j--) { var k = Math.floor(rnd() * (j + 1)), t = d[j]; d[j] = d[k]; d[k] = t; }
    return d;
  }

  // The common rules: seven cards each for two players, five for three or four; the
  // Iranian rules deal seven to everyone. The starter is turned up from the stock; a
  // special card there goes back into the middle of the stock and the next card is turned.
  function newRound(rnd, n, first, rules) {
    var d = shuffled(rnd), per = perHand(n, rules), R = { n: n, hands: [], stock: [], discard: [], suit: 0, turn: first || 0, drawn: -1, passes: 0, winner: -1, blocked: false };
    if (rules === 'iran') { R.rules = 'iran'; R.dir = 1; R.pending = 0; }
    for (var p = 0; p < n; p++) R.hands.push(d.splice(0, per));
    while (special(R, d[d.length - 1])) d.splice(Math.floor(d.length / 2), 0, d.pop());
    R.discard.push(d.pop());
    R.suit = suit(R.discard[0]);
    R.stock = d;
    return R;
  }

  function top(R) { return R.discard[R.discard.length - 1]; }
  // the wild card goes on anything; otherwise match the suit in play or the top card's
  // rank. With sevens pending, only another seven may be played.
  function canPlay(R, c) {
    if (R.pending) return rank(c) === SEVEN;
    return isWild(R, c) || suit(c) === R.suit || rank(c) === rank(top(R));
  }
  function legal(R, p) {
    var out = [], h = R.hands[p];
    for (var i = 0; i < h.length; i++) if (canPlay(R, h[i])) out.push(h[i]);
    // after drawing, only the drawn card may be played
    if (R.drawn >= 0) out = out.indexOf(R.drawn) >= 0 ? [R.drawn] : [];
    return out;
  }

  function next(R) { R.turn = (R.turn + (R.dir || 1) + R.n) % R.n; R.drawn = -1; }

  // play card c (and, for the wild card, the suit it names). Returns false if not allowed.
  function play(R, c, chosen) {
    if (R.winner >= 0) return false;
    var h = R.hands[R.turn], i = h.indexOf(c);
    if (i < 0 || legal(R, R.turn).indexOf(c) < 0) return false;
    h.splice(i, 1);
    R.discard.push(c);
    R.suit = isWild(R, c) ? (chosen >= 0 && chosen < 4 ? chosen : suit(c)) : suit(c);
    R.passes = 0;
    if (!h.length) { R.winner = R.turn; return true; }
    if (iran(R)) {
      var r = rank(c);
      // an eight: the same player goes again, under the usual matching
      if (r === EIGHT) { R.drawn = -1; return true; }
      if (r === SEVEN) R.pending += 2;
      // with two players a reverse changes nothing
      if (r === TEN) R.dir = -(R.dir || 1);
      next(R);
      if (r === ACE) next(R);
      return true;
    }
    next(R);
    return true;
  }

  // With sevens pending and no seven to add, the player takes them all and the turn
  // ends. Returns the cards taken (fewer when even the discards run out).
  function takePenalty(R, rnd) {
    if (R.winner >= 0 || !R.pending || legal(R, R.turn).length) return [];
    var got = [];
    for (var k = 0; k < R.pending; k++) { var c = drawOne(R, rnd); if (c < 0) break; R.hands[R.turn].push(c); got.push(c); }
    R.pending = 0;
    R.passes = 0;
    next(R);
    return got;
  }
  function drawOne(R, rnd) {
    if (!R.stock.length && R.discard.length > 1) {
      var keep = R.discard.pop();
      R.stock = R.discard;
      for (var j = R.stock.length - 1; j > 0; j--) { var k = Math.floor((rnd || Math.random)() * (j + 1)), t = R.stock[j]; R.stock[j] = R.stock[k]; R.stock[k] = t; }
      R.discard = [keep];
    }
    return R.stock.length ? R.stock.pop() : -1;
  }

  // One draw a turn. An empty stock is made again from the discards under the top card.
  // Returns the card drawn, or -1 when there is nothing to draw.
  function draw(R, rnd) {
    if (R.winner >= 0 || R.drawn >= 0 || R.pending || legal(R, R.turn).length) return -1;
    var c = drawOne(R, rnd);
    if (c < 0) return -1;
    R.hands[R.turn].push(c);
    R.drawn = c;
    return c;
  }

  // Passing is allowed after a draw that can't be played, or with nothing to draw and
  // nothing to play. When everyone passes in a row the round is blocked, and the
  // lowest hand wins it.
  function canPass(R) {
    if (R.winner >= 0 || R.pending) return false;
    if (R.drawn >= 0) return true;
    return !legal(R, R.turn).length && !R.stock.length && R.discard.length <= 1;
  }
  function pass(R) {
    if (!canPass(R)) return false;
    // only a pass with nothing left to draw counts toward a blocked round; a pass after
    // a draw means cards still moved (a first version counted both, and 45 % of rounds blocked)
    if (R.drawn >= 0) R.passes = 0; else R.passes++;
    if (R.passes >= R.n) {
      R.blocked = true;
      var best = 0;
      for (var p = 1; p < R.n; p++) if (handPoints(R.hands[p], R.rules) < handPoints(R.hands[best], R.rules)) best = p;
      R.winner = best;
      return true;
    }
    next(R);
    return true;
  }

  // Points left in a hand: an eight 50, a court card 10, an ace 1, others their number.
  // Iranian rules: the jack 50, the other special cards (7, 8, 10, ace) 20.
  function cardPoints(c, rules) {
    var r = rank(c);
    if (rules === 'iran') return r === JACK ? 50 : r === SEVEN || r === EIGHT || r === TEN || r === ACE ? 20 : r >= 10 ? 10 : r + 1;
    return r === EIGHT ? 50 : r >= 10 ? 10 : r + 1;
  }
  function handPoints(h, rules) { var s = 0; for (var i = 0; i < h.length; i++) s += cardPoints(h[i], rules); return s; }
  // The round's winner scores everyone else's cards
  function roundPoints(R) {
    var s = 0;
    for (var p = 0; p < R.n; p++) if (p !== R.winner) s += handPoints(R.hands[p], R.rules);
    return s;
  }

  // The suit to name with the wild card: the one held most, counted without wild cards
  function bestSuit(h, wr) {
    var n = [0, 0, 0, 0], w = wr === undefined ? EIGHT : wr;
    for (var i = 0; i < h.length; i++) if (rank(h[i]) !== w) n[suit(h[i])]++;
    var b = 0;
    for (var s = 1; s < 4; s++) if (n[s] > n[b]) b = s;
    return b;
  }

  // Bots. Easy plays any legal card at random, eights included, and names a random
  // suit. Medium keeps its eights for when nothing else goes, and of the rest plays the
  // card worth most, preferring a suit it holds more of. Hard does the same, and when
  // the next player is down to one or two cards it changes the suit away from the one
  // that player last could not follow.
  // Iranian rules: every level adds a seven to a pending stack when it can. Medium and
  // hard hold their jacks like eights, keep a seven back to turn a stack away, play an
  // eight early, and throw a seven or an ace at a next player down to one or two cards.
  function botMove(R, level, rnd) {
    rnd = rnd || Math.random;
    var p = R.turn, h = R.hands[p], L = legal(R, p), wr = wildRank(R);
    if (R.pending) return L.length ? { play: L[0], suit: -1 } : { take: true };
    if (!L.length) return R.drawn >= 0 || canPass(R) ? { pass: true } : { draw: true };
    if (level === 'easy') {
      var c0 = L[Math.floor(rnd() * L.length)];
      return { play: c0, suit: rank(c0) === wr ? Math.floor(rnd() * 4) : -1 };
    }
    var plain = L.filter(function (c) { return rank(c) !== wr; });
    var cnt = [0, 0, 0, 0];
    h.forEach(function (c) { if (rank(c) !== wr) cnt[suit(c)]++; });
    var nx = (p + (R.dir || 1) + R.n) % R.n, danger = level === 'hard' && R.hands[nx].length <= 2;
    if (plain.length) {
      var score = function (c) {
        var v = cardPoints(c, R.rules) + cnt[suit(c)] * 3;
        if (danger && R.short && R.short[nx] === suit(c)) v += 40;
        if (iran(R)) {
          var r = rank(c), low = R.hands[nx].length <= 2;
          // a seven held back turns a stack of sevens away; thrown when the next is nearly out
          if (r === SEVEN) v += low ? 60 : -25;
          if (r === ACE && low) v += 60;
          // an eight with another card to follow empties the hand by two
          if (r === EIGHT && h.length > 2) v += 15;
        }
        return v;
      };
      plain.sort(function (a, b) { return score(b) - score(a) || a - b; });
      return { play: plain[0], suit: -1 };
    }
    var e = L[0], s = bestSuit(h.filter(function (c) { return c !== e; }), wr);
    if (danger && R.short && R.short[nx] >= 0) {
      // name the next player's missing suit if we hold any of it, else our own best
      var miss = R.short[nx];
      if (cnt[miss] > 0) s = miss;
    }
    return { play: e, suit: s };
  }

  // What a draw tells the table: the player could not follow the suit in play
  function noteShort(R, p, s) { if (!R.short) R.short = []; R.short[p] = s; }

  function validRound(v) {
    if (!v || !(v.n >= 2 && v.n <= 4) || !Array.isArray(v.hands) || v.hands.length !== v.n || !Array.isArray(v.stock) || !Array.isArray(v.discard) || !v.discard.length) return false;
    var seen = {}, n = 0, ok = true;
    var add = function (c) { if (typeof c !== 'number' || c < 0 || c > 51 || seen[c]) ok = false; seen[c] = 1; n++; };
    v.hands.forEach(function (h) { if (!Array.isArray(h)) ok = false; else h.forEach(add); });
    v.stock.forEach(add); v.discard.forEach(add);
    if (v.rules !== undefined && !(v.rules === 'iran' && (v.dir === 1 || v.dir === -1) && v.pending >= 0 && v.pending % 2 === 0)) ok = false;
    return ok && n === 52 && v.turn >= 0 && v.turn < v.n && v.suit >= 0 && v.suit < 4;
  }

  return {
    EIGHT: EIGHT, SEVEN: SEVEN, TEN: TEN, JACK: JACK, ACE: ACE, TARGET: TARGET, rank: rank, suit: suit, isWild: isWild, perHand: perHand,
    newRound: newRound, top: top, canPlay: canPlay, legal: legal, takePenalty: takePenalty,
    play: play, draw: draw, canPass: canPass, pass: pass, cardPoints: cardPoints, handPoints: handPoints,
    roundPoints: roundPoints, bestSuit: bestSuit, botMove: botMove, noteShort: noteShort, validRound: validRound
  };
}
if (typeof module !== 'undefined' && module.exports) module.exports = CrazyEightsEngineFactory;
/* ==== ENGINE END ==== */
</script>

  function newMatch(daily) {
    stopBot();
    var n = daily ? 3 : prefs.rivals + 1;
    // the daily round always plays the Iranian rules, so it is the same game for everyone
    M = { n: n, level: daily ? 'medium' : prefs.level, rules: daily ? 'iran' : prefs.rules, scores: [], round: 0, daily: daily || null, startedAt: Date.now(), roundsWon: 0, eightOut: false };

    stopBot();

    botRnd = M.daily ? C.daily('crazyeights', M.daily + '|bots|' + M.R.stock.length).rng : Math.random;

    suitBox.innerHTML = '';
    suitBox.appendChild(el('b', { text: suitName(R.suit) }));
    suitBox.appendChild(el('span', { text: C.t('suitNow') }));
    if (R.pending) suitBox.appendChild(el('span', { class: 'ch-badge ch-badge--accent', text: C.t('pendingN', { k: C.num(R.pending) }) }));
    renderHand();
    actions.innerHTML = '';
    if (human() && E.canPass(R)) {
      var pb = el('button', { class: 'ch-btn ch-btn--soft', type: 'button', text: C.t('passTurn') });
      pb.addEventListener('click', humanPass);
      actions.appendChild(pb);
    }
    var st = msg;
    if (!st && R.winner < 0) {
      if (R.turn !== 0) st = C.t('thinking', { n: pname(R.turn) });
      else if (R.pending) st = C.t('takeN', { k: C.num(R.pending) });
      else if (R.drawn >= 0) st = C.t('playDrawn');
      else st = E.legal(R, 0).length ? C.t('yourTurn') : C.t('mustDraw');
    }
    status.textContent = st;
  }

  function renderHand() {
    var R = M.R, h = R.hands[0].slice().sort(function (a, b) { return E.suit(a) - E.suit(b) || E.rank(a) - E.rank(b); });
    var ok = human() ? E.legal(R, 0) : [];
    hand.innerHTML = '';
    // overlap the cards so the whole hand stays on one row
    var cw = parseFloat(getComputedStyle(wrap).getPropertyValue('--cw')) || 56;
    var room = hand.clientWidth || 360, over = h.length > 1 ? Math.min(-4, (room - cw * h.length) / (h.length - 1)) : 0;
    over = Math.max(over, -cw * 0.72);
    h.forEach(function (c, i) {
      var b = C.cards.el(c, ok.indexOf(c) >= 0 ? 'ce-ok' : (human() ? 'ce-no' : ''));
      b._c = c;
      if (i) b.style.marginInlineStart = over + 'px';
      if (kf === i) b.style.outline = '3px solid var(--game)';
      b.addEventListener('click', function () { humanPlay(c, b); });
      hand.appendChild(b);
    });
  }
  function handNode(c) { var k = hand.children; for (var i = 0; i < k.length; i++) if (k[i]._c === c) return k[i]; return null; }
  function botBox(p) { return bots.querySelector('[data-p="' + p + '"]'); }

  // a new round: the hand flies in from the stock one card at a time, turning over (#398)
  function dealIn() {
    if (C.ui.reduceMotion()) return;
    var from = stockBtn.getBoundingClientRect();
    for (var i = 0; i < hand.children.length; i++) C.ui.fly(hand.children[i], from, { ms: 220, delay: i * DEAL_MS, flip: true });
  }
  // the card just played arrives on the pile from the hand that played it
  function flyToPile(fromRect, flip) {
    if (!fromRect || !pile.firstChild) return;
    C.ui.fly(pile.firstChild, fromRect, { ms: 240, flip: !!flip });
  }

  /* ------------------------------------------------------------ moves */

  function humanPlay(c, node) {
    if (!human() || document.querySelector('.ch-scrim')) return;
    if (E.legal(M.R, 0).indexOf(c) < 0) { C.feedback('bad'); C.ui.shake(node); return; }
    var from = node.getBoundingClientRect();
    if (E.isWild(M.R, c)) { askSuit(function (s) { commitHuman(c, s, from); }); return; }
    commitHuman(c, -1, from);
  }
  function commitHuman(c, s, from) {
    if (!E.play(M.R, c, s)) { C.feedback('bad'); return; }
    if (E.isWild(M.R, c)) suitFresh = true;
    C.audio.sfx('place'); C.haptic('tap');
    msg = effectMsg(c, 0); kf = -1;
    if (!M.R.hands[0].length && E.rank(c) === E.EIGHT) M.eightOut = true;
    after(from, false);
  }
  function humanDraw() {
    if (!human() || document.querySelector('.ch-scrim')) return;
    var R = M.R;
    if (E.legal(R, 0).length) { C.feedback('bad'); msg = C.t('canPlayFirst'); render(); msg = ''; return; }
    if (R.pending) {
      var got = E.takePenalty(R, botRnd);
      C.audio.sfx('flip');
      msg = C.t('youTook', { k: C.num(got.length) });
      var fromP = stockBtn.getBoundingClientRect();
      after(null, false);
      got.forEach(function (g, i) { var gn = handNode(g); if (gn) C.ui.fly(gn, fromP, { ms: 220, delay: i * 90, flip: true }); });
      return;
    }
    var s = R.suit, c = E.draw(R, botRnd);
    if (c < 0) { C.feedback('bad'); render(); return; }
    E.noteShort(R, 0, s);
    C.audio.sfx('flip');
    var from = stockBtn.getBoundingClientRect();
    render();
    var n = handNode(c);
    if (n) C.ui.fly(n, from, { ms: 220, flip: true });
    save();
    // a drawn card that does not fit passes the turn at once
    if (!E.legal(R, 0).length) setTimeout(function () { if (human() && R.drawn === c) { E.pass(R); after(null, false); } }, C.cards.pace(450));
  }
  function humanPass() {
    if (!human() || !E.pass(M.R)) return;
    C.feedback('tap');
    after(null, false);
  }

  // what a special card just did, in the status line (Iranian rules, #449)
  function effectMsg(c, p) {
    var R = M.R;
    if (R.rules !== 'iran' || R.winner >= 0) return '';
    var r = E.rank(c);
    if (r === E.EIGHT) return p === 0 ? C.t('eightAgain') : '';
    if (r === E.ACE) { var sk = (p + (R.dir || 1) + R.n) % R.n; return C.t('skippedN', { n: pname(sk) }); }
    if (r === E.TEN && R.n > 2) return C.t('reversed');
    return '';
  }

  function after(from, flip) {
    render();
    flyToPile(from, flip);
    save();
    if (M.R.winner >= 0) { endRound(); return; }
    maybeBot();
  }

  function maybeBot() {
    stopBot();
    var R = M.R;
    if (R.winner >= 0 || R.turn === 0) return;
    botTimer = setTimeout(function () {
      botTimer = null;
      if (!M || M.R !== R || R.winner >= 0 || R.turn === 0) return;
      var p = R.turn, m = E.botMove(R, M.level, botRnd);
      if (m.take) {
        var got = E.takePenalty(R, botRnd);
        msg = C.t('tookN', { n: pname(p), k: C.num(got.length) });
        C.audio.sfx('flip');
        after(null, false);
        return;
      }
      if (m.play !== undefined) {
        var from = botBox(p) ? botBox(p).getBoundingClientRect() : null;
        E.play(R, m.play, m.suit);
        if (E.isWild(R, m.play)) { suitFresh = true; msg = C.t('changedN', { n: pname(p), s: suitName(R.suit) }); }
        else msg = effectMsg(m.play, p);
        C.audio.sfx('place');
        after(from, true);
        return;
      }
      if (m.draw) {
        var s = R.suit;
        if (E.draw(R, botRnd) >= 0) { E.noteShort(R, p, s); msg = C.t('drewN', { n: pname(p) }); C.audio.sfx('flip'); render(); save(); maybeBot(); return; }
      }
      E.pass(R);
      msg = C.t('passedN', { n: pname(p) });
      after(null, false);
    }, C.cards.pace(C.ui.reduceMotion() ? 300 : BOT_MS));
  }
  function stopBot() { if (botTimer) { clearTimeout(botTimer); botTimer = null; } }

  /* ------------------------------------------------------------ rounds */

  function endRound() {
    stopBot();
    var R = M.R, w = R.winner, pts = E.roundPoints(R);
    M.scores[w] += pts;
    if (w === 0) M.roundsWon++;
    msg = w === 0 ? C.t('youWonRound') : C.t('roundWon', { n: pname(w) });
    render();
    if (w === 0 && pile.firstChild) C.ui.burst(pile.firstChild, { count: 22, speed: 240, ring: 30, colors: ['#F2B84B', '#A06420', '#FFF1C9'] });
    var over = M.daily || M.scores[w] >= E.TARGET;
    save();
    if (over) { setTimeout(finish, C.cards.pace(900)); return; }
    var lines = [];
    for (var p = 0; p < M.n; p++) lines.push(el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: pname(p) }), el('b', { class: 'ch-num', text: C.num(M.scores[p]) })]));
    setTimeout(function () {
      C.ui.modal({
        title: msg,
        body: [el('p', { class: 'ch-dim', text: (R.blocked ? C.t('blocked') + ' · ' : '') + C.t('plusPts', { n: C.num(pts) }) }), el('div', { class: 'ch-list' }, lines)],
        actions: [{ label: C.t('nextRound'), kind: 'primary', onClick: function () { newRound(); } }],
        onClose: function () { if (M && M.R === R) newRound(); }
      });
    }, C.cards.pace(700));
  }

  function finish() {
    var R = M.R, ms = Date.now() - M.startedAt, won;
    var best = 0;
    for (var p = 1; p < M.n; p++) if (M.scores[p] > M.scores[best]) best = p;
    won = M.daily ? R.winner === 0 : best === 0;
    var base = { easy: 6, medium: 12, hard: 20 }[M.level] || 12;
    var coins = won ? base + (M.daily ? 8 : 0) : Math.max(2, Math.round(base * 0.3));
    var points = won ? base * 4 + (M.daily ? 25 : 0) : Math.round(base * 1.2);
    if (won) {
      C.achievements.unlock('ce-win');
      if (M.level === 'hard' && !M.daily) C.achievements.unlock('ce-hard');
    }
    if (R.winner === 0 && M.eightOut) C.achievements.unlock('ce-eight');
    if (M.daily) {
      var first = C.stats.daily('crazyeights', M.daily, { label: won ? C.t('youWonRound') : C.t('roundWon', { n: pname(R.winner) }), win: won });
      if (!first) { coins = Math.round(coins * 0.2); points = Math.round(points * 0.2); }
    }
    ctx.clearSave();
    var lines = [];
    for (var q = 0; q < M.n; q++) lines.push({ label: pname(q), value: C.num(M.scores[q]) });
    if (!M.daily) lines.push({ label: C.t('rounds'), value: C.num(M.round) });
    var scores = M.scores.slice();
    ctx.finish({
      won: won,
      title: won ? C.t('matchWon') : C.t('matchLost', { n: pname(M.daily ? R.winner : best) }),
      timeMs: ms, coins: coins, points: points,
      lines: lines,
      shareText: 'چوگان · هفت خبیث' + (M.daily ? ('\nروزانه ' + M.daily) : '') + '\n' + scores.map(function (s) { return C.num(s); }).join(' - '),
      onAgain: M.daily ? null : function () { newMatch(null); }
    });
  }

  /* ----------------------------------------------------------- dialogs */

  function askSuit(done) {
    var m = null;
    var row = el('div', { class: 'ce-suits' });
    [0, 1, 2, 3].forEach(function (s) {
      var b = el('button', { type: 'button', class: s === 1 || s === 2 ? 'ce-red' : '', text: suitName(s), 'aria-label': suitName(s) });
      b.addEventListener('click', function () { if (m) m.close(); done(s); });
      row.appendChild(b);
    });
    m = C.ui.modal({ title: C.t('nameSuit'), body: [row], actions: [{ label: C.t('cancel') }] });
  }

  function showSettings() {
    var seg1 = C.ui.segmented([1, 2, 3].map(function (n) { return { value: n, label: C.num(n) }; }), prefs.rivals, function (v) { prefs.rivals = v; ctx.store.set('prefs', prefs); });
    var seg2 = C.ui.segmented(LEVELS.map(function (l) { return { value: l, label: C.t(l) }; }), prefs.level, function (v) { prefs.level = v; ctx.store.set('prefs', prefs); });
    var seg3 = C.ui.segmented([{ value: 'iran', label: C.t('rulesIran') }, { value: 'intl', label: C.t('rulesIntl') }], prefs.rules, function (v) { prefs.rules = v; ctx.store.set('prefs', prefs); });
    C.ui.modal({
      title: C.t('settings'),
      body: [el('div', { class: 'ch-list' }, [
        el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: C.t('rulesSet') }), seg3]),
        el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: C.t('rivals') }), seg1]),
        el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: C.t('level') }), seg2]),
        C.cards.speedRow()
      ]), el('p', { class: 'ch-dim', text: C.t('optNote') })],
      actions: [{ label: C.t('done'), kind: 'primary' }]
    });
  }

  function askNew() {
    if (document.querySelector('.ch-scrim')) return;
    var dd = M ? M.daily : null;
    var started = M && (M.round > 1 || M.R.stock.length !== 52 - M.n * E.perHand(M.n, M.R.rules) - 1 || M.R.discard.length > 1);
    if (!started) { newMatch(dd); return; }
    C.ui.confirm({ title: C.t('newMatch'), body: C.t('resetWarn'), onOk: function () { newMatch(dd); } });
  }

  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t(iranNow() ? 'rulesIranText' : 'rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [kb('← →', C.t('kbCards')), kb('Enter', C.t('kbPlay')), kb('D', C.t('kbDraw')), kb('P', C.t('kbPass'))])
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(tut()); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }

  window.addEventListener('keydown', function (e) {
    if (!human() || document.querySelector('.ch-scrim')) return;
    var tg = e.target, tag = tg && tg.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter'))) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var n = M.R.hands[0].length;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      kf = kf < 0 ? 0 : (kf + (e.key === 'ArrowRight' ? 1 : n - 1)) % n;
      renderHand(); e.preventDefault(); return;
    }
    if (e.key === 'Enter' && kf >= 0 && hand.children[kf]) { var b = hand.children[kf]; humanPlay(b._c, b); e.preventDefault(); return; }
    if (C.keyIs(e, 'd')) { humanDraw(); e.preventDefault(); return; }
    if (C.keyIs(e, 'p')) { humanPass(); e.preventDefault(); }
  });

  function svgCard(x, y, label, red) {
    return '<rect x="' + x + '" y="' + y + '" width="34" height="48" rx="5" fill="var(--c-surface)" stroke="var(--c-line)"/>' +
      '<text x="' + (x + 4) + '" y="' + (y + 15) + '" font-size="13" font-weight="800" fill="' + (red ? 'var(--c-bad)' : 'var(--c-text)') + '">' + label + '</text>';
  }
  function iranNow() { return M ? M.R.rules === 'iran' : prefs.rules === 'iran'; }
  // the second step shows the special cards of the rules in play
  function tut() {
    var t = TUT.slice();
    if (iranNow()) t[1] = { title: C.t('tutTitle2i'), text: C.t('tutText2i'), art: '<svg viewBox="0 0 200 110" width="100%" direction="ltr">' + svgCard(20, 30, 'J♣︎', false) + svgCard(60, 30, '7♦︎', true) + svgCard(100, 30, '8♠︎', false) + svgCard(140, 30, 'A♥︎', true) + '</svg>' };
    return t;
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: '<svg viewBox="0 0 200 110" width="100%" direction="ltr">' + svgCard(50, 30, '9♥︎', true) + svgCard(116, 30, '9♠︎', false) + '</svg>' },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: '<svg viewBox="0 0 200 110" width="100%" direction="ltr">' + svgCard(40, 30, 'K♣︎', false) + svgCard(84, 22, '8♦︎', true) +
      '<text x="150" y="66" font-size="30" text-anchor="middle" fill="var(--game)">♠︎</text></svg>' },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: '<svg viewBox="0 0 200 110" width="100%" direction="ltr"><rect x="40" y="30" width="34" height="48" rx="5" fill="#1F3A93" stroke="#FBF5E6" stroke-width="2"/>' +
      '<path d="M84 54 H 120" stroke="var(--game)" stroke-width="4" stroke-linecap="round"/><path d="M112 46 l 9 8 -9 8" stroke="var(--game)" stroke-width="4" fill="none" stroke-linecap="round"/>' + svgCard(130, 30, '5♣︎', false) + '</svg>' }
  ];

  /* ------------------------------------------------------------ save */

  ctx.autosave(function () {
    if (!M || !M.R || M.R.winner >= 0 && (M.daily || M.scores[M.R.winner] >= E.TARGET)) return { inProgress: false };
    var v = JSON.parse(JSON.stringify(M));
    v.elapsed = (pausedAt || Date.now()) - M.startedAt;
    return { m: v };
  });
  function save() { ctx.save(); }
  C.onPause(function () { stopBot(); if (!pausedAt) pausedAt = Date.now(); });
  C.onResume(function () { if (pausedAt && M) M.startedAt += Date.now() - pausedAt; pausedAt = 0; if (M) maybeBot(); });
  window.addEventListener('resize', function () { if (M) renderHand(); });

  /* ------------------------------------------------------------ start */

  var saved = ctx.loadSave();
  var sv = saved && saved.m && saved.m.R && E.validRound(saved.m.R) ? saved.m : null;
  if (dailyDate) {
    if (sv && sv.daily === dailyDate) resume(sv);
    else newMatch(dailyDate);
    if (C.stats.dailyDone('crazyeights', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).crazyeights;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
    }
  } else if (sv && !sv.daily) resume(sv);
  else newMatch(null);
  ctx.tutorialIfNew(tut());
})();
</script>
</body>
</html>
