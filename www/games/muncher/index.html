<script>
/* ==== ENGINE START ==== */
function MuncherEngineFactory() {
  'use strict';

  // A maze is 19 tiles wide and 21 high. Each one is written as its left half plus the
  // middle column; the right half is the mirror. '#' hedge, '.' seed, 'o' berry, ' ' path
  // without a seed, 'P' the muncher's start, 'H' the beetles' den, '-' the den's gate.
  // A row open at both edges is a tunnel to the other side.
  var W = 19, H = 21, DT = 1 / 60, LIVES = 3, STAGES = 5;
  // ticks: the pause before each life, the muncher's fall, the pause after a cleared maze
  var READY = 108, DYING = 84, CLEAR = 96;
  var DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  var NAMES = ['up', 'right', 'down', 'left'];
  var HALVES = [
    ['##########', '#o...#....', '#.##.#.##.', '#.........', '#.##.#.###', '#....#...#', '####.###.#',
      '####.#    ', '####.# ##-', '    .  #HH', '####.# ###', '####.#    ', '####.# ###',
      '#........#', '#.##.###.#', '#o.#.....P', '##.#.#.###', '#....#...#', '#.######.#', '#.........', '##########'],
    ['##########', '#....##...', '#o##.##.#.', '#.........', '#.#.###.##', '#.#.#...##', '#...#.####',
      '###.#     ', '###.## ##-', '   .   #HH', '###.## ###', '###.##    ', '###.## ###',
      '#.........', '#.##.#.#.#', '#o...#.#.P', '##.###.#.#', '#.........', '#.###.##.#', '#.........', '##########'],
    ['##########', '#o.......#', '#.#.##.#.#', '#.#.......', '#...###.#.', '###.#.....', '#...#.####',
      '#.#.#     ', '#.#.## ##-', '#...   #HH', '#.#.## ###', '#.#.##    ', '#.#.## ###',
      '#.#.......', '#...#.##.#', '##.##.#..P', '#o....#.##', '#.##.##...', '#.##.##.#.', '#.........', '##########'],
    ['##########', '#o..#.....', '#.#.#.###.', '#.#...#...', '#.###.#.##', '#.....#.##', '####.##.##',
      '####.#    ', '####.# ##-', '    .  #HH', '####.# ###', '####.#    ', '##...# ###',
      '#o.#.....#', '#.##.#.#.#', '#....#.#.P', '##.#.#.###', '#..#...#..', '#.##.#.#.#', '#.........', '##########'],
    ['##########', '#....#...#', '#o##.#.#.#', '#.........', '##.##.#.##', '   .....##', '####.#.###',
      '####.#    ', '####.# ##-', '####.  #HH', '####.# ###', '####.#    ', '####.# ###',
      '   .......', '##.#.#.###', '##o#...#.P', '##.#.#.#.#', '#.........', '#.##.###.#', '#.........', '##########']
  ];
  // per level: speeds in tiles a second, how long a berry lasts (s), when each beetle leaves the den (s)
  var LEVELS = {
    // red waits a moment on the easier levels, so a first-time player has time to start
    easy: { me: 7.2, bug: 5.0, fr: 3.4, eyes: 11, frS: 8, out: [1.5, 5, 9, 13] },
    medium: { me: 7.4, bug: 6.0, fr: 3.8, eyes: 11, frS: 6, out: [0.5, 2.5, 5.5, 8.5] },
    hard: { me: 7.6, bug: 6.9, fr: 4.2, eyes: 12, frS: 4.2, out: [0, 1.2, 3, 5] }
  };
  // red follows the muncher, violet heads for where it is going, blue makes the rounds
  // of the four corners, green turns at random
  var KINDS = ['direct', 'ambush', 'patrol', 'random'];
  var CORNERS = [{ x: 1, y: 1 }, { x: 17, y: 1 }, { x: 17, y: 19 }, { x: 1, y: 19 }];

  function wrapX(x) { return ((x % W) + W) % W; }
  function build(i) {
    var rows = HALVES[i].map(function (r) { return r + r.slice(0, 9).split('').reverse().join(''); });
    var M = { i: i, rows: rows, start: null, den: [], door: null, exit: null, seeds: 0 };
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      var c = rows[y][x];
      if (c === 'P') M.start = { x: x, y: y };
      else if (c === 'H') M.den.push({ x: x, y: y });
      else if (c === '-') M.door = { x: x, y: y };
      else if (c === '.' || c === 'o') M.seeds++;
    }
    M.exit = { x: M.door.x, y: M.door.y - 1 };
    // the way home for a caught beetle: steps to the den's gate from every tile
    M.home = [];
    for (var k = 0; k < W * H; k++) M.home.push(-1);
    var q = [M.exit], at = 0;
    M.home[M.exit.y * W + M.exit.x] = 0;
    while (at < q.length) {
      var p = q[at++];
      for (var d = 0; d < 4; d++) {
        if (!walk(M, p.x, p.y, d)) continue;
        var n = ahead(p.x, p.y, d), id = n.y * W + n.x;
        if (M.home[id] < 0) { M.home[id] = M.home[p.y * W + p.x] + 1; q.push(n); }
      }
    }
    return M;
  }
  function cell(M, x, y) { return y < 0 || y >= H ? '#' : M.rows[y][wrapX(x)]; }
  function walkable(c) { return c !== '#' && c !== '-' && c !== 'H'; }
  function ahead(x, y, d) { return { x: wrapX(x + DIRS[d][0]), y: y + DIRS[d][1] }; }
  function walk(M, x, y, d) { var n = ahead(x, y, d); return walkable(cell(M, n.x, n.y)); }
  var MAZES = HALVES.map(function (h, i) { return build(i); });

  function rnd(S) {
    S.rs = (S.rs + 0x6D2B79F5) >>> 0;
    var t = Math.imul(S.rs ^ (S.rs >>> 15), 1 | S.rs);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  function newGame(seed, level) {
    var S = { seed: seed >>> 0, rs: seed >>> 0, level: LEVELS[level] ? level : 'medium', lives: LIVES, score: 0, stage: 0, cleared: 0,
      deaths: 0, bugs: 0, over: false, won: false, ev: [], tick: 0 };
    // the order of the five mazes comes from the seed, so the daily order is the same for everyone
    var o = [0, 1, 2, 3, 4];
    for (var i = o.length - 1; i > 0; i--) { var j = Math.floor(rnd(S) * (i + 1)), t = o[i]; o[i] = o[j]; o[j] = t; }
    S.order = o;
    startStage(S, 0);
    return S;
  }
  function startStage(S, k) {
    var M = MAZES[S.order[k]];
    S.stage = k; S.M = M; S.food = []; S.left = 0; S.stageDeaths = 0;
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      var c = M.rows[y][x], f = c === '.' ? 1 : c === 'o' ? 2 : 0;
      S.food.push(f); if (f) S.left++;
    }
    resetActors(S);
  }
  function resetActors(S) {
    var M = S.M, L = LEVELS[S.level];
    S.p = { x: M.start.x, y: M.start.y, d: -1, t: 0, face: 3 };
    S.want = -1; S.fright = 0; S.chain = 0; S.ready = READY; S.dying = 0; S.clear = 0;
    S.ch = KINDS.map(function (kind, i) {
      var at = i === 0 ? M.exit : M.den[[1, 0, 2][i - 1]];
      var wait = Math.round(L.out[i] / DT);
      return { kind: kind, i: i, x: at.x, y: at.y, d: 3, t: 0, st: i === 0 && !wait ? 'out' : 'home', fr: false, wait: wait, k: 2 };
    });
  }

  function setWant(S, d) {
    if (typeof d === 'string') d = NAMES.indexOf(d);
    if (d < 0 || d > 3) return false;
    S.want = d;
    return true;
  }

  function turnAt(S, p) {
    if (S.want >= 0 && walk(S.M, p.x, p.y, S.want)) { p.d = S.want; p.face = p.d; } else if (p.d >= 0 && !walk(S.M, p.x, p.y, p.d)) p.d = -1;
  }
  function movePlayer(S, sp) {
    var p = S.p;
    // turning back needs no corner: the muncher reverses on the spot
    if (p.d >= 0 && p.t > 0 && S.want === (p.d + 2) % 4) {
      var n = ahead(p.x, p.y, p.d);
      p.x = n.x; p.y = n.y; p.t = 1 - p.t; p.d = S.want; p.face = p.d;
    }
    if (p.t === 0) turnAt(S, p);
    if (p.d < 0) return;
    p.t += sp;
    if (p.t >= 1) {
      var m = ahead(p.x, p.y, p.d);
      p.x = m.x; p.y = m.y; p.t -= 1;
      eat(S, p.x, p.y);
      if (S.clear) { p.t = 0; return; }
      turnAt(S, p);
      if (p.d < 0) p.t = 0;
    }
  }

  function eat(S, x, y) {
    var id = y * W + x, f = S.food[id];
    if (!f) return;
    S.food[id] = 0; S.left--;
    if (f === 1) { S.score += 10; S.ev.push({ t: 'seed' }); } else {
      S.score += 50;
      S.fright = Math.round(LEVELS[S.level].frS / DT); S.chain = 0;
      // every beetle out in the maze turns pale and turns round
      S.ch.forEach(function (c) {
        if (c.st !== 'out') return;
        c.fr = true;
        if (c.t > 0) { var n = ahead(c.x, c.y, c.d); c.x = n.x; c.y = n.y; c.t = 1 - c.t; c.d = (c.d + 2) % 4; } else if (walk(S.M, c.x, c.y, (c.d + 2) % 4)) c.d = (c.d + 2) % 4;
      });
      S.ev.push({ t: 'berry' });
    }
    if (S.left === 0) {
      S.score += 500; S.cleared++; S.clear = CLEAR; S.fright = 0;
      S.ch.forEach(function (c) { c.fr = false; });
      S.ev.push({ t: 'clear', stage: S.stage, clean: S.stageDeaths === 0 });
    }
  }

  function target(S, c) {
    var p = S.p;
    if (c.kind === 'direct') return { x: p.x, y: p.y };
    if (c.kind === 'ambush') return { x: p.x + 4 * DIRS[p.face][0], y: p.y + 4 * DIRS[p.face][1] };
    if (c.kind === 'patrol') return CORNERS[c.k];
    return null;
  }
  // At each tile a beetle picks its next way; it never turns straight back unless it is a
  // caught one finding the shortest way home
  function choose(S, c) {
    var M = S.M, back = (c.d + 2) % 4, opts = [], d;
    for (d = 0; d < 4; d++) if (walk(M, c.x, c.y, d) && (d !== back || c.st === 'eyes')) opts.push(d);
    if (!opts.length) return back;
    if (c.st === 'eyes') {
      var bd = opts[0], bv = 1e9;
      opts.forEach(function (o) { var n = ahead(c.x, c.y, o), v = M.home[n.y * W + n.x]; if (v >= 0 && v < bv) { bv = v; bd = o; } });
      return bd;
    }
    if (c.kind === 'patrol' && Math.abs(c.x - CORNERS[c.k].x) + Math.abs(c.y - CORNERS[c.k].y) <= 3) c.k = (c.k + 1) % 4;
    if (c.fr || c.kind === 'random') return opts[Math.floor(rnd(S) * opts.length)];
    var tg = target(S, c), best = opts[0], bdist = 1e9;
    opts.forEach(function (o) {
      var n = ahead(c.x, c.y, o), dd = (n.x - tg.x) * (n.x - tg.x) + (n.y - tg.y) * (n.y - tg.y);
      if (dd < bdist) { bdist = dd; best = o; }
    });
    return best;
  }
  function moveBug(S, c, L, f) {
    var M = S.M;
    if (c.st === 'home') {
      if (c.wait > 0) { c.wait--; return; }
      // out through the gate, and on its way in the same step
      c.x = M.exit.x; c.y = M.exit.y; c.t = 0; c.d = c.i % 2 ? 1 : 3; c.st = 'out'; c.fr = false;
    }
    c.t += (c.st === 'eyes' ? L.eyes : c.fr ? L.fr : L.bug * f) * DT;
    if (c.t >= 1) {
      var m = ahead(c.x, c.y, c.d);
      c.x = m.x; c.y = m.y; c.t -= 1;
      if (c.st === 'eyes' && c.x === M.exit.x && c.y === M.exit.y) {
        var den = M.den[1];
        c.st = 'home'; c.x = den.x; c.y = den.y; c.t = 0; c.d = 0; c.wait = 60;
        return;
      }
      c.d = choose(S, c);
    }
  }

  function pos(e) {
    if (e.d < 0 || !e.t) return { x: e.x, y: e.y };
    return { x: e.x + DIRS[e.d][0] * e.t, y: e.y + DIRS[e.d][1] * e.t };
  }
  function collide(S) {
    var a = pos(S.p);
    for (var i = 0; i < S.ch.length; i++) {
      var c = S.ch[i];
      if (c.st !== 'out') continue;
      var b = pos(c), dx = Math.abs(a.x - b.x);
      dx = Math.min(dx, W - dx);
      if (dx + Math.abs(a.y - b.y) >= 0.6) continue;
      if (c.fr) {
        c.st = 'eyes'; c.fr = false; S.chain++; S.bugs++;
        var pts = 200 * Math.pow(2, S.chain - 1);
        S.score += pts;
        S.ev.push({ t: 'bug', pts: pts, x: b.x, y: b.y, kind: c.kind });
        if (S.chain === 4) S.ev.push({ t: 'feast' });
      } else {
        S.lives--; S.deaths++; S.stageDeaths++; S.dying = DYING; S.fright = 0;
        S.ch.forEach(function (o) { o.fr = false; });
        S.ev.push({ t: 'die', by: c.kind });
        return true;
      }
    }
    return false;
  }

  function step(S) {
    if (S.over) return;
    S.tick++;
    if (S.dying) {
      if (--S.dying === 0) {
        if (S.lives <= 0) { S.over = true; S.ev.push({ t: 'over' }); } else resetActors(S);
      }
      return;
    }
    if (S.clear) {
      if (--S.clear === 0) {
        if (S.stage + 1 >= STAGES) {
          S.score += 300 * S.lives;
          S.over = true; S.won = true;
          S.ev.push({ t: 'win' });
        } else { startStage(S, S.stage + 1); S.ev.push({ t: 'stage', stage: S.stage }); }
      }
      return;
    }
    if (S.ready) { S.ready--; return; }
    var L = LEVELS[S.level], f = 1 + 0.025 * S.stage;
    movePlayer(S, L.me * DT);
    if (S.clear || collide(S)) return;
    if (S.fright > 0 && --S.fright === 0) { S.chain = 0; S.ch.forEach(function (c) { c.fr = false; }); }
    for (var i = 0; i < S.ch.length; i++) moveBug(S, S.ch[i], L, f);
    collide(S);
  }

  function drain(S) { var e = S.ev; S.ev = []; return e; }

  var KEYS = ['seed', 'rs', 'lives', 'score', 'stage', 'cleared', 'deaths', 'bugs', 'stageDeaths'];
  function snapshot(S) {
    var o = { level: S.level, order: S.order.slice(), food: S.food.join('') };
    KEYS.forEach(function (k) { o[k] = S[k]; });
    return o;
  }
  // A saved run comes back at the start of a life in the same maze, with the seeds it had left
  function restore(o) {
    if (!o || !LEVELS[o.level] || typeof o.food !== 'string' || o.food.length !== W * H || !/^[012]+$/.test(o.food)) return null;
    if (!KEYS.every(function (k) { return typeof o[k] === 'number' && isFinite(o[k]); })) return null;
    if (!Array.isArray(o.order) || o.order.slice().sort().join() !== '0,1,2,3,4') return null;
    if (o.stage < 0 || o.stage >= STAGES || o.lives < 1 || o.lives > LIVES) return null;
    var S = { level: o.level, order: o.order.slice(), over: false, won: false, ev: [], tick: 0 };
    KEYS.forEach(function (k) { S[k] = o[k]; });
    var sd = S.stageDeaths;
    startStage(S, o.stage);
    S.stageDeaths = sd;
    S.food = o.food.split('').map(Number); S.left = 0;
    for (var i = 0; i < S.food.length; i++) {
      if (S.food[i] && !walkable(S.M.rows[Math.floor(i / W)][i % W])) return null;
      if (S.food[i]) S.left++;
    }
    return S.left ? S : null;
  }

  return {
    W: W, H: H, DT: DT, LIVES: LIVES, STAGES: STAGES, READY: READY, DYING: DYING, CLEAR: CLEAR,
    DIRS: DIRS, NAMES: NAMES, LEVELS: LEVELS, KINDS: KINDS, CORNERS: CORNERS, MAZES: MAZES,
    newGame: newGame, step: step, setWant: setWant, drain: drain, snapshot: snapshot, restore: restore,
    cell: cell, walkable: walkable, walk: walk, ahead: ahead, pos: pos, target: target
  };
}
if (typeof module !== 'undefined') module.exports = MuncherEngineFactory;
/* ==== ENGINE END ==== */
</script>
<script>
(function () {
  'use strict';
  var C = window.Chogan, el = C.el;
  var E = MuncherEngineFactory();
  // the logical view: 20 units a tile
  var T = 20, VW = E.W * T, VH = E.H * T;
  var ACCENT = '#004B63';

  C.boot({});
  var ctx = C.game({
    id: 'muncher',
    name: { fa: 'لقمه‌خور', en: 'Muncher', zh: '迷宫吞吞', de: 'Mampfer', es: 'Comilón', pl: 'Łakomczuch', fr: 'Croqueur' },
    accent: ACCENT,
    mood: 'dots',
    strings: {
      fa: {
        scene: 'هزارتوی پرچین با دانه، توت و چهار سوسک', muHint: 'انگشت را بکش تا بپیچد. همه‌ی دانه‌ها را بخور.', padHint: 'با دکمه‌های جهت بپیچ. همه‌ی دانه‌ها را بخور.', tapGo: 'برای ادامه صفحه را لمس کن.',
        mazeN: 'هزارتوی {n} از {m}', livesN: 'جان: {n}', ptsN: 'امتیاز: {n}', bestN: 'بهترین: {n}', dailyMu: 'لقمه‌خور روزانه', newRun: 'دور تازه',
        ready: 'آماده!', caught: 'گیر افتادی!', cleared: 'هزارتو تمام شد!', allClear: 'هر پنج هزارتو تمام شد!', outLives: 'جان‌ها تمام شد',

  var params = new URLSearchParams(location.search);
  var dailyDate = params.get('daily');
  var LEVEL_KEYS = ['easy', 'medium', 'hard'];

  var prefs = ctx.store.get('prefs', null);
  if (!prefs || typeof prefs !== 'object') prefs = {};
  if (LEVEL_KEYS.indexOf(prefs.level) < 0) prefs.level = 'medium';
  if (prefs.ctrl !== 'pad') prefs.ctrl = 'swipe';

  var S = null, raf = 0, last = 0, acc = 0, paused = false, waiting = false, ended = false, tries = 0, startedAt = 0;
  // drawing state: the floating words, a short flash when a maze is cleared, the time of the last seed sound
  var pops = [], lastSeedAt = 0, clock = 0, newBest = false;

  var cv = el('canvas', { class: 'mu-canvas', role: 'img', 'aria-label': C.t('scene') });
  var box = el('div', { class: 'mu-box' }, [cv]);
  var top = el('div', { class: 'mu-top ch-above' });
  var status = el('div', { class: 'mu-status', role: 'status', 'aria-live': 'polite' });
  var ARROW = '<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5 L19 14 H14.5 V19 H9.5 V14 H5 Z" fill="currentColor"/></svg>';
  var ROT = { up: 0, right: 90, down: 180, left: 270 };
  function arrowBtn(dir, label) {
    var b = el('button', { class: 'mu-arrow mu-arrow--' + dir, type: 'button', 'aria-label': label });
    b.innerHTML = ARROW;
    b.firstChild.style.transform = 'rotate(' + ROT[dir] + 'deg)';
    // the turn is taken on the press, not the release, so a quick thumb is never late
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); C.audio.unlock(); if (waiting) go(); turn(dir); });
    b.addEventListener('click', function (e) { if (e.detail === 0) turn(dir); });
    return b;
  }
  var pad = el('div', { class: 'mu-pad' }, [arrowBtn('up', C.t('mvUp')), arrowBtn('left', C.t('mvLeft')), arrowBtn('right', C.t('mvRight')), arrowBtn('down', C.t('mvDown'))]);
  var wrap = el('div', { class: 'mu-wrap ch-split' }, [el('div', { class: 'ch-fit' }, [box]), el('div', { class: 'ch-side' }, [top, status, pad])]);

  ctx.button({ icon: 'help', label: C.t('help'), onClick: showHelp });
  // the level and the control live behind a gear, never inside help
  ctx.button({ icon: 'gear', label: C.t('settings'), onClick: function () { settings(); } });
  ctx.button({ icon: 'refresh', label: C.t('newRun'), onClick: function () { askNew(); } });
  ctx.main.appendChild(wrap);
  ctx.mount();

  /* ------------------------------------------------------------- runs */

  function level() { return dailyDate ? 'medium' : prefs.level; }
  // the daily run's maze order and beetles come from the day, the same for everyone
  function seedFor() { return Math.floor((dailyDate ? C.daily('muncher', dailyDate).rng() : Math.random()) * 4294967296); }

  function newRun() {
    S = E.newGame(seedFor(), level());
    tries++;
    startedAt = Date.now();
    ended = false; waiting = false; last = 0; acc = 0; pops = []; newBest = false;
    ctx.clearSave();
    renderTop(); renderStatus();
    kick();
  }
  function askNew() {
    if (!S || ended || (S.stage === 0 && S.left === E.MAZES[S.order[0]].seeds)) { newRun(); return; }
    C.ui.confirm({ title: C.t('newRun'), body: C.t('resetWarn'), onOk: newRun });
  }
  function settings() {
    var lv = prefs.level, body = el('div', { class: 'ch-col', style: { gap: 'var(--s-3)', 'align-items': 'center' } });
    if (!dailyDate) {
      body.appendChild(el('div', { class: 'mu-label', text: C.t('difficulty') }));
      body.appendChild(C.ui.segmented([{ value: 'easy', label: C.t('easy') }, { value: 'medium', label: C.t('medium') }, { value: 'hard', label: C.t('hard') }], lv, function (v) { lv = v; }));
    }
    body.appendChild(el('div', { class: 'mu-label', text: C.t('ctrlL') }));
    // the control applies at once and keeps the run going
    body.appendChild(C.ui.segmented([{ value: 'swipe', label: C.t('ctrlSwipe') }, { value: 'pad', label: C.t('ctrlPad') }], prefs.ctrl, function (v) { prefs.ctrl = v; ctx.store.set('prefs', prefs); applyCtrl(); }));
    var actions = [{ label: C.t('cancel') }];
    if (!dailyDate) {
      if (S && !ended) body.appendChild(el('p', { class: 'ch-xs ch-dim', text: C.t('resetWarn') }));
      actions.push({ label: C.t('start'), kind: 'primary', onClick: function () { prefs.level = lv; ctx.store.set('prefs', prefs); newRun(); } });
    }
    C.ui.modal({ title: C.t('settings'), closeButton: true, body: [body], actions: actions });
  }
  function applyCtrl() { pad.classList.toggle('is-on', prefs.ctrl === 'pad'); renderStatus(); }

  function blocked() { return paused || waiting || document.hidden || !!document.querySelector('.ch-scrim'); }
  function tick(now) {
    raf = 0;
    if (!S) return;
    var dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
    last = now;
    if (!blocked() && !ended) {
      // a fixed step, so a run plays the same on every screen
      acc += dt;
      var n = 0;
      while (acc >= E.DT && n < 8) {
        E.step(S); acc -= E.DT; n++;
        events();
        if (ended) break;
      }
      if (n >= 8) acc = 0;
      clock += dt;
    }
    for (var i = pops.length - 1; i >= 0; i--) { pops[i].t -= dt * 0.9; if (pops[i].t <= 0) pops.splice(i, 1); }
    draw();
    raf = requestAnimationFrame(tick);
  }
  function kick() { if (!raf) { last = 0; raf = requestAnimationFrame(tick); } }

  function turn(dir) {
    if (!S || ended) return;
    E.setWant(S, dir);
    pad.querySelectorAll('.mu-arrow').forEach(function (b) { b.classList.toggle('is-on', b.classList.contains('mu-arrow--' + dir)); });
  }

  function events() {
    var ev = E.drain(S), save = false, top2 = false;
    for (var i = 0; i < ev.length; i++) {
      var e = ev[i];
      if (e.t === 'seed') {
        // a seed every few frames: one soft tick at most every 90 ms, never a buzz
        var now = Date.now();
        if (now - lastSeedAt > 90) { C.audio.sfx('tick'); lastSeedAt = now; }
        top2 = true;
      } else if (e.t === 'berry') { C.audio.sfx('pop'); C.haptic('tap'); top2 = true; }
      else if (e.t === 'bug') {
        C.audio.sfx('chain'); C.haptic('success');
        pops.push({ text: C.num(e.pts), x: (e.x + 0.5) * T, y: (e.y + 0.5) * T, t: 1, small: true });
        top2 = true;
      } else if (e.t === 'feast') C.achievements.unlock('mu-feast');
      else if (e.t === 'die') { C.feedback('bad'); pops.push({ text: C.t('caught'), t: 1.2 }); save = true; top2 = true; }

  function finish() {

    var lines = [{ label: C.t('ptsL'), value: C.num(sc) }, { label: C.t('mazesL'), value: C.num(S.cleared) + ' / ' + C.num(E.STAGES) }, { label: C.t('bugsL'), value: C.num(S.bugs) }];

    } else {

      bugs: ['#D8423D', '#8A55D6', '#2F72D8', '#3F9A36'], pale: '#9DB3CF', pale2: '#FFFFFF', leg: '#2A2730',

  var layer = null, layerKey = '';

    var x, y, k = 3;
    [[P.hedge, 0], [P.hedge2, 4]].forEach(function (pass) {
      g.fillStyle = pass[0];

  function beetle(g, c, P, t) {

    var flash = S.fright > 0 && S.fright < 120 && Math.floor(S.fright / 10) % 2 === 0;

  /* ----------------------------------------------------------------- ui */

  function renderTop() {

    else top.appendChild(el('span', { class: 'ch-badge ch-badge--accent', text: C.t(prefs.level === 'easy' ? 'easy' : prefs.level === 'hard' ? 'hard' : 'medium') }));
    if (!S) return;
    top.appendChild(el('span', { class: 'ch-badge', text: C.t('mazeN', { n: C.num(S.stage + 1), m: C.num(E.STAGES) }) }));
    top.appendChild(el('span', { class: 'ch-badge', text: C.t('livesN', { n: C.num(Math.max(0, S.lives)) }) }));
    top.appendChild(el('span', { class: 'ch-badge', text: C.t('ptsN', { n: C.num(S.score) }) }));
    var best = dailyDate ? 0 : C.stats.getBest('muncher', 'score_' + level());

    if (e.button !== undefined && e.button > 0) return;

    if (waiting) { go(); return; }
    ptr = { id: e.pointerId, x: e.clientX, y: e.clientY };
  });
  window.addEventListener('pointermove', function (e) {

    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {

        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [kb('← ↑ → ↓ / W A S D', C.t('kMove')), kb('R', C.t('kAgain'))])
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  // little pictures for the tutorial: a strip of maze, the muncher, a berry and beetles
  function svgMe(x, y) {
    return '<g transform="translate(' + x + ',' + y + ')"><path d="M0 -11 q-1 -6 2 -9" stroke="#3E9A4E" stroke-width="2.4" fill="none" stroke-linecap="round"/><ellipse cx="4" cy="-19" rx="4" ry="2" fill="#3E9A4E"/>' +
      '<circle r="11" cy="1" fill="#B9771A"/><circle r="11" fill="#F2B33D"/><ellipse cx="5.5" cy="2" rx="4" ry="4.5" fill="#5A2A12"/>' +
      '<circle cx="1" cy="-4" r="2.6" fill="#fff"/><circle cx="1" cy="4" r="0" fill="#fff"/><circle cx="2" cy="-4" r="1.4" fill="#241A15"/></g>';
  }
  function svgBug(x, y, col) {
    return '<g transform="translate(' + x + ',' + y + ')"><g stroke="#2A2730" stroke-width="1.6" stroke-linecap="round"><path d="M-6 -4 h-5 M-6 1 h-5 M-6 6 h-5 M6 -4 h5 M6 1 h5 M6 6 h5"/></g>' +
      '<circle cy="-8" r="4" fill="#2A2730"/><ellipse cy="2" rx="8" ry="9" fill="' + col + '"/><path d="M0 -6 V11" stroke="rgba(0,0,0,.35)"/></g>';
  }
  function tArt(kind) {
    var s = '<svg viewBox="0 0 200 120" width="100%" direction="ltr"><rect width="200" height="120" rx="10" fill="#DCEBEF"/>' +
      '<g fill="#2F7F90"><rect x="10" y="10" width="180" height="14" rx="7"/><rect x="10" y="96" width="180" height="14" rx="7"/></g>';
    var seeds = function (from, to) { var o = ''; for (var x = from; x <= to; x += 16) o += '<ellipse cx="' + x + '" cy="60" rx="3" ry="2.3" fill="#B8762A"/>'; return o; };
    if (kind === 1) {
      s += '<rect x="10" y="40" width="70" height="12" rx="6" fill="#56A3B2"/><rect x="120" y="68" width="70" height="12" rx="6" fill="#56A3B2"/>' + seeds(86, 182) + svgMe(60, 64) +
        '<path d="M100 92 h40 M132 86 l8 6 -8 6" stroke="' + ACCENT + '" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
    } else if (kind === 2) {
      s += seeds(30, 60) + '<circle cx="86" cy="60" r="8" fill="#D93B57"/><ellipse cx="89" cy="51" rx="4" ry="2" fill="#3E9A4E"/>' + svgMe(60, 64) +
        svgBug(130, 60, '#9DB3CF') + svgBug(165, 60, '#9DB3CF');
    } else {
      s += seeds(30, 120) + svgMe(150, 64) + svgBug(30, 40, '#D8423D') + svgBug(60, 82, '#8A55D6') +
        '<path d="M176 40 l4 8 8 1 -6 6 2 8 -8 -4 -8 4 2 -8 -6 -6 8 -1z" fill="#F2B33D"/>';
    }
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: tArt(1) },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: tArt(2) },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: tArt(3) }
  ];

  /* -------------------------------------------------------------- start */

  // A run in progress is saved after each lost life and each new maze and when the app
  // goes away; it comes back at the start of a life with the seeds it had left. The
  // daily run has its own slot.
  ctx.autosave(function () {
    if (!S || S.over || ended) return { inProgress: false };
    return { s: E.snapshot(S), tries: tries, daily: dailyDate || null, elapsed: Date.now() - startedAt };
  });
  function resumeRun(sv) {
    var R = E.restore(sv.s);
    if (!R) return false;
    S = R; tries = sv.tries || 1; startedAt = Date.now() - (sv.elapsed || 0);
    ended = false; waiting = true; last = 0; acc = 0;
    renderTop(); renderStatus(); draw(); kick();
    return true;
  }
  applyCtrl();
  var saved = ctx.loadSave();
  if (dailyDate) {
    if (!(saved && saved.s && saved.daily === dailyDate && resumeRun(saved))) newRun();
    if (C.stats.dailyDone('muncher', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).muncher;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
    }
  } else if (!(saved && saved.s && !saved.daily && saved.s.level === prefs.level && resumeRun(saved))) {
    newRun();
  }
  ctx.tutorialIfNew(TUT);
})();
</script>
</body>
</html>
