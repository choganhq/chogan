<style>
  /* the board is taller than wide in every window; a wide one puts the side rows beside it */
  .pf-wrap > .ch-fit { --fit-ar: calc(2 / 3); }
  .ch-fit > .pf-box { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
  /* the board is drawn left to right in every language, so the launcher follows the finger */
  .pf-canvas { display: block; touch-action: none; direction: ltr; user-select: none; -webkit-user-select: none; max-width: 100%; max-height: 100%; }
  .pf-top { display: flex; justify-content: center; align-items: center; gap: var(--s-2); flex-wrap: wrap; }
  .pf-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: var(--c-surface-2); font-weight: 700; font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }
  .pf-goals { display: flex; justify-content: center; gap: var(--s-2); flex-wrap: wrap; }
  .pf-goal { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--c-line); font-size: var(--fs-sm); color: var(--c-text-dim); font-variant-numeric: tabular-nums; }
  .pf-goal svg { opacity: .45; }
  .pf-goal--on { border-color: var(--c-gold); color: var(--c-text); }
  .pf-goal--on svg { opacity: 1; fill: currentColor; color: var(--c-gold); }
  .pf-status { min-height: 1.6em; font-weight: 700; color: var(--c-text-dim); text-align: center; font-size: var(--fs-sm); }
  .pf-levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--s-2); }
  .pf-lv {
    min-height: 56px; border: 2px solid transparent; border-radius: var(--r-md);
    background: var(--c-surface-2); color: var(--c-text); font: inherit; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    touch-action: manipulation;
  }
  .pf-lv b { font-size: var(--fs-lg); font-variant-numeric: tabular-nums; }
  .pf-lv--on { border-color: var(--game); }
  .pf-lv--done { background: var(--game-soft); }
  .pf-lv[disabled] { opacity: .45; cursor: default; }

<script>
/* ==== ENGINE START ==== */
function PegfallEngineFactory() {
  'use strict';

  // Board units, y down: 100 across and 150 tall. One fixed step of 1/120 s and no
  // trigonometry or randomness in the simulation, so the same drop at the same moment
  // gives the same path on every device, and a player can learn a board (#949).
  var W = 100, H = 150, R = 2.2, PR = 1.3, DT = 1 / 120, G = 150, VMAX = 150;
  var E_PEG = 0.42, E_WALL = 0.4, E_BUMP = 0.85, FRICT = 0.04, DROP_Y = 7;
  var SLOT_H = 14, NSLOT = 9, SW = W / NSLOT, XQ = 0.5;
  // where the narrow rows' outermost pegs sit, in from each wall (#949)
  var EDGE = 6.5;
  // a ball that has not landed after 40 s of board time is put in the slot under it
  var CAP = 40 * 120;
  var BALLS = 10, LEVELS = 15, PERIOD = 240, PHASES = 8;
  // shares of a steady player's score (aimScore) for one, two and three stars
  var STAR_K = [0.5, 0.75, 0.95], AIM = 1.5;

  function rng(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function quant(x) { return clamp(Math.round(x / XQ) * XQ, R + 0.5, W - R - 0.5); }

  var PATTERNS = [
    [10, 20, 30, 50, 100, 50, 30, 20, 10],
    [100, 30, 20, 10, 5, 10, 20, 30, 100],
    [20, 50, 10, 30, 80, 30, 10, 50, 20],
    [50, 10, 100, 10, 20, 10, 100, 10, 50],
    [5, 40, 10, 60, 10, 60, 10, 40, 5]
  ];

  // Board parameters by level: more rows and holes, then angled rails from 4 and moving
  // bumpers from 6 (two from 11). Level 0 is the daily board's mix.
  function params(level) {
    var k = clamp(level | 0, 1, LEVELS) - 1;
    return { rows: Math.min(11, 7 + Math.floor(k / 3)), holes: Math.min(0.22, 0.03 * k), rails: k >= 3 ? 1 + (k >= 8 ? 1 : 0) : 0, bumpers: k >= 10 ? 2 : k >= 5 ? 1 : 0 };
  }

  /* One board from a seed and a level: pegs on a staggered grid (the wide rows reach the
     walls with half pegs, so a ball can never wedge between a wall and a peg), a few
     holes, rails, moving bumpers, the nine slot values and where the star slot goes. */
  function make(seed, level) {
    seed = seed >>> 0;
    var r = rng(seed), P = params(level), pegs = [], segs = [], bumpers = [], i, j;
    var top = 26, dy = Math.min(10, (118 - top) / (P.rows - 1));
    for (i = 0; i < P.rows; i++) {
      var y = top + i * dy, odd = i % 2 === 1;
      for (j = odd ? 15 : 0; j <= (odd ? 85 : 100); j += 10) {
        // the first two rows stay full, so every drop meets a peg early
        if (i >= 2 && j > 0 && j < 100 && r() < P.holes) continue;
        pegs.push({ x: j, y: y, r: PR });
      }
      // #949: with nothing between a wall and 15, a ball dropped by a wall fell straight to
      // the corner slot on every narrow row. These pegs close that lane and are never holes;
      // the gap to the wall (5.2) is wider than a ball (4.4), so nothing can wedge there.
      if (odd) { pegs.push({ x: EDGE, y: y, r: PR }); pegs.push({ x: W - EDGE, y: y, r: PR }); }
    }
    for (i = 0; i < P.rails; i++) {
      var left = r() < 0.5, ry = top + dy * (2 + Math.floor(r() * (P.rows - 4)));
      var len = 12 + r() * 8;
      // short rails sloping down off the walls, which turn a ball back to the middle
      segs.push(left ? { ax: 0, ay: ry, bx: len, by: ry + len * 0.5, r: 0.9 } : { ax: W, ay: ry, bx: W - len, by: ry + len * 0.5, r: 0.9 });
    }
    for (i = 0; i < P.bumpers; i++) {
      var by = top + dy * (P.bumpers === 2 ? (i ? P.rows - 3 : 2.5) : Math.floor(P.rows / 2) + 0.5);
      bumpers.push({ x0: 50, y: by, r: 4.2, amp: 22 + r() * 12, ph: Math.floor(r() * PERIOD), dir: i ? -1 : 1 });
    }
    // pegs in a bumper's lane or on a rail go, so nothing can pin a ball
    pegs = pegs.filter(function (p) {
      for (var b = 0; b < bumpers.length; b++) {
        var B = bumpers[b];
        if (Math.abs(p.y - B.y) < B.r + PR + 2 * R + 1 && Math.abs(p.x - B.x0) < B.amp + B.r + PR + 2 * R + 1 && p.x > 0 && p.x < W) return false;
      }
      for (var s = 0; s < segs.length; s++) if (segDist(segs[s], p.x, p.y).d < segs[s].r + PR + 2 * R + 1) return false;
      return true;
    });
    var pat = PATTERNS[Math.floor(r() * PATTERNS.length)].slice();
    if (r() < 0.5) pat.reverse();
    // one value swapped with a neighbour, so two boards of one pattern differ
    var sw = 1 + Math.floor(r() * 7), t = pat[sw]; pat[sw] = pat[sw + 1]; pat[sw + 1] = t;
    var star = [];
    for (i = 0; i < 4; i++) star.push(Math.floor(r() * NSLOT));
    // #971: a star slot that stayed put let one good aim score double twice in a row, so
    // each place differs from the one before it, the wrap from the fourth to the first too;
    // shifted without drawing again, so every other part of the board stays the same
    for (i = 1; i < 4; i++) while (star[i] === star[i - 1] || (i === 3 && star[3] === star[0])) star[i] = (star[i] + 1) % NSLOT;
    var B0 = { seed: seed, level: level | 0, pegs: pegs, segs: segs, bumpers: bumpers, slots: pat, star: star, balls: BALLS };
    for (i = 1; i < NSLOT; i++) B0.segs.push({ ax: i * SW, ay: H - SLOT_H, bx: i * SW, by: H, r: 0.8, wall: true });
    index(B0);
    return B0;
  }

  // pegs bucketed by 10-unit cells, so a step looks at a handful, not all of them
  function index(B) {
    var cells = {};
    B.pegs.forEach(function (p, n) {
      var cx = Math.floor(p.x / 10), cy = Math.floor(p.y / 10), k = cx + ',' + cy;
      (cells[k] = cells[k] || []).push(n);
    });
    B.cells = cells;
  }

  function segDist(s, x, y) {
    var dx = s.bx - s.ax, dy = s.by - s.ay, l2 = dx * dx + dy * dy;
    var t = l2 ? clamp(((x - s.ax) * dx + (y - s.ay) * dy) / l2, 0, 1) : 0;
    var px = s.ax + dx * t, py = s.ay + dy * t, ex = x - px, ey = y - py;
    return { d: Math.sqrt(ex * ex + ey * ey), ex: ex, ey: ey };
  }

  // triangle wave in [-1, 1], from the integer board clock only
  function tri(c) { var u = ((c % PERIOD) + PERIOD) % PERIOD / PERIOD; return 4 * Math.abs(u - 0.5) - 1; }
  function bumperX(b, clock) { return b.x0 + b.dir * b.amp * tri(clock + b.ph); }

  function starAt(B, k) { return B.star[k % B.star.length]; }
  function value(B, slot, k) { return B.slots[slot] * (slot === starAt(B, k) ? 2 : 1); }

  function ball(B, x, clock) { return { x: quant(x), y: DROP_Y, vx: 0, vy: 0, clock: clock | 0, n: 0, still: 0, done: false, slot: -1, capped: false }; }

  // bounce off a surface with outward normal (nx, ny) moving at (ux, uy)
  function bounce(b, nx, ny, pen, e, ux, uy) {
    b.x += nx * pen; b.y += ny * pen;
    var rvx = b.vx - ux, rvy = b.vy - uy, vn = rvx * nx + rvy * ny;
    if (vn >= 0) return false;
    var tx = rvx - vn * nx, ty = rvy - vn * ny;
    b.vx = ux + tx * (1 - FRICT) - e * vn * nx;
    b.vy = uy + ty * (1 - FRICT) - e * vn * ny;
    return -vn;
  }

  /* One step of the ball and the board clock. Returns the events: ['peg', index],
     ['bump'], ['land', slot]. */
  function step(B, b) {
    var ev = [];
    if (b.done) return ev;
    b.vy += G * DT;
    var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    if (sp > VMAX) { b.vx *= VMAX / sp; b.vy *= VMAX / sp; }
    b.x += b.vx * DT; b.y += b.vy * DT;
    b.clock++; b.n++;
    var touch = false, i, d, hit;
    var cx = Math.floor(b.x / 10), cy = Math.floor(b.y / 10);
    for (var gx = cx - 1; gx <= cx + 1; gx++) {
      for (var gy = cy - 1; gy <= cy + 1; gy++) {
        var cell = B.cells[gx + ',' + gy];
        if (!cell) continue;
        for (i = 0; i < cell.length; i++) {
          var p = B.pegs[cell[i]], ex = b.x - p.x, ey = b.y - p.y, m = R + p.r;
          if (ex * ex + ey * ey >= m * m) continue;
          d = Math.sqrt(ex * ex + ey * ey) || 1e-9;
          hit = bounce(b, ex / d, ey / d, m - d, E_PEG, 0, 0);
          touch = true;
          if (hit > 12) ev.push(['peg', cell[i]]);
        }
      }
    }
    for (i = 0; i < B.segs.length; i++) {
      var s = B.segs[i], q = segDist(s, b.x, b.y), ms = R + s.r;
      if (q.d >= ms) continue;
      d = q.d || 1e-9;
      bounce(b, q.ex / d, q.ey / d, ms - d, E_WALL, 0, 0);
      touch = true;
    }
    for (i = 0; i < B.bumpers.length; i++) {
      var bu = B.bumpers[i], bx = bumperX(bu, b.clock), ux = (bumperX(bu, b.clock + 1) - bx) / DT;
      var fx = b.x - bx, fy = b.y - bu.y, mb = R + bu.r;
      if (fx * fx + fy * fy >= mb * mb) continue;
      d = Math.sqrt(fx * fx + fy * fy) || 1e-9;
      if (bounce(b, fx / d, fy / d, mb - d, E_BUMP, ux, 0) > 8) ev.push(['bump', i]);
      touch = true;
    }
    if (b.x < R) { b.x = R; if (b.vx < 0) b.vx = -b.vx * E_WALL; touch = true; }
    if (b.x > W - R) { b.x = W - R; if (b.vx > 0) b.vx = -b.vx * E_WALL; touch = true; }
    // a ball balanced on top of something is nudged toward the middle, always the same way
    if (touch && Math.abs(b.vx) + Math.abs(b.vy) < 3) b.still++; else b.still = 0;
    if (b.still > 24) { b.vx += b.x < W / 2 ? 6 : -6; b.still = 0; }
    if (b.y >= H - R || b.n >= CAP) {
      b.capped = b.y < H - R;
      b.y = Math.min(b.y, H - R);
      b.slot = clamp(Math.floor(b.x / SW), 0, NSLOT - 1);
      b.done = true;
      ev.push(['land', b.slot]);
    }
    return ev;
  }

  function run(B, x, clock) {
    var b = ball(B, x, clock);
    while (!b.done) step(B, b);
    return b;
  }

  // every drop position a player can pick, left to right
  function positions() {
    var out = [];
    for (var x = quant(0); x <= W - R - 0.5 + 1e-9; x += XQ) out.push(Math.round(x * 2) / 2);
    return out;
  }

  /* Every drop position (and, with bumpers, eight moments of their swing) and the slot
     it lands in. The board is fixed apart from the bumpers, so this is the whole map.
     reachMore does it a slice at a time, so the page can map a daily board between
     frames instead of freezing a slow phone for seconds. */
  function reachMore(B, count) {
    if (B.reach) return true;
    var xs = positions(), phases = B.bumpers.length ? PHASES : 1, all = xs.length * phases;
    var q = B._rq || (B._rq = []);
    while (q.length < all && count-- > 0) {
      var i = q.length % xs.length, c0 = Math.floor(q.length / xs.length) * PERIOD / PHASES;
      q.push({ x: xs[i], clock: c0, slot: run(B, xs[i], c0).slot });
    }
    if (q.length < all) return false;
    B.reach = q; delete B._rq;
    return true;
  }
  function reach(B) { reachMore(B, Infinity); return B.reach; }
  function slotsReached(B) {
    var s = {};
    reach(B).forEach(function (o) { s[o.slot] = 1; });
    return Object.keys(s).map(Number).sort(function (a, b) { return a - b; });
  }
  // the most a round can score: every ball in the best slot any drop reaches
  function topScore(B) {
    var ok = slotsReached(B), tot = 0;
    for (var k = 0; k < B.balls; k++) {
      var best = 0;
      ok.forEach(function (s) { best = Math.max(best, value(B, s, k)); });
      tot += best;
    }
    return tot;
  }
  /* A player who knows the board but whose finger lands up to AIM units off: for each
     ball, the drop with the best average over that spread. Stars are shares of it, so
     three stars ask for a good read of the board and a steady hand, never luck alone
     (the perfect score sits well above them; #949). */
  function aimScore(B) {
    var re = reach(B), n = positions().length, phases = re.length / n, w = AIM / XQ, tot = 0;
    for (var k = 0; k < B.balls; k++) {
      var best = 0;
      for (var p = 0; p < phases; p++) {
        for (var i = w; i < n - w; i++) {
          var sum = 0;
          for (var d = -w; d <= w; d++) sum += value(B, re[p * n + i + d].slot, k);
          best = Math.max(best, sum / (2 * w + 1));
        }
      }
      tot += best;
    }
    return tot;
  }
  function thresholds(B) {
    if (B.th) return B.th;
    var aim = aimScore(B);
    B.th = STAR_K.map(function (f) { return Math.max(10, Math.round(aim * f / 10) * 10); });
    B.aim = aim;
    return B.th;
  }
  function stars(B, score) { var t = thresholds(B); return score >= t[2] ? 3 : score >= t[1] ? 2 : score >= t[0] ? 1 : 0; }

  // the campaign's boards are fixed seeds; the daily board is level 8's mix from the day's seed
  // measured once with thresholds() and kept, so opening a board costs nothing. The test
  // recomputes boards 1, 4 and 6 (all fifteen take 9 s); after a physics change, rebuild
  // every row from thresholds(level(n, true))
  var TH = [[670, 1000, 1270], [260, 390, 500], [380, 570, 720], [500, 740, 940], [310, 470, 590],
    [640, 960, 1210], [460, 690, 880], [310, 470, 600], [440, 650, 830], [420, 620, 790],
    [800, 1200, 1520], [450, 670, 850], [390, 580, 730], [330, 500, 640], [490, 740, 940]];
  function level(n, fresh) { var B = make((9490 + n * 7919) >>> 0, n); if (!fresh) B.th = TH[n - 1]; return B; }
  function daily(seed) { return make(seed >>> 0, 8); }

  // a round: the board, the balls dropped and their slots, the board clock
  function round(B) { return { B: B, k: 0, score: 0, hits: [], clock: 0 }; }
  function land(Rd, slot) {
    var v = value(Rd.B, slot, Rd.k);
    Rd.hits.push(slot); Rd.score += v; Rd.k++;
    return v;
  }
  function over(Rd) { return Rd.k >= Rd.B.balls; }

  // a ball in flight is saved as where and when it left, and replayed on restore
  function snapshot(Rd, fly) {
    var o = { seed: Rd.B.seed, level: Rd.B.level, hits: Rd.hits.slice(), clock: Rd.clock };
    if (fly) o.fly = { x: fly.x, clock: fly.clock };
    return o;
  }
  function restore(o) {
    if (!o || typeof o !== 'object' || !Array.isArray(o.hits)) return null;
    if (o.seed !== (o.seed >>> 0) || o.level !== (o.level | 0) || o.level < 1 || o.level > LEVELS) return null;
    if (o.clock !== (o.clock | 0) || o.clock < 0 || o.hits.length > BALLS) return null;
    if (!o.hits.every(function (s) { return s === (s | 0) && s >= 0 && s < NSLOT; })) return null;
    var f = o.fly;
    if (f != null && (typeof f !== 'object' || typeof f.x !== 'number' || !(f.x >= 0 && f.x <= W) || f.clock !== (f.clock | 0) || f.clock < 0 || o.hits.length >= BALLS)) return null;
    var B = make(o.seed, o.level), Rd = round(B);
    o.hits.forEach(function (s) { land(Rd, s); });
    Rd.clock = o.clock;
    if (f) { var b = run(B, f.x, f.clock); land(Rd, b.slot); Rd.clock = b.clock; }
    return Rd;
  }

  var api = {
    W: W, H: H, R: R, PR: PR, DT: DT, G: G, SLOT_H: SLOT_H, NSLOT: NSLOT, SW: SW, XQ: XQ, CAP: CAP, BALLS: BALLS, LEVELS: LEVELS, PERIOD: PERIOD, DROP_Y: DROP_Y, STAR_K: STAR_K, AIM: AIM,
    TH: TH, rng: rng, quant: quant, params: params, make: make, level: level, daily: daily, bumperX: bumperX, starAt: starAt, value: value,
    ball: ball, step: step, run: run, positions: positions, reach: reach, reachMore: reachMore, slotsReached: slotsReached, topScore: topScore, aimScore: aimScore, thresholds: thresholds, stars: stars,
    round: round, land: land, over: over, snapshot: snapshot, restore: restore
  };
  if (typeof self !== 'undefined') self.PegfallEngine = api;
  return api;
}
if (typeof module !== 'undefined' && module.exports) module.exports = PegfallEngineFactory;
/* ==== ENGINE END ==== */
</script>
<script>
(function () {
  'use strict';
  var C = window.Chogan, el = C.el;
  var E = PegfallEngineFactory();
  // a bright violet, apart from every other game's colour; white text on it passes 4.5:1 (#949)
  var ACCENT = '#AE36EA';

  C.boot({});
  var ctx = C.game({
    id: 'pegfall',
    name: { fa: 'توپ‌ریز', en: 'Pegfall', zh: '弹珠落', de: 'Kugelfall', es: 'Bola en caída', pl: 'Spadające kulki', fr: 'Chute de billes', ar: 'سقوط الكرة', hi: 'गिरती गेंद', ru: 'Шарикопад' },
    accent: ACCENT,
    mood: 'dots',
    strings: {
      fa: {
        pfScene: 'تخته‌ی میخ‌دار با خانه‌های امتیاز', pfBoardN: 'تخته‌ی {n}', pfDaily: 'تخته‌ی روزانه', pfBallsN: 'توپ: {n}', pfScoreN: 'امتیاز: {n}',
        pfHint: 'بالای تخته بکش و رها کن تا توپ بیفتد.', pfStarHint: 'خانه‌ی ★ دو برابر می‌دهد و بعد از هر توپ جا عوض می‌کند.', pfBumpHint: 'ضربه‌گیرها حرکت می‌کنند؛ لحظه‌ی رها کردن مهم است.', pfLast: 'توپ آخر!',
        pfCleared: 'تخته را بردی!', pfNoStar: 'این بار ستاره‌ای نشد', pfNext: 'تخته‌ی بعدی', pfRetry: 'دوباره همین تخته',

  }

  /* -------------------------------------------------------------- input */

  // the launcher follows the finger anywhere on the board; a drop within one unit of the
  // last one snaps to it exactly, so a good drop can be repeated
  function aimAt(e) {
    var r = cv.getBoundingClientRect(), V = view();
    var x = (e.clientX - r.left - V.ox) / V.k;
    if (lastX != null && Math.abs(x - lastX) <= 1) x = lastX;
    aim = E.quant(x);
    draw();
  }
  cv.addEventListener('pointerdown', function (e) {
    if (!Rd || ball || ended || E.over(Rd)) return;
    dragging = true;
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* an old WebView */ }
    aimAt(e);
    e.preventDefault();
  });
  cv.addEventListener('pointermove', function (e) { if (dragging) aimAt(e); });
  cv.addEventListener('pointerup', function (e) { if (!dragging) return; dragging = false; aimAt(e); drop(); });
  cv.addEventListener('pointercancel', function () { dragging = false; });

  window.addEventListener('keydown', function (e) {
    if (!Rd || e.target && e.target.closest && e.target.closest('.ch-modal')) return;
    var k = e.key, step = e.shiftKey ? 5 : E.XQ;
    if (k === 'ArrowLeft' || C.keyIs(e, 'a')) { e.preventDefault(); aim = E.quant(aim - step); draw(); }
    else if (k === 'ArrowRight' || C.keyIs(e, 'd')) { e.preventDefault(); aim = E.quant(aim + step); draw(); }
    else if (k === ' ' || k === 'Enter' || k === 'ArrowDown') { if (!e.repeat) { e.preventDefault(); drop(); } }
    else if (C.keyIs(e, 'r') && !dailyDate) { e.preventDefault(); restartAsk(); }
    else if (C.keyIs(e, 'l') && !dailyDate) { e.preventDefault(); showLevels(); }
  });

  C.onPause(function () { paused = true; dragging = false; ctx.save(); });
  C.onResume(function () { paused = false; last = 0; kick(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { last = 0; kick(); } });
  if (window.ResizeObserver) new ResizeObserver(function () { draw(); }).observe(box);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fontFam = ''; draw(); });
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { draw(); }); } catch (er) { /* old WebViews */ } }

  /* ------------------------------------------------------- boards, gear */

  function restartAsk() {
    if (!Rd) return;
    if (Rd.k > 0 && !ended) C.ui.confirm({ title: C.t('restart'), body: C.t('resetWarn'), onOk: function () { ctx.clearSave(); startRound(Rd.B.level); } });
    else startRound(Rd.B.level);
  }
  function showLevels() {
    if (dailyDate) return;
    var grid = el('div', { class: 'pf-levels' }), m = null;
    for (var i = 0; i < E.LEVELS; i++) {
      (function (n) {
        var locked = n > prog.unlocked, best = prog.best[n - 1], kids = [el('b', { text: C.num(n) })];
        if (locked) kids.push(C.icon('lock', 14));
        else if (best) {
          var sr = el('span', { class: 'pf-lv__stars' });
          for (var s = 1; s <= 3; s++) { var ic = C.icon('star', 11); if (s <= best.stars) ic.setAttribute('fill', 'currentColor'); else ic.style.opacity = '.4'; sr.appendChild(ic); }
          kids.push(sr);
        }
        var b = el('button', {
          class: 'pf-lv' + (Rd && n === Rd.B.level ? ' pf-lv--on' : '') + (best ? ' pf-lv--done' : ''),
          type: 'button', disabled: locked,
          'aria-label': C.t('pfBoardN', { n: C.num(n) }) + (locked ? ' — ' + C.t('pfLocked') : '')
        }, kids);
        b.addEventListener('click', function () {
          if (m) m.close();
          if (Rd && Rd.k > 0 && !ended) C.ui.confirm({ title: C.t('restart'), body: C.t('resetWarn'), onOk: function () { ctx.clearSave(); startRound(n); } });
          else startRound(n);
        });
        grid.appendChild(b);
      })(i + 1);
    }
    m = C.ui.modal({ title: C.t('pfChoose'), body: [grid], actions: [{ label: C.t('cancel') }] });
  }
  function showSettings() {
    var sw = C.ui.switch(prefs.path, function (v) { prefs.path = !!v; ctx.store.set('prefs', prefs); draw(); });
    C.ui.modal({
      title: C.t('settings'), closeButton: true,
      body: [el('div', { class: 'ch-list' }, [el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: C.t('pfPath') }), sw])])],
      actions: [{ label: C.t('done'), kind: 'primary' }]
    });
  }

  /* --------------------------------------------------------------- help */

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    var keys = [kb('← → / A D', C.t('pfKAim')), kb('Shift + ← →', C.t('pfKFar')), kb('Space / Enter / ↓', C.t('pfKDrop'))];
    if (!dailyDate) keys.push(kb('L', C.t('pfChoose')), kb('R', C.t('pfKAgain')));
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('pfRules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, keys)
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  function tArt(kind) {
    var s = '<svg viewBox="0 0 200 110" width="100%" direction="ltr"><rect width="200" height="110" rx="10" fill="#F1E6FB"/>', x, y;
    for (y = 0; y < 4; y++) for (x = 0; x < 9; x++) s += '<circle cx="' + (24 + x * 19 + (y % 2) * 9.5) + '" cy="' + (30 + y * 14) + '" r="2.6" fill="#6E4E8A"/>';
    var vals = [10, 30, 50, 100, 50, 30, 10];
    for (x = 0; x < 7; x++) {
      var star = kind === 2 && x === 5;
      s += '<rect x="' + (14 + x * 25) + '" y="88" width="23" height="18" rx="3" fill="' + (star ? '#F2A900' : 'rgba(174,54,234,' + (0.12 + vals[x] / 300) + ')') + '"/>' +
        '<text x="' + (25.5 + x * 25) + '" y="101" font-size="9" font-weight="700" text-anchor="middle" font-family="sans-serif" fill="#2B1F38">' + (star ? 60 : vals[x]) + '</text>';
    }
    s += '<rect x="20" y="9" width="160" height="2" rx="1" fill="rgba(174,54,234,.3)"/>';
    if (kind === 1) s += '<rect x="112" y="7" width="16" height="5" rx="2" fill="#6E4E8A"/><circle cx="120" cy="18" r="5" fill="#fff" stroke="#4A4458" stroke-width="1.2"/>' +
      '<path d="M70 20 H104 M104 20 L98 15 M104 20 L98 25" stroke="' + ACCENT + '" stroke-width="2.5" stroke-linecap="round" fill="none"/>';
    if (kind === 2) s += '<path d="M150 70 l3 6 6 1 -4.5 4 1 6 -5.5 -3 -5.5 3 1 -6 -4.5 -4 6 -1z" fill="#F2A900"/><circle cx="139" cy="80" r="5" fill="#fff" stroke="#4A4458" stroke-width="1.2"/>';
    if (kind === 3) s += '<path d="M90 16 L92 30 L84 44 L95 58 L88 72 L90 86" stroke="' + ACCENT + '" stroke-opacity=".5" stroke-width="2" stroke-dasharray="3 3" fill="none"/>' +
      '<circle cx="150" cy="51" r="8" fill="' + ACCENT + '"/><path d="M128 51 H172" stroke="rgba(174,54,234,.3)" stroke-width="1.5"/><path d="M162 42 l6 0 M164 39 l4 3 -4 3" stroke="#5B1F7A" stroke-width="1.5" fill="none"/>';
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('pfTut1'), text: C.t('pfTutText1'), art: tArt(1) },
    { title: C.t('pfTut2'), text: C.t('pfTutText2'), art: tArt(2) },
    { title: C.t('pfTut3'), text: C.t('pfTutText3'), art: tArt(3) }
  ];

  /* -------------------------------------------------------------- start */

  // saved after every ball and at every drop: a ball in flight comes back as where and
  // when it left, and lands at once, exactly where it would have
  ctx.autosave(function () {
    if (!Rd || ended || E.over(Rd) || (Rd.k === 0 && !fly)) return { inProgress: false };
    return { r: E.snapshot(Rd, fly), daily: dailyDate || null, tries: tries, last: lastX, elapsed: Date.now() - startedAt };
  });
  function resume(sv) {
    if (!sv || typeof sv !== 'object' || (sv.daily || null) !== (dailyDate || null)) return false;
    var R = E.restore(sv.r);
    if (!R) return false;
    // a save must be on the board it claims: the day's board, or an open campaign board
    if (dailyDate ? R.B.seed !== dailySeed || R.B.level !== 8 : R.B.seed !== E.level(R.B.level).seed || R.B.level > prog.unlocked) return false;
    Rd = dailyDate ? R : (function () { var x = E.round(E.level(R.B.level)); R.hits.forEach(function (s) { E.land(x, s); }); x.clock = R.clock; return x; })();
    tries = sv.tries >= 1 ? sv.tries | 0 : 1;
    startedAt = Date.now() - (sv.elapsed > 0 ? sv.elapsed : 0);
    begin();
    lastX = typeof sv.last === 'number' && sv.last >= 0 && sv.last <= E.W ? E.quant(sv.last) : null;
    if (lastX != null) aim = lastX;
    if (!dailyDate) { prog.cur = Rd.B.level; saveProg(); }
    renderSide(); draw();
    if (E.over(Rd)) setTimeout(finish, 300);
    return true;
  }
  var saved = ctx.loadSave();
  if (!(saved && resume(saved))) startRound(dailyDate ? 8 : prog.cur);
  if (dailyDate && C.stats.dailyDone('pegfall', dailyDate)) {
    var rec = C.stats.dailyOf(dailyDate).pegfall;
    C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
  }
  ctx.tutorialIfNew(TUT);
})();
</script>
