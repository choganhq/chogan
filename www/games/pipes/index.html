<script>
/* ==== ENGINE START ==== */
function PipesEngineFactory() {
  'use strict';

  var SIZES = [5, 7, 9];
  // a tile is a bit mask of the sides its pipe opens to
  var N = 1, E = 2, S = 4, W = 8, DIRS = [N, E, S, W];

  function opp(d) { return d === N ? S : d === E ? W : d === S ? N : E; }
  // one clockwise quarter turn moves every opening one side on: N→E→S→W→N
  function rot(m, k) { k = ((k % 4) + 4) % 4; for (var i = 0; i < k; i++) m = ((m << 1) | (m >> 3)) & 15; return m; }
  function degree(m) { var k = 0; for (var i = 0; i < 4; i++) if (m & DIRS[i]) k++; return k; }
  // how many turns bring a tile back to itself: a straight pipe looks the same after two
  function period(m) { return rot(m, 1) === m ? 1 : rot(m, 2) === m ? 2 : 4; }
  function nb(n, i, d) {
    var r = Math.floor(i / n) + (d === N ? -1 : d === S ? 1 : 0), c = i % n + (d === W ? -1 : d === E ? 1 : 0);
    return r < 0 || c < 0 || r >= n || c >= n ? -1 : r * n + c;
  }
  function source(n) { return Math.floor(n * n / 2); }

  // A random spanning tree grown from the source. It mostly extends the newest branch
  // (long winding runs) and sometimes a random one (side branches). No cell gets four
  // openings in the first pass, since a cross turns into itself and gives nothing to
  // solve; a second pass allows one only where a cell could not be reached otherwise.
  function tree(n, rnd) {
    var NN = n * n, m = new Array(NN).fill(0), inT = new Array(NN).fill(false), src = source(n), cap, active;
    inT[src] = true;
    for (var pass = 0; pass < 2; pass++) {
      cap = pass === 0 ? 3 : 4;
      active = [];
      for (var i = 0; i < NN; i++) if (inT[i]) active.push(i);
      while (active.length) {
        var k = rnd() < 0.55 ? active.length - 1 : Math.floor(rnd() * active.length), c = active[k], opts = [];
        if (degree(m[c]) < cap) for (var q = 0; q < 4; q++) { var j = nb(n, c, DIRS[q]); if (j >= 0 && !inT[j]) opts.push(DIRS[q]); }
        if (!opts.length) { active.splice(k, 1); continue; }
        var d = opts[Math.floor(rnd() * opts.length)], t = nb(n, c, d);
        m[c] |= d; m[t] |= opp(d); inT[t] = true; active.push(t);
      }
    }
    return m;
  }

  function masks(base, r) { return base.map(function (b, i) { return rot(b, r[i]); }); }

  // Water from the source: which tiles it reaches through two openings that meet, and
  // how many reached tiles open onto a wall or a pipe that does not answer. `from` is the
  // side (an index into DIRS) the water came in by, -1 for the source and dry tiles, so
  // the page can draw the current running the way the water goes (#663).
  function flow(n, base, r) {
    var NN = n * n, m = masks(base, r), wet = new Array(NN).fill(false), dist = new Array(NN).fill(-1), from = new Array(NN).fill(-1), src = source(n), q = [src], leaks = 0, count = 0;
    wet[src] = true; dist[src] = 0;
    while (q.length) {
      var i = q.shift(); count++;
      for (var k = 0; k < 4; k++) {
        var d = DIRS[k];
        if (!(m[i] & d)) continue;
        var j = nb(n, i, d);
        if (j < 0 || !(m[j] & opp(d))) { leaks++; continue; }
        if (!wet[j]) { wet[j] = true; dist[j] = dist[i] + 1; from[j] = (k + 2) % 4; q.push(j); }
      }
    }
    return { wet: wet, dist: dist, from: from, count: count, leaks: leaks };
  }
  // When a turn wets new tiles, they fill one ring after another going out from where
  // the water already was, `step` ms a ring; tiles that were wet or stay dry wait 0.
  // Before #663 every new tile turned blue at once, so nothing read as water moving.
  function fillDelays(wasWet, f, step) {
    var lo = Infinity, i, out = new Array(f.wet.length).fill(0);
    for (i = 0; i < f.wet.length; i++) if (f.wet[i] && !wasWet[i] && f.dist[i] < lo) lo = f.dist[i];
    for (i = 0; i < f.wet.length; i++) if (f.wet[i] && !wasWet[i]) out[i] = (f.dist[i] - lo) * step;
    return out;
  }
  // the win is read from the board, never from a stored answer: every tile wet and no
  // open end anywhere
  function won(n, base, r) { var f = flow(n, base, r); return f.count === n * n && f.leaks === 0; }

  // clockwise taps from turn r to a turn that looks like the answer's
  function taps(m, r) { var p = period(m); return (p - (r % p)) % p; }
  function par(base, r) { var s = 0; for (var i = 0; i < base.length; i++) s += taps(base[i], r[i]); return s; }

  // A puzzle: a tree as the answer, every tile then turned at random. A board that
  // starts solved or needs fewer taps than it has rows is thrown away.
  function generate(n, rnd) {
    for (var attempt = 0; attempt < 40; attempt++) {
      var base = tree(n, rnd), r = base.map(function () { return Math.floor(rnd() * 4); });
      var p = par(base, r);
      if (p >= n && !won(n, base, r)) return { n: n, base: base, rot: r, par: p };
    }
    return null;
  }

  // three stars within the fewest taps the generator's answer needs, two within half as
  // many again, one after that: never a loss
  function stars(moves, p) { return moves <= p ? 3 : moves <= p + Math.ceil(p / 2) ? 2 : 1; }

  function valid(o) {
    if (!o || SIZES.indexOf(o.n) < 0 || !Array.isArray(o.base) || !Array.isArray(o.rot) || !Array.isArray(o.locked)) return false;
    var NN = o.n * o.n;
    if (o.base.length !== NN || o.rot.length !== NN || o.locked.length !== NN) return false;
    for (var i = 0; i < NN; i++) {
      if (!(o.base[i] >= 1 && o.base[i] <= 15) || [0, 1, 2, 3].indexOf(o.rot[i]) < 0 || typeof o.locked[i] !== 'boolean') return false;
    }
    // the shapes must fit together as a tree, or the board could never be won
    if (!won(o.n, o.base, o.base.map(function () { return 0; }))) return false;
    return typeof o.moves === 'number' && o.moves >= 0 && typeof o.par === 'number' && o.par >= 0;
  }

  return {
    SIZES: SIZES, N: N, E: E, S: S, W: W, DIRS: DIRS,
    opp: opp, rot: rot, degree: degree, period: period, nb: nb, source: source, tree: tree, masks: masks,
    flow: flow, fillDelays: fillDelays, won: won, taps: taps, par: par, generate: generate, stars: stars, valid: valid
  };
}
if (typeof module !== 'undefined') module.exports = PipesEngineFactory;
/* ==== ENGINE END ==== */
</script>

    // Space and Enter on a focused cell are the button's own click; from elsewhere they
    // turn the cell under the cursor
    if ((e.key === ' ' || e.key === 'Enter') && !board.contains(document.activeElement) && !(document.activeElement && /^(BUTTON|INPUT|A)$/.test(document.activeElement.tagName))) {
      tap(focusAt); cells[focusAt].focus(); e.preventDefault(); return;
    }
    // the first arrow from anywhere on the page lands on the board
    if (/^Arrow/.test(e.key) && cells.length && !board.contains(document.activeElement)) { cells[focusAt].focus(); e.preventDefault(); }
  });

  /* ------------------------------------------------------------ dialogs */

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    var keys = [kb('← ↑ → ↓', C.t('kMove')), kb('Space / Enter', C.t('kRotate')), kb('L', C.t('kLock'))];
    if (!dailyDate) keys.push(kb('N', C.t('kNew')));
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, keys)
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  // 3×3 boards for the tutorial with literal colours (the light theme's), each tile
  // given as [mask, wet, locked]
  function tArt(tiles, arrowAt) {
    var s = '<svg viewBox="0 0 200 110" width="100%"><rect x="51" y="3" width="98" height="98" rx="6" fill="#5A3A2A"/>';
    for (var i = 0; i < 9; i++) {
      var x = 54 + (i % 3) * 31, y = 6 + Math.floor(i / 3) * 31, t = tiles[i];
      s += '<rect x="' + x + '" y="' + y + '" width="30" height="30" fill="' + (t[2] ? '#E3CBB6' : '#F6EDE4') + '"/>';
      s += '<g transform="translate(' + x + ' ' + y + ') scale(.3)" style="--pw-pipe:#A0522D;--pw-dry:#F1E2D4;--pw-water:#2E8FD0">' +
        shape(t[0], i === 4).replace(/class="w"/g, 'fill="' + (t[1] ? '#2E8FD0' : '#F1E2D4') + '" stroke="' + (t[1] ? '#2E8FD0' : '#F1E2D4') + '"')
          .replace(/class="o"/g, 'fill="#A0522D" stroke="#A0522D"').replace(/class="src"/g, 'fill="#2E8FD0"') + '</g>';
      if (t[2]) s += '<rect x="' + (x + 1) + '" y="' + (y + 1) + '" width="28" height="28" fill="none" stroke="#5A3A2A" stroke-width="1.5"/>' +
        '<path d="M' + (x + 21) + ' ' + (y + 6) + 'h6v5h-6zM' + (x + 22) + ' ' + (y + 6) + 'v-1.5a2 2 0 0 1 4 0V' + (y + 6) + '" fill="none" stroke="#5A3A2A" stroke-width="1"/>';
    }
    if (arrowAt != null) {
      var ax = 54 + (arrowAt % 3) * 31 + 15, ay = 6 + Math.floor(arrowAt / 3) * 31 + 15;
      s += '<path d="M' + (ax + 10) + ' ' + (ay - 8) + 'a13 13 0 0 1 0 16" fill="none" stroke="#AC5C39" stroke-width="2.5" stroke-linecap="round"/><path d="M' + (ax + 10) + ' ' + (ay + 8) + 'l-5 1 3 -5z" fill="#AC5C39"/>';
    }
    return s + '</svg>';
  }
  // a small solved tree: corner, tee, corner / straight, source, straight / corner, tee, corner
  var DONE = [[6, 1], [14, 1], [12, 1], [5, 1], [5, 1], [5, 1], [3, 1], [11, 1], [9, 1]];
  // the source here is a straight N–S pipe; tiles 1 and 7 are tees that reach the corners
  var T1 = DONE.map(function (t, i) { return [i === 2 ? 6 : t[0], i !== 2 && i !== 5 && i !== 8 ? 1 : 0, 0]; });
  var T2 = DONE.map(function (t) { return [t[0], 1, 0]; });
  var T3 = DONE.map(function (t, i) { return [t[0], 1, i === 0 || i === 6 ? 1 : 0]; });
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: tArt(T1, 2) },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: tArt(T2, null) },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: tArt(T3, null) }
  ];

  /* -------------------------------------------------------------- start */

  // the board is saved after every turn and lock; the daily one has its own slot
  ctx.autosave(function () {
    if (!S || ended) return { inProgress: false };
    return { n: S.n, base: S.base, rot: S.rot, locked: S.locked, moves: S.moves, par: S.par, daily: S.daily, elapsed: Date.now() - startedAt };
  });
  function save() { ctx.save(); }
  var saved = ctx.loadSave();
  if (saved && E.valid(saved) && (saved.daily || null) === (dailyDate || null) && !E.won(saved.n, saved.base, saved.rot)) {
    S = { n: saved.n, base: saved.base.slice(), rot: saved.rot.slice(), locked: saved.locked.slice(), moves: saved.moves, par: saved.par, daily: saved.daily || null };
    startedAt = Date.now() - (saved.elapsed || 0); focusAt = E.source(S.n);
    build();
  } else newPuzzle(dailyDate ? DAILY_N : prefs.n);
  if (dailyDate && C.stats.dailyDone('pipes', dailyDate)) {
    var rec = C.stats.dailyOf(dailyDate).pipes;
    C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
  }
  // the board keeps its square through rotation and late fonts by CSS alone; nothing
  // here is measured, so there is nothing to redraw
  ctx.tutorialIfNew(TUT);
})();
</script>
</body>
</html>
