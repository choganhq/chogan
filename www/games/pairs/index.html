<style>
  /* Card faces are pale ivory in both themes, so every symbol keeps its colour in light
     and dark; dark mode only deepens the backs and the shadow */
  :root { --pr-face: #FBF6EC; --pr-edge: #E2D6C2; --pr-back: #7C3AED; --pr-back-2: #9F6CF2; --pr-shadow: rgba(40, 20, 60, .22); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --pr-face: #EFE6D6; --pr-edge: #C9BBA3; --pr-back: #5B2BB0; --pr-back-2: #7C4FD0; --pr-shadow: rgba(0, 0, 0, .45); }
  }
  :root[data-theme="dark"] { --pr-face: #EFE6D6; --pr-edge: #C9BBA3; --pr-back: #5B2BB0; --pr-back-2: #7C4FD0; --pr-shadow: rgba(0, 0, 0, .45); }

  .pr-top { display: flex; justify-content: center; align-items: center; gap: var(--s-2); flex-wrap: wrap; min-height: 28px; }
  .pr-status { min-height: 1.6em; font-weight: 700; color: var(--c-text-dim); text-align: center; font-size: var(--fs-sm); }
  /* a table of cards is a physical thing: it is not mirrored in Persian */
  .pr-board {
    direction: ltr; display: grid; gap: var(--pr-gap, 8px);
    grid-template-columns: repeat(var(--cols, 4), 1fr); grid-template-rows: repeat(var(--rows, 4), 1fr);
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .pr-card { position: relative; padding: 0; border: 0; background: none; cursor: pointer; perspective: 600px; min-width: 0; min-height: 0; }
  .pr-in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 320ms var(--ease); }
  .pr-card--up .pr-in, .pr-card--found .pr-in { transform: rotateY(180deg); }
  .pr-still .pr-in { transition: none; }
  .pr-face, .pr-back { position: absolute; inset: 0; border-radius: 12%; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 2px 5px var(--pr-shadow); }
  .pr-back {
    background:
      radial-gradient(circle at 50% 50%, var(--pr-back-2) 0 14%, transparent 15%),
      repeating-linear-gradient(45deg, rgba(255, 255, 255, .12) 0 6%, transparent 6% 12%),
      repeating-linear-gradient(-45deg, rgba(255, 255, 255, .12) 0 6%, transparent 6% 12%),
      var(--pr-back);
    border: 3px solid rgba(255, 255, 255, .55); box-sizing: border-box;
  }
  .pr-face { background: var(--pr-face); border: 2px solid var(--pr-edge); box-sizing: border-box; transform: rotateY(180deg); display: grid; place-items: center; }
  .pr-face svg { width: 74%; height: 74%; }
  .pr-card--found .pr-face { box-shadow: 0 0 0 3px var(--game), 0 2px 5px var(--pr-shadow); }
  /* a found pair pops once (#407) */
  .pr-card--pop .pr-in { animation: pr-pop 360ms var(--ease); }
  @keyframes pr-pop { 0% { transform: rotateY(180deg) scale(1); } 45% { transform: rotateY(180deg) scale(1.12); } 100% { transform: rotateY(180deg) scale(1); } }
  .pr-card--cur { outline: 3px solid var(--c-accent); outline-offset: 3px; border-radius: 12%; }
  /* the keyboard cursor above is the only ring: the browser's focus ring stayed on the
     card last clicked while the cursor moved on, and two cards were ringed (#490) */
  .pr-card:focus, .pr-card:focus-visible { outline: none; }
  .pr-sizes .ch-seg { flex-wrap: nowrap; }
</style>

<script>
/* ==== ENGINE START ==== */
function PairsEngineFactory() {
  'use strict';

  // Board sizes by number of cards: [columns, rows]
  var SIZES = { 16: [4, 4], 24: [4, 6], 36: [6, 6] };
  var ORDER = [16, 24, 36], DAILY_SIZE = 24, SYMBOLS = 18;

  function shuffle(a, rnd) {
    for (var j = a.length - 1; j > 0; j--) { var k = Math.floor(rnd() * (j + 1)), t = a[j]; a[j] = a[k]; a[k] = t; }
    return a;
  }

  // S: cards — the symbol on each place, every symbol exactly twice; found — places
  // already paired; open — places face up and not yet paired (none, one, or the two of
  // a miss until the next tap); seen — places that have ever been face up; moves — pairs tried.
  function make(n, rnd) {
    if (!SIZES[n]) n = 16;
    var pick = shuffle(Array.from({ length: SYMBOLS }, function (_, i) { return i; }), rnd).slice(0, n / 2);
    var cards = shuffle(pick.concat(pick), rnd);
    return { n: n, cols: SIZES[n][0], rows: SIZES[n][1], cards: cards, found: cards.map(function () { return false; }),
      open: [], seen: cards.map(function () { return false; }), moves: 0, misses: 0, done: false };
  }

  // A miss stays face up until the next tap, so the player can look at both cards
  function settle(S) { if (S.open.length === 2) S.open = []; }

  // Turn over the card at i. Returns 'first', 'match', 'miss', 'won' or null (no change).
  // A miss counts as a "slip" when one of the two cards had been seen before and its
  // partner was already known too: the player could have paired it.
  function flip(S, i) {
    if (S.done || i < 0 || i >= S.cards.length || S.found[i] || S.open.indexOf(i) >= 0) return null;
    settle(S);
    var knewPair = false;
    if (S.open.length === 1) {
      var a = S.open[0];
      // was the partner of the first card already known when the second was chosen?
      for (var j = 0; j < S.cards.length; j++) if (j !== a && S.seen[j] && !S.found[j] && S.cards[j] === S.cards[a]) knewPair = true;
    }
    S.open.push(i);
    S.seen[i] = true;
    if (S.open.length === 1) return 'first';
    S.moves++;
    var x = S.open[0], y = S.open[1];
    if (S.cards[x] === S.cards[y]) {
      S.found[x] = S.found[y] = true;
      S.open = [];
      if (S.found.every(Boolean)) { S.done = true; return 'won'; }
      return 'match';
    }
    if (knewPair) S.misses++;
    return 'miss';
  }

  function pairsLeft(S) { var n = 0; for (var i = 0; i < S.found.length; i++) if (!S.found[i]) n++; return n / 2; }

  // The yardstick for a sharp game: a perfect memory needs about 1.6 moves a pair on
  // average (it sees every card once and pairs each as soon as it knows both), so
  // 1.5 a pair takes a good memory and a little luck.
  function perfect(n) { return Math.ceil(n / 2 * 1.5); }

  function restore(v) {
    if (!v || !SIZES[v.n] || !Array.isArray(v.cards) || v.cards.length !== v.n || !Array.isArray(v.found) || v.found.length !== v.n) return null;
    var count = {};
    for (var i = 0; i < v.n; i++) {
      var c = v.cards[i];
      if (typeof c !== 'number' || c < 0 || c >= SYMBOLS || c % 1) return null;
      count[c] = (count[c] || 0) + 1;
    }
    for (var k in count) if (count[k] !== 2) return null;
    // a pair is found as a whole or not at all
    for (var f = 0; f < v.n; f++) {
      var mate = v.cards.indexOf(v.cards[f]) === f ? v.cards.lastIndexOf(v.cards[f]) : v.cards.indexOf(v.cards[f]);
      if (!!v.found[f] !== !!v.found[mate]) return null;
    }
    var S = { n: v.n, cols: SIZES[v.n][0], rows: SIZES[v.n][1], cards: v.cards.slice(), found: v.found.map(Boolean),
      open: [], seen: Array.isArray(v.seen) && v.seen.length === v.n ? v.seen.map(Boolean) : v.found.map(Boolean),
      moves: v.moves >= 0 ? v.moves | 0 : 0, misses: v.misses >= 0 ? v.misses | 0 : 0, done: false };
    S.done = S.found.every(Boolean);
    return S;
  }

  return { SIZES: SIZES, ORDER: ORDER, DAILY_SIZE: DAILY_SIZE, SYMBOLS: SYMBOLS, make: make, flip: flip, settle: settle,
    pairsLeft: pairsLeft, perfect: perfect, restore: restore };
}
if (typeof module !== 'undefined' && module.exports) module.exports = PairsEngineFactory;
/* ==== ENGINE END ==== */
</script>

  var dailyDate = params.get('daily');
  var MISS_MS = 900, WIN_MS = 700;

  var prefs = ctx.store.get('prefs', null);
  if (!prefs || !E.SIZES[prefs.size]) prefs = { size: 16 };

  var S = null, nodes = [], busy = false, cur = -1, missTimer = null;
  var startedAt = Date.now(), pausedAt = 0;

  var top = el('div', { class: 'pr-top ch-above' });
  var board = el('div', { class: 'pr-board', role: 'group', 'aria-label': C.t('board') });
  var fit = el('div', { class: 'ch-fit' }, [board]);
  var status = el('div', { class: 'pr-status', 'aria-live': 'polite' });
  var wrap = el('div', { class: 'pr-wrap ch-split' }, [fit, el('div', { class: 'ch-side' }, [top, status])]);

  ctx.stat('moves', C.t('moves'));
  ctx.button({ icon: 'help', label: C.t('help'), onClick: showHelp });
  var newBtn = ctx.button({ icon: 'refresh', label: C.t('newDeal'), onClick: askNew });
  if (dailyDate) newBtn.classList.add('ch-hidden');
  ctx.main.appendChild(wrap);
  ctx.mount();

  /* --------------------------------------------------------- drawing */

  function sizeLabel(n) { var s = E.SIZES[n]; return C.num(s[0]) + '×' + C.num(s[1]); }

  function renderTop() {
    top.innerHTML = '';
    if (dailyDate) { top.appendChild(el('span', { class: 'ch-badge ch-badge--accent' }, [C.icon('calendar', 14), el('span', { text: C.t('dailyPr') + ' — ' + C.num(dailyDate) })])); return; }
    var seg = C.ui.segmented(E.ORDER.map(function (n) { return { value: n, label: sizeLabel(n) }; }), S.n, function (v) {
      if (v === S.n) return;
      var go = function () { prefs.size = v; ctx.store.set('prefs', prefs); newGame(v); };
      // a table already worked on is not thrown away without asking
      if (S.moves > 0 && !S.done) {
        C.ui.confirm({ title: C.t('newDeal'), body: C.t('resetWarn'), onOk: go, onCancel: renderTop });
        renderTop();
        return;
      }
      go();
    });
    top.appendChild(el('div', { class: 'pr-sizes' }, [seg]));
  }

  // One button per card, kept for the whole game, so a flip is a class change the browser animates
  function build() {
    board.innerHTML = '';
    nodes = [];
    board.style.setProperty('--cols', S.cols);
    board.style.setProperty('--rows', S.rows);
    fit.style.setProperty('--fit-ar', S.cols / S.rows);
    board.style.aspectRatio = S.cols + ' / ' + S.rows;
    board.classList.add('pr-still');
    for (var i = 0; i < S.n; i++) {
      var b = el('button', { class: 'pr-card', type: 'button', tabindex: '-1' }, [
        el('div', { class: 'pr-in' }, [el('div', { class: 'pr-back' }), el('div', { class: 'pr-face', html: art(S.cards[i]) })])
      ]);
      b._i = i;
      nodes.push(b);
      board.appendChild(b);
    }
    render();
    requestAnimationFrame(function () { requestAnimationFrame(function () { board.classList.remove('pr-still'); }); });
  }

  function render() {
    for (var i = 0; i < nodes.length; i++) {
      var b = nodes[i], up = S.open.indexOf(i) >= 0, f = S.found[i];
      b.classList.toggle('pr-card--up', up);
      b.classList.toggle('pr-card--found', f);
      b.classList.toggle('pr-card--cur', i === cur);
      var name = C.t('s' + S.cards[i]);
      b.setAttribute('aria-label', f ? C.t('cardFound', { s: name }) : up ? C.t('cardUp', { s: name }) : C.t('cardDown'));
    }
    var gap = Math.max(4, Math.round(board.clientWidth / S.cols * 0.08));
    board.style.setProperty('--pr-gap', gap + 'px');
    ctx.setStat('moves', C.num(S.moves));
    var best = !dailyDate && C.stats.getBest('pairs', 'moves' + S.n);
    status.textContent = S.done ? C.t('allPairs') : C.t('pairsLeftN', { n: C.num(E.pairsLeft(S)) }) + (best ? ' · ' + C.t('fewestN', { n: C.num(best) }) : '');
  }

  /* ------------------------------------------------------------ moves */

  function tap(i) {
    if (!S || S.done || busy) return;
    clearTimeout(missTimer);
    var r = E.flip(S, i);
    if (!r) { C.feedback('bad'); return; }
    C.audio.sfx('flip');
    if (r === 'match' || r === 'won') {
      var pair = nodes.filter(function (b) { return S.cards[b._i] === S.cards[i]; });
      // the pop waits for the second card to finish turning
      setTimeout(function () {
        C.audio.sfx('pop');
        C.haptic('tap');
        pair.forEach(function (b) { b.classList.remove('pr-card--pop'); void b.offsetWidth; b.classList.add('pr-card--pop'); C.ui.burst(b); });
      }, C.ui.reduceMotion() ? 0 : 300);
      ctx.setStat('moves', C.num(S.moves), true);
    } else if (r === 'miss') {
      ctx.setStat('moves', C.num(S.moves), true);
      // the two stay up long enough to be seen, or until the next tap
      missTimer = setTimeout(function () { E.settle(S); render(); }, MISS_MS);
    }
    render();
    if (r === 'won') { won(); return; }
    save();
  }

  function won() {
    busy = true;
    cur = -1;
    save();
    render();
    C.feedback('good');
    setTimeout(finish, C.ui.reduceMotion() ? 0 : WIN_MS);
  }

  function finish() {
    var elapsed = (pausedAt || Date.now()) - startedAt, n = S.n;
    var base = n === 16 ? 6 : n === 24 ? 10 : 16;
    var coins = base, points = base * 4, note = null;
    var sharp = S.moves <= E.perfect(n);
    C.achievements.unlock('pr-win');
    if (n === 36) C.achievements.unlock('pr-big');
    if (sharp) C.achievements.unlock('pr-sharp');
    if (sharp) coins += 3;
    if (S.daily) {
      coins += 8; points += 25;
      if (!C.stats.daily('pairs', S.daily, { label: C.t('movesN', { n: C.num(S.moves) }), moves: S.moves, ms: elapsed })) {
        coins = Math.round(coins * 0.2); points = Math.round(points * 0.2);
      }
    } else if (C.stats.best('pairs', 'moves' + n, S.moves, true)) {
      note = C.t('fewestN', { n: C.num(S.moves) });
    }
    var shot = { cols: S.cols, rows: S.rows, cards: S.cards.slice() };
    ctx.clearSave();
    ctx.finish({
      won: true, title: C.t('allPairs'), note: note, timeMs: elapsed, coins: coins, points: points,
      lines: [
        S.daily ? { label: C.t('daily'), value: C.num(S.daily) } : { label: C.t('size'), value: sizeLabel(n) },
        { label: C.t('moves'), value: C.num(S.moves) },
        { label: C.t('slips'), value: C.num(S.misses) },
        { label: C.t('time'), value: C.time(elapsed) }
      ],
      shareText: 'چوگان · جفت‌ها' + (S.daily ? ('\nروزانه ' + S.daily) : ('\n' + sizeLabel(n))) + '\n' + C.t('movesN', { n: C.num(S.moves) }),
      paint: cardPaint(shot),
      againLabel: S.daily ? null : C.t('newDeal'),
      onAgain: S.daily ? null : function () { newGame(n); }
    });
  }

  /* ------------------------------------------------------- share card */

  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#999'; }
  // The card shows the whole table face up, every pair found
  function cardPaint(shot) {
    var imgs = ART.map(function (a) {
      var im = new Image();
      im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g fill="' + a[0] + '">' + a[1] + '</g></svg>');
      return im;
    });
    return function (g, w, h) {
      var cell = Math.min(w / shot.cols, h / shot.rows), ox = (w - cell * shot.cols) / 2, oy = (h - cell * shot.rows) / 2, gap = cell * 0.08, sz = cell - gap;
      for (var i = 0; i < shot.cards.length; i++) {
        var x = ox + (i % shot.cols) * cell + gap / 2, y = oy + Math.floor(i / shot.cols) * cell + gap / 2;
        g.fillStyle = cssVar('--pr-face');
        C.rrect(g, x, y, sz, sz, sz * 0.12);
        g.fill();
        var im = imgs[shot.cards[i]];
        if (im.complete && im.naturalWidth) g.drawImage(im, x + sz * 0.13, y + sz * 0.13, sz * 0.74, sz * 0.74);
      }
    };
  }

  /* ---------------------------------------------------------- saving */

  ctx.autosave(function () {
    if (!S || S.done || busy || S.moves === 0) return { inProgress: false };
    return { s: { n: S.n, cards: S.cards, found: S.found, seen: S.seen, moves: S.moves, misses: S.misses }, daily: S.daily || null, elapsed: (pausedAt || Date.now()) - startedAt };
  });
  function save() { ctx.save(); }

  function newGame(n, daily) {
    clearTimeout(missTimer);
    S = E.make(n, daily ? C.daily('pairs', daily).rng : Math.random);
    S.daily = daily || null;
    startedAt = Date.now();
    pausedAt = 0;
    busy = false; cur = -1;
    renderTop();
    build();
    save();
  }

  function askNew() {
    if (!S || busy || S.daily) return;
    if (S.done || S.moves === 0) { newGame(S.n); return; }
    C.ui.confirm({ title: C.t('newDeal'), body: C.t('resetWarn'), onOk: function () { newGame(S.n); } });
  }

  /* ------------------------------------------------------------ help */

  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [
          kb('← ↑ → ↓', C.t('keysMove')),
          kb('Enter / Space', C.t('keysFlip')),
          kb('R', C.t('newDeal'))
        ])
      ],
      actions: [
        { label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } },
        { label: C.t('done'), kind: 'primary' }
      ]
    });
  }
  function kb(k, what) {
    return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]);
  }

  // Tutorial art: four small cards, drawn with the board's own colours and pictures
  function tCard(x, sym) {
    if (sym < 0) return '<rect x="' + x + '" y="20" width="36" height="36" rx="5" fill="var(--pr-back)" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>';
    var a = ART[sym];
    return '<rect x="' + x + '" y="20" width="36" height="36" rx="5" fill="var(--pr-face)" stroke="var(--pr-edge)" stroke-width="1.5"/>' +
      '<g transform="translate(' + (x + 5) + ' 25) scale(.26)" fill="' + a[0] + '">' + a[1] + '</g>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: '<svg viewBox="0 0 200 76" width="100%" direction="ltr">' + tCard(16, 5) + tCard(60, -1) + tCard(104, 5) + tCard(148, -1) + '</svg>' },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: '<svg viewBox="0 0 200 76" width="100%" direction="ltr">' + tCard(16, 2) + tCard(60, -1) + tCard(104, 9) + tCard(148, -1) + '</svg>' }
  ];

  /* ------------------------------------------------------------ input */

  // a click doesn't move the browser's focus onto a card; the arrow keys go on from the
  // card last clicked instead of starting again at the first
  var lastTapped = -1;
  board.addEventListener('mousedown', function (e) { if (e.target.closest && e.target.closest('.pr-card')) e.preventDefault(); });
  board.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.pr-card') : null;
    if (!b) return;
    cur = -1;
    lastTapped = b._i;
    tap(b._i);
  });
  board.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  window.addEventListener('keydown', function (e) {
    if (!S || S.done || busy) return;
    if (document.querySelector('.ch-scrim')) return;
    var tg = e.target, tag = tg && tg.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (tg && tg.isContentEditable)) return;
    if (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter') && !tg.classList.contains('pr-card')) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key;
    if (C.keyIs(e, 'r')) { askNew(); e.preventDefault(); return; }
    // the table is not mirrored, so the arrows are geometric in every language
    var d = { ArrowUp: -S.cols, ArrowDown: S.cols, ArrowLeft: -1, ArrowRight: 1 }[k];
    if (d !== undefined) {
      if (cur < 0) cur = lastTapped >= 0 ? lastTapped : 0;
      else {
        var c = cur % S.cols, nx = cur + d;
        if ((k === 'ArrowLeft' && c === 0) || (k === 'ArrowRight' && c === S.cols - 1) || nx < 0 || nx >= S.n) nx = cur;
        cur = nx;
      }
      render();
      e.preventDefault();
      return;
    }
    if ((k === 'Enter' || k === ' ') && cur >= 0) { tap(cur); e.preventDefault(); }
  });

  // time in the background is not time spent on the table
  C.onPause(function () { if (!pausedAt) pausedAt = Date.now(); });
  C.onResume(function () {
    if (pausedAt) startedAt += Date.now() - pausedAt;
    pausedAt = 0;
  });
  if (window.ResizeObserver) new ResizeObserver(function () { if (S) render(); }).observe(board);

  /* ------------------------------------------------------------ start */

  var saved = ctx.loadSave();
  // a save that fails its checks is dropped and a fresh table is dealt
  var resume = saved && saved.s && (saved.daily || null) === (dailyDate || null) ? E.restore(saved.s) : null;
  if (resume && !resume.done) {
    S = resume;
    S.daily = saved.daily || null;
    startedAt = Date.now() - (saved.elapsed || 0);
    renderTop();
    build();
  } else if (dailyDate) {
    newGame(E.DAILY_SIZE, dailyDate);
    if (C.stats.dailyDone('pairs', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).pairs;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
    }
  } else {
    newGame(prefs.size);
  }
  ctx.tutorialIfNew(TUT);
})();
</script>
</body>
</html>
