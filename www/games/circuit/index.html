<!doctype html>

  .ci-wrap > .ch-fit { --fit-ar: calc(240 / 320); }
  .ch-fit > .ci-box { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
  .ci-canvas { display: block; touch-action: none; border-radius: var(--r-lg); direction: ltr; user-select: none; -webkit-user-select: none; image-rendering: pixelated; }
  .ci-top { display: flex; justify-content: center; align-items: center; gap: var(--s-2); flex-wrap: wrap; }
  .ci-status { min-height: 1.6em; font-weight: 700; color: var(--c-text-dim); text-align: center; font-size: var(--fs-sm); }
  .ci-label { font-weight: 700; font-size: var(--fs-sm); color: var(--c-text-dim); }
</style>

<body>
<script src="../../version.js"></script>
<script src="../../lib/chogan.js"></script>
<script>
/* ==== ENGINE START ==== */
function CircuitEngineFactory() {
  'use strict';

  // The world is 240 × 320 units, one pixel of the retro picture each. A track is a
  // closed centre line sampled every SP units; the road reaches HW to either side,
  // grass VERGE further, and then a tyre wall that no car passes.
  var VW = 240, VH = 320, DT = 1 / 60, SP = 3;
  var HW = 13, VERGE = 7, WALL = HW + VERGE, EDGE = 22;
  // a car's top speed, grip and pace. Steering scrubs speed (SCRUB at full lock), so a
  // full-lock turn is VMAX·(1-SCRUB)/TURN ≈ 23 wide; the tightest bend a track may have
  // (RMIN) is wider than that, so auto gas never forces a brake
  var VMAX = 95, ACC = 70, BRAKE = 150, GRASS = 0.5, GRASS_DRAG = 130, TURN = 2.9, SCRUB = 0.3, RMIN = 30, STEER_RATE = 5;
  var CR = 4.5, LAPS = 4, GO = 150, CARS = 4;
  // the bots' pace at each level, one value a car (slowest first)
  var PACE = { easy: [0.68, 0.72, 0.76], medium: [0.8, 0.84, 0.88], hard: [0.9, 0.93, 0.96] };
  var LANES = [-7, 0, 7];

  function mulberry(sd) {
    var a = sd >>> 0;
    return function () { a = (a + 0x6D2B79F5) >>> 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function wrapAng(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }

  // The hand-made tracks: the corners of a polygon, each [x, y, radius of its bend]
  var TRACKS = [
    { id: 'oval', ctrl: [[40, 40, 70], [200, 40, 70], [200, 280, 70], [40, 280, 70]] },
    { id: 'kidney', ctrl: [[35, 35, 50], [205, 35, 50], [205, 110, 40], [165, 160, 36], [205, 210, 40], [205, 285, 50], [35, 285, 50]] },
    { id: 'hook', ctrl: [[35, 35, 45], [205, 35, 45], [205, 135, 36], [105, 135, 34], [105, 215, 34], [205, 215, 34], [205, 295, 34], [35, 295, 45]] },
    { id: 'zigzag', ctrl: [[30, 30, 34], [125, 30, 34], [125, 105, 34], [210, 105, 34], [210, 295, 40], [120, 295, 34], [120, 210, 34], [30, 210, 34]] }
  ];

  // Straight edges between the corners, each corner rounded into an arc of its radius
  // (a fillet); null when two corners are too close for their arcs to fit
  function rounded(ctrl) {
    var n = ctrl.length, dense = [], i, j, arcs = [];
    for (i = 0; i < n; i++) {
      var P = ctrl[(i - 1 + n) % n], V = ctrl[i], Q = ctrl[(i + 1) % n], r = V[2] || 40;
      var ux = V[0] - P[0], uy = V[1] - P[1], ul = Math.hypot(ux, uy), wx = Q[0] - V[0], wy = Q[1] - V[1], wl = Math.hypot(wx, wy);
      if (ul < 1e-6 || wl < 1e-6) return null;
      ux /= ul; uy /= ul; wx /= wl; wy /= wl;
      var phi = Math.atan2(ux * wy - uy * wx, ux * wx + uy * wy), t = r * Math.tan(Math.abs(phi) / 2);
      var side = phi >= 0 ? 1 : -1, cx = V[0] - ux * t - uy * r * side, cy = V[1] - uy * t + ux * r * side;
      arcs.push({ t: t, ul: ul, cx: cx, cy: cy, r: r, a0: Math.atan2(V[1] - uy * t - cy, V[0] - ux * t - cx), phi: phi });
    }
    for (i = 0; i < n; i++) {
      // the two arcs at the ends of an edge must both fit on it
      if (arcs[i].t + arcs[(i - 1 + n) % n].t > arcs[i].ul - 4) return null;
      var A = arcs[i], steps = Math.max(2, Math.ceil(Math.abs(A.phi) * A.r / 1.5));
      for (j = 0; j <= steps; j++) {
        var a = A.a0 + A.phi * j / steps;
        dense.push([A.cx + Math.cos(a) * A.r, A.cy + Math.sin(a) * A.r]);
      }
    }
    return dense;
  }

  // The closed line through the rounded corners, resampled every SP units
  function build(ctrl) {
    var dense = rounded(ctrl), i, j;
    if (!dense) return { bad: true, check: { ok: false, minR: 0, minSep: 0, inside: false } };
    // cumulative length round the dense loop, then even samples along it
    var cum = [0], m = dense.length;
    for (i = 1; i <= m; i++) { var a = dense[i - 1], b = dense[i % m]; cum.push(cum[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1])); }
    var total = cum[m], N = Math.round(total / SP), step = total / N, pts = [], k = 0;
    for (i = 0; i < N; i++) {
      var want = i * step;
      while (cum[k + 1] < want) k++;
      var f = (want - cum[k]) / Math.max(1e-9, cum[k + 1] - cum[k]), A = dense[k], B = dense[(k + 1) % m];
      pts.push({ x: A[0] + (B[0] - A[0]) * f, y: A[1] + (B[1] - A[1]) * f });
    }
    for (i = 0; i < N; i++) {
      var nx = pts[(i + 1) % N], pv = pts[(i - 1 + N) % N];
      pts[i].ang = Math.atan2(nx.y - pv.y, nx.x - pv.x);
    }
    // the line sits on the straightest stretch, so the grid never starts in a bend
    var bestI = 0, bestC = Infinity;
    for (i = 0; i < N; i++) {
      var c = 0;
      for (j = -8; j <= 8; j++) c += Math.abs(wrapAng(pts[(i + j + 1 + N) % N].ang - pts[(i + j + N) % N].ang));
      if (c < bestC - 1e-9) { bestC = c; bestI = i; }
    }
    pts = pts.slice(bestI).concat(pts.slice(0, bestI));
    for (i = 0; i < N; i++) pts[i].s = i * step;
    var T = { pts: pts, n: N, L: total, step: step };
    T.check = check(T);
    return T;
  }

  // Can a car drive it? Every bend wider than RMIN, other parts of the track never
  // closer than two walls apart, the walls inside the picture and a sensible length.
  function check(T) {
    var p = T.pts, N = T.n, i, j, minR = Infinity, minSep = Infinity, inside = true;
    for (i = 0; i < N; i++) {
      // the turn over five samples, so one noisy sample does not count as a corner
      var da = Math.abs(wrapAng(p[(i + 5) % N].ang - p[i].ang));
      if (da > 1e-6) minR = Math.min(minR, 5 * T.step / da);
      if (p[i].x < EDGE || p[i].x > VW - EDGE || p[i].y < EDGE || p[i].y > VH - EDGE) inside = false;
    }
    var far = Math.ceil(80 / T.step);
    for (i = 0; i < N; i++) for (j = i + far; j < N; j++) {
      if (N - (j - i) < far) continue;
      minSep = Math.min(minSep, Math.hypot(p[i].x - p[j].x, p[i].y - p[j].y));
    }
    return { minR: minR, minSep: minSep, inside: inside, ok: minR >= RMIN && minSep >= 2 * WALL + 6 && inside && T.L >= 450 && T.L <= 1100 };
  }

  // The daily track: a loose star of control points round the middle, redrawn until
  // it passes check(); the day's numbers decide it, the same for everyone
  function generate(rnd) {
    for (var tries = 0; tries < 400; tries++) {
      var K = 5 + Math.floor(rnd() * 4), ctrl = [], off = rnd() * Math.PI * 2;
      for (var i = 0; i < K; i++) {
        var a = off + (i + (rnd() - 0.5) * 0.6) * 2 * Math.PI / K, r = 0.45 + 0.6 * rnd();
        ctrl.push([Math.round(120 + Math.cos(a) * 92 * Math.min(1, r)), Math.round(160 + Math.sin(a) * 130 * Math.min(1, r)), 32 + Math.floor(rnd() * 24)]);
      }
      if (rnd() < 0.5) ctrl.reverse();
      var T = build(ctrl);
      if (T.check.ok) { T.ctrl = ctrl; T.tries = tries + 1; return T; }
    }
    return null;
  }

  /* ------------------------------------------------------------ the race */

  // nearest sample to (x, y) looking round index i (or the whole loop)
  function nearest(T, x, y, i, span) {
    var best = i, bd = Infinity, N = T.n, from = span ? i - span : 0, to = span ? i + span : N - 1;
    for (var j = from; j <= to; j++) {
      var k = ((j % N) + N) % N, p = T.pts[k], d = (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y);
      if (d < bd) { bd = d; best = k; }
    }
    return best;
  }
  // signed distance from the centre line (left of the way round is negative)
  function lateral(T, i, x, y) {
    var p = T.pts[i];
    return -Math.sin(p.ang) * (x - p.x) + Math.cos(p.ang) * (y - p.y);
  }
  function along(T, i, x, y) {
    var p = T.pts[i];
    return Math.cos(p.ang) * (x - p.x) + Math.sin(p.ang) * (y - p.y);
  }
  // a point at arc length s and lateral offset d
  function at(T, s, d) {
    var L = T.L, ss = ((s % L) + L) % L, i = Math.floor(ss / T.step) % T.n, p = T.pts[i], q = T.pts[(i + 1) % T.n], f = (ss - p.s) / T.step;
    var x = p.x + (q.x - p.x) * f, y = p.y + (q.y - p.y) * f, a = p.ang + wrapAng(q.ang - p.ang) * f;
    return { x: x - Math.sin(a) * d, y: y + Math.cos(a) * d, ang: a, i: i };
  }

  // A race: the player (car 0) starts at the back of a staggered grid behind the line
  function race(T, level) {
    var pace = PACE[level] || PACE.medium, cars = [];
    var grid = [[-12, 6], [-22, -6], [-32, 6], [-42, -6]];
    for (var c = 0; c < CARS; c++) {
      var g = grid[c === 0 ? 3 : c - 1], P = at(T, g[0], g[1]);
      cars.push({
        x: P.x, y: P.y, ang: P.ang, v: 0, st: 0, i: P.i, k: -1, d: g[1],
        pace: c === 0 ? 1 : pace[c - 1], lane: c === 0 ? 0 : LANES[c - 1],
        lapAt: 0, laps: [], best: 0, off: false, wall: 0, done: 0, place: 0
      });
    }
    return { T: T, level: PACE[level] ? level : 'medium', cars: cars, cd: GO, t: 0, over: false, finished: 0, ev: [] };
  }

  function progress(S, c) { return c.k * S.T.L + S.T.pts[c.i].s + along(S.T, c.i, c.x, c.y); }

  // How a bot drives: aim a little way ahead on its lane, step round a car in front
  function botInput(S, idx) {
    var T = S.T, c = S.cars[idx], me = progress(S, c), lane = c.lane;
    // a car that has finished pulls to the side of the road and stops; left to drive on, it
    // kept circling while the player was still racing (#764, the owner's first race)
    if (c.done) return { steer: drive(S, c, (c.d < 0 ? -1 : 1) * (HW - 4), 0).steer, brake: true };
    for (var o = 0; o < S.cars.length; o++) {
      if (o === idx) continue;
      var e = S.cars[o], gap = progress(S, e) - me;
      if (gap > 0 && gap < 32 && Math.abs(e.d - lane) < 9) {
        // pass on the side this car is already on, unless the road there is too narrow;
        // choosing by the sign of e.d made a car right behind dither from side to side
        var up = Math.min(9, e.d + 11), down = Math.max(-9, e.d - 11);
        lane = c.d >= e.d ? (up - e.d >= 9 ? up : down) : (e.d - down >= 9 ? down : up);
      }
    }
    return drive(S, c, lane, c.pace);
  }
  // steer toward a point on lane `lane` ahead; slow down only above pace
  function drive(S, c, lane, pace) {
    var T = S.T, ahead = Math.max(14, c.v * 0.3), P = at(T, T.pts[c.i].s + along(T, c.i, c.x, c.y) + ahead, lane);
    var diff = wrapAng(Math.atan2(P.y - c.y, P.x - c.x) - c.ang);
    return { steer: Math.max(-1, Math.min(1, diff * 3)), brake: c.v > VMAX * pace + 0.5 };
  }

  function emit(S, e) { S.ev.push(e); }

  function moveCar(S, idx, inp) {
    var T = S.T, c = S.cars[idx], cap = VMAX * (idx === 0 ? 1 : c.pace);
    var off = Math.abs(c.d) > HW;
    // the wheel turns toward the input over a fifth of a second, so a short tap on a
    // half of the screen is a small correction rather than a full-lock jerk
    var want = Math.max(-1, Math.min(1, inp.steer || 0)), ds = STEER_RATE * DT;
    c.st = want > c.st ? Math.min(want, c.st + ds) : Math.max(want, c.st - ds);
    var steer = c.st;
    cap *= 1 - SCRUB * Math.abs(steer);
    if (off) cap = Math.min(cap, VMAX * GRASS);
    if (inp.brake) c.v = Math.max(0, c.v - BRAKE * DT);
    else if (c.v < cap) c.v = Math.min(cap, c.v + ACC * DT);
    if (c.v > cap) c.v = Math.max(cap, c.v - (off ? GRASS_DRAG : ACC) * DT);
    c.ang = wrapAng(c.ang + steer * TURN * Math.min(1, c.v / 30) * DT);
    c.x += Math.cos(c.ang) * c.v * DT; c.y += Math.sin(c.ang) * c.v * DT;
    locate(S, c, idx);
  }

  // where a car is on the track: its sample, its lap, the grass and the wall
  function locate(S, c, idx) {
    var T = S.T, prev = c.i, i = nearest(T, c.x, c.y, c.i, 8), N = T.n;
    if (prev > N * 0.75 && i < N * 0.25) crossLine(S, c, idx, 1);
    else if (prev < N * 0.25 && i > N * 0.75) crossLine(S, c, idx, -1);
    c.i = i;
    c.d = lateral(T, i, c.x, c.y);
    if (Math.abs(c.d) > HW && S.cd === 0) c.off = true;
    if (Math.abs(c.d) > WALL) {
      // the tyre wall: back onto its face, and the car loses most of its speed
      var p = T.pts[i], d = c.d > 0 ? WALL : -WALL, a = along(T, i, c.x, c.y);
      c.x = p.x + Math.cos(p.ang) * a - Math.sin(p.ang) * d; c.y = p.y + Math.sin(p.ang) * a + Math.cos(p.ang) * d;
      c.d = d; c.v *= 0.55;
      if (S.t - c.wall > 20) emit(S, { t: 'wall', car: idx });
      c.wall = S.t;
    }
  }

  function crossLine(S, c, idx, dir) {
    c.k += dir;
    if (dir < 0 || c.done) return;
    if (c.k === 0) { c.lapAt = S.t; c.off = false; return; }
    // backing over the line and driving across it again is not a new lap: without this,
    // a wiggle on the line recorded a lap of a few ticks as the track's best
    if (c.k <= c.laps.length) return;
    var lt = S.t - c.lapAt;
    c.laps.push(lt); c.lapAt = S.t;
    var clean = !c.off; c.off = false;
    if (!c.best || lt < c.best) c.best = lt;
    if (c.k >= LAPS) {
      c.done = S.t; S.finished++; c.place = S.finished;
      emit(S, { t: 'finish', car: idx, place: c.place, time: S.t });
      if (idx === 0) { S.over = true; emit(S, { t: 'over', place: c.place }); }
    } else emit(S, { t: 'lap', car: idx, k: c.k, time: lt, clean: clean });
    if (idx === 0 && c.k >= LAPS) emit(S, { t: 'lap', car: 0, k: c.k, time: lt, clean: clean, last: true });
  }

  // two cars touching are pushed apart; the one behind loses a little speed
  function bump(S) {
    var cs = S.cars;
    for (var a = 0; a < cs.length; a++) for (var b = a + 1; b < cs.length; b++) {
      var A = cs[a], B = cs[b], dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy);
      if (d >= 2 * CR) continue;
      if (d < 1e-6) { dx = 1; dy = 0; d = 1; }
      var push = (2 * CR - d) / 2, ux = dx / d, uy = dy / d;
      A.x -= ux * push; A.y -= uy * push; B.x += ux * push; B.y += uy * push;
      // nose to tail, the car behind drops to the speed of the one ahead; side by side
      // they are only pushed apart, or a car alongside could never pull clear to pass
      var dir = S.T.pts[A.i].ang, lon = Math.abs(Math.cos(dir) * ux + Math.sin(dir) * uy);
      if (lon > 0.7) {
        var front = progress(S, A) < progress(S, B) ? B : A, back = front === A ? B : A;
        back.v = Math.min(back.v, front.v * 0.95);
      }
      locate(S, A, a); locate(S, B, b);
      if (a === 0 || b === 0) emit(S, { t: 'bump' });
    }
  }

  // One fixed step. inp: the player's { steer: -1..1, brake: bool }
  function step(S, inp) {
    if (S.over) return;
    if (S.cd > 0) {
      S.cd--;
      if (S.cd % 50 === 0) emit(S, { t: S.cd === 0 ? 'go' : 'count', n: S.cd / 50 });
      return;
    }
    S.t++;
    moveCar(S, 0, inp || {});
    for (var c = 1; c < S.cars.length; c++) moveCar(S, c, botInput(S, c));
    bump(S);
  }

  // where everyone stands: finishers in order, then by distance covered
  function order(S) {
    var idx = S.cars.map(function (c, i) { return i; });
    return idx.sort(function (a, b) {
      var A = S.cars[a], B = S.cars[b];
      if (A.done && B.done) return A.place - B.place;
      if (A.done || B.done) return A.done ? -1 : 1;
      return progress(S, B) - progress(S, A);
    });
  }
  function placeOf(S, idx) { return order(S).indexOf(idx) + 1; }

  function drain(S) { var e = S.ev; S.ev = []; return e; }

  var CKEYS = ['x', 'y', 'ang', 'v', 'st', 'i', 'k', 'd', 'pace', 'lane', 'lapAt', 'best', 'wall', 'done', 'place'];
  function snapshot(S) {
    return {
      level: S.level, cd: S.cd, t: S.t, over: S.over, finished: S.finished,
      cars: S.cars.map(function (c) { var o = { laps: c.laps.slice(), off: c.off }; CKEYS.forEach(function (k) { o[k] = c[k]; }); return o; })
    };
  }
  function restore(o, T) {
    if (!o || !T || !PACE[o.level] || !Array.isArray(o.cars) || o.cars.length !== CARS) return null;
    if (!['cd', 't', 'finished'].every(function (k) { return typeof o[k] === 'number' && isFinite(o[k]) && o[k] >= 0; })) return null;
    for (var c = 0; c < CARS; c++) {
      var q = o.cars[c];
      if (!q || !Array.isArray(q.laps) || !CKEYS.every(function (k) { return typeof q[k] === 'number' && isFinite(q[k]); })) return null;
      if (q.i < 0 || q.i >= T.n || q.k < -1 || q.k > LAPS) return null;
    }
    var S = race(T, o.level);
    S.cd = o.cd; S.t = o.t; S.over = !!o.over; S.finished = o.finished;
    S.cars = o.cars.map(function (q) { var c = { laps: q.laps.slice(), off: !!q.off }; CKEYS.forEach(function (k) { c[k] = q[k]; }); return c; });
    return S;
  }

  // what is under a point: 'road', 'kerb', 'grass', 'wall' or 'out', plus the nearest
  // sample, for drawing the track once
  function surface(T, x, y) {
    var i = nearest(T, x, y, 0, 0), d = Math.abs(lateral(T, i, x, y));
    var p = T.pts[i], dist = Math.hypot(p.x - x, p.y - y);
    if (dist > d + T.step) d = dist;
    var kind = d <= HW - 2.5 ? 'road' : d <= HW ? 'kerb' : d <= WALL ? 'grass' : d <= WALL + 3 ? 'wall' : 'out';
    return { kind: kind, i: i, d: d, a: along(T, i, x, y) };
  }

  return {
    VW: VW, VH: VH, DT: DT, SP: SP, HW: HW, VERGE: VERGE, WALL: WALL, VMAX: VMAX, TURN: TURN, RMIN: RMIN,
    CR: CR, LAPS: LAPS, GO: GO, CARS: CARS, PACE: PACE, TRACKS: TRACKS,
    mulberry: mulberry, build: build, check: check, generate: generate, race: race, step: step,
    drive: drive, botInput: botInput, progress: progress, order: order, placeOf: placeOf,
    drain: drain, snapshot: snapshot, restore: restore, surface: surface, at: at, nearest: nearest, lateral: lateral
  };
}
if (typeof module !== 'undefined' && module.exports) module.exports = CircuitEngineFactory;
/* ==== ENGINE END ==== */
</script>
<script>
(function () {
  'use strict';
  var C = window.Chogan, el = C.el;
  var E = CircuitEngineFactory();
  var VW = E.VW, VH = E.VH, ACCENT = '#BE004B';
  var LEVELS = ['easy', 'medium', 'hard'];
  var TRACK_KEYS = { oval: 'trkOval', kidney: 'trkKidney', hook: 'trkHook', zigzag: 'trkZigzag' };

  C.boot({});
  var ctx = C.game({
    id: 'circuit',
    name: { fa: 'پیست', en: 'Circuit', zh: '赛道', de: 'Rennstrecke', es: 'Circuito', pl: 'Tor', fr: 'Circuit', hi: 'सर्किट' },
    accent: ACCENT,
    mood: 'dots',

  var params = new URLSearchParams(location.search);
  var dailyDate = params.get('daily');

  var prefs = ctx.store.get('prefs', null);
  if (!prefs || typeof prefs !== 'object') prefs = { track: 'oval', level: 'medium' };
  if (!TRACK_KEYS[prefs.track]) prefs.track = 'oval';
  if (LEVELS.indexOf(prefs.level) < 0) prefs.level = 'medium';

  // the race: its track id ('daily' for the day's track), its level and the engine state
  var R = null, S = null, raf = 0, last = 0, acc = 0, paused = false, waiting = false, ended = false, tries = 0, startedAt = 0;
  var allClean = true, newBest = false, pop = null, goAt = 0, shownPlace = 0, lastBump = 0, flash = 0;
  var tracks = {};

  var cv = el('canvas', { class: 'ci-canvas', role: 'img', 'aria-label': C.t('scene') });
  var box = el('div', { class: 'ci-box' }, [cv]);
  var top = el('div', { class: 'ci-top ch-above' });
  var status = el('div', { class: 'ci-status', role: 'status', 'aria-live': 'polite' });
  var wrap = el('div', { class: 'ci-wrap ch-split' }, [el('div', { class: 'ch-fit' }, [box]), el('div', { class: 'ch-side' }, [top, status])]);

  ctx.button({ icon: 'help', label: C.t('help'), onClick: showHelp });
  // the track and difficulty live behind a gear, not only inside the new-race button (#764)
  ctx.button({ icon: 'gear', label: C.t('settings'), onClick: function () { settings(); } });
  ctx.button({ icon: 'refresh', label: C.t('newRace'), onClick: function () { askNew(); } });
  ctx.main.appendChild(wrap);
  ctx.mount();

  /* ------------------------------------------------------------ races */

  function trackOf(id) {
    if (tracks[id]) return tracks[id];
    var T = null;
    if (id === 'daily') T = E.generate(C.daily('circuit', dailyDate).rng);
    else for (var i = 0; i < E.TRACKS.length; i++) if (E.TRACKS[i].id === id) T = E.build(E.TRACKS[i].ctrl);
    // a day whose numbers never made a drivable track falls back to the oval
    if (!T || !T.check || !T.check.ok) T = E.build(E.TRACKS[0].ctrl);
    tracks[id] = T;
    return T;
  }
  function current() { return R && !R.daily ? { track: R.track, level: R.level } : { track: prefs.track, level: prefs.level }; }

  function newRace(o) {
    var daily = !!(o && o.daily);
    R = daily ? { track: 'daily', level: 'medium', daily: true } : { track: o.track, level: o.level, daily: false };
    if (!daily) { prefs.track = o.track; prefs.level = o.level; ctx.store.set('prefs', prefs); }
    S = E.race(trackOf(R.track), R.level);
    tries++;
    startedAt = Date.now();
    ended = false; waiting = false; last = 0; acc = 0;
    allClean = true; newBest = false; pop = null; goAt = 0; shownPlace = 0;
    ctx.clearSave();
    renderTop(); renderStatus();
    C.audio.sfx('tap');
    kick();
  }
  // New race restarts with the choice already made; picking another track or level is the gear's job
  function askNew() {
    var again = R && R.daily ? function () { newRace({ daily: true }); } : function () { newRace(current()); };
    if (!S || ended || S.t === 0) { again(); return; }
    C.ui.confirm({ title: C.t('newRace'), body: C.t('resetWarn'), onOk: again });
  }
  function settings() {
    var o = current(), body = el('div', { class: 'ch-col', style: { gap: 'var(--s-3)', 'align-items': 'center' } });
    body.appendChild(el('div', { class: 'ci-label', text: C.t('trackL') }));
    body.appendChild(C.ui.segmented(E.TRACKS.map(function (t) { return { value: t.id, label: C.t(TRACK_KEYS[t.id]) }; }), o.track, function (v) { o.track = v; }));
    body.appendChild(el('div', { class: 'ci-label', text: C.t('difficulty') }));
    body.appendChild(C.ui.segmented([{ value: 'easy', label: C.t('easy') }, { value: 'medium', label: C.t('medium') }, { value: 'hard', label: C.t('hard') }], o.level, function (v) { o.level = v; }));
    if (S && !ended && S.t > 0) body.appendChild(el('p', { class: 'ch-xs ch-dim', text: C.t('resetWarn') }));
    C.ui.modal({
      title: C.t('settings'), closeButton: true, body: [body],
      actions: [{ label: C.t('cancel') }, { label: C.t('start'), kind: 'primary', onClick: function () { newRace(o); } }]
    });
  }

      else if (e.t === 'wall' && e.car === 0) { C.feedback('thud'); flash = 1; }
      else if (e.t === 'bump') { if (S.t - lastBump > 30) { C.feedback('clack'); lastBump = S.t; } }
      else if (e.t === 'lap' && e.car === 0) {

        if (e.place === 1) C.audio.sfx('win');
        setTimeout(finish, C.ui.reduceMotion() ? 300 : 1300);
      }
    }
    if (ev.length) renderTop();
    if (save && !ended) ctx.save();
  }

  function finish() {
    var me = S.cars[0], place = me.place || E.placeOf(S, 0), won = place === 1;
    var coins = [30, 18, 10, 5][place - 1] || 5, points = [120, 80, 50, 25][place - 1] || 25;
    if (won) C.achievements.unlock('ci-win');
    if (won && R.level === 'hard' && !R.daily) C.achievements.unlock('ci-hard');
    if (allClean) C.achievements.unlock('ci-clean');
    var lines = [
      { label: C.t('placeL'), value: C.num(place) + ' / ' + C.num(E.CARS) },
      { label: C.t('raceTime'), value: secs(me.done) },
      { label: C.t('bestLapL'), value: secs(me.best) }
    ];
    if (R.daily) {
      if (won) C.achievements.unlock('ci-daily');
      if (!C.stats.daily('circuit', dailyDate, { label: C.t('placeN', { n: C.num(place), m: C.num(E.CARS) }) + ' · ' + secs(me.done), win: won, tries: tries })) { coins = Math.max(1, Math.round(coins * 0.2)); points = Math.max(1, Math.round(points * 0.2)); }
      lines.push({ label: C.t('tries'), value: C.num(tries) });
    } else {
      var rec = C.stats.getBest('circuit', bestKey());

    }
    ctx.finish({
      won: won,
      title: won ? C.t('youWon') : C.t('placeN', { n: C.num(place), m: C.num(E.CARS) }),
      note: newBest ? C.t('bestLap') : null, timeMs: Date.now() - startedAt, coins: coins, points: points,
      lines: lines,
      shareText: 'چوگان · پیست' + (R.daily ? ('\nروزانه ' + dailyDate) : '') + '\nنفر ' + place + ' · ' + (me.done * E.DT).toFixed(2),

  /* ----------------------------------------------------------------- ui */

  function renderTop() {

    else if (R) top.appendChild(el('span', { class: 'ch-badge ch-badge--accent', text: C.t(TRACK_KEYS[R.track]) + ' · ' + C.t(R.level) }));
    if (!S) return;
    var me = S.cars[0];
    top.appendChild(el('span', { class: 'ch-badge', text: C.t('lapN', { n: C.num(Math.min(E.LAPS, Math.max(1, me.k + 1))), m: C.num(E.LAPS) }) }));

  }

    } else {
      s += '<rect x="10" y="10" width="180" height="100" rx="8" fill="#72B456"/><rect x="20" y="20" width="160" height="80" rx="34" fill="none" stroke="#62626A" stroke-width="22"/>' +
        '<g>' + [0, 1, 2, 3].map(function (i) { return '<rect x="96" y="' + (89 + (i % 2) * 0) + '" width="4" height="4" fill="' + (i % 2 ? '#202020' : '#F6F6F6') + '" transform="translate(' + (i > 1 ? 4 : 0) + ',' + ((i % 2) * 4 + (i > 1 ? 0 : 0)) + ')"/>'; }).join('') + '</g>' +
        svgCar(70, 100, 0, ACCENT) + svgCar(130, 100, 0, '#2F6FD0') + svgCar(150, 20, 180, '#E8B820');
    }
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: tArt(1) },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: tArt(2) },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: tArt(3) }
  ];

  /* -------------------------------------------------------------- start */

  // A race in progress is saved after each of the player's laps and when the app goes
  // away; the daily race has its own slot
  ctx.autosave(function () {
    if (!S || S.over || ended || !R) return { inProgress: false };
    return { s: E.snapshot(S), track: R.track, level: R.level, daily: R.daily ? dailyDate : null, tries: tries, clean: allClean, elapsed: Date.now() - startedAt };
  });
  function resumeRace(sv) {
    var daily = !!sv.daily;
    if (!daily && !TRACK_KEYS[sv.track]) return false;
    var id = daily ? 'daily' : sv.track, X = E.restore(sv.s, trackOf(id));
    if (!X || X.over) return false;
    R = { track: id, level: X.level, daily: daily };
    S = X; tries = sv.tries || 1; allClean = sv.clean !== false; startedAt = Date.now() - (sv.elapsed || 0);
    ended = false; waiting = true; last = 0; acc = 0; pop = null; goAt = 0; shownPlace = 0; newBest = false;
    renderTop(); renderStatus(); draw(); kick();
    return true;
  }
  var saved = ctx.loadSave();
  if (dailyDate) {
    if (!(saved && saved.s && saved.daily === dailyDate && resumeRace(saved))) newRace({ daily: true });
    if (C.stats.dailyDone('circuit', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).circuit;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
    }
  } else if (!(saved && saved.s && !saved.daily && resumeRace(saved))) {
    newRace(current());
  }
  ctx.tutorialIfNew(TUT);
})();
</script>
