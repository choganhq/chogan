<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FBF6EF">
<title>جورچین — چوگان</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../lib/chogan.css">
<style>
  .jg-wrap { width: 100%; max-width: 900px; display: flex; flex-direction: column; align-items: center; gap: var(--s-3); }
  .jg-top { display: flex; flex-wrap: wrap; gap: var(--s-2); justify-content: center; align-items: center; min-height: 28px; }
  /* A picture is a picture: it is not mirrored in RTL, and neither is the row of loose pieces */
  .jg-frame {
    direction: ltr; position: relative; flex: none; border-radius: 6px; overflow: hidden;
    background: var(--c-surface-2); box-shadow: inset 0 0 0 2px var(--c-line);
  }
  .jg-grid { position: absolute; inset: 0; pointer-events: none; }
  .jg-cur { position: absolute; border: 3px solid var(--c-accent); border-radius: 6px; pointer-events: none; display: none; }
  .jg-frame--done { box-shadow: 0 0 0 3px var(--game), var(--sh-2); }
  .jg-tray {
    direction: ltr; width: 100%; display: flex; gap: 6px; align-items: center; padding: 4px 6px;
    overflow-x: auto; overflow-y: hidden; overscroll-behavior: contain; scrollbar-width: thin;
    background: var(--c-surface); border-radius: var(--r-md); box-shadow: var(--sh-1);
    /* sideways the row scrolls, upwards a finger lifts a piece out of it */
    touch-action: pan-x;
  }
  .jg-slot { flex: none; position: relative; cursor: grab; border-radius: 8px; touch-action: pan-x; }
  .jg-mid { width: 100%; display: flex; flex-direction: column; align-items: center; gap: var(--s-3); direction: ltr; }
  /* A wide window: the loose pieces in a column left of the frame, scrolling up and down,
     and a piece is lifted out of it sideways (#516) */
  .jg-wrap--side { max-width: none; }
  .jg-wrap--side .jg-mid { flex-direction: row-reverse; justify-content: center; align-items: flex-start; gap: 12px; }
  /* the sizes above the column and the mistakes under it, so the frame takes the full height */
  .jg-aside { display: flex; flex-direction: column; gap: var(--s-2); min-height: 0; direction: ltr; }
  html[dir="rtl"] .jg-aside { direction: rtl; }
  .jg-aside .jg-tray { flex: 1; min-height: 0; }
  .jg-wrap--side .jg-tray { flex-wrap: wrap; align-content: flex-start; justify-content: center; overflow-x: hidden; overflow-y: auto; touch-action: pan-y; }
  .jg-wrap--side .jg-slot { touch-action: pan-y; }
  .jg-slot canvas { display: block; pointer-events: none; }
  .jg-slot--sel { outline: 3px solid var(--c-accent); outline-offset: 1px; }
  .jg-slot--away { visibility: hidden; }
  .jg-piece { position: absolute; left: 0; top: 0; pointer-events: none; }
  .jg-float { position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; filter: drop-shadow(0 8px 12px rgba(0, 0, 0, .35)); }
  .jg-snap { animation: jg-snap var(--t-mid) var(--ease); }
  @keyframes jg-snap { 0% { filter: brightness(1.35); } 100% { filter: none; } }
  .jg-status { min-height: 1.4em; font-weight: 700; color: var(--c-text-dim); text-align: center; font-size: var(--fs-sm); }
  .jg-preview { display: block; margin: 0 auto; border-radius: var(--r-md); box-shadow: var(--sh-2); }
  .jg-tut { display: block; }
</style>
</head>
<body>
<script src="../../version.js"></script>
<script src="../../lib/chogan.js"></script>

<script>
/* ==== ENGINE START ==== */
function JigsawEngineFactory() {
  'use strict';

  // Piece counts and their cuts. The picture is 3:4 upright, so on a 390px phone, where the
  // picture is about 360px wide, the pieces are about 120, 90, 60 and 45px. 150 pieces would be
  // 36px there, under a fingertip, so it is offered only where a piece keeps MIN_PIECE (#376).
  var CUTS = { 12: [3, 4], 24: [4, 6], 48: [6, 8], 96: [8, 12], 150: [10, 15] };
  var COUNTS = [12, 24, 48, 96, 150];
  var BIG_ONLY = [150];
  var MIN_PIECE = 44;
  var DAILY_COUNT = 24;
  // Every picture and the sizes it suits: bold, simple ones read well in a few big pieces,
  // detailed ones need many small pieces to be a puzzle at all (#376)
  var FITS = { girih: 'both', carpet: 'detailed', dunes: 'simple', lake: 'both', night: 'both', garden: 'both',
    sail: 'simple', lighthouse: 'both', harbour: 'detailed', dhow: 'both', wave: 'both', autumn: 'both', pines: 'both', birches: 'detailed', hyrcan: 'both', mushroom: 'simple', pomegranate: 'detailed', watermelon: 'simple', oranges: 'simple',
    grapes: 'detailed', apples: 'detailed', peacock: 'detailed', cranes: 'simple', parrot: 'simple', owl: 'simple', hoopoe: 'simple', fishes: 'detailed', reef: 'detailed', jelly: 'simple', turtle: 'simple', whale: 'simple',
    tulips: 'both', sunflowers: 'simple', roses: 'both', irises: 'both', lotus: 'both', balloons: 'simple', kites: 'simple', rainbow: 'simple', planes: 'simple', aurora: 'both', masuleh: 'detailed', kandovan: 'both', abyaneh: 'detailed',
    windcatchers: 'both', seaside: 'detailed', planets: 'simple', moonrise: 'simple', rocket: 'simple', galaxy: 'detailed', comet: 'simple', rings: 'simple', stripes: 'simple', bulge: 'detailed', triangles: 'detailed', sunrays: 'simple',
    orosi: 'detailed', rosewin: 'both', triptych: 'detailed', fanlight: 'simple', lattice: 'detailed', samovar: 'both', teapot: 'simple', pottery: 'both', lanterns: 'both', books: 'simple', terraces: 'both', wheat: 'both', teafield: 'detailed',
    saffron: 'detailed', blossom: 'both', snowman: 'simple', snowvillage: 'detailed', cabin: 'both', skating: 'simple', snowflakes: 'simple',
    hextiles: 'detailed', mihrab: 'detailed', strapwork: 'detailed', haftrang: 'both', qashqai: 'both', prayerrug: 'both', gardenrug: 'detailed', kilim: 'detailed', oasis: 'both', desertnight: 'simple', caravanserai: 'both', mesas: 'simple', damavand: 'both',
    autumnlake: 'detailed', frozenlake: 'simple', waterfall: 'both', bridge: 'both', rooftops: 'detailed', tower: 'both', bazaar: 'detailed', charbagh: 'detailed', orangegrove: 'both', arbour: 'both', columns: 'both' };
  var PICS = Object.keys(FITS);
  var SMALL = [12, 24];
  var ASPECT = 4 / 3;     // height over width
  var TAB = 0.3;          // how far a knob reaches, as a share of its edge
  var SNAP = 0.3;         // how near its place a piece must land, as a share of a cell

  // Every inner edge gets a knob on one side and a hole on the other
  function cut(cols, rows, rnd) {
    var h = [], v = [], i;
    for (i = 0; i < cols * (rows - 1); i++) h.push(rnd() < 0.5 ? 1 : -1);
    for (i = 0; i < (cols - 1) * rows; i++) v.push(rnd() < 0.5 ? 1 : -1);
    return { cols: cols, rows: rows, h: h, v: v };
  }
  // A piece's four edges, +1 a knob out, -1 a hole in, 0 the picture's border.
  // h[r * cols + c] is the edge under row r; v[r * (cols - 1) + c] the edge right of column c.
  function edges(K, i) {
    var c = i % K.cols, r = Math.floor(i / K.cols);
    return {
      top: r === 0 ? 0 : -K.h[(r - 1) * K.cols + c],
      bottom: r === K.rows - 1 ? 0 : K.h[r * K.cols + c],
      left: c === 0 ? 0 : -K.v[r * (K.cols - 1) + c - 1],
      right: c === K.cols - 1 ? 0 : K.v[r * (K.cols - 1) + c]
    };
  }

  // One edge from 0 to 1 along it, the knob reaching out to TAB. Symmetric about the middle,
  // so a knob read from the neighbour's side, backwards, is the same curve.
  var KNOB = [
    ['L', 0.36, 0],
    ['C', 0.40, 0, 0.42, 0.08, 0.38, 0.14],
    ['C', 0.32, 0.24, 0.40, 0.30, 0.50, 0.30],
    ['C', 0.60, 0.30, 0.68, 0.24, 0.62, 0.14],
    ['C', 0.58, 0.08, 0.60, 0, 0.64, 0],
    ['L', 1, 0]
  ];
  // The outline of a piece w by h, its body's corner at 0,0, clockwise from the top left
  function outline(e, w, h) {
    var out = [['M', 0, 0]];
    function side(s, L, map) {
      if (!s) { var p = map(L, 0); out.push(['L', p[0], p[1]]); return; }
      KNOB.forEach(function (k) {
        var pts = [];
        for (var j = 1; j < k.length; j += 2) {
          var q = map(k[j] * L, k[j + 1] * L * s);
          pts.push(q[0], q[1]);
        }
        out.push([k[0]].concat(pts));
      });
    }
    // u runs along the edge, v reaches out of the piece
    side(e.top, w, function (u, v) { return [u, -v]; });
    side(e.right, h, function (u, v) { return [w + v, u]; });
    side(e.bottom, w, function (u, v) { return [w - u, h + v]; });
    side(e.left, h, function (u, v) { return [-v, h - u]; });
    return out;
  }

  // The picture's size in a space, and the room a piece's knobs need around its body
  function layout(availW, availH, count) {
    var cr = CUTS[count], w = Math.min(availW, availH / ASPECT);
    w = Math.floor(w / cr[0]) * cr[0];
    var h = Math.round(w * ASPECT), cw = w / cr[0], ch = h / cr[1];
    return { w: w, h: h, cols: cr[0], rows: cr[1], cw: cw, ch: ch, m: Math.ceil(TAB * Math.max(cw, ch)) + 2 };
  }

  // The picture's room in a game area, and whether the loose pieces go under the frame or in a
  // column beside it. Beside wins whenever it gives a bigger picture: on a wide window the row
  // under the frame took height from the picture and left most of the width empty (#516).
  // Beside, the sizes row and the mistakes line sit in the column too, so the frame keeps
  // the whole height but the game area's own padding (EDGE): above and below it they cost
  // the picture 86px on a full-HD window.
  var BARS = 110, EDGE = 24, SIDES = 24, MAX_W = 900, GAP = 12;
  function room(mainW, mainH, trayW, trayH) {
    var below = [Math.min(mainW, MAX_W) - SIDES, Math.max(mainH - trayH - BARS, 200)];
    var beside = [Math.min(mainW - trayW - GAP, MAX_W) - SIDES, Math.max(mainH - EDGE, 200)];
    var fit = function (r) { return Math.min(r[0], r[1] / ASPECT); };
    return fit(beside) > fit(below) ? { side: true, w: beside[0], h: beside[1] } : { side: false, w: below[0], h: below[1] };
  }

  // The counts a screen offers: a big-only count needs pieces of at least MIN_PIECE there
  function offered(availW, availH) {
    return COUNTS.filter(function (n) {
      if (BIG_ONLY.indexOf(n) < 0) return true;
      var L = layout(availW, availH, n);
      return Math.min(L.cw, L.ch) >= MIN_PIECE;
    });
  }
  // The pictures one count shows
  function picsFor(count) {
    var small = SMALL.indexOf(count) >= 0;
    return PICS.filter(function (id) { return FITS[id] === 'both' || FITS[id] === (small ? 'simple' : 'detailed'); });
  }
  // A new picture for one count: random among those not yet finished at that count, never the
  // one just played while another is left; once all are finished the round starts over.
  // Returns the picture and the finished list to keep.
  function pick(count, finished, last, rnd) {
    var pool = picsFor(count), done = (finished || []).filter(function (id) { return pool.indexOf(id) >= 0; });
    var left = pool.filter(function (id) { return done.indexOf(id) < 0; });
    if (!left.length) { done = []; left = pool.slice(); }
    if (left.length > 1) left = left.filter(function (id) { return id !== last; });
    return { id: left[Math.floor(rnd() * left.length)], finished: done };
  }

  function deal(count, seed, rnd, pic) {
    var cr = CUTS[count], n = count, tray = [];
    for (var i = 0; i < n; i++) tray.push(i);
    for (var k = n - 1; k > 0; k--) { var j = Math.floor(rnd() * (k + 1)), t = tray[k]; tray[k] = tray[j]; tray[j] = t; }
    return { count: count, seed: seed >>> 0, pic: PICS.indexOf(pic) >= 0 ? pic : PICS[seed % PICS.length], tray: tray, placed: [], misses: 0, done: false, cols: cr[0], rows: cr[1] };
  }
  // A drop at body corner x, y in picture pixels: a piece lands only near its own place
  function fits(S, piece, x, y, cw, ch) {
    var c = piece % S.cols, r = Math.floor(piece / S.cols);
    return Math.abs(x - c * cw) <= SNAP * cw && Math.abs(y - r * ch) <= SNAP * ch;
  }
  // The same rule for a cell picked with the keyboard
  function fitsCell(S, piece, cell) { return piece === cell; }
  function place(S, piece) {
    var at = S.tray.indexOf(piece);
    if (at < 0 || S.done) return false;
    S.tray.splice(at, 1);
    S.placed.push(piece);
    if (!S.tray.length) S.done = true;
    return true;
  }
  function miss(S) { S.misses++; }
  function restore(o) {
    if (!o || !CUTS[o.count] || PICS.indexOf(o.pic) < 0 || !Array.isArray(o.tray) || !Array.isArray(o.placed)) return null;
    if (!(o.seed >= 0) || o.seed !== Math.floor(o.seed) || !(o.misses >= 0)) return null;
    var all = o.tray.concat(o.placed), seen = [];
    if (all.length !== o.count) return null;
    for (var i = 0; i < all.length; i++) {
      var p = all[i];
      if (typeof p !== 'number' || p !== Math.floor(p) || p < 0 || p >= o.count || seen[p]) return null;
      seen[p] = true;
    }
    var cr = CUTS[o.count];
    return { count: o.count, seed: o.seed, pic: o.pic, tray: o.tray.slice(), placed: o.placed.slice(), misses: o.misses, done: !o.tray.length, cols: cr[0], rows: cr[1] };
  }

  var api = { CUTS: CUTS, COUNTS: COUNTS, BIG_ONLY: BIG_ONLY, MIN_PIECE: MIN_PIECE, DAILY_COUNT: DAILY_COUNT, PICS: PICS, FITS: FITS, ASPECT: ASPECT, TAB: TAB, SNAP: SNAP, GAP: GAP,
    room: room, offered: offered, picsFor: picsFor, pick: pick, cut: cut, edges: edges, outline: outline, layout: layout, deal: deal, fits: fits, fitsCell: fitsCell, place: place, miss: miss, restore: restore };
  if (typeof self !== 'undefined') self.JigsawEngine = api;
  return api;
}
if (typeof module !== 'undefined' && module.exports) module.exports = JigsawEngineFactory;
/* ==== ENGINE END ==== */
</script>

<script>
/* The pictures, all drawn here in code on a 300 by 400 canvas: no photo, no image file, no
   third-party art. Persian patterns, scenes, still lifes and animals, each with large areas of
   their own colour so a piece can be told apart from its neighbours. */
function JigsawPictures() {
  'use strict';
  var TAU = Math.PI * 2;

  function lin(g, x0, y0, x1, y1, stops) {
    var gr = g.createLinearGradient(x0, y0, x1, y1);
    stops.forEach(function (s) { gr.addColorStop(s[0], s[1]); });
    return gr;
  }
  function poly(g, pts) {
    g.beginPath();
    g.moveTo(pts[0], pts[1]);
    for (var i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]);
    g.closePath();
  }
  function star(g, cx, cy, n, ro, ri, rot) {
    var pts = [];
    for (var i = 0; i < n * 2; i++) {
      var a = rot + i * Math.PI / n, r = i % 2 ? ri : ro;
      pts.push(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    }
    poly(g, pts);
  }
  // a small fixed sequence instead of Math.random, so a picture is the same every time
  function seq(seed) {
    var a = seed >>> 0;
    return function () { a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; };
  }

  // Khatam tiles: eight-pointed stars and crosses in turquoise, cobalt and gold, round a
  // large twelve-pointed rosette in the middle
  function girih(g) {
    g.fillStyle = '#16325C'; g.fillRect(0, 0, 300, 400);
    var s = 50, x, y;
    for (y = 0; y <= 400; y += s) for (x = 0; x <= 300; x += s) {
      var odd = ((x + y) / s) % 2;
      g.fillStyle = odd ? '#2A9D8F' : '#3E7CB1';
      star(g, x, y, 8, 22, 15, Math.PI / 8);
      g.fill();
      g.strokeStyle = '#E9C46A'; g.lineWidth = 2; g.stroke();
      g.fillStyle = '#F4E9D0';
      star(g, x, y, 8, 9, 5, 0);
      g.fill();
    }
    // the crosses between the stars
    for (y = s / 2; y < 400; y += s) for (x = s / 2; x < 300; x += s) {
      g.fillStyle = y < 200 ? '#C8553D' : '#8E5572';
      poly(g, [x - 5, y - 12, x + 5, y - 12, x + 5, y - 5, x + 12, y - 5, x + 12, y + 5, x + 5, y + 5, x + 5, y + 12, x - 5, y + 12, x - 5, y + 5, x - 12, y + 5, x - 12, y - 5, x - 5, y - 5]);
      g.fill();
    }
    g.fillStyle = '#0F2444';
    g.beginPath(); g.arc(150, 200, 92, 0, TAU); g.fill();
    g.fillStyle = '#E9C46A'; star(g, 150, 200, 12, 86, 58, 0); g.fill();
    g.fillStyle = '#2A9D8F'; star(g, 150, 200, 12, 64, 44, Math.PI / 12); g.fill();
    g.fillStyle = '#F4E9D0'; star(g, 150, 200, 6, 38, 22, 0); g.fill();
    g.fillStyle = '#C8553D'; g.beginPath(); g.arc(150, 200, 14, 0, TAU); g.fill();
    g.strokeStyle = '#E9C46A'; g.lineWidth = 8; g.strokeRect(4, 4, 292, 392);
  }

  // A lachak-toranj carpet: a red field, a medallion, four corner quarters and a navy border
  function carpet(g) {
    var r = seq(7), i;
    g.fillStyle = '#1E2A4A'; g.fillRect(0, 0, 300, 400);
    g.fillStyle = '#F1E3C6'; g.fillRect(14, 14, 272, 372);
    g.fillStyle = '#9C2F2F'; g.fillRect(24, 24, 252, 352);
    // border rosettes
    for (i = 0; i < 12; i++) {
      [[22 + i * 23, 7], [22 + i * 23, 393]].forEach(function (p) { g.fillStyle = i % 2 ? '#E0B04A' : '#F1E3C6'; star(g, p[0], p[1], 6, 5, 2.5, 0); g.fill(); });
    }
    for (i = 0; i < 17; i++) {
      [[7, 22 + i * 22.5], [293, 22 + i * 22.5]].forEach(function (p) { g.fillStyle = i % 2 ? '#E0B04A' : '#F1E3C6'; star(g, p[0], p[1], 6, 5, 2.5, 0); g.fill(); });
    }
    // small flowers strewn over the field
    for (i = 0; i < 70; i++) {
      var x = 32 + r() * 236, y = 32 + r() * 336;
      g.fillStyle = ['#E0B04A', '#F1E3C6', '#2E6E73'][i % 3];
      star(g, x, y, 5, 4, 1.8, r() * TAU); g.fill();
    }
    // the four corner quarters
    [[24, 24, 0], [276, 24, Math.PI / 2], [276, 376, Math.PI], [24, 376, -Math.PI / 2]].forEach(function (c) {
      g.save(); g.translate(c[0], c[1]); g.rotate(c[2]);
      g.fillStyle = '#1E2A4A'; g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, 70, 0, Math.PI / 2); g.closePath(); g.fill();
      g.fillStyle = '#E0B04A'; g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, 52, 0, Math.PI / 2); g.closePath(); g.fill();
      g.fillStyle = '#2E6E73'; g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, 34, 0, Math.PI / 2); g.closePath(); g.fill();
      g.restore();
    });
    // the medallion and its two pendants
    g.fillStyle = '#F1E3C6';
    poly(g, [150, 70, 168, 110, 150, 120, 132, 110]); g.fill();
    poly(g, [150, 330, 168, 290, 150, 280, 132, 290]); g.fill();
    g.fillStyle = '#1E2A4A'; g.beginPath(); g.ellipse(150, 200, 86, 104, 0, 0, TAU); g.fill();
    g.fillStyle = '#E0B04A'; g.beginPath(); g.ellipse(150, 200, 72, 90, 0, 0, TAU); g.fill();
    g.fillStyle = '#F1E3C6'; g.beginPath(); g.ellipse(150, 200, 58, 74, 0, 0, TAU); g.fill();
    g.fillStyle = '#9C2F2F'; star(g, 150, 200, 8, 50, 30, 0); g.fill();
    g.fillStyle = '#2E6E73'; star(g, 150, 200, 8, 28, 16, Math.PI / 8); g.fill();
    g.fillStyle = '#E0B04A'; g.beginPath(); g.arc(150, 200, 9, 0, TAU); g.fill();
  }

  // Desert dunes at sunset, a caravan on the middle ridge
  function dunes(g) {
    g.fillStyle = lin(g, 0, 0, 0, 230, [[0, '#5B3A7A'], [0.45, '#E07A5F'], [1, '#F6C77A']]);
    g.fillRect(0, 0, 300, 400);
    g.fillStyle = '#FBE3A1'; g.beginPath(); g.arc(210, 175, 34, 0, TAU); g.fill();
    function dune(y0, col, amp, ph) {
      g.fillStyle = col; g.beginPath(); g.moveTo(0, 400); g.lineTo(0, y0);
      for (var x = 0; x <= 300; x += 10) g.lineTo(x, y0 + Math.sin(x / 300 * TAU * 0.8 + ph) * amp + Math.sin(x / 41 + ph) * amp * 0.25);
      g.lineTo(300, 400); g.closePath(); g.fill();
    }
    dune(215, '#D9895B', 14, 0.4);
    dune(255, '#C8703F', 20, 2.2);
    dune(315, '#A8552E', 24, 4.1);
    dune(365, '#8A4424', 12, 1.0);
    // camels: a body, a hump, a neck and four legs, in one dark ink
    g.fillStyle = '#3B2214'; g.strokeStyle = '#3B2214'; g.lineWidth = 2; g.lineCap = 'round';
    [[70, 247, 1], [104, 251, 0.9], [134, 254, 0.8]].forEach(function (c) {
      var x = c[0], y = c[1], k = c[2];
      g.save(); g.translate(x, y); g.scale(k, k);
      g.beginPath(); g.ellipse(0, 0, 13, 6, 0, 0, TAU); g.fill();
      g.beginPath(); g.ellipse(-1, -6, 6, 5, 0, 0, TAU); g.fill();
      g.beginPath(); g.moveTo(11, -2); g.lineTo(17, -12); g.lineTo(21, -12); g.stroke();
      [-9, -4, 5, 10].forEach(function (lx) { g.beginPath(); g.moveTo(lx, 4); g.lineTo(lx, 15); g.stroke(); });
      g.restore();
    });
  }

  // A snow-capped peak over a lake, poplars on the shore and the mountain in the water
  function lake(g) {
    g.fillStyle = lin(g, 0, 0, 0, 220, [[0, '#6FA8DC'], [1, '#DCEFF8']]);
    g.fillRect(0, 0, 300, 230);
    function mountains(flip) {
      g.save();

    // the shore and its poplars
    g.fillStyle = '#C9B58A'; poly(g, [0, 400, 0, 352, 90, 338, 170, 356, 300, 340, 300, 400]); g.fill();
    [[30, 352], [52, 346], [250, 344], [272, 348]].forEach(function (p) {
      g.fillStyle = '#6B4F2E'; g.fillRect(p[0] - 1.5, p[1] - 6, 3, 10);
      g.fillStyle = '#3F6B35'; g.beginPath(); g.ellipse(p[0], p[1] - 30, 8, 28, 0, 0, TAU); g.fill();
    });
  }

  // Night over a city of domes and minarets, a crescent moon and the windows lit
  function night(g) {
    var r = seq(19), i;
    g.fillStyle = lin(g, 0, 0, 0, 300, [[0, '#0B1430'], [1, '#3C4F9A']]);
    g.fillRect(0, 0, 300, 400);
    g.fillStyle = '#F4E9D0';
    for (i = 0; i < 80; i++) { g.beginPath(); g.arc(r() * 300, r() * 220, r() * 1.4 + 0.4, 0, TAU); g.fill(); }
    // the crescent is the full moon with a disc clipped out, so the sky shows through the gap
    g.save();
    g.beginPath(); g.rect(0, 0, 300, 400); g.arc(236, 68, 23, 0, TAU); g.clip('evenodd');
    g.fillStyle = '#F6E7B0'; g.beginPath(); g.arc(225, 75, 26, 0, TAU); g.fill();
    g.restore();
    var ink = '#141A33', tile = '#1F6F8B';
    // the minarets
    [[42, 120], [258, 120]].forEach(function (m) {
      g.fillStyle = ink; g.fillRect(m[0] - 8, m[1], 16, 280);
      g.fillRect(m[0] - 12, m[1] + 30, 24, 8);
      poly(g, [m[0] - 8, m[1], m[0], m[1] - 22, m[0] + 8, m[1]]); g.fill();
      g.fillStyle = '#F2B84B'; g.fillRect(m[0] - 2, m[1] + 60, 4, 10);
    });
    // the great dome on its drum, two small ones beside
    g.fillStyle = tile; g.beginPath(); g.ellipse(150, 230, 62, 70, 0, Math.PI, 0); g.fill();
    g.fillStyle = ink; g.fillRect(96, 228, 108, 30);
    g.fillStyle = '#E9C46A'; g.fillRect(148, 148, 4, 14);
    [[80, 280], [220, 280]].forEach(function (d) {
      g.fillStyle = tile; g.beginPath(); g.ellipse(d[0], d[1], 32, 34, 0, Math.PI, 0); g.fill();
      g.fillStyle = ink; g.fillRect(d[0] - 30, d[1] - 2, 60, 18);
    });
    // the long front with lit arches
    g.fillStyle = ink; g.fillRect(0, 296, 300, 104);
    g.fillStyle = '#F2B84B';
    for (i = 0; i < 9; i++) {
      var x = 14 + i * 32;
      g.beginPath(); g.moveTo(x, 360); g.lineTo(x, 330); g.quadraticCurveTo(x + 9, 314, x + 18, 330); g.lineTo(x + 18, 360); g.closePath(); g.fill();
    }
    g.fillStyle = '#0B1430'; g.fillRect(0, 372, 300, 28);
    g.fillStyle = 'rgba(242,184,75,.35)';
    for (i = 0; i < 9; i++) g.fillRect(16 + i * 32, 378, 14, 3 + (i % 3));
  }

  // A Persian garden: a pavilion's arch, a long pool, rows of cypresses and flower beds
  function garden(g) {
    g.fillStyle = lin(g, 0, 0, 0, 140, [[0, '#8EC5E8'], [1, '#E7F3F9']]);
    g.fillRect(0, 0, 300, 150);
    // the pavilion
    g.fillStyle = '#E9D8B4'; g.fillRect(70, 40, 160, 110);
    g.fillStyle = '#C9A66B'; g.fillRect(70, 40, 160, 10);
    g.fillStyle = '#2A6F97';
    g.beginPath(); g.moveTo(118, 150); g.lineTo(118, 88); g.quadraticCurveTo(150, 46, 182, 88); g.lineTo(182, 150); g.closePath(); g.fill();
    g.fillStyle = '#E9C46A'; g.fillRect(124, 92, 52, 4);
    [[84, 70], [196, 70]].forEach(function (w) {
      g.fillStyle = '#2A6F97'; g.beginPath(); g.moveTo(w[0], 120); g.lineTo(w[0], w[1] + 10); g.quadraticCurveTo(w[0] + 10, w[1], w[0] + 20, w[1] + 10); g.lineTo(w[0] + 20, 120); g.closePath(); g.fill();
    });
    // the ground, the pool running toward us and the paths beside it
    g.fillStyle = '#7BA05B'; g.fillRect(0, 150, 300, 250);
    g.fillStyle = '#D8C7A1'; poly(g, [128, 150, 172, 150, 250, 400, 50, 400]); g.fill();
    g.fillStyle = lin(g, 0, 150, 0, 400, [[0, '#5FA8C9'], [1, '#2B6E96']]);
    poly(g, [138, 150, 162, 150, 210, 400, 90, 400]); g.fill();
    g.fillStyle = 'rgba(233,216,180,.45)'; poly(g, [143, 150, 157, 150, 168, 230, 132, 230]); g.fill();
    // flower beds
    var r = seq(3);
    for (var i = 0; i < 90; i++) {
      var y = 170 + r() * 220, left = r() < 0.5, spread = (y - 150) / 250;
      var x = left ? 120 - spread * 70 - r() * 50 * (0.4 + spread) : 180 + spread * 70 + r() * 50 * (0.4 + spread);
      g.fillStyle = ['#D1495B', '#EDAE49', '#F4A6B6'][i % 3];
      g.beginPath(); g.arc(x, y, 1.6 + spread * 2.4, 0, TAU); g.fill();
    }
    // two rows of cypresses, growing toward us
    for (var k = 0; k < 5; k++) {
      var t = k / 4, yb = 175 + t * 205, s = 0.45 + t * 0.9, dx = 22 + t * 92;
      [150 - dx - 14 * s, 150 + dx + 14 * s].forEach(function (x) {
        g.fillStyle = '#244B2E'; g.beginPath(); g.ellipse(x, yb - 34 * s, 9 * s, 36 * s, 0, 0, TAU); g.fill();
        g.fillStyle = '#2F6B3C'; g.beginPath(); g.ellipse(x - 2 * s, yb - 38 * s, 4 * s, 26 * s, 0, 0, TAU); g.fill();
      });
    }
  }

  /* ---- helpers shared by the scenes below ---- */
  function fill(g, col) { g.fillStyle = col; g.fill(); }
  function box(g, x, y, w, h, col) { g.fillStyle = col; g.fillRect(x, y, w, h); }
  function disc(g, x, y, r, col) { g.beginPath(); g.arc(x, y, r, 0, TAU); fill(g, col); }
  function oval(g, x, y, rx, ry, rot, col) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); fill(g, col); }
  function sky(g, h, stops) { g.fillStyle = lin(g, 0, 0, 0, h, stops); g.fillRect(0, 0, 300, h); }
  // A band of land or water from y0 down to the bottom, its top edge a sum of two waves
  function ridge(g, y0, col, amp, len, ph, bottom) {
    g.beginPath(); g.moveTo(0, bottom || 400); g.lineTo(0, y0);
    for (var x = 0; x <= 300; x += 6) g.lineTo(x, y0 + Math.sin(x / len + ph) * amp + Math.sin(x / (len * 0.37) + ph * 2) * amp * 0.3);
    g.lineTo(300, bottom || 400); g.closePath(); fill(g, col);
  }
  // A pine as three stacked triangles on a short trunk, its foot at x, y
  function pine(g, x, y, h, col, trunk) {
    box(g, x - h * 0.04, y - h * 0.12, h * 0.08, h * 0.12, trunk || '#4A3424');
    for (var i = 0; i < 3; i++) {
      var w = h * (0.42 - i * 0.1), top = y - h * (0.45 + i * 0.22), base = y - h * (0.1 + i * 0.24);
      poly(g, [x - w, base, x, top - h * 0.12, x + w, base]); fill(g, col);
    }
  }
  // A round-crowned tree, its foot at x, y
  function bush(g, x, y, r, col, trunk) {
    box(g, x - r * 0.12, y - r * 1.1, r * 0.24, r * 1.1, trunk || '#5A3D26');
    disc(g, x, y - r * 1.5, r, col);
    disc(g, x - r * 0.55, y - r * 1.2, r * 0.7, col);
    disc(g, x + r * 0.55, y - r * 1.25, r * 0.72, col);
  }
  // A gull or crane far away: two arcs
  function flyer(g, x, y, s, col, lw) {
    g.strokeStyle = col; g.lineWidth = lw || 2; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x - s, y); g.quadraticCurveTo(x - s / 2, y - s * 0.6, x, y); g.quadraticCurveTo(x + s / 2, y - s * 0.6, x + s, y); g.stroke();
  }
  // A fish facing right (dir 1) or left (-1): a body, a tail and an eye
  function fish(g, x, y, s, col, dir, eye) {
    g.save(); g.translate(x, y); g.scale(dir || 1, 1);
    oval(g, 0, 0, s, s * 0.48, 0, col);
    poly(g, [-s * 0.8, 0, -s * 1.5, -s * 0.5, -s * 1.5, s * 0.5]); fill(g, col);
    disc(g, s * 0.5, -s * 0.1, s * 0.12, eye || '#10202E');
    g.restore();
  }
  // Wavy strokes across water
  function ripples(g, y0, y1, n, col, seed) {
    var r = seq(seed); g.strokeStyle = col; g.lineWidth = 1.5; g.lineCap = 'round';
    for (var i = 0; i < n; i++) {
      var y = y0 + r() * (y1 - y0), x = r() * 280, w = 12 + r() * 26;
      g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + w / 2, y - 3, x + w, y); g.stroke();
    }
  }

  /* ---- the sea ---- */

  // A sailing boat against a low sun, the sun's path broken on the water
  function sail(g) {
    sky(g, 250, [[0, '#3B2E6E'], [0.55, '#E2725B'], [1, '#F9C784']]);
    disc(g, 150, 240, 46, '#FCE3A6');
    g.fillStyle = lin(g, 0, 240, 0, 400, [[0, '#2E3F7A'], [1, '#141C3D']]); g.fillRect(0, 240, 300, 160);
    for (var i = 0; i < 12; i++) { var w = 70 - i * 4.5; box(g, 150 - w / 2 + (i % 2) * 8, 248 + i * 12, w, 3, 'rgba(252,227,166,' + (0.8 - i * 0.05) + ')'); }
    // the boat, dark against the sun
    var ink = '#1A1430';
    g.beginPath(); g.moveTo(170, 300); g.lineTo(260, 300); g.lineTo(246, 318); g.lineTo(182, 318); g.closePath(); fill(g, ink);
    box(g, 213, 170, 4, 132, ink);
    poly(g, [219, 176, 219, 294, 270, 294]); fill(g, ink);
    poly(g, [211, 186, 211, 294, 172, 294]); fill(g, ink);
    [[60, 110, 9], [86, 96, 7], [104, 124, 6], [250, 80, 8]].forEach(function (b) { flyer(g, b[0], b[1], b[2], ink, 2); });
  }

  // A striped lighthouse on a cliff at dusk, its beam over a dark sea
  function lighthouse(g) {
    sky(g, 300, [[0, '#14254A'], [1, '#4A6FA5']]);
    var r = seq(41);
    for (var i = 0; i < 40; i++) disc(g, r() * 300, r() * 160, r() * 1.2 + 0.4, '#E8EEF8');
    g.fillStyle = 'rgba(255,236,170,.28)'; poly(g, [196, 112, 0, 40, 0, 150]); g.fill();
    g.fillStyle = lin(g, 0, 250, 0, 400, [[0, '#1E3A5F'], [1, '#0C1A2E']]); g.fillRect(0, 250, 300, 150);
    ripples(g, 262, 390, 26, 'rgba(200,220,255,.45)', 5);

    g.beginPath(); g.moveTo(140, 400); g.lineTo(150, 300); g.lineTo(176, 262); g.lineTo(240, 250); g.lineTo(300, 256); g.lineTo(300, 400); g.closePath(); fill(g, '#3A3229');
    g.beginPath(); g.moveTo(170, 400); g.lineTo(178, 320); g.lineTo(200, 290); g.lineTo(300, 284); g.lineTo(300, 400); g.closePath(); fill(g, '#4E4235');
    // the tower, narrowing upwards, in red and white bands
    for (var b = 0; b < 6; b++) {
      var y1 = 254 - b * 22, y0 = y1 - 22, w1 = 22 - b * 1.6, w0 = 22 - (b + 1) * 1.6;
      poly(g, [210 - w1, y1, 210 + w1, y1, 210 + w0, y0, 210 - w0, y0]); fill(g, b % 2 ? '#F4EFE6' : '#C0392B');
    }

    box(g, 192, 100, 36, 5, '#20242C'); box(g, 192, 121, 36, 4, '#20242C');
    poly(g, [194, 100, 210, 84, 226, 100]); fill(g, '#C0392B');
  }

  // A small harbour: houses on a hill, a quay and painted boats on still water
  function harbour(g) {
    sky(g, 160, [[0, '#9AD0EC'], [1, '#E9F5FB']]);
    ridge(g, 96, '#7FA86A', 10, 60, 1.2, 200);
    var r = seq(23), cols = ['#F2E3C9', '#E8B27C', '#F7F2EA', '#D9826A', '#F0CF7A'];
    for (var i = 0; i < 26; i++) {
      var x = (i * 37) % 290, y = 108 + Math.floor(i / 8) * 26 + (i % 3) * 5, w = 22 + r() * 10;
      box(g, x, y, w, 20, cols[i % 5]);
      poly(g, [x - 2, y, x + w / 2, y - 9, x + w + 2, y]); fill(g, '#B5523B');
      box(g, x + w / 2 - 3, y + 8, 6, 8, '#3D4F6B');
    }
    box(g, 0, 196, 300, 24, '#A89A86'); box(g, 0, 218, 300, 6, '#6E6352');
    g.fillStyle = lin(g, 0, 224, 0, 400, [[0, '#3C8DAD'], [1, '#1C5A78']]); g.fillRect(0, 224, 300, 176);
    var hulls = ['#D1495B', '#EDAE49', '#00798C', '#F4F1E8', '#30638E', '#E07A5F'];
    for (var k = 0; k < 6; k++) {
      var bx = 18 + (k % 3) * 94, by = 262 + Math.floor(k / 3) * 72, c = hulls[k];
      g.save(); g.globalAlpha = 0.35; g.beginPath(); g.moveTo(bx, by + 4); g.lineTo(bx + 70, by + 4); g.lineTo(bx + 60, by + 22); g.lineTo(bx + 10, by + 22); g.closePath(); fill(g, c); g.restore();
      g.beginPath(); g.moveTo(bx, by); g.lineTo(bx + 70, by); g.lineTo(bx + 60, by - 16); g.lineTo(bx + 10, by - 16); g.closePath(); fill(g, c);
      box(g, bx + 8, by - 18, 54, 3, '#F4F1E8');
      box(g, bx + 33, by - 52, 3, 36, '#4A3A2A');
      poly(g, [bx + 37, by - 50, bx + 37, by - 20, bx + 58, by - 22]); fill(g, '#F4F1E8');
    }
    ripples(g, 236, 396, 30, 'rgba(255,255,255,.4)', 8);
  }

  // A wooden lenj on a turquoise gulf at noon, an island behind
  function dhow(g) {
    sky(g, 220, [[0, '#7EC8E3'], [1, '#F2FAFC']]);
    disc(g, 60, 60, 24, '#FFF6D5');
    g.beginPath(); g.moveTo(170, 222); g.quadraticCurveTo(220, 170, 300, 186); g.lineTo(300, 222); g.closePath(); fill(g, '#C9A26B');
    g.beginPath(); g.moveTo(210, 222); g.quadraticCurveTo(250, 196, 300, 202); g.lineTo(300, 222); g.closePath(); fill(g, '#A5824F');
    g.fillStyle = lin(g, 0, 220, 0, 400, [[0, '#2EC4B6'], [1, '#117A8B']]); g.fillRect(0, 220, 300, 180);
    ripples(g, 230, 390, 34, 'rgba(255,255,255,.55)', 13);
    // the hull: a long curve, high at the stern, with a pale band
    g.beginPath(); g.moveTo(30, 268); g.lineTo(250, 262); g.lineTo(276, 236); g.lineTo(262, 290); g.quadraticCurveTo(150, 318, 52, 296); g.closePath(); fill(g, '#7A4A2A');
    g.beginPath(); g.moveTo(36, 276); g.lineTo(256, 270); g.lineTo(254, 279); g.lineTo(40, 285); g.closePath(); fill(g, '#E9D8B4');
    box(g, 140, 120, 5, 146, '#4A2E1A');

    g.strokeStyle = '#4A2E1A'; g.lineWidth = 4; g.beginPath(); g.moveTo(60, 160); g.lineTo(230, 92); g.stroke();
    poly(g, [64, 162, 226, 96, 196, 252, 92, 258]); fill(g, '#F6EEDC');
    g.strokeStyle = 'rgba(122,74,42,.35)'; g.lineWidth = 2; for (var i = 1; i < 4; i++) { g.beginPath(); g.moveTo(64 + i * 40, 162 - i * 16); g.lineTo(92 + i * 26, 258); g.stroke(); }
  }

  // A great wave curling over, foam at its lip, a small boat and a far peak
  function wave(g) {
    box(g, 0, 0, 300, 400, '#EFE6D2');
    poly(g, [190, 300, 236, 236, 282, 300]); fill(g, '#8FA3B8'); poly(g, [222, 256, 236, 236, 250, 256]); fill(g, '#FFFFFF');
    g.fillStyle = '#1D3557';
    g.beginPath(); g.moveTo(0, 400); g.lineTo(0, 210);
    g.bezierCurveTo(30, 100, 150, 60, 210, 120); g.bezierCurveTo(240, 150, 220, 200, 180, 190);
    g.bezierCurveTo(150, 182, 160, 150, 182, 150); g.bezierCurveTo(140, 130, 90, 190, 110, 260);
    g.bezierCurveTo(130, 330, 220, 330, 300, 300); g.lineTo(300, 400); g.closePath(); g.fill();
    g.fillStyle = '#457B9D';
    g.beginPath(); g.moveTo(0, 400); g.lineTo(0, 260); g.bezierCurveTo(40, 200, 80, 220, 96, 270); g.bezierCurveTo(120, 340, 220, 350, 300, 330); g.lineTo(300, 400); g.closePath(); g.fill();
    // foam fingers along the lip
    for (var i = 0; i < 9; i++) {
      var a = Math.PI * 1.05 + i * 0.2, x = 150 + Math.cos(a) * 62, y = 150 + Math.sin(a) * 62 + 6;
      disc(g, x + 30, y, 7 - i * 0.4, '#F7F3EA');
      disc(g, x + 38, y + 6, 4, '#F7F3EA');
    }
    for (var j = 0; j < 14; j++) disc(g, 200 + (j % 5) * 6, 118 + Math.floor(j / 5) * 7 + (j % 2) * 3, 3.5, '#F7F3EA');
    ripples(g, 340, 395, 18, 'rgba(247,243,234,.7)', 3);
    g.save(); g.translate(96, 330); g.rotate(-0.35);
    g.beginPath(); g.moveTo(-30, 0); g.lineTo(30, 0); g.lineTo(22, 8); g.lineTo(-22, 8); g.closePath(); fill(g, '#C9A26B');
    g.restore();
  }

  /* ---- forests ---- */

  // Autumn: rows of round trees in fire colours and a path running between them
  function autumn(g) {
    sky(g, 180, [[0, '#A7D3E8'], [1, '#F6EBD9']]);
    box(g, 0, 170, 300, 230, '#C98B4B');
    g.beginPath(); g.moveTo(130, 170); g.lineTo(170, 170); g.lineTo(240, 400); g.lineTo(60, 400); g.closePath(); fill(g, '#E8C79A');
    var cols = ['#D1495B', '#EDAE49', '#E36414', '#9A031E', '#F3A712'];
    // a far row of small trees along the horizon
    for (var f = 0; f < 15; f++) bush(g, 6 + f * 21, 178, 8, cols[(f * 3) % 5]);
    for (var k = 0; k < 5; k++) {
      var t = k / 4, y = 196 + t * 196, s = 16 + t * 40, dx = 14 + t * 60;
      bush(g, 150 - dx - s, y, s, cols[k % 5]);
      bush(g, 150 + dx + s, y, s, cols[(k + 2) % 5]);
    }
    var r = seq(17);
    for (var i = 0; i < 60; i++) oval(g, 70 + r() * 160, 220 + r() * 175, 3, 1.6, r() * TAU, cols[i % 5]);
  }

  // A pine forest at dawn in four misty layers, the sun pale behind
  function pines(g) {
    sky(g, 400, [[0, '#F7D9C4'], [0.5, '#E9B8A7'], [1, '#B7C4CF']]);
    disc(g, 200, 140, 40, '#FFF1DE');
    var rows = [[176, '#9FB3BF', 30, 44], [220, '#7E97A6', 28, 58], [270, '#56707F', 26, 76], [326, '#2F4653', 24, 96]];
    rows.forEach(function (row, n) {
      var r = seq(31 + n);
      box(g, 0, row[0] - row[3] * 0.13, 300, 400, row[1]);
      for (var x = -10; x < 310; x += row[2]) pine(g, x + r() * 10, row[0] + 4, row[3] * (0.8 + r() * 0.4), row[1], row[1]);
    });
    // a still pond below, the dawn in it
    g.fillStyle = lin(g, 0, 334, 0, 400, [[0, '#E9C3B2'], [1, '#8FA2B0']]); g.fillRect(0, 334, 300, 66);
    oval(g, 200, 352, 30, 8, 0, 'rgba(255,241,222,.8)');
    ripples(g, 340, 396, 22, 'rgba(47,70,83,.5)', 9);
  }

  // White birch trunks with dark marks over a carpet of yellow leaves
  function birches(g) {
    sky(g, 400, [[0, '#8EC9E8'], [1, '#DDF0F7']]);
    box(g, 0, 300, 300, 100, '#E9B949');
    var r = seq(53), i;
    for (i = 0; i < 40; i++) disc(g, r() * 300, r() * 180, 10 + r() * 16, ['#F2C14E', '#E9A23B', '#F7DD72'][i % 3]);
    [[24, 14], [78, 22], [130, 12], [176, 26], [236, 16], [280, 20]].forEach(function (t, k) {
      box(g, t[0] - t[1] / 2, 0, t[1], 330 + (k % 3) * 18, '#F4F1EA');

    box(g, 0, 146, 300, 8, '#5E4630');
    for (i = 0; i < 11; i++) { arch(g, 4 + i * 27, 210, 18, 22, true); fill(g, '#FFC857'); arch(g, 8 + i * 27, 176, 10, 8, true); fill(g, '#FFC857'); }

    g.save(); g.globalAlpha = 0.45; g.translate(0, 440); g.scale(1, -1);
    box(g, 0, 150, 300, 70, '#7A5C3E');
    for (i = 0; i < 11; i++) { arch(g, 4 + i * 27, 210, 18, 22, true); fill(g, '#FFC857'); }
    g.restore();
    ripples(g, 230, 395, 36, 'rgba(255,200,87,.5)', 21);
  }

  // Rooftops by moonlight: cats on the ridges and lit windows below
  function rooftops(g) {
    sky(g, 400, [[0, '#1B263B'], [1, '#415A77']]);
    disc(g, 220, 80, 44, '#E0E1DD'); disc(g, 210, 70, 8, '#C9CBC5'); disc(g, 236, 94, 6, '#C9CBC5');
    var r = seq(27);
    for (var row = 0; row < 3; row++) for (var c = 0; c < 4; c++) {
      var x = c * 80 - 20 + row * 24, y = 170 + row * 76, w = 76;
      box(g, x, y, w, 120, ['#0D1B2A', '#14263A', '#1B2F45'][row]);
      poly(g, [x - 4, y, x + w / 2, y - 30, x + w + 4, y]); fill(g, ['#2B3A4F', '#33465F', '#3C526E'][row]);
      for (var k = 0; k < 2; k++) box(g, x + 14 + k * 30, y + 20, 16, 20, r() < 0.6 ? '#FFD166' : '#22313F');
      box(g, x + w - 22, y - 26, 10, 18, '#22313F');
    }
    var cat = function (x, y) { oval(g, x, y, 10, 7, 0, '#0B0F17'); disc(g, x + 8, y - 8, 6, '#0B0F17'); poly(g, [x + 4, y - 12, x + 6, y - 19, x + 9, y - 13]); fill(g, '#0B0F17'); poly(g, [x + 9, y - 13, x + 12, y - 19, x + 13, y - 11]); fill(g, '#0B0F17'); g.strokeStyle = '#0B0F17'; g.lineWidth = 3; g.beginPath(); g.moveTo(x - 9, y); g.quadraticCurveTo(x - 20, y - 4, x - 16, y - 16); g.stroke(); };
    cat(60, 136); cat(206, 206);
  }

  // A tower over a city of lights, its shaft and pod lit up
  function tower(g) {
    sky(g, 400, [[0, '#10002B'], [1, '#3C096C']]);
    var r = seq(41), i;
    for (i = 0; i < 40; i++) disc(g, r() * 300, r() * 200, r() * 1.2 + 0.3, '#E0AAFF');
    poly(g, [140, 360, 146, 120, 154, 120, 160, 360]); fill(g, '#5A189A');
    oval(g, 150, 150, 30, 14, 0, '#7B2CBF'); box(g, 120, 140, 60, 16, '#9D4EDD'); oval(g, 150, 140, 30, 8, 0, '#C77DFF');
    for (i = 0; i < 8; i++) box(g, 124 + i * 7, 144, 4, 8, '#FFD60A');
    box(g, 148, 60, 4, 64, '#C77DFF'); disc(g, 150, 58, 3, '#FF006E');
    for (var b = 0; b < 16; b++) {
      var x = b * 20, h = 40 + r() * 90;
      if (x > 120 && x < 170) h = 40;
      box(g, x, 400 - h - 40, 18, h + 40, ['#240046', '#3C096C', '#2A0549'][b % 3]);
      for (var k = 0; k < h / 14; k++) for (var c = 0; c < 2; c++) if (r() < 0.55) box(g, x + 3 + c * 8, 400 - h - 30 + k * 14, 4, 6, '#FFB703');
    }
    box(g, 0, 384, 300, 16, '#10002B');
  }

  // A covered bazaar lane: brick vaults, light falling from the roof holes, lamps and stalls
  function bazaar(g) {
    box(g, 0, 0, 300, 400, '#5E3A1E');
    for (var v = 0; v < 4; v++) {
      var s = 1 - v * 0.2, w = 300 * s, x = 150 - w / 2, top = 20 + v * 34, base = 400 - v * 30;
      arch(g, x, base, w, (base - top) * 0.55, false); fill(g, ['#C68B59', '#B07D48', '#9C6B3C', '#8A5A30'][v]);
      disc(g, 150, top + 22 * s, 10 * s, '#FFF3D6');
    }
    arch(g, 105, 300, 90, 90, false); fill(g, '#3B2414');
    g.fillStyle = 'rgba(255,243,214,.25)'; poly(g, [142, 40, 158, 40, 180, 400, 120, 400]); g.fill();
    for (var i = 0; i < 4; i++) {
      var y = 90 + i * 40; g.strokeStyle = '#3B2414'; g.lineWidth = 1.5;
      [70 + i * 8, 230 - i * 8].forEach(function (lx) { g.beginPath(); g.moveTo(lx, y - 20); g.lineTo(lx, y); g.stroke(); oval(g, lx, y + 8, 8 - i, 10 - i, 0, '#FFB703'); });
    }
    [[0, 300, '#E63946'], [0, 340, '#F4A261'], [230, 300, '#2A9D8F'], [230, 340, '#E9C46A']].forEach(function (st) { box(g, st[0], st[1], 70, 36, st[2]); for (var k = 0; k < 5; k++) disc(g, st[0] + 10 + k * 13, st[1] + 10, 5, '#F4E9D0'); });
    box(g, 0, 376, 300, 24, '#3B2414');

  /* ---- more gardens ---- */

  // A chahar-bagh from above: four beds, two crossing channels and a pool in the middle
  function charbagh(g) {
    box(g, 0, 0, 300, 400, '#E9D8A6');
    [[20, 20], [170, 20], [20, 220], [170, 220]].forEach(function (b) {
      box(g, b[0], b[1], 110, 160, '#6A994E');
      for (var k = 0; k < 3; k++) for (var j = 0; j < 4; j++) disc(g, b[0] + 22 + k * 33, b[1] + 22 + j * 38, 12, (k + j) % 2 ? '#386641' : '#A7C957');
      for (var f = 0; f < 10; f++) disc(g, b[0] + 6 + f * 11, b[1] + 6, 3, '#BC4749');

  // An orange grove: rows of round trees heavy with fruit, a path between
  function orangegrove(g) {
    sky(g, 170, [[0, '#8ECAE6'], [1, '#F1FAEE']]);
    box(g, 0, 160, 300, 240, '#A7C957');
    g.beginPath(); g.moveTo(140, 160); g.lineTo(160, 160); g.lineTo(220, 400); g.lineTo(80, 400); g.closePath(); fill(g, '#DDB892');

      var t = k / 4, y = 176 + t * 210, s = 12 + t * 34, dx = 26 + t * 90;

  }

  var DRAW = { girih: girih, carpet: carpet, dunes: dunes, lake: lake, night: night, garden: garden,
    sail: sail, lighthouse: lighthouse, harbour: harbour, dhow: dhow, wave: wave, autumn: autumn, pines: pines, birches: birches, hyrcan: hyrcan, mushroom: mushroom,
    pomegranate: pomegranate, watermelon: watermelon, oranges: oranges, grapes: grapes, apples: apples, peacock: peacock, cranes: cranes, parrot: parrot, owl: owl, hoopoe: hoopoe, fishes: fishes, reef: reef, jelly: jelly, turtle: turtle, whale: whale,
    tulips: tulips, sunflowers: sunflowers, roses: roses, irises: irises, lotus: lotus, balloons: balloons, kites: kites, rainbow: rainbow, planes: planes, aurora: aurora,
    masuleh: masuleh, kandovan: kandovan, abyaneh: abyaneh, windcatchers: windcatchers, seaside: seaside, planets: planets, moonrise: moonrise, rocket: rocket, galaxy: galaxy, comet: comet,
    rings: rings, stripes: stripes, bulge: bulge, triangles: triangles, sunrays: sunrays,

      g.restore();
    }
  };

  function dpr() { return Math.min(2, window.devicePixelRatio || 1); }

  // The picture at frame size, drawn once per layout and cut from for every piece
  function makePicture() {
    var d = dpr(), cv = document.createElement('canvas');
    cv.width = Math.round(L.w * d); cv.height = Math.round(L.h * d);
    P.draw(S.pic, cv.getContext('2d'), cv.width, cv.height);
    return cv;
  }
  function tracePath(g, cmds, ox, oy, k) {
    g.beginPath();
    cmds.forEach(function (c) {
      if (c[0] === 'M') g.moveTo(ox + c[1] * k, oy + c[2] * k);
      else if (c[0] === 'L') g.lineTo(ox + c[1] * k, oy + c[2] * k);
      else g.bezierCurveTo(ox + c[1] * k, oy + c[2] * k, ox + c[3] * k, oy + c[4] * k, ox + c[5] * k, oy + c[6] * k);
    });
    g.closePath();
  }
  // One piece as a canvas, its body m pixels in from each side so the knobs fit, at scale k
  function pieceCanvas(i, k) {
    var d = dpr(), m = L.m, W = (L.cw + 2 * m) * k, H = (L.ch + 2 * m) * k;
    var cv = document.createElement('canvas');
    cv.width = Math.ceil(W * d); cv.height = Math.ceil(H * d);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    var g = cv.getContext('2d'), c = i % S.cols, r = Math.floor(i / S.cols);
    g.scale(d * k, d * k);
    var path = E.outline(E.edges(S.cut, i), L.cw, L.ch);
    tracePath(g, path, m, m, 1);
    g.save();
    g.clip();
    g.drawImage(pic, (c * L.cw - m) * d, (r * L.ch - m) * d, (L.cw + 2 * m) * d, (L.ch + 2 * m) * d, 0, 0, L.cw + 2 * m, L.ch + 2 * m);
    g.restore();
    // a light rim and a dark one, so a piece reads as a piece on any part of the picture
    g.lineJoin = 'round';
    g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 1.6 / k; g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 0.7 / k; g.stroke();
    return cv;
  }
  function trayScale() { return Math.min(1, (TRAY_H - 8) / (L.ch + 2 * L.m)); }

  function drawGrid() {
    var d = dpr();
    grid.width = Math.round(L.w * d); grid.height = Math.round(L.h * d);
    grid.style.width = L.w + 'px'; grid.style.height = L.h + 'px';
    var g = grid.getContext('2d');

    for (var i = 0; i < S.count; i++) {
      tracePath(g, E.outline(E.edges(S.cut, i), L.cw, L.ch), (i % S.cols) * L.cw, Math.floor(i / S.cols) * L.ch, 1);
      g.stroke();
    }
  }

  // The room the picture has, shared by the layout and the counts this screen offers
  function room() {
    var r = E.room(ctx.main.clientWidth || window.innerWidth, ctx.main.clientHeight || window.innerHeight, TRAY_W, TRAY_H);
    return [r.w, r.h, r.side];
  }
  // A count this screen does not offer, kept from a bigger window, falls back to the largest it does
  function usable(n) {
    var r = room(), ok = E.offered(r[0], r[1]);
    return ok.indexOf(n) >= 0 ? n : ok[ok.length - 1];
  }
  function layout() {
    var r = room(), availW = r[0];
    L = E.layout(r[0], r[1], S.count);
    side = r[2];
    wrap.classList.toggle('jg-wrap--side', side);
    // beside the frame, the sizes and the mistakes go with the pieces (#516); under it, back around the frame
    if (side) { aside.append(top, tray, status); mid.append(frame, aside); }
    else { aside.remove(); mid.append(frame, tray); wrap.prepend(top); wrap.append(status); }
    frame.style.width = L.w + 'px';
    frame.style.height = L.h + 'px';
    if (side) {
      // two to four pieces across, as many as the width the frame leaves will take
      var slotW = (L.cw + 2 * L.m) * trayScale() + 6;
      var spare = (ctx.main.clientWidth || window.innerWidth) - L.w - E.GAP - 24;
      var cols = Math.max(2, Math.min(4, Math.floor((spare - 22) / slotW)));
      aside.style.width = Math.ceil(cols * slotW + 22) + 'px';
      aside.style.height = L.h + 'px';
      tray.style.width = '';
      tray.style.height = '';
      tray.style.maxWidth = '';
    } else {
      tray.style.width = '';
      tray.style.height = TRAY_H + 'px';
      tray.style.maxWidth = Math.max(L.w, Math.min(availW, 900)) + 'px';
    }
    pic = makePicture();
    drawGrid();
    Object.keys(placedNodes).forEach(function (k) { placedNodes[k].remove(); });
    placedNodes = {};
    S.placed.forEach(function (i) { putInFrame(i, false); });
    buildTray();
    frame.classList.toggle('jg-frame--done', !!S.done);
  }
  function putInFrame(i, flash) {
    var cv = pieceCanvas(i, 1);
    cv.className = 'jg-piece' + (flash ? ' jg-snap' : '');
    cv.style.transform = 'translate(' + ((i % S.cols) * L.cw - L.m) + 'px,' + (Math.floor(i / S.cols) * L.ch - L.m) + 'px)';
    frame.insertBefore(cv, cursor);
    placedNodes[i] = cv;
  }
  function buildTray() {
    tray.innerHTML = '';
    slots = {};
    var k = trayScale();
    S.tray.forEach(function (i) {
      var s = el('div', { class: 'jg-slot', role: 'listitem', 'aria-label': C.t('pieceN', { n: C.num(i + 1) }) }, [pieceCanvas(i, k)]);
      s._piece = i;
      slots[i] = s;
      tray.appendChild(s);
    });
    markSel();
  }
  function render() {
    ctx.setStat('left', C.num(S.tray.length));
    if (!S.done) status.textContent = S.misses ? C.t('wrongs') + ': ' + C.num(S.misses) : '';
  }
  function renderTop() {
    top.innerHTML = '';
    if (dailyDate) top.appendChild(el('span', { class: 'ch-badge', text: C.t('dailyJg') }));
    else {
      var r = room(), counts = E.offered(r[0], r[1]);
      // a game already running at a count this window does not offer keeps its button
      if (counts.indexOf(S.count) < 0) counts = E.COUNTS.filter(function (n) { return n === S.count || counts.indexOf(n) >= 0; });
      top.appendChild(C.ui.segmented(
        counts.map(function (n) { return { value: n, label: C.num(n) }; }),
        S.count,
        function (v) {
          if (v === S.count) return;
          var go = function () { prefs.count = v; ctx.store.set('prefs', prefs); newGame(v); };
          if (S.placed.length && !S.done) {
            C.ui.confirm({ title: C.t('newPicture'), body: C.t('resetWarn'), onOk: go, onCancel: renderTop });
            renderTop();
            return;
          }
          go();
        }
      ));
    }
    top.appendChild(el('span', { class: 'ch-badge', text: C.t('pic_' + S.pic) }));
  }

  /* ------------------------------------------------------------ moves */

  // #407: a piece let go near its spot jumped the last bit into place. Now it
  // glides there from where it was let go, or from the row when placed by
  // keyboard; Chogan.ui.fly does nothing under reduced motion.
  function landed(i, from) {
    E.place(S, i);
    var s = slots[i];
    var src = from || (s && s.firstChild ? s.firstChild.getBoundingClientRect() : null);
    if (s) s.remove();
    delete slots[i];
    putInFrame(i, true);
    if (src) C.ui.fly(placedNodes[i], src, { ms: GLIDE_MS });
    C.feedback('place');
    render();
    if (S.done) { won(); return; }
    save();
  }
  function missed(i) {
    E.miss(S);
    C.feedback('bad');
    if (slots[i]) C.ui.shake(slots[i]);
    render();
    save();
  }

  function won() {
    busy = true;
    sel = -1; aim = -1; showAim();
    save();
    frame.classList.add('jg-frame--done');
    C.feedback('good');
    status.textContent = C.t('doneIt');
    setTimeout(finish, C.ui.reduceMotion() ? 0 : WIN_MS);
  }

  function finish() {
    var elapsed = (pausedAt || Date.now()) - startedAt, n = S.count;
    var base = { 12: 4, 24: 9, 48: 16, 96: 30, 150: 45 }[n];
    var coins = base + (S.misses ? 0 : 3), points = base * 4, note = S.misses ? null : C.t('noWrong');
    C.achievements.unlock('jg-win');
    if (n === 48) C.achievements.unlock('jg-48');
    if (n >= 24 && !S.misses) C.achievements.unlock('jg-clean');
    if (S.daily) {
      coins += 8; points += 25;
      if (!C.stats.daily('jigsaw', S.daily, { label: C.time(elapsed), ms: elapsed, misses: S.misses })) {
        coins = Math.round(coins * 0.2); points = Math.round(points * 0.2);
      }
    } else if (C.stats.best('jigsaw', 'ms' + n, elapsed, true)) {
      note = C.t('bestN', { t: C.time(elapsed) });
    }
    var id = S.pic, got = prefs.done[n] || [];
    if (got.indexOf(id) < 0) got.push(id);
    prefs.done[n] = got; ctx.store.set('prefs', prefs);
    ctx.clearSave();
    ctx.finish({
      won: true, title: C.t('doneIt'), note: note, timeMs: elapsed, coins: coins, points: points,
      lines: [
        S.daily ? { label: C.t('daily'), value: C.num(S.daily) } : { label: C.t('pieces'), value: C.num(n) },
        { label: C.t('wrongs'), value: C.num(S.misses) },
        { label: C.t('time'), value: C.time(elapsed) }
      ],
      shareText: 'چوگان · جورچین' + (S.daily ? ('\nروزانه ' + S.daily) : ('\n' + C.t('piecesN', { n: C.num(n) }))) + '\n' + C.time(elapsed),
      // the card shows the finished picture
      paint: function (g, w, h) {
        var ph = Math.min(h, w * E.ASPECT), pw = ph / E.ASPECT;
        g.save();
        g.translate((w - pw) / 2, (h - ph) / 2);
        C.rrect(g, 0, 0, pw, ph, pw * 0.04);
        g.clip();
        P.draw(id, g, pw, ph);
        g.restore();
      },
      againLabel: S.daily ? null : C.t('newPicture'),
      onAgain: S.daily ? null : function () { newGame(n); }
    });
  }

  /* ---------------------------------------------------------- saving */

  ctx.autosave(function () {
    if (!S || S.done || busy || (!S.placed.length && !S.misses)) return { inProgress: false };
    return { s: { count: S.count, seed: S.seed, pic: S.pic, tray: S.tray, placed: S.placed, misses: S.misses }, daily: S.daily || null, elapsed: (pausedAt || Date.now()) - startedAt };
  });
  function save() { ctx.save(); }

  // A new picture is one not finished yet at this count and never the one just played;
  // the daily one comes from the day's seed
  function newGame(n, daily) {
    var seed, rnd, id;
    if (daily) {
      var dd = C.daily('jigsaw', daily), pool = E.picsFor(n);
      seed = dd.seed; rnd = dd.rng;
      id = pool[Math.floor(rnd() * pool.length)];
    } else {
      seed = Math.floor(Math.random() * 4294967296) >>> 0;
      rnd = C.rng(seed);
      var got = E.pick(n, prefs.done[n], prefs.last, rnd);
      id = got.id;
      prefs.done[n] = got.finished;
      prefs.last = id; ctx.store.set('prefs', prefs);
    }
    S = E.deal(n, seed, rnd, id);
    start(S, daily || null, 0);
    save();
  }
  // The cut comes from the seed after the picture and the order, so a save rebuilds it exactly
  function start(st, daily, elapsed) {
    S = st;
    S.daily = daily;
    var rnd = C.rng(S.seed ^ 0x9e3779b9);
    S.cut = E.cut(S.cols, S.rows, rnd);
    startedAt = Date.now() - elapsed;
    pausedAt = 0; busy = false; sel = -1; aim = -1;
    status.textContent = '';
    renderTop();
    layout();
    render();
    showAim();
  }

  function askNew() {
    if (!S || busy || S.daily) return;
    if (S.done || !S.placed.length) { newGame(S.count); return; }
    C.ui.confirm({ title: C.t('newPicture'), body: C.t('resetWarn'), onOk: function () { newGame(S.count); } });
  }

  /* ------------------------------------------------------- dialogs */

  function showPreview() {
    if (!S) return;
    var w = Math.min(260, window.innerWidth - 120), h = Math.round(w * E.ASPECT), d = dpr();
    var cv = document.createElement('canvas');
    cv.width = Math.round(w * d); cv.height = Math.round(h * d);
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    cv.className = 'jg-preview';
    P.draw(S.pic, cv.getContext('2d'), cv.width, cv.height);
    C.ui.modal({ title: C.t('pic_' + S.pic), body: [cv], actions: [{ label: C.t('done'), kind: 'primary' }] });
  }

  function showHelp() {
    var m = C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [
          kb('← →', C.t('keysPick')),
          kb('Enter / Space', C.t('keysLift')),
          kb('← ↑ → ↓', C.t('keysAim')),
          kb('Esc', C.t('keysCancel')),
          kb('P', C.t('preview')),
          kb('R', C.t('newPicture'))
        ])
      ],
      actions: [
        { label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } },
        { label: C.t('done'), kind: 'primary' }
      ]
    });
    if (m && m.box) { m.box.scrollTop = 0; setTimeout(function () { m.box.scrollTop = 0; }, 80); }
  }
  function kb(k, what) {
    return el('div', { class: 'ch-item' }, [
      el('div', { class: 'ch-item__label', text: what }),
      el('span', { class: 'ch-badge', text: k })
    ]);
  }

  // Tutorial art: a frame with a piece missing and the piece rising from the row toward it
  function tPiece(x, y, s, e, fill) {
    var cmds = E.outline(e, s, s), d = '';
    cmds.forEach(function (c) { d += c[0] + c.slice(1).map(function (v, j) { return (j % 2 ? y : x) + v; }).join(' ') + ' '; });
    return '<path d="' + d + 'Z" fill="' + fill + '" stroke="var(--c-text-faint)" stroke-width="1.2"/>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'),
      art: '<svg viewBox="0 0 200 110" width="100%" class="jg-tut">' +
        '<rect x="62" y="4" width="76" height="60" rx="4" fill="var(--c-surface-2)" stroke="var(--c-line)"/>' +
        tPiece(64, 6, 24, { top: 0, right: 1, bottom: -1, left: 0 }, 'var(--game-soft)') +
        tPiece(112, 6, 24, { top: 0, right: 0, bottom: 1, left: -1 }, 'var(--game-soft)') +
        '<rect x="40" y="82" width="120" height="26" rx="6" fill="var(--c-surface)" stroke="var(--c-line)"/>' +
        tPiece(88, 86, 16, { top: 0, right: 1, bottom: -1, left: -1 }, 'var(--game)') +
        '<path d="M96 80V48M90 54l6-6 6 6" fill="none" stroke="var(--game)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>' },
    { title: C.t('tutTitle2'), text: C.t('tutText2'),
      art: '<svg viewBox="0 0 200 110" width="100%" class="jg-tut">' +
        '<path d="M58 55S76 30 100 30 142 55 142 55 124 80 100 80 58 55 58 55Z" fill="none" stroke="var(--game)" stroke-width="5" stroke-linejoin="round"/>' +
        '<circle cx="100" cy="55" r="11" fill="var(--game)"/></svg>' }
  ];

  /* ------------------------------------------------------------ input */

  // A finger on a piece in the row: sideways it scrolls the row (the browser does that), up it lifts;
  // in the column beside the frame it is the other way round
  tray.addEventListener('pointerdown', function (e) {
    if (!S || S.done || busy || drag) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    var s = e.target.closest ? e.target.closest('.jg-slot') : null;
    if (!s) return;
    var r = s.getBoundingClientRect(), k = trayScale();
    drag = { id: e.pointerId, piece: s._piece, slot: s, x0: e.clientX, y0: e.clientY, gx: (e.clientX - r.left) / k, gy: (e.clientY - r.top) / k, node: null, mouse: e.pointerType === 'mouse' };
  });
  window.addEventListener('pointermove', function (e) {
    if (!drag || drag.id !== e.pointerId) return;
    if (!drag.node) {
      var dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
      if (Math.hypot(dx, dy) < LIFT_PX) return;
      // a touch must move across the way the row scrolls; a mouse may lift any way
      if (!drag.mouse && (side ? Math.abs(dx) < Math.abs(dy) : Math.abs(dy) < Math.abs(dx))) { drag = null; return; }
      lift();
    }
    moveFloat(e.clientX, e.clientY);
    e.preventDefault();
  }, { passive: false });
  function lift() {
    var cv = pieceCanvas(drag.piece, 1);
    cv.className = 'jg-float';
    document.body.appendChild(cv);
    drag.node = cv;
    drag.slot.classList.add('jg-slot--away');
    try { tray.setPointerCapture(drag.id); } catch (err) { /* older WebViews */ }
    C.haptic('tap');
  }
  function moveFloat(x, y) {
    drag.node.style.transform = 'translate(' + (x - drag.gx) + 'px,' + (y - drag.gy) + 'px)';
    drag.x = x; drag.y = y;
  }
  function endDrag(e, fire) {
    if (!drag || drag.id !== e.pointerId) return;
    var d = drag;
    drag = null;
    if (!d.node) return;
    var at = d.node.getBoundingClientRect();
    d.node.remove();
    d.slot.classList.remove('jg-slot--away');
    if (!fire) return;
    var fr = frame.getBoundingClientRect();
    // where the piece's body corner came to rest, in frame pixels
    var bx = d.x - d.gx + L.m - fr.left, by = d.y - d.gy + L.m - fr.top;
    var inside = bx + L.cw > 0 && by + L.ch > 0 && bx < L.w && by < L.h;
    if (E.fits(S, d.piece, bx, by, L.cw, L.ch)) landed(d.piece, at);
    else if (inside) missed(d.piece);
  }
  window.addEventListener('pointerup', function (e) { endDrag(e, true); });
  window.addEventListener('pointercancel', function (e) { endDrag(e, false); });
  // a mouse wheel scrolls the row sideways; the column scrolls by itself
  tray.addEventListener('wheel', function (e) {
    if (!side && Math.abs(e.deltaY) > Math.abs(e.deltaX)) { tray.scrollLeft += e.deltaY; e.preventDefault(); }
  }, { passive: false });

  // Keyboard: ← → pick a piece in the row, Enter lifts it, the arrows aim at a cell, Enter drops
  // The loose pieces move like the cursor in the frame: up and down by a row, left and
  // right along the row and stopping at its ends. Up and down did nothing in the column
  // beside the frame, and left and right ran on into the next row (#556).
  function trayStep(at, n, cols, dx, dy) {
    var r = Math.floor(at / cols), c = at % cols, rows = Math.ceil(n / cols);
    r = Math.max(0, Math.min(rows - 1, r + dy));
    var inRow = Math.min(cols, n - r * cols);
    c = Math.max(0, Math.min(inRow - 1, c + dx));
    return r * cols + c;
  }
  // pieces in a row, read from the layout: one long row under the frame, a few beside it
  function trayCols() {
    var kids = tray.children, n = kids.length;
    if (n < 2) return 1;
    var top = kids[0].offsetTop, c = 1;
    while (c < n && kids[c].offsetTop === top) c++;
    return c;
  }
  function markSel() {
    Object.keys(slots).forEach(function (k) { slots[k].classList.toggle('jg-slot--sel', +k === sel); });
    if (sel >= 0 && slots[sel] && slots[sel].scrollIntoView) slots[sel].scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
  function showAim() {
    if (aim < 0 || !L) { cursor.style.display = 'none'; return; }
    cursor.style.display = 'block';
    cursor.style.left = (aim % S.cols) * L.cw + 'px';
    cursor.style.top = Math.floor(aim / S.cols) * L.ch + 'px';
    cursor.style.width = L.cw + 'px';
    cursor.style.height = L.ch + 'px';
  }
  window.addEventListener('keydown', function (e) {
    if (!S || S.done || busy) return;
    if (document.querySelector('.ch-scrim')) return;
    var tg = e.target, tag = tg && tg.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (tg && tg.isContentEditable)) return;
    if (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key;
    if (C.keyIs(e, 'p')) { showPreview(); e.preventDefault(); return; }
    if (C.keyIs(e, 'r')) { askNew(); e.preventDefault(); return; }
    if (k === 'Escape' && lifted) { lifted = false; aim = -1; showAim(); e.preventDefault(); return; }
    // the frame and the row are not mirrored, so the arrows are geometric in every language
    var d = { ArrowUp: [0, -1], ArrowRight: [1, 0], ArrowDown: [0, 1], ArrowLeft: [-1, 0] }[k];
    if (d) {
      e.preventDefault();
      if (lifted) {
        var c = aim % S.cols, r = Math.floor(aim / S.cols);
        c = Math.max(0, Math.min(S.cols - 1, c + d[0]));
        r = Math.max(0, Math.min(S.rows - 1, r + d[1]));
        aim = r * S.cols + c;
        showAim();
        return;
      }
      var at = S.tray.indexOf(sel);
      at = at < 0 ? 0 : trayStep(at, S.tray.length, trayCols(), d[0], d[1]);
      sel = S.tray[at];
      C.feedback('select');
      markSel();
      return;
    }
    if (k === 'Enter' || k === ' ') {
      e.preventDefault();
      if (sel < 0 || S.tray.indexOf(sel) < 0) { sel = S.tray[0]; markSel(); return; }
      if (!lifted) {
        lifted = true;
        aim = 0;
        while (aim < S.count && S.placed.indexOf(aim) >= 0) aim++;
        if (aim >= S.count) aim = 0;
        showAim();
        C.feedback('select');
        return;
      }
      var p = sel;
      lifted = false;
      if (E.fitsCell(S, p, aim)) {
        var next = S.tray[(S.tray.indexOf(p) + 1) % S.tray.length];
        aim = -1; showAim();
        landed(p);
        sel = S.done ? -1 : next;
        markSel();
      } else {
        aim = -1; showAim();
        missed(p);
      }
    }
  });

  // time in the background is not time spent on the picture
  C.onPause(function () { if (!pausedAt) pausedAt = Date.now(); });
  C.onResume(function () {
    if (pausedAt) startedAt += Date.now() - pausedAt;
    pausedAt = 0;
  });

  var resizeT = null, lastW = 0, lastH = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(function () {
      if (!S || drag) return;
      // a phone's address bar sliding in and out is not a new layout
      if (Math.abs(window.innerWidth - lastW) < 2 && Math.abs(window.innerHeight - lastH) < 60) return;
      lastW = window.innerWidth; lastH = window.innerHeight;
      layout();
      // a window made bigger or smaller can offer more or fewer counts
      if (!dailyDate) renderTop();
      showAim();
    }, 150);
  });

  /* ------------------------------------------------------------ start */

  lastW = window.innerWidth; lastH = window.innerHeight;
  var saved = ctx.loadSave();
  // a save that fails its checks is dropped and a fresh picture is dealt
  var resume = saved && saved.s && (saved.daily || null) === (dailyDate || null) ? E.restore(saved.s) : null;
  if (resume && !resume.done) {
    start(resume, saved.daily || null, saved.elapsed || 0);
  } else if (dailyDate) {
    newGame(E.DAILY_COUNT, dailyDate);
    if (C.stats.dailyDone('jigsaw', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).jigsaw;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec.label });
    }
  } else {
    newGame(usable(prefs.count));
  }
  ctx.tutorialIfNew(TUT);
  // the first layout can run before the page has its final height: lay out again once it settles
  setTimeout(function () { if (S && !drag) layout(); }, 60);
})();
</script>
</body>
</html>
