     because the board itself is red and green. */

  .dt-top { display: flex; gap: var(--s-2); flex-wrap: wrap; justify-content: center; width: 100%; max-width: 560px; }

  .dt-players { width: 100%; max-width: 560px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--s-2); }
  .dt-player {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: 'name rem' 'darts darts';
    align-items: center; gap: 4px 8px; min-width: 0;
    background: var(--c-surface); border-radius: var(--r-md); padding: 6px 12px;
    box-shadow: var(--sh-1); border: 2px solid transparent;
    transition: border-color var(--t-mid) var(--ease), transform var(--t-mid) var(--ease);
  }
  .dt-player--on { border-color: var(--pc); transform: translateY(-2px); box-shadow: var(--sh-2); }
  .dt-player__name { grid-area: name; display: flex; align-items: center; gap: 6px; min-width: 0; font-weight: 700; font-size: var(--fs-sm); }
  .dt-player__name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dt-player__dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 12px; background: var(--pc); }
  .dt-player__rem { grid-area: rem; font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .dt-player__darts { grid-area: darts; display: flex; gap: 4px; min-height: 20px; }
  .dt-player__darts b { flex: 1; min-width: 0; text-align: center; font-size: var(--fs-xs); font-weight: 700; border-radius: 6px; padding: 1px 4px; background: var(--c-surface-2); color: var(--c-text-dim); direction: ltr; }

  .dt-player__darts--last b { opacity: .75; }

<script>
/* ==== ENGINE START ==== */
function DartsEngineFactory() {
  'use strict';

  // Numbers clockwise from the top, as on every standard board
  var ORDER = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
  // Ring edges as fractions of the double ring's outer edge (170 mm on a real board)
  var R = { bull: 6.35 / 170, outer: 15.9 / 170, tIn: 99 / 170, tOut: 107 / 170, dIn: 162 / 170, dOut: 1 };

  function mk(n, m) {
    var label = !m ? 'MISS' : n === 25 ? (m === 2 ? 'BULL' : '25') : (m === 3 ? 'T' : m === 2 ? 'D' : 'S') + n;
    return { n: n, m: m, score: n * m, label: label };
  }

  // What a dart at (x, y) scores; the board's centre is (0, 0), y points down
  function hit(x, y) {
    var r = Math.hypot(x, y);
    if (r <= R.bull) return mk(25, 2);
    if (r <= R.outer) return mk(25, 1);
    if (r > R.dOut) return mk(0, 0);
    var ang = Math.atan2(x, -y) * 180 / Math.PI;
    var n = ORDER[Math.floor(((ang + 369) % 360) / 18)];
    return mk(n, r >= R.dIn ? 2 : (r >= R.tIn && r <= R.tOut ? 3 : 1));
  }

  // The middle of a bed, where a player aims for it
  function aimPoint(label) {
    if (label === 'BULL') return [0, 0];
    if (label === '25') return [0, -(R.bull + R.outer) / 2];
    var m = label[0], n = +label.slice(1), i = ORDER.indexOf(n), a = i * 18 * Math.PI / 180;
    var r = m === 'T' ? (R.tIn + R.tOut) / 2 : m === 'D' ? (R.dIn + R.dOut) / 2 : (R.tOut + R.dIn) / 2;
    return [r * Math.sin(a), -r * Math.cos(a)];
  }

  var THROWS = [];
  for (var t = 20; t >= 1; t--) THROWS.push(mk(t, 3));
  THROWS.push(mk(25, 2), mk(25, 1));
  for (t = 20; t >= 1; t--) THROWS.push(mk(t, 1));
  for (t = 20; t >= 1; t--) THROWS.push(mk(t, 2));
  // Finishing doubles, the ones players like best first
  var DOUBLES = [20, 16, 18, 12, 10, 8, 14, 6, 4, 2, 19, 17, 15, 13, 11, 9, 7, 5, 3, 1].map(function (n) { return mk(n, 2); });
  DOUBLES.push(mk(25, 2));

  // A way to finish rem with at most `darts` darts, the last one a double (the
  // bull counts as one), as labels; null when there is none
  function checkout(rem, darts) {
    if (rem < 2 || rem > 170) return null;
    for (var k = 1; k <= darts; k++) {
      for (var d = 0; d < DOUBLES.length; d++) {
        var need = rem - DOUBLES[d].score;
        if (k === 1) { if (need === 0) return [DOUBLES[d].label]; continue; }
        if (need <= 0) continue;
        for (var a = 0; a < THROWS.length; a++) {
          if (k === 2) { if (THROWS[a].score === need) return [THROWS[a].label, DOUBLES[d].label]; continue; }
          var rest = need - THROWS[a].score;
          if (rest <= 0) continue;
          for (var b = 0; b < THROWS.length; b++) {
            if (THROWS[b].score === rest) return [THROWS[a].label, THROWS[b].label, DOUBLES[d].label];
          }
        }
      }
    }
    return null;
  }

  // players: 1 (the daily, alone) to 2; start: 301 or 501
  function newGame(players, start) {
    var rem = [], thrown = [];
    for (var i = 0; i < players; i++) { rem.push(start); thrown.push(0); }
    return { start: start, rem: rem, thrown: thrown, turn: 0, darts: [], turnStart: start, winner: -1, turns: 0, last: null };
  }

  function copy(S) {
    return {
      start: S.start, rem: S.rem.slice(), thrown: S.thrown.slice(), turn: S.turn, darts: S.darts.slice(),
      turnStart: S.turnStart, winner: S.winner, turns: S.turns, last: S.last
    };
  }

  // One dart. A turn is three darts; it ends early on a bust (below zero, on
  // one, or on zero without a double: the score goes back to the turn's start)
  // or on the win.
  function throwDart(S, h) {
    if (S.winner >= 0) return null;
    var N = copy(S), me = N.turn, left = N.rem[me] - h.score, bust = false;
    N.thrown[me]++;
    N.darts.push(h.label);
    if (left < 0 || left === 1 || (left === 0 && h.m !== 2)) bust = true;
    else N.rem[me] = left;
    if (!bust && left === 0) N.winner = me;
    var over = bust || N.winner >= 0 || N.darts.length === 3;
    if (over) {
      N.last = { seat: me, darts: N.darts, bust: bust, total: bust ? 0 : N.turnStart - N.rem[me] };
      if (bust) N.rem[me] = N.turnStart;
      if (N.winner < 0) {
        N.turn = (me + 1) % N.rem.length;
        N.darts = [];
        N.turnStart = N.rem[N.turn];
        N.turns++;
      }
    }
    return { state: N, bust: bust, won: N.winner >= 0, over: over };
  }

  // Where a bot aims: a finish when it has one, treble 20 while far away, and
  // otherwise a throw that leaves a double it likes.
  var LEAVES = [32, 40, 16, 36, 24, 20, 8, 12, 28, 4];
  function think(S) {
    var rem = S.rem[S.turn], co = checkout(rem, 3 - S.darts.length);
    if (co) return co[0];
    if (rem - 60 >= 42) return 'T20';
    var best = 'T20', bestV = -1;
    for (var i = 0; i < THROWS.length; i++) {
      var th = THROWS[i], leave = rem - th.score;
      if (leave < 2 || th.m === 2) continue;
      var k = LEAVES.indexOf(leave), v = k >= 0 ? 20 - k : (checkout(leave, 1) ? 5 : (checkout(leave, 2) ? 2 : 0));
      // a single is the safer throw, so it wins a tie
      v += th.m === 1 ? 0.5 : 0;
      if (v > bestV) { bestV = v; best = th.label; }
    }
    return best;
  }

  // Scatter of a thrown dart, as a standard deviation in board radii: a 501
  // takes a median of about 53, 33 and 22 darts
  var SPREAD = { easy: 0.2, medium: 0.11, hard: 0.07 };

  function gauss(rnd) {
    var u = Math.max(1e-9, rnd()), v = rnd();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  // A dart thrown at (x, y) with the given spread
  function land(x, y, sigma, rnd) {
    var px = x + gauss(rnd) * sigma, py = y + gauss(rnd) * sigma;
    return { x: px, y: py, hit: hit(px, py) };
  }

  // How a dart is drawn, in board radii. The first drawing was 0.19 long with a
  // 0.026 barrel, and on a phone the owner could barely see it (#358).
  var DART = { barrel: 0.2, shaft: 0.1, width: 0.06, fin: 0.17 };
  // Where a thrown dart is at time t (0..1) on its way from the hand (x0, y0) to
  // the board (x1, y1): a straight run with a lift of h at the middle, so it rises
  // and drops in, like a real throw rather than the first straight line (#358).
  // Returns the point and the direction of travel (radians, 0 = straight up).
  function arc(t, x0, y0, x1, y1, h) {
    var x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t - 4 * h * t * (1 - t);
    var dx = x1 - x0, dy = (y1 - y0) - 4 * h * (1 - 2 * t);
    return { x: x, y: y, dir: Math.atan2(dx, -dy) };
  }

  // The aiming bars (#372): where a bar is after u sweeps, running from -1 to 1
  // and straight back at an even speed, so stopping it is timing, not luck
  function sweep(u) {
    var f = u - Math.floor(u / 2) * 2;
    return f < 1 ? -1 + 2 * f : 3 - 2 * f;
  }

  var api = {
    ORDER: ORDER, R: R, SPREAD: SPREAD, hit: hit, aimPoint: aimPoint, checkout: checkout,
    newGame: newGame, copy: copy, throwDart: throwDart, think: think, land: land, mk: mk,
    DART: DART, arc: arc, sweep: sweep
  };
  if (typeof self !== 'undefined') self.DartsEngine = api;
  return api;
}
if (typeof module !== 'undefined' && module.exports) module.exports = DartsEngineFactory;
/* ==== ENGINE END ==== */
</script>

  /* ------------------------------------------------------------ setup */

  function label(h) {

  function paintBoard(g, W, o) {
    var cx = W / 2, cy = W / 2, rb = W / 2 * 0.78, R = E.R;
    g.save();
    g.translate(cx, cy);
    g.beginPath(); g.arc(0, 0, W / 2, 0, Math.PI * 2); g.fillStyle = BOARD.ring; g.fill();
    var ring = function (r0, r1, colA, colB) {

    for (var i = 0; i < 20; i++) {
      var a = (i * 18 - 9 - 90) * Math.PI / 180;
      g.beginPath(); g.moveTo(Math.cos(a) * R.outer * rb, Math.sin(a) * R.outer * rb); g.lineTo(Math.cos(a) * rb, Math.sin(a) * rb); g.stroke();

    g.fillStyle = '#F4F1EA';
    g.font = '700 ' + Math.round(W * 0.05) + 'px Vazirmatn, system-ui, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.direction = 'ltr';
    for (i = 0; i < 20; i++) {
      var b = (i * 18 - 90) * Math.PI / 180;
      g.fillText(C.num(E.ORDER[i]), Math.cos(b) * rb * 1.14, Math.sin(b) * rb * 1.14);
    }
    // darts of this turn
    var col = colors();
    (o.marks || []).forEach(function (m) { paintDart(g, m.x * rb, m.y * rb, col.c[m.seat] || col.c[0], 1, 0, rb); });
    // what each dart scored, on a tag beside it, so a bull reads as 50 (#404)
    if (o.scores) {
      var placed = [];
      (o.marks || []).forEach(function (m) { if (m.score != null) paintScore(g, m.x * rb, m.y * rb, m.score, col.c[m.seat] || col.c[0], rb, placed); });
    }

    }

  // darts close together (three in the bull) would stack their tags, so a tag

    var w = g.measureText(t).width + fs * 0.8, h = fs * 1.35;
    // beside the point, away from the barrel that rises above it
    var px = x + rb * 0.07, py = y + rb * 0.02;
    if (px + w > rb * 1.25) px = x - rb * 0.07 - w;
    for (var i = 0; i < placed.length; i++) {
      var q = placed[i];
      if (px < q.x + q.w && q.x < px + w && py < q.y + q.h && q.y < py + h) { py = q.y + q.h + 2; i = -1; }
    }
    placed.push({ x: px, y: py, w: w, h: h });
    g.fillStyle = colour;
    g.strokeStyle = 'rgba(0,0,0,.55)'; g.lineWidth = 1.5;
    g.beginPath();
    if (g.roundRect) g.roundRect(px, py, w, h, h / 2); else g.rect(px, py, w, h);
    g.fill(); g.stroke();
    g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(t, px + w / 2, py + h / 2 + fs * 0.05);
    g.restore();
  }

  // A dart seen from the thrower's side: the point in the board, the barrel with
  // its grip rings rising from it, the shaft, and four flights end-on as an X in
  // the player's colour with a dark outline, so it reads on every bed.
  function paintDart(g, x, y, colour, scale, tilt, rb) {
    var D = E.DART, u = rb * scale, w = D.width * u, bl = D.barrel * u, sl = D.shaft * u, fin = D.fin * u;
    g.save();
    g.translate(x, y);
    g.rotate(tilt || 0);
    g.lineJoin = 'round'; g.lineCap = 'round';
    g.fillStyle = 'rgba(0,0,0,.28)';
    g.beginPath(); g.ellipse(w * 0.5, w * 0.35, w * 0.7, w * 0.4, 0, 0, Math.PI * 2); g.fill();
    // shaft and flights first, so the barrel sits in front of them
    var ty = -bl - sl;
    g.strokeStyle = '#1C1B1A'; g.lineWidth = w * 0.55;
    g.beginPath(); g.moveTo(0, -bl); g.lineTo(0, ty); g.stroke();
    [-1, 1].forEach(function (side) {
      g.beginPath();
      g.moveTo(0, ty + fin * 0.15);
      g.lineTo(side * fin * 0.95, ty - fin * 0.55);
      g.quadraticCurveTo(side * fin * 1.05, ty - fin * 1.05, side * fin * 0.55, ty - fin * 0.95);
      g.closePath();
      g.fillStyle = colour; g.fill();
      g.strokeStyle = '#1C1B1A'; g.lineWidth = Math.max(1.2, w * 0.22); g.stroke();
    });
    g.beginPath();
    g.moveTo(0, ty + fin * 0.1); g.lineTo(0, ty - fin * 1.0);
    g.strokeStyle = '#1C1B1A'; g.lineWidth = Math.max(1.5, w * 0.35); g.stroke();
    // barrel: a dark outline, steel body and grip rings
    g.fillStyle = '#1C1B1A';
    g.beginPath(); g.ellipse(0, -bl / 2, w * 0.62, bl / 2 + w * 0.12, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#C9CED4';
    g.beginPath(); g.ellipse(0, -bl / 2, w * 0.45, bl / 2, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#6B7077'; g.lineWidth = Math.max(0.8, w * 0.14);
    for (var k = 1; k <= 3; k++) {
      var ry = -bl * (0.25 + k * 0.14);
      g.beginPath(); g.moveTo(-w * 0.4, ry); g.lineTo(w * 0.4, ry); g.stroke();
    }
    g.fillStyle = 'rgba(255,255,255,.75)';
    g.beginPath(); g.ellipse(-w * 0.18, -bl * 0.55, w * 0.1, bl * 0.28, 0, 0, Math.PI * 2); g.fill();
    g.restore();
  }

  function paintSight(g, x, y, W) {
    var r = W * 0.035;
    g.lineWidth = Math.max(2, W / 160);
    g.strokeStyle = 'rgba(0,0,0,.6)';
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke();
    g.lineWidth = Math.max(1.2, W / 260);
    g.strokeStyle = '#FFFFFF';
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke();
    g.beginPath(); g.moveTo(x - r * 1.5, y); g.lineTo(x - r * 0.5, y); g.moveTo(x + r * 0.5, y); g.lineTo(x + r * 1.5, y);
    g.moveTo(x, y - r * 1.5); g.lineTo(x, y - r * 0.5); g.moveTo(x, y + r * 0.5); g.lineTo(x, y + r * 1.5); g.stroke();
    g.fillStyle = '#FFFFFF'; g.beginPath(); g.arc(x, y, Math.max(1.5, W / 300), 0, Math.PI * 2); g.fill();
  }

  // The two aiming lines across the whole board, white over a dark edge so they
  // read on every bed; once both run, a sight marks where they cross
  function paintBars(g, b, rb, W) {
    var e = W / 2, lw = Math.max(2, W / 170);
    var line = function (x0, y0, x1, y1) {
      g.lineWidth = lw * 2.4; g.strokeStyle = 'rgba(0,0,0,.55)';
      g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
      g.lineWidth = lw; g.strokeStyle = '#FFFFFF';
      g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    };
    // kept inside the round board: the canvas is square, and the first draft's
    // lines ran on into its empty corners, over the page
    g.save();
    g.beginPath(); g.arc(0, 0, e, 0, Math.PI * 2); g.clip();
    line(b.x * rb, -e, b.x * rb, e);
    if (b.y != null) line(-e, b.y * rb, e, b.y * rb);
    g.restore();
    if (b.y != null) paintSight(g, b.x * rb, b.y * rb, W);
  }

  // The hand's wobble at time t (ms): two slow waves on each axis, never still
  function wobble(t) {
    var s = t / 1000;
    return [
      WOBBLE * (Math.sin(1.9 * s) + 0.6 * Math.sin(3.7 * s + 1.3)) / 1.6,
      WOBBLE * (Math.cos(1.5 * s + 0.4) + 0.6 * Math.sin(2.9 * s + 2.1)) / 1.6
    ];
  }
  function sightNow() {
    var base = aiming ? aiming.at : kbAim;
    if (!base) return null;
    var w = C.ui.reduceMotion() ? [0, 0] : wobble(performance.now());
    return [base[0] + w[0], base[1] + w[1]];
  }

  function barsOn() { return prefs.aim === 'bars' && canAim(); }
  // The loop keeps running through a dialog in two-line mode: a dialog makes
  // canAim() false, and a loop stopped there never restarted, so the line
  // stood still while barNow() ran on with the clock (#374)
  function barsRun() { return prefs.aim === 'bars' && G && !G.done && G.phase === 'aim' && !isBot(G.s.turn); }
  function barNow() { return E.sweep(bars.ph + (performance.now() - bars.t0) / BAR_MS) * BAR_REACH; }
  // Each line starts from a random point of its sweep, so the first tap can't
  // be learned as a fixed count
  function barStart(stage, x) { return { stage: stage, x: x, t0: performance.now(), ph: Math.random() * 2 }; }
  function stopBar() {
    if (!barsOn()) return;
    if (!bars) { bars = barStart(0, 0); kick(); return; }
    var v = barNow();
    if (bars.stage === 0) { bars = barStart(1, v); C.feedback('tap'); drawStatus(); kick(); return; }
    release(bars.x, v);
  }

  function draw() {
    if (!G) return;
    if (barsOn() && !bars) bars = barStart(0, 0);
    var B = boardSize(), dpr = Math.min(2, window.devicePixelRatio || 1);
    // both sides: a new canvas is 300×150, so a board exactly 300px wide kept a
    // 150px-high backing and was drawn squashed (#359, seen in Ludo)
    if (cv.width !== B.w * dpr || cv.height !== B.w * dpr) { cv.width = B.w * dpr; cv.height = B.w * dpr; }
    cv.style.width = B.w + 'px'; cv.style.height = B.w + 'px';
    var g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, B.w, B.w);
    var aimBars = bars && barsOn() ? (bars.stage === 0 ? { x: barNow() } : { x: bars.x, y: barNow() }) : null;
    paintBoard(g, B.w, { marks: marks, scores: true, flight: flight, seat: G.s.turn, sight: G.phase === 'aim' && !aimBars ? sightNow() : null, bars: aimBars });
  }
  function loop() {
    raf = 0;
    draw();
    if (G && (flight || (G.phase === 'aim' && (aiming || kbAim)) || barsRun()) && !document.hidden) raf = requestAnimationFrame(loop);
  }
  function kick() { if (!raf) raf = requestAnimationFrame(loop); }

  function cardPaint() {
    var m = marks.slice();
    return function (g, W, H) {
      var side = Math.min(W, H);
      g.translate((W - side) / 2, (H - side) / 2);
      paintBoard(g, side, { marks: m });
    };
  }

  function pname(seat) {
    if (seat === 0) return C.state.profile.name || C.t('you');
    // the level is already on the badge above; on the card it cut the name short
    if (isBot(seat)) return C.t('bot');
    return C.t('playerN', { n: C.num(seat + 1) });
  }

  function drawPlayers() {
    playersRow.innerHTML = '';
    for (var seat = 0; seat < G.s.rem.length; seat++) {
      // The state hands the turn over as the third dart lands, so the visit that
      // just ended is shown from G.s.last; before, the third dart and the bot's
      // whole visit vanished at once (#404).
      var on = G.s.turn === seat && !G.done, last = G.s.last, past = !on && last && last.seat === seat && !(G.s.darts.length && G.s.turn === seat);
      var darts = on ? G.s.darts : (past ? last.darts : []);
      var cells = [];
      // a cell shows what the dart scored; what it hit is its label, on the board and in the status line
      for (var k = 0; k < 3; k++) cells.push(darts[k] ? el('b', { class: 'dt-hit', title: labelOf(darts[k]), 'aria-label': labelOf(darts[k]), text: C.num(scoreOf(darts[k])) }) : el('b', { text: '·' }));
      if (past) cells.push(el('span', { class: 'dt-player__total', text: last.bust ? C.t('bust') : '= ' + C.num(last.total) }));
      var box = el('div', { class: 'dt-player' + (on ? ' dt-player--on' : ''), style: { '--pc': 'var(--dt-c' + seat + ')' } }, [
        el('div', { class: 'dt-player__name' }, [el('i', { class: 'dt-player__dot' }), el('span', { text: pname(seat) })]),
        el('div', { class: 'dt-player__rem', text: C.num(G.s.rem[seat]) }),
        el('div', { class: 'dt-player__darts' + (past ? ' dt-player__darts--last' : '') }, cells)
      ]);
      if (isBot(seat) && on) box.classList.add('dt-thinking');
      playersRow.appendChild(box);
    }
  }

  function drawTop() {
    top.innerHTML = '';
    if (G.daily) {
      top.appendChild(el('span', { class: 'ch-badge ch-badge--accent' },
        [C.icon('calendar', 14), el('span', { text: C.t('dailyDarts') + ' — ' + C.num(G.daily) })]));
      top.appendChild(el('span', { class: 'ch-badge', text: C.t('dailySolo') + ' · ' + C.num(G.s.thrown[0]) + '/' + C.num(DAILY_DARTS) }));
      top.appendChild(aimToggle());
      return;
    }
    var parts = [C.num(G.start), G.mode === 'bot' ? C.t('vsBot') + ' · ' + C.t(G.level) : C.t('people')];
    top.appendChild(el('button', { class: 'ch-badge ch-tap', type: 'button', onclick: askNew, text: parts.join(' · ') }));
    top.appendChild(aimToggle());
  }
  // Switches the aim control at once, mid-turn too; the choice is kept (#372)
  function aimToggle() {
    return el('button', { class: 'ch-badge ch-tap dt-aimmode', type: 'button',
      onclick: function () {
        prefs.aim = prefs.aim === 'bars' ? 'drag' : 'bars';
        ctx.store.set('prefs', prefs);
        bars = null; aiming = null; kbAim = null;
        render(); kick();
      } }, [el('span', { text: C.t('aimMode') + ': ' + C.t(prefs.aim === 'bars' ? 'aimBars' : 'aimDrag') })]);
  }

  var touchSeen = false;
  function drawStatus() {
    var who = G.s.turn === 0 ? C.t('yourTurn') : (isBot(G.s.turn) ? C.t('botThrows', { n: pname(G.s.turn) }) : C.t('turnOf', { n: pname(G.s.turn) }));
    var how = prefs.aim === 'bars' ? (bars && bars.stage === 1 ? 'barY' : 'barX') : (touchSeen ? 'aimTouch' : 'aim');
    statusMain.textContent = G.msg ? G.msg : (G.phase === 'aim' ? (G.mode === 'people' ? who + ' · ' : '') + C.t(how) : who);
    var co = !G.done && !isBot(G.s.turn) ? E.checkout(G.s.rem[G.s.turn], 3 - G.s.darts.length) : null;
    statusHint.textContent = co ? C.t('finish') + ': ' + co.map(labelOf).join(' · ') : (G.s.rem[G.s.turn] <= 170 && !G.done ? C.t('noFinish') : '');
  }

  function render() {
    if (!G) return;
    drawTop();
    drawPlayers();
    drawStatus();
    draw();
    // a new turn starts here, and only kick() starts the loop (#374)
    if (barsRun()) kick();
  }

  /* -------------------------------------------------------------- input */

  // On a touch screen the sight sits above the finger, so the finger never
  // hides where the dart will go.
  function toBoard(e) {
    var r = cv.getBoundingClientRect(), B = boardSize();
    var lift = e.pointerType === 'touch' ? Math.min(70, B.w * 0.16) : 0;
    return [(e.clientX - r.left - B.w / 2) / B.r, (e.clientY - r.top - lift - B.w / 2) / B.r];
  }
  function canAim() { return G && !G.done && G.phase === 'aim' && !isBot(G.s.turn) && !document.querySelector('.ch-scrim'); }

  cv.addEventListener('pointerdown', function (e) {
    if (!canAim()) return;
    e.preventDefault();
    if (prefs.aim === 'bars') { G.msg = ''; stopBar(); return; }
    if (e.pointerType === 'touch' && !touchSeen) { touchSeen = true; drawStatus(); }
    kbAim = null;
    aiming = { id: e.pointerId, at: toBoard(e) };
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* old browsers */ }
    kick();
  });
  cv.addEventListener('pointermove', function (e) {
    if (!aiming || e.pointerId !== aiming.id) return;
    aiming.at = toBoard(e);
  });
  function letGo(e) {
    if (!aiming || e.pointerId !== aiming.id) return;
    var s = sightNow();
    aiming = null;
    if (canAim() && s) release(s[0], s[1]);
  }
  cv.addEventListener('pointerup', letGo);
  cv.addEventListener('pointercancel', function () { aiming = null; draw(); });

  window.addEventListener('keydown', function (e) {
    if (!canAim()) return;
    var k = e.key, step = e.shiftKey ? 0.01 : 0.04;
    if (prefs.aim === 'bars') {
      if (k === ' ' || k === 'Enter') { e.preventDefault(); G.msg = ''; stopBar(); }
      return;
    }
    var mv = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[k];
    if (mv) {
      e.preventDefault();
      if (!kbAim) kbAim = E.aimPoint('T20');
      kbAim = [Math.max(-1.2, Math.min(1.2, kbAim[0] + mv[0])), Math.max(-1.2, Math.min(1.2, kbAim[1] + mv[1]))];
      kick();
      return;
    }
    if (k === ' ' || k === 'Enter') {
      e.preventDefault();
      if (!kbAim) { kbAim = E.aimPoint('T20'); kick(); return; }
      var s = sightNow();
      if (s) release(s[0], s[1]);
    }
  });

  // the board follows its slot, which changes with the window and the side column (#359)
  if (window.ResizeObserver) new ResizeObserver(function () { if (G) draw(); }).observe(boardBox);
  else window.addEventListener('resize', function () { if (G) draw(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && G) kick(); });
  // A pause mid-throw lets that dart land when the game comes back
  C.onPause(function () { stop(); aiming = null; bars = null; });
  C.onResume(function () {
    if (!G || G.done) return;
    if (flight) { var f = flight; landed(f.x, f.y, f.h); return; }
    startTurn();
  });

  /* --------------------------------------------------------------- help */

  function kb(k, what) {
    return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]);
  }
  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('p', { class: 'ch-dim', text: C.t('aimHelp') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [kb('← → ↑ ↓ / Shift', C.t('aimKey')), kb('Space / Enter', C.t('throwKey') + ' · ' + C.t('stopKey'))])
      ],
      actions: [
        { label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } },
        { label: C.t('done'), kind: 'primary' }
      ]
    });
  }

  function art(kind) {
    var s = '<svg viewBox="0 0 220 120" width="100%">';
    var board = '<circle cx="110" cy="60" r="54" fill="#262422"/><circle cx="110" cy="60" r="44" fill="#1F8A4C"/><circle cx="110" cy="60" r="40" fill="#EFDDB8"/>' +
      '<circle cx="110" cy="60" r="27" fill="#C8302A"/><circle cx="110" cy="60" r="23" fill="#1C1B1A"/><circle cx="110" cy="60" r="6" fill="#1F8A4C"/><circle cx="110" cy="60" r="2.6" fill="#C8302A"/>';
    if (kind === 1) {
      s += board + '<circle cx="110" cy="35" r="9" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M110 22v7M110 41v7M97 35h7M116 35h7" stroke="#fff" stroke-width="2.5"/>' +
        '<circle cx="128" cy="96" r="9" fill="var(--c-text-faint)" opacity=".5"/><path d="M128 90L112 40" stroke="var(--c-text-faint)" stroke-width="2" stroke-dasharray="4 4"/>';
    } else if (kind === 2) {
      s += board + '<path d="M110 60L94 9A54 54 0 0 1 126 9z" fill="rgba(255,255,255,.18)"/>' +
        '<text x="180" y="40" font-size="16" font-weight="700" fill="var(--c-text)" direction="ltr">T20 = 60</text><text x="180" y="64" font-size="16" font-weight="700" fill="var(--c-text)" direction="ltr">D20 = 40</text>';
    } else {
      s += board + '<text x="30" y="66" font-size="28" font-weight="800" fill="var(--c-text)" direction="ltr">0</text>' +
        '<path d="M110 60L94 9A54 54 0 0 1 126 9z" fill="none"/><circle cx="110" cy="12" r="5" fill="#2F6FDE" stroke="#fff" stroke-width="2"/>';
    }
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: art(1) },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: art(2) },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: art(3) }
  ];

  /* -------------------------------------------------------------- start */

  var saved = ctx.loadSave();
  if (dailyDate) {
    // The daily game has its own save slot, so a half-played day continues
    if (validSave(saved) && saved.g.daily === dailyDate) restore(saved.g);
    else newGame({ daily: dailyDate });
    if (C.stats.dailyDone('darts', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).darts;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec.label });
    }
    ctx.tutorialIfNew(TUT);
  } else if (validSave(saved) && !saved.g.daily) {
    if (saved.prefs) prefs = saved.prefs;
    restore(saved.g);
  } else {
    newGame(fromPrefs());
    ctx.tutorialIfNew(TUT);
  }
})();
</script>
</body>
</html>
