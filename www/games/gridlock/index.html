<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FBF6EF">
<title>راه‌بندان — چوگان</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../lib/chogan.css">
<style>
  /* The lot is asphalt in both themes and the vehicles keep their paint: four pale neutrals and
     the one red, all drawn in a single ink, so dark mode only deepens the lot and the paint */
  :root {
    --gl-lot: #2F3236; --gl-cell: #373B40; --gl-cell-exit: #383F39; --gl-curb: #9EA1A6; --gl-ink: #1A1816; --gl-glass: #2A2E33;
    --gl-c0: #C6DAE9; --gl-c1: #EFEBE2; --gl-c2: #C9CCD0; --gl-c3: #E5D5B5; --gl-goal: #E34A40; --gl-goal-roof: #C73C33;
    --gl-roof: rgba(255, 255, 255, .38); --gl-slat: rgba(255, 255, 255, .22); --gl-shadow: rgba(0, 0, 0, .42); --gl-mark: rgba(255, 255, 255, .92);
    --gl-concrete: #8F8B85; --gl-concrete-top: #A8A49D; --gl-hint: #9DBB88;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --gl-lot: #232527; --gl-cell: #2A2D30; --gl-cell-exit: #2B312B; --gl-curb: #5F6267; --gl-ink: #121110; --gl-glass: #1D2024;
      --gl-c0: #AEC5D8; --gl-c1: #DBD7CD; --gl-c2: #B3B7BC; --gl-c3: #D0BFA0; --gl-goal: #E3584D; --gl-goal-roof: #C9443B;
      --gl-roof: rgba(255, 255, 255, .3); --gl-slat: rgba(255, 255, 255, .2); --gl-shadow: rgba(0, 0, 0, .5); --gl-mark: rgba(255, 255, 255, .92);
      --gl-concrete: #75716B; --gl-concrete-top: #8B877F; --gl-hint: #9DBB88;
    }
  }
  :root[data-theme="dark"] {
    --gl-lot: #232527; --gl-cell: #2A2D30; --gl-cell-exit: #2B312B; --gl-curb: #5F6267; --gl-ink: #121110; --gl-glass: #1D2024;
    --gl-c0: #AEC5D8; --gl-c1: #DBD7CD; --gl-c2: #B3B7BC; --gl-c3: #D0BFA0; --gl-goal: #E3584D; --gl-goal-roof: #C9443B;
    --gl-roof: rgba(255, 255, 255, .3); --gl-slat: rgba(255, 255, 255, .2); --gl-shadow: rgba(0, 0, 0, .5); --gl-mark: rgba(255, 255, 255, .92);
    --gl-concrete: #75716B; --gl-concrete-top: #8B877F; --gl-hint: #9DBB88;
  }
  .gl-wrap { width: 100%; display: flex; flex-direction: column; align-items: center; gap: var(--s-3); }
  .gl-top { display: flex; flex-wrap: wrap; gap: var(--s-2); justify-content: center; align-items: center; min-height: 28px; }
  /* Upright the badges, the board, the hint button and the line of text stack; on a short, wide
     screen the board takes the left and they stand in a column beside it */
  .gl-side { display: contents; }
  .gl-top { order: 0; } .gl-frame { order: 1; } .gl-actions { order: 2; } .gl-status { order: 3; }
  /* any wide game area, not only a short phone in landscape: a laptop has room beside the lot too (#359) */
  @container game (min-aspect-ratio: 5 / 4) {
    .gl-wrap { flex-direction: row; justify-content: center; align-items: center; gap: var(--s-5); }
    .gl-side { display: flex; flex-direction: column; align-items: center; gap: var(--s-3); max-width: 220px; }
  }
  /* The lot is a physical place: it is not mirrored in RTL, the exit stays on the right */
  .gl-frame { direction: ltr; touch-action: none; user-select: none; -webkit-user-select: none; }
  .gl-board { display: block; cursor: grab; touch-action: none; }
  .gl-lot { fill: var(--gl-lot); }
  .gl-cell { fill: var(--gl-cell); }
  .gl-cell--exit { fill: var(--gl-cell-exit); }
  .gl-curb { fill: none; stroke: var(--gl-curb); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .gl-road { fill: var(--game-soft); }
  /* still, until the red car's road is clear: then they run, the cue to flick it */
  .gl-chev { fill: none; stroke: var(--game); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
  .gl-board--clear .gl-chev { animation: gl-run 1.6s var(--ease) infinite; }
  .gl-board--clear .gl-chev:nth-of-type(2) { animation-delay: .25s; }
  .gl-board--clear .gl-chev:nth-of-type(3) { animation-delay: .5s; }
  @keyframes gl-run { 0% { opacity: .25; } 40% { opacity: 1; } 100% { opacity: .25; } }
  .gl-wall { fill: var(--gl-concrete); stroke: var(--gl-ink); stroke-width: 2.5; stroke-linejoin: round; }
  .gl-wall-top { fill: var(--gl-concrete-top); }
  .gl-hatch { fill: none; stroke: var(--gl-ink); stroke-width: 2.5; stroke-linecap: round; }
  /* A car is drawn lying down, nose to the right, 40 units to a cell; the board turns it */
  .gl-car { transition: transform var(--t-slow) var(--ease); }
  .gl-car--still { transition: none; }
  .gl-car--out { transition: transform calc(var(--t-slow) * 2) ease-in, opacity var(--t-mid) ease-in calc(var(--t-slow) * 1.2); opacity: 0; }
  /* one ink for the outline, the glass, the wheels and the mirrors; the roof is a lighter plate */
  .gl-shadow { fill: var(--gl-shadow); }
  .gl-wheel { fill: var(--gl-ink); }
  .gl-body { stroke: var(--gl-ink); stroke-width: 2.5; stroke-linejoin: round; }
  .gl-roof { fill: var(--gl-roof); }
  .gl-glass { fill: var(--gl-glass); }
  .gl-mirror { fill: var(--gl-ink); }
  .gl-bed { fill: var(--gl-glass); }
  .gl-slat { fill: none; stroke: var(--gl-slat); stroke-width: 2; stroke-linecap: round; }
  .gl-mark { fill: none; stroke: var(--gl-mark); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
  .gl-p0 .gl-body { fill: var(--gl-c0); } .gl-p1 .gl-body { fill: var(--gl-c1); } .gl-p2 .gl-body { fill: var(--gl-c2); } .gl-p3 .gl-body { fill: var(--gl-c3); }
  .gl-pg .gl-body { fill: var(--gl-goal); } .gl-pg .gl-roof { fill: var(--gl-goal-roof); }
  /* The halo and the ghost use the accent and cover the whole vehicle (#244): a hint can't be missed */
  .gl-halo { fill: var(--gl-hint); fill-opacity: 0; stroke: var(--gl-hint); stroke-width: 4; stroke-linejoin: round; stroke-opacity: 0; }
  .gl-car--hint .gl-halo { fill-opacity: .3; stroke-opacity: 1; animation: gl-glow 1.4s var(--ease) infinite; }
  @keyframes gl-glow { 50% { fill-opacity: .14; } }
  /* during a hint the other cars sit under a veil: they are locked until the hinted car has moved */
  .gl-dim { fill: var(--gl-lot); fill-opacity: .45; pointer-events: none; }
  .gl-ghost { fill: var(--gl-hint); fill-opacity: .22; stroke: var(--gl-hint); stroke-width: 3; stroke-dasharray: 8 6; stroke-linejoin: round; pointer-events: none; }
  .gl-cur { fill: none; stroke: var(--gl-hint); stroke-width: 3; stroke-linejoin: round; pointer-events: none; }
  .gl-status { min-height: 1.6em; font-weight: 700; color: var(--c-text-dim); text-align: center; }
  .gl-actions { display: flex; gap: var(--s-2); flex-wrap: wrap; justify-content: center; }
  .gl-off:disabled { opacity: .4; cursor: default; }
  .gl-tut { display: block; }
</style>
</head>
<body>
<script src="../../version.js"></script>
<script src="../../lib/chogan.js"></script>

<script>
/* ==== ENGINE START ==== */
/* Gridlock: a lot of cars and trucks, each sliding along its own lane. The goal car
   (index 0) is horizontal, two cells long and sits in row 2; the exit is in the right
   edge of that row. A car is {h, n, l, p}: h is 1 when it runs left to right, n its
   length, l its lane (the row of a horizontal car, the column of a vertical one) and
   p the first cell along the lane. A drag of any length is one move. The board is
   solved when the goal car stands at column cols - 2.                              */
function GridlockEngineFactory() {
  'use strict';

  // Math.imul and Math.floor are read once: a global lookup in the hot loops is slow in a test sandbox
  var imul = Math.imul, floor = Math.floor;
  var EXIT_ROW = 2, MAXV = 24, MAXW = 2, CAP = 40000, HINT_MOVES = 2, UNDO_MAX = 1500;
  var SLOTS = 1 << 16, SLOT_MASK = SLOTS - 1;
  var DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
  var PROBE_AT = [500, 1000, 1500, 2500, 4000, -1], PROBE_MAX = [1600, 2550, 3400, 4700, 6800];

  function isInt(v) { return typeof v === 'number' && v === floor(v) && isFinite(v); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  /* ----------------------------------------------------- board checks */

  // Is this a sound arrangement? Cars are {h, n, l, p}; walls are cell numbers.
  function sound(rows, cols, walls, cars) {
    var i, k, g;
    if (!isInt(rows) || !isInt(cols) || rows < 5 || rows > 7 || cols < 5 || cols > 7) return false;
    if (!Array.isArray(cars) || cars.length < 2 || cars.length > MAXV || !Array.isArray(walls) || walls.length > MAXW) return false;
    g = [];
    for (i = 0; i < rows * cols; i++) g.push(0);
    for (i = 0; i < walls.length; i++) {
      var w = walls[i];
      if (!isInt(w) || w < 0 || w >= rows * cols || g[w] || floor(w / cols) === EXIT_ROW) return false;
      g[w] = 1;
    }
    for (i = 0; i < cars.length; i++) {
      var c = cars[i];
      if (!c || (c.h !== 0 && c.h !== 1) || (c.n !== 2 && c.n !== 3) || !isInt(c.l) || !isInt(c.p)) return false;
      var dim = c.h ? cols : rows;
      if (c.l < 0 || c.l >= (c.h ? rows : cols) || c.p < 0 || c.p + c.n > dim) return false;
      if (i === 0 ? !(c.h === 1 && c.n === 2 && c.l === EXIT_ROW) : (c.h === 1 && c.l === EXIT_ROW)) return false;
      var cell = c.h ? c.l * cols + c.p : c.p * cols + c.l, st = c.h ? 1 : cols;
      for (k = 0; k < c.n; k++, cell += st) {
        if (g[cell]) return false;
        g[cell] = 1;
      }
    }
    return true;
  }

  function copyCars(cars) { return cars.map(function (c) { return { h: c.h, n: c.n, l: c.l, p: c.p }; }); }
  function positions(cars) { return cars.map(function (c) { return c.p; }); }

  // -1 empty, -2 wall, else the index of the car on the cell
  function grid(S) {
    var g = [], i, k;
    for (i = 0; i < S.rows * S.cols; i++) g.push(-1);
    for (i = 0; i < S.walls.length; i++) g[S.walls[i]] = -2;
    for (i = 0; i < S.cars.length; i++) {
      var c = S.cars[i], cell = c.h ? c.l * S.cols + c.p : c.p * S.cols + c.l, st = c.h ? 1 : S.cols;
      for (k = 0; k < c.n; k++, cell += st) g[cell] = i;
    }
    return g;
  }

  function cellsOf(S, v) {
    var c = S.cars[v], out = [], cell = c.h ? c.l * S.cols + c.p : c.p * S.cols + c.l, st = c.h ? 1 : S.cols;
    for (var k = 0; k < c.n; k++, cell += st) out.push(cell);
    return out;
  }

  /* --------------------------------------------- the whole state space */

  // A position is a number from 0 to 6 per car, three bits each: cars 0 to 9 in one
  // 30 bit word, cars 10 to 19 in a second, cars 20 to 23 in a third, so equal words are
  // the same position and nothing is lost to a hash.
  var spent = 0;   // positions handled by the last explore that gave up
  var W = null;
  function scratch() {
    if (!W) {
      W = { tbl: new Int32Array(SLOTS * 4), lo: new Int32Array(CAP), md: new Int32Array(CAP), hi: new Int32Array(CAP), off: new Int32Array(CAP + 1),
        adj: new Int32Array(1 << 18), mv: new Uint8Array(1 << 18), dist: new Int16Array(CAP), queue: new Int32Array(CAP) };
    }
    return W;
  }
  function grow(Z, need) {
    var size = Z.adj.length;
    while (size < need) size *= 2;
    var a = new Int32Array(size), m = new Uint8Array(size);
    a.set(Z.adj); m.set(Z.mv);
    Z.adj = a; Z.mv = m;
  }
  function slot(lo, md, hi) {
    var x = imul(lo, 0x9E3779B1) ^ imul(md + 0x7F4A7C15, 0x85EBCA6B) ^ imul(hi + 0x165667B1, 0xC2B2AE35);
    return ((x ^ (x >>> 15)) & SLOT_MASK) * 4;
  }
  // the three words of a list of positions
  function words(pos) {
    var w = [0, 0, 0];
    for (var i = 0; i < pos.length; i++) w[(i / 10) | 0] += pos[i] << (3 * (i % 10));
    return w;
  }

  // Bit masks of the cells every car covers at every position, so a position is a few ORs
  function prep(rows, cols, walls, cars) {
    var n = cars.length, G = { n: n, rows: rows, cols: cols, len: new Int32Array(n), dim: new Int32Array(n), shift: new Int32Array(n), word: new Int32Array(n),
      bitA: new Int32Array(n * 8), bitB: new Int32Array(n * 8), mA: new Int32Array(n * 8), mB: new Int32Array(n * 8), wallA: 0, wallB: 0 };
    function bit(c) { return c < 25 ? [1 << c, 0] : [0, 1 << (c - 25)]; }
    walls.forEach(function (c) { var b = bit(c); G.wallA |= b[0]; G.wallB |= b[1]; });
    cars.forEach(function (c, i) {
      var step = c.h ? 1 : cols, base = c.h ? c.l * cols : c.l, dim = c.h ? cols : rows, k, p, q, b;
      G.len[i] = c.n; G.dim[i] = dim; G.shift[i] = 3 * (i % 10); G.word[i] = (i / 10) | 0;
      for (k = 0; k < dim; k++) { b = bit(base + k * step); G.bitA[i * 8 + k] = b[0]; G.bitB[i * 8 + k] = b[1]; }
      for (p = 0; p + c.n <= dim; p++) {
        var a = 0, bb = 0;
        for (q = 0; q < c.n; q++) { b = bit(base + (p + q) * step); a |= b[0]; bb |= b[1]; }
        G.mA[i * 8 + p] = a; G.mB[i * 8 + p] = bb;
      }
    });
    return G;
  }

  // Every position reachable from pos, a slide of any length being one edge, and for each
  // the number of moves to the nearest solved one. null when there are more than cap.
  // The arrays live in scratch(); they hold until the next call.
  function explore(G, pos, cap, probe) {
    var Z = scratch(), n = G.n, tbl = Z.tbl, LO = Z.lo, MD = Z.md, HI = Z.hi, OFF = Z.off, ADJ = Z.adj, MV = Z.mv;
    var len = G.len, dim = G.dim, shift = G.shift, word = G.word, bitA = G.bitA, bitB = G.bitB, mA = G.mA, mB = G.mB;
    var p = new Int32Array(n), i, ec = 0, count = 1, s, pk = 0;
    tbl.fill(0);
    var w0 = words(pos);
    LO[0] = w0[0]; MD[0] = w0[1]; HI[0] = w0[2];
    var s0 = slot(w0[0], w0[1], w0[2]);
    tbl[s0] = w0[0]; tbl[s0 + 1] = w0[1]; tbl[s0 + 2] = w0[2]; tbl[s0 + 3] = 1;
    for (s = 0; s < count; s++) {
      // a board that has found far more positions than it has handled is not going to be small
      if (probe && s === PROBE_AT[pk]) { if (count > PROBE_MAX[pk]) { spent = s; return null; } pk++; }
      OFF[s] = ec;
      var l = LO[s], m = MD[s], h = HI[s], oA = G.wallA, oB = G.wallB;
      for (i = 0; i < n; i++) {
        var wd = word[i], pi = ((wd === 0 ? l : (wd === 1 ? m : h)) >> shift[i]) & 7;
        p[i] = pi;
        oA |= mA[i * 8 + pi]; oB |= mB[i * 8 + pi];
      }
      if (ec + n * 8 > ADJ.length) { grow(Z, ec + n * 8); ADJ = Z.adj; MV = Z.mv; }
      for (i = 0; i < n; i++) {
        var pj = p[i], ln = len[i], sh = shift[i], b8 = i * 8, wi = word[i], dm = dim[i], q, np, nl, nm, nh, idx, t, id;
        for (q = pj - 1; q >= 0; q--) {
          if ((oA & bitA[b8 + q]) | (oB & bitB[b8 + q])) break;
          np = q;
          nl = l; nm = m; nh = h;
          if (wi === 0) nl += (np - pj) << sh; else if (wi === 1) nm += (np - pj) << sh; else nh += (np - pj) << sh;
          idx = slot(nl, nm, nh);
          for (;;) {
            t = tbl[idx + 3];
            if (!t) {
              if (count >= cap) { spent = s; return null; }
              id = count++; LO[id] = nl; MD[id] = nm; HI[id] = nh;
              tbl[idx] = nl; tbl[idx + 1] = nm; tbl[idx + 2] = nh; tbl[idx + 3] = id + 1;
              break;
            }
            if (tbl[idx] === nl && tbl[idx + 1] === nm && tbl[idx + 2] === nh) { id = t - 1; break; }
            idx += 4;
            if (idx >= SLOTS * 4) idx = 0;
          }
          ADJ[ec] = id; MV[ec] = b8 + np; ec++;
        }
        for (q = pj + ln; q < dm; q++) {
          if ((oA & bitA[b8 + q]) | (oB & bitB[b8 + q])) break;
          np = q - ln + 1;
          nl = l; nm = m; nh = h;
          if (wi === 0) nl += (np - pj) << sh; else if (wi === 1) nm += (np - pj) << sh; else nh += (np - pj) << sh;
          idx = slot(nl, nm, nh);
          for (;;) {
            t = tbl[idx + 3];
            if (!t) {
              if (count >= cap) { spent = s; return null; }
              id = count++; LO[id] = nl; MD[id] = nm; HI[id] = nh;
              tbl[idx] = nl; tbl[idx + 1] = nm; tbl[idx + 2] = nh; tbl[idx + 3] = id + 1;
              break;
            }
            if (tbl[idx] === nl && tbl[idx + 1] === nm && tbl[idx + 2] === nh) { id = t - 1; break; }
            idx += 4;
            if (idx >= SLOTS * 4) idx = 0;
          }
          ADJ[ec] = id; MV[ec] = b8 + np; ec++;
        }
      }
    }
    OFF[count] = ec;
    // moves to the nearest solved position, from every solved one at once (a slide undoes itself)
    var D = Z.dist, Q = Z.queue, qn = 0, goalAt = G.cols - 2;
    for (s = 0; s < count; s++) { if ((LO[s] & 7) === goalAt) { D[s] = 0; Q[qn++] = s; } else D[s] = -1; }
    for (var qi = 0; qi < qn; qi++) {
      var u = Q[qi], du = D[u], e1 = OFF[u + 1];
      for (var e = OFF[u]; e < e1; e++) { var v = ADJ[e]; if (D[v] < 0) { D[v] = du + 1; Q[qn++] = v; } }
    }
    return { count: count, edges: ec };
  }

  // the table of the position last explored for a board, kept for the hints and the checks
  var memo = null;
  function sigOf(rows, cols, walls, cars) {
    return rows + 'x' + cols + ':' + walls.join(',') + ':' + cars.map(function (c) { return c.h + '' + c.n + c.l; }).join(',');
  }
  function keep(sig, r) {
    var Z = scratch(), n = r.count;
    memo = { sig: sig, count: n, tbl: new Int32Array(Z.tbl),
      lo: new Int32Array(Z.lo.subarray(0, n)), md: new Int32Array(Z.md.subarray(0, n)), hi: new Int32Array(Z.hi.subarray(0, n)), off: new Int32Array(Z.off.subarray(0, n + 1)),
      adj: new Int32Array(Z.adj.subarray(0, r.edges)), mv: new Uint8Array(Z.mv.subarray(0, r.edges)), dist: new Int16Array(Z.dist.subarray(0, n)) };
  }
  function find(m, pos) {
    var w = words(pos), idx = slot(w[0], w[1], w[2]);
    for (;;) {
      var t = m.tbl[idx + 3];
      if (!t) return -1;
      if (m.tbl[idx] === w[0] && m.tbl[idx + 1] === w[1] && m.tbl[idx + 2] === w[2]) return t - 1;
      idx += 4;
      if (idx >= SLOTS * 4) idx = 0;
    }
  }
  // the table for a board together with the number of the position pos in it; null if the
  // board has more than CAP positions
  function table(rows, cols, walls, cars, pos) {
    var sig = sigOf(rows, cols, walls, cars), id;
    if (memo && memo.sig === sig) {
      id = find(memo, pos);
      if (id >= 0) return { m: memo, id: id };
    }
    var r = explore(prep(rows, cols, walls, cars), pos, CAP);
    if (!r) return null;
    keep(sig, r);
    return { m: memo, id: 0 };
  }

  /* --------------------------------------------------------------- state */

  function defaultLook(n) {
    var out = [];
    for (var i = 0; i < n; i++) out.push((i % 4) * 2 + (i ? i % 2 : 1));
    return out;
  }

  // A board from its starting arrangement. Walls are cell numbers (row * cols + col).
  function make(rows, cols, walls, cars, level, look) {
    if (!sound(rows, cols, walls, cars)) return null;
    var pos = positions(cars), a = table(rows, cols, walls, cars, pos);
    if (!a || a.m.dist[a.id] < 0) return null;
    var S = { level: level || 1, rows: rows, cols: cols, walls: walls.slice(), cars: copyCars(cars), start: pos, best: a.m.dist[a.id],
      moves: 0, stack: [], hint: null, hints: 0, merge: -1, done: false,
      look: Array.isArray(look) && look.length === cars.length ? look.slice() : defaultLook(cars.length) };
    S.done = solved(S);
    return S;
  }

  function solved(S) { return S.cars[0].p === S.cols - 2; }

  // The free stretch of the lane a car can slide along: positions lo to hi
  function range(S, v) {
    var c = S.cars[v], g = grid(S), step = c.h ? 1 : S.cols, base = c.h ? c.l * S.cols : c.l, dim = c.h ? S.cols : S.rows;
    var lo = c.p, hi = c.p;
    while (lo > 0 && g[base + (lo - 1) * step] === -1) lo--;
    while (hi + c.n < dim && g[base + (hi + c.n) * step] === -1) hi++;
    return { lo: lo, hi: hi };
  }

  // With a hint running only the hinted car may move

      for (c = 0; c < S.cols; c++) {
        svg.appendChild(sv('rect', { class: 'gl-cell' + (r === E.EXIT_ROW ? ' gl-cell--exit' : ''), x: c * U + 2, y: r * U + 2, width: U - 4, height: U - 4, rx: 7 }));
      }
    }
    // the kerb runs all the way round except for the opening in the exit row
    svg.appendChild(sv('path', { class: 'gl-curb', d: 'M' + W + ' ' + y1 + 'V' + R + 'Q' + W + ' 0 ' + (W - R) + ' 0H' + R + 'Q0 0 0 ' + R + 'V' + (H - R) +
      'Q0 ' + H + ' ' + R + ' ' + H + 'H' + (W - R) + 'Q' + W + ' ' + H + ' ' + W + ' ' + (H - R) + 'V' + y2 }));
    svg.appendChild(sv('rect', { class: 'gl-road', x: W, y: 2 * U + 4, width: ROAD, height: U - 8, rx: 12 }));
    for (var k = 0; k < 3; k++) {
      var x = W + 11 + k * 12, y = 2.5 * U;
      svg.appendChild(sv('path', { class: 'gl-chev', d: 'M' + (x - 4) + ' ' + (y - 8) + 'L' + (x + 4) + ' ' + y + 'L' + (x - 4) + ' ' + (y + 8) }));
    }
    S.walls.forEach(function (cell) { svg.appendChild(wallNode(cell)); });
    layerCars = sv('g', {}); layerOver = sv('g', {});
    dim = null; ghost = null; dimFor = -1;
    svg.appendChild(layerCars); svg.appendChild(layerOver);
    nodes = [];
    S.cars.forEach(function (car, v) {
      var g = carNode(v);
      nodes.push(g);
      layerCars.appendChild(g);
    });
    putAll(false);
    fit();
  }

  // Cells as large as the main area allows, read from the shell like Way Out does
  function fit() {
    if (!S) return;
    var ms = getComputedStyle(ctx.main), cs = getComputedStyle(wrap), gap = parseFloat(cs.rowGap) || 0;
    var mainH = (ctx.main.clientHeight || (window.innerHeight || 640) - 60) - parseFloat(ms.paddingTop) - parseFloat(ms.paddingBottom);
    var availW, availH;
    if (cs.flexDirection === 'row') {
      // beside the text on a short screen: all the height, the width less the column
      availW = (wrap.clientWidth || 640) - side.offsetWidth - gap;
      availH = mainH;
    } else {
      availW = wrap.clientWidth || 360;
      availH = mainH - (top.offsetHeight + actions.offsetHeight + status.offsetHeight) - 3 * gap;
    }
    var VW = S.cols * U + 2 * PAD + ROAD, VH = S.rows * U + 2 * PAD;
    // up to 3x: at 1.4 the lot stopped at 367px on any screen (#359)
    var k = Math.min(availW / VW, Math.max(96, availH) / VH, 3);
    svg.style.width = (VW * k) + 'px';
    svg.style.height = (VH * k) + 'px';
  }

  function render() {
    top.innerHTML = '';
    if (S.daily) {
      top.appendChild(el('span', { class: 'ch-badge ch-badge--accent' },
        [C.icon('calendar', 14), el('span', { text: C.t('dailyGl') + ' — ' + C.num(S.daily) })]));
    } else {
      top.appendChild(el('span', { class: 'ch-badge ch-badge--accent', text: C.t('levelN', { n: C.num(S.level) }) }));
    }
    top.appendChild(el('span', { class: 'ch-badge', text: C.t('fewestN', { n: C.num(S.best) }) }));
    actions.innerHTML = '';
    var hb = el('button', { class: 'ch-btn ch-btn--soft', type: 'button' },
      [C.icon('bulb', 18), el('span', { text: C.t('hint') }), el('span', { class: 'ch-badge', text: C.num(prog.hints) })]);
    hb.disabled = !!S.hint || S.done || busy;
    hb.addEventListener('click', showHint);
    actions.appendChild(hb);
    paint();
    fit();
  }

  function frameRect(v, p, grow) {
    var c = S.cars[v], xy = lane(v, p), w = c.h ? c.n * U : U, h = c.h ? U : c.n * U;
    return { x: xy[0] - grow, y: xy[1] - grow, width: w + 2 * grow, height: h + 2 * grow };
  }

  function paint() {
    nodes.forEach(function (g, v) { g.classList.toggle('gl-car--hint', !!S.hint && S.hint.v === v); });
    layerOver.innerHTML = '';
    if (S.hint) {
      // the veil goes over every car, then the ghost, then the hinted car on top of both; a car
      // already on top is left alone so a glide in progress is not cut short
      if (!dim) dim = sv('rect', { class: 'gl-dim', x: 0, y: 0, width: S.cols * U, height: S.rows * U, rx: 18 });
      if (!ghost) ghost = sv('rect', { class: 'gl-ghost', rx: 13 });
      var gr = frameRect(S.hint.v, S.hint.to, 2);
      ghost.setAttribute('x', gr.x); ghost.setAttribute('y', gr.y); ghost.setAttribute('width', gr.width); ghost.setAttribute('height', gr.height);
      if (dim.parentNode !== layerCars || dimFor !== S.hint.v) {
        layerCars.appendChild(dim);
        layerCars.appendChild(ghost);
        layerCars.appendChild(nodes[S.hint.v]);
        dimFor = S.hint.v;
      }
    } else if (dim && dim.parentNode) {
      dim.parentNode.removeChild(dim);
      ghost.parentNode.removeChild(ghost);
      dimFor = -1;
    }
    // (the hinted car already wears its halo, so the ring is for the other cars)
    if (cur >= 0 && S.cars[cur] && !(S.hint && S.hint.v === cur)) {
      var cr = frameRect(cur, S.cars[cur].p, 3);
      layerOver.appendChild(sv('rect', { class: 'gl-cur', x: cr.x, y: cr.y, width: cr.width, height: cr.height, rx: 14 }));
    }
    // the way out pulses while the red car's road is clear: the moment to flick it
    svg.classList.toggle('gl-board--clear', E.clear(S));
    ctx.setStat('moves', S.moves);
    undoBtn.disabled = S.done || busy || !!S.hint || !S.stack.length;
    restartBtn.disabled = S.done || busy;
  }

  function say(k) { status.textContent = k ? C.t(k) : ''; }

  /* ------------------------------------------------------------ moves */

  // A move the engine accepted: the car glides to its cell, the rest follows from the engine
  function moved(r) {
    put(r.v, r.to, true);
    C.feedback('place');
    say(null);
    if (S.done) { levelWon(); return; }
    if (r.hinted && S.hint && cur >= 0) cur = S.hint.v;
    save();
    render();
  }

  // A locked car was touched during a hint: the hinted car nudges and a short note says why
  function lockedTry() {
    C.feedback('bad');
    if (S.hint && nodes[S.hint.v]) C.ui.shake(nodes[S.hint.v]._wig);
    C.ui.toast({ icon: 'bulb', title: C.t('moveHinted'), ms: 1800 });
    say('moveHinted');
  }

  function showHint() {
    if (!S || S.done || busy) return;
    if (S.hint) { C.feedback('bad'); say('hintPending'); return; }
    if (!(prog.hints > 0)) {
      C.feedback('bad');
      C.ui.toast({ icon: 'bulb', title: C.t('noHints'), sub: C.t('hintSoon') });
      return;
    }
    var v = E.useHint(S, prog);
    if (v < 0) { C.feedback('bad'); return; }
    ctx.store.set('progress', prog);
    C.feedback('select');
    cur = v;
    say('hintOn');
    save();
    render();
  }

  function undo() {
    if (!S || S.done || busy) return;
    if (S.hint) { C.feedback('bad'); say('hintPending'); return; }
    var u = E.undo(S);
    if (!u) { C.feedback('bad'); return; }
    C.feedback('tap');
    put(u.v, u.to, true);
    say(null);
    save();
    render();
  }

  function restartLevel() {
    if (!S) return;
    E.restart(S);
    cur = -1; startedAt = Date.now();
    say(null);
    putAll(true);
    render();
    save();
  }

  function askRestart() {
    if (!S || S.done || busy) return;
    if (!touched()) { restartLevel(); return; }
    C.ui.confirm({ title: C.t('restartLevel'), body: C.t('resetWarn'), onOk: restartLevel });
  }

  // The logic is done at the last move; the car then drives off the board and the result follows
  function levelWon() {
    busy = true;
    cur = -1;
    snap = { rows: S.rows, cols: S.cols, walls: S.walls.slice(), cars: S.cars.map(function (c, v) { return { h: c.h, n: c.n, l: c.l, p: S.start[v] }; }), look: S.look.slice() };
    gift = S.daily ? 0 : E.levelDone(prog, S.level);
    ctx.store.set('progress', prog);
    save();
    render();
    if (C.ui.reduceMotion()) { finish(); return; }
    setTimeout(function () {
      var g = nodes[0], c = S.cars[0];
      g.classList.remove('gl-car--still');
      g.classList.add('gl-car--out');
      g.style.transform = 'translate(' + (c.p * U + 2 * U + ROAD) + 'px,' + (c.l * U) + 'px)';
    }, SNAP_MS);
    setTimeout(finish, SNAP_MS + DRIVE_MS + 60);
  }

  function finish() {
    var elapsed = Date.now() - startedAt, perfect = S.moves <= S.best;
    var base = 4 + Math.round(S.best / 3);
    var coins = base + (perfect && !S.hints ? 3 : 0), points = base * 4;
    var note = gift ? C.t('giftHint') : null;
    var stars = perfect ? 3 : (S.moves <= Math.ceil(S.best * 1.5) ? 2 : 1);
    C.achievements.unlock('gl-win');
    if (!S.daily && S.level >= 50) C.achievements.unlock('gl-deep');
    if (S.best >= 10 && perfect && !S.hints) C.achievements.unlock('gl-clean');
    if (S.daily) {
      coins += 8; points += 25;
      // the first daily of each day also brings a hint
      if (C.stats.daily('gridlock', S.daily, { label: C.t('movesN', { n: C.num(S.moves) }), ms: elapsed })) {
        prog.hints++;
        ctx.store.set('progress', prog);
        note = C.t('giftHint');
      } else { coins = Math.round(coins * 0.2); points = Math.round(points * 0.2); }
    } else {
      C.stats.best('gridlock', 'level', S.level, false);
    }
    ctx.clearSave();
    ctx.finish({
      won: true, title: C.t('levelClear'), note: note, stars: stars, timeMs: elapsed, coins: coins, points: points,
      lines: [
        S.daily ? { label: C.t('daily'), value: C.num(S.daily) } : { label: C.t('level'), value: C.num(S.level) },
        { label: C.t('movesFewest'), value: C.num(S.moves) + ' / ' + C.num(S.best) },
        { label: C.t('time'), value: C.time(elapsed) }
      ],
      shareText: 'چوگان · راه‌بندان' + (S.daily ? ('\nروزانه ' + S.daily) : ('\nمرحله‌ی ' + C.num(S.level))) + '\n' + C.num(S.moves) + ' / ' + C.num(S.best) + '\n' + C.time(elapsed),
      paint: cardPaint(),
      // the primary button opens the next level, so it says so
      againLabel: S.daily ? null : C.t('nextLevel'),
      onAgain: S.daily ? null : function () { newGame(prog.level); }
    });
    // the next board is made while the result is up, once the dialog and the confetti have had their
    // moment, so Next level opens at once
    if (!S.daily) setTimeout(function () { pending = { level: prog.level, S: E.generate(prog.level, levelRng(prog.level)) }; }, 700);
  }

  /* ------------------------------------------------------- share card */

  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#999'; }

  // The card shows the lot as the level began, every vehicle drawn from the same list as the
  // board: the tag names the shape, the class the colours, all in 40-unit cells scaled to the card
  function cardInk(cls, paint, tk) {
    switch (cls) {
      case 'gl-shadow': return { fill: tk('--gl-shadow') };
      case 'gl-wheel': case 'gl-mirror': return { fill: tk('--gl-ink') };
      case 'gl-body': return { fill: paint === 'g' ? tk('--gl-goal') : tk('--gl-c' + paint), stroke: tk('--gl-ink'), width: 2.5 };
      case 'gl-roof': return { fill: paint === 'g' ? tk('--gl-goal-roof') : tk('--gl-roof') };
      case 'gl-glass': case 'gl-bed': return { fill: tk('--gl-glass') };
      case 'gl-slat': return { stroke: tk('--gl-slat'), width: 2 };
      case 'gl-mark': return { stroke: tk('--gl-mark'), width: 3.5 };
      case 'gl-wall': return { fill: tk('--gl-concrete'), stroke: tk('--gl-ink'), width: 2.5 };
      case 'gl-wall-top': return { fill: tk('--gl-concrete-top') };
      case 'gl-hatch': return { stroke: tk('--gl-ink'), width: 2.5 };
    }
    return {};
  }
  function cardShapes(g, list, paint, tk) {
    list.forEach(function (p) {
      var a = p[1], ink = cardInk(a.class, paint, tk), path = null, pts, i;
      g.beginPath();
      if (p[0] === 'rect') C.rrect(g, a.x, a.y, a.width, a.height, a.rx || 0);
      else if (p[0] === 'circle') g.arc(a.cx, a.cy, a.r, 0, 2 * Math.PI);
      else if (p[0] === 'ellipse') g.ellipse(a.cx, a.cy, a.rx, a.ry, 0, 0, 2 * Math.PI);
      else if (p[0] === 'polygon') { pts = String(a.points).trim().split(/[\s,]+/); for (i = 0; i + 1 < pts.length; i += 2) g[i ? 'lineTo' : 'moveTo'](+pts[i], +pts[i + 1]); g.closePath(); }
      else if (p[0] === 'path') path = new Path2D(a.d);
      if (ink.fill) { g.fillStyle = ink.fill; if (path) g.fill(path); else g.fill(); }
      if (ink.stroke) { g.strokeStyle = ink.stroke; g.lineWidth = ink.width; g.lineCap = 'round'; g.lineJoin = 'round'; if (path) g.stroke(path); else g.stroke(); }
    });
  }
  function cardPaint() {
    var B = snap;
    return function (g, w, h, col) {
      var cs = Math.min(w / (B.cols + 0.6), h / (B.rows + 0.6)), ox = (w - B.cols * cs) / 2, oy = (h - B.rows * cs) / 2, i, k, u = cs / U;
      var cache = {}, tk = function (name) { if (!cache[name]) cache[name] = cssVar(name); return cache[name]; };
      // the lot as on the board: asphalt, faint bays, a kerb with the opening in the exit row
      var X1 = ox + B.cols * cs, Y1 = oy + B.rows * cs, R = 18 * u, y1 = oy + E.EXIT_ROW * cs + 3 * u, y2 = oy + (E.EXIT_ROW + 1) * cs - 3 * u;
      g.fillStyle = tk('--gl-lot');
      C.rrect(g, ox, oy, B.cols * cs, B.rows * cs, R);
      g.fill();
      g.fillStyle = tk('--gl-cell');
      for (i = 0; i < B.rows * B.cols; i++) {
        if (Math.floor(i / B.cols) === E.EXIT_ROW) g.fillStyle = tk('--gl-cell-exit');
        C.rrect(g, ox + (i % B.cols) * cs + 2 * u, oy + Math.floor(i / B.cols) * cs + 2 * u, cs - 4 * u, cs - 4 * u, 7 * u);
        g.fill();
        g.fillStyle = tk('--gl-cell');
      }
      g.lineWidth = 6 * u; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = tk('--gl-curb');
      g.beginPath();
      g.moveTo(X1, y1);
      g.arcTo(X1, oy, ox, oy, R);
      g.arcTo(ox, oy, ox, Y1, R);
      g.arcTo(ox, Y1, X1, Y1, R);
      g.arcTo(X1, Y1, X1, oy, R);
      g.lineTo(X1, y2);
      g.stroke();
      g.lineWidth = cs * 0.12; g.strokeStyle = col.game;
      for (k = 0; k < 2; k++) {
        var cx = ox + B.cols * cs + cs * (0.55 + k * 0.35), cy = oy + (E.EXIT_ROW + 0.5) * cs;
        g.beginPath(); g.moveTo(cx - cs * 0.1, cy - cs * 0.2); g.lineTo(cx + cs * 0.1, cy); g.lineTo(cx - cs * 0.1, cy + cs * 0.2); g.stroke();
      }
      B.walls.forEach(function (cell) {
        g.save();
        g.translate(ox + (cell % B.cols) * cs, oy + Math.floor(cell / B.cols) * cs);
        g.scale(u, u);
        cardShapes(g, wallParts(), '', tk);
        g.restore();
      });
      B.cars.forEach(function (c, v) {
        var x = ox + (c.h ? c.p : c.l) * cs, y = oy + (c.h ? c.l : c.p) * cs, len = c.n * cs;
        var fwd = v === 0 || (B.look[v] & 1) === 1;
        g.save();
        g.translate(x, y);
        // a vertical vehicle is a lying one turned a quarter; a backwards one is mirrored
        if (!c.h) { g.translate(cs, 0); g.rotate(Math.PI / 2); }
        if (!fwd) { g.translate(len, 0); g.scale(-1, 1); }
        g.scale(u, u);
        cardShapes(g, parts(c.n, v === 0), v === 0 ? 'g' : ((B.look[v] >> 1) & 3), tk);
        g.restore();
      });
    };
  }

  /* ---------------------------------------------------------- saving */

  // something to lose: a restart asks first. A hint is not counted: one spent on a board with no move
  // made is still kept in the save (a reload keeps it running, the clean award needs it)
  function touched() { return S.moves > 0 || S.stack.length > 0; }

  ctx.autosave(function () {
    if (!S || S.done || busy || !(touched() || !!S.hint || S.hints > 0)) return { inProgress: false };
    return { s: JSON.parse(JSON.stringify(S)), daily: S.daily || null, elapsed: (pausedAt || Date.now()) - startedAt };
  });
  function save() { ctx.save(); }

  // Level n is the same board for everyone, so an untouched level needs no save
  function levelRng(L) { return C.rng((L * 2654435761 + 0x6e1d) >>> 0); }
  function newGame(L, daily) {
    var T;
    if (!daily && pending && pending.level === L) T = pending.S;
    else T = daily ? E.generate(0, C.daily('gridlock', daily).rng, true) : E.generate(L, levelRng(L));
    pending = null;
    S = T;
    S.daily = daily || null;
    startedAt = Date.now();
    busy = false; cur = -1; gift = 0;
    say(null);
    build();
    render();
    save();
  }

  /* ------------------------------------------------------------ help */

  function showHelp() {
    var m = C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [
          kb('← ↑ → ↓', C.t('keysMove')),
          kb('Shift + ← ↑ → ↓ / Space', C.t('keysPick')),
          kb('H', C.t('hint')),
          kb('U / Ctrl+Z', C.t('undoMove')),
          kb('R', C.t('restartLevel'))
        ])
      ],
      actions: [
        { label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } },
        { label: C.t('done'), kind: 'primary' }
      ]
    });
    // focusing the button at the foot scrolls a long dialog past its title: it opens at the top
    if (m && m.box) { m.box.scrollTop = 0; setTimeout(function () { m.box.scrollTop = 0; }, 80); }
  }
  function kb(k, what) {
    return el('div', { class: 'ch-item' }, [
      el('div', { class: 'ch-item__label', text: what }),
      el('span', { class: 'ch-badge', text: k })
    ]);
  }

  // Tutorial art: a small lot of 26 unit cells, vehicles drawn from the same list as the board
  var TC = 26, TS = TC / U;
  function tLot() {
    var s = '<rect x="12" y="14" width="' + (5 * TC) + '" height="' + (3 * TC) + '" rx="12" fill="var(--gl-lot)" stroke="var(--gl-curb)" stroke-width="3" stroke-linejoin="round"/>';
    for (var r = 0; r < 3; r++) for (var c = 0; c < 5; c++) {
      s += '<rect x="' + (14 + c * TC) + '" y="' + (16 + r * TC) + '" width="' + (TC - 4) + '" height="' + (TC - 4) + '" rx="5" fill="' + (r === 1 ? 'var(--gl-cell-exit)' : 'var(--gl-cell)') + '"/>';
    }
    return s;
  }
  function tCar(n, cls, col, row, vertical, goal) {
    var turn = vertical ? ' translate(' + TC + ' 0) rotate(90)' : '';
    return '<g class="' + cls + '" transform="translate(' + (12 + col * TC) + ' ' + (14 + row * TC) + ')' + turn + ' scale(' + TS + ')">' + artMarkup(n, goal) + '</g>';
  }
  function tChevs() {
    var s = '';
    for (var k = 0; k < 3; k++) {
      var x = 152 + k * 14;
      s += '<path d="M' + (x - 4) + ' 45L' + (x + 4) + ' 53L' + (x - 4) + ' 61" fill="none" stroke="var(--game)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>';
    }
    return s;
  }
  function tPath(d) { return '<path d="' + d + '" fill="none" stroke="var(--gl-hint)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>'; }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'),
      art: '<svg viewBox="0 0 200 110" width="100%" class="gl-tut">' + tLot() + tCar(2, 'gl-pg', 0, 1, false, true) + tChevs() + '</svg>' },
    { title: C.t('tutTitle2'), text: C.t('tutText2'),
      art: '<svg viewBox="0 0 200 110" width="100%" class="gl-tut">' + tLot() + tCar(2, 'gl-pg', 0, 1, false, true) + tCar(2, 'gl-p0', 3, 0, false, false) +
        tCar(2, 'gl-p1', 3, 1, true, false) + tPath('M84 27H60M66 21l-6 6 6 6') + tChevs() + '</svg>' },
    { title: C.t('tutTitle3'), text: C.t('tutText3'),
      art: '<svg viewBox="0 0 200 110" width="100%" class="gl-tut">' + tLot() + tCar(2, 'gl-pg', 0, 1, false, true) +
        '<rect x="66" y="16" width="76" height="22" rx="9" fill="var(--gl-hint)" fill-opacity=".22" stroke="var(--gl-hint)" stroke-width="3" stroke-dasharray="6 5" stroke-linejoin="round"/>' +
        tCar(3, 'gl-p3', 0, 0, false, false) + tPath('M96 27h22m-6 -6l6 6 -6 6') + tChevs() + '</svg>' }
  ];

  /* ------------------------------------------------------------ input */

  function cellAt(e) {
    var m = svg.getScreenCTM();
    if (!m) return null;
    var p = svg.createSVGPoint();
    p.x = e.clientX; p.y = e.clientY;
    p = p.matrixTransform(m.inverse());
    return { x: p.x / U, y: p.y / U };
  }
  function cellPx() {
    var m = svg.getScreenCTM();
    return m ? m.a * U : U;
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  svg.addEventListener('pointerdown', function (e) {
    if (!S || S.done || busy || press) return;
    // only the main mouse button drags a car
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    var p = cellAt(e);
    if (!p) return;
    var had = cur;
    cur = -1;
    var v = E.pick(S, p.x, p.y);
    if (v < 0) { if (had >= 0) paint(); return; }
    if (E.locked(S, v)) { lockedTry(); if (had >= 0) paint(); return; }
    var r = E.range(S, v);
    press = { id: e.pointerId, v: v, x: e.clientX, y: e.clientY, p0: S.cars[v].p, lo: r.lo, hi: r.hi, cell: cellPx(), moved: false, at: S.cars[v].p, trail: [] };
    try { svg.setPointerCapture(e.pointerId); } catch (err) { /* older WebViews */ }
    if (had >= 0) paint();
  });
  window.addEventListener('pointermove', function (e) {
    if (!press || press.id !== e.pointerId) return;
    var c = S.cars[press.v], dist = (c.h ? e.clientX - press.x : e.clientY - press.y) / press.cell;
    if (!press.moved) {
      if (Math.hypot(e.clientX - press.x, e.clientY - press.y) < DRAG_PX) return;
      press.moved = true;
      var g = nodes[press.v];
      g.classList.add('gl-car--still');
      // the car being dragged goes over the others
      layerCars.appendChild(g);
      C.haptic('tap');
    }
    // it follows the finger along its lane, held to the free cells on both sides
    press.at = clamp(press.p0 + dist, press.lo, press.hi);
    var now = Date.now();
    press.trail.push([now, press.at]);
    while (press.trail.length > 2 && now - press.trail[0][0] > 140) press.trail.shift();
    var xy = lane(press.v, press.at);
    nodes[press.v].style.transform = 'translate(' + xy[0] + 'px,' + xy[1] + 'px)';
  });
  function endPress(e, fire) {
    if (!press || press.id !== e.pointerId) return;
    var pr = press;
    press = null;
    if (!pr.moved) return;
    var c = S.cars[pr.v], to = Math.round(pr.at);
    // a quick flick of the goal car toward the exit, with the road clear, sends it out
    // (the finger must still be moving at release: a pause before letting go is not a flick)
    if (fire && pr.v === 0 && E.clear(S) && pr.trail.length > 1) {
      var a = pr.trail[0], b = pr.trail[pr.trail.length - 1];
      if (Date.now() - b[0] <= FLING_MS && b[0] > a[0] && (b[1] - a[1]) / ((b[0] - a[0]) / 1000) >= FLING) to = S.cols - 2;
    }
    to = clamp(to, pr.lo, pr.hi);
    if (!fire || to === pr.p0) {
      put(pr.v, c.p, true);
      // a car with no room at all in its lane shakes, so it does not look like a missed drag
      if (fire && pr.lo === pr.hi) { C.feedback('bad'); C.ui.shake(nodes[pr.v]._wig); }
      return;
    }
    var r = E.move(S, pr.v, to);
    if (!r.moved) { put(pr.v, c.p, true); C.feedback('bad'); return; }
    moved(r);
  }
  window.addEventListener('pointerup', function (e) { endPress(e, true); });
  window.addEventListener('pointercancel', function (e) { endPress(e, false); });
  svg.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // A key step of the picked car; steps in a row on one car are a single move
  function keyStep(v, d) {
    var r = E.step(S, v, d);
    if (r.locked) { lockedTry(); return; }
    if (!r.moved) { C.feedback('bad'); return; }
    put(v, r.to, true);
    if (r.won) { moved(r); return; }
    if (r.hinted && S.hint) cur = S.hint.v;
    C.feedback('tap');
    say(null);
    save();
    render();
  }

  function pickCar(v) {
    if (v < 0) return;
    cur = v;
    C.feedback('select');
    paint();
  }

  // Arrows across the lane pick the nearest car that way, along it they slide the picked car
  // one cell; with Shift they pick whatever the direction, and Space goes through every car
  function arrow(d, shift) {
    if (cur < 0 || !S.cars[cur]) { cur = 0; paint(); return; }
    var c = S.cars[cur], along = c.h ? (d === 1 || d === 3) : (d === 0 || d === 2);
    if (along && !shift) { keyStep(cur, d === 1 || d === 2 ? 1 : -1); return; }
    pickCar(E.nearest(S, cur, d));
  }

  window.addEventListener('keydown', function (e) {
    if (!S || S.done || busy) return;
    if (document.querySelector('.ch-scrim')) return;
    var tg = e.target, tag = tg && tg.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (tg && tg.isContentEditable)) return;
    if (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
    if (C.undoKey(e)) { undo(); e.preventDefault(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key;
    if (C.keyIs(e, 'h')) { showHint(); e.preventDefault(); return; }
    if (C.keyIs(e, 'r')) { askRestart(); e.preventDefault(); return; }
    // the lot is not mirrored, so the arrow keys are geometric in every language
    var d = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 }[k];
    if (d !== undefined) { arrow(d, e.shiftKey); e.preventDefault(); return; }
    if (k === ' ') { pickCar(E.cycle(S, cur, e.shiftKey ? -1 : 1)); e.preventDefault(); }
  });

  // time in the background is not time spent on the level
  C.onPause(function () { if (!pausedAt) pausedAt = Date.now(); });
  C.onResume(function () {
    if (pausedAt) startedAt += Date.now() - pausedAt;
    pausedAt = 0;
  });

  var resizeT = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(fit, 120);
  });

  /* ------------------------------------------------------------ start */

  function restore(v, from) {
    S = v;
    S.daily = from.daily || null;
    startedAt = Date.now() - (from.elapsed || 0);
    busy = false; cur = -1;
    build();
    render();
    if (S.done) levelWon();
  }

  var saved = ctx.loadSave();
  // a save that fails its checks is dropped and the level starts fresh
  var resume = saved && saved.s && (saved.daily || null) === (dailyDate || null) ? E.restore(saved.s) : null;
  if (resume && !dailyDate && resume.level !== prog.level) resume = null;
  if (resume) {
    restore(resume, saved);
  } else if (dailyDate) {
    newGame(0, dailyDate);
    if (C.stats.dailyDone('gridlock', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).gridlock;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec.label });
    }
    ctx.tutorialIfNew(TUT);
  } else {
    newGame(prog.level);
    ctx.tutorialIfNew(TUT);
  }
  setTimeout(fit, 30);
})();
</script>
</body>
</html>
