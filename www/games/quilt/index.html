<script>
/* ==== ENGINE START ==== */
function QuiltEngineFactory() {
  'use strict';

  // A tile is four triangles cut by its diagonals, listed clockwise from the top:
  // [N, E, S, W], each a colour 0..K-1. A triangle's outer side is that side of the tile.
  // K, NOISE and EXTRA were tuned with bot playouts (#1079): four colours or a smoother
  // colour field left the last holes with no tile that fits, so even a look-ahead bot
  // stalled near 80% and never finished a quilt; three colours with this much noise let
  // it fill nine tenths on average and finish one game in six.
  var K = 3, SIZES = [5, 6], DAILY_N = 6, TRAY = 3, EXTRA = 6, SWAPS = 3, NOISE = 0.4, BIG = 10;
  var N = 0, E = 1, S = 2, W = 3, DR = [-1, 0, 1, 0], DC = [0, 1, 0, -1];

  function opp(d) { return (d + 2) % 4; }
  // a quarter turn clockwise: what was on the west side is now on top
  function rot(t) { return [t[3], t[0], t[1], t[2]]; }
  function rotN(t, k) { for (var i = 0; i < ((k % 4) + 4) % 4; i++) t = rot(t); return t; }
  function nb(n, i, d) {
    var r = Math.floor(i / n) + DR[d], c = i % n + DC[d];
    return r < 0 || c < 0 || r >= n || c >= n ? -1 : r * n + c;
  }
  function empty(n) { var b = []; for (var i = 0; i < n * n; i++) b.push(null); return b; }
  function placed(B) { var k = 0; for (var i = 0; i < B.length; i++) if (B[i]) k++; return k; }

  // Legal when every side that meets a placed tile shows the same colour on both sides
  // of the shared edge. A cell with no placed neighbour takes any tile.
  function fits(B, n, i, t) {
    if (B[i]) return false;
    for (var d = 0; d < 4; d++) {
      var j = nb(n, i, d);
      if (j >= 0 && B[j] && B[j][opp(d)] !== t[d]) return false;
    }
    return true;
  }
  // the quarter turns (0..3) from t's current turn that make it fit at i, or -1
  function turnsTo(B, n, i, t) {
    for (var k = 0; k < 4; k++) if (fits(B, n, i, rotN(t, k))) return k;
    return -1;
  }
  // the cells a tile fits in its current turn, and the others it would fit after turning
  function spots(B, n, t) {
    var now = [], turn = [];
    for (var i = 0; i < n * n; i++) {
      if (B[i]) continue;
      var k = turnsTo(B, n, i, t);
      if (k === 0) now.push(i); else if (k > 0) turn.push(i);
    }
    return { now: now, turn: turn };
  }
  function anyFit(B, n, t) {
    for (var i = 0; i < n * n; i++) if (turnsTo(B, n, i, t) >= 0) return true;
    return false;
  }

  // A triangle is cell * 4 + side. Inside a tile it touches its two neighbours across
  // the diagonals (N meets E and W, never S); across a shared edge it touches the facing
  // triangle of the next tile. Same colour on both sides joins them into one patch.
  function links(B, n, x) {
    var i = x >> 2, d = x & 3, out = [], t = B[i];
    var a = (d + 1) % 4, b = (d + 3) % 4;
    if (t[a] === t[d]) out.push(i * 4 + a);
    if (t[b] === t[d]) out.push(i * 4 + b);
    var j = nb(n, i, d);
    if (j >= 0 && B[j] && B[j][opp(d)] === t[d]) out.push(j * 4 + opp(d));
    return out;
  }
  // the patch a triangle belongs to, and whether it is closed: none of its triangles
  // faces an empty cell (the board's edge closes a side)
  function region(B, n, x) {
    var seen = {}, list = [x], open = false;
    seen[x] = true;
    for (var h = 0; h < list.length; h++) {
      var y = list[h], j = nb(n, y >> 2, y & 3);
      if (j >= 0 && !B[j]) open = true;
      var l = links(B, n, y);
      for (var q = 0; q < l.length; q++) if (!seen[l[q]]) { seen[l[q]] = true; list.push(l[q]); }
    }
    list.sort(function (p, q) { return p - q; });
    return { tris: list, color: B[x >> 2][x & 3], closed: !open };
  }
  function regions(B, n) {
    var seen = {}, out = [];
    for (var i = 0; i < n * n; i++) {
      if (!B[i]) continue;
      for (var d = 0; d < 4; d++) {
        var x = i * 4 + d;
        if (seen[x]) continue;
        var R = region(B, n, x);
        for (var q = 0; q < R.tris.length; q++) seen[R.tris[q]] = true;
        out.push(R);
      }
    }
    return out;
  }
  // a closed patch scores one point a triangle, two a triangle from BIG triangles up
  function value(size) { return size >= BIG ? size * 2 : size; }

  // Put t at i (the caller has checked it fits) and return the patches it closed.
  // A closed patch never touches an empty cell, so every patch the new tile belongs to
  // was open until now, and no patch closes without one of the new triangles: a
  // neighbour's side that faced this cell now faces a triangle of its own colour.
  // So each patch is scored exactly once, by the tile that closes it.
  function place(B, n, i, t) {
    B[i] = t.slice();
    var done = [], seen = {};
    for (var d = 0; d < 4; d++) {
      var x = i * 4 + d;
      if (seen[x]) continue;
      var R = region(B, n, x);
      for (var q = 0; q < R.tris.length; q++) seen[R.tris[q]] = true;
      if (R.closed) { R.points = value(R.tris.length); done.push(R); }
    }
    return done;
  }

  function shuffle(a, rnd) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)), x = a[i]; a[i] = a[j]; a[j] = x; }
    return a;
  }

  // The bag is cut from a hidden finished quilt, so every game can be completed: colour
  // fields grow from a few seed points (the nearest seed wins), which gives the broad
  // patches a quilt has, and some edges take a random colour instead so the tiles are
  // varied enough to fill the last holes. Both tiles on an edge show its colour. The tiles
  // are shuffled and turned at random, and a few spare copies are added.
  function generate(n, rnd) {
    var pts = [], m = n + 2;
    for (var p = 0; p < m; p++) pts.push({ x: rnd() * n, y: rnd() * n, c: p < K ? p : Math.floor(rnd() * K) });
    var col = function (x, y) {
      if (rnd() < NOISE) return Math.floor(rnd() * K);
      var best = 0, bd = Infinity;
      for (var q = 0; q < pts.length; q++) { var dx = pts[q].x - x, dy = pts[q].y - y, dd = dx * dx + dy * dy; if (dd < bd) { bd = dd; best = q; } }
      return pts[best].c;
    };
    var hz = [], vt = [], r, c;
    for (r = 0; r <= n; r++) { hz.push([]); for (c = 0; c < n; c++) hz[r].push(col(c + 0.5, r)); }
    for (r = 0; r < n; r++) { vt.push([]); for (c = 0; c <= n; c++) vt[r].push(col(c, r + 0.5)); }
    var sol = [], bag = [];
    for (r = 0; r < n; r++) for (c = 0; c < n; c++) sol.push([hz[r][c], vt[r][c + 1], hz[r + 1][c], vt[r][c]]);
    for (var i = 0; i < sol.length; i++) bag.push(sol[i].slice());
    for (var e = 0; e < EXTRA; e++) bag.push(sol[Math.floor(rnd() * sol.length)].slice());
    shuffle(bag, rnd);
    for (var b = 0; b < bag.length; b++) bag[b] = rotN(bag[b], Math.floor(rnd() * 4));
    return { n: n, bag: bag, sol: sol };
  }

  function fresh(n) { return { n: n, board: empty(n), tray: [], next: 0, score: 0, patches: 0, best: 0, moves: 0, swaps: SWAPS }; }
  function refill(st, bag) {
    while (st.tray.length < TRAY) st.tray.push(null);
    for (var k = 0; k < TRAY; k++) if (!st.tray[k] && st.next < bag.length) st.tray[k] = bag[st.next++].slice();
  }
  function start(n, bag) { var st = fresh(n); refill(st, bag); return st; }

  // Play tray tile k at cell i, turned `turns` quarter turns from how it lies in the
  // tray. Returns the patches it closed, or null when the move is not legal.
  function move(st, bag, k, i, turns) {
    var t = st.tray[k];
    if (!t || typeof i !== 'number' || i < 0 || i >= st.n * st.n || Math.floor(i) !== i) return null;
    var tt = rotN(t, turns || 0);
    if (!fits(st.board, st.n, i, tt)) return null;
    var done = place(st.board, st.n, i, tt);
    st.tray[k] = null;
    st.moves++;
    for (var q = 0; q < done.length; q++) {
      st.score += done[q].points; st.patches++;
      if (done[q].tris.length > st.best) st.best = done[q].tris.length;
    }
    refill(st, bag);
    return done;
  }
  // set tray tile k aside for the next one in the bag: three times a game
  function canSwap(st, bag) { return st.swaps > 0 && st.next < bag.length; }
  function swap(st, bag, k) {
    if (!st.tray[k] || !canSwap(st, bag)) return false;
    st.tray[k] = null; st.swaps--;
    refill(st, bag);
    return true;
  }
  function full(st) { return placed(st.board) === st.n * st.n; }
  // no tile in the tray fits anywhere, in any turn
  function stuck(st) {
    for (var k = 0; k < st.tray.length; k++) if (st.tray[k] && anyFit(st.board, st.n, st.tray[k])) return false;
    return true;
  }
  // over when the quilt is full, or nothing in the tray fits and no swap can help
  function over(st, bag) { return full(st) || (stuck(st) && !canSwap(st, bag)); }
  // three stars from nine tenths of the quilt, two from three quarters, else one
  function stars(st) {
    var f = placed(st.board) / (st.n * st.n);
    return f >= 0.9 ? 3 : f >= 0.75 ? 2 : 1;
  }

  // A save is the seed and the moves; it is replayed through the rules, so an edited
  // save cannot put an illegal quilt on the board. A move is [k, cell, turns]; a swap is
  // [k, -1, 0].
  function replay(n, bag, moves) {
    if (SIZES.indexOf(n) < 0 || !Array.isArray(moves)) return null;
    var st = start(n, bag);
    for (var q = 0; q < moves.length; q++) {
      var m = moves[q];
      if (!Array.isArray(m) || m.length !== 3 || [0, 1, 2].indexOf(m[0]) < 0 || [0, 1, 2, 3].indexOf(m[2]) < 0) return null;
      if (m[1] === -1 ? !swap(st, bag, m[0]) : !move(st, bag, m[0], m[1], m[2])) return null;
      if (q < moves.length - 1 && over(st, bag)) return null;
    }
    return st;
  }

  return {
    K: K, SIZES: SIZES, DAILY_N: DAILY_N, TRAY: TRAY, EXTRA: EXTRA, SWAPS: SWAPS, BIG: BIG, N: N, E: E, S: S, W: W,
    opp: opp, rot: rot, rotN: rotN, nb: nb, empty: empty, placed: placed, fits: fits, turnsTo: turnsTo, spots: spots,
    anyFit: anyFit, links: links, region: region, regions: regions, value: value, place: place, generate: generate,
    fresh: fresh, refill: refill, start: start, move: move, canSwap: canSwap, swap: swap, full: full, stuck: stuck,
    over: over, stars: stars, replay: replay
  };
}
if (typeof module !== 'undefined' && module.exports) module.exports = QuiltEngineFactory;
/* ==== ENGINE END ==== */
</script>

  var params = new URLSearchParams(location.search);
  var dailyDate = params.get('daily');
  var prefs = ctx.store.get('prefs', null);
  if (!prefs || E.SIZES.indexOf(prefs.n) < 0) prefs = { n: 6 };

  // The three cloth colours: orange, blue and yellow from the Okabe–Ito set, chosen to
  // stay apart for the common kinds of colour blindness, and each with its own mark
  // (dot, bar, ring) so no one has to tell them apart by colour alone.
  var CLOTH = ['#D55E00', '#0072B2', '#F0E442'];
  var MARK = ['rgba(255,255,255,0.85)', 'rgba(255,255,255,0.85)', 'rgba(60,40,0,0.62)'];

  // S is the saved game: seed and moves. G (the bag) and st (the board) are rebuilt from it.
  var S = null, G = null, st = null, ended = false, startedAt = 0;
  var sel = -1, turns = [0, 0, 0], cursor = -1, closedNow = null, flashAt = 0;

  var cv = el('canvas', { tabindex: '0', role: 'img', 'aria-label': C.t('board') });
  var box = el('div', { class: 'ql-box' }, [cv]);
  var top = el('div', { class: 'ql-top ch-above' });
  var status = el('div', { class: 'ql-status' });
  var hint = el('div', { class: 'ql-hint', role: 'status', 'aria-live': 'polite' });
  var tray = el('div', { class: 'ql-tray' });
  var slots = [0, 1, 2].map(function (k) {
    var b = el('button', { class: 'ql-tile', type: 'button', 'aria-pressed': 'false' });
    b.addEventListener('click', function () { tapTray(k); });
    tray.appendChild(b);
    return b;
  });
  var turnBtn = el('button', { class: 'ch-btn ch-btn--soft', type: 'button' }, [C.icon('rotate', 18), el('span', { text: C.t('turnBtn') })]);
  var swapBtn = el('button', { class: 'ch-btn ch-btn--soft', type: 'button' }, [C.icon('refresh', 18), el('span', { text: C.t('swapBtn') })]);
  turnBtn.addEventListener('click', function () { if (sel >= 0) turnSel(); else say(C.t('pickTile')); });
  swapBtn.addEventListener('click', doSwap);
  var acts = el('div', { class: 'ql-acts' }, [turnBtn, swapBtn]);
  var wrap = el('div', { class: 'ql-wrap ch-split' }, [el('div', { class: 'ch-fit' }, [box]), el('div', { class: 'ch-side ql-side' }, [top, status, hint, tray, acts])]);

  ctx.button({ icon: 'help', label: C.t('help'), onClick: showHelp });
  if (!dailyDate) ctx.button({ icon: 'refresh', label: C.t('qlNew'), onClick: askNew });
  ctx.main.appendChild(wrap);
  ctx.mount();

  /* ------------------------------------------------------------- game */

  function build() {
    G = E.generate(S.n, C.rng(S.seed));
    st = E.replay(S.n, G.bag, S.moves);
    return !!st;
  }
  function newQuilt(n) {
    // the daily quilt comes from the day's seed, so its bag is the same for everyone
    var seed = dailyDate ? C.daily('quilt', dailyDate).seed : 1 + Math.floor(Math.random() * 4294967294);
    S = { n: n, seed: seed >>> 0 || 1, moves: [], daily: dailyDate || null, elapsed: 0 };
    ended = false; startedAt = 0; sel = -1; turns = [0, 0, 0]; cursor = -1; closedNow = null;
    build(); render(); save();
    say(C.t('pickTile'));
  }
  function elapsed() { return startedAt ? Date.now() - startedAt : S.elapsed || 0; }
  function askNew() {
    if (S && S.moves.length && !ended) C.ui.confirm({ title: C.t('qlNew'), body: C.t('resetWarn'), onOk: function () { newQuilt(prefs.n); } });
    else newQuilt(prefs.n);
  }
  function setSize(n) {
    if (n === S.n) return;
    var go = function () { prefs.n = n; ctx.store.set('prefs', prefs); newQuilt(n); };
    if (S.moves.length && !ended) C.ui.confirm({ title: C.t('qlNew'), body: C.t('resetWarn'), onOk: go, onCancel: render });
    else go();
  }
  function cur() { return sel >= 0 && st.tray[sel] ? E.rotN(st.tray[sel], turns[sel]) : null; }
  function say(t) { hint.textContent = t || ''; }

  function tapTray(k) {
    if (ended || !st.tray[k]) return;
    if (sel === k) { turnSel(); return; }
    sel = k; C.feedback('select');
    render(); explain();
  }
  function turnSel() {
    if (ended || sel < 0) return;
    turns[sel] = (turns[sel] + 1) % 4;
    C.feedback('tap');
    var svg = slots[sel].firstChild;
    render(); explain();
    // a quarter turn shown as one, from where it was; nothing moves under reduced motion
    svg = slots[sel].firstChild;
    if (svg && svg.animate && !C.ui.reduceMotion()) svg.animate([{ transform: 'rotate(-90deg)' }, { transform: 'rotate(0)' }], { duration: 160, easing: 'ease-out' });
  }
  // what the selected tile can do right now, in words
  function explain() {
    if (ended) return;
    if (E.stuck(st)) { say(E.canSwap(st, G.bag) ? C.t('stuckSwap', { n: C.num(st.swaps) }) : ''); return; }
    var t = cur();
    if (!t) { say(C.t('pickTile')); return; }
    var P = E.spots(st.board, st.n, t);
    if (P.now.length && P.turn.length) say(C.t('fitsTurnN', { n: C.num(P.now.length), m: C.num(P.turn.length) }));
    else if (P.now.length) say(C.t('fitsN', { n: C.num(P.now.length) }));
    else if (P.turn.length) say(C.t('onlyTurnN', { m: C.num(P.turn.length) }));
    else say(C.t('noFit'));
  }

  function tapCell(i) {
    if (ended || i < 0) return;
    if (sel < 0 || !st.tray[sel]) { say(C.t('pickTile')); C.ui.shake(tray); return; }
    if (st.board[i]) return;
    var k = E.turnsTo(st.board, st.n, i, cur());
    if (k < 0) { say(C.t('notHere')); C.feedback('bad'); return; }
    // a dashed cell: turn the tile to fit it and wait for a second tap, so a tile is
    // never sewn in a way the player did not see first
    if (k > 0) { turns[sel] = (turns[sel] + k) % 4; C.feedback('tap'); render(); say(C.t('turnedFit')); return; }
    sew(sel, i);
  }
  function sew(k, i) {
    if (!startedAt) startedAt = Date.now() - (S.elapsed || 0);
    var done = E.move(st, G.bag, k, i, turns[k]);
    if (!done) return;
    S.moves.push([k, i, turns[k]]);
    turns[k] = 0;
    if (!st.tray[k]) sel = -1;
    var gained = 0;
    for (var q = 0; q < done.length; q++) gained += done[q].points;
    if (done.length) {
      closedNow = done; flashAt = Date.now();
      C.feedback('good');
      for (var p = 0; p < done.length; p++) celebrate(done[p]);
      if (done.some(function (R) { return R.tris.length >= 20; })) C.achievements.unlock('ql-big');
    } else C.feedback('place');
    render();
    if (E.over(st, G.bag)) { finish(); return; }
    save();
    if (gained) say(C.t('closedN', { n: C.num(gained) })); else explain();
  }
  function doSwap() {
    if (ended) return;
    if (sel < 0 || !st.tray[sel]) { say(C.t('pickTile')); C.ui.shake(tray); return; }
    if (!E.canSwap(st, G.bag)) { C.feedback('bad'); return; }
    var k = sel;
    if (!E.swap(st, G.bag, k)) return;
    S.moves.push([k, -1, 0]);
    turns[k] = 0;
    if (!st.tray[k]) sel = -1;
    C.feedback('tap');
    render();
    if (E.over(st, G.bag)) { finish(); return; }
    save(); explain();
  }
  // a short burst of the patch's own colour over its middle, nothing under reduced motion
  function celebrate(R) {
    if (C.ui.reduceMotion() || !drawn.k) return;
    var sx = 0, sy = 0;
    for (var q = 0; q < R.tris.length; q++) { var c = triMid(R.tris[q]); sx += c.x; sy += c.y; }
    var r = cv.getBoundingClientRect();
    C.ui.burst({ x: r.left + sx / R.tris.length, y: r.top + sy / R.tris.length },
      { colors: [CLOTH[R.color], '#FFFFFF', CLOTH[R.color]], count: Math.min(36, 10 + R.tris.length), ring: Math.min(60, 14 + R.tris.length * 2), ringColor: CLOTH[R.color] });
  }

  function finish() {
    ended = true; sel = -1;
    var ms = elapsed(), stars = E.stars(st), full = E.full(st), note = null;
    var base = { 5: [2, 8], 6: [3, 12] }[st.n], k = stars === 3 ? 1 : stars === 2 ? 0.7 : 0.4;
    var coins = Math.max(1, Math.round(base[0] * k + st.score / 60)), points = Math.max(1, Math.round(base[1] * k + st.score / 12));
    if (stars === 3) C.achievements.unlock('ql-win');
    if (full) C.achievements.unlock('ql-full');
    if (S.daily) {
      if (!C.stats.daily('quilt', S.daily, { label: C.t('scoreN', { n: C.num(st.score) }), win: stars >= 2, stars: stars, score: st.score, timeMs: ms })) { coins = Math.max(1, Math.round(coins * 0.2)); points = Math.max(1, Math.round(points * 0.2)); }
      C.achievements.unlock('ql-daily');
    } else if (C.stats.best('quilt', 'score' + st.n, st.score) && st.score > 0) note = C.t('bestScoreN', { n: C.num(st.score) });
    ctx.clearSave();
    render(); say('');
    var fin = { daily: S.daily, n: st.n, board: st.board.slice(), score: st.score, patches: st.patches, best: st.best, filled: E.placed(st.board) };
    setTimeout(function () {
      ctx.finish({
        won: stars >= 2, title: full ? C.t('doneFull') : C.t('doneStuck'), note: note, stars: stars, timeMs: ms, coins: coins, points: points,
        lines: (fin.daily ? [{ label: C.t('daily'), value: C.num(fin.daily) }] : []).concat([
          { label: C.t('scoreL'), value: C.num(fin.score) },
          { label: C.t('filledL'), value: C.num(fin.filled) + ' / ' + C.num(fin.n * fin.n) },
          { label: C.t('patchesL'), value: C.num(fin.patches) },
          { label: C.t('bigL'), value: C.num(fin.best) }

  // the moves are saved after each one; the daily quilt has its own slot
  ctx.autosave(function () {
    if (!S || ended) return { inProgress: false };
    return { n: S.n, seed: S.seed, moves: S.moves, daily: S.daily, elapsed: elapsed() };
  });
  function save() { ctx.save(); }
  C.onPause(function () { if (S && !ended) { S.elapsed = elapsed(); startedAt = 0; ctx.save(); } });
  var saved = ctx.loadSave();
  var resumed = false;
  if (saved && E.SIZES.indexOf(saved.n) >= 0 && typeof saved.seed === 'number' && saved.seed >= 1 && saved.seed <= 4294967295 &&
      Array.isArray(saved.moves) && (saved.daily || null) === (dailyDate || null)) {
    S = { n: saved.n, seed: saved.seed >>> 0, moves: saved.moves.slice(), daily: saved.daily || null, elapsed: +saved.elapsed || 0 };
    resumed = build() && !E.over(st, G.bag);
    if (resumed) { render(); explain(); }
  }
  if (!resumed) newQuilt(dailyDate ? E.DAILY_N : prefs.n);
  if (dailyDate && C.stats.dailyDone('quilt', dailyDate)) {
    var rec = C.stats.dailyOf(dailyDate).quilt;
    C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
  }
  // the board is redrawn whenever its box changes (rotation, side rows) and once the
  // web font has arrived and moved the layout (Bowling lesson)
  if (window.ResizeObserver) new ResizeObserver(function () { draw(); }).observe(box);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { draw(); });
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { draw(); }); } catch (er) { /* old WebViews */ } }
  new MutationObserver(function () { draw(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  ctx.tutorialIfNew(TUT);
})();
</script>
