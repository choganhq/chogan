  /* cards grow with the game area (#359) */
  .hu-wrap { --cw: clamp(44px, min(14cqw, (100cqh - 330px) / 2.6), 104px); margin-block: auto; width: 100%; max-width: max(560px, calc(var(--cw) * 8)); display: flex; flex-direction: column; align-items: center; gap: var(--s-3); }
  /* a phone on its side left the hand below the fold (844x390): the table goes left, the hand right */

      grid-template-areas: 'top hand' 'bots hand' 'table hand' 'status hand' 'acts hand'; align-items: center; justify-items: center; column-gap: var(--s-4); row-gap: var(--s-2); }

  }
  .hu-probe { position: absolute; width: var(--cw); height: 0; visibility: hidden; pointer-events: none; }

  .hu-bots { width: 100%; display: flex; gap: var(--s-2); justify-content: center; }

    background: var(--c-surface); border-radius: var(--r-md); box-shadow: var(--sh-1); border: 2px solid transparent; font-size: var(--fs-sm); font-weight: 700; color: var(--c-text-dim); }

  .hu-count { font-size: var(--fs-xs, 12px); }

  .hu-table { direction: ltr; display: flex; align-items: center; justify-content: center; gap: var(--s-4); margin-bottom: 14px; }
  .hu-stock { position: relative; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 8px; }
  .hu-stock .ch-pback { width: var(--cw); box-shadow: 2px 2px 0 -1px #FBF5E6, 3px 3px 0 -1px var(--c-line), 4px 4px 0 -1px #FBF5E6; }
  .hu-stock:disabled { cursor: default; }
  .hu-stock--hint .ch-pback { outline: 3px solid var(--game); outline-offset: 3px; }
  .hu-left { position: absolute; bottom: -20px; left: 0; right: 0; text-align: center; font-size: var(--fs-xs, 12px); font-weight: 700; color: var(--c-text-dim); }

  .hu-now { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; font-size: var(--fs-xs, 12px); font-weight: 700; color: var(--c-text-dim); }

<script>
/* ==== ENGINE START ==== */
function HuesEngineFactory() {
  'use strict';

  // 108 cards, each a number 0..107 so a save can be checked card by card. Colour k
  // (0..3) owns ids k*25 .. k*25+24: one 0, two of each 1..9, two skips, two reverses
  // and two draw-twos. 100..103 are wilds, 104..107 wild draw-fours.
  var SKIP = 10, REV = 11, TWO = 12, WILD = 13, FOUR = 14, SIZE = 108, PER = 7, TARGET = 200;
  function colour(c) { return c < 100 ? Math.floor(c / 25) : -1; }
  function value(c) {
    if (c >= 104) return FOUR;
    if (c >= 100) return WILD;
    var i = c % 25;
    if (i === 0) return 0;
    if (i <= 18) return 1 + ((i - 1) >> 1);
    return i <= 20 ? SKIP : i <= 22 ? REV : TWO;
  }
  function isWild(c) { return c >= 100; }
  function isAction(c) { return value(c) >= SKIP; }

  function shuffle(a, rnd) {
    for (var j = a.length - 1; j > 0; j--) { var k = Math.floor(rnd() * (j + 1)), t = a[j]; a[j] = a[k]; a[k] = t; }
    return a;
  }

  // Seven cards each. The starter is a number card: an action or wild turned up goes
  // back into the middle of the deck, so nobody is hit before anyone has played.
  function newRound(rnd, n, first) {
    var d = [];
    for (var i = 0; i < SIZE; i++) d.push(i);
    shuffle(d, rnd);
    var R = { n: n, hands: [], stock: [], discard: [], colour: 0, turn: first || 0, dir: 1, drawn: -1, passes: 0, winner: -1, blocked: false, fx: null };
    for (var p = 0; p < n; p++) R.hands.push(d.splice(0, PER));
    var guard = 0;
    while (isAction(d[d.length - 1]) && guard++ < 200) d.splice(Math.floor(d.length / 2), 0, d.pop());
    if (isAction(d[d.length - 1])) {
      for (var q = d.length - 1; q >= 0; q--) if (!isAction(d[q])) { var t = d[q]; d[q] = d[d.length - 1]; d[d.length - 1] = t; break; }
    }
    R.discard.push(d.pop());
    R.colour = colour(R.discard[0]);
    R.stock = d;
    return R;
  }

  function top(R) { return R.discard[R.discard.length - 1]; }
  // a wild goes on anything; otherwise match the colour in play or the top card's symbol
  function canPlay(R, c) { return isWild(c) || colour(c) === R.colour || value(c) === value(top(R)); }
  function legal(R, p) {
    var out = [], h = R.hands[p];
    for (var i = 0; i < h.length; i++) if (canPlay(R, h[i])) out.push(h[i]);
    // after drawing, only the drawn card may be played
    if (R.drawn >= 0) out = out.indexOf(R.drawn) >= 0 ? [R.drawn] : [];
    return out;
  }

  function next(R) { R.turn = (R.turn + R.dir + R.n) % R.n; R.drawn = -1; }

  // An empty deck is made again from the discards under the top card
  function drawOne(R, rnd) {
    if (!R.stock.length && R.discard.length > 1) {
      var keep = R.discard.pop();
      R.stock = shuffle(R.discard, rnd || Math.random);
      R.discard = [keep];
    }
    return R.stock.length ? R.stock.pop() : -1;
  }

  // Play card c; a wild names `chosen` (0..3). The effect lands at once: a skip passes
  // over the next player, a reverse turns the table (with two players it is a skip), a
  // draw-two or wild draw-four hands the next player cards and passes over them.
  // R.fx says what happened, for the page's message. Returns false if not allowed.
  function play(R, c, chosen, rnd) {
    if (R.winner >= 0) return false;
    var p = R.turn, h = R.hands[p], i = h.indexOf(c);
    if (i < 0 || legal(R, p).indexOf(c) < 0) return false;
    h.splice(i, 1);
    R.discard.push(c);
    R.colour = isWild(c) ? (chosen >= 0 && chosen < 4 ? chosen : 0) : colour(c);
    R.passes = 0;
    R.fx = null;
    var v = value(c), out = !h.length;
    if (v === SKIP || (v === REV && R.n === 2)) { next(R); R.fx = { skip: R.turn }; next(R); }
    else if (v === REV) { R.dir = -R.dir; R.fx = { rev: true }; next(R); }
    else if (v === TWO || v === FOUR) {
      next(R);
      // the last card still hands out its cards: they count in the round's score
      var got = [];
      for (var k = 0; k < (v === TWO ? 2 : 4); k++) { var d = drawOne(R, rnd); if (d < 0) break; R.hands[R.turn].push(d); got.push(d); }
      R.fx = { hit: R.turn, got: got };
      next(R);
    } else next(R);
    if (out) { R.winner = p; R.turn = p; }
    return true;
  }

  // One draw a turn, and only when nothing in the hand fits. Returns the card or -1.
  function draw(R, rnd) {
    if (R.winner >= 0 || R.drawn >= 0 || legal(R, R.turn).length) return -1;
    var c = drawOne(R, rnd);
    if (c < 0) return -1;
    R.hands[R.turn].push(c);
    R.drawn = c;
    R.fx = null;
    return c;
  }

  // Passing is allowed after a draw that can't be played, or with nothing to draw and
  // nothing to play. When everyone passes with nothing to draw the round is blocked,
  // and the lowest hand wins it.
  function canPass(R) {
    if (R.winner >= 0) return false;
    if (R.drawn >= 0) return true;
    return !legal(R, R.turn).length && !R.stock.length && R.discard.length <= 1;
  }
  function pass(R) {
    if (!canPass(R)) return false;
    if (R.drawn >= 0) R.passes = 0; else R.passes++;
    R.fx = null;
    if (R.passes >= R.n) {
      R.blocked = true;
      var best = 0;
      for (var p = 1; p < R.n; p++) if (handPoints(R.hands[p]) < handPoints(R.hands[best])) best = p;
      R.winner = best;
      return true;
    }
    next(R);
    return true;
  }

  // Points left in a hand: a number its value, skip/reverse/draw-two 20, a wild 50
  function cardPoints(c) { var v = value(c); return v >= WILD ? 50 : v >= SKIP ? 20 : v; }
  function handPoints(h) { var s = 0; for (var i = 0; i < h.length; i++) s += cardPoints(h[i]); return s; }
  function roundPoints(R) {
    var s = 0;
    for (var p = 0; p < R.n; p++) if (p !== R.winner) s += handPoints(R.hands[p]);
    return s;
  }

  // The colour to name with a wild: the one held most, wilds not counted
  function bestColour(h) {
    var n = [0, 0, 0, 0];
    for (var i = 0; i < h.length; i++) if (!isWild(h[i])) n[colour(h[i])]++;
    var b = 0;
    for (var s = 1; s < 4; s++) if (n[s] > n[b]) b = s;
    return b;
  }

  // What a draw tells the table: the player could not follow the colour in play
  function noteShort(R, p, s) { if (!R.short) R.short = []; R.short[p] = s; }

  // Bots. Easy plays any legal card at random and names a random colour. Medium keeps
  // its wilds for when nothing else goes, plays the card worth most in the colour it
  // holds most, and names its own best colour. Hard does the same and, when the next
  // player is down to one or two cards, hits them: a skip, draw-two or reverse first,
  // a wild draw-four if that is all, and a colour that player could not follow.
  function botMove(R, level, rnd) {
    rnd = rnd || Math.random;
    var p = R.turn, h = R.hands[p], L = legal(R, p);
    if (!L.length) return R.drawn >= 0 || canPass(R) ? { pass: true } : { draw: true };
    if (level === 'easy') {
      var c0 = L[Math.floor(rnd() * L.length)];
      return { play: c0, colour: isWild(c0) ? Math.floor(rnd() * 4) : -1 };
    }
    var cnt = [0, 0, 0, 0];
    h.forEach(function (c) { if (!isWild(c)) cnt[colour(c)]++; });
    var nx = (p + R.dir + R.n) % R.n, danger = level === 'hard' && R.hands[nx].length <= 2;
    var miss = R.short && R.short[nx] >= 0 ? R.short[nx] : -1;
    var plain = L.filter(function (c) { return !isWild(c); });
    var score = function (c) {
      var v = value(c), s = cardPoints(c) + cnt[colour(c)] * 3;
      if (danger && (v === SKIP || v === TWO || v === REV)) s += 60;
      if (danger && miss === colour(c)) s += 30;
      return s;
    };
    plain.sort(function (a, b) { return score(b) - score(a) || a - b; });
    var four = L.filter(function (c) { return value(c) === FOUR; });
    var wild = L.filter(function (c) { return value(c) === WILD; });
    var hit = plain.length && danger && score(plain[0]) >= 60;
    var pick;
    if (danger && !hit && four.length) pick = four[0];
    else if (plain.length) return { play: plain[0], colour: -1 };
    else pick = wild.length ? wild[0] : four[0];
    var rest = h.filter(function (c) { return c !== pick; }), s = bestColour(rest);
    if (danger && miss >= 0 && cnt[miss] > 0) s = miss;
    return { play: pick, colour: s };
  }

  function validRound(v) {
    if (!v || !(v.n >= 2 && v.n <= 4) || !Array.isArray(v.hands) || v.hands.length !== v.n || !Array.isArray(v.stock) || !Array.isArray(v.discard) || !v.discard.length) return false;
    var seen = {}, n = 0, ok = true;
    var add = function (c) { if (typeof c !== 'number' || c < 0 || c >= SIZE || c !== Math.floor(c) || seen[c]) ok = false; seen[c] = 1; n++; };
    v.hands.forEach(function (h) { if (!Array.isArray(h)) ok = false; else h.forEach(add); });
    v.stock.forEach(add); v.discard.forEach(add);
    if (!ok || n !== SIZE || !(v.turn >= 0 && v.turn < v.n) || !(v.colour >= 0 && v.colour < 4) || (v.dir !== 1 && v.dir !== -1)) return false;
    return v.drawn === -1 || (v.hands[v.turn] && v.hands[v.turn].indexOf(v.drawn) >= 0);
  }

  return {
    SKIP: SKIP, REV: REV, TWO: TWO, WILD: WILD, FOUR: FOUR, SIZE: SIZE, PER: PER, TARGET: TARGET,
    colour: colour, value: value, isWild: isWild, isAction: isAction,
    newRound: newRound, top: top, canPlay: canPlay, legal: legal, play: play, draw: draw,
    canPass: canPass, pass: pass, cardPoints: cardPoints, handPoints: handPoints, roundPoints: roundPoints,
    bestColour: bestColour, noteShort: noteShort, botMove: botMove, validRound: validRound
  };
}
if (typeof module !== 'undefined' && module.exports) module.exports = HuesEngineFactory;
/* ==== ENGINE END ==== */
</script>

  var params = new URLSearchParams(location.search);

  if (LEVELS.indexOf(prefs.level) < 0) prefs.level = 'medium';

  function pname(p) { return p === 0 ? C.t('youName') : C.t('rivalN', { n: C.num(p) }); }
  function colourName(s) { return C.t(COL[s].name); }
  function human() { return M && M.R && M.R.turn === 0 && M.R.winner < 0; }

  /* ------------------------------------------------------------ cards */

  // the shape belongs to the colour, so a colour-blind player tells the cards apart by it
  function shape(k, cx, cy, r, fill) {
    var f = '" fill="' + fill + '"/>', sh = COL[k].shape;
    if (sh === 'circle') return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + f;
    if (sh === 'triangle') return '<path d="M' + cx + ' ' + (cy - r) + ' L' + (cx + r) + ' ' + (cy + r * 0.8) + ' L' + (cx - r) + ' ' + (cy + r * 0.8) + 'Z' + f;
    if (sh === 'square') return '<rect x="' + (cx - r * 0.82) + '" y="' + (cy - r * 0.82) + '" width="' + (r * 1.64) + '" height="' + (r * 1.64) + f;
    return '<path d="M' + cx + ' ' + (cy - r * 1.1) + ' L' + (cx + r) + ' ' + cy + ' L' + cx + ' ' + (cy + r * 1.1) + ' L' + (cx - r) + ' ' + cy + 'Z' + f;
  }
  function label(v) { return v === E.TWO ? '+' + C.num(2) : v === E.FOUR ? '+' + C.num(4) : v < 10 ? C.num(v) : ''; }
  // a symbol drawn round (cx, cy) at size s: the number, or the action's own mark
  function symbol(v, cx, cy, s, fill) {
    if (v === E.SKIP) {
      return '<circle cx="' + cx + '" cy="' + cy + '" r="' + (s * 0.42) + '" fill="none" stroke="' + fill + '" stroke-width="' + (s * 0.13) + '"/>' +
        '<path d="M' + (cx - s * 0.3) + ' ' + (cy + s * 0.3) + ' L' + (cx + s * 0.3) + ' ' + (cy - s * 0.3) + '" stroke="' + fill + '" stroke-width="' + (s * 0.13) + '" stroke-linecap="round"/>';
    }
    if (v === E.REV) {
      var a = s * 0.42, w = s * 0.12;
      return '<g fill="none" stroke="' + fill + '" stroke-width="' + w + '" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M' + (cx - a) + ' ' + (cy - a * 0.35) + ' H' + (cx + a) + ' M' + (cx + a * 0.5) + ' ' + (cy - a * 0.8) + ' L' + (cx + a) + ' ' + (cy - a * 0.35) + ' L' + (cx + a * 0.5) + ' ' + (cy + a * 0.1) + '"/>' +
        '<path d="M' + (cx + a) + ' ' + (cy + a * 0.45) + ' H' + (cx - a) + ' M' + (cx - a * 0.5) + ' ' + (cy) + ' L' + (cx - a) + ' ' + (cy + a * 0.45) + ' L' + (cx - a * 0.5) + ' ' + (cy + a * 0.9) + '"/></g>';
    }
    if (v === E.WILD) {
      var q = s * 0.22;
      return shape(0, cx - q, cy - q, q * 0.85, COL[0].body) + shape(1, cx + q, cy - q, q * 0.85, COL[1].body) +
        shape(2, cx - q, cy + q, q * 0.85, COL[2].body) + shape(3, cx + q, cy + q, q * 0.85, COL[3].body);
    }
    var t = label(v);
    // 6 and 9 read the same upside down: a bar under them says which way is up
    var bar = (v === 6 || v === 9) ? '<rect x="' + (cx - s * 0.2) + '" y="' + (cy + s * 0.42) + '" width="' + (s * 0.4) + '" height="' + (s * 0.07) + '" rx="' + (s * 0.03) + '" fill="' + fill + '"/>' : '';
    return '<text x="' + cx + '" y="' + cy + '" dy=".35em" text-anchor="middle" font-size="' + (t.length > 1 ? s * 0.72 : s) + '" font-weight="900" fill="' + fill + '">' + t + '</text>' + bar;
  }
  // the inside of a card face, in a 50 x 70 box
  function face(c) {
    var k = E.colour(c), v = E.value(c), wild = k < 0, col = wild ? null : COL[k];
    var body = wild ? WILD_BODY : col.body, ink = wild ? '#24212B' : col.ink, on = wild ? '#FFFFFF' : col.on;

      var t = label(v), out = '';

      else if (v === E.WILD) out += symbol(v, x + 5, y - 4, 12, on);
      else out += symbol(v, x + 4.5, y - 4, 10, on);
      // the colour's shape sits under the index, so a card showing only its edge in a fan still says its colour
      out += wild ? '' : shape(k, x + 4, y + 7, 3.2, on);
      return out;
    };
    return '<rect width="50" height="70" rx="6" fill="' + body + '"/>' +
      '<rect x="2.5" y="2.5" width="45" height="65" rx="4.5" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="1.2"/>' +
      '<ellipse cx="25" cy="35" rx="16" ry="25" transform="rotate(28 25 35)" fill="#FFFFFF"/>' +
      (wild ? '' : shape(k, 25, 35, 13, body) + '<ellipse cx="25" cy="35" rx="10.5" ry="12" fill="#FFFFFF" opacity=".9"/>') +
      symbol(v, 25, 35, v === E.FOUR ? 20 : 22, ink) +
      (v === E.FOUR ? symbol(E.WILD, 25, 52, 10, ink) : '') +
      corner(5, 13) + '<g transform="rotate(180 25 35)">' + corner(5, 13) + '</g>';
  }
  function cardName(c) {
    var v = E.value(c), k = E.colour(c);
    var what = v < 10 ? C.num(v) : C.t({ 10: 'cSkip', 11: 'cRev', 12: 'cTwo', 13: 'cWild', 14: 'cFour' }[v]);
    return k < 0 ? what : colourName(k) + ' ' + what;
  }
  function cardEl(c, extra) {
    var b = el('button', { class: 'hu-card' + (extra ? ' ' + extra : ''), type: 'button', 'aria-label': cardName(c) });
    b.innerHTML = '<svg viewBox="0 0 50 70" aria-hidden="true" font-family="inherit">' + face(c) + '</svg>';
    b._c = c;
    return b;
  }

  /* ------------------------------------------------------------ start */

  function newMatch(daily) {
    stopBot();
    var n = daily ? 3 : prefs.rivals + 1;
    M = { n: n, level: daily ? 'medium' : prefs.level, scores: [], round: 0, daily: daily || null, startedAt: Date.now() };
    for (var p = 0; p < n; p++) M.scores.push(0);
    newRound();
  }
  function newRound() {
    stopBot();
    M.round++;
    var rnd = M.daily ? C.daily('hues', M.daily).rng : Math.random;
    botRnd = M.daily ? C.daily('hues', M.daily + '|bots').rng : Math.random;
    // the first player moves round by round, so nobody always leads
    M.R = E.newRound(rnd, M.n, M.daily ? 0 : (M.round - 1) % M.n);
    msg = ''; kf = -1;
    render();
    dealIn();
    save();
    maybeBot();
  }
  function resume(v) {
    M = v;
    // closed on the round's result: the match goes on with the next round
    if (M.R.winner >= 0) { M.startedAt = Date.now() - (v.elapsed || 0); newRound(); return; }
    msg = '';
    botRnd = M.daily ? C.daily('hues', M.daily + '|bots|' + M.R.stock.length).rng : Math.random;
    M.startedAt = Date.now() - (v.elapsed || 0);
    render();
    maybeBot();
  }

  /* ------------------------------------------------------------- draw */

  function renderTop() {
    top.innerHTML = '';
    if (M.daily) top.appendChild(el('span', { class: 'ch-badge ch-badge--accent' }, [C.icon('calendar', 14), el('span', { text: C.t('dailyHu') + ' — ' + C.num(M.daily) })]));
    else {
      top.appendChild(el('span', { class: 'ch-badge', text: C.t('roundN', { n: C.num(M.round) }) }));
      top.appendChild(el('span', { class: 'ch-badge', text: C.t('toN', { n: C.num(E.TARGET) }) }));
    }
    top.appendChild(C.cards.backPicker());
    // options behind a gear in the top row, never in «?» (#409)
    var gear = el('button', { class: 'ch-iconbtn', type: 'button', 'aria-label': C.t('settings'), title: C.t('settings') }, [C.icon('gear', 20)]);
    gear.addEventListener('click', showSettings);
    top.appendChild(gear);
  }

  function renderBots() {
    bots.innerHTML = '';
    for (var p = 1; p < M.n; p++) {
      var fan = el('div', { class: 'hu-fan', 'aria-hidden': 'true' });
      var k = M.R.hands[p].length;
      for (var i = 0; i < Math.min(k, 9); i++) fan.appendChild(C.cards.back());
      var box = el('div', { class: 'hu-bot' + (M.R.turn === p && M.R.winner < 0 ? ' hu-bot--on' : ''), 'data-p': p }, [
        el('span', { text: pname(p) }), fan,
        el('span', { class: 'hu-count', text: C.t('cardsN', { n: C.num(k) }) + (M.daily ? '' : ' · ' + C.num(M.scores[p])) }),
        k === 1 && M.R.winner < 0 ? el('span', { class: 'ch-badge ch-badge--accent hu-last', text: C.t('lastOne') }) : null
      ]);
      bots.appendChild(box);
    }
  }

  function render() {
    var R = M.R;
    renderTop();
    renderBots();
    stockBtn.innerHTML = '';
    stockBtn.appendChild(C.cards.back());
    stockBtn.appendChild(el('span', { class: 'hu-left', text: C.num(R.stock.length) }));
    var mustDraw = human() && !E.legal(R, 0).length && R.drawn < 0 && (R.stock.length || R.discard.length > 1);
    stockBtn.classList.toggle('hu-stock--hint', !!mustDraw);
    stockBtn.disabled = !human();
    pile.innerHTML = '';
    var tc = cardEl(E.top(R));
    tc.disabled = true;
    pile.appendChild(tc);
    nowBox.className = 'hu-now' + (colourFresh ? ' hu-now--new' : '');
    colourFresh = false;
    var col = COL[R.colour];
    nowBox.innerHTML = '<svg viewBox="0 0 40 40" aria-hidden="true">' + shape(R.colour, 20, 20, 15, col.body) + '</svg>';
    nowBox.appendChild(el('span', { text: C.t('colourNow') + ': ' + colourName(R.colour) }));
    var dir = el('span', { 'aria-label': R.dir > 0 ? '' : C.t('reversed') });
    dir.innerHTML = '<svg class="hu-dir' + (R.dir < 0 ? ' hu-dir--back' : '') + '" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M18.5 3.5v4.2h-4.2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    if (M.n > 2) nowBox.appendChild(dir);

    actions.innerHTML = '';
    if (human() && E.canPass(R)) {
      var pb = el('button', { class: 'ch-btn ch-btn--soft', type: 'button', text: C.t('passTurn') });

    if (!st && R.winner < 0) {
      if (R.turn !== 0) st = C.t('thinking', { n: pname(R.turn) });
      else if (R.drawn >= 0) st = C.t('playDrawn');

  function sortKey(c) { var k = E.colour(c); return (k < 0 ? 4 : k) * 20 + E.value(c); }
  function renderHand() {
    var R = M.R, h = R.hands[0].slice().sort(function (a, b) { return sortKey(a) - sortKey(b) || a - b; });
    var ok = human() ? E.legal(R, 0) : [];
    hand.innerHTML = '';
    handNodes = [];
    // as many cards a row as leave each one a finger-wide strip; the rest wrap below
    var cw = probe.offsetWidth || 56;
    var room = hand.clientWidth || 360;
    var fit = Math.max(2, Math.floor((room - cw) / STRIP) + 1);
    var rows = Math.max(1, Math.ceil(h.length / fit)), per = Math.ceil(h.length / rows);
    for (var r = 0; r < rows; r++) {
      var part = h.slice(r * per, (r + 1) * per), row = el('div', { class: 'hu-row' });
      var k = part.length, over = k > 1 ? Math.min(0, (room - cw * k) / (k - 1)) : 0;
      part.forEach(function (c, i) {
        var idx = handNodes.length;
        var b = cardEl(c, (ok.indexOf(c) >= 0 ? 'hu-ok' : (human() ? 'hu-no' : '')) + (kf === idx ? ' hu-kf' : ''));
        if (i) b.style.marginInlineStart = over + 'px';
        b.addEventListener('click', function () { humanPlay(c, b); });
        row.appendChild(b);
        handNodes.push(b);
      });
      hand.appendChild(row);
    }
  }
  function handNode(c) { for (var i = 0; i < handNodes.length; i++) if (handNodes[i]._c === c) return handNodes[i]; return null; }
  function botBox(p) { return bots.querySelector('[data-p="' + p + '"]'); }

  // a new round: the hand flies in from the deck one card at a time, turning over (#398)
  function dealIn() {
    if (C.ui.reduceMotion()) return;
    var from = stockBtn.getBoundingClientRect();
    for (var i = 0; i < handNodes.length; i++) C.ui.fly(handNodes[i], from, { ms: 220, delay: i * DEAL_MS, flip: true });
  }
  // the card just played arrives on the pile from the hand that played it
  function flyToPile(fromRect, flip) {
    if (!fromRect || !pile.firstChild) return;
    C.ui.fly(pile.firstChild, fromRect, { ms: 240, flip: !!flip });
  }
  // cards handed to the player by a draw-two or wild draw-four arrive from the deck
  function flyGot(got) {
    var from = stockBtn.getBoundingClientRect();
    got.forEach(function (g, i) { var n = handNode(g); if (n) C.ui.fly(n, from, { ms: 220, delay: 160 + i * 90, flip: true }); });
  }

  /* ------------------------------------------------------------ moves */

  // what the card just played did, for the status line
  function effectMsg(p) {
    var R = M.R, fx = R.fx;
    if (!fx || R.winner >= 0) return '';
    if (fx.skip !== undefined) return C.t('skippedN', { n: pname(fx.skip) });
    if (fx.rev) return C.t('reversed');
    if (fx.hit !== undefined) return fx.hit === 0 ? C.t('youHit', { k: C.num(fx.got.length) }) : C.t('hitN', { n: pname(fx.hit), k: C.num(fx.got.length) });
    return '';
  }

  function humanPlay(c, node) {
    if (!human() || document.querySelector('.ch-scrim')) return;
    if (E.legal(M.R, 0).indexOf(c) < 0) { C.feedback('bad'); C.ui.shake(node); return; }
    var from = node.getBoundingClientRect();
    if (E.isWild(c)) { askColour(function (s) { commitHuman(c, s, from); }); return; }
    commitHuman(c, -1, from);
  }
  function commitHuman(c, s, from) {
    if (!E.play(M.R, c, s, botRnd)) { C.feedback('bad'); return; }
    if (E.isWild(c)) colourFresh = true;
    C.audio.sfx('place'); C.haptic('tap');
    msg = effectMsg(0); kf = -1;
    // the award is for the round, so it comes at once, not at the end of the match
    if (M.R.winner === 0 && E.value(c) === E.FOUR) C.achievements.unlock('hu-four');
    after(from, false);
  }
  function humanDraw() {
    if (!human() || document.querySelector('.ch-scrim')) return;
    var R = M.R;
    if (E.legal(R, 0).length) { C.feedback('bad'); msg = C.t('canPlayFirst'); render(); msg = ''; return; }
    var s = R.colour, c = E.draw(R, botRnd);
    if (c < 0) { C.feedback('bad'); render(); return; }
    E.noteShort(R, 0, s);
    C.audio.sfx('flip');
    var from = stockBtn.getBoundingClientRect();
    msg = '';
    render();
    var n = handNode(c);
    if (n) C.ui.fly(n, from, { ms: 220, flip: true });
    save();
    // a drawn card that does not fit passes the turn at once
    if (!E.legal(R, 0).length) setTimeout(function () { if (human() && R.drawn === c) { E.pass(R); after(null, false); } }, C.cards.pace(450));
  }
  function humanPass() {
    if (!human() || !E.pass(M.R)) return;
    C.feedback('tap');
    msg = '';
    after(null, false);
  }

  function after(from, flip) {
    var fx = M.R.fx;
    render();
    flyToPile(from, flip);
    if (fx && fx.hit === 0 && fx.got.length) flyGot(fx.got);
    save();
    if (M.R.winner >= 0) { endRound(); return; }
    maybeBot();
  }

  function maybeBot() {
    stopBot();
    var R = M.R;
    if (R.winner >= 0 || R.turn === 0) return;
    botTimer = setTimeout(function () {
      botTimer = null;
      if (!M || M.R !== R || R.winner >= 0 || R.turn === 0) return;
      var p = R.turn, m = E.botMove(R, M.level, botRnd);
      if (m.play !== undefined) {
        var from = botBox(p) ? botBox(p).getBoundingClientRect() : null;
        E.play(R, m.play, m.colour, botRnd);
        var bits = [];
        if (E.isWild(m.play)) { colourFresh = true; bits.push(C.t('changedN', { n: pname(p), s: colourName(R.colour) })); }
        var ef = effectMsg(p);
        if (ef) bits.push(ef);
        msg = bits.join(' · ');
        C.audio.sfx('place');
        after(from, true);
        return;
      }
      if (m.draw) {
        var s = R.colour;
        if (E.draw(R, botRnd) >= 0) { E.noteShort(R, p, s); msg = C.t('drewN', { n: pname(p) }); C.audio.sfx('flip'); render(); save(); maybeBot(); return; }
      }
      E.pass(R);
      msg = C.t('passedN', { n: pname(p) });
      after(null, false);
    }, C.cards.pace(C.ui.reduceMotion() ? 300 : BOT_MS));
  }
  function stopBot() { if (botTimer) { clearTimeout(botTimer); botTimer = null; } }

  /* ------------------------------------------------------------ rounds */

  function endRound() {
    stopBot();
    var R = M.R, w = R.winner, pts = E.roundPoints(R);
    M.scores[w] += pts;
    msg = w === 0 ? C.t('youWonRound') : C.t('roundWon', { n: pname(w) });
    render();
    if (w === 0 && pile.firstChild) C.ui.burst(pile.firstChild, { count: 24, speed: 240, ring: 30, colors: [COL[0].body, COL[1].body, COL[2].body, COL[3].body] });
    var over = M.daily || M.scores[w] >= E.TARGET;
    save();
    if (over) { setTimeout(finish, C.cards.pace(900)); return; }
    var lines = [];
    for (var p = 0; p < M.n; p++) lines.push(el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: pname(p) }), el('b', { class: 'ch-num', text: C.num(M.scores[p]) })]));
    setTimeout(function () {
      C.ui.modal({
        title: msg,
        body: [el('p', { class: 'ch-dim', text: (R.blocked ? C.t('blocked') + ' · ' : '') + C.t('plusPts', { n: C.num(pts) }) }), el('div', { class: 'ch-list' }, lines)],
        actions: [{ label: C.t('nextRound'), kind: 'primary', onClick: function () { newRound(); } }],
        onClose: function () { if (M && M.R === R) newRound(); }
      });
    }, C.cards.pace(700));
  }

  function finish() {
    var R = M.R, ms = Date.now() - M.startedAt, won;
    var best = 0;
    for (var p = 1; p < M.n; p++) if (M.scores[p] > M.scores[best]) best = p;
    won = M.daily ? R.winner === 0 : best === 0;
    var base = { easy: 6, medium: 12, hard: 20 }[M.level] || 12;
    var coins = won ? base + (M.daily ? 8 : 0) : Math.max(2, Math.round(base * 0.3));
    var points = won ? base * 4 + (M.daily ? 25 : 0) : Math.round(base * 1.2);
    if (won) {
      C.achievements.unlock('hu-win');
      if (M.level === 'hard' && !M.daily) C.achievements.unlock('hu-hard');
    }
    if (M.daily) {
      var first = C.stats.daily('hues', M.daily, { label: won ? C.t('youWonRound') : C.t('roundWon', { n: pname(R.winner) }), win: won });
      if (!first) { coins = Math.round(coins * 0.2); points = Math.round(points * 0.2); }
    }
    ctx.clearSave();
    var lines = [];
    for (var q = 0; q < M.n; q++) lines.push({ label: pname(q), value: C.num(M.scores[q]) });
    if (!M.daily) lines.push({ label: C.t('rounds'), value: C.num(M.round) });
    var scores = M.scores.slice();
    ctx.finish({
      won: won,
      title: won ? C.t('matchWon') : C.t('matchLost', { n: pname(M.daily ? R.winner : best) }),
      timeMs: ms, coins: coins, points: points,
      lines: lines,
      shareText: 'چوگان · رنگارنگ' + (M.daily ? ('\nروزانه ' + M.daily) : '') + '\n' + scores.map(function (s) { return C.num(s); }).join(' - '),
      onAgain: M.daily ? null : function () { newMatch(null); }
    });
  }

  /* ----------------------------------------------------------- dialogs */

  function askColour(done) {
    var m = null;
    var grid = el('div', { class: 'hu-pick' });
    [0, 1, 2, 3].forEach(function (s) {
      var b = el('button', { type: 'button', style: { background: COL[s].body, color: COL[s].on } });
      b.innerHTML = '<svg viewBox="0 0 30 30" aria-hidden="true">' + shape(s, 15, 15, 11, COL[s].on) + '</svg>';
      b.appendChild(el('span', { text: colourName(s) }));
      b.addEventListener('click', function () { if (m) m.close(); done(s); });
      grid.appendChild(b);
    });
    m = C.ui.modal({ title: C.t('pickColour'), body: [grid], actions: [{ label: C.t('cancel') }] });
  }

  function showSettings() {
    var seg1 = C.ui.segmented([1, 2, 3].map(function (n) { return { value: n, label: C.num(n) }; }), prefs.rivals, function (v) { prefs.rivals = v; ctx.store.set('prefs', prefs); });
    var seg2 = C.ui.segmented(LEVELS.map(function (l) { return { value: l, label: C.t(l) }; }), prefs.level, function (v) { prefs.level = v; ctx.store.set('prefs', prefs); });
    C.ui.modal({
      title: C.t('settings'),
      body: [el('div', { class: 'ch-list' }, [
        el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: C.t('rivals') }), seg1]),
        el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: C.t('level') }), seg2]),
        C.cards.speedRow()
      ]), el('p', { class: 'ch-dim', text: C.t('optNote') })],
      actions: [{ label: C.t('done'), kind: 'primary' }]
    });
  }

  function askNew() {
    if (document.querySelector('.ch-scrim')) return;
    var dd = M ? M.daily : null;
    var started = M && (M.round > 1 || M.R.stock.length !== E.SIZE - M.n * E.PER - 1 || M.R.discard.length > 1);
    if (!started) { newMatch(dd); return; }
    C.ui.confirm({ title: C.t('newMatch'), body: C.t('resetWarn'), onOk: function () { newMatch(dd); } });
  }

  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [kb('← →', C.t('kbCards')), kb('Enter', C.t('kbPlay')), kb('D', C.t('kbDraw')), kb('P', C.t('kbPass'))])
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(tut()); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }

  window.addEventListener('keydown', function (e) {
    if (!human() || document.querySelector('.ch-scrim')) return;
    var tg = e.target, tag = tg && tg.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter'))) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var n = handNodes.length;
    // the hand is laid out left to right in every language, so the arrows are not flipped
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      kf = kf < 0 ? 0 : (kf + (e.key === 'ArrowRight' ? 1 : n - 1)) % n;
      renderHand(); e.preventDefault(); return;
    }
    if (e.key === 'Enter' && kf >= 0 && handNodes[kf]) { var b = handNodes[kf]; humanPlay(b._c, b); e.preventDefault(); return; }
    if (C.keyIs(e, 'd')) { humanDraw(); e.preventDefault(); return; }
    if (C.keyIs(e, 'p')) { humanPass(); e.preventDefault(); }
  });

  // a card for the tutorial pictures, at x, y in a 200 x 110 picture
  function mini(c, x, y) { return '<svg x="' + x + '" y="' + y + '" width="40" height="56" viewBox="0 0 50 70">' + face(c) + '</svg>'; }
  function tut() {
    // ids: red 7 is 13, blue 7 is 88, green skip 69, yellow reverse 46, blue draw-two 98, a wild 100, a wild draw-four 104
    var pic = function (inner) { return '<svg viewBox="0 0 200 110" width="100%" direction="ltr" font-family="inherit">' + inner + '</svg>'; };
    return [
      { title: C.t('tutTitle1'), text: C.t('tutText1'), art: pic(mini(13, 52, 27) + mini(88, 108, 27)) },
      { title: C.t('tutTitle2'), text: C.t('tutText2'), art: pic(mini(69, 30, 27) + mini(46, 80, 27) + mini(98, 130, 27)) },
      { title: C.t('tutTitle3'), text: C.t('tutText3'), art: pic(mini(100, 52, 27) + mini(104, 108, 27)) }
    ];
  }

  /* ------------------------------------------------------------ save */

  ctx.autosave(function () {
    if (!M || !M.R || M.R.winner >= 0 && (M.daily || M.scores[M.R.winner] >= E.TARGET)) return { inProgress: false };
    var v = JSON.parse(JSON.stringify(M));
    v.elapsed = (pausedAt || Date.now()) - M.startedAt;
    return { m: v };
  });
  function save() { ctx.save(); }
  C.onPause(function () { stopBot(); if (!pausedAt) pausedAt = Date.now(); });
  C.onResume(function () { if (pausedAt && M) M.startedAt += Date.now() - pausedAt; pausedAt = 0; if (M) maybeBot(); });
  // a turned phone changes the room for the hand: lay it out again
  window.addEventListener('resize', function () { if (M) renderHand(); });

  /* ------------------------------------------------------------ start */

  var saved = ctx.loadSave();
  var sv = saved && saved.m && saved.m.R && E.validRound(saved.m.R) ? saved.m : null;
  if (dailyDate) {
    if (sv && sv.daily === dailyDate) resume(sv);
    else newMatch(dailyDate);
    if (C.stats.dailyDone('hues', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).hues;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
    }
  } else if (sv && !sv.daily) resume(sv);
  else newMatch(null);
  ctx.tutorialIfNew(tut());
})();
</script>
</body>
</html>
