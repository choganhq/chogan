<script>
/* ==== ENGINE START ==== */
/* Blackjack without betting (#226): you and the dealer, one fresh shuffled deck a
   hand, a match of ten hands. A card is rank * 4 + suit, rank 0 = ace … 12 = king,
   the same numbering as Chogan.cards.                                            */
function BlackjackEngineFactory() {
  'use strict';

  var HANDS = 10;

  function shuffled(rnd) {
    var d = [];
    for (var i = 0; i < 52; i++) d.push(i);
    for (i = 51; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)), t = d[i]; d[i] = d[j]; d[j] = t; }
    return d;
  }
  function points(c) { var r = c >> 2; return r === 0 ? 1 : Math.min(10, r + 1); }

  // Best total: aces count 11 when that does not bust, otherwise 1
  function total(hand) {
    var sum = 0, aces = 0;
    for (var i = 0; i < hand.length; i++) { var p = points(hand[i]); sum += p; if (p === 1) aces++; }
    var soft = aces > 0 && sum + 10 <= 21;
    return { value: soft ? sum + 10 : sum, soft: soft };
  }
  function isBlackjack(hand) { return hand.length === 2 && total(hand).value === 21; }

  // Player, dealer, player, dealer: the order a real table deals in
  function deal(rnd) {
    var deck = shuffled(rnd);
    var H = { deck: deck, player: [deck.pop()], dealer: [deck.pop()], done: false, result: null };
    H.player.push(deck.pop()); H.dealer.push(deck.pop());
    // a natural on either side ends the hand at once; the dealer checks for one
    if (isBlackjack(H.player) || isBlackjack(H.dealer)) settle(H);
    return H;
  }

  function hit(H) {
    if (H.done) return false;
    H.player.push(H.deck.pop());
    var v = total(H.player).value;
    if (v > 21) settle(H);
    else if (v === 21) stand(H);
    return true;
  }

  // The dealer draws to 17 and stands on every 17, soft ones included
  function stand(H) {
    if (H.done) return false;
    if (total(H.player).value <= 21) while (total(H.dealer).value < 17) H.dealer.push(H.deck.pop());
    settle(H);
    return true;
  }

  // win, lose or push; a natural blackjack is its own kind of win
  function settle(H) {
    var p = total(H.player).value, d = total(H.dealer).value, pb = isBlackjack(H.player), db = isBlackjack(H.dealer);
    var r;
    if (pb && db) r = 'push';
    else if (pb) r = 'blackjack';
    else if (db) r = 'lose';
    else if (p > 21) r = 'bust';
    else if (d > 21) r = 'win';
    else r = p > d ? 'win' : (p < d ? 'lose' : 'push');
    H.done = true;
    H.result = r;
    return r;
  }
  function won(r) { return r === 'win' || r === 'blackjack'; }
  function lost(r) { return r === 'lose' || r === 'bust'; }

  // Basic strategy for hit or stand only (no splits, no doubles), against the
  // dealer's up card: the standard table every blackjack book prints.
  function advice(hand, up) {
    var t = total(hand), v = t.value, u = points(up) === 1 ? 11 : points(up);
    if (v >= 21) return 'stand';
    if (t.soft) return v >= 19 || (v === 18 && u <= 8) ? 'stand' : 'hit';
    if (v >= 17) return 'stand';
    if (v >= 13) return u <= 6 ? 'stand' : 'hit';
    if (v === 12) return u >= 4 && u <= 6 ? 'stand' : 'hit';
    return 'hit';
  }

  var api = { HANDS: HANDS, shuffled: shuffled, points: points, total: total, isBlackjack: isBlackjack,
    deal: deal, hit: hit, stand: stand, settle: settle, won: won, lost: lost, advice: advice };
  if (typeof self !== 'undefined') self.BlackjackEngine = api;
  return api;
}
if (typeof module !== 'undefined' && module.exports) module.exports = BlackjackEngineFactory;
/* ==== ENGINE END ==== */
</script>

  /* ------------------------------------------------------------- match */

  function newMatch(daily) {

    nextHand();
  }

  // The daily deals the same ten hands to everyone: each hand has its own seed
  function nextHand() {
    S.n++;
    var rnd = S.daily ? C.daily('blackjack', S.daily + '|' + S.n).rng : Math.random;
    S.H = E.deal(rnd);
    shown = 0; seenP = 0; tip = '';
    if (S.H.done) count();
    render(true);
    save();
  }

  function count() {
    var r = S.H.result;
    if (E.won(r)) S.wins++; else if (E.lost(r)) S.losses++; else S.pushes++;
    if (r === 'blackjack') { S.bjs++; C.achievements.unlock('bj-21'); }
  }

  function hit() {
    if (!S || busy || S.H.done) return;
    C.feedback('tap');
    E.hit(S.H);
    tip = '';
    after();
  }
  function stand() {
    if (!S || busy || S.H.done) return;
    C.feedback('select');
    E.stand(S.H);
    tip = '';
    after();
  }
  function after() {
    if (S.H.done) count();
    render(true);
    save();
  }

  function showAdvice() {
    if (!S || S.H.done) return;
    tip = E.advice(S.H.player, S.H.dealer[0]) === 'hit' ? C.t('adviceHit') : C.t('adviceStand');
    C.feedback('select');
    tipEl.textContent = tip;
  }

  function next() {
    if (!S || busy || !S.H.done) return;
    if (S.n >= E.HANDS) { finish(); return; }
    nextHand();
  }

    var coins = 4 + S.wins * 2 + S.bjs * 2 + (S.daily ? 8 : 0);
    var points = 10 + S.wins * 6 + S.bjs * 4 + (S.daily ? 25 : 0);
    if (won) C.achievements.unlock('bj-win');
    C.stats.best('blackjack', 'wins', S.wins, false);
    if (S.daily) {
      var first = C.stats.daily('blackjack', S.daily, { label: C.num(S.wins) + ' - ' + C.num(S.losses), win: won });
      if (!first) { coins = Math.round(coins * 0.2); points = Math.round(points * 0.2); }
    }
    ctx.clearSave();
    ctx.finish({
      won: won, title: draw ? C.t('matchDraw') : (won ? C.t('matchWon') : C.t('matchLost')),
      timeMs: Date.now() - S.startedAt, coins: coins, points: points,
      lines: [

  }

  // Cards are dealt from the shoe (#398): the opening four one by one, yours and
  // the dealer's in turn, with the dealer's second card face down; each later
  // card flies in and turns over. When a hand is over the hole card turns where
  // it lies and the cards the dealer drew follow a beat apart. The state is
  // already final; only the picture catches up, so a new tap is never held.
  function render(animate) {
    var H = S.H, hidden = !H.done, moving = animate && !C.ui.reduceMotion();
    clearTimeout(timer);
    busy = false;
    top.innerHTML = '';
    var shoe = C.cards.back('bj-shoe');
    top.appendChild(shoe);
    if (S.daily) top.appendChild(el('span', { class: 'ch-badge ch-badge--accent' }, [C.icon('calendar', 14), el('span', { text: C.t('dailyBj') + ' — ' + C.num(S.daily) })]));
    top.appendChild(el('span', { class: 'ch-badge', text: C.t('handN', { n: C.num(S.n), m: C.num(E.HANDS) }) }));
    top.appendChild(C.cards.backPicker());
    top.appendChild(C.cards.speedGear());

    var opening = moving && seenP === 0;
    youHand.innerHTML = '';
    H.player.forEach(function (c, i) {
      var b = C.cards.el(c);
      b.disabled = true;
      youHand.appendChild(b);
      if (moving && i >= seenP) C.ui.fly(b, shoe, { flip: true, delay: opening ? i * 2 * STEP : 0 });
    });
    seenP = H.player.length;
    totalBadge(youTotal, H.player, false);

    var drawDealer = function (k) {
      var nodes = [];
      dealerHand.innerHTML = '';
      H.dealer.forEach(function (c, i) {
        var b;
        if (i < k) { b = C.cards.el(c); b.disabled = true; }
        else if (hidden && i === 1) b = C.cards.back();
        else return;
        dealerHand.appendChild(b);
        nodes.push(b);
      });
      totalBadge(dealerTotal, H.dealer.slice(0, Math.max(1, k)), hidden);
      return nodes;
    };
    var target = hidden ? 1 : H.dealer.length;
    var settle = function (ms) {
      busy = true;
      timer = setTimeout(function () { busy = false; paintEnd(true); }, C.cards.pace(ms));
    };
    if (!moving) {
      drawDealer(target);
      shown = target;
      paintEnd(animate);
      return;
    }
    if (opening) {
      var last = 0;
      drawDealer(target).forEach(function (b, i) {
        last = (i < 2 ? i * 2 + 1 : i + 2) * STEP;
        C.ui.fly(b, shoe, { flip: i < target, delay: last });
      });
      shown = target;
      if (H.done) settle(last + DEAL_MS); else paintEnd(true);
      return;
    }
    var k = Math.max(1, shown);
    drawDealer(k);
    if (k >= target) { shown = target; paintEnd(true); return; }
    busy = true;
    var step = function () {
      k++;
      var nodes = drawDealer(k), b = nodes[k - 1];
      // the hole card turns in place; the rest come from the shoe
      C.ui.fly(b, k === 2 ? b : shoe, { flip: true });
      if (k < target) timer = setTimeout(step, C.cards.pace(DEAL_MS));
      else { shown = target; settle(DEAL_MS * 0.8); }
    };
    timer = setTimeout(step, C.cards.pace(DEAL_MS / 2));
  }

  // sound only when a hand has just ended, not when a saved hand is drawn again
  function paintEnd(fresh) {
    var H = S.H;
    msg.className = 'bj-msg';
    msg.textContent = '';
    if (H.done) {
      var r = H.result, dv = E.total(H.dealer).value;
      var key = r === 'win' && dv > 21 ? 'rDealerBust' : { win: 'rWin', blackjack: 'rBlackjack', lose: 'rLose', bust: 'rBust', push: 'rPush' }[r];
      msg.textContent = C.t(key);
      msg.classList.add(E.won(r) ? 'bj-msg--win' : (E.lost(r) ? 'bj-msg--lose' : 'bj-msg'));
      if (fresh) C.feedback(E.won(r) ? 'good' : (E.lost(r) ? 'bad' : 'tap'));
    }
    tipEl.textContent = tip;
    actions.innerHTML = '';
    if (!H.done) {
      actions.appendChild(el('button', { class: 'ch-btn ch-btn--primary', type: 'button', text: C.t('hit'), onclick: hit }));
      actions.appendChild(el('button', { class: 'ch-btn ch-btn--soft', type: 'button', text: C.t('stand'), onclick: stand }));
      actions.appendChild(el('button', { class: 'ch-btn ch-btn--soft ch-btn--sm', type: 'button', text: C.t('advice'), onclick: showAdvice }));
    } else {
      actions.appendChild(el('button', { class: 'ch-btn ch-btn--primary', type: 'button', text: S.n >= E.HANDS ? C.t('finished') : C.t('nextHand'), onclick: next }));
    }
    score.innerHTML = '';
    [['wins', S.wins], ['losses', S.losses], ['pushes', S.pushes]].forEach(function (p) {
      score.appendChild(el('span', {}, [el('span', { text: C.t(p[0]) + ' ' }), el('b', { text: C.num(p[1]) })]));
    });
  }

  /* -------------------------------------------------------------- save */

  ctx.autosave(function () {
    if (!S || (S.n >= E.HANDS && S.H.done)) return { inProgress: false };
    if (S.n === 1 && !S.H.done && S.H.player.length === 2) return { inProgress: false };
    return { s: { daily: S.daily, n: S.n, H: S.H, wins: S.wins, losses: S.losses, pushes: S.pushes, bjs: S.bjs, elapsed: Date.now() - S.startedAt } };
  });
  function save() { ctx.save(); }
  function validSave(v) {
    return !!(v && v.s && v.s.H && Array.isArray(v.s.H.player) && Array.isArray(v.s.H.dealer) && Array.isArray(v.s.H.deck) &&
      v.s.n >= 1 && v.s.n <= E.HANDS);
  }

  function askNew() {
    var go = function () { newMatch(S ? S.daily : null); };
    if (!S || S.n <= 1) { go(); return; }
    C.ui.confirm({ title: C.t('newGame'), body: C.t('resetWarn'), onOk: go });
  }

  window.addEventListener('keydown', function (e) {
    if (!S || document.querySelector('.ch-scrim') || e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key.toLowerCase();
    if (C.keyIs(e, 'h')) { e.preventDefault(); hit(); }
    else if (C.keyIs(e, 's')) { e.preventDefault(); stand(); }
    else if (C.keyIs(e, 'a')) { e.preventDefault(); showAdvice(); }
    else if (k === 'enter' && S.H.done) { e.preventDefault(); next(); }
  });

  /* -------------------------------------------------------------- help */

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [el('p', { class: 'ch-dim', text: C.t('rules') }), el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [kb('H', C.t('hit')), kb('S', C.t('stand')), kb('A', C.t('advice')), kb('Enter', C.t('nextHand'))])],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  function art(cards, total, col) {
    var s = '<svg viewBox="0 0 200 110" width="100%">';
    cards.forEach(function (t, i) {
      var x = 40 + i * 34;
      s += '<rect x="' + x + '" y="18" width="44" height="62" rx="6" fill="var(--c-surface)" stroke="var(--c-line)"/>' +
        '<text x="' + (x + 22) + '" y="56" text-anchor="middle" font-size="20" font-weight="800" fill="' + (/[♥♦]/.test(t) ? 'var(--c-bad)' : 'var(--c-text)') + '">' + t + '</text>';
    });
    return s + '<text x="100" y="102" text-anchor="middle" font-size="16" font-weight="800" fill="' + col + '">' + total + '</text></svg>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: art(['K♠', '9♥'], '19', 'var(--c-text)') },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: art(['7♣', '5♦', '9♠'], '21', 'var(--c-good)') },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: art(['A♥', 'Q♣'], '21', 'var(--c-gold)') }
  ];

  /* ------------------------------------------------------------- start */

  var saved = ctx.loadSave();
  if (validSave(saved) && (saved.s.daily || null) === (dailyDate || null)) {
    var v = saved.s;
    S = { daily: v.daily || null, n: v.n, H: v.H, wins: v.wins || 0, losses: v.losses || 0, pushes: v.pushes || 0, bjs: v.bjs || 0, startedAt: Date.now() - (v.elapsed || 0) };
    shown = S.H.done ? S.H.dealer.length : 1;
    seenP = S.H.player.length;
    render(false);
  } else {
    newMatch(dailyDate || null);
    if (dailyDate && C.stats.dailyDone('blackjack', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).blackjack;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec.label });
    }
  }
  ctx.tutorialIfNew(TUT);
})();
</script>
</body>
</html>
