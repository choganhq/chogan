<script>
/* ==== ENGINE START ==== */
function GinRummyEngineFactory() {
  'use strict';

  // A card is rank * 4 + suit, as in Chogan.cards (A..K = 0..12). Aces are low: A-2-3 is a
  // run, Q-K-A is not.
  var TARGET = 100, GIN = 25, UNDERCUT = 25, KNOCK = 10, HAND = 10;
  function rank(c) { return c >> 2; }
  function suit(c) { return c & 3; }
  function value(c) { var r = rank(c); return r >= 9 ? 10 : r + 1; }

  function shuffled(rnd) {
    var d = [];
    for (var i = 0; i < 52; i++) d.push(i);
    for (var j = 51; j > 0; j--) { var k = Math.floor(rnd() * (j + 1)), t = d[j]; d[j] = d[k]; d[k] = t; }
    return d;
  }

  // Every meld a hand could make: sets of three or four of a rank (each three of a four
  // too), and runs of three or more in a suit (every sub-run too)
  function allMelds(h) {
    var out = [], byRank = {}, bySuit = [[], [], [], []], i, j, k;
    for (i = 0; i < h.length; i++) { (byRank[rank(h[i])] = byRank[rank(h[i])] || []).push(h[i]); bySuit[suit(h[i])].push(h[i]); }
    for (var r in byRank) {
      var g = byRank[r];
      if (g.length === 4) { out.push(g.slice()); for (i = 0; i < 4; i++) out.push(g.filter(function (_, x) { return x !== i; })); }
      else if (g.length === 3) out.push(g.slice());
    }
    for (var s = 0; s < 4; s++) {
      var cs = bySuit[s].slice().sort(function (a, b) { return a - b; });
      for (i = 0; i < cs.length; i++) {
        var run = [cs[i]];
        for (j = i + 1; j < cs.length && rank(cs[j]) === rank(run[run.length - 1]) + 1; j++) {
          run.push(cs[j]);
          if (run.length >= 3) out.push(run.slice());
        }
      }
    }
    return out;
  }

  // The arrangement with the least deadwood: { melds, dead, points }
  function best(h) {
    var ms = allMelds(h), bestM = [], bestV = -1;
    var used = {};
    function rec(start, chosen, v) {
      if (v > bestV) { bestV = v; bestM = chosen.slice(); }
      for (var m = start; m < ms.length; m++) {
        var ok = true;
        for (var q = 0; q < ms[m].length; q++) if (used[ms[m][q]]) { ok = false; break; }
        if (!ok) continue;
        var mv = 0;
        for (q = 0; q < ms[m].length; q++) { used[ms[m][q]] = 1; mv += value(ms[m][q]); }
        chosen.push(ms[m]);
        rec(m + 1, chosen, v + mv);
        chosen.pop();
        for (q = 0; q < ms[m].length; q++) used[ms[m][q]] = 0;
      }
    }
    rec(0, [], 0);
    var inM = {};
    bestM.forEach(function (m) { m.forEach(function (c) { inM[c] = 1; }); });
    var dead = h.filter(function (c) { return !inM[c]; });
    var pts = 0;
    dead.forEach(function (c) { pts += value(c); });
    return { melds: bestM.map(function (m) { return m.slice(); }), dead: dead, points: pts };
  }
  function deadwood(h) { return best(h).points; }

  // A hand: { hands: [you, bot], stock, discard, turn, phase: 'draw' | 'discard' | 'over',
  // took: the card just taken from the discard (it can't go straight back), first: true
  // until the first draw (the upcard may be taken then) }
  function newHand(rnd, dealer) {
    var d = shuffled(rnd), H = { hands: [[], []], stock: [], discard: [], turn: 1 - (dealer || 0), phase: 'draw', took: -1, result: null, dealer: dealer || 0, seen: [[], []] };
    for (var i = 0; i < HAND; i++) { H.hands[0].push(d.pop()); H.hands[1].push(d.pop()); }
    H.discard.push(d.pop());
    H.stock = d;
    return H;
  }
  function top(H) { return H.discard.length ? H.discard[H.discard.length - 1] : -1; }

  // draw from 'stock' or 'discard'; the hand is a draw when the stock is down to two
  function draw(H, from) {
    if (H.phase !== 'draw') return -1;
    var c;
    if (from === 'discard') {
      if (!H.discard.length) return -1;
      c = H.discard.pop(); H.took = c;
      H.seen[H.turn].push(c);
    } else {
      if (H.stock.length <= 2) return -1;
      c = H.stock.pop(); H.took = -1;
    }
    H.hands[H.turn].push(c);
    H.phase = 'discard';
    return c;
  }
  function stockDead(H) { return H.phase === 'draw' && H.stock.length <= 2; }

  // discard card c; knock: also end the hand (allowed at 10 or less deadwood after the discard)
  function canDiscard(H, c) { return H.phase === 'discard' && H.hands[H.turn].indexOf(c) >= 0 && c !== H.took; }
  function canKnock(H, c) {
    if (!canDiscard(H, c)) return false;
    var rest = H.hands[H.turn].filter(function (x) { return x !== c; });
    return deadwood(rest) <= KNOCK;
  }
  function discard(H, c, knock) {
    if (!canDiscard(H, c) || (knock && !canKnock(H, c))) return false;
    var h = H.hands[H.turn];
    h.splice(h.indexOf(c), 1);
    H.discard.push(c);
    H.took = -1;
    if (knock) { settle(H, H.turn); return true; }
    H.turn = 1 - H.turn;
    H.phase = 'draw';
    if (stockDead(H)) { H.phase = 'over'; H.result = { draw: true, points: 0, winner: -1 }; }
    return true;
  }

  // Cards of the defender that can be laid off on the knocker's melds, run ends and sets
  // of three, again and again until nothing more fits
  function layOff(melds, dead) {
    var ms = melds.map(function (m) { return m.slice(); }), left = dead.slice(), off = [], moved = true;
    while (moved) {
      moved = false;
      for (var i = 0; i < left.length; i++) {
        var c = left[i];
        for (var k = 0; k < ms.length; k++) {
          var m = ms[k], fits = false;
          if (rank(m[0]) === rank(m[1])) fits = m.length < 4 && rank(c) === rank(m[0]);
          else {
            var lo = Math.min.apply(null, m), hi = Math.max.apply(null, m);
            fits = suit(c) === suit(m[0]) && (rank(c) === rank(lo) - 1 || rank(c) === rank(hi) + 1);
          }
          if (fits) { m.push(c); off.push(c); left.splice(i, 1); i--; moved = true; break; }
        }
      }
    }
    return { melds: ms, left: left, off: off };
  }

  // The showdown. Gin: 25 plus the defender's deadwood, no lay-offs. A knock: the defender
  // lays off, then the lower deadwood takes the difference; a defender as low or lower
  // undercuts and takes the difference plus 25.
  function settle(H, k) {
    var d = 1 - k, kb = best(H.hands[k]), db = best(H.hands[d]);
    var r = { knocker: k, gin: kb.points === 0, kMelds: kb.melds, kDead: kb.dead, kPts: kb.points, dMelds: db.melds, dDead: db.dead, off: [] };
    var dPts = db.points;
    if (!r.gin) {
      var lo = layOff(kb.melds, db.dead);
      r.off = lo.off; r.kMelds = lo.melds;
      dPts = 0; lo.left.forEach(function (c) { dPts += value(c); });
      r.dDead = lo.left;
    }
    r.dPts = dPts;
    if (r.gin) { r.winner = k; r.points = GIN + dPts; }
    else if (dPts <= kb.points) { r.winner = d; r.points = kb.points - dPts + UNDERCUT; r.undercut = true; }
    else { r.winner = k; r.points = dPts - kb.points; }
    H.phase = 'over';
    H.result = r;
    return r;
  }

  /* Bots. Easy takes the upcard only to complete a meld, discards its highest deadwood
     card and knocks as soon as it may. Medium judges every discard by the deadwood it
     leaves and keeps cards that are one away from a meld. Hard also remembers what you
     took from the discard pile and holds back cards you could use, and with a lot of
     stock left it waits for a lower knock. */
  function nearValue(h, c) {
    // how much a card helps toward melds: pairs and suit neighbours
    var n = 0;
    for (var i = 0; i < h.length; i++) {
      if (h[i] === c) continue;
      if (rank(h[i]) === rank(c)) n += 2;
      else if (suit(h[i]) === suit(c) && Math.abs(rank(h[i]) - rank(c)) <= 2) n += Math.abs(rank(h[i]) - rank(c)) === 1 ? 2 : 1;
    }
    return n;
  }
  function wantedBy(seen, c) {
    for (var i = 0; i < seen.length; i++) {
      var x = seen[i];
      if (rank(x) === rank(c) || (suit(x) === suit(c) && Math.abs(rank(x) - rank(c)) <= 1)) return true;
    }
    return false;
  }
  function botDraw(H, level) {
    var h = H.hands[H.turn], t = top(H);
    if (t < 0) return 'stock';
    var before = deadwood(h), after = best(h.concat([t]));
    // take it if it lands in a meld (and, above easy, if it is close to one and low)
    var inMeld = after.dead.indexOf(t) < 0;
    if (inMeld && after.points < before + value(t)) return 'discard';
    if (level !== 'easy' && value(t) <= 3 && nearValue(h, t) >= 2) return 'discard';
    return H.stock.length > 2 ? 'stock' : 'discard';
  }
  function botDiscard(H, level, rnd) {
    rnd = rnd || Math.random;
    var h = H.hands[H.turn], opp = H.seen[1 - H.turn], options = [];
    if (level === 'easy') {
      // any deadwood card at random, and it only knocks once the deadwood is down to 5
      var dead = best(h).dead.filter(function (x) { return x !== H.took; });
      if (!dead.length) dead = h.filter(function (x) { return x !== H.took; });
      var c0 = dead[Math.floor(rnd() * dead.length)], dw0 = deadwood(h.filter(function (x) { return x !== c0; }));
      return { c: c0, knock: dw0 <= 5 };
    }
    for (var i = 0; i < h.length; i++) {
      var c = h[i];
      if (c === H.took) continue;
      var rest = h.filter(function (x) { return x !== c; }), b = best(rest);
      // the deadwood left first; then keep cards one away from a meld
      var score = b.points * 10 + nearValue(h, c) * 4;
      // hard: a card next to what you took from the pile helps you, so it is kept back
      if (level === 'hard' && wantedBy(opp, c)) score += 6;
      options.push({ c: c, s: score, dw: b.points });
    }
    options.sort(function (a, b) { return a.s - b.s || a.c - b.c; });
    return { c: options[0].c, knock: options[0].dw <= KNOCK };
  }

  function score(c) { return value(c); }

  function validHand(v) {
    if (!v || !Array.isArray(v.hands) || v.hands.length !== 2 || !Array.isArray(v.stock) || !Array.isArray(v.discard)) return false;
    var seen = {}, n = 0, ok = true;
    var add = function (c) { if (typeof c !== 'number' || c < 0 || c > 51 || seen[c]) ok = false; seen[c] = 1; n++; };
    v.hands.forEach(function (h) { if (!Array.isArray(h)) ok = false; else h.forEach(add); });
    v.stock.forEach(add); v.discard.forEach(add);
    return ok && n === 52 && (v.turn === 0 || v.turn === 1) && ['draw', 'discard', 'over'].indexOf(v.phase) >= 0;
  }

  return {
    TARGET: TARGET, GIN: GIN, UNDERCUT: UNDERCUT, KNOCK: KNOCK, rank: rank, suit: suit, value: value, score: score,
    allMelds: allMelds, best: best, deadwood: deadwood, newHand: newHand, top: top, draw: draw, stockDead: stockDead,
    canDiscard: canDiscard, canKnock: canKnock, discard: discard, layOff: layOff, settle: settle,
    botDraw: botDraw, botDiscard: botDiscard, validHand: validHand
  };
}
if (typeof module !== 'undefined' && module.exports) module.exports = GinRummyEngineFactory;
/* ==== ENGINE END ==== */
</script>

  var params = new URLSearchParams(location.search);
  var dailyDate = params.get('daily');
  var prefs = ctx.store.get('prefs', { level: 'medium' });
  if (LEVELS.indexOf(prefs.level) < 0) prefs.level = 'medium';

  var BOT_MS = 650;
  var M = null, botTimer = null, sel = -1, kf = -1, msg = '', pausedAt = 0, botRnd = Math.random, press = null;

  var top = el('div', { class: 'gr-top' });
  var botBox = el('div', { class: 'gr-bot' });
  var stockBtn = el('button', { class: 'gr-stock', type: 'button', 'aria-label': C.t('kbStock') });
  var pileBtn = el('button', { class: 'gr-pile', type: 'button', 'aria-label': C.t('kbPile') });
  var table = el('div', { class: 'gr-table' }, [stockBtn, pileBtn]);
  var status = el('div', { class: 'gr-status', role: 'status', 'aria-live': 'polite' });
  var hand = el('div', { class: 'gr-hand' });
  var actions = el('div', { class: 'gr-actions' });
  var wrap = el('div', { class: 'gr-wrap' }, [top, botBox, table, status, hand, actions]);
  stockBtn.addEventListener('click', function () { humanDraw('stock'); });
  pileBtn.addEventListener('click', function () { humanDraw('discard'); });

  ctx.button({ icon: 'help', label: C.t('help'), onClick: showHelp });
  ctx.button({ icon: 'refresh', label: C.t('newMatch'), onClick: askNew });
  ctx.main.appendChild(wrap);
  ctx.mount();

  function H() { return M && M.H; }
  function mine() { return H() && H().turn === 0 && H().phase !== 'over'; }

  /* ------------------------------------------------------------ start */

  function newMatch(daily) {
    stopBot();
    M = { level: daily ? 'hard' : prefs.level, scores: [0, 0], hand: 0, daily: daily || null, startedAt: Date.now(), gins: 0, undercuts: 0, H: null, order: [] };
    newHand();
  }
  function newHand() {
    stopBot();
    M.hand++;
    var rnd = M.daily ? C.daily('ginrummy', M.daily).rng : Math.random;
    botRnd = M.daily ? C.daily('ginrummy', M.daily + '|bot').rng : Math.random;
    // the dealer alternates; the other player moves first
    M.H = E.newHand(rnd, M.daily ? 1 : (M.hand + 1) % 2);
    M.order = arranged(M.H.hands[0]);
    sel = -1; kf = -1; msg = '';
    render();
    dealIn();
    save();
    maybeBot();
  }
  function resume(v) {
    M = v;
    // closed after a knock: the showdown (and its points) comes first
    if (M.H.phase === 'over') { M.startedAt = Date.now() - (v.elapsed || 0); if (M.H.scored) newHand(); else { render(); showdown(); } return; }
    botRnd = M.daily ? C.daily('ginrummy', M.daily + '|bot|' + M.H.stock.length).rng : Math.random;
    M.startedAt = Date.now() - (v.elapsed || 0);
    sel = -1; msg = '';
    syncOrder();
    render();
    maybeBot();
  }

  // melds first, each in order, then the deadwood by suit and rank
  function arranged(h) {
    var b = E.best(h), out = [];
    b.melds.forEach(function (m) { m.slice().sort(function (a, c) { return a - c; }).forEach(function (c) { out.push(c); }); });
    b.dead.slice().sort(function (a, c) { return E.suit(a) - E.suit(c) || E.rank(a) - E.rank(c); }).forEach(function (c) { out.push(c); });
    return out;
  }
  // keep the player's own order, dropping cards that left and adding new ones at the end
  function syncOrder() {
    var h = M.H.hands[0];
    M.order = (M.order || []).filter(function (c) { return h.indexOf(c) >= 0; });
    h.forEach(function (c) { if (M.order.indexOf(c) < 0) M.order.push(c); });
  }

  /* ------------------------------------------------------------- draw */

  function renderTop() {
    top.innerHTML = '';
    if (M.daily) top.appendChild(el('span', { class: 'ch-badge ch-badge--accent' }, [C.icon('calendar', 14), el('span', { text: C.t('dailyGr') + ' — ' + C.num(M.daily) })]));
    else {
      top.appendChild(el('span', { class: 'ch-badge', text: C.t('handN', { n: C.num(M.hand) }) }));
      top.appendChild(el('span', { class: 'ch-badge', text: C.t('you') + ' ' + C.num(M.scores[0]) + ' · ' + C.t('bot') + ' ' + C.num(M.scores[1]) }));
    }
    top.appendChild(C.cards.backPicker());
    // options behind a gear in the top row, never in «?» (#409)
    var gear = el('button', { class: 'ch-iconbtn', type: 'button', 'aria-label': C.t('settings'), title: C.t('settings') }, [C.icon('gear', 20)]);
    gear.addEventListener('click', showSettings);
    top.appendChild(gear);
  }

  function render() {
    var h = H();
    syncOrder();
    renderTop();
    botBox.className = 'gr-bot' + (h.turn === 1 && h.phase !== 'over' ? ' gr-bot--on' : '');
    botBox.innerHTML = '';
    var fan = el('div', { class: 'gr-fan', 'aria-hidden': 'true' });
    for (var i = 0; i < h.hands[1].length; i++) fan.appendChild(C.cards.back());
    botBox.appendChild(el('span', { text: C.t('bot') + ' · ' + C.t(M.level) }));
    botBox.appendChild(fan);
    var canDraw = mine() && h.phase === 'draw';
    stockBtn.innerHTML = '';
    stockBtn.appendChild(C.cards.back());
    stockBtn.appendChild(el('span', { class: 'gr-left', text: C.num(h.stock.length) }));
    stockBtn.disabled = !canDraw || h.stock.length <= 2;
    stockBtn.classList.toggle('gr-hint', canDraw);
    pileBtn.innerHTML = '';
    var t = E.top(h);
    if (t >= 0) { var tc = C.cards.el(t); tc.tabIndex = -1; pileBtn.appendChild(tc); }
    pileBtn.disabled = !canDraw || t < 0;
    pileBtn.classList.toggle('gr-hint', canDraw && t >= 0);
    renderHand();
    renderActions();
    var st = msg;
    if (!st && h.phase !== 'over') st = h.turn === 1 ? C.t('thinking') : (h.phase === 'draw' ? C.t('drawHint') : C.t('discardHint'));
    status.textContent = st;
  }

  function renderHand() {
    var h = H(), b = E.best(h.hands[0]), meldOf = {};
    b.melds.forEach(function (m, k) { m.forEach(function (c) { meldOf[c] = k % 4; }); });
    hand.innerHTML = '';
    var cw = parseFloat(getComputedStyle(wrap).getPropertyValue('--cw')) || 56;
    var n = M.order.length, room = hand.clientWidth || 360;
    var over = n > 1 ? Math.min(-4, (room - cw * n) / (n - 1)) : 0;
    over = Math.max(over, -cw * 0.66);
    M.order.forEach(function (c, i) {
      var cls = (c === sel ? 'gr-sel' : '') + (meldOf[c] !== undefined ? ' gr-m' + meldOf[c] : '');
      var node = C.cards.el(c, cls.trim());
      node._c = c;
      if (i) node.style.marginInlineStart = over + 'px';
      if (kf === i) node.style.outline = '3px solid var(--game)';
      hand.appendChild(node);
    });
  }

  function renderActions() {
    var h = H();
    actions.innerHTML = '';
    var ar = el('button', { class: 'ch-btn ch-btn--soft', type: 'button', text: C.t('arrange') });
    ar.addEventListener('click', function () { M.order = arranged(h.hands[0]); C.feedback('tap'); renderHand(); save(); });
    actions.appendChild(ar);
    actions.appendChild(el('span', { class: 'ch-badge gr-dw', text: C.t('deadwood', { n: C.num(E.deadwood(h.hands[0].length > 10 && sel >= 0 ? h.hands[0].filter(function (x) { return x !== sel; }) : h.hands[0])) }) }));
    if (!mine() || h.phase !== 'discard') return;
    var db = el('button', { class: 'ch-btn ch-btn--soft', type: 'button', text: C.t('discardBtn') });
    db.disabled = sel < 0;
    db.addEventListener('click', function () { humanDiscard(false); });
    actions.appendChild(db);
    if (sel >= 0 && E.canKnock(h, sel)) {
      var dw = E.deadwood(h.hands[0].filter(function (x) { return x !== sel; }));
      var kb2 = el('button', { class: 'ch-btn ch-btn--primary', type: 'button', text: dw === 0 ? C.t('gin') : C.t('knock', { n: C.num(dw) }) });
      kb2.addEventListener('click', function () { humanDiscard(true); });
      actions.appendChild(kb2);
    }
  }

  // a new hand: your ten cards fly in from the stock, turning over (#398)
  function dealIn() {
    if (C.ui.reduceMotion()) return;
    var from = stockBtn.getBoundingClientRect();
    for (var i = 0; i < hand.children.length; i++) C.ui.fly(hand.children[i], from, { ms: 220, delay: i * 40, flip: true });
  }
  function handNode(c) { for (var i = 0; i < hand.children.length; i++) if (hand.children[i]._c === c) return hand.children[i]; return null; }

  /* ------------------------------------------------------------ moves */

  function humanDraw(from) {
    var h = H();
    if (!mine() || h.phase !== 'draw' || document.querySelector('.ch-scrim')) return;
    var rect = (from === 'stock' ? stockBtn : pileBtn).getBoundingClientRect();
    var c = E.draw(h, from);
    if (c < 0) { C.feedback('bad'); return; }
    C.audio.sfx('flip');
    sel = -1; msg = '';
    render();
    var n = handNode(c);
    if (n) C.ui.fly(n, rect, { ms: 220, flip: from === 'stock' });
    save();
  }

  function tapCard(c, node) {
    var h = H();
    if (!mine() || document.querySelector('.ch-scrim')) return;
    if (h.phase !== 'discard') { C.feedback('bad'); msg = C.t('drawHint'); render(); msg = ''; return; }
    if (c === h.took) { C.feedback('bad'); C.ui.shake(node); msg = C.t('notTook'); render(); msg = ''; return; }
    // a second tap on the chosen card discards it
    if (sel === c) { humanDiscard(false); return; }
    sel = c;
    C.feedback('select');
    render();
  }

  function humanDiscard(knock) {
    var h = H();
    if (!mine() || h.phase !== 'discard') return;
    if (sel < 0) { C.feedback('bad'); msg = C.t('pickFirst'); render(); msg = ''; return; }
    var node = handNode(sel), rect = node ? node.getBoundingClientRect() : null, c = sel;
    if (!E.discard(h, c, knock)) { C.feedback('bad'); return; }
    C.audio.sfx('place'); C.haptic('tap');
    sel = -1;
    if (knock) msg = h.result && h.result.gin ? C.t('youGin') : C.t('youKnock');
    after(rect, false);
  }

  function after(rect, flip) {
    render();
    if (rect && pileBtn.firstChild) C.ui.fly(pileBtn.firstChild, rect, { ms: 240, flip: !!flip });
    save();
    if (H().phase === 'over') { setTimeout(showdown, C.cards.pace(700)); return; }
    maybeBot();
  }

  function maybeBot() {
    stopBot();
    var h = H();
    if (h.phase === 'over' || h.turn !== 1) return;
    botTimer = setTimeout(function () {
      botTimer = null;
      if (H() !== h || h.turn !== 1 || h.phase === 'over') return;
      if (h.phase === 'draw') {
        var from = E.botDraw(h, M.level);
        if (E.draw(h, from) < 0 && E.draw(h, from === 'stock' ? 'discard' : 'stock') < 0) { h.phase = 'over'; h.result = { draw: true, points: 0, winner: -1 }; after(null); return; }
        msg = from === 'discard' ? C.t('botTookUp') : C.t('botTookStock');
        C.audio.sfx('flip');
        render(); save(); maybeBot();
        return;
      }
      var m = E.botDiscard(h, M.level, botRnd), rect = botBox.getBoundingClientRect();
      E.discard(h, m.c, m.knock);
      C.audio.sfx('place');
      msg = m.knock ? (h.result && h.result.gin ? C.t('botGin') : C.t('botKnock')) : '';
      after(rect, true);
    }, C.cards.pace(C.ui.reduceMotion() ? 300 : BOT_MS));
  }
  function stopBot() { if (botTimer) { clearTimeout(botTimer); botTimer = null; } }

  /* ---------------------------------------------------------- showdown */

  function meldRow(cards, off, dead) {
    var r = el('div', { class: 'gr-meld' + (dead ? ' gr-meld--dead' : '') });
    cards.slice().sort(function (a, b) { return a - b; }).forEach(function (c) { var n = C.cards.el(c, off && off.indexOf(c) >= 0 ? 'gr-off' : ''); n.disabled = true; r.appendChild(n); });
    return r;
  }
  function showdown() {
    var h = H(), r = h.result;
    if (!r || h.scored) return;
    h.scored = true;
    if (r.draw) {
      msg = C.t('handDraw');
      return nextOrEnd(C.t('handDraw'), [el('p', { class: 'ch-dim', text: C.t('handDraw') })]);
    }
    M.scores[r.winner] += r.points;
    if (r.winner === 0 && r.gin) { M.gins++; C.achievements.unlock('gr-gin'); }
    if (r.winner === 0 && r.undercut) { M.undercuts++; C.achievements.unlock('gr-under'); }
    var k = r.knocker, who = function (p) { return p === 0 ? C.t('you') : C.t('bot'); };
    var side = function (p) {
      var melds = p === k ? r.kMelds : r.dMelds, dead = p === k ? r.kDead : r.dDead, row = el('div', { class: 'gr-row' });
      melds.forEach(function (m) { row.appendChild(meldRow(m, p === k ? r.off : null, false)); });
      if (dead.length) row.appendChild(meldRow(dead, null, true));
      return el('div', { class: 'gr-show' }, [el('div', { class: 'gr-show__who', text: who(p) + ' · ' + C.t('deadwood', { n: C.num(p === k ? r.kPts : r.dPts) }) }), row]);
    };
    var title = r.winner === 0 ? C.t('wonHand', { n: C.num(r.points) }) : C.t('lostHand', { n: C.num(r.points) });
    var note = r.gin ? (k === 0 ? C.t('youGin') : C.t('botGin')) : (r.undercut ? C.t('undercut') : (k === 0 ? C.t('youKnock') : C.t('botKnock')));
    var body = [el('p', { class: 'ch-dim', text: note + (r.off.length ? ' · ' + C.t('layoff') : '') }), side(k), side(1 - k)];
    if (r.winner === 0 && pileBtn.firstChild) C.ui.burst(pileBtn, { count: 20, speed: 230, ring: 28, colors: ['#F2B84B', '#A45C54', '#FFF1C9'] });
    nextOrEnd(title, body);
  }
  function nextOrEnd(title, body) {
    save();
    var over = M.daily || M.scores[0] >= E.TARGET || M.scores[1] >= E.TARGET;
    var h = H();
    C.ui.modal({
      title: title,
      body: body,
      actions: [{ label: over ? C.t('done') : C.t('nextHand'), kind: 'primary', onClick: function () { if (over) finish(); else newHand(); } }],
      onClose: function () { if (H() === h) { if (over) finish(); else newHand(); } }
    });
  }

  function finish() {
    if (!M || M.done) return;
    M.done = true;
    var ms = Date.now() - M.startedAt, r = H().result || {};
    var won = M.daily ? r.winner === 0 : M.scores[0] > M.scores[1];
    var base = { easy: 6, medium: 12, hard: 20 }[M.level] || 12;
    var coins = won ? base + (M.daily ? 8 : 0) : Math.max(2, Math.round(base * 0.3));
    var points = won ? base * 4 + (M.daily ? 25 : 0) : Math.round(base * 1.2);
    if (won && !M.daily) C.achievements.unlock('gr-win');
    if (M.daily) {
      var first = C.stats.daily('ginrummy', M.daily, { label: won ? C.t('wonHand', { n: C.num(r.points || 0) }) : C.t('handDraw'), win: won });
      if (!first) { coins = Math.round(coins * 0.2); points = Math.round(points * 0.2); }
    }
    ctx.clearSave();
    ctx.finish({
      won: won,
      title: won ? C.t('matchWon') : C.t('matchLost'),
      timeMs: ms, coins: coins, points: points,
      lines: [
        { label: C.t('you'), value: C.num(M.scores[0]) },
        { label: C.t('bot'), value: C.num(M.scores[1]) },
        { label: C.t('hands'), value: C.num(M.hand) }
      ],
      shareText: 'چوگان · جین رامی' + (M.daily ? ('\nروزانه ' + M.daily) : '') + '\n' + C.num(M.scores[0]) + ' - ' + C.num(M.scores[1]),
      onAgain: M.daily ? null : function () { newMatch(null); }
    });
  }

  /* ------------------------------------------------------------ input */

  // A tap picks (or, a second time, discards) a card; dragging it sideways moves it in your hand
  hand.addEventListener('pointerdown', function (e) {
    var n = e.target.closest ? e.target.closest('.ch-pcard') : null;
    if (!n || n._c === undefined || !M || H().phase === 'over') return;
    press = { id: e.pointerId, c: n._c, node: n, x0: e.clientX, y0: e.clientY, drag: false };
    try { hand.setPointerCapture(e.pointerId); } catch (err) { /* older WebViews */ }
  });
  hand.addEventListener('pointermove', function (e) {
    if (!press || press.id !== e.pointerId) return;
    var dx = e.clientX - press.x0;
    if (!press.drag && Math.abs(dx) < 10) return;
    press.drag = true;
    press.node.classList.add('gr-drag');
    press.node.style.transform = 'translate(' + dx + 'px, -6px)';
    press.x = e.clientX;
  });
  function endPress(e, cancelled) {
    if (!press || press.id !== e.pointerId) return;
    var p = press;
    press = null;
    if (cancelled) { renderHand(); return; }
    if (!p.drag) { tapCard(p.c, p.node); return; }
    // the new place is where the card's centre landed among the others
    var kids = [].slice.call(hand.children).filter(function (k) { return k !== p.node; }), at = kids.length;
    for (var i = 0; i < kids.length; i++) { var r = kids[i].getBoundingClientRect(); if (p.x < r.left + r.width / 2) { at = i; break; } }
    var order = M.order.filter(function (c) { return c !== p.c; });
    order.splice(at, 0, p.c);
    M.order = order;
    renderHand();
    save();
  }
  hand.addEventListener('pointerup', function (e) { endPress(e, false); });
  hand.addEventListener('pointercancel', function (e) { endPress(e, true); });

  window.addEventListener('keydown', function (e) {
    if (!M || document.querySelector('.ch-scrim')) return;
    var tg = e.target, tag = tg && tg.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter'))) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var n = M.order.length, k = e.key;
    if (k === 'ArrowLeft' || k === 'ArrowRight') { kf = kf < 0 ? 0 : (kf + (k === 'ArrowRight' ? 1 : n - 1)) % n; renderHand(); e.preventDefault(); return; }
    if (k === 'Enter' && kf >= 0 && hand.children[kf]) { tapCard(M.order[kf], hand.children[kf]); e.preventDefault(); return; }
    if (C.keyIs(e, 's')) { humanDraw('stock'); e.preventDefault(); return; }
    if (C.keyIs(e, 'p')) { humanDraw('discard'); e.preventDefault(); return; }
    if (C.keyIs(e, 'd')) { humanDiscard(false); e.preventDefault(); return; }
    if (C.keyIs(e, 'k')) { if (sel >= 0 && E.canKnock(H(), sel)) humanDiscard(true); else C.feedback('bad'); e.preventDefault(); return; }
    if (C.keyIs(e, 'a')) { M.order = arranged(H().hands[0]); renderHand(); e.preventDefault(); }
  });

  /* ----------------------------------------------------------- dialogs */

  function showSettings() {
    var seg = C.ui.segmented(LEVELS.map(function (l) { return { value: l, label: C.t(l) }; }), prefs.level, function (v) { prefs.level = v; ctx.store.set('prefs', prefs); });
    C.ui.modal({
      title: C.t('settings'),
      body: [el('div', { class: 'ch-list' }, [el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: C.t('level') }), seg]), C.cards.speedRow()]), el('p', { class: 'ch-dim', text: C.t('optNote') })],
      actions: [{ label: C.t('done'), kind: 'primary' }]
    });
  }
  function askNew() {
    if (document.querySelector('.ch-scrim')) return;
    var dd = M ? M.daily : null;
    var started = M && (M.hand > 1 || M.H.stock.length !== 31);
    if (!started) { newMatch(dd); return; }
    C.ui.confirm({ title: C.t('newMatch'), body: C.t('resetWarn'), onOk: function () { newMatch(dd); } });
  }
  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [kb('← →', C.t('kbCards')), kb('Enter', C.t('kbPick')), kb('S', C.t('kbStock')), kb('P', C.t('kbPile')), kb('D', C.t('kbDiscard')), kb('K', C.t('kbKnock')), kb('A', C.t('kbArrange'))])
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }

  function svgCard(x, y, label, red) {
    return '<rect x="' + x + '" y="' + y + '" width="30" height="42" rx="4" fill="var(--c-surface)" stroke="var(--c-line)"/>' +
      '<text x="' + (x + 4) + '" y="' + (y + 14) + '" font-size="12" font-weight="800" fill="' + (red ? 'var(--c-bad)' : 'var(--c-text)') + '">' + label + '</text>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: '<svg viewBox="0 0 200 110" width="100%" direction="ltr">' + svgCard(10, 34, '7♣︎', false) + svgCard(34, 34, '7♦︎', true) + svgCard(58, 34, '7♠︎', false) +
      svgCard(110, 34, '4♥︎', true) + svgCard(134, 34, '5♥︎', true) + svgCard(158, 34, '6♥︎', true) + '</svg>' },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: '<svg viewBox="0 0 200 110" width="100%" direction="ltr"><rect x="40" y="34" width="30" height="42" rx="4" fill="#1F3A93" stroke="#FBF5E6" stroke-width="2"/>' +
      '<path d="M78 55 H 112" stroke="var(--game)" stroke-width="4" stroke-linecap="round"/><path d="M104 47 l 9 8 -9 8" stroke="var(--game)" stroke-width="4" fill="none" stroke-linecap="round"/>' + svgCard(124, 34, 'K♠︎', false) + '</svg>' },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: '<svg viewBox="0 0 200 110" width="100%" direction="ltr">' + svgCard(30, 34, '2♣︎', false) + svgCard(54, 34, '3♣︎', false) + svgCard(78, 34, 'A♦︎', true) +
      '<text x="150" y="64" font-size="22" font-weight="800" text-anchor="middle" fill="var(--game)">≤10</text></svg>' }
  ];

  /* ------------------------------------------------------------ save */

  ctx.autosave(function () {
    if (!M || !M.H || M.done) return { inProgress: false };
    var v = JSON.parse(JSON.stringify(M));
    v.elapsed = (pausedAt || Date.now()) - M.startedAt;
    return { m: v };
  });
  function save() { ctx.save(); }
  C.onPause(function () { stopBot(); if (!pausedAt) pausedAt = Date.now(); });
  C.onResume(function () { if (pausedAt && M) M.startedAt += Date.now() - pausedAt; pausedAt = 0; if (M) maybeBot(); });
  window.addEventListener('resize', function () { if (M) renderHand(); });

  /* ------------------------------------------------------------ start */

  var saved = ctx.loadSave();
  var sv = saved && saved.m && saved.m.H && E.validHand(saved.m.H) ? saved.m : null;
  if (dailyDate) {
    if (sv && sv.daily === dailyDate) resume(sv);
    else newMatch(dailyDate);
    if (C.stats.dailyDone('ginrummy', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).ginrummy;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
    }
  } else if (sv && !sv.daily) resume(sv);
  else newMatch(null);
  ctx.tutorialIfNew(TUT);
})();
</script>
</body>
</html>
