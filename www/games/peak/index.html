<style>

  :root[data-theme="dark"] { --ch-pface: var(--c-surface-3); }
  /* cards grow with the game area (#359); the rivals' cards are a little smaller than the hand */
  .pk-wrap { --cw: clamp(42px, min(14cqw, (100cqh - 290px) / 4.4), 92px); --sw: calc(var(--cw) * .86);

  .pk-seats { width: 100%; display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: var(--s-2); }
  .pk-seat { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 4px 8px; min-width: 0;
    background: var(--c-surface); border-radius: var(--r-md); box-shadow: var(--sh-1); border: 2px solid transparent; }

<script>
/* ==== ENGINE START ==== */
function PeakEngineFactory() {
  'use strict';

  // 90 numbered cards: many low ones, few high ones (#635)
  var COUNTS = { 2: 16, 3: 12, 4: 9, 5: 8, 6: 6, 7: 6, 8: 5, 9: 4, 10: 4, 11: 4, 12: 3, 13: 3, 14: 3, 15: 2, 16: 1, 17: 1, 18: 1, 19: 1, 20: 1 };
  var HAND = 6, MIN = 3, MAX = 6;

  function deck() {
    var d = [];
    for (var f = 2; f <= 20; f++) for (var i = 0; i < COUNTS[f]; i++) d.push(f);
    return d;
  }
  function shuffled(rnd) {
    var d = deck();
    for (var i = d.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)), t = d[i]; d[i] = d[j]; d[j] = t; }
    return d;
  }
  function blank(n) {
    var S = { n: n, pile: [], hands: [], table: [], discard: [], turn: 0, winners: [], moves: 0 };
    for (var p = 0; p < n; p++) { S.hands.push([]); S.table.push(0); }
    return S;
  }
  function newGame(n, rnd, first) {
    n = Math.max(MIN, Math.min(MAX, n | 0));
    var S = blank(n), d = shuffled(rnd);
    for (var k = 0; k < HAND; k++) for (var p = 0; p < n; p++) S.hands[p].push(d.pop());
    S.pile = d;
    S.turn = first > 0 && first < n ? first | 0 : 0;
    return S;
  }
  // a set position for tests and the tutorial; the pile is drawn from its end
  function make(hands, pile, table) {
    var S = blank(hands.length);
    S.hands = hands.map(function (h) { return h.slice(); });
    S.pile = (pile || []).slice();
    if (table) S.table = table.slice();
    return S;
  }
  function clone(S) { return JSON.parse(JSON.stringify(S)); }

  function count(S, f) { var c = 0; for (var p = 0; p < S.n; p++) if (S.table[p] === f) c++; return c; }
  // a card counts its face once for every card of that face on the table, itself included
  function value(S, p) { var f = S.table[p]; return f ? f * count(S, f) : 0; }
  function over(S) { return S.winners.length > 0; }

  // An empty pile is rebuilt from the discards, as in the original rules (#635): without it a
  // beaten player could run out of cards off-turn and win for free once the pile ran dry.
  // The shuffle is seeded from the position, so a daily deal plays the same for everyone.
  function refill(S) {
    var d = S.discard, h = (S.moves * 2654435761) >>> 0, i;
    for (i = 0; i < d.length; i++) h = Math.imul(h ^ d[i], 16777619) >>> 0;
    for (i = d.length - 1; i > 0; i--) {
      h = (Math.imul(h, 1103515245) + 12345) >>> 0;
      var j = (h >>> 8) % (i + 1), t = d[i]; d[i] = d[j]; d[j] = t;
    }
    S.pile = d;
    S.discard = [];
  }

  // the start of a turn: a card that was not beaten since the last turn leaves without a draw
  function begin(S) {
    var ev = [], p = S.turn;
    if (over(S) || !S.table[p]) return ev;
    ev.push({ t: 'clear', p: p, face: S.table[p] });
    S.discard.push(S.table[p]);
    S.table[p] = 0;
    if (!S.hands[p].length) { S.winners = [p]; ev.push({ t: 'win', ps: [p] }); }
    return ev;
  }
  function legal(S) {
    if (over(S) || S.table[S.turn]) return [];
    var seen = {}, L = [];
    S.hands[S.turn].forEach(function (f) { if (!seen[f]) { seen[f] = 1; L.push(f); } });
    return L.sort(function (a, b) { return a - b; });
  }

  function play(S, face) {
    var p = S.turn;
    if (legal(S).indexOf(face) < 0) return null;
    var h = S.hands[p];
    h.splice(h.indexOf(face), 1);
    S.table[p] = face;
    S.moves++;
    var ev = [{ t: 'play', p: p, face: face, v: value(S, p) }];
    // combinations are counted again after every card that leaves; ties stay
    for (;;) {
      var v = value(S, p), lose = [];
      for (var q = 0; q < S.n; q++) if (q !== p && S.table[q] && value(S, q) < v) lose.push(q);
      if (!lose.length) break;
      lose.forEach(function (q) {
        ev.push({ t: 'beat', p: q, face: S.table[q] });
        S.discard.push(S.table[q]);
        S.table[q] = 0;
      });
      lose.forEach(function (q) {
        if (!S.pile.length) { refill(S); ev.push({ t: 'reshuffle', k: S.pile.length }); }
        var f = S.pile.pop(); S.hands[q].push(f); ev.push({ t: 'draw', p: q, face: f });
      });
    }
    // a beaten player always draws, so a hand only empties on its owner's own turn (begin)
    S.turn = (p + 1) % S.n;
    return ev;
  }

  // what a face would do now, without changing the game
  function preview(S, face) {
    var T = { n: S.n, table: S.table.slice() }, p = S.turn;
    T.table[p] = face;
    var v = value(T, p), beaten = [], partners = [];
    for (var q = 0; q < S.n; q++) {
      if (q === p || !T.table[q]) continue;
      if (value(T, q) < v) beaten.push(q);
      else if (T.table[q] === face) partners.push(q);
    }
    return { v: v, beaten: beaten, partners: partners };
  }

  // the cards a player cannot see: all of the deck but their hand, the table and the discards
  function unseen(S, p) {
    var c = {};
    for (var f = 2; f <= 20; f++) c[f] = COUNTS[f];
    S.hands[p].forEach(function (f) { c[f]--; });
    S.table.forEach(function (f) { if (f) c[f]--; });
    S.discard.forEach(function (f) { c[f]--; });
    return c;
  }
  // Measured on 600 four-player games against random players (#635): always playing the
  // lowest card wins 32%, the highest 22%. A beaten low card is swapped for a fresh one
  // from the pile, which is on average higher, so the high cards are worth keeping.
  function lowBeat(S) {
    var L = legal(S), best = L[0], bs = -1e9;
    L.forEach(function (f) { var s = -f + preview(S, f).beaten.length * 3; if (s > bs) { bs = s; best = f; } });
    return best;
  }
  // the hard bot plays each candidate out to the end many times, over the same guesses of
  // the hidden cards, so combining and timing (an empty pile, a rival about to finish) are
  // weighed by what actually happens, not by a rule of thumb
  function rollouts(S, rnd, R) {
    var me = S.turn, L = legal(S), pool = unseen(S, me), un = [], deals = [], f, i, k;
    for (f = 2; f <= 20; f++) for (i = 0; i < pool[f]; i++) un.push(f);
    for (k = 0; k < R; k++) {
      var u = un.slice();
      for (i = u.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)), t = u[i]; u[i] = u[j]; u[j] = t; }
      deals.push(u);
    }
    var best = L[0], bs = -1;
    L.forEach(function (face) {
      var s = 0;
      deals.forEach(function (u) {
        var T = clone(S), at = 0;
        for (var p = 0; p < T.n; p++) if (p !== me) { var m = T.hands[p].length; T.hands[p] = u.slice(at, at + m); at += m; }
        T.pile = u.slice(at, at + T.pile.length);
        play(T, face);
        for (var n = 0; !over(T) && n < 400; n++) { begin(T); if (!over(T)) play(T, legal(T)[0]); }
        if (T.winners.indexOf(me) >= 0) s += 1 / T.winners.length;
      });
      if (s > bs) { bs = s; best = face; }
    });
    return best;
  }

  function botMove(S, level, rnd) {
    var L = legal(S);
    if (!L.length) return null;
    if (L.length === 1) return L[0];
    if (level === 'easy') return L[Math.floor(rnd() * L.length)];
    if (level === 'hard') return rollouts(S, rnd, 24);
    return lowBeat(S);
  }

  function valid(S) {
    if (!S || typeof S !== 'object' || !(S.n >= MIN && S.n <= MAX)) return false;
    if (!Array.isArray(S.pile) || !Array.isArray(S.hands) || !Array.isArray(S.table) || !Array.isArray(S.discard) || !Array.isArray(S.winners)) return false;
    if (S.hands.length !== S.n || S.table.length !== S.n || !(S.turn >= 0 && S.turn < S.n) || (S.turn | 0) !== S.turn) return false;
    var c = {}, all = S.pile.concat(S.discard), ok = true;
    S.hands.forEach(function (h) { if (!Array.isArray(h)) ok = false; else all = all.concat(h); });
    if (!ok) return false;
    S.table.forEach(function (f) { if (f) all.push(f); });
    all.forEach(function (f) { c[f] = (c[f] || 0) + 1; });
    if (all.length !== 90) return false;
    for (var f = 2; f <= 20; f++) if (c[f] !== COUNTS[f]) return false;
    return true;
  }

  return { COUNTS: COUNTS, HAND: HAND, MIN: MIN, MAX: MAX, deck: deck, newGame: newGame, make: make, clone: clone, count: count, value: value, over: over,
    begin: begin, legal: legal, play: play, preview: preview, unseen: unseen, botMove: botMove, valid: valid };
}
if (typeof module !== 'undefined' && module.exports) module.exports = PeakEngineFactory;
/* ==== ENGINE END ==== */
</script>

  });

  var params = new URLSearchParams(location.search);
  var dailyDate = params.get('daily');
  var prefs = ctx.store.get('prefs', { players: 4, level: 'medium' });
  if (!(prefs.players >= E.MIN && prefs.players <= E.MAX)) prefs.players = 4;
  if (LEVELS.indexOf(prefs.level) < 0) prefs.level = 'medium';

  var BOT_MS = 900;
  var M = null, S = null, botTimer = null, sel = 0, kf = -1, msg = '', pausedAt = 0;

  var top = el('div', { class: 'pk-top' });
  var seats = el('div', { class: 'pk-seats' });
  var pileBox = el('div', { class: 'pk-heap pk-pile' });
  var meBox = el('div', { class: 'pk-me' });
  var outBox = el('div', { class: 'pk-heap' });
  var mid = el('div', { class: 'pk-mid' }, [pileBox, meBox, outBox]);
  var status = el('div', { class: 'pk-status', role: 'status', 'aria-live': 'polite' });
  var hand = el('div', { class: 'pk-hand' });
  var playBtn = el('button', { class: 'ch-btn ch-btn--primary', type: 'button', text: C.t('playBtn'), hidden: true });
  var actions = el('div', { class: 'pk-actions' }, [playBtn]);
  var wrap = el('div', { class: 'pk-wrap' }, [top, seats, mid, status, hand, actions]);
  playBtn.addEventListener('click', function () { if (sel) humanPlay(sel); });

  ctx.button({ icon: 'help', label: C.t('help'), onClick: showHelp });
  ctx.button({ icon: 'refresh', label: C.t('newGame'), onClick: askNew });
  ctx.main.appendChild(wrap);
  ctx.mount();

  function pname(p) { return p === 0 ? C.t('you') : C.t('rivalN', { n: C.num(p) }); }
  function human() { return S && !E.over(S) && S.turn === 0; }
  function busy() { return !!document.querySelector('.ch-scrim'); }

  /* ------------------------------------------------------------- cards */

  var BANDS = [[2, '#4F8A4B'], [6, '#3D7F86'], [10, '#5C6690'], [14, '#7A5C8E'], [18, '#8E4A4A']];
  // the mountain grows with the number, so a hand reads high to low at a glance;
  // from 10 up the summit wears snow
  function mountain(f) {
    var col = BANDS[0][1];
    BANDS.forEach(function (b) { if (f >= b[0]) col = b[1]; });
    var H = 18 + (f - 2) * 2.3, y = 60 - H;
    var s = '<svg viewBox="0 0 100 60" preserveAspectRatio="none">' +
      '<polygon points="0,60 20,' + (60 - H * 0.45).toFixed(1) + ' 42,60" fill="' + col + '" opacity=".5"/>' +
      '<polygon points="58,60 82,' + (60 - H * 0.55).toFixed(1) + ' 100,60" fill="' + col + '" opacity=".5"/>' +
      '<polygon points="4,60 50,' + y.toFixed(1) + ' 96,60" fill="' + col + '"/>';
    if (f >= 10) {
      var d = H * 0.3, w = 46 * d / H;
      s += '<polygon points="50,' + y.toFixed(1) + ' ' + (50 - w).toFixed(1) + ',' + (y + d).toFixed(1) + ' ' + (50 - w * 0.35).toFixed(1) + ',' + (y + d * 0.72).toFixed(1) +
        ' 50,' + (y + d).toFixed(1) + ' ' + (50 + w * 0.35).toFixed(1) + ',' + (y + d * 0.72).toFixed(1) + ' ' + (50 + w).toFixed(1) + ',' + (y + d).toFixed(1) + '" fill="#FBFAF6"/>';
    }
    return s + '</svg>';
  }
  function cardEl(f, extra) {
    var b = el('button', { class: 'ch-pcard pk-card' + (extra ? ' ' + extra : ''), type: 'button', 'aria-label': C.num(f) });
    b.appendChild(el('span', { class: 'pk-n', text: C.num(f) }));
    var art = el('span', { class: 'pk-art', 'aria-hidden': 'true' });
    art.innerHTML = mountain(f);
    b.appendChild(art);
    b._f = f;
    return b;
  }
  function still(f, extra) { var c = cardEl(f, extra); c.disabled = true; c.tabIndex = -1; return c; }

  /* ------------------------------------------------------------- start */

  function newGame(daily) {
    stopBot();
    var n = daily ? 4 : prefs.players;
    var rnd = daily ? C.daily('peak', daily).rng : Math.random;
    // a random seat leads outside the daily, so the human does not always move first
    S = E.newGame(n, rnd, daily ? 0 : Math.floor(Math.random() * n));
    M = { S: S, level: daily ? 'medium' : prefs.level, daily: daily || null, startedAt: Date.now() };
    sel = 0; kf = -1; msg = '';
    render();
    dealIn();
    save();
    next();
  }
  function resume(v) {
    M = v; S = v.S;
    M.startedAt = Date.now() - (v.elapsed || 0);
    sel = 0; kf = -1; msg = '';
    render();
    next();
  }
  // on the daily, the bots' guesses come from the date and the move, so a reload replays them
  function botRnd() { return M.daily ? C.daily('peak', M.daily + '|' + S.moves + '|' + S.turn).rng : Math.random; }

  /* -------------------------------------------------------------- draw */

  function valEl(p) {
    var f = S.table[p], k = f ? E.count(S, f) : 0;
    return el('span', { class: 'pk-val' + (k > 1 ? ' pk-val--on' : ''), text: !f ? '' : k > 1 ? C.num(f) + '×' + C.num(k) + ' = ' + C.num(f * k) : C.num(f) });
  }
  function spotEl(p) {
    var f = S.table[p], box = el('div', { class: 'pk-spot' + (f ? ' pk-spot--full' : ''), 'data-spot': p });
    if (f) box.appendChild(still(f));
    return box;
  }
  function renderTop() {
    top.innerHTML = '';
    if (M.daily) top.appendChild(el('span', { class: 'ch-badge ch-badge--accent' }, [C.icon('calendar', 14), el('span', { text: C.t('dailyPk') + ' — ' + C.num(M.daily) })]));
    else top.appendChild(el('span', { class: 'ch-badge', text: C.t(M.level) }));
    top.appendChild(C.cards.backPicker());
    // options behind a gear in the top row, never in «?» (#409)
    var gear = el('button', { class: 'ch-iconbtn', type: 'button', 'aria-label': C.t('settings'), title: C.t('settings') }, [C.icon('gear', 20)]);
    gear.addEventListener('click', showSettings);
    top.appendChild(gear);
  }
  function renderSeats(pv) {
    seats.innerHTML = '';
    var b = S.n - 1;
    seats.style.setProperty('--cols', b === 4 ? 2 : Math.min(3, b));
    // the wide layout sizes the rivals' cards so that this many rows of two fit the height
    wrap.style.setProperty('--rows', Math.ceil(b / 2));
    for (var p = 1; p < S.n; p++) {
      var spot = spotEl(p);
      if (pv && pv.beaten.indexOf(p) >= 0) spot.classList.add('pk-spot--fall');
      else if (pv && pv.partners.indexOf(p) >= 0) spot.classList.add('pk-spot--pair');
      seats.appendChild(el('div', { class: 'pk-seat' + (S.turn === p && !E.over(S) ? ' pk-seat--on' : ''), 'data-p': p }, [
        el('span', { class: 'pk-who', text: pname(p) }),
        el('span', { class: 'pk-count pk-backs', 'aria-label': C.t('cardsN', { n: C.num(S.hands[p].length) }) }, [C.cards.back(), el('span', { text: C.num(S.hands[p].length) })]),
        spot, valEl(p)
      ]));
    }
  }
  function render() {
    renderTop();
    var pv = human() && sel ? E.preview(S, sel) : null;
    renderSeats(pv);
    pileBox.innerHTML = '';
    pileBox.appendChild(S.pile.length ? C.cards.back() : el('div', { class: 'pk-slot' }));
    pileBox.appendChild(el('span', { text: C.t('pile') + C.t('sep') + C.num(S.pile.length) }));
    outBox.innerHTML = '';
    var slot = el('div', { class: 'pk-slot pk-out' });
    if (S.discard.length) slot.appendChild(still(S.discard[S.discard.length - 1]));
    outBox.appendChild(slot);
    outBox.appendChild(el('span', { text: C.t('discard') + C.t('sep') + C.num(S.discard.length) }));
    meBox.className = 'pk-me' + (human() ? ' pk-seat--on' : '');
    meBox.innerHTML = '';
    var mine = spotEl(0), val = valEl(0);
    // the chosen card waits faded in your spot with the value it would have
    if (pv) {
      mine.appendChild(still(sel, 'pk-try'));
      var k = E.count(S, sel) + 1;
      val = el('span', { class: 'pk-val' + (k > 1 ? ' pk-val--on' : ''), text: k > 1 ? C.num(sel) + '×' + C.num(k) + ' = ' + C.num(pv.v) : C.num(sel) });
    }
    meBox.appendChild(el('span', { class: 'pk-who', text: C.t('you') }));
    meBox.appendChild(mine);
    meBox.appendChild(val);
    renderHand();
    playBtn.hidden = !pv;
    var st = msg;
    if (pv) st = pv.beaten.length ? C.t('previewFall', { v: C.num(pv.v), k: C.num(pv.beaten.length) }) : C.t('previewNone', { v: C.num(pv.v) });
    else if (!st && !E.over(S)) st = S.turn === 0 ? C.t('yourTurn') : C.t('thinking', { n: pname(S.turn) });
    status.textContent = st;
  }
  function renderHand() {
    hand.innerHTML = '';
    var h = S.hands[0].slice().sort(function (a, b) { return a - b; }), on = human();
    h.forEach(function (f, i) {
      var b = cardEl(f, (sel === f && h.indexOf(f) === i ? 'pk-sel' : '') + (kf === i ? ' pk-kf' : ''));
      b.disabled = !on;
      b.addEventListener('click', function () { tapCard(f, i); });
      hand.appendChild(b);
    });
  }
  function spotCard(p) { return wrap.querySelector('[data-spot="' + p + '"] .ch-pcard:not(.pk-try)'); }
  function seatFrom(p) { return p === 0 ? null : seats.querySelector('[data-p="' + p + '"] .pk-backs'); }
  function handNode(f) { var k = hand.children, r = null; for (var i = 0; i < k.length; i++) if (k[i]._f === f) r = k[i]; return r; }
  function snapshot() { var r = {}; for (var p = 0; p < S.n; p++) { var c = spotCard(p); if (c) r[p] = c.getBoundingClientRect(); } return r; }

  // a card that leaves is copied where it stood and sent to the discard; the state
  // itself has already moved on, so input is never held
  function ghost(f, r, delay) {
    if (C.ui.reduceMotion() || !r || !r.width) return;
    var g = still(f);
    g.style.cssText = 'position:fixed;left:' + r.left + 'px;top:' + r.top + 'px;--pw:' + r.width + 'px;width:' + r.width + 'px;margin:0;z-index:30;pointer-events:none';
    document.body.appendChild(g);
    var a = C.ui.sendTo(g, outBox.querySelector('.pk-slot'), { ms: 340, delay: delay, scale: 0.8 });
    if (!a) { g.remove(); return; }
    a.onfinish = a.oncancel = function () { g.remove(); };
  }
  function animate(ev, rects, from) {
    var i = 0, fell = 0;
    ev.forEach(function (e) {
      if (e.t === 'play') { var n = spotCard(e.p); if (n && from) C.ui.fly(n, from, { ms: 260, flip: e.p !== 0 }); }
      if (e.t === 'beat' || e.t === 'clear') { ghost(e.face, rects[e.p], (e.t === 'beat' ? 220 : 0) + i++ * 80); if (e.t === 'beat') fell++; }
      // the discards visibly become the new pile, so a pile that refills is not a surprise
      if (e.t === 'reshuffle') { var b = pileBox.firstChild; if (b) C.ui.fly(b, outBox, { ms: 320, delay: 200 }); }
      if (e.t === 'draw' && e.p === 0) { var h = handNode(e.face); if (h) C.ui.fly(h, pileBox, { ms: 240, delay: 420, flip: true }); }
    });
    if (fell) C.audio.sfx('flip');
  }
  function dealIn() {
    if (C.ui.reduceMotion()) return;
    for (var i = 0; i < hand.children.length; i++) C.ui.fly(hand.children[i], pileBox, { ms: 220, delay: i * 50, flip: true });
  }

  /* ------------------------------------------------------------- moves */

  function tapCard(f, i) {
    if (!human() || busy()) return;
    if (sel === f) { humanPlay(f); return; }
    sel = f; kf = i; msg = '';
    C.feedback('tap');
    render();
  }
  function humanPlay(f) {
    if (!human() || busy()) return;
    var n = handNode(f);
    commit(f, n ? n.getBoundingClientRect() : null);
  }
  function commit(f, from) {
    var p = S.turn, rects = snapshot(), ev = E.play(S, f);
    if (!ev) { C.feedback('bad'); return; }
    sel = 0; kf = -1;
    msg = describe(ev, p);
    C.audio.sfx('place'); C.haptic('tap');
    render();
    animate(ev, rects, from);
    save();
    next();
  }
  function describe(ev, p) {
    var beaten = ev.filter(function (e) { return e.t === 'beat'; });
    var mine = beaten.some(function (e) { return e.p === 0; });
    if (mine) return C.t('youFell');
    if (p === 0) return '';
    var s = C.t('playedN', { n: pname(p), f: C.num(ev[0].face) });
    return beaten.length ? s + C.t('sep') + C.t('fellN', { k: C.num(beaten.length) }) : s;
  }

  // what happens next: the end, the human's turn, or a bot after a short pause
  function next() {
    stopBot();
    if (E.over(S)) { endGame(); return; }
    if (S.turn === 0) { startHuman(); return; }
    var G = S;
    botTimer = setTimeout(function () {
      botTimer = null;
      if (S !== G || E.over(S) || S.turn === 0) return;
      var rects = snapshot(), ev = E.begin(S);
      if (!ev.length) { botPlay(); return; }
      render();
      animate(ev, rects, null);
      save();
      if (E.over(S)) { endGame(); return; }
      botTimer = setTimeout(function () { botTimer = null; if (S === G && !E.over(S) && S.turn !== 0) botPlay(); }, C.cards.pace(450));
    }, C.cards.pace(C.ui.reduceMotion() ? 300 : BOT_MS));
  }
  function botPlay() {
    var p = S.turn, f = E.botMove(S, M.level, botRnd()), from = seatFrom(p);
    commit(f, from ? from.getBoundingClientRect() : null);
  }
  // a card that stayed up since your last turn leaves first; with an empty hand that is the win
  function startHuman() {
    var rects = snapshot(), ev = E.begin(S);
    if (ev.length) {
      var gone = C.t('stayedUp', { f: C.num(ev[0].face) });
      msg = msg ? msg + C.t('sep') + gone : gone;
      render();
      animate(ev, rects, null);
      save();
      if (E.over(S)) endGame();
      return;
    }
    render();
  }
  function stopBot() { if (botTimer) { clearTimeout(botTimer); botTimer = null; } }

  /* --------------------------------------------------------------- end */

  function endGame() {
    stopBot();
    render();
    var won = S.winners.indexOf(0) >= 0;
    status.textContent = won ? C.t('youTop') : C.t('topN', { n: pname(S.winners[0]) });
    if (won) C.ui.burst(meBox, { count: 22, speed: 240, ring: 30, colors: ['#FBFAF6', '#786054', '#4F8A4B'] });
    save();
    var G = S;
    setTimeout(function () { if (S === G) finish(); }, C.cards.pace(1000));
  }
  function finish() {
    var ms = Date.now() - M.startedAt, won = S.winners.indexOf(0) >= 0;
    var base = { easy: 6, medium: 12, hard: 20 }[M.level] || 12;
    var coins = won ? base + (M.daily ? 8 : 0) : Math.max(2, Math.round(base * 0.3));
    var points = won ? base * 4 + (M.daily ? 25 : 0) : Math.round(base * 1.2);
    var title = won ? C.t('youTop') : C.t('topN', { n: pname(S.winners[0]) });
    if (won) {
      C.achievements.unlock('pk-win');
      if (M.level === 'hard' && !M.daily) C.achievements.unlock('pk-hard');
    }
    if (M.daily) {
      if (won) C.achievements.unlock('pk-daily');
      var first = C.stats.daily('peak', M.daily, { label: title, win: won });
      if (!first) { coins = Math.round(coins * 0.2); points = Math.round(points * 0.2); }
    }
    ctx.clearSave();
    var lines = [];
    for (var p = 0; p < S.n; p++) lines.push({ label: pname(p), value: C.t('cardsN', { n: C.num(S.hands[p].length + (S.table[p] ? 1 : 0)) }) });
    lines.push({ label: C.t('turns'), value: C.num(S.moves) });
    ctx.finish({
      won: won, title: title, timeMs: ms, coins: coins, points: points, lines: lines,
      shareText: 'چوگان · قله' + (M.daily ? ('\nروزانه ' + M.daily) : '') + '\n' + (won ? '⛰️' : '🧗') + ' ' + S.moves,
      onAgain: M.daily ? null : function () { newGame(null); }
    });
  }

  /* ----------------------------------------------------------- dialogs */

  function showSettings() {
    var nums = [];
    for (var n = E.MIN; n <= E.MAX; n++) nums.push({ value: n, label: C.num(n) });
    var seg1 = C.ui.segmented(nums, prefs.players, function (v) { prefs.players = v; ctx.store.set('prefs', prefs); });
    var seg2 = C.ui.segmented(LEVELS.map(function (l) { return { value: l, label: C.t(l) }; }), prefs.level, function (v) { prefs.level = v; ctx.store.set('prefs', prefs); });
    C.ui.modal({
      title: C.t('settings'),
      body: [el('div', { class: 'ch-list' }, [
        el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: C.t('players') }), seg1]),
        el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: C.t('level') }), seg2]),
        C.cards.speedRow()
      ]), el('p', { class: 'ch-dim', text: C.t('optNote') })],
      actions: [{ label: C.t('done'), kind: 'primary' }]
    });
  }
  function askNew() {
    if (busy()) return;
    var dd = M ? M.daily : null;
    if (!S || !S.moves || E.over(S)) { newGame(dd); return; }
    C.ui.confirm({ title: C.t('newGame'), body: C.t('resetWarn'), onOk: function () { newGame(dd); } });
  }
  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [kb('← →', C.t('kbCards')), kb('Enter', C.t('kbPlay'))])
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }

  window.addEventListener('keydown', function (e) {
    if (!human() || busy()) return;
    var tg = e.target, tag = tg && tg.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter'))) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var h = S.hands[0].slice().sort(function (a, b) { return a - b; }), n = h.length;
    if (!n) return;
    // the hand is laid out left to right in every language, so the arrows are not flipped
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      kf = kf < 0 ? 0 : (kf + (e.key === 'ArrowRight' ? 1 : n - 1)) % n;
      sel = h[kf]; msg = '';
      render(); e.preventDefault(); return;
    }
    if (e.key === 'Enter' && sel) { humanPlay(sel); e.preventDefault(); }
  });

  function svgCard(x, y, f, extra) {
    return '<rect x="' + x + '" y="' + y + '" width="34" height="48" rx="5" fill="var(--c-surface)" stroke="var(--c-line)"' + (extra || '') + '/>' +
      '<text x="' + (x + 17) + '" y="' + (y + 22) + '" font-size="16" font-weight="800" text-anchor="middle" fill="var(--c-text)">' + C.num(f) + '</text>' +
      '<polygon points="' + (x + 4) + ',' + (y + 44) + ' ' + (x + 17) + ',' + (y + 44 - 6 - f) + ' ' + (x + 30) + ',' + (y + 44) + '" fill="var(--game)"/>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: '<svg viewBox="0 0 200 110" width="100%" direction="ltr">' + svgCard(40, 30, 4, ' opacity=".45" transform="rotate(-12 57 54)"') +
      '<path d="M86 54 H 112" stroke="var(--game)" stroke-width="4" stroke-linecap="round"/><path d="M95 46 l -9 8 9 8" stroke="var(--game)" stroke-width="4" fill="none" stroke-linecap="round"/>' + svgCard(122, 30, 9) + '</svg>' },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: '<svg viewBox="0 0 200 110" width="100%" direction="ltr">' + svgCard(30, 24, 5) + svgCard(74, 24, 5) + svgCard(140, 24, 9, ' opacity=".45"') +
      '<text x="73" y="96" font-size="15" font-weight="800" text-anchor="middle" fill="var(--game)">' + C.num(5) + '×' + C.num(2) + ' = ' + C.num(10) + '</text>' +
      '<text x="157" y="96" font-size="15" font-weight="800" text-anchor="middle" fill="var(--c-text-dim)">' + C.num(9) + '</text></svg>' },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: '<svg viewBox="0 0 200 110" width="100%" direction="ltr"><polygon points="30,96 100,16 170,96" fill="var(--game)"/>' +
      '<polygon points="100,16 82,37 92,33 100,40 108,33 118,37" fill="#FBFAF6"/><path d="M100 16 V 2" stroke="var(--c-text)" stroke-width="3"/><path d="M100 3 l 16 5 -16 5 z" fill="var(--c-bad)"/></svg>' }
  ];

  /* -------------------------------------------------------------- save */

  ctx.autosave(function () {
    if (!M || !S || E.over(S)) return { inProgress: false };
    var v = JSON.parse(JSON.stringify(M));
    v.elapsed = (pausedAt || Date.now()) - M.startedAt;
    return { m: v };
  });
  function save() { ctx.save(); }
  C.onPause(function () { stopBot(); if (!pausedAt) pausedAt = Date.now(); });
  C.onResume(function () { if (pausedAt && M) M.startedAt += Date.now() - pausedAt; pausedAt = 0; if (S && S.turn !== 0) next(); });

  /* ------------------------------------------------------------- start */

  var saved = ctx.loadSave();
  var sv = saved && saved.m && E.valid(saved.m.S) && !E.over(saved.m.S) && LEVELS.indexOf(saved.m.level) >= 0 ? saved.m : null;
  if (dailyDate) {
    if (sv && sv.daily === dailyDate) resume(sv);
    else newGame(dailyDate);
    if (C.stats.dailyDone('peak', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).peak;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
    }
  } else if (sv && !sv.daily) resume(sv);
  else newGame(null);
  ctx.tutorialIfNew(TUT);
})();
</script>
</body>
