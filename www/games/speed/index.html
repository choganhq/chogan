<script>
/* ==== ENGINE START ==== */
function SpeedEngineFactory() {
  'use strict';

  // A card is rank * 4 + suit, as in Chogan.cards: ranks A..K are 0..12
  var HAND = 5, PILE = 15, SIDE = 5;
  // Bot reaction in ms per level, before the player's Slow/Normal/Fast pace. The level is
  // nothing but this delay: every bot sees the same cards, so a slower one simply loses
  // the race more often (measured in tools/tests/speed.js).
  var DELAY = { easy: 3400, medium: 2500, hard: 1700 };
  // how long both players see "nobody can play" before new centre cards are turned
  var FLIP_MS = 1100;

  function rank(c) { return c >> 2; }
  function suit(c) { return c & 3; }
  function shuffled(rnd) {
    var d = [];
    for (var i = 0; i < 52; i++) d.push(i);
    for (var j = 51; j > 0; j--) { var k = Math.floor(rnd() * (j + 1)), t = d[j]; d[j] = d[k]; d[k] = t; }
    return d;
  }
  // one rank apart; the ace sits between the king and the two
  function adj(a, b) { var d = Math.abs(rank(a) - rank(b)); return d === 1 || d === 12; }

  // Five in each hand, fifteen in each draw pile, five in each flip pile beside the
  // centre, and one card turned up on each centre pile: 52.
  function newDeal(rnd) {
    var d = shuffled(rnd);
    var R = { hands: [d.splice(0, HAND), d.splice(0, HAND)], piles: [d.splice(0, PILE), d.splice(0, PILE)],
      side: [d.splice(0, SIDE), d.splice(0, SIDE)], centre: [], winner: -1, flips: 0 };
    R.centre = [[d.pop()], [d.pop()]];
    return R;
  }
  function top(R, i) { var c = R.centre[i]; return c[c.length - 1]; }
  function canPlay(R, c, i) { return R.winner < 0 && (i === 0 || i === 1) && adj(c, top(R, i)); }
  function playable(R, p) {
    var out = [];
    R.hands[p].forEach(function (c) { for (var i = 0; i < 2; i++) if (canPlay(R, c, i)) out.push({ c: c, i: i }); });
    return out;
  }
  // Plays a card and refills the hand from the draw pile. The new card takes the slot of
  // the one played, so the other cards never jump under a finger that is about to tap
  // them. Returns the card drawn (-1 when the pile was empty), or null for a refused move.
  function play(R, p, c, i) {
    var h = R.hands[p], k = h.indexOf(c);
    if (k < 0 || !canPlay(R, c, i)) return null;
    R.centre[i].push(c);
    var drawn = -1;
    if (R.piles[p].length) { drawn = R.piles[p].pop(); h[k] = drawn; } else h.splice(k, 1);
    if (!h.length && !R.piles[p].length) R.winner = p;
    return drawn;
  }
  function stuck(R) { return R.winner < 0 && !playable(R, 0).length && !playable(R, 1).length; }
  // When nobody can play: turn the top card of each flip pile onto the centre (taking
  // both from the other flip pile when one is empty). With the flip piles gone, each
  // player turns their own draw pile's top card onto their centre pile. With those gone
  // too, the centre piles are shuffled into two new flip piles. Each step changes a top
  // card, and with only the hands (at most ten cards) left outside the centre some hand
  // card always has a neighbour rank in the centre (ten cards cannot hold all 13 ranks),
  // so turning through the centre always ends the deadlock.
  function flip(R, rnd) {
    if (!stuck(R)) return '';
    R.flips++;
    var mode;
    if (R.side[0].length || R.side[1].length) {
      mode = 'side';
      for (var i = 0; i < 2; i++) {
        var src = R.side[i].length ? R.side[i] : R.side[1 - i];
        if (src.length) R.centre[i].push(src.pop());
      }
    } else if (R.piles[0].length || R.piles[1].length) {
      mode = 'own';
      for (var p = 0; p < 2; p++) if (R.piles[p].length) R.centre[p].push(R.piles[p].pop());
    } else {
      mode = 'reshuffle';
      var all = R.centre[0].concat(R.centre[1]);
      for (var j = all.length - 1; j > 0; j--) { var k = Math.floor(rnd() * (j + 1)), t = all[j]; all[j] = all[k]; all[k] = t; }
      var half = all.length >> 1;
      R.side = [all.slice(0, half), all.slice(half)];
      R.centre = [[R.side[0].pop()], [R.side[1].pop()]];
    }
    return mode;
  }
  function cardsLeft(R, p) { return R.hands[p].length + R.piles[p].length; }

  // Which card a bot plays when its reaction time comes. Easy takes any card that fits,
  // medium the first, hard the one that leaves the other player the fewest moves.
  function botMove(R, p, level, rnd) {
    var ms = playable(R, p);
    if (!ms.length) return null;
    if (level === 'easy') return ms[Math.floor(rnd() * ms.length)];
    if (level !== 'hard') return ms[0];
    var o = R.hands[1 - p], best = null, bs = 1e9;
    ms.forEach(function (m) {
      var tops = [top(R, 0), top(R, 1)];
      tops[m.i] = m.c;
      var s = 0;
      o.forEach(function (c) { if (adj(c, tops[0]) || adj(c, tops[1])) s++; });
      if (s < bs) { bs = s; best = m; }
    });
    return best;
  }

  // A whole round between two bots on one timeline: each acts when its own delay comes
  // round, and a deadlock turns new centre cards after FLIP_MS. `delays` are ms per
  // player. Returns the winner (-1 if it never ended), the time taken and the flips.
  function simulate(rnd, levels, delays, cap) {
    var R = newDeal(rnd), t = 0, next = [], flipAt = -1, steps = 0;
    var d = function (p) { return delays[p] * (0.8 + 0.4 * rnd()); };
    next[0] = d(0); next[1] = d(1);
    cap = cap || 20000;
    while (R.winner < 0 && steps++ < cap) {
      if (stuck(R)) { if (flipAt < 0) flipAt = t + FLIP_MS; } else flipAt = -1;
      if (flipAt >= 0 && flipAt <= Math.min(next[0], next[1])) { t = flipAt; flip(R, rnd); flipAt = -1; continue; }
      var p = next[0] <= next[1] ? 0 : 1;
      t = next[p];
      var m = botMove(R, p, levels[p], rnd);
      if (m) play(R, p, m.c, m.i);
      next[p] = t + d(p);
    }
    return { winner: R.winner, ms: t, flips: R.flips, steps: steps, R: R };
  }

  // a restored save: two players' cards, the centre and the flip piles hold 52 distinct cards
  function validRound(R) {
    if (!R || typeof R !== 'object') return false;
    var lists = ['hands', 'piles', 'side', 'centre'];
    for (var a = 0; a < lists.length; a++) if (!Array.isArray(R[lists[a]]) || R[lists[a]].length !== 2) return false;
    if (!R.centre[0].length || !R.centre[1].length || R.hands[0].length > HAND || R.hands[1].length > HAND) return false;
    if ([-1, 0, 1].indexOf(R.winner) < 0) return false;
    var seen = {}, n = 0;
    for (var b = 0; b < lists.length; b++) for (var q = 0; q < 2; q++) {
      var arr = R[lists[b]][q];
      if (!Array.isArray(arr)) return false;
      for (var i = 0; i < arr.length; i++) {
        var c = arr[i];
        if (typeof c !== 'number' || c < 0 || c > 51 || c !== Math.floor(c) || seen[c]) return false;
        seen[c] = 1; n++;
      }
    }
    // a hand short of five only once its draw pile is empty
    for (var p = 0; p < 2; p++) if (R.hands[p].length < HAND && R.piles[p].length) return false;
    return n === 52;
  }

  var api = { HAND: HAND, PILE: PILE, SIDE: SIDE, DELAY: DELAY, FLIP_MS: FLIP_MS, rank: rank, suit: suit, adj: adj, shuffled: shuffled,
    newDeal: newDeal, top: top, canPlay: canPlay, playable: playable, play: play, stuck: stuck, flip: flip, cardsLeft: cardsLeft,
    botMove: botMove, simulate: simulate, validRound: validRound };
  return api;
}
if (typeof module !== 'undefined' && module.exports) module.exports = SpeedEngineFactory;
/* ==== ENGINE END ==== */
</script>

  var params = new URLSearchParams(location.search);

  var status = el('div', { class: 'sp-status', role: 'status', 'aria-live': 'polite' });
  var myPile = el('div', { class: 'sp-pile' });
  var slots = [];
  for (var s = 0; s < E.HAND; s++) slots.push(el('div', { class: 'sp-slot' }));
  var hand = el('div', { class: 'sp-hand' }, slots);
  var meRow = el('div', { class: 'sp-row' }, [myPile, hand]);
  var wrap = el('div', { class: 'sp-wrap' }, [top, botRow, table, status, meRow]);
  cps.forEach(function (cp, i) { cp.addEventListener('click', function () { if (sel >= 0) tryPlay(sel, i, null); }); });

  ctx.button({ icon: 'help', label: C.t('help'), onClick: showHelp });
  ctx.button({ icon: 'refresh', label: C.t('newRound'), onClick: askNew });
  ctx.main.appendChild(wrap);
  ctx.mount();

  function dialog() { return !!document.querySelector('.ch-scrim'); }
  function canAct() { return M && M.live && M.R.winner < 0 && !dialog(); }

  /* ------------------------------------------------------------ start */

  function newRound(daily) {
    stopAll();
    var rnd = daily ? C.daily('speed', daily).rng : Math.random;
    botRnd = daily ? C.daily('speed', daily + '|bot').rng : Math.random;
    // the daily deal is played against the medium bot, so it is the same race for everyone
    M = { R: E.newDeal(rnd), level: daily ? 'medium' : prefs.level, daily: daily || null, startedAt: Date.now(), live: false };
    sel = -1; msg = '';
    renderAll();
    dealIn();
    save();
    readyGo();
  }
  function resume(v) {
    stopAll();
    M = { R: v.R, level: LEVELS.indexOf(v.level) >= 0 ? v.level : 'medium', daily: v.daily || null, startedAt: Date.now() - (v.elapsed || 0), live: false };
    botRnd = M.daily ? C.daily('speed', M.daily + '|bot|' + M.R.flips + '|' + M.R.piles[1].length).rng : Math.random;
    sel = -1; msg = '';
    renderAll();
    readyGo();
  }
  // A short "Ready… Go!" before the bot moves, at the start and after every return to
  // the game: in a race, a bot that plays while the player is still looking is unfair.
  // It waits for any open window (the tutorial on a first visit) to close.
  function readyGo() {
    clearTimeout(readyTimer);
    M.live = false;
    var R = M.R;
    setMsg(C.t('ready'), 0);
    var wait = function () {
      if (!M || M.R !== R) return;
      if (dialog()) { readyTimer = setTimeout(wait, 300); return; }
      readyTimer = setTimeout(function () {
        if (!M || M.R !== R || dialog()) { readyTimer = setTimeout(wait, 300); return; }
        M.live = true;
        setMsg(C.t('go'), 900, true);
        C.audio.sfx('flip');
        scheduleBot();
        checkStuck();
      }, C.cards.pace(1000));
    };
    wait();
  }

  /* ------------------------------------------------------------- draw */

  function renderTop() {
    top.innerHTML = '';
    if (M.daily) top.appendChild(el('span', { class: 'ch-badge ch-badge--accent' }, [C.icon('calendar', 14), el('span', { text: C.t('dailySp') + ' — ' + C.num(M.daily) })]));
    else top.appendChild(el('span', { class: 'ch-badge', text: C.t('levelN', { l: C.t(M.level) }) }));
    top.appendChild(C.cards.backPicker());
    // options behind a gear in the top row, never in «?» (#409)
    var gear = el('button', { class: 'ch-iconbtn', type: 'button', 'aria-label': C.t('settings'), title: C.t('settings') }, [C.icon('gear', 20)]);
    gear.addEventListener('click', showSettings);
    top.appendChild(gear);
  }
  function pileView(box, n, label) {
    box.innerHTML = '';
    box.appendChild(n ? C.cards.back() : el('div', { class: 'sp-gone' }));
    box.appendChild(el('span', { text: label }));
  }
  function renderBot() {
    var R = M.R;
    pileView(botPile, R.piles[1].length, C.t('bot') + ': ' + C.num(E.cardsLeft(R, 1)));
    while (botHand.children.length > R.hands[1].length) botHand.removeChild(botHand.lastChild);
    while (botHand.children.length < R.hands[1].length) botHand.appendChild(C.cards.back());
  }
  function renderCentre() {
    var R = M.R;
    for (var i = 0; i < 2; i++) {
      var c = E.top(R, i);
      if (cps[i]._c !== c) {
        cps[i].innerHTML = '';
        var n = C.cards.el(c);
        n.disabled = true;
        n.tabIndex = -1;
        cps[i].appendChild(n);
        cps[i]._c = c;
      }
      cps[i].classList.toggle('sp-centre--on', sel >= 0);
      pileView(sides[i], R.side[i].length, C.num(R.side[i].length));
    }
  }
  // Only the slots whose card changed are rebuilt: a card the player is pressing must
  // never be replaced under the finger, or the press is lost (#750). The bot's moves
  // touch the centre and the bot's row, never these slots.
  function renderHand() {
    var R = M.R, h = R.hands[0];
    for (var k = 0; k < E.HAND; k++) {
      var slot = slots[k], c = k < h.length ? h[k] : -1;
      if (slot._c !== c) {
        slot.innerHTML = '';
        slot._c = c;
        if (c >= 0) slot.appendChild(cardNode(c, k));
      }
      if (slot.firstChild) slot.firstChild.classList.toggle('sp-sel', sel === k);
    }
    pileView(myPile, R.piles[0].length, // a middle dot beside Persian digits reads as a zero (ربات ۲۰۰), so a colon separates them
      C.t('player') + ': ' + C.num(E.cardsLeft(R, 0)));
  }
  function renderStatus() {
    var st = msg;
    if (!st && M.R.winner < 0) st = E.stuck(M.R) ? C.t('stuckNow') : sel >= 0 ? C.t('pickPile') : C.t('playing');
    status.textContent = st;
  }
  function renderAll() { renderTop(); renderBot(); renderCentre(); renderHand(); renderStatus(); }
  function render() { renderBot(); renderCentre(); renderHand(); renderStatus(); }
  function setMsg(text, ms, go) {
    clearTimeout(msgTimer);
    msg = text;
    status.classList.toggle('sp-status--go', !!go);
    if (M) renderStatus();
    if (ms) msgTimer = setTimeout(function () { msg = ''; status.classList.remove('sp-status--go'); if (M) renderStatus(); }, ms);
  }

  // the first hand flies in from the player's pile, turning over (#398)
  function dealIn() {
    if (C.ui.reduceMotion()) return;
    var from = myPile.firstChild ? myPile.firstChild.getBoundingClientRect() : null;
    slots.forEach(function (sl, i) { if (sl.firstChild && from) C.ui.fly(sl.firstChild, from, { ms: 220, delay: i * 50, flip: true }); });
    var bf = botPile.firstChild ? botPile.firstChild.getBoundingClientRect() : null;
    for (var j = 0; j < botHand.children.length; j++) if (bf) C.ui.fly(botHand.children[j], bf, { ms: 220, delay: j * 50 });
  }

  /* ------------------------------------------------------------ input */

  function cardNode(c, k) {
    var b = C.cards.el(c);
    b.addEventListener('pointerdown', function (e) { down(e, k, b); });
    b.addEventListener('pointermove', move);
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', cancel);
    // Enter or Space on a focused card (a click with no pointer behind it)
    b.addEventListener('click', function (e) { if (e.detail === 0) tapCard(k); });
    return b;
  }
  function down(e, k, b) {
    if (e.button > 0 || !canAct()) return;
    drag = { k: k, b: b, x: e.clientX, y: e.clientY, id: e.pointerId, moved: false };
    if (b.setPointerCapture) try { b.setPointerCapture(e.pointerId); } catch (err) { /* a synthetic pointer has nothing to capture */ }
  }
  function pileAt(x, y) {
    for (var i = 0; i < 2; i++) {
      var r = cps[i].getBoundingClientRect(), pad = 14;
      if (x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad) return i;
    }
    return -1;
  }
  function move(e) {
    if (!drag || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 8) return;
    if (!drag.moved) { drag.moved = true; drag.b.classList.add('sp-drag'); sel = drag.k; renderCentre(); renderStatus(); }
    drag.b.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px)';
    var over = pileAt(e.clientX, e.clientY);
    cps.forEach(function (cp, i) { cp.style.transform = over === i ? 'scale(1.06)' : ''; });
    e.preventDefault();
  }
  function endDrag(d) {
    d.b.classList.remove('sp-drag');
    d.b.style.transform = '';
    cps.forEach(function (cp) { cp.style.transform = ''; });
  }
  function up(e) {
    if (!drag || e.pointerId !== drag.id) return;
    var d = drag;
    drag = null;
    if (!d.moved) { tapCard(d.k); return; }
    var from = d.b.getBoundingClientRect(), i = pileAt(e.clientX, e.clientY);
    endDrag(d);
    if (i >= 0) tryPlay(d.k, i, from);
    else { sel = -1; render(); }
  }
  function cancel() { if (drag) { endDrag(drag); drag = null; sel = -1; render(); } }

  // A tap picks a card; a second tap on it plays it on the first centre pile it fits
  function tapCard(k) {
    if (!canAct() || k >= M.R.hands[0].length) return;
    if (sel === k) { var c = M.R.hands[0][k]; tryPlay(k, E.canPlay(M.R, c, 0) ? 0 : 1, null); return; }
    sel = k;
    C.haptic('tap');
    render();
  }
  function tryPlay(k, i, fromRect) {
    if (!canAct()) return;
    var R = M.R, c = R.hands[0][k], node = slots[k].firstChild;
    if (c === undefined) return;
    if (!E.canPlay(R, c, i)) {
      C.feedback('bad');
      C.ui.shake(node);
      setMsg(C.t('noFit'), 1600);
      return;
    }
    var from = fromRect || (node ? node.getBoundingClientRect() : null);
    var drawn = E.play(R, 0, c, i);
    sel = -1;
    C.audio.sfx('place'); C.haptic('tap');
    render();
    if (from) C.ui.fly(cps[i].firstChild, from, { ms: 200 });
    if (drawn >= 0 && slots[k].firstChild && myPile.firstChild) C.ui.fly(slots[k].firstChild, myPile.firstChild.getBoundingClientRect(), { ms: 220, delay: 60, flip: true });
    save();
    if (R.winner >= 0) { endRound(); return; }
    checkStuck();
  }

  /* -------------------------------------------------------------- bot */

  function scheduleBot() {
    clearTimeout(botTimer);
    if (!M || !M.live || M.R.winner >= 0) return;
    // the level is the bot's reaction time; the player's card pace scales it too
    var ms = C.cards.pace(E.DELAY[M.level] || E.DELAY.medium) * (0.8 + 0.4 * botRnd());
    botTimer = setTimeout(botTick, Math.round(ms));
  }
  function botTick() {
    botTimer = null;
    if (!M || !M.live || M.R.winner >= 0) return;
    // a window open (help, settings) holds the bot like it holds the player
    if (dialog()) { scheduleBot(); return; }
    var R = M.R, m = E.botMove(R, 1, M.level, botRnd);
    if (m) {
      var k = R.hands[1].indexOf(m.c), src = botHand.children[k] || botHand;
      var from = src.getBoundingClientRect();
      E.play(R, 1, m.c, m.i);
      C.audio.sfx('place');
      render();
      C.ui.fly(cps[m.i].firstChild, from, { ms: 220, flip: true });
      save();
      if (R.winner >= 0) { endRound(); return; }
      checkStuck();
    }
    scheduleBot();
  }

  // When neither side can play, new centre cards are turned after a moment, so both
  // players see that they are stuck before the table changes
  function checkStuck() {
    if (!M || !M.live || M.R.winner >= 0 || flipTimer || !E.stuck(M.R)) return;
    var R = M.R;
    renderStatus();
    flipTimer = setTimeout(function () {
      flipTimer = null;
      if (!M || M.R !== R || !M.live) return;
      if (dialog()) { checkStuck(); return; }
      var froms = [sides[0].firstChild, sides[1].firstChild].map(function (n) { return n ? n.getBoundingClientRect() : null; });
      var piles = [myPile.firstChild, botPile.firstChild].map(function (n) { return n ? n.getBoundingClientRect() : null; });
      var mode = E.flip(R, botRnd);
      if (!mode) return;
      if (sel >= 0) sel = -1;
      C.audio.sfx('flip');
      render();
      for (var i = 0; i < 2; i++) {
        // in the "own" step the player's card goes on the left pile, the bot's on the right
        var f = mode === 'own' ? piles[i] : froms[i] || froms[1 - i];
        if (f && cps[i].firstChild) C.ui.fly(cps[i].firstChild, f, { ms: 260, delay: i * 80, flip: true });
      }
      setMsg(mode === 'side' ? C.t('flipSide') : mode === 'own' ? C.t('flipOwn') : C.t('reshuffled'), 1500);
      save();
      checkStuck();
    }, C.cards.pace(E.FLIP_MS));
  }

  function stopAll() {
    clearTimeout(botTimer); clearTimeout(flipTimer); clearTimeout(readyTimer); clearTimeout(msgTimer);
    botTimer = flipTimer = readyTimer = msgTimer = null;
    if (drag) { endDrag(drag); drag = null; }
  }

  /* ------------------------------------------------------------ end */

  function endRound() {
    stopAll();
    M.live = false;
    var won = M.R.winner === 0;
    setMsg(won ? C.t('youFaster') : C.t('botFaster'), 0);
    render();
    if (won && cps[0].firstChild) C.ui.burst(cps[0].firstChild, { count: 22, speed: 240, ring: 30, colors: ['#8F78D6', '#50329B', '#E6DEFA'] });
    ctx.clearSave();
    setTimeout(finish, C.cards.pace(900));
  }
  function finish() {
    var R = M.R, ms = Date.now() - M.startedAt, won = R.winner === 0;
    var left0 = E.cardsLeft(R, 0), left1 = E.cardsLeft(R, 1);
    var base = { easy: 6, medium: 12, hard: 20 }[M.level] || 12;
    var coins = won ? base + (M.daily ? 8 : 0) : Math.max(2, Math.round(base * 0.3));
    var points = won ? base * 4 + (M.daily ? 25 : 0) : Math.round(base * 1.2);
    if (won) {
      C.achievements.unlock('spd-win');
      if (M.level === 'hard' && !M.daily) C.achievements.unlock('spd-hard');
      if (M.daily) C.achievements.unlock('spd-daily');
    }
    if (M.daily) {
      var first = C.stats.daily('speed', M.daily, { label: won ? C.t('dailyWon', { n: C.num(left1) }) : C.t('dailyLost', { n: C.num(left0) }), win: won });
      if (!first) { coins = Math.round(coins * 0.2); points = Math.round(points * 0.2); }
    }
    ctx.finish({
      won: won,
      title: won ? C.t('youFaster') : C.t('botFaster'),
      timeMs: ms, coins: coins, points: points,
      lines: [{ label: C.t('cardsYou'), value: C.num(left0) }, { label: C.t('cardsBot'), value: C.num(left1) }, { label: C.t('flipsN'), value: C.num(R.flips) }],
      shareText: 'چوگان · سرعت' + (M.daily ? ('\nروزانه ' + M.daily) : '') + '\n' + C.num(left0) + ' - ' + C.num(left1),
      onAgain: M.daily ? null : function () { newRound(null); }
    });
  }

  /* ----------------------------------------------------------- dialogs */

  function showSettings() {
    var seg = C.ui.segmented(LEVELS.map(function (l) { return { value: l, label: C.t(l) }; }), prefs.level, function (v) { prefs.level = v; ctx.store.set('prefs', prefs); });
    C.ui.modal({
      title: C.t('settings'),
      body: [el('div', { class: 'ch-list' }, [
        el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: C.t('level') }), seg]),
        C.cards.speedRow()
      ]), el('p', { class: 'ch-dim', text: C.t('optNote') })],
      actions: [{ label: C.t('done'), kind: 'primary' }]
    });
  }

  function askNew() {
    if (dialog()) return;
    var dd = M ? M.daily : null;
    var started = M && M.R.winner < 0 && (M.R.flips > 0 || M.R.centre[0].length + M.R.centre[1].length > 2);
    if (!started) { newRound(dd); return; }
    C.ui.confirm({ title: C.t('newRound'), body: C.t('resetWarn'), onOk: function () { newRound(dd); } });
  }

  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [kb('1–5', C.t('kbPick')), kb('←', C.t('kbLeft')), kb('→', C.t('kbRight')), kb('Enter', C.t('kbFirst'))])
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }

  // Digits pick a card by its place in the hand; the arrows play it on the left or right
  // centre pile. No right-to-left flip: the table is laid out left to right everywhere.
  window.addEventListener('keydown', function (e) {
    if (!canAct()) return;
    var tg = e.target, tag = tg && tg.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter'))) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var m = /^(?:Digit|Numpad)([1-5])$/.exec(e.code || '');
    if (m) { var k = +m[1] - 1; if (k < M.R.hands[0].length) { sel = sel === k ? -1 : k; render(); } e.preventDefault(); return; }
    if (sel < 0) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { tryPlay(sel, e.key === 'ArrowLeft' ? 0 : 1, null); e.preventDefault(); return; }
    if (e.key === 'Enter') { tryPlay(sel, E.canPlay(M.R, M.R.hands[0][sel], 0) ? 0 : 1, null); e.preventDefault(); }
  });

  function svgCard(x, y, label, red) {
    return '<rect x="' + x + '" y="' + y + '" width="34" height="48" rx="5" fill="var(--c-surface)" stroke="var(--c-line)"/>' +
      '<text x="' + (x + 4) + '" y="' + (y + 15) + '" font-size="13" font-weight="800" fill="' + (red ? 'var(--c-bad)' : 'var(--c-text)') + '">' + label + '</text>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: '<svg viewBox="0 0 200 110" width="100%" direction="ltr">' + svgCard(30, 34, '6♣︎', false) + svgCard(83, 30, '7♥︎', true) + svgCard(136, 34, '8♠︎', false) +
      '<path d="M70 60 h8 M125 60 h8" stroke="var(--game)" stroke-width="4" stroke-linecap="round"/></svg>' },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: '<svg viewBox="0 0 200 110" width="100%" direction="ltr">' + svgCard(60, 30, 'K♦︎', true) + svgCard(106, 30, 'A♣︎', false) +
      '<path d="M30 20 l10 14 M170 20 l-10 14 M30 96 l10 -14 M170 96 l-10 -14" stroke="var(--game)" stroke-width="4" stroke-linecap="round"/></svg>' },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: '<svg viewBox="0 0 200 110" width="100%" direction="ltr"><rect x="30" y="34" width="26" height="36" rx="4" fill="#1F3A93" stroke="#FBF5E6" stroke-width="2"/>' +
      '<rect x="144" y="34" width="26" height="36" rx="4" fill="#1F3A93" stroke="#FBF5E6" stroke-width="2"/>' + svgCard(66, 28, '3♠︎', false) + svgCard(102, 28, '10♥︎', true) + '</svg>' }
  ];

  /* ------------------------------------------------------------ save */

  ctx.autosave(function () {
    if (!M || !M.R || M.R.winner >= 0) return { inProgress: false };
    return { m: { R: JSON.parse(JSON.stringify(M.R)), level: M.level, daily: M.daily, elapsed: (pausedAt || Date.now()) - M.startedAt } };
  });
  function save() { ctx.save(); }
  C.onPause(function () { if (!M) return; stopAll(); M.live = false; sel = -1; if (!pausedAt) pausedAt = Date.now(); save(); });
  C.onResume(function () { if (pausedAt && M) M.startedAt += Date.now() - pausedAt; pausedAt = 0; if (M && M.R.winner < 0) { render(); readyGo(); } });

  /* ------------------------------------------------------------ start */

  var saved = ctx.loadSave();
  var sv = saved && saved.m && E.validRound(saved.m.R) && saved.m.R.winner < 0 ? saved.m : null;
  if (dailyDate) {
    if (sv && sv.daily === dailyDate) resume(sv);
    else newRound(dailyDate);
    if (C.stats.dailyDone('speed', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).speed;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
    }
  } else if (sv && !sv.daily) resume(sv);
  else newRound(null);
  ctx.tutorialIfNew(TUT);
})();
</script>
</body>
</html>
