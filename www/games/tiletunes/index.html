  .tt-box canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; border-radius: var(--r-md);

/* ==== ENGINE START ==== */
function TileTunesEngineFactory() {
  'use strict';

  var LANES = 4;
  var VIEW = 4;        // beats of music visible above the line
  var LATE = 0.6;      // beats a tile may sink below the line before it counts as a slip
  var LIVES = 3;       // slips that lose the song
  var LEAD = 1.5;      // beats between the line and the next tile when the tune waits
  var SPEEDS = { slow: 0.75, normal: 1, fast: 1.3, insane: 1.6 };
  var SPEED_IDS = ['slow', 'normal', 'fast', 'insane'];

  // Every tune is out of copyright and written out here note by note; the page plays
  // them with the core's piano voice, so the game carries no audio file. A token is a
  // note name with its octave (F#4, Bb3) and an optional length in beats after a colon.

    { id: 'twinkle', bpm: 100,
      t: { fa: 'چشمک بزن ستاره', en: 'Twinkle, Little Star', pl: 'Mrugaj, gwiazdko', fr: 'Ah ! vous dirai-je, maman', ar: 'تلألئي يا نجمة', hi: 'टिमटिम तारा', ru: 'Мерцай, звёздочка', pt: 'Brilha, brilha, estrelinha', zh: '小星星', de: 'Funkel, funkel, kleiner Stern', es: 'Estrellita' },
      n: 'C4 C4 G4 G4 A4 A4 G4:2 F4 F4 E4 E4 D4 D4 C4:2 G4 G4 F4 F4 E4 E4 D4:2 G4 G4 F4 F4 E4 E4 D4:2 C4 C4 G4 G4 A4 A4 G4:2 F4 F4 E4 E4 D4 D4 C4:2' },
    { id: 'ode', bpm: 112,
      t: { fa: 'سرود شادی', en: 'Ode to Joy', pl: 'Oda do radości', fr: 'Hymne à la joie', ar: 'نشيد الفرح', hi: 'आनंद गीत', ru: 'Ода к радости', pt: 'Hino à Alegria', zh: '欢乐颂', de: 'Ode an die Freude', es: 'Himno de la alegría' },
      n: 'E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 E4:1.5 D4:0.5 D4:2 E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 D4:1.5 C4:0.5 C4:2 ' +
        'D4 D4 E4 C4 D4 E4:0.5 F4:0.5 E4 C4 D4 E4:0.5 F4:0.5 E4 D4 C4 D4 G3:2 E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 D4:1.5 C4:0.5 C4:2' },
    { id: 'lullaby', bpm: 104,
      t: { fa: 'لالایی برامس', en: 'Brahms’ Lullaby', pl: 'Kołysanka Brahmsa', fr: 'Berceuse de Brahms', ar: 'تهويدة برامز', hi: 'ब्राम्स की लोरी', ru: 'Колыбельная Брамса', pt: 'Canção de ninar de Brahms', zh: '勃拉姆斯摇篮曲', de: 'Guten Abend, gut’ Nacht', es: 'Canción de cuna de Brahms' },
      n: 'E4:0.5 E4:0.5 G4:2 E4:0.5 E4:0.5 G4:2 E4:0.5 G4:0.5 C5 B4:1.5 A4:0.5 A4 G4 D4:0.5 E4:0.5 F4 D4 D4:0.5 E4:0.5 F4:2 ' +
        'D4:0.5 F4:0.5 B4:0.5 A4:0.5 G4 B4 C5:2 C4:0.5 C4:0.5 C5:2 A4:0.5 F4:0.5 G4:2 E4:0.5 C4:0.5 F4 G4 A4 G4:2 ' +
        'C4:0.5 C4:0.5 C5:2 A4:0.5 F4:0.5 G4:2 E4:0.5 C4:0.5 F4 E4:0.5 D4:0.5 C4:2' },
    { id: 'minuet', bpm: 132,
      t: { fa: 'مینوئت در سل', en: 'Minuet in G', pl: 'Menuet G-dur', fr: 'Menuet en sol', ar: 'مينويت في صول', hi: 'मिनुएट इन जी', ru: 'Менуэт соль мажор', pt: 'Minueto em Sol', zh: 'G大调小步舞曲', de: 'Menuett in G', es: 'Minueto en sol' },
      n: 'D5 G4:0.5 A4:0.5 B4:0.5 C5:0.5 D5 G4 G4 E5 C5:0.5 D5:0.5 E5:0.5 F#5:0.5 G5 G4 G4 C5 D5:0.5 C5:0.5 B4:0.5 A4:0.5 B4 C5:0.5 B4:0.5 A4:0.5 G4:0.5 F#4 G4:0.5 A4:0.5 B4:0.5 G4:0.5 A4:3 ' +
        'D5 G4:0.5 A4:0.5 B4:0.5 C5:0.5 D5 G4 G4 E5 C5:0.5 D5:0.5 E5:0.5 F#5:0.5 G5 G4 G4 C5 D5:0.5 C5:0.5 B4:0.5 A4:0.5 B4 C5:0.5 B4:0.5 A4:0.5 G4:0.5 A4 B4:0.5 A4:0.5 G4:0.5 F#4:0.5 G4:3' },
    { id: 'greensleeves', bpm: 150,
      t: { fa: 'آستین‌سبز', en: 'Greensleeves', pl: 'Greensleeves', fr: 'Greensleeves', ar: 'الأكمام الخضراء', hi: 'ग्रीनस्लीव्स', ru: 'Зелёные рукава', pt: 'Greensleeves', zh: '绿袖子', de: 'Greensleeves', es: 'Greensleeves' },
      n: 'A4 C5:2 D5 E5:1.5 F5:0.5 E5 D5:2 B4 G4:1.5 A4:0.5 B4 C5:2 A4 A4:1.5 G#4:0.5 A4 B4:2 G#4 E4:2 ' +
        'A4 C5:2 D5 E5:1.5 F5:0.5 E5 D5:2 B4 G4:1.5 A4:0.5 B4 C5:1.5 B4:0.5 A4 G#4:1.5 F#4:0.5 G#4 A4:3' },
    { id: 'elise', bpm: 160,
      t: { fa: 'برای الیزه', en: 'Für Elise', pl: 'Dla Elizy', fr: 'La Lettre à Élise', ar: 'من أجل إليز', hi: 'फ़्यूर एलीज़े', ru: 'К Элизе', pt: 'Para Elisa', zh: '致爱丽丝', de: 'Für Elise', es: 'Para Elisa' },
      n: 'E5 D#5 E5 D#5 E5 B4 D5 C5 A4:2 C4 E4 A4 B4:2 E4 G#4 B4 C5:2 E4 E5 D#5 E5 D#5 E5 B4 D5 C5 A4:2 C4 E4 A4 B4:2 E4 C5 B4 A4:3' },
    { id: 'morning', bpm: 150,
      t: { fa: 'حال‌وهوای صبح', en: 'Morning Mood', pl: 'Poranek', fr: 'Le Matin', ar: 'مزاج الصباح', hi: 'सुबह का मिज़ाज', ru: 'Утро', pt: 'A Manhã', zh: '晨景', de: 'Morgenstimmung', es: 'La mañana' },
      n: 'G5 E5 D5 C5 D5 E5 G5 E5 D5 C5 D5:0.5 E5:0.5 D5:0.5 E5:0.5 G5 E5 G5 A5 E5 A5 G5 E5 D5 C5:3 ' +
        'G5 E5 D5 C5 D5 E5 G5 E5 D5 C5 D5:0.5 E5:0.5 D5:0.5 E5:0.5 G5 E5 G5 A5 E5 A5 B5 G#5 F#5 E5:3' },
    { id: 'cancan', bpm: 200,
      t: { fa: 'کن‌کن', en: 'Can-can', pl: 'Kankan', fr: 'Galop infernal', ar: 'الكانكان', hi: 'कैन-कैन', ru: 'Канкан', pt: 'Can-can', zh: '康康舞曲', de: 'Cancan', es: 'Cancán' },
      n: 'C4:2 D4 F4 E4 D4 G4:2 G4:2 G4 A4 E4 F4 D4:2 D4:2 D4 F4 E4 D4 C4 C5 B4 A4 G4 F4 E4 D4 ' +
        'C4:2 D4 F4 E4 D4 G4:2 G4:2 G4 A4 E4 F4 D4:2 D4:2 D4 F4 E4 D4 C4 G4 D4 E4 C4:2' },
    { id: 'mountain', bpm: 190,
      t: { fa: 'در تالار پادشاه کوهستان', en: 'In the Hall of the Mountain King', pl: 'W grocie Króla Gór', fr: 'Dans l’antre du roi de la montagne', ar: 'في قاعة ملك الجبل', hi: 'पहाड़ के राजा के महल में', ru: 'В пещере горного короля', pt: 'Na Gruta do Rei da Montanha', zh: '山大王的宫殿', de: 'In der Halle des Bergkönigs', es: 'En la gruta del rey de la montaña' },
      n: 'A3 B3 C4 D4 E4 C4 E4:2 D#4 B3 D#4:2 D4 Bb3 D4:2 A3 B3 C4 D4 E4 C4 E4 A4 G4 E4 C4 E4 G4:4 ' +
        'E4 F#4 G#4 A4 B4 G#4 B4:2 C5 G#4 C5:2 B4 G#4 B4:2 E4 F#4 G#4 A4 B4 G#4 B4 E5 D5 B4 G#4 B4 D5:4' }
  ];
  var BY_ID = {};
  SONGS.forEach(function (s) { BY_ID[s.id] = s; });

  var STEP = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function parse(str) {
    return String(str).trim().split(/\s+/).map(function (tok) {
      var m = /^([A-G])([#b]?)(\d)(?::(\d+(?:\.\d+)?))?$/.exec(tok);
      if (!m) throw new Error('bad note ' + tok);
      var midi = (+m[3] + 1) * 12 + STEP[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
      return { m: midi, d: m[4] ? +m[4] : 1 };
    });
  }
  function freq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  // The lane follows the tune: a higher note moves right, a lower one left, a leap of
  // a fourth or more moves two, and a repeated note stays put. The edges turn back, so
  // a long climb zigzags instead of piling up in the last lane.
  function lanes(notes) {
    var out = [], lane = 1;
    notes.forEach(function (n, i) {
      if (i) {
        var d = n.m - notes[i - 1].m, step = Math.abs(d) >= 5 ? 2 : 1;
        if (d > 0) lane = lane + step <= LANES - 1 ? lane + step : Math.max(0, lane - 1);
        else if (d < 0) lane = lane - step >= 0 ? lane - step : Math.min(LANES - 1, lane + 1);
      }
      out.push(lane);
    });
    return out;
  }
  var charts = {};
  function chart(id) {
    if (charts[id]) return charts[id];
    var s = BY_ID[id];
    if (!s) return null;
    var notes = parse(s.n), ln = lanes(notes), b = 0;
    var c = notes.map(function (n, i) { var o = { m: n.m, b: b, d: n.d, lane: ln[i] }; b += n.d; return o; });
    charts[id] = { notes: c, beats: b, bpm: s.bpm };
    return charts[id];
  }
  function bps(S) { return chart(S.song).bpm / 60 * SPEEDS[S.speed]; }
  function seconds(id, speed) { var c = chart(id); return c.beats / (c.bpm / 60 * SPEEDS[speed || 'normal']); }

  function newGame(o) {
    o = o || {};
    var song = BY_ID[o.song] ? o.song : SONGS[0].id;
    var speed = SPEEDS[o.speed] ? o.speed : 'normal';
    // the first tile waits above the line; tapping it starts the tune
    var S = { song: song, speed: speed, pos: -LEAD, i: 0, miss: 0, wait: true, over: null, t: 0 };
    // endless (#1272): one song follows another until the third slip; `done` counts the
    // notes of the songs already finished, `songs` how many there were
    if (o.endless) { S.endless = true; S.done = 0; S.songs = 0; }
    return S;
  }
  function after(id) {
    for (var i = 0; i < SONGS.length; i++) if (SONGS[i].id === id) return SONGS[(i + 1) % SONGS.length].id;
    return SONGS[0].id;
  }
  function total(S) { return (S.done || 0) + S.i; }
  function next(S) { return chart(S.song).notes[S.i] || null; }
  function visible(S, n) { return !!n && n.b < S.pos + VIEW; }

  // A tap in the next tile's lane plays it, however early, as long as it is on screen.
  // Any other tap while the tune runs is a slip; while the tune waits it is ignored, so
  // a stray finger after a slip costs nothing more.
  function tap(S, lane) {
    if (!S || S.over) return { type: 'none' };
    var n = next(S);
    if (!n) return { type: 'none' };
    if (lane === n.lane && visible(S, n)) {
      S.i++;
      S.wait = false;
      var moved = false;
      if (S.i >= chart(S.song).notes.length) {
        if (S.endless) {
          // the slips and the speed carry over. The board keeps moving, so the next tune's first
          // tile starts a whole view up: LEAD beats left no time to react at Insane (#1293)
          S.done += S.i; S.songs++; S.song = after(S.song); S.i = 0; S.pos = -VIEW; moved = true;
        } else S.over = 'won';
      }
      return { type: 'hit', note: n, won: S.over === 'won', moved: moved };
    }
    // nothing on screen yet (a song change, #1293): a second tap on the last note is not a slip
    if (S.wait || !visible(S, n)) return { type: 'none' };
    S.miss++;
    if (S.miss >= LIVES) S.over = 'lost';
    return { type: 'wrong', lane: lane, lost: S.over === 'lost' };
  }
  // The music moves on in beats. A tile that sinks LATE beats under the line is a slip:
  // the board winds back so it sits above the line again and waits for a tap.
  function tick(S, sec) {
    if (!S || S.over || S.wait || !(sec > 0)) return null;
    S.t += sec;
    S.pos += sec * bps(S);
    var n = next(S);
    if (n && S.pos > n.b + LATE) {
      S.miss++;
      S.pos = n.b - LEAD;
      S.wait = true;
      if (S.miss >= LIVES) S.over = 'lost';
      return { type: 'late', note: n, lost: S.over === 'lost' };
    }
    return null;
  }
  // a paused tune waits for a tap too, so coming back never costs a slip
  function pause(S) {
    if (!S || S.over || S.wait) return;
    var n = next(S);
    S.wait = true;
    if (!n) return;
    S.pos = Math.min(S.pos, n.b - LEAD);
    // a tile still (almost) above the screen (#1293) could not be tapped while waiting
    if (n.b - S.pos > VIEW - 1) S.pos = n.b - LEAD;
  }
  function result(S) {
    var len = chart(S.song).notes.length, won = S.over === 'won';
    return { won: won, stars: won ? Math.max(1, LIVES - S.miss) : 0, hits: total(S), total: len, miss: S.miss, songs: S.songs || 0, endless: !!S.endless };
  }
  function valid(S) {
    if (!S || typeof S !== 'object' || !BY_ID[S.song] || !SPEEDS[S.speed]) return false;
    var len = chart(S.song).notes.length;
    if (!(S.i === (S.i | 0) && S.i >= 0 && S.i <= len)) return false;
    if (!(S.miss === (S.miss | 0) && S.miss >= 0 && S.miss <= LIVES)) return false;
    if (!isFinite(S.pos) || !isFinite(S.t) || S.t < 0 || typeof S.wait !== 'boolean') return false;
    if (S.over !== null && S.over !== 'won' && S.over !== 'lost') return false;
    if (S.over === 'won' && S.i !== len) return false;
    // a save from before endless play has none of the three
    if (S.endless !== undefined && !(S.endless === true && S.done === (S.done | 0) && S.done >= 0 && S.songs === (S.songs | 0) && S.songs >= 0 && S.over !== 'won')) return false;
    return true;
  }
  function title(id, lang) { var s = BY_ID[id]; return s ? (s.t[lang] || s.t.en) : ''; }

  var api = { LANES: LANES, VIEW: VIEW, LATE: LATE, LIVES: LIVES, LEAD: LEAD, SPEEDS: SPEEDS, SPEED_IDS: SPEED_IDS, SONGS: SONGS,
    parse: parse, freq: freq, lanes: lanes, chart: chart, bps: bps, seconds: seconds, newGame: newGame, next: next, visible: visible,
    tap: tap, tick: tick, pause: pause, result: result, valid: valid, title: title, after: after, total: total };
  if (typeof self !== 'undefined') self.TileTunesEngine = api;
  return api;
}
if (typeof module !== 'undefined' && module.exports) module.exports = TileTunesEngineFactory;
/* ==== ENGINE END ==== */
</script>

  function dailySong(date) {
    var r = C.daily('tiletunes', date).rng;
    return E.SONGS[Math.floor(r() * E.SONGS.length) % E.SONGS.length].id;
  }
  function firstOpen() {

      C.achievements.unlock('tt-song');
      if (R.miss === 0) C.achievements.unlock('tt-clean');
      if ((S.speed === 'fast' || S.speed === 'insane') && !daily) C.achievements.unlock('tt-fast');
      if (daily) C.achievements.unlock('tt-daily');
      if (E.SONGS.every(function (s) { return best[s.id] > 0; })) { C.achievements.unlock('tt-all'); note = C.t('ttAllNote'); }
    }
    if (daily && !C.stats.daily('tiletunes', daily, { label: songTitle(S.song) + (R.won ? ' ' + '★'.repeat(R.stars) : ''), win: R.won, stars: R.stars })) {
      coins = Math.max(1, Math.round(coins * 0.2)); points = Math.max(1, Math.round(points * 0.2));
    }
    var song = S.song, idx = E.SONGS.findIndex(function (s) { return s.id === song; });
    var nextSong = E.SONGS[(idx + 1) % E.SONGS.length].id;
    ctx.clearSave();
    ctx.finish({
      won: R.won, title: R.won ? C.t('ttWon') : C.t('ttLost'), note: note, stars: R.won ? R.stars : null, timeMs: Math.round(S.t * 1000), coins: coins, points: points,
      lines: (daily ? [{ label: C.t('daily'), value: C.num(daily) }] : []).concat([
        { label: C.t('ttSongs'), value: songTitle(song) },
        { label: C.t('ttNotes'), value: C.num(R.hits) + ' / ' + C.num(R.total) },
        { label: C.t('ttSlips'), value: C.num(R.miss) }
      ]),
      shareText: 'چوگان · کاشی‌نوا' + (daily ? '\nروزانه ' + daily : '') + '\n' + E.title(song, 'fa') + (R.won ? '\n' + '★'.repeat(R.stars) : ''),
      againLabel: daily ? null : (R.won ? C.t('ttNext') : C.t('ttRetry')),
      onAgain: daily ? null : function () { start(R.won ? nextSong : song); }
    });
  }

  function finishEndless(R) {
    var speed = S.speed, was = endlessBest[speed] || 0, record = R.hits > was;
    if (record) { endlessBest[speed] = R.hits; ctx.store.set('endless', endlessBest); }
    var first = prefs.song;
    ctx.clearSave();
    ctx.finish({
      won: record, title: record ? C.t('ttRecord') : C.t('ttLost'), timeMs: Math.round(S.t * 1000),
      coins: 1 + 3 * R.songs, points: Math.max(1, 8 * R.songs + Math.round(S.i / R.total * 4)),
      lines: [
        { label: C.t('ttEndless'), value: speedName(speed) },
        { label: C.t('ttNotes'), value: C.num(R.hits) },
        { label: C.t('ttSongs'), value: C.num(R.songs) },
        { label: C.t('best'), value: C.num(endlessBest[speed] || 0) }
      ],
      shareText: 'چوگان · کاشی‌نوا\nبی‌پایان · ' + C.num(R.hits),
      againLabel: C.t('again'),
      onAgain: function () { start(first); }
    });
  }

  /* ---------------------------------------------------------------- view */

  function say(t) { msg.textContent = t; }
  function paintAll() { paintTop(); draw(); }
  function paintTop() {
    if (!S) return;
    songEl.textContent = songTitle(S.song);
    tBadge.innerHTML = '';
    if (daily) tBadge.appendChild(el('span', { class: 'ch-badge ch-badge--accent' }, [C.icon('calendar', 14), el('span', { text: C.t('ttDaily') })]));
    else tBadge.appendChild(el('span', { class: 'ch-badge', text: speedName(S.speed) + (S.endless ? ' ∞' : '') }));
    var total = E.chart(S.song).notes.length;
    tNotes.textContent = C.t('ttNotes') + ' ' + (S.endless ? C.num(E.total(S)) : C.num(S.i) + ' / ' + C.num(total));
    tSlips.innerHTML = '';
    tSlips.setAttribute('aria-label', C.t('ttSlips') + ' ' + C.num(S.miss) + ' / ' + C.num(E.LIVES));
    for (var i = 0; i < E.LIVES; i++) tSlips.appendChild(el('span', { class: 'tt-slip' + (i < S.miss ? ' tt-gone' : '') }));
    barFill.style.width = (100 * S.i / total).toFixed(1) + '%';
    cv.setAttribute('aria-label', C.t('ttBoard') + ' · ' + songTitle(S.song));
  }
  function speedName(s) { return C.t(s === 'insane' ? 'ttInsane' : s === 'slow' ? 'speedSlow' : s === 'fast' ? 'speedFast' : 'speedNormal'); }

  function dark() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t === 'dark') return true;
    if (t === 'light') return false;
    return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function palette() {
    return dark()
      ? { bg: '#18131D', lane: '#221A2A', sep: '#33283F', line: '#7C5FA0', tile: '#A57AD6', tile2: '#8C5EC2', ink: '#170B22', done: 'rgba(165,122,214,0.16)', bad: '#F0695E', glow: 'rgba(165,122,214,0.35)' }
      : { bg: '#FBF8FD', lane: '#F3EDF8', sep: '#E3D8EC', line: '#9B7DB8', tile: '#5C0092', tile2: '#7A2BB0', ink: '#FFFFFF', done: 'rgba(92,0,146,0.12)', bad: '#D8443A', glow: 'rgba(92,0,146,0.22)' };
  }
  var drawn = { w: 0, h: 0 };
  function size() {
    var r = box.getBoundingClientRect();
    return { w: Math.max(120, Math.floor(r.width) || 0), h: Math.max(160, Math.floor(r.height) || 0) };
  }
  function view(Z) {
    var lineY = Z.h * 0.84;
    return { lineY: lineY, ppb: lineY / E.VIEW, lw: Z.w / E.LANES };
  }
  function rr(g, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    g.beginPath();
    g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
  }
  function draw(now) {
    if (!S) return;
    now = now || performance.now();
    var Z = size(), dpr = Math.min(2, window.devicePixelRatio || 1);
    // both sides: a new canvas is 300×150 (#359)
    if (cv.width !== Math.round(Z.w * dpr) || cv.height !== Math.round(Z.h * dpr)) { cv.width = Math.round(Z.w * dpr); cv.height = Math.round(Z.h * dpr); }
    drawn = { w: Z.w, h: Z.h };
    var P = palette(), V = view(Z), g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = P.bg; g.fillRect(0, 0, Z.w, Z.h);
    for (var l = 0; l < E.LANES; l++) {
      if (l % 2) { g.fillStyle = P.lane; g.fillRect(l * V.lw, 0, V.lw, Z.h); }
      if (l) { g.fillStyle = P.sep; g.fillRect(Math.round(l * V.lw), 0, 1, Z.h); }
    }
    // flashes under the tiles: a red lane for a slip
    flashes = flashes.filter(function (f) { return now - f.at < 600; });
    flashes.forEach(function (f) {
      g.globalAlpha = Math.max(0, 1 - (now - f.at) / 600) * 0.45;
      g.fillStyle = P.bad; g.fillRect(f.lane * V.lw, 0, V.lw, Z.h);
      g.globalAlpha = 1;
    });
    // the line the tiles are played at
    g.fillStyle = P.line; g.fillRect(0, Math.round(V.lineY), Z.w, 2);

    var notes = E.chart(S.song).notes, pad = Math.max(2, Math.round(V.lw * 0.04));
    var from = Math.max(0, S.i - 8);
    for (var i = from; i < notes.length; i++) {
      var n = notes[i];
      var yBot = V.lineY - (n.b - S.pos) * V.ppb, yTop = V.lineY - (n.b + n.d - S.pos) * V.ppb;
      if (yBot < -4) break;
      if (yTop > Z.h + 4) continue;
      var x = n.lane * V.lw + pad, w = V.lw - pad * 2, h = Math.max(8, yBot - yTop - pad * 2), y = yTop + pad;
      if (i < S.i) {
        // a played tile fades where it was
        var age = hitAt[i] ? Math.min(1, (now - hitAt[i]) / 260) : 1;
        g.fillStyle = P.done; rr(g, x, y, w, h, 10); g.fill();
        if (age < 1) { g.globalAlpha = 1 - age; g.fillStyle = P.tile; rr(g, x, y, w, h, 10); g.fill(); g.globalAlpha = 1; }
        continue;
      }
      var isNext = i === S.i;
      if (isNext) { g.fillStyle = P.glow; rr(g, x - 3, y - 3, w + 6, h + 6, 13); g.fill(); }
      g.fillStyle = isNext ? P.tile : P.tile2; rr(g, x, y, w, h, 10); g.fill();
      if (isNext && S.wait && !S.over) {
        g.fillStyle = P.ink;
        var fs = Math.max(12, Math.min(20, w * 0.2));
        g.font = '800 ' + fs + 'px ' + (getComputedStyle(document.body).fontFamily || 'sans-serif');
        g.textAlign = 'center'; g.textBaseline = 'middle';
        // a tile shorter than the word shows a dot to tap instead
        if (h > fs * 1.6) g.fillText(S.i === 0 ? C.t('ttStart') : '▶', x + w / 2, y + h / 2);
        else { g.beginPath(); g.arc(x + w / 2, y + h / 2, Math.min(6, h / 3), 0, Math.PI * 2); g.fill(); }
      }
    }
  }

  /* --------------------------------------------------------------- input */

  // the lane is read against the board as last drawn (Bowling lesson)
  cv.addEventListener('pointerdown', function (e) {
    if (!S || !drawn.w) return;
    e.preventDefault();
    var r = cv.getBoundingClientRect();
    var x = (e.clientX - r.left) / (r.width || 1) * drawn.w;
    var lane = Math.max(0, Math.min(E.LANES - 1, Math.floor(x / (drawn.w / E.LANES))));
    press(lane);
  });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  // D F J K or 1 2 3 4, left to right in every language: a canvas is drawn left to right
  var KEYS = [['d', '1'], ['f', '2'], ['j', '3'], ['k', '4']];
  window.addEventListener('keydown', function (e) {
    if (document.querySelector('.ch-scrim')) return;
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat || !S || ended) return;
    for (var l = 0; l < KEYS.length; l++) {
      if (C.keyIs(e, KEYS[l][0]) || e.key === KEYS[l][1] || e.code === 'Digit' + KEYS[l][1] || e.code === 'Numpad' + KEYS[l][1]) {
        e.preventDefault();
        press(l);
        return;
      }
    }
  });

  /* ------------------------------------------------------------- dialogs */

  function kb(k, what) { return el('div', { class: 'ch-item' }, [el('div', { class: 'ch-item__label', text: what }), el('span', { class: 'ch-badge', text: k })]); }
  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [kb('D F J K', C.t('ttLanes')), kb('1 2 3 4', C.t('ttLanes'))])
      ],
      actions: [{ label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } }, { label: C.t('done'), kind: 'primary' }]
    });
  }
  // a change of song or speed starts the song again; one under way asks first
  function apply(change) {
    if (started()) C.ui.confirm({ title: C.t('ttNew'), body: C.t('resetWarn'), onOk: function () { change(); start(prefs.song); } });
    else { change(); start(prefs.song); }
  }
  // four speeds are wider than a phone's dialog in Russian, so the row may wrap
  function speedPicker(pick) {
    var seg = C.ui.segmented(E.SPEED_IDS.map(function (v) { return { value: v, label: speedName(v) }; }), prefs.speed, pick);
    seg.classList.add('ch-seg--wrap');
    return seg;
  }
  function showSettings() {
    var m = null;
    var list = el('div', { class: 'ch-list' }, E.SONGS.map(function (s) {
      var b = best[s.id] || 0;
      var row = el('button', { class: 'ch-item', type: 'button', style: { width: '100%', background: 'none', border: '0', 'border-bottom': '1px solid var(--c-line)', font: 'inherit', color: 'inherit', cursor: 'pointer', 'min-height': '44px', 'text-align': 'start' } }, [
        el('div', { class: 'ch-item__label', text: (S && S.song === s.id ? '▶ ' : '') + songTitle(s.id) }),
        el('span', { class: 'ch-dim', text: b ? '★'.repeat(b) : '·', 'aria-label': C.num(b) + ' ' + C.t('stars') })
      ]);
      row.addEventListener('click', function () {
        m.close();
        if (S && S.song === s.id && !ended) return;
        apply(function () { prefs.song = s.id; ctx.store.set('prefs', prefs); });
      });
      return row;
    }));
    // no button under the long song list: it took the focus and opened the dialog scrolled to the bottom (#1272)
    m = C.ui.modal({
      title: C.t('settings'), closeButton: true,
      body: [
        el('div', { class: 'ch-list' }, [el('div', { class: 'ch-item tt-endless' }, [
          el('div', { class: 'ch-item__label' }, [el('div', { text: C.t('ttEndless') }), el('div', { class: 'ch-item__hint', text: C.t('ttEndlessNote') }),
            endlessBest[prefs.speed] ? el('div', { class: 'ch-item__hint', text: C.t('best') + ' ' + C.num(endlessBest[prefs.speed]) }) : null]),
          C.ui.switch(!!prefs.endless, function (v) {
            m.close();
            apply(function () { prefs.endless = v; ctx.store.set('prefs', prefs); });
          })
        ])]),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('ttSpeed') }),
        speedPicker(function (v) {
          if (v === prefs.speed) return;
          m.close();
          apply(function () { prefs.speed = v; ctx.store.set('prefs', prefs); });
        }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('ttSongs') }),
        list
      ]
    });
  }

  // Tutorial pictures: four lanes, tiles and a finger, in the light theme's literal colours
  function tArt(step) {
    // the lanes are clipped to the frame and its outline goes on top, so a lane never squares off a rounded corner
    var clip = 'ttArt' + step;
    var s = '<svg viewBox="0 0 200 110" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="' + clip + '"><rect x="40" y="2" width="120" height="106" rx="8"/></clipPath></defs>';
    s += '<g clip-path="url(#' + clip + ')"><rect x="40" y="2" width="120" height="106" fill="#FBF8FD"/>';
    s += '<rect x="70" y="2" width="30" height="106" fill="#F3EDF8"/><rect x="130" y="2" width="30" height="106" fill="#F3EDF8"/>';
    s += '<rect x="40" y="88" width="120" height="2" fill="#9B7DB8"/>';
    if (step === 3) s += '<rect x="130" y="2" width="30" height="106" fill="#D8443A" opacity=".35"/>';
    s += '</g><rect x="40" y="2" width="120" height="106" rx="8" fill="none" stroke="#E3D8EC"/>';
    if (step === 1) {
      s += '<rect x="103" y="10" width="24" height="22" rx="4" fill="#7A2BB0"/><rect x="73" y="40" width="24" height="44" rx="4" fill="#7A2BB0"/>';
      s += '<rect x="43" y="66" width="24" height="20" rx="4" fill="#5C0092"/>';
      s += '<circle cx="55" cy="78" r="9" fill="#F2C14E" opacity=".85"/>';
    } else if (step === 2) {
      s += '<rect x="43" y="92" width="24" height="14" rx="4" fill="rgba(92,0,146,0.14)"/><rect x="73" y="62" width="24" height="24" rx="4" fill="#5C0092"/><rect x="103" y="8" width="24" height="50" rx="4" fill="#7A2BB0"/>';
      s += '<path d="M176 30v-16l12-3v16" stroke="#5C0092" stroke-width="2.5" fill="none"/><circle cx="173" cy="30" r="4" fill="#5C0092"/><circle cx="185" cy="27" r="4" fill="#5C0092"/>';
      s += '<path d="M14 40v-14" stroke="#7A2BB0" stroke-width="2.5"/><circle cx="11" cy="40" r="4" fill="#7A2BB0"/>';
    } else {
      s += '<rect x="73" y="50" width="24" height="34" rx="4" fill="#5C0092"/>';
      s += '<circle cx="145" cy="70" r="9" fill="#F2C14E" opacity=".85"/>';
      s += '<circle cx="176" cy="50" r="5" fill="#C9B8D8"/><circle cx="176" cy="64" r="5" fill="none" stroke="#C9B8D8" stroke-width="2"/><circle cx="176" cy="78" r="5" fill="none" stroke="#C9B8D8" stroke-width="2"/>';
    }
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: tArt(1) },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: tArt(2) },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: tArt(3) }
  ];

  /* --------------------------------------------------------------- start */

  // saved after every tap and when the app goes away; the daily song has its own slot
  ctx.autosave(function () {
    if (!S || ended || S.over) return { inProgress: false };
    if (!started()) return { inProgress: false };
    return { game: S, daily: daily };
  });
  function halt() {
    paused = true;
    if (S && !ended) { E.pause(S); stopVoice(); if (!S.over && started()) say(C.t('ttGo')); }
    ctx.save();
    draw();
  }
  function resume() { paused = false; draw(); }
  C.onPause(halt);
  C.onResume(resume);
  document.addEventListener('visibilitychange', function () { if (document.hidden) halt(); else resume(); });
  // back from the back/forward cache, the page runs on without a load (#385)
  window.addEventListener('pageshow', function (e) { if (e.persisted) resume(); });

  var saved = ctx.loadSave();
  if (saved && saved.game && E.valid(saved.game) && !saved.game.over && (saved.daily || null) === (dailyDate || null)) {
    S = saved.game; daily = saved.daily || null; ended = false;
    E.pause(S);
    say(C.t('ttGo'));
    paintAll();
  } else start();
  if (dailyDate && C.stats.dailyDone('tiletunes', dailyDate)) {
    var rec = C.stats.dailyOf(dailyDate).tiletunes;
    C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec && rec.label });
  }
  // the board is redrawn whenever its box changes (rotation, side rows) and once the
  // web font has arrived and moved the layout (Bowling lesson)
  if (window.ResizeObserver) new ResizeObserver(function () { draw(); }).observe(box);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { draw(); });
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { draw(); }); } catch (er) { /* old WebViews */ } }
  new MutationObserver(function () { draw(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  ctx.tutorialIfNew(TUT);
})();
</script>
</body>
</html>
