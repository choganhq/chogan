  /* کاشی شیء فیزیکی است و در هر دو تم رنگ عاج دارد تا نقش‌ها همیشه خوانا باشند */
  :root { --mj-face: #FBF7EE; --mj-side: #D9CDB4; --mj-edge: #B9AB8E; }
  .mj-wrap { width: 100%; max-width: 980px; display: flex; flex-direction: column; align-items: center; gap: var(--s-3); }
  .mj-top { display: flex; flex-wrap: wrap; gap: var(--s-2); justify-content: center; align-items: center; }
  /* تخته در راست‌چین آینه نمی‌شود؛ جای کاشی‌ها بخشی از چیدمان است */
  /* The view clips the board; zoom and pan move the board inside it (#167) */
  .mj-view { position: relative; overflow: hidden; touch-action: none; margin: 6px auto; border-radius: var(--r-md); }
  .mj-board { position: relative; direction: ltr; transform-origin: 0 0; }
  .mj-tile {
    position: absolute; padding: 0; border: 0; cursor: pointer; border-radius: 6px;
    background: var(--mj-face); box-shadow: 3px 3px 0 var(--mj-side), 4px 4px 0 var(--mj-edge), 4px 6px 8px rgba(0,0,0,.25);
    transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
  }
  .mj-tile svg { width: 100%; height: 100%; display: block; pointer-events: none; }
  @media (prefers-reduced-motion: no-preference) {
    .mj-tile { transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease), left .3s var(--ease), top .3s var(--ease), width .3s var(--ease), height .3s var(--ease); }
  }
  .mj-tile--sel { transform: translate(-2px, -3px); box-shadow: 0 0 0 3px var(--game), 5px 6px 0 var(--mj-side), 6px 7px 0 var(--mj-edge), 6px 10px 12px rgba(0,0,0,.3); }
  .mj-tile--hint { box-shadow: 0 0 0 3px var(--c-good), 3px 3px 0 var(--mj-side), 4px 4px 0 var(--mj-edge); }
  .mj-tile--cur { outline: 2px dashed var(--game); outline-offset: 3px; }
  /* کاشی بسته کمی تیره‌تر است تا آزادها بی‌دردسر پیدا شوند */
  .mj-tile--blocked { filter: brightness(.84) saturate(.8); }
  .mj-status { min-height: 1.6em; font-weight: 700; color: var(--c-text-dim); text-align: center; }
  .mj-actions { display: flex; gap: var(--s-2); flex-wrap: wrap; justify-content: center; }

<script>
/* ==== ENGINE START ==== */
/* ماهجونگ تک‌نفره (جفت کردن کاشی‌ها). جای کاشی‌ها در واحد نیم‌کاشی است:
   [x, y, z]، هر کاشی دو واحد پهنا و دو واحد بلندی دارد و z طبقه است.
   نقش کاشی ۰ تا ۴۱: ۰..۸ دایره، ۹..۱۷ نی، ۱۸..۲۶ عدد، ۲۷..۳۰ باد، ۳۱..۳۳ اژدها،
   ۳۴..۳۷ گل‌ها، ۳۸..۴۱ فصل‌ها. گل با هر گل و فصل با هر فصل جفت است. */
function MahjongEngineFactory() {
  'use strict';

  function rect(cols, rows, x0, y0, z) {
    var out = [];
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) out.push([x0 + c * 2, y0 + r * 2, z]);
    return out;
  }

  var LAYOUTS = {
    // هشت کاشی پهنا تا روی گوشی ۳۹۰ پیکسلی هر کاشی حدود ۴۴ پیکسل باشد
    small: [].concat(rect(8, 6, 0, 0, 0), rect(6, 3, 2, 2, 1), rect(2, 3, 6, 2, 2)),
    medium: [].concat(rect(8, 8, 0, 0, 0), rect(6, 6, 2, 2, 1), rect(4, 2, 4, 6, 2)),
    turtle: (function () {
      var t = [];
      var rows = [[0, 2, 24], [2, 6, 20], [4, 4, 22], [6, 2, 24], [8, 2, 24], [10, 4, 22], [12, 6, 20], [14, 2, 24]];
      rows.forEach(function (r) { for (var x = r[1]; x <= r[2]; x += 2) t.push([x, r[0], 0]); });
      t.push([0, 7, 0], [26, 7, 0], [28, 7, 0]);
      t = t.concat(rect(6, 6, 8, 2, 1), rect(4, 4, 10, 4, 2), rect(2, 2, 12, 6, 3));
      t.push([13, 7, 4]);
      return t;
    })()
  };

  function matches(a, b) {
    if (a === b) return true;
    if (a >= 34 && a <= 37 && b >= 34 && b <= 37) return true;
    if (a >= 38 && b >= 38) return true;
    return false;
  }

  function overlap(a, b) { return Math.abs(a[0] - b[0]) < 2 && Math.abs(a[1] - b[1]) < 2; }

  // آزاد: چیزی رویش نیست و چپ یا راستش در همان طبقه باز است
  function freeIn(pos, alive, i) {
    var p = pos[i], left = false, right = false;
    for (var j = 0; j < pos.length; j++) {
      if (j === i || !alive[j]) continue;
      var q = pos[j];
      if (q[2] === p[2] + 1 && overlap(p, q)) return false;
      if (q[2] === p[2] && Math.abs(q[1] - p[1]) < 2) {
        if (q[0] === p[0] - 2) left = true;
        if (q[0] === p[0] + 2) right = true;
      }
    }
    return !(left && right);
  }

  function shuffle(a, rnd) {
    for (var i = a.length - 1; i > 0; i--) {
      var k = Math.floor(rnd() * (i + 1));
      var t = a[i]; a[i] = a[k]; a[k] = t;
    }
    return a;
  }

  // جفت‌های قابل استفاده برای تعداد کاشی: هر نقش معمولی دو جفت، گل‌ها و فصل‌ها هر کدام دو جفت
  function pairPool(rnd) {
    var pool = [];
    for (var t = 0; t < 34; t++) { pool.push([t, t]); pool.push([t, t]); }
    pool.push([34, 35], [36, 37], [38, 39], [40, 41]);
    return shuffle(pool, rnd);
  }

  // پخش برعکس: از چیدمان پر، هر بار دو کاشی آزاد برداشته و یک جفت به آن‌ها داده می‌شود.
  // همین ترتیب برداشتن یک راه حل است، پس هر دستی حل‌شدنی است.
  function assign(pos, idx, pairs, rnd) {
    for (var tries = 0; tries < 60; tries++) {
      var alive = pos.map(function (_, i) { return idx.indexOf(i) >= 0; });
      var faces = {}, order = [], ok = true, k = 0;
      for (var left = idx.length; left > 0; left -= 2) {
        var free = [];
        for (var i = 0; i < pos.length; i++) if (alive[i] && freeIn(pos, alive, i)) free.push(i);
        if (free.length < 2) { ok = false; break; }
        var a = free.splice(Math.floor(rnd() * free.length), 1)[0];
        var b = free[Math.floor(rnd() * free.length)];
        var pr = pairs[k++];
        var flip = rnd() < 0.5;
        faces[a] = flip ? pr[1] : pr[0];
        faces[b] = flip ? pr[0] : pr[1];
        alive[a] = alive[b] = false;
        order.push([a, b]);
      }
      if (ok) return { faces: faces, order: order };
    }
    return null;
  }

  function deal(layout, rnd) {
    var pos = LAYOUTS[layout];
    var all = pos.map(function (_, i) { return i; });
    var pairs = pairPool(rnd).slice(0, pos.length / 2);
    var r = assign(pos, all, pairs, rnd);
    var faces = pos.map(function (_, i) { return r.faces[i]; });
    return { layout: layout, faces: faces, gone: pos.map(function () { return false; }),
      history: [], shuffles: 0, hints: 0, undos: 0, done: false, solution: r.order };
  }

  function alive(S) { return S.gone.map(function (g) { return !g; }); }
  function isFree(S, i) { return !S.gone[i] && freeIn(LAYOUTS[S.layout], alive(S), i); }
  function freeTiles(S) {
    var al = alive(S), pos = LAYOUTS[S.layout], out = [];
    for (var i = 0; i < pos.length; i++) if (al[i] && freeIn(pos, al, i)) out.push(i);
    return out;
  }
  function freePairs(S) {
    var f = freeTiles(S), out = [];
    for (var i = 0; i < f.length; i++) for (var j = i + 1; j < f.length; j++) {
      if (matches(S.faces[f[i]], S.faces[f[j]])) out.push([f[i], f[j]]);
    }
    return out;
  }
  function left(S) { return S.gone.filter(function (g) { return !g; }).length; }

  // The box around the tiles still on the table, in half-tile units (#167). The
  // page sizes tiles to this box, so they grow as pairs come off; sized to the
  // whole layout, the turtle's tiles stayed tiny on a phone until the end.
  function bounds(S) {
    var pos = LAYOUTS[S.layout], b = null;
    for (var i = 0; i < pos.length; i++) {
      if (S.gone[i]) continue;
      var p = pos[i];
      if (!b) b = { minX: p[0], maxX: p[0], minY: p[1], maxY: p[1], maxZ: p[2] };
      b.minX = Math.min(b.minX, p[0]); b.maxX = Math.max(b.maxX, p[0]);
      b.minY = Math.min(b.minY, p[1]); b.maxY = Math.max(b.maxY, p[1]);
      b.maxZ = Math.max(b.maxZ, p[2]);
    }
    return b || { minX: 0, maxX: 0, minY: 0, maxY: 0, maxZ: 0 };
  }

  function remove(S, i, j) {
    if (i === j || S.done || !isFree(S, i) || !isFree(S, j) || !matches(S.faces[i], S.faces[j])) return false;
    S.gone[i] = S.gone[j] = true;
    S.history.push({ pair: [i, j] });
    if (!left(S)) S.done = true;
    return true;
  }

  function undo(S) {
    var h = S.history.pop();
    if (!h) return false;
    if (h.pair) { S.gone[h.pair[0]] = S.gone[h.pair[1]] = false; S.done = false; }
    else if (h.faces) { S.faces = h.faces; S.shuffles--; }
    S.undos++;
    return true;
  }

  // بُر زدن کاشی‌های مانده، دوباره با پخش برعکس تا باز هم حل‌شدنی بماند
  function reshuffle(S, rnd) {
    var pos = LAYOUTS[S.layout], idx = [];
    for (var i = 0; i < pos.length; i++) if (!S.gone[i]) idx.push(i);
    if (idx.length < 2) return false;
    // نقش‌های مانده دوبه‌دو جفت می‌شوند: هم‌نقش‌ها با هم، گل‌ها با گل‌ها، فصل‌ها با فصل‌ها
    var rest = idx.map(function (i) { return S.faces[i]; }).sort(function (a, b) { return a - b; });
    var pairs = [], used = rest.map(function () { return false; });
    for (var a = 0; a < rest.length; a++) {
      if (used[a]) continue;
      for (var b = a + 1; b < rest.length; b++) {
        if (!used[b] && matches(rest[a], rest[b])) { used[a] = used[b] = true; pairs.push([rest[a], rest[b]]); break; }
      }
    }
    if (pairs.length * 2 !== idx.length) return false;
    var r = assign(pos, idx, shuffle(pairs, rnd), rnd);
    if (!r) return false;
    S.history.push({ faces: S.faces.slice() });
    idx.forEach(function (i) { S.faces[i] = r.faces[i]; });
    S.shuffles++;
    // ترتیب حل را برمی‌گرداند تا تست بتواند حل‌شدنی ماندن را واقعاً بازی کند
    return r.order;
  }

  var api = {
    LAYOUTS: LAYOUTS, matches: matches, deal: deal, isFree: isFree, freeTiles: freeTiles, freePairs: freePairs,
    left: left, remove: remove, undo: undo, reshuffle: reshuffle, freeIn: freeIn, bounds: bounds
  };
  if (typeof self !== 'undefined') self.MahjongEngine = api;
  return api;
}
if (typeof module !== 'undefined' && module.exports) module.exports = MahjongEngineFactory;
/* ==== ENGINE END ==== */
</script>

      DOTS[f].forEach(function (p, k) {
        var col = n === 1 ? '#C0392B' : (k % 3 === 0 ? '#1F6FB2' : (k % 3 === 1 ? '#2E8B57' : '#C0392B'));
        s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="2.2"/><circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + (r * 0.35) + '" fill="' + col + '"/>';
      });
    } else if (f < 18) {
      var m = f - 8;
      if (m === 1) {
        s += '<rect x="16" y="8" width="8" height="36" rx="4" fill="#2E8B57"/><rect x="16" y="24" width="8" height="3" fill="#FBF7EE"/><circle cx="20" cy="10" r="4" fill="#C0392B"/>';
      } else {
        DOTS[m - 1].forEach(function (p, k) {
          var col = (m === 5 || m === 7 || m === 9) && k === Math.floor(m / 2) ? '#C0392B' : '#2E8B57';
          s += '<rect x="' + (p[0] - 2.3) + '" y="' + (p[1] - 6) + '" width="4.6" height="12" rx="2.2" fill="' + col + '"/><rect x="' + (p[0] - 2.3) + '" y="' + (p[1] - 0.6) + '" width="4.6" height="1.2" fill="#FBF7EE"/>';
        });
      }
    } else if (f < 27) {
      s += txt(20, 22, 17, '#1F3A5F', NUM_ZH[f - 18]) + txt(20, 45, 18, '#C0392B', '萬');
    } else if (f < 31) {
      s += txt(20, 35, 24, '#1F3A5F', ['東', '南', '西', '北'][f - 27]);
    } else if (f === 31) {
      s += txt(20, 36, 26, '#C0392B', '中');
    } else if (f === 32) {
      s += txt(20, 36, 26, '#2E8B57', '發');
    } else if (f === 33) {
      s += '<rect x="8" y="10" width="24" height="32" rx="3" fill="none" stroke="#1F6FB2" stroke-width="3"/><rect x="13" y="15" width="14" height="22" rx="2" fill="none" stroke="#1F6FB2" stroke-width="1.5"/>';
    } else if (f < 38) {
      // گل: پنج گلبرگ صورتی با عدد
      for (var a = 0; a < 5; a++) {
        var ang = a * 72 * Math.PI / 180;
        s += '<circle cx="' + (20 + Math.cos(ang) * 7).toFixed(1) + '" cy="' + (22 + Math.sin(ang) * 7).toFixed(1) + '" r="5" fill="#E07AA0"/>';
      }
      s += '<circle cx="20" cy="22" r="3.5" fill="#F2C14E"/>' + txt(20, 46, 11, '#8A2D55', String(f - 33));
    } else {
      // فصل: خورشید نارنجی با عدد
      s += '<circle cx="20" cy="22" r="8" fill="#E8913A"/>';
      for (var q = 0; q < 8; q++) {
        var ag = q * 45 * Math.PI / 180;
        s += '<line x1="' + (20 + Math.cos(ag) * 11).toFixed(1) + '" y1="' + (22 + Math.sin(ag) * 11).toFixed(1) + '" x2="' + (20 + Math.cos(ag) * 15).toFixed(1) + '" y2="' + (22 + Math.sin(ag) * 15).toFixed(1) + '" stroke="#E8913A" stroke-width="2.4" stroke-linecap="round"/>';
      }
      s += txt(20, 47, 11, '#8A4A12', String(f - 37));
    }
    s += '</svg>';
    faceCache[f] = s;
    return s;
  }

  function faceName(f) {
    if (f < 9) return (f + 1) + ' ●';
    if (f < 18) return (f - 8) + ' |';
    if (f < 27) return NUM_ZH[f - 18] + '萬';
    if (f < 31) return ['東', '南', '西', '北'][f - 27];
    if (f < 34) return ['中', '發', '□'][f - 31];
    return f < 38 ? '✿ ' + (f - 33) : '☀ ' + (f - 37);
  }

  /* --------------------------------------------------------- ساخت */

  function newGame(layout, daily) {
    var rnd = daily ? C.daily('mahjong', daily).rng : Math.random;
    S = E.deal(layout, rnd);
    delete S.solution;
    Z = { z: 1, x: 0, y: 0 };
    S.daily = daily || null;
    S.startedAt = Date.now();
    sel = -1; hint = null; cur = -1;
    build();
    render();
    save();
  }

  function layoutSize() {
    var b = E.bounds(S);
    return { cols: (b.maxX - b.minX) / 2 + 1, rows: (b.maxY - b.minY) / 2 + 1, z: b.maxZ, ox: b.minX, oy: b.minY };
  }

  // Tiles as large as the screen allows (#167): the width is the page's, the
  // height is what is left under the top bar once the buttons and status below
  // the board are counted, instead of a fixed guess that wasted a third of a phone.
  function sizeBoard(L) {
    var avail = Math.min(wrap.clientWidth || 360, 980) - 8;
    depth = 4;
    for (var it = 0; it < 2; it++) {
      tw = Math.max(18, Math.min(72, Math.floor((avail - L.z * depth - 6) / L.cols)));
      depth = Math.max(3, Math.round(tw * 0.14));
    }
    th = Math.round(tw * 1.3);
    // The main area is vertically centred, so the board's own position moves with
    // its size; count the space from the main area instead: its height less the
    // padding, the rows around the board, the three gaps and the board's margin.
    var mainH = ctx.main.clientHeight || (window.innerHeight || 640) - 60;
    var around = top.offsetHeight + actions.offsetHeight + status.offsetHeight;
    var availH = Math.max(200, mainH - 24 - around - 3 * 12 - 12);
    if (L.rows * th + L.z * depth + 8 > availH) {
      th = Math.max(22, Math.floor((availH - L.z * depth - 8) / L.rows));
      tw = Math.round(th / 1.3);
      depth = Math.max(3, Math.round(tw * 0.14));
    }
    var bh = L.rows * th + L.z * depth + 8;
    board.style.width = view.style.width = (L.cols * tw + L.z * depth + 6) + 'px';
    board.style.height = bh + 'px';
    // The view takes all the height there is, so zooming in shows more than the
    // strip the whole board needs; at 1x the board sits centred in it
    view.style.height = Math.max(bh, Math.min(availH, bh * 3)) + 'px';
  }

  /* ------------------------------------------------- zoom and pan */
  // A phone fits the turtle's fifteen columns only at about 20px a tile, too small
  // to tell tiles apart (#167). Pinch zooms around the fingers, one finger pans,
  // Ctrl+wheel zooms on a desktop, and "Fit board" returns to the whole board.
  var Z = { z: 1, x: 0, y: 0 }, fitBtn = null;
  function applyZoom() {
    var W = view.clientWidth, H = view.clientHeight;
    Z.z = Math.min(3, Math.max(1, Z.z));
    var bw = board.offsetWidth * Z.z, bh = board.offsetHeight * Z.z;
    // an axis the board doesn't fill is centred; one it overfills can't show empty space
    Z.x = bw <= W ? (W - bw) / 2 : Math.min(0, Math.max(W - bw, Z.x));
    Z.y = bh <= H ? (H - bh) / 2 : Math.min(0, Math.max(H - bh, Z.y));
    board.style.transform = 'translate(' + Z.x + 'px,' + Z.y + 'px) scale(' + Z.z + ')';
    // the button keeps its place when hidden, so the row never reflows mid-gesture
    if (fitBtn) fitBtn.style.visibility = Z.z <= 1.01 ? 'hidden' : 'visible';
  }
  function zoomAt(px, py, nz) {
    nz = Math.min(3, Math.max(1, nz));
    Z.x = px - (px - Z.x) * (nz / Z.z);
    Z.y = py - (py - Z.y) * (nz / Z.z);
    Z.z = nz;
    applyZoom();
  }
  function fitBoard() { Z = { z: 1, x: 0, y: 0 }; applyZoom(); }
  // keeps a tile on screen when it is reached from the keyboard while zoomed in
  function showTile(i) {
    if (Z.z <= 1 || !nodes[i]) return;
    var l = parseFloat(nodes[i].style.left) * Z.z + Z.x, t = parseFloat(nodes[i].style.top) * Z.z + Z.y;
    var W = view.clientWidth, H = view.clientHeight, w = tw * Z.z, hh = th * Z.z;
    if (l < 0 || l + w > W) Z.x -= l - (W - w) / 2;
    if (t < 0 || t + hh > H) Z.y -= t - (H - hh) / 2;
    applyZoom();
  }
  var touches = {}, gesture = null, moved = false, eatClick = false;
  function pts() { return Object.keys(touches).map(function (k) { return touches[k]; }); }
  function rel(p) { var r = view.getBoundingClientRect(); return { x: p.x - r.left, y: p.y - r.top }; }
  view.addEventListener('pointerdown', function (e) {
    touches[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ps = pts();
    if (ps.length === 1) { moved = false; gesture = { last: ps[0], start: ps[0] }; }
    if (ps.length === 2) {
      var m = rel({ x: (ps[0].x + ps[1].x) / 2, y: (ps[0].y + ps[1].y) / 2 });
      gesture = { pinch: true, d: Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y) || 1, z: Z.z, m: m };
      moved = true;
    }
  });
  window.addEventListener('pointermove', function (e) {
    if (!touches[e.pointerId] || !gesture) return;
    touches[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ps = pts();
    if (gesture.pinch && ps.length >= 2) {
      var m = rel({ x: (ps[0].x + ps[1].x) / 2, y: (ps[0].y + ps[1].y) / 2 });
      Z.x += m.x - gesture.m.x; Z.y += m.y - gesture.m.y; gesture.m = m;
      zoomAt(m.x, m.y, gesture.z * Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y) / gesture.d);
    } else if (!gesture.pinch && ps.length === 1) {
      var p = ps[0];
      if (Math.hypot(p.x - gesture.start.x, p.y - gesture.start.y) > 8) moved = true;
      if (moved && Z.z > 1) { Z.x += p.x - gesture.last.x; Z.y += p.y - gesture.last.y; applyZoom(); }
      gesture.last = p;
    }
  });
  function endTouch(e) {
    if (!touches[e.pointerId]) return;
    delete touches[e.pointerId];
    if (!pts().length) {
      // a drag or pinch must not also pick the tile it ended on
      if (moved) { eatClick = true; setTimeout(function () { eatClick = false; }, 350); }
      gesture = null;
    } else if (gesture && gesture.pinch) {
      gesture = { last: pts()[0], start: pts()[0] };
    }
  }
  window.addEventListener('pointerup', endTouch);
  window.addEventListener('pointercancel', endTouch);
  view.addEventListener('click', function (e) {
    if (eatClick) { e.stopPropagation(); e.preventDefault(); eatClick = false; }
  }, true);
  view.addEventListener('wheel', function (e) {
    if (!e.ctrlKey) return;
    e.preventDefault();
    var p = rel({ x: e.clientX, y: e.clientY });
    zoomAt(p.x, p.y, Z.z * Math.exp(-e.deltaY * 0.0025));
  }, { passive: false });

  // Sizes and positions every tile from the current bounds; runs after every change
  function place() {
    var L = layoutSize(), pos = E.LAYOUTS[S.layout];
    sizeBoard(L);
    nodes.forEach(function (b, i) {
      var p = pos[i];
      b.style.width = (tw - 2) + 'px';
      b.style.height = (th - 2) + 'px';
      // higher layers sit a little up and left so their height shows
      b.style.left = ((p[0] - L.ox) / 2 * tw + Math.max(0, L.z - p[2]) * depth) + 'px';
      b.style.top = ((p[1] - L.oy) / 2 * th + Math.max(0, L.z - p[2]) * depth) + 'px';
    });
    applyZoom();
  }

  function build() {
    board.innerHTML = '';
    nodes = [];
    var pos = E.LAYOUTS[S.layout];
    pos.forEach(function (p, i) {
      var b = el('button', { class: 'mj-tile', type: 'button' });
      // higher layer on top, and within a layer the right and lower tile later, so shadows fall right
      b.style.zIndex = String(p[2] * 1000 + p[1] * 10 + p[0]);
      // each layer a little lighter than the one below
      b.style.background = LAYER_FACE[Math.min(p[2], LAYER_FACE.length - 1)];
      b.addEventListener('click', function () { tap(i); });
      board.appendChild(b);
      nodes.push(b);
    });
    place();
  }

  function render() {
    top.innerHTML = '';
    if (S.daily) {
      top.appendChild(el('span', { class: 'ch-badge ch-badge--accent' },
        [C.icon('calendar', 14), el('span', { text: C.t('dailyMj') + ' — ' + C.num(S.daily) })]));
    } else {
      top.appendChild(C.ui.segmented([
        { value: 'small', label: C.t('small') }, { value: 'medium', label: C.t('medium') }, { value: 'turtle', label: C.t('turtle') }
      ], S.layout, function (v) {
        if (v === S.layout) return;
        var go = function () { prefs.layout = v; ctx.store.set('prefs', prefs); newGame(v); };
        if (S.history.length && !S.done) {
          C.ui.confirm({ title: C.t('newDeal'), body: C.t('resetWarn'), onOk: go, onCancel: function () { render(); } });
          render();
          return;
        }
        go();
      }));
    }
    actions.innerHTML = '';
    var hb = el('button', { class: 'ch-btn ch-btn--soft', type: 'button' }, [C.icon('bulb', 18), el('span', { text: C.t('hintKey') })]);
    hb.addEventListener('click', showHint);
    var sb = el('button', { class: 'ch-btn ch-btn--soft', type: 'button' }, [C.icon('refresh', 18),
      // نقطه‌ی جداکننده در فارسی شبیه صفر است و «۳ ·» خوانده می‌شد «۳۰»
      el('span', { text: C.t('shuffle') + ' (' + C.num(MAX_SHUFFLES - S.shuffles) + ')' })]);
    sb.disabled = S.shuffles >= MAX_SHUFFLES || S.done;
    sb.addEventListener('click', doShuffle);
    actions.appendChild(hb);
    actions.appendChild(sb);
    // icon only: three labelled buttons don't fit one row on a 390px phone
    fitBtn = el('button', { class: 'ch-btn ch-btn--soft', type: 'button', 'aria-label': C.t('fit'), title: C.t('fit') }, [C.icon('expand', 18)]);
    fitBtn.addEventListener('click', fitBoard);
    fitBtn.style.visibility = Z.z <= 1.01 ? 'hidden' : 'visible';
    actions.appendChild(fitBtn);
    paint();
  }

  function paint() {
    place();
    var free = {};
    E.freeTiles(S).forEach(function (i) { free[i] = 1; });
    nodes.forEach(function (b, i) {
      if (S.gone[i]) { b.style.display = 'none'; b.className = 'mj-tile'; return; }
      b.style.display = '';
      var f = S.faces[i];
      if (b.getAttribute('data-f') !== String(f)) { b.innerHTML = faceSvg(f); b.setAttribute('data-f', String(f)); }
      b.className = 'mj-tile' + (i === sel ? ' mj-tile--sel' : '') + (hint && hint.indexOf(i) >= 0 ? ' mj-tile--hint' : '') +
        (i === cur ? ' mj-tile--cur' : '') + (free[i] ? '' : ' mj-tile--blocked');
      b.setAttribute('aria-label', C.t('tile') + ' ' + faceName(f) + (free[i] ? '' : ' · ' + C.t('blocked')));
    });
    var pairs = E.freePairs(S).length;
    ctx.setStat('left', E.left(S));
    ctx.setStat('pairs', pairs);
    var msg = '';
    if (!S.done && !pairs) msg = C.t('noPairs');
    else if (S.layout === 'turtle' && window.innerWidth < 600) msg = C.t('turtleNote');
    status.textContent = msg;
  }

  /* --------------------------------------------------------- حرکت */

  function tap(i) {
    if (!S || S.done || S.gone[i]) return;
    if (!E.isFree(S, i)) { C.feedback('bad'); C.ui.shake(nodes[i]); return; }
    // راهنما تا برداشتن همان جفت روشن می‌ماند؛ قبلاً با زدن کاشی اول خاموش می‌شد
    // و بازیکن باید جای کاشی دوم را از حفظ می‌دانست
    if (hint && hint.indexOf(i) < 0) hint = null;
    if (sel < 0 || sel === i) { sel = sel === i ? -1 : i; C.feedback(sel < 0 ? 'tap' : 'select'); paint(); return; }
    if (E.matches(S.faces[sel], S.faces[i])) {
      E.remove(S, sel, i);
      sel = -1; hint = null;
      C.feedback('place');
      save();
      paint();
      if (S.done) { finish(); return; }
      if (!E.freePairs(S).length) stuck();
      return;
    }
    // کاشی دوم جور نبود: انتخاب به همین کاشی می‌رود
    sel = i;
    C.feedback('tap');
    paint();
  }

  function stuck() {
    var acts = [{ label: C.t('undoMove'), onClick: function () { undo(); } }];
    if (S.shuffles < MAX_SHUFFLES) acts.push({ label: C.t('shuffle'), kind: 'primary', onClick: doShuffle });
    else acts.push({ label: C.t('newDeal'), kind: 'primary', onClick: function () { newGame(S.layout, S.daily); } });
    C.ui.modal({ title: C.t('noPairs'), body: [el('p', { class: 'ch-dim', text: C.t('noPairsSub') })], actions: acts });
  }

  function showHint() {
    if (!S || S.done) return;
    var ps = E.freePairs(S);
    if (!ps.length) { stuck(); return; }
    hint = ps[0];
    S.hints++;
    C.feedback('select');
    save();
    paint();
  }

  function doShuffle() {
    if (!S || S.done || S.shuffles >= MAX_SHUFFLES) { C.feedback('bad'); return; }
    var rnd = S.daily ? C.daily('mahjong', S.daily + '|s' + S.shuffles).rng : Math.random;
    if (!E.reshuffle(S, rnd)) { C.feedback('bad'); return; }
    sel = -1; hint = null;
    C.audio.sfx('chain');
    save();
    render();
  }

  function undo() {
    if (!S || S.done) return;
    if (!E.undo(S)) { C.feedback('bad'); return; }
    sel = -1; hint = null;
    C.feedback('tap');
    save();
    render();
  }

  function finish() {
    var elapsed = Date.now() - S.startedAt;
    var base = { small: 8, medium: 14, turtle: 22 }[S.layout] || 10;
    var clean = !S.hints && !S.undos && !S.shuffles;
    var coins = base + (clean ? 4 : 0) + (S.daily ? 8 : 0);
    var points = base * 4 + (S.daily ? 25 : 0);
    C.achievements.unlock('mj-win');
    if (S.layout === 'turtle') C.achievements.unlock('mj-turtle');
    if (clean) C.achievements.unlock('mj-clean');
    C.stats.best('mahjong', 'time-' + S.layout, elapsed, true);
    if (S.daily) {
      var first = C.stats.daily('mahjong', S.daily, { label: C.time(elapsed), ms: elapsed });
      if (!first) { coins = Math.round(coins * 0.2); points = Math.round(points * 0.2); }
    }
    ctx.clearSave();
    ctx.finish({
      won: true, timeMs: elapsed, coins: coins, points: points,
      lines: [
        { label: C.t('time'), value: C.time(elapsed) },
        { label: C.t('hints'), value: C.num(S.hints) },
        { label: C.t('shuffle'), value: C.num(S.shuffles) }
      ],
      shareText: 'چوگان · ماهجونگ' + (S.daily ? ('\nروزانه ' + S.daily) : '') + '\n' + C.time(elapsed),
      onAgain: S.daily ? null : function () { newGame(S.layout); }
    });
  }

  /* --------------------------------------------------------- ذخیره */

  ctx.autosave(function () {
    if (!S || S.done || !S.history.length) return { inProgress: false };
    var copy = JSON.parse(JSON.stringify(S));
    copy.elapsed = Date.now() - S.startedAt;
    return { s: copy, prefs: prefs };
  });
  function save() { ctx.save(); }

  function askNew() {
    var go = function () { newGame(S ? S.layout : prefs.layout, S ? S.daily : null); };
    if (!S || S.done || !S.history.length) { go(); return; }
    C.ui.confirm({ title: C.t('newDeal'), body: C.t('resetWarn'), onOk: go });
  }

  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('rules') }),
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [
          kb('← →', C.t('move')),
          kb('Space / Enter', C.t('select')),
          kb('H', C.t('hintKey')),
          kb('S', C.t('shuffle')),
          kb('U / Ctrl+Z', C.t('undoMove'))
        ])
      ],
      actions: [
        { label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } },
        { label: C.t('done'), kind: 'primary' }
      ]
    });
  }
  function kb(k, what) {
    return el('div', { class: 'ch-item' }, [
      el('div', { class: 'ch-item__label', text: what }),
      el('span', { class: 'ch-badge', text: k })
    ]);
  }

  function artTile(x, y, f, ring) {
    return '<g transform="translate(' + x + ' ' + y + ')"><rect x="2" y="2" width="40" height="52" rx="5" fill="#D9CDB4"/>' +
      '<rect width="40" height="52" rx="5" fill="#FBF7EE" stroke="' + (ring ? 'var(--game)' : '#B9AB8E') + '" stroke-width="' + (ring ? 3 : 1) + '"/>' +
      faceSvg(f).replace('<svg ', '<svg width="40" height="52" ') + '</g>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'),
      art: '<svg viewBox="0 0 200 110" width="100%">' + artTile(20, 30, 4, true) + artTile(62, 30, 12, false) + artTile(104, 30, 31, false) + artTile(146, 30, 4, true) + '</svg>' },
    { title: C.t('tutTitle2'), text: C.t('tutText2'),
      art: '<svg viewBox="0 0 200 110" width="100%">' + artTile(10, 30, 34, true) + artTile(56, 30, 36, true) + artTile(104, 30, 38, true) + artTile(150, 30, 41, true) + '</svg>' },
    { title: C.t('tutTitle3'), text: C.t('tutText3'),
      art: '<svg viewBox="0 0 200 110" width="100%">' + artTile(56, 34, 27, false) + artTile(70, 26, 20, false) + artTile(104, 30, 33, true) + '</svg>' }
  ];

  /* --------------------------------------------------------- ورودی */

  window.addEventListener('keydown', function (e) {
    if (!S || S.done) return;
    if (document.querySelector('.ch-scrim')) return;
    var tg = e.target, tag = tg && tg.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (tg && tg.isContentEditable)) return;
    if (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
    var k = e.key;
    if (C.undoKey(e)) { undo(); e.preventDefault(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (k === 'h' || k === 'H' || e.code === 'KeyH') { showHint(); e.preventDefault(); return; }
    if (k === 's' || k === 'S' || e.code === 'KeyS') { doShuffle(); e.preventDefault(); return; }
    if (k === 'ArrowLeft' || k === 'ArrowRight') {
      var pos = E.LAYOUTS[S.layout];
      var free = E.freeTiles(S).sort(function (a, b) { return pos[a][0] - pos[b][0] || pos[a][1] - pos[b][1] || pos[b][2] - pos[a][2]; });
      if (!free.length) return;
      var at = free.indexOf(cur);
      at = at < 0 ? 0 : (at + (k === 'ArrowRight' ? 1 : free.length - 1)) % free.length;
      cur = free[at];
      showTile(cur);
      paint(); e.preventDefault(); return;
    }
    if ((k === ' ' || k === 'Enter') && cur >= 0) {
      tap(cur);
      if (S.gone[cur]) cur = -1;
      e.preventDefault();
    }
  });

  var resizeT = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(function () { if (S) { build(); paint(); } }, 120);
  });

  /* ---------------------------------------------------------- شروع */

  function restore(v) {
    S = v;
    S.startedAt = Date.now() - (v.elapsed || 0);
    sel = -1; hint = null; cur = -1;
    build();
    render();
  }

  var saved = ctx.loadSave();
  // هسته برای هر روز خانه‌ی ذخیره‌ی جدا دارد؛ روزانه‌ی نیمه‌کاره هم ادامه می‌یابد
  var resume = saved && saved.s && saved.s.faces && saved.s.history && saved.s.history.length && !saved.s.done &&
    (saved.s.daily || null) === (dailyDate || null) && E.LAYOUTS[saved.s.layout];
  if (resume) {
    if (saved.prefs && !dailyDate) prefs = saved.prefs;
    restore(saved.s);
  } else if (dailyDate) {
    newGame('medium', dailyDate);
    if (C.stats.dailyDone('mahjong', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).mahjong;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec.label });
    }
    ctx.tutorialIfNew(TUT);
  } else {
    newGame(prefs.layout || 'small');
    ctx.tutorialIfNew(TUT);
  }
})();
</script>
