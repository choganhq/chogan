<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Chogan — report a problem or idea</title>
<style>
  body { font: 18px/1.7 system-ui, sans-serif; text-align: center; margin: 0; padding: 48px 20px; }
</style>
<script>
  // While the report form was down (#1173) playchogan.com/report/ redirected here with a
  // permanent 301, which browsers keep (#1188). The extra parameter makes an address the
  // browser has no cached redirect for; without it the two pages would bounce forever.
  location.replace('https://playchogan.com/report/?from=app' + (location.search ? '&' + location.search.slice(1) : ''));
</script>
</head>
<body>
<p><a href="https://playchogan.com/report/?from=app">Report a problem or idea</a></p>
<p dir="rtl" lang="fa"><a href="https://playchogan.com/report/?from=app">گزارش مشکل یا پیشنهاد</a></p>
</body>
</html>
